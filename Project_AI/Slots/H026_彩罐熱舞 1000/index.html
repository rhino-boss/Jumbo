<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>H026 Demogame Offline</title>
  <style>
    :root {
      --bg-a: #130723;
      --bg-b: #28115f;
      --bg-c: #0d295f;
      --fg-bg-a: #102518;
      --fg-bg-b: #176342;
      --fg-bg-c: #0d4d69;
      --panel: rgba(23, 17, 74, 0.84);
      --cyan: #73efff;
      --pink: #ff6fd9;
      --gold: #ffd86a;
      --orange: #ff9f43;
      --white: #fff8fe;
      --shadow: 0 0 28px rgba(131, 103, 255, 0.28);
      --slot-shadow: 0 18px 36px rgba(7, 8, 34, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--white);
      font-family: "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(123, 232, 255, 0.2), transparent 20%),
        radial-gradient(circle at 82% 10%, rgba(255, 103, 218, 0.2), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(77, 169, 255, 0.24), transparent 30%),
        linear-gradient(180deg, var(--bg-a), var(--bg-b) 48%, var(--bg-c));
      transition: background 220ms ease;
    }

    body.fg-mode {
      background:
        radial-gradient(circle at 18% 12%, rgba(129, 255, 192, 0.24), transparent 20%),
        radial-gradient(circle at 82% 10%, rgba(96, 255, 216, 0.22), transparent 22%),
        radial-gradient(circle at 50% 100%, rgba(89, 255, 203, 0.24), transparent 30%),
        linear-gradient(180deg, var(--fg-bg-a), var(--fg-bg-b) 48%, var(--fg-bg-c));
    }

    .phone {
      width: min(430px, 100vw);
      min-height: 100vh;
      padding: 14px 14px 28px;
    }

    .section {
      margin-bottom: 12px;
    }

    .card,
    .board-shell,
    .buy-button,
    .control,
    .spin-button {
      box-shadow: var(--shadow);
    }

    .card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)), var(--panel);
      border: 1px solid rgba(147, 212, 255, 0.22);
      border-radius: 22px;
    }

    .title-card {
      text-align: center;
      padding: 12px 16px;
      background:
        linear-gradient(180deg, rgba(255, 117, 220, 0.36), rgba(116, 62, 255, 0.3)),
        rgba(32, 18, 97, 0.9);
      border: 2px solid rgba(255, 121, 231, 0.62);
    }

    .title-id {
      font-size: 0.82rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #ffd4fd;
      font-weight: 900;
    }

    .title-name {
      margin-top: 4px;
      font-size: 1.72rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #fff0b0;
      text-shadow: 0 0 18px rgba(255, 196, 89, 0.5);
    }

    .title-sub {
      margin-top: 4px;
      font-size: 0.94rem;
      font-weight: 800;
      color: #dff4ff;
    }

    .feature-pill.hidden {
      display: none;
    }

    .feature-card {
      padding: 12px 14px;
      background:
        linear-gradient(180deg, rgba(189, 79, 255, 0.34), rgba(56, 28, 128, 0.92)),
        rgba(40, 20, 117, 0.94);
      border: 2px solid rgba(255, 106, 221, 0.58);
      transition: background 220ms ease, border-color 220ms ease;
    }

    body.fg-mode .feature-card {
      background:
        linear-gradient(180deg, rgba(106, 255, 186, 0.28), rgba(20, 103, 84, 0.92)),
        rgba(14, 80, 74, 0.94);
      border-color: rgba(130, 255, 204, 0.56);
    }

    .feature-top,
    .feature-bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .feature-top {
      margin-bottom: 10px;
    }

    .feature-mode {
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: #ffe6ff;
    }

    .feature-status {
      text-align: right;
      font-size: 0.82rem;
      font-weight: 800;
      color: #a9ffe1;
    }

    .feature-pill-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .player-grid,
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .feature-pill,
    .player-card,
    .stat-card,
    .detail-card {
      padding: 10px 11px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(54, 90, 190, 0.64), rgba(20, 35, 96, 0.92));
      border: 1px solid rgba(126, 220, 255, 0.24);
    }

    .feature-pill .k,
    .player-card .k,
    .stat-card .k,
    .detail-title {
      display: block;
      font-size: 0.68rem;
      text-transform: uppercase;
      color: #c0f6ff;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .feature-pill .v,
    .player-card .v,
    .stat-card .v {
      font-size: 1rem;
      font-weight: 900;
      color: #fff2ba;
      word-break: break-word;
    }

    .board-shell {
      padding: 10px;
      border-radius: 28px;
      border: 3px solid rgba(186, 122, 255, 0.54);
      background:
        linear-gradient(180deg, rgba(120, 76, 246, 0.3), rgba(41, 20, 105, 0.94)),
        rgba(23, 12, 72, 0.96);
      transition: background 220ms ease, border-color 220ms ease;
    }

    body.fg-mode .board-shell {
      border-color: rgba(117, 255, 188, 0.56);
      background:
        linear-gradient(180deg, rgba(70, 255, 175, 0.2), rgba(17, 82, 74, 0.94)),
        rgba(13, 67, 66, 0.96);
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .cell {
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(168, 239, 255, 0.26), rgba(77, 120, 255, 0.14)),
        linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.08));
      border: 2px solid rgba(149, 232, 255, 0.36);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.08), var(--slot-shadow);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, filter 180ms ease;
    }

    .cell.gold {
      border-color: rgba(255, 217, 92, 0.9);
      background:
        linear-gradient(180deg, rgba(255, 220, 111, 0.26), rgba(255, 143, 80, 0.14)),
        linear-gradient(180deg, rgba(168, 239, 255, 0.2), rgba(77, 120, 255, 0.14));
    }

    .cell.special-gold {
      border-color: rgba(255, 124, 228, 0.98);
      background:
        linear-gradient(180deg, rgba(255, 129, 230, 0.34), rgba(255, 78, 166, 0.18)),
        linear-gradient(180deg, rgba(255, 220, 111, 0.22), rgba(255, 143, 80, 0.12));
      box-shadow: 0 0 24px rgba(255, 111, 217, 0.44), inset 0 0 18px rgba(255, 255, 255, 0.1), var(--slot-shadow);
    }

    .cell.special-gold .frame-bg,
    .cell.special-gold .frame-top {
      filter: hue-rotate(310deg) saturate(1.7) brightness(1.08);
    }

    .cell.hit {
      border-color: rgba(255, 233, 116, 0.96);
      box-shadow: 0 0 18px rgba(255, 210, 100, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.16);
      transform: scale(1.04);
      filter: brightness(1.08);
    }

    .cell.convert {
      border-color: rgba(126, 255, 199, 0.96);
      box-shadow: 0 0 20px rgba(107, 255, 192, 0.48);
    }

    .cell.reel-spin {
      animation: reelSpin 180ms linear infinite;
    }

    .cell.peek-row {
      aspect-ratio: 2 / 1;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    @keyframes reelSpin {
      0% {
        transform: translateY(-12px);
      }

      100% {
        transform: translateY(12px);
      }
    }

    .symbol-wrap {
      position: absolute;
      inset: 3%;
    }

    .cell.peek-row .symbol-wrap {
      top: -91%;
      right: 3%;
      bottom: 3%;
      left: 3%;
    }

    .symbol-img,
    .frame-bg,
    .frame-top {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .symbol-img {
      transform: scale(1.08);
      transform-origin: center;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.24));
      z-index: 1;
    }

    .frame-bg {
      inset: -6%;
      width: 112%;
      height: 112%;
      z-index: 0;
    }

    .frame-top {
      inset: -6%;
      width: 112%;
      height: 112%;
      z-index: 2;
    }

    .symbol-code,
    .multi-badge,
    .scatter-badge {
      position: absolute;
      z-index: 3;
      font-weight: 900;
      border-radius: 999px;
    }

    .symbol-code {
      left: 6px;
      top: 6px;
      padding: 2px 7px;
      background: rgba(14, 12, 50, 0.78);
      border: 1px solid rgba(200, 242, 255, 0.24);
      color: #f8fbff;
      font-size: 0.7rem;
    }

    .multi-badge {
      right: 6px;
      bottom: 6px;
      top: auto;
      right: 6px;
      min-width: 34px;
      padding: 2px 6px;
      text-align: center;
      font-size: 0.72rem;
      color: #5a3000;
      background: linear-gradient(180deg, var(--gold), var(--orange));
      box-shadow: 0 0 12px rgba(255, 208, 90, 0.46);
    }

    .scatter-badge {
      top: 6px;
      left: 6px;
      padding: 2px 7px;
      font-size: 0.62rem;
      color: #3f0061;
      background: linear-gradient(180deg, #fff4ab, #ff9ef0);
    }

    .cell.peek-row .symbol-code,
    .cell.peek-row .scatter-badge {
      display: none;
    }

    .cell.peek-row .multi-badge {
      right: 4px;
      bottom: 4px;
      min-width: 30px;
      padding: 1px 5px;
      font-size: 0.64rem;
    }

    .buy-button {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, #ff7ae2, #cf46b4);
      color: white;
      font-size: 1.34rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }

    .controls {
      display: grid;
      grid-template-columns: 64px 64px 1fr 64px 64px;
      align-items: end;
      gap: 8px;
    }

    .reset-row {
      display: flex;
      justify-content: center;
    }

    .control,
    .spin-button {
      border: 0;
      cursor: pointer;
      color: #ffe1ff;
      font-weight: 900;
      text-transform: uppercase;
      text-align: center;
    }

    .control {
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(131, 62, 210, 0.88), rgba(63, 26, 126, 0.96));
      font-size: 0.76rem;
    }

    .control.is-active {
      color: #143d13;
      background: linear-gradient(180deg, #baff87, #6ef08e);
      box-shadow: 0 0 24px rgba(122, 255, 147, 0.36);
    }

    .control.disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .spin-button {
      justify-self: center;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      color: #fff9ef;
      font-size: 1.14rem;
      background: radial-gradient(circle at 32% 30%, #ffe58b, #ffb33f 38%, #ff5dcc 84%);
      box-shadow: 0 0 28px rgba(255, 188, 88, 0.48), inset 0 0 24px rgba(255, 255, 255, 0.18);
    }

    .detail-stack {
      display: grid;
      gap: 10px;
    }

    .detail-card {
      background: linear-gradient(180deg, rgba(87, 194, 255, 0.22), rgba(33, 68, 176, 0.24));
    }

    .line-list,
    .rng-list,
    .spin-result-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .line-row,
    .rng-row,
    .spin-result-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(12, 13, 56, 0.48);
      border: 1px solid rgba(177, 204, 255, 0.12);
      font-size: 0.84rem;
      font-weight: 800;
    }

    .spin-result-row {
      display: block;
    }

    .spin-result-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      color: #fff0b4;
    }

    .spin-result-board {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.74rem;
      line-height: 1.45;
      color: #dff6ff;
    }

    .message-bar {
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(14, 12, 52, 0.5);
      color: #dff4ff;
      font-size: 0.82rem;
      font-weight: 800;
      text-align: center;
    }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      color: #d7ccff;
      font-size: 0.8rem;
    }
  </style>
  <style id="h902-theme">
    :root {
      --bg: #040e1a;
      --panel: #071528;
      --surface: #0c2240;
      --surface-2: #103052;
      --text: #b0d4f0;
      --sub: #5a88aa;
      --accent: #00ddc0;
      --red: #ff5f8a;
      --green: #33ff99;
      --blue: #33bbff;
      --mauve: #b06aff;
      --cell-size: 78px;
    }

    * {
      box-sizing: border-box;
    }

    body,
    body.fg-mode {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }

    body.fg-mode {
      background: #020d16;
    }

    .phone {
      width: 100%;
      max-width: 920px;
      min-height: auto;
      padding: 0;
    }

    .section {
      margin: 0;
    }

    #feature-bar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--panel);
    }

    #game-title {
      margin-right: 4px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #game-title #gameName {
      color: var(--text);
    }

    #modeText {
      color: var(--sub);
      font-size: 12px;
    }

    #featureStatus {
      display: none;
    }

    #strip-bar {
      width: 100%;
      height: 52px;
      margin-top: 10px;
      overflow: hidden;
      border: 1px solid var(--surface);
      border-radius: 8px;
      background: var(--panel);
    }

    .feature-strip {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 16px;
    }

    .feature-pill-group {
      display: contents;
    }

    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 12px;
      border: 0;
      border-radius: 20px;
      background: var(--surface);
    }

    .feature-pill .k,
    .feature-pill .v {
      display: inline;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      text-transform: none;
    }

    .feature-pill .k {
      color: var(--sub);
    }

    .feature-pill .v {
      color: var(--text);
    }

    #multPill .v {
      color: var(--blue);
    }

    #cascadePill .v {
      color: var(--red);
    }

    #fgLeftPill .v {
      color: var(--accent);
    }

    .config-control {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--sub);
      font-size: 12px;
    }

    .config-control select {
      min-width: 76px;
      padding: 5px 22px 5px 7px;
      border: 1px solid var(--surface-2);
      border-radius: 6px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
      font-weight: 700;
    }

    #app-shell {
      width: 100%;
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 12px;
      margin-top: 10px;
      align-items: start;
    }

    #grid-panel,
    .info-box,
    #credit-bar,
    #simulation-stats,
    #rng-wrap,
    #controls,
    #live-log-wrap,
    #log-wrap,
    #settings-wrap {
      background: var(--panel);
      border-radius: 10px;
    }

    #grid-panel {
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .board-shell {
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    body.fg-mode .board-shell {
      border: 0;
      background: transparent;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, var(--cell-size));
      gap: 4px;
      justify-content: center;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      aspect-ratio: auto;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #060d1a;
      box-shadow: none;
      overflow: hidden;
    }

    .cell.peek-row {
      width: var(--cell-size);
      height: 36px;
      aspect-ratio: auto;
      border-radius: 8px;
    }

    .cell.gold {
      border-color: rgba(255, 217, 92, 0.75);
      background: #101827;
    }

    .cell.special-gold {
      border-color: rgba(255, 95, 138, 0.88);
      background: #15152a;
      box-shadow: 0 0 12px rgba(255, 95, 138, 0.28);
    }

    .cell.hit {
      border-color: var(--accent);
      box-shadow: 0 0 14px rgba(0, 221, 192, 0.45);
      transform: scale(1.03);
      filter: brightness(1.12);
    }

    .cell.convert {
      border-color: var(--green);
      box-shadow: 0 0 12px rgba(51, 255, 153, 0.4);
    }

    .symbol-code {
      left: 4px;
      top: 4px;
      padding: 1px 5px;
      border: 0;
      border-radius: 4px;
      color: var(--text);
      background: rgba(4, 14, 26, 0.8);
      font-size: 10px;
    }

    .multi-badge {
      right: 4px;
      bottom: 4px;
      min-width: 28px;
      padding: 2px 5px;
      border-radius: 4px;
      color: #021710;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(0, 221, 192, 0.4);
      font-size: 11px;
    }

    .message-bar {
      width: 100%;
      min-height: 30px;
      margin: 0;
      padding: 6px 10px;
      border-radius: 6px;
      color: var(--sub);
      background: var(--surface);
      font-family: Consolas, monospace;
      font-size: 12px;
      font-weight: 400;
    }

    #right-panel {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #credit-bar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
    }

    .credit-cell {
      min-width: 0;
      padding: 12px 10px;
      border-right: 1px solid var(--surface);
      text-align: center;
    }

    .credit-cell:last-child {
      border-right: 0;
    }

    .credit-cell .i-label {
      display: block;
      margin-bottom: 3px;
      font-size: 11px;
    }

    .credit-cell .i-value {
      display: block;
      min-width: 0;
      color: var(--text);
      font-size: 16px;
      text-align: center;
    }

    .credit-cell .i-value.hi {
      color: var(--accent);
    }

    #simulation-stats {
      padding: 10px 14px;
    }

    #simulation-stats h3,
    #rng-wrap h3 {
      margin: 0 0 7px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .simulation-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--surface);
    }

    .simulation-row:last-child {
      border-bottom: 0;
    }

    .simulation-row .s-label {
      color: var(--sub);
      font-size: 12px;
    }

    .simulation-row .s-value {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .simulation-row .s-value.hi {
      color: var(--accent);
    }

    .info-box {
      padding: 10px 14px;
    }

    .info-box h3,
    .detail-title {
      margin: 0 0 8px;
      color: var(--sub);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--surface);
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .i-label {
      flex: 1;
      color: var(--sub);
      font-size: 13px;
    }

    .i-value {
      min-width: 80px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      text-align: right;
    }

    .i-value.hi {
      color: var(--accent);
    }

    .line-list,
    .rng-list,
    .spin-result-list {
      display: block;
      margin: 0;
    }

    .line-row,
    .rng-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 3px;
      padding: 3px 6px;
      border: 0;
      border-radius: 4px;
      color: var(--text);
      background: var(--surface);
      font-size: 12px;
      font-weight: 400;
    }

    #controls {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(302px, 1fr);
      align-items: stretch;
      gap: 10px;
      margin-top: 10px;
      padding: 10px;

    .control-zone {
      min-width: 0;

      flex-direction: column;
      gap: 6px;
      padding: 7px 8px;

      font-weight: 700;

    }

      align-items: center;
      gap: 6px;

    }

    .bet-stepper {

      display: grid;

    #controls #betMinusBtn,

      padding-inline: 0;

    }

    #controls #betBtn {

      color: var(--text);
    }

    .bet-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      z-index: 30;
      width: 218px;
      max-height: 218px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      overflow-y: auto;
      padding: 8px;

    #controls .bet-option {
      padding: 7px 6px;
      color: var(--sub);
      background: var(--surface);
      text-align: right;
    }

    #controls .bet-option.is-active {
      color: #041710;
      background: var(--green);
    }

    .speed-control {
      width: 116px;
      height: 34px;
      display: grid;
      grid-template-columns: auto 48px auto;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--sub);
      background: var(--surface);
      font-size: 11px;
      white-space: nowrap;
    }

    .speed-control input[type="range"] {
      width: 48px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--mauve);
    }

    #speedValue {
      min-width: 20px;
      color: var(--mauve);
      font-weight: 800;
    }

    #controls button {
      width: auto;
      height: 34px;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--surface);
      box-shadow: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;

    #controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #controls button:not(:disabled):hover {

    }

    #controls #spinBtn {
      min-width: 72px;
      background: #0077cc;
    }

    #controls #autoBtn {
      min-width: 56px;
    }

    #controls #normalBetBtn,
    #controls #extraBetBtn {
      color: var(--blue);
    }

    #controls #autoBtn {
      background: #007755;
    }

    #controls #normalBetBtn,
    #controls #extraBetBtn {
      min-width: 80px;
    }

    #controls #buyFeatureBtn {
      min-width: 110px;
    }

    #controls #buyFeatureBtn {
      color: var(--accent);
      border: 1px solid rgba(0, 221, 192, 0.4);
    }

    #controls .is-active {
      color: #041710;
      background: var(--green);
      box-shadow: 0 0 12px rgba(51, 255, 153, 0.24);
    }

    .ctrl-sep {
      width: 1px;
      height: 28px;
      margin: 0 2px;
      background: var(--surface-2);
    }

    #rng-wrap {
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
    }

    #live-log-wrap {
      width: 100%;
      margin-top: 10px;
      overflow: hidden;
    }

    .live-log-header {
      display: flex;
      align-items: center;

      gap: 12px;
      padding: 7px 12px;
      border-bottom: 1px solid var(--surface);
      color: var(--sub);

    }

    #clearLogBtn {

    #liveLogBody {

    .live-log-line.mode {

    .live-log-line.error {

    }

    #log-wrap {
      width: 100%;
      margin-top: 10px;
      overflow: hidden;
    }

    #log-header {
      padding: 6px 12px;
      border-bottom: 1px solid var(--surface);
      color: var(--sub);
      font-size: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    #log-body {
      max-height: 210px;
      overflow-y: auto;

    }

    .log-subheader {
      margin: 2px 4px 6px;
      color: var(--sub);

      font-weight: 700;

    }

      padding-bottom: 5px;
      border-bottom: 1px solid var(--surface);
    }

    .setting-header {
      padding: 7px 12px;
      border-bottom: 1px solid var(--surface);
      color: var(--sub);
      font-size: 12px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 8px 12px;
    }

    .setting-body button {
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      color: var(--sub);
      background: #2a3050;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
    }

    .setting-body button:hover {

    }

    .spin-result-row {
      display: block;
      margin: 0;

      border: 0;

      border-radius: 0;
