cb\">☐<\/span> Card System Off／On、Newbie、Oldhand 小／中／大 Bet 與 Link 資格行為正確。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Debug 資訊足以重現並與 Simulator 對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Demo 統計口徑與模擬報表一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 不存在寫死的舊遊戲名稱、倍率、Table、輪帶或 Help。<\/li><\/ul>\n<h2 id=\"8-demo-版-rtp-120\">8. Demo 版 RTP 120%<\/h2>\n<p>Demo 網頁（展示、試玩）用的卡片權重，RTP 120%。規則依數學模型規範 §1.5.3，本節是操作方式。<\/p>\n<ul><li><strong>來源<\/strong>：只用<strong>老手中 Bet<\/strong>（92A）一套衍生；<strong>不分大小 Bet、新老手、A／B 版<\/strong>，新手直接複製老手（含倍數上限）。<\/li><li><strong>NB／EB<\/strong>：差額 <code>120% − 92%<\/code> 一半加在 BG <code>(25, 30]<\/code>、一半提高 FG 觸發卡權重（縮短 FG 週期），兩者都從 <code>(-1, 0]<\/code> 扣；FG 倍率區間不動。觸發把本身的 BG 得分會一起變多，要先從 BG 補足量扣掉。EB 以 NB 基準成本換算（EB 2x 時補足量 ×2）。<\/li><li><strong>BF／SF<\/strong>：平均倍數拉到 <code>購買價 × 120%<\/code>；購買價以上（贏錢）的區間等比例升、以下（賠錢）的區間等比例降，各段形狀不變。<\/li><li><strong>不跑模擬驗證<\/strong>：以卡片權重精算即可。<\/li><li><strong>不升版號、不記修改紀錄<\/strong>：屬 Demo 用參數，不是數學調性。<\/li><li><strong>檔案<\/strong>：出工作簿與 config，不做 PARsheet、報表。<ul><li>工作簿 <code>Source/&lt;MathID&gt;1120_Demo.xlsx<\/code>（例 <code>H0451120_Demo.xlsx<\/code>）：複製 92A 工作簿改 Multiplier_Weight，新手欄＝老手欄（含 Avg_Multi、Nature_Prob），Overview 型號改同檔名、Pay Back 區塊重算；區間平均用 Avg_Multi 精算。存檔後跑 <code>_check_xlsx_style.py<\/code>。<\/li><li><code>config_120A_Demo.js<\/code> 由工作簿轉出，放遊戲根目錄；<code>config_code<\/code>／<code>rtp_label<\/code> 為 <code>120A_Demo<\/code>，並加 <code>demo_only<\/code> 註記。<\/li><li>兩者都複製一份到 <code>Versions/&lt;目前版本&gt;/<\/code>（工作簿放 <code>Source/<\/code>），並加進 <code>Versions/version_manifest.js／.json<\/code> 目前版本的 <code>sources<\/code>／<code>configs<\/code>，Demo 選單顯示「120A Demo（RTP 120%）」；改 manifest 後要升 <code>index.html<\/code> 的 <code>?v=<\/code> 尾碼。<\/li><li>不交 SPS、不進送驗文件。<\/li><\/ul><\/li><li>例：H045 v6.0.0.3 — NB FG 週期 150 → 96.2 轉、EB 30 → 24.5 轉；BF 平均 46.25x → 60x、贏錢率 30% → 48.9%。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-proposal\" hidden><h1 id=\"提案報告規範\">提案報告規範<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集（Omniplay 產線），總覽、共通原則與完成條件見 <a href=\"#\" class=\"tab-link\" data-tab=\"overview\">_README.md<\/a>。<\/p>\n<p><strong>存放位置<\/strong>（總表見<a href=\"#\" class=\"tab-link\" data-tab=\"outputs\" data-anchor=\"3-專案目錄與存放位置\">產出與紀錄規範<\/a>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td>發想中遊戲（尚無 Game ID）的提案簡報<\/td><td><code>Slots/遊戲發想/&lt;遊戲名&gt;/提案/<\/code><\/td><\/tr><tr><td>已有 Game ID 的遊戲的提案簡報<\/td><td><code>Slots/H0xx_遊戲名稱/其他/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-用途與範圍\">1. 用途與範圍<\/h2>\n<p>提案報告（遊戲提案說明簡報）用於向內部或客戶說明一款遊戲的玩法、規格、特色與競品差異，適用於遊戲發想與正式專案。<\/p>\n<ul><li><strong>版式直接參考指定的過去簡報修改<\/strong>，不另訂版面規則；沒有指定時用 <code>JB 工作區/game_spec/101026_Super Neko/04_客戶提案/SUPER_NEKO_提案說明_v16.pptx<\/code>。<\/li><li>範例：<code>Slots/遊戲發想/急速糖果 2/提案/CANDY_RUSH_2_提案說明_v01.pptx<\/code>。<\/li><\/ul>\n<h2 id=\"2-檔案\">2. 檔案<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>格式<\/td><td><code>.pptx<\/code>，16:9<\/td><\/tr><tr><td>檔名<\/td><td><code>{英文遊戲名大寫，空格改底線}_提案說明_v{兩位數版本}.pptx<\/code>，例：<code>CANDY_RUSH_2_提案說明_v01.pptx<\/code><\/td><\/tr><tr><td>版本<\/td><td>內容每次修改版本 +1，舊版保留不覆蓋<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"3-章節結構\">3. 章節結構<\/h2>\n<p>章節名稱與順序固定。中文標題不加編號；右上頁碼用兩位數章節號（<code>01<\/code>～<code>08<\/code>），同一章的多頁沿用該章頁碼。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁碼<\/th><th>英文小標<\/th><th>章節<\/th><th>必要內容<\/th><\/tr><\/thead><tbody><tr><td>—<\/td><td>—<\/td><td>封面<\/td><td>英文遊戲名、中文遊戲名、三個賣點標籤、<code>遊戲提案說明 · 遊戲代號 · 規則基底／數學 · JumboRD<\/code><\/td><\/tr><tr><td>01<\/td><td>OVERVIEW<\/td><td>遊戲概述<\/td><td>簡單說明玩法與核心特色：主題與定位一句話、核心特色、demo 主畫面<\/td><\/tr><tr><td>02<\/td><td>GAME SPEC<\/td><td>遊戲規格一覽<\/td><td>只列規格，不說明怎麼玩：Line／Way 類型、盤面、押注模式、最大贏分／RTP 等<\/td><\/tr><tr><td>03<\/td><td>SYMBOLS<\/td><td>符號說明與賠付<\/td><td>符號種類（一般符號、特殊符號）與賠率表；註腳寫得分公式<\/td><\/tr><tr><td>03<\/td><td>ART REQUIREMENT<\/td><td>符號與美術需求（<strong>隱藏頁<\/strong>）<\/td><td>一般與特殊符號清單（代號、等級）、美術風格參考、其他需求（場景、Loading、大廳 Icon、特色演出）；<strong>一定要做，但設為隱藏投影片<\/strong>，簡報時不播放<\/td><\/tr><tr><td>04<\/td><td>CORE GAMEPLAY<\/td><td>核心玩法<\/td><td>逐項說明玩法要素；內容多時拆成多頁，每頁只講一個特色<\/td><\/tr><tr><td>05<\/td><td>FREE GAME<\/td><td>免費遊戲<\/td><td>觸發、FG 內規則（例：倍數累積或重置）、加局<\/td><\/tr><tr><td>06<\/td><td>GAME FLOW<\/td><td>遊戲流程圖<\/td><td>不要畫太細，只針對容易看不懂的地方畫流程<\/td><\/tr><tr><td>07<\/td><td>SPECIAL BET<\/td><td>特殊押注<\/td><td>Extra Bet、Buy Feature 等；有才放，每種押注一頁（例：3 種 EB、2 種 BF 拆成 5 頁）<\/td><\/tr><tr><td>08<\/td><td>VS. {競品}<\/td><td>與{競品}差異對照<\/td><td>一句話核心差異＋對照表（最右欄為本作）＋結論註腳<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td>Q&amp;A<\/td><td>待確認事項，寫成可決策的問題並標明對象（數學／PM／美術）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>主章節不可刪除；只有「特殊押注」在遊戲沒有 Extra Bet、Buy Feature 時整章省略，並在規格表寫「不提供」。<\/li><li>競品預設為規則基底遊戲；另有指定時依指定。<\/li><\/ul>\n<h2 id=\"4-內容規則\">4. 內容規則<\/h2>\n<ul><li><strong>規則與數值<\/strong>一律以 <code>game_rule.md<\/code> 與 Config 為準，不得出現與 Game Rule 不一致的內容。<\/li><li><strong>未定案的數值<\/strong>在數字後加 <code>*<\/code>，該頁註腳寫「* 為待確認數值」；尚未調校完成的 RTP、最大贏分寫「待數學訂定」，並列入 Q&amp;A。不得用 ⏳ 等 emoji（PowerPoint 會顯示成圖示）。<\/li><li><strong>文字精簡<\/strong>：每頁一句話主旨＋條列不超過 4～5 項，細節留在 Game Rule；賠率表欄位過多時只列代表欄，註腳註明完整賠率見 <code>game_rule.md<\/code>。<\/li><li><strong>demo 截圖<\/strong>一律從該遊戲 Demogame 擷取，不用示意繪圖代替：<ul><li>用 Debug 的 RNG Seed 重現指定局、逐幀停在要展示的瞬間，以 2 倍解析度擷取，確保可重現。<\/li><li>只取 By Game 區域（Feature Status＋盤面＋盤面訊息），不得帶到 Debug 面板；Stats 不得出現誤導數字（需要時用全新頁面跑單局）。<\/li><li>每張截圖附一行圖說，說明畫面重點。<\/li><\/ul><\/li><\/ul>\n<h2 id=\"5-製作與檢查\">5. 製作與檢查<\/h2>\n<ul><li>建議以 <code>pptxgenjs<\/code> 產生（版面以程式定義，方便改版重建）；產生腳本與暫存截圖放暫存區，專案內只保留最終 <code>.pptx<\/code>。<\/li><li>交付前檢查：<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 章節與頁碼符合第 3 節，「符號與美術需求」頁已設為隱藏。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 規則、數值、截圖符合第 4 節。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 以 PowerPoint 匯出圖片逐頁目視：沒有文字溢出、元件重疊。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 檔名、版本符合第 2 節，pptx 技能的 <code>validate.py<\/code> 通過。<\/li><\/ul><\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['overview', 'gamerule', 'report', 'demoreport', 'outputs', 'sim', 'demo', 'proposal'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

function go(tab, anchor) {
  cur.tab = tab; cur.anchor = anchor || '';
  frame.contentWindow && frame.contentWindow.postMessage({ goTab: tab, goAnchor: anchor || '' }, '*');
  renderToc(); setHash();
}
function openSite(key, tab, anchor) {
  if (!SITES[key]) key = KEYS[0];
  var groups = SITES[key].meta.groups || [];
  cur = { key: key, tab: tab || (groups[0] ? groups[0][1][0] : null), anchor: anchor || '' };
  frame.onload = function () { if (cur.tab) frame.contentWindow.postMessage({ goTab: cur.tab, goAnchor: cur.anchor }, '*'); };
  var doc = document.getElementById('doc-' + key);
  if (doc) { frame.removeAttribute('src'); frame.srcdoc = JSON.parse(doc.textContent); }
  else { frame.removeAttribute('srcdoc'); frame.src = SITES[key].src; }
  markNav(); renderToc(); setHash();
}
document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
</body>
