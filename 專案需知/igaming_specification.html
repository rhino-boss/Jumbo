ss=\"n\">91.97%<\/td><td class=\"n\">+7.30%<\/td><td class=\"n\">+4.96%<\/td><td class=\"n\">96.93%<\/td><td class=\"n\"><strong>31.06%<\/strong><\/td><\/tr><tr><td class=\"n\">1,000 轉<\/td><td class=\"n\">91.96%<\/td><td class=\"n\">+7.93%<\/td><td class=\"n\">+4.97%<\/td><td class=\"n\">96.93%<\/td><td class=\"n\"><strong>35.91%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>不救率 ＝ 判定成功但因餘額不足沒發的次數 ÷ 判定成功總次數；實際總 RTP ＝ 無機制 RTP ＋ 實際發放增量。<\/li><li>每天第一批觸發（第 35～45 轉區間）時池子只存了約 1.7 bet／人，但該區間救援成本約 2.7 bet／人，所以每天開頭都有一段發不出來。<\/li><li>延伸救援成本超過預算時，池子長期見底，不救率大幅上升。<\/li><\/ul>\n<h3 id=\"35-套利檢查\">3.5 套利檢查<\/h3>\n<p>主救援。10,000 名玩家、每人一天；每天歸零重來，天天照同一玩法的長期 RTP 就是策略 RTP；超過 97% 標黃、超過 100% 標紅。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>套利手法<\/th><th>情境<\/th><th class=\"n\">平均停在<\/th><th class=\"n\">RTP（有機制）<\/th><th class=\"n\">RTP（無機制）<\/th><th class=\"n\">EV／日（bet）<\/th><\/tr><\/thead><tbody><tr><td>固定轉數閃人<\/td><td>固定玩 40 轉就閃<\/td><td class=\"n\">40 轉<\/td><td class=\"n\"><mark class=\"hl-warn\">97.17%<\/mark><\/td><td class=\"n\">93.19%<\/td><td class=\"n\">-1.13<\/td><\/tr><tr><td><\/td><td>固定玩 80 轉就閃<\/td><td class=\"n\">80 轉<\/td><td class=\"n\">96.46%<\/td><td class=\"n\">92.33%<\/td><td class=\"n\">-2.83<\/td><\/tr><tr><td><\/td><td>固定玩 120 轉就閃<\/td><td class=\"n\">120 轉<\/td><td class=\"n\">95.51%<\/td><td class=\"n\">91.70%<\/td><td class=\"n\">-5.38<\/td><\/tr><tr><td><\/td><td>固定玩 160 轉就閃<\/td><td class=\"n\">160 轉<\/td><td class=\"n\">95.30%<\/td><td class=\"n\">91.65%<\/td><td class=\"n\">-7.52<\/td><\/tr><tr><td><\/td><td>固定玩 200 轉就閃<\/td><td class=\"n\">200 轉<\/td><td class=\"n\">95.75%<\/td><td class=\"n\">91.99%<\/td><td class=\"n\">-8.50<\/td><\/tr><tr><td><\/td><td>固定玩 240 轉就閃<\/td><td class=\"n\">240 轉<\/td><td class=\"n\">96.24%<\/td><td class=\"n\">92.23%<\/td><td class=\"n\">-9.03<\/td><\/tr><tr><td><\/td><td>固定玩 280 轉就閃<\/td><td class=\"n\">280 轉<\/td><td class=\"n\">96.43%<\/td><td class=\"n\">92.13%<\/td><td class=\"n\">-9.99<\/td><\/tr><tr><td><\/td><td>固定玩 320 轉就閃<\/td><td class=\"n\">320 轉<\/td><td class=\"n\">96.47%<\/td><td class=\"n\">92.13%<\/td><td class=\"n\">-11.31<\/td><\/tr><tr><td><\/td><td>固定玩 360 轉就閃<\/td><td class=\"n\">360 轉<\/td><td class=\"n\">96.64%<\/td><td class=\"n\">92.21%<\/td><td class=\"n\">-12.09<\/td><\/tr><tr><td><\/td><td>固定玩 400 轉就閃<\/td><td class=\"n\">400 轉<\/td><td class=\"n\">96.74%<\/td><td class=\"n\">92.12%<\/td><td class=\"n\">-13.05<\/td><\/tr><tr><td>拿到就閃人<\/td><td>拿到任何救援就閃（否則玩到 400）<\/td><td class=\"n\">333 轉<\/td><td class=\"n\"><mark class=\"hl-warn\">97.18%<\/mark><\/td><td class=\"n\">92.12%<\/td><td class=\"n\">-9.38<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>算法<\/th><\/tr><\/thead><tbody><tr><td>RTP（有機制）<\/td><td>Σ 所有玩家停手前的總得分（含救援）÷ Σ 停手前的總押注。<\/td><\/tr><tr><td>RTP（無機制）<\/td><td>同一群玩家、同一套閃人條件，但遊戲沒有救援：停手點依自然結果決定，得分只算自然得分。<\/td><\/tr><tr><td>兩者差距<\/td><td>救援機制對這個玩法的貢獻。<\/td><\/tr><tr><td>平均停在<\/td><td>有機制時所有玩家停手轉數的平均。<\/td><\/tr><tr><td>EV／日（bet）<\/td><td>（Σ 停手前總得分 − Σ 停手前總押注）÷ 玩家數，即每人每天平均淨贏幾個 bet。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>停手點：固定玩 N 轉者有／無機制都停在第 N 轉；「拿到就閃」有機制停在第一次被救的那一轉（沒被救則第 400 轉），無機制停在第 400 轉。<\/li><\/ul>\n<p>敏感度：全員當日固定只玩 N 轉時的整體 RTP（只計主救援），超過 97% 標黃、超過 100% 標紅：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>當日轉數<\/th><th class=\"n\">主救援增量<\/th><th class=\"n\">總 RTP<\/th><\/tr><\/thead><tbody><tr><td>100 轉<\/td><td class=\"n\">+3.87%<\/td><td class=\"n\">95.76%<\/td><\/tr><tr><td>200 轉<\/td><td class=\"n\">+3.66%<\/td><td class=\"n\">95.65%<\/td><\/tr><tr><td>300 轉<\/td><td class=\"n\">+4.42%<\/td><td class=\"n\">96.59%<\/td><\/tr><tr><td>400 轉<\/td><td class=\"n\">+4.62%<\/td><td class=\"n\">96.74%<\/td><\/tr><tr><td>500 轉<\/td><td class=\"n\">+4.01%<\/td><td class=\"n\">96.06%<\/td><\/tr><tr><td>600 轉<\/td><td class=\"n\">+3.34%<\/td><td class=\"n\">95.46%<\/td><\/tr><tr><td>700 轉<\/td><td class=\"n\">+2.86%<\/td><td class=\"n\">94.92%<\/td><\/tr><tr><td>800 轉<\/td><td class=\"n\">+2.50%<\/td><td class=\"n\">94.55%<\/td><\/tr><tr><td>900 轉<\/td><td class=\"n\">+2.23%<\/td><td class=\"n\">94.20%<\/td><\/tr><tr><td>1,000 轉<\/td><td class=\"n\">+2.00%<\/td><td class=\"n\">94.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>延伸救援的套利檢查待延伸救援數值定案後補。<\/p>\n<h2 id=\"附錄-a-新手體驗舊版本\">附錄 A. 新手體驗舊版本<\/h2>\n<p>現行版本是 D 版（第 2 節）；以下為 A～C 版的原始整理，保留作為設計沿革。<\/p>\n<h3 id=\"a1-a-版\">A.1 A 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 6～8 頁。<\/p>\n<ul><li><strong>目的<\/strong>：推廣遊戲並協助新玩家理解遊戲特色，期望大部分玩家在第 50 場前體驗並了解 Free Game、Mini Game 等特色與主要得分方式。<\/li><li><strong>適用條件<\/strong>（同時符合）：第 21～50 把；當下押注 <code>Bet &lt;20<\/code>；尚未體驗過 Free Game（Buy Feature 不算已體驗）。<\/li><li><strong>體驗內容<\/strong>：直接贈送一場 Free Game，目標倍數區間 <code>(15x, 20x]<\/code>，計算需考慮 Scatter Pay。<\/li><li><strong>成本限制<\/strong>：所有遊戲合計單日投入成本 50 萬，超過即關閉新手體驗。<\/li><li><strong>執行流程<\/strong>：第 21～50 把隨機選一個判定回合 → 檢查是否曾觸發 Free Game（救援機制觸發的也算）→ 符合則贈送平均倍數位於 <code>(15x, 20x]<\/code> 的 Free Game。<\/li><li><strong>特殊規則<\/strong>：<ul><li>新手體驗與新手救援不可同一回合觸發，隨機到同一回合須避開。<\/li><li>新手體驗不會觸發 Mini Game。<\/li><li>計算開始遊玩到觸發回合前的平均押注（不含觸發當下這一把）；觸發當下押注高於先前平均即取消，避免提高押注套利。<\/li><li>使用 Extra Bet 時以 Extra Bet 的 Total 為基準，例如 Extra Bet 為 Bet 1 的 8 倍時，體驗金額為 <code>8 × (15～20)<\/code>。<\/li><\/ul><\/li><li><strong>Scatter Pay 處理<\/strong>：FG 觸發帶 Scatter Pay 時卡片系統需納入考量。原始範例：預計給 19 倍、觸發先付 3 倍 Scatter Pay → 以 <code>19 - 3 = 16<\/code> 倍找 <code>(15x, 20x]<\/code> 結果 → 若輸出 19 倍再加 3 倍，實得 22 倍，可能超出 20 倍上限。<\/li><li><strong>待確認<\/strong>：<ul><li>卡片系統產生 FG 結果時，後端無法在返還金額中精確處理 Scatter Pay。<\/li><li>成本估算需額外納入 Scatter Pay。<\/li><li>目的提到 Mini Game，但特殊規則明定不會觸發 Mini Game。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"a2-b-版\">A.2 B 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 9～11 頁。目的、成本限制、執行流程、特殊規則（不含 Extra Bet 條款）、Scatter Pay 範例同 A 版，差異如下：<\/p>\n<ul><li><strong>適用條件<\/strong>：第 11～30 把；<code>Bet &lt;20<\/code>；尚未體驗過 Free Game（Buy Feature 不算）。<\/li><li><strong>體驗內容<\/strong>：Free Game 改用固定倍數，從 <code>(15x, 20x]<\/code> 區間挑一組既有腳本。<\/li><li><strong>待確認<\/strong>：<ul><li>數值設定寫第 11～30 把，但流程寫第 21～50 把選判定回合，範圍不一致。<\/li><li>Scatter Pay 精確處理、成本估算、Mini Game 矛盾三點同 A 版。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"a3-c-版\">A.3 C 版<\/h3>\n<p>版本日期 2025-10-20；文件狀態：未完成；來源 PDF 第 12～14 頁。目的、成本限制、原始流程（第 21～50 把、<code>(15x, 20x]<\/code> Free Game）、特殊規則（不含 Extra Bet 條款）、Scatter Pay 範例（19 倍、3 倍、16 倍、22 倍）同 A 版，差異如下：<\/p>\n<ul><li><strong>適用條件<\/strong>（兩次共同限制 <code>Bet &lt;20<\/code>）：<ul><li>第一次體驗：第 11～30 把，尚未體驗過 Mini Game（Buy Feature 不算），提供 Mini Game。<\/li><li>第二次體驗：第 51～80 把，尚未體驗過 Free Game（Buy Feature 不算），提供 Free Game。<\/li><\/ul><\/li><li><strong>體驗內容<\/strong>：Jackpot Game 提供 Mini Bonus；Free Game 為固定倍數，從 <code>(15x, 20x]<\/code> 挑一組既有腳本。<\/li><li><strong>待確認<\/strong>：<ul><li>文件已標示「未完成」。<\/li><li>第一次體驗提供 Mini Game，但特殊規則寫不會觸發 Mini Game。<\/li><li>適用條件為第 11～30、51～80 把，流程仍寫第 21～50 把。<\/li><li>只描述直接贈送 Free Game，尚無第一次 Mini Game 體驗的完整流程。<\/li><li>Jackpot Game、Mini Game、Mini Bonus 三個名稱的對應關係未定義。<\/li><\/ul><\/li><\/ul>\n<h2 id=\"附錄-b-老手救援舊版本\">附錄 B. 老手救援舊版本<\/h2>\n<p>現行版本是 C-2（第 3 節）；以下為 A、B、C 版的原始整理，保留作為設計沿革。<\/p>\n<h3 id=\"b1-a-版\">B.1 A 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 19～21 頁。<\/p>\n<ul><li><strong>目的<\/strong>：避免玩家長時間處於低 RTP。累積損失達一定程度時，以 Free Game 或一把高分 Base Spin 返還部分損失。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>設定<\/th><\/tr><\/thead><tbody><tr><td>適用期間<\/td><td>老手期，第 200 轉後<\/td><\/tr><tr><td>偵測單位<\/td><td>每 100 把<\/td><\/tr><tr><td>RTP 計算資料<\/td><td>當下 100 把加上前 100 把，共 200 把<\/td><\/tr><tr><td>觸發門檻<\/td><td>RTP <code>&lt;30%<\/code><\/td><\/tr><tr><td>返還比例<\/td><td>玩家損失金額的 25%<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>返還金額 = (Total Bet - Total Win - Scatter Pay) × 25%<\/code><\/pre>\n<ul><li>有 Scatter Pay 的遊戲需特殊處理。<\/li><li><strong>返還倍數區間<\/strong>（取自卡片系統）：(15x, 20x]、(20x, 25x]、(25x, 30x]、(30x, 35x]、(35x, 40x]、(40x, 45x]、(45x, 50x]、(50x, 60x]、(60x, 70x]、(70x, 80x]、(80x, 90x]、(90x, 100x]。<\/li><li><strong>執行流程<\/strong>（以第 351～450 把為例）：切成 351～360、361～370……441～450 等 10 把子區間，各挑一個判定 Spin → 抓前 100 把＋當下 100 把共 200 把的 Total Win、Total Bet 算 RTP，是否低於 30% → 符合則以損失的 25% 計算返還金額 → 判定所屬倍數區間 → 卡片系統重骰到落入該區間。<\/li><li><strong>跨遊戲資料<\/strong>：以玩家為單位，所有遊戲紀錄合併計算（例：遊戲 A 玩 50 把、遊戲 B 玩 50 把，合併 100 把）；新手期結束後先額外累積 50 場作為判斷基底。<\/li><li><strong>特殊規則<\/strong>：救援觸發時不得同時觸發其他獎勵遊戲（如 Jackpot Game）；以「龍意發」為例，救援期間不會出現 15 顆滿盤觸發 Grand。<\/li><\/ul>\n<hr>\n<h3 id=\"b2-b-版\">B.2 B 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 22～26 頁。<\/p>\n<ul><li><strong>目的<\/strong>：從 RTP 觀察玩家歷程，累積損失達一定程度時以 Free Game 救回不會輸太多的狀態，延長遊戲體驗。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>設定<\/th><\/tr><\/thead><tbody><tr><td>適用期間<\/td><td>老手期 100 次 Spin 後，即第 200＋100 轉後<\/td><\/tr><tr><td>返還區間<\/td><td>150 次 Spin<\/td><\/tr><tr><td>RTP 計算區間<\/td><td><code>100 + N<\/code> 次 Spin<\/td><\/tr><tr><td>觸發門檻<\/td><td>RTP <code>&lt;50%<\/code><\/td><\/tr><tr><td>返還目標<\/td><td>RTP <code>55%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>返還金額 = (0.95 - Total Win / Total Bet) × Total Bet<\/code><\/pre>\n<ul><li><strong>機制<\/strong>：每個 150 把返還區間選判定回合，往前抓 <code>100 + N<\/code> 把算 RTP；低於 50% 贈送一個 Free Game 救回目標值。返還倍數區間同 B.1。<\/li><li><strong>執行流程<\/strong>（以第 351 把後為例，原文註明為概念說明、後端可能略有差異）：第 351～400 把隨機選 <code>N1<\/code>，若 <code>N1 = 370<\/code> 則 <code>N = 20<\/code>，往前統計 <code>100 + 20 = 120<\/code> 把 RTP，符合即返還；第 401～450 把再選 <code>N2<\/code>，若 <code>N2 = 411<\/code> 則 <code>N = 11<\/code>，統計 111 把；依此重複。<\/li><li><strong>跨遊戲資料<\/strong>：以玩家為單位，所有遊戲紀錄納入 RTP；新手期結束後先累積 100 場作為計算基底。<\/li><li><strong>特殊規則<\/strong>：同 B.1。<\/li><li><strong>已知問題與待確認<\/strong>：<ul><li>返還目標寫 RTP 55%，公式的 <code>0.95<\/code> 卻是補到 RTP 95%，不一致。<\/li><li>寫每 150 把選一次判定，範例卻在 351～400、401～450 各選一次，頻率待確認。<\/li><li>Extra Bet 為 8 倍時返還上限理論上應為 800 倍，實際只有 100 倍；因 8 倍押注玩家占比不高，暫不修改。<\/li><li>需確認老手期玩家的平均遊玩把數。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"b3-c-版雙池修訂\">B.3 C 版（雙池修訂）<\/h3>\n<p>版本日期：2026-08-28<\/p>\n<h4 id=\"b31-設計目的\">B.3.1 設計目的<\/h4>\n<pre><code>老手期總 RTP = 96%（基礎配置）+ 1%（救援提撥）= 97%<\/code><\/pre>\n<p>依短期、中期、長期 RTP 判斷救援資格；實際發放由共同池與個人池兩本帳控制，救援支出結構上不可能超過提撥總額。未進 FG 轉數不作為救援條件。<\/p>\n<h4 id=\"b32-判定週期\">B.3.2 判定週期<\/h4>\n<p>進入老手期（完成新手期 200 轉）後，從老手期第 1 轉起算，每滿 50 轉（第 50、100…轉）判定一次，判定回合固定、不隨機。<\/p>\n<h4 id=\"b33-遊玩時期\">B.3.3 遊玩時期<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時期<\/th><th class=\"n\">老手期轉數<\/th><\/tr><\/thead><tbody><tr><td>老手第 1 階段<\/td><td class=\"n\">1～100<\/td><\/tr><tr><td>老手第 2 階段<\/td><td class=\"n\">101～200<\/td><\/tr><tr><td>老手第 3 階段<\/td><td class=\"n\">201～300<\/td><\/tr><tr><td>老手第 4 階段<\/td><td class=\"n\">301 起<\/td><\/tr><\/tbody><\/table><\/div>\n<p>新手期為整體第 1～200 轉，執行新手體驗 D 版：新手第 1 階段第 1～100 轉（第 50 轉判定）、第 2 階段第 101～200 轉（第 150 轉判定）。<\/p>\n<h4 id=\"b34-判定資料\">B.3.4 判定資料<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>判定類型<\/th><th class=\"n\">統計範圍<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\">判定回合之前 50 轉<\/td><td>所有階段的共同前置條件<\/td><\/tr><tr><td>中期<\/td><td class=\"n\">判定回合之前 200 轉<\/td><td>各階段主要 RTP 條件<\/td><\/tr><tr><td>長期<\/td><td class=\"n\">判定回合之前 500 轉<\/td><td>僅老手第 4 階段使用<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>區間 RTP = 區間內實際最終得分合計 ÷ 區間內 Total Bet 合計<\/code><\/pre>\n<ul><li>判定回合本身不納入；各窗口須含新手體驗 D 版介入後的實際結果（含第 50、150 轉可能被改寫的得分）。<\/li><\/ul>\n<h4 id=\"b35-救援資格\">B.3.5 救援資格<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>窗口<\/th><th class=\"n\">第 1 階段<\/th><th class=\"n\">第 2 階段<\/th><th class=\"n\">第 3 階段<\/th><th class=\"n\">第 4 階段<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><\/tr><tr><td>中期<\/td><td class=\"n\"><code>&lt;55%<\/code><\/td><td class=\"n\"><code>&lt;55%<\/code><\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><\/tr><tr><td>長期<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"n\"><code>&lt;100%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>第 4 階段長期規則只在已有完整 500 轉資料時執行，不足則不救援。<\/li><li>命中只代表具備資格，實際獎項與是否放行由救援池決定。<\/li><\/ul>\n<h4 id=\"b36-救援池\">B.3.6 救援池<\/h4>\n<p>每次 Spin 提撥投注額 1%，同一筆錢同時記入兩本帳（不是兩筆提撥）：<\/p>\n<pre><code>提撥額 = 該轉 Total Bet × 1%\n\n共同池餘額 = Σ 全平台提撥 − Σ 全平台已發救援成本\n個人池餘額 = Σ 該玩家提撥 − Σ 該玩家已領救援成本<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>池<\/th><th>守什麼<\/th><th>沒錢時<\/th><\/tr><\/thead><tbody><tr><td>共同池<\/td><td>平台總救援支出不超過總投注的 1%<\/td><td>硬性上限，一律不救援<\/td><\/tr><tr><td>個人池<\/td><td>單一玩家不長期超領<\/td><td>改用嚴格標準複判；通過仍可救援（透支）<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"b37-判定順序\">B.3.7 判定順序<\/h4>\n<ol><li>先依 3.3.8 決定預定獎項及完整救援成本。<\/li><li>共同池檢查：不足 → 取消救援；足夠 → 進個人池檢查。共同池關閉時跳過。<\/li><li>個人池檢查：足夠 → 用 3.3.5 一般門檻；不足 → 用 3.3.9 嚴格門檻。<\/li><li>門檻通過 → 發放並依 3.3.10 記帳；未通過 → 不救援。<\/li><\/ol>\n<h4 id=\"b38-救援獎項\">B.3.8 救援獎項<\/h4>\n<p>當日未曾有單局最終得分 ≥50 × 該局 Bet 者救 50×，已體驗過者救 20×；個人池餘額決定支應來源。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>當日 50× 體驗<\/th><th>個人池餘額<\/th><th>額外條件<\/th><th class=\"n\">獎項<\/th><th>支應來源<\/th><\/tr><\/thead><tbody><tr><td>未體驗<\/td><td><code>≥50 × 該轉 Bet<\/code><\/td><td>無<\/td><td class=\"n\">50× FG<\/td><td>個人池<\/td><\/tr><tr><td>未體驗<\/td><td><code>&lt;50 × 該轉 Bet<\/code><\/td><td>通過嚴格標準<\/td><td class=\"n\">50× FG<\/td><td>共同池（透支）<\/td><\/tr><tr><td>已體驗<\/td><td><code>≥20 × 該轉 Bet<\/code><\/td><td>無<\/td><td class=\"n\">20× FG<\/td><td>個人池<\/td><\/tr><tr><td>已體驗<\/td><td><code>&lt;20 × 該轉 Bet<\/code><\/td><td>通過嚴格標準<\/td><td class=\"n\">20× FG<\/td><td>共同池（透支）<\/td><\/tr><tr><td>—<\/td><td>不足<\/td><td>未通過嚴格標準<\/td><td class=\"n\">不救援<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>判定轉單一路徑結算：救援通過只用救援結果，未通過或取消才用自然結果，兩者不比較高低（與現行 C-2 取較高者不同）；自然結果保留作「無機制」對照，不加進最終得分。<\/li><li>救援結果一律由卡片系統重骰，不得直接塞分數或放置 Scatter；救援觸發時不得同時觸發其他獎勵遊戲（如 Jackpot Game）。<\/li><\/ul>\n<h4 id=\"b39-嚴格標準\">B.3.9 嚴格標準<\/h4>\n<p>獨立固定門檻，不隨一般門檻連動：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>窗口<\/th><th class=\"n\">一般標準<\/th><th class=\"n\">嚴格標準<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\"><code>&lt;40%<\/code><\/td><\/tr><tr><td>中期（第 1～4 階段）<\/td><td class=\"n\"><code>&lt;55% / 55% / 50% / 50%<\/code><\/td><td class=\"n\"><code>&lt;55% / 55% / 50% / 50%<\/code><\/td><\/tr><tr><td>長期（第 4 階段）<\/td><td class=\"n\"><code>&lt;100%<\/code><\/td><td class=\"n\"><code>&lt;100%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"b310-成本記帳\">B.3.10 成本記帳<\/h4>\n<pre><code>救援成本 = 救援流程產生的該轉完整最終得分<\/code><\/pre>\n<ul><li>救援成功時兩池均按完整救援結果扣款，自然結果不抵銷；以實際最終得分（含 Scatter Pay）計，不得用卡片目標倍數，否則低估支出。<\/li><li>報表「倍率差」＝ <code>救援結果 − 自然結果<\/code>，僅供比較，可為負，不影響記帳。<\/li><li>正式系統依投注事件時間順序更新共同池；模擬器同一轉內以固定亂數種子打散玩家順序，避免共同池偏向較小玩家編號。<\/li><\/ul>\n<h4 id=\"b311-異常加押檢查\">B.3.11 異常加押檢查<\/h4>\n<p>判定前往前檢查歷史押注，辨識是否在可能取得救援前異常加押。待定義：往前檢查的轉數、基準（平均、中位數或其他）、高出多少視為異常並取消救援。<\/p>\n<h4 id=\"b312-玩家取得救援後的行為\">B.3.12 玩家取得救援後的行為<\/h4>\n<p>記錄取得救援後是否立即停玩，作為效果與套利風險觀察指標；目前不直接判定為套利。<\/p>\n<h4 id=\"b313-rtp-驗證與待確認事項\">B.3.13 RTP 驗證與待確認事項<\/h4>\n<p>模擬須驗證：老手期總 RTP 收斂於 97%（96% 基礎 + 1% 救援）；共同池餘額不得為負；共同池、個人池、嚴格標準擋下的次數分別統計；透支比例與 50×／20× 發放占比列入報表。<\/p>\n<p>待確認：<\/p>\n<ul><li>個人池初始額度：1% 提撥約需 2,000 轉攢滿 20×、5,000 轉攢滿 50×，前期幾乎都走透支；候選為進老手期贈送初始額度（例如 50 × Bet）或維持 0，先模擬透支比例再定案。<\/li><li>「當日體驗 50×」定義：日切基準（平台時區日曆日或 session）、是否含 BF／SF 局、是否含救援結果、以單局整包（含 FG）或單次事件計。<\/li><li>共同池範圍（建議每款遊戲各一池）與時間範圍（建議滾動窗口）。<\/li><li>BF／SF 是否提撥與計入判定窗口（建議不提撥、不計入）。<\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', 'math', 'docs', 'submission', 'script', 'stress', 'backend', 'ceiling', 'mechanism'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-landbase">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Landbase 轉製 開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.c lass=\"body-row\">\n  <nav class=\"toc\" id=\"toc-guide\"><a class=\"toc-2\" href=\"#1-頁籤\" data-tab=\"guide\">1. 頁籤<\/a><\/nav><nav class=\"toc\" id=\"toc-knowhow\" hidden><a class=\"toc-2\" href=\"#1-市場與平台要求\" data-tab=\"knowhow\">1. 市場與平台要求<\/a><\/nav><nav class=\"toc\" id=\"toc-系統機制\" hidden><a class=\"toc-2\" href=\"#1-新手體驗\" data-tab=\"系統機制\">1. 新手體驗<\/a><a class=\"toc-3\" href=\"#11-救援倍數\" data-tab=\"系統機制\">1.1 救援倍數<\/a><a class=\"toc-3\" href=\"#12-轉製遊戲要注意的地方\" data-tab=\"系統機制\">1.2 轉製遊戲要注意的地方<\/a><a class=\"toc-2\" href=\"#2-系統限制\" data-tab=\"系統機制\">2. 系統限制<\/a><a class=\"toc-2\" href=\"#3-檢查清單\" data-tab=\"系統機制\">3. 檢查清單<\/a><\/nav><nav class=\"toc\" id=\"toc-math\" hidden><a class=\"toc-2\" href=\"#1-數學模型\" data-tab=\"math\">1. 數學模型<\/a><a class=\"toc-3\" href=\"#11-必要內容\" data-tab=\"math\">1.1 必要內容<\/a><a class=\"toc-3\" href=\"#12-模型命名\" data-tab=\"math\">1.2 模型命名<\/a><a class=\"toc-3\" href=\"#13-押注選項\" data-tab=\"math\">1.3 押注選項<\/a><a class=\"toc-3\" href=\"#14-rtp-配置\" data-tab=\"math\">1.4 RTP 配置<\/a><a class=\"toc-3\" href=\"#15-彩金配置\" data-tab=\"math\">1.5 彩金配置<\/a><a class=\"toc-3\" href=\"#16-bet-mode\" data-tab=\"math\">1.6 Bet Mode<\/a><a class=\"toc-2\" href=\"#2-card-system\" data-tab=\"math\">2. Card System<\/a><a class=\"toc-3\" href=\"#21-設定結構\" data-tab=\"math\">2.1 設定結構<\/a><\/nav><nav class=\"toc\" id=\"toc-送驗規範\" hidden><a class=\"toc-2\" href=\"#1-通用原則\" data-tab=\"送驗規範\">1. 通用原則<\/a><a class=\"toc-3\" href=\"#11-一款遊戲的送驗產出\" data-tab=\"送驗規範\">1.1 一款遊戲的送驗產出<\/a><a class=\"toc-3\" href=\"#12-必要檔案與命名\" data-tab=\"送驗規範\">1.2 必要檔案與命名<\/a><a class=\"toc-3\" href=\"#13-禁止出現的內容\" data-tab=\"送驗規範\">1.3 禁止出現的內容<\/a><a class=\"toc-3\" href=\"#14-sha1-清單\" data-tab=\"送驗規範\">1.4 SHA1 清單<\/a><a class=\"toc-2\" href=\"#2-送驗文件\" data-tab=\"送驗規範\">2. 送驗文件<\/a><a class=\"toc-3\" href=\"#21-數學模型parsheet\" data-tab=\"送驗規範\">2.1 數學模型／PARsheet<\/a><a class=\"toc-3\" href=\"#22-模擬程式\" data-tab=\"送驗規範\">2.2 模擬程式<\/a><a class=\"toc-3\" href=\"#23-數學說明文件game-document-description\" data-tab=\"送驗規範\">2.3 數學說明文件（Game Document Description）<\/a><a class=\"toc-3\" href=\"#24-game-description\" data-tab=\"送驗規範\">2.4 Game Description<\/a><a class=\"toc-2\" href=\"#3-檢查清單送驗前\" data-tab=\"送驗規範\">3. 檢查清單（送驗前）<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-guide\"><h1 id=\"landbase-轉製-導覽\">Landbase 轉製 導覽<\/h1>\n<p>本規範適用於 <strong>Landbase 轉製遊戲<\/strong>：實體機台數學轉製為線上版，Game List 備註「線上-Landbase轉製遊戲」者，例如 102xxx／105xxx。<\/p>\n<p>RTP 配置與系統機制的正式來源為 Google 試算表 <a href=\"https://docs.google.com/spreadsheets/d/1Qk66cM8iZqyEhr23nsnxiDXOHj8CGNji--sedOHF0F8/edit?gid=386193409\">RTP 設定<\/a>（<code>數值設定<\/code>、<code>彩金參數<\/code> 兩頁）。目前引用 <strong>2026/05/14「全平台」版的「轉製遊戲」欄<\/strong>；試算表更新時必須同步修訂並記錄日期。<\/p>\n<h2 id=\"1-頁籤\">1. 頁籤<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁籤<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"knowhow\">Knowhow<\/a><\/td><td>市場、平台 RTP 要求<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統相關<\/a><\/td><td>新手體驗、系統限制（新手／低注不拉 Link、最大賠付）<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學設計<\/a><\/td><td>數學模型（必要內容／數學調性、模型命名、押注選項、RTP 配置、彩金配置、Bet Mode）、Card System 設定結構<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"送驗規範\">送驗相關<\/a><\/td><td>通用原則（送驗產出、必要檔案與命名、禁止內容、SHA1）、送驗文件（PARsheet、模擬程式、數學說明文件、Game Description）、檢查清單<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-knowhow\" hidden><h1 id=\"landbase-knowhow\">Landbase Knowhow<\/h1>\n<p>本頁記錄 Landbase 轉製產線的市場與平台背景，作為數學設計的前提。<\/p>\n<h2 id=\"1-市場與平台要求\">1. 市場與平台要求<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>市場<\/td><td>菲律賓<\/td><\/tr><tr><td>平台 RTP 要求<\/td><td>Total RTP 須介於 <code>96.5%<\/code>～<code>97%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Landbase 的 RTP 拆分見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.4 節。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-系統機制\" hidden><h1 id=\"landbase-轉製-系統機制\">Landbase 轉製 系統機制<\/h1>\n<p>本頁說明 Landbase 轉製遊戲的新手體驗與系統限制。RTP 配置與 Link 彩金見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>。<\/p>\n<h2 id=\"1-新手體驗\">1. 新手體驗<\/h2>\n<p>轉製遊戲使用新手體驗 D 版，轉製時要用到的規則如下。<\/p>\n<h3 id=\"11-救援倍數\">1.1 救援倍數<\/h3>\n<p>新手體驗預設給出下列倍數（可依遊戲調整），轉製遊戲必須能產生這些結果：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>判定<\/th><th>救援倍數<\/th><\/tr><\/thead><tbody><tr><td>第一次<\/td><td>15×<\/td><\/tr><tr><td>第二次<\/td><td>強 30×／弱 15×<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-轉製遊戲要注意的地方\">1.2 轉製遊戲要注意的地方<\/h3>\n<ul><li>只給新手 Profile，RTP 預算 2.00%。<\/li><li>新手 Total RTP 97.00% ＝ Game 95.00% ＋ 新手體驗 2.00%；數學模型只負責 Game RTP，新手體驗的派彩計算與驗證時必須和 Game RTP 分開統計。<\/li><li>遊戲必須能在判定回合產生上表倍數（預設 15× 與 30×）的結果，且演出與自然得分無法區分；做法依腳本規範的新手體驗腳本，或由 Card System 重骰產生。<\/li><li>新手期不得拉 Link 彩金（第 2 節），新手體驗給出的得分也不得觸發 Link 事件。<\/li><\/ul>\n<h2 id=\"2-系統限制\">2. 系統限制<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>限制<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>新手標籤<\/td><td>玩家仍帶有新手標籤時，<strong>任何 Bet Mode（含 BF／SF）都不得拉 Link 彩金<\/strong>；不得因為購買 Feature 而繞過新手限制。<\/td><\/tr><tr><td>新手期<\/td><td>新手期不得拉彩金，Link RTP 必為 0%；<code>&gt;= $2<\/code> 時只滾 Inrc、不中彩。<\/td><\/tr><tr><td>低注<\/td><td><code>bet_tier_amount &lt; $2<\/code> 不得拉 Link 彩金，新手、老手皆同；NB／EB 以實際押注、BF／SF 以反推基礎押注判定。<\/td><\/tr><tr><td>系統最大賠付<\/td><td><strong>單把派彩上限 <code>$10,000,000<\/code>，超過整把重骰<\/strong>。BG／FG 另有單把上限，規則見天花板說明；數學模型必須依該文件驗算倍率上限，並在數學文件明記。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Link 資格一律由系統依 Profile 與 <code>bet_tier_amount<\/code> 判定；<code>link_enabled = false<\/code> 時不得只把派彩改成 0，結果中不得出現已觸發但不派彩的 Link 事件或演出。<\/li><\/ul>\n<h2 id=\"3-檢查清單\">3. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 新手（含 BF／SF）與低注的 Link RTP 為 0%，且結果中無已觸發但不派彩的 Link 事件。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 倍率上限已依天花板說明驗算（BG、FG、系統賠付上限）並記錄。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-math\" hidden><h1 id=\"landbase-轉製-數學模型規範\">Landbase 轉製 數學模型規範<\/h1>\n<p>本頁說明 Landbase 轉製遊戲的數學模型與 Card System。新手體驗與系統限制見<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>。<\/p>\n<h2 id=\"1-數學模型\">1. 數學模型<\/h2>\n<h3 id=\"11-必要內容\">1.1 必要內容<\/h3>\n<ul><li>數學調性目前<strong>沒有明確方向，由負責人自由發揮<\/strong>（待討論）。<\/li><li>自由發揮不代表免記錄。負責人決定調性後，必須在數學模型的 <code>Game Description<\/code> 工作表與 <code>game_rule.md<\/code> 寫明：<ul><li>以原機數學為底還是重新設計；若以原機為底，記錄原機 RTP（Game List 的「RTP 版本」欄，例：84%）與調整到線上目標 RTP 的方式（改輪帶、改 Paytable、Card System 或其他）。<\/li><li>波動度／最大倍數目標與 Hit Rate 目標。<\/li><li>是否啟用 Card System；啟用時依第 2 章。<\/li><\/ul><\/li><li>原機既有的 Bonus／Feature 玩法屬於 Game RTP 的一部分，不另拆 Bonus Game RTP（見第 1.4 節）。<\/li><\/ul>\n<h3 id=\"12-模型命名\">1.2 模型命名<\/h3>\n<ul><li>Landbase 轉製遊戲的 ParSheet ID 仍為 <code>H&lt;三位數字&gt;1<\/code>；同一數學供多個 Game ID 使用時（如 <code>H0111<\/code> → 102001／102002），數學模型只建一份，Game ID 對應記錄於 <code>Game Description<\/code> 工作表與 Game List。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<p>押注金額由三個參數相乘（來源：H5 企劃書 <code>6.BetCurreny<\/code> 工作表）：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits；Denom = 0.002 → 1 倍押注 = 0.2<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3<\/th><th class=\"n\">4<\/th><th class=\"n\">5<\/th><th class=\"n\">6<\/th><th class=\"n\">7<\/th><th class=\"n\">8<\/th><th class=\"n\">9<\/th><th class=\"n\">10<\/th><th class=\"n\">11<\/th><th class=\"n\">12<\/th><th class=\"n\">13<\/th><th class=\"n\">14<\/th><th class=\"n\">15<\/th><th class=\"n\">16<\/th><th class=\"n\">17<\/th><th class=\"n\">18<\/th><th class=\"n\">19<\/th><th class=\"n\">20<\/th><th class=\"n\">21<\/th><th class=\"n\">22<\/th><th class=\"n\">23<\/th><th class=\"n\">24<\/th><th class=\"n\">25<\/th><th class=\"n\">26<\/th><th class=\"n\">27<\/th><th class=\"n\">28<\/th><th class=\"n\">29<\/th><th class=\"n\">30<\/th><\/tr><\/thead><tbody><tr><td>倍數<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">5<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">15<\/td><td class=\"n\">20<\/td><td class=\"n\">25<\/td><td class=\"n\">30<\/td><td class=\"n\">35<\/td><td class=\"n\">40<\/td><td class=\"n\">45<\/td><td class=\"n\">50<\/td><td class=\"n\">60<\/td><td class=\"n\">70<\/td><td class=\"n\">80<\/td><td class=\"n\">90<\/td><td class=\"n\">100<\/td><td class=\"n\">150<\/td><td class=\"n\">200<\/td><td class=\"n\">300<\/td><td class=\"n\">500<\/td><td class=\"n\">1000<\/td><td class=\"n\">1500<\/td><td class=\"n\">3000<\/td><td class=\"n\">5000<\/td><td class=\"n\">7500<\/td><td class=\"n\">10000<\/td><td class=\"n\">15000<\/td><td class=\"n\">25000<\/td><\/tr><tr><td>金額<\/td><td class=\"n\">0.2<\/td><td class=\"n\">0.4<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">2.4<\/td><td class=\"n\">3<\/td><td class=\"n\">4<\/td><td class=\"n\">5<\/td><td class=\"n\">6<\/td><td class=\"n\">7<\/td><td class=\"n\">8<\/td><td class=\"n\">9<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">14<\/td><td class=\"n\">16<\/td><td class=\"n\">18<\/td><td class=\"n\">20<\/td><td class=\"n\">30<\/td><td class=\"n\">40<\/td><td class=\"n\">60<\/td><td class=\"n\">100<\/td><td class=\"n\">200<\/td><td class=\"n\">300<\/td><td class=\"n\">600<\/td><td class=\"n\">1,000<\/td><td class=\"n\">1,500<\/td><td class=\"n\">2,000<\/td><td class=\"n\">3,000<\/td><td class=\"n\">5,000<\/td><\/tr><tr><td>開啟<\/td><td class=\"n\"><\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>倍數表共 30 組；<strong>「開啟」列打勾的 23 檔才上線<\/strong>（<code>1<\/code>～<code>5,000<\/code>），其餘不開。<\/li><\/ul>\n<h3 id=\"14-rtp-配置\">1.4 RTP 配置<\/h3>\n<pre><code>Total RTP = Link RTP + Game RTP + 新手體驗 RTP<\/code><\/pre>\n<ul><li>轉製遊戲<strong>不拆 Bonus Game RTP<\/strong>；試算表「轉製遊戲」欄的 Bonus／Game 為同一合併欄位，原機的 Bonus／Feature 派彩全部歸入 Game RTP。<\/li><li>新手滾入彩池的 Increment 不計入新手 Total RTP；定義見第 1.5 節。<\/li><li>RTP ＝ Total Win ÷ 實際 Total Bet；產品顯示可四捨五入，但計算用完整精度；各 Bet Mode 分母用該模式實際成本。<\/li><\/ul>\n<h4 id=\"141-nbeb-rtp-配置\">1.4.1 NB／EB RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Player Profile<\/th><th>押注層級<\/th><th class=\"n\">判定金額<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Game RTP<\/th><th class=\"n\">新手體驗 RTP<\/th><th class=\"n\">Total (+機制)<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>不分層級<\/td><td class=\"n\">全部<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">95.00%<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><tr><td>老手<\/td><td>高注<\/td><td class=\"n\"><code>&gt;= $2<\/code><\/td><td class=\"n\">2.00%<\/td><td class=\"n\">95.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><tr><td>老手<\/td><td>低注<\/td><td class=\"n\"><code>&lt; $2<\/code><\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手<strong>不分大小 Bet<\/strong>，只有一套 RTP：Link 0% ＋ Game 95% ＋ 新手體驗 2% ＝ 97%。<\/li><li>老手 <code>&gt;= $2<\/code> 的 Game RTP 比 <code>&lt; $2<\/code> 低 2 個百分點，差額即 Link RTP，兩級 Total 相同。<\/li><li>新手 Link RTP 皆為 0%；新手 <code>&gt;= $2<\/code> 的 Increment 只滾入彩池、不可中彩（見<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>的系統限制）。<\/li><li>本表於 2026-10-05 調整，與試算表 2026/05/14 版不同；試算表更新後兩者須一致。<\/li><\/ul>\n<h4 id=\"142-bfsf-rtp-配置\">1.4.2 BF／SF RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Player Profile<\/th><th>押注層級<\/th><th class=\"n\">判定金額<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Game RTP<\/th><th class=\"n\">新手體驗 RTP<\/th><th class=\"n\">Total (+機制)<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>不分層級<\/td><td class=\"n\">全部<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><tr><td>老手<\/td><td>高注<\/td><td class=\"n\"><code>&gt;= $2<\/code><\/td><td class=\"n\">2.00%<\/td><td class=\"n\">94.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><tr><td>老手<\/td><td>低注<\/td><td class=\"n\"><code>&lt; $2<\/code><\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>BF／SF 的 Total RTP 為 <strong>96.50%<\/strong>（比 NB／EB 的 97% 低 0.5 個百分點），不含新手體驗。<\/li><li>新手 BF／SF 與老手 <code>&lt; $2<\/code> 相同：Link 0% ＋ Game 96.5% ＝ 96.5%；<strong>新手 BF 的 Link RTP 必為 0%<\/strong>。<\/li><li>老手 <code>&gt;= $2<\/code> 為 Link 2% ＋ Game 94.5% ＝ 96.5%。<\/li><\/ul>\n<h3 id=\"15-彩金配置\">1.5 彩金配置<\/h3>\n<p>Link 彩金為 Grand、Major 兩層累積彩池。<strong>配置跟該遊戲所在的賭場一致<\/strong>，不另訂（試算表 <code>彩金參數<\/code> 頁，2026/05/14）。<\/p>\n<h4 id=\"151-link-資格\">1.5.1 Link 資格<\/h4>\n<p>「可滾 Inrc」表示該局押注會依 Increment 比例滾入彩池；「可拉 Link」表示該局有資格中 Grand／Major。兩者是不同的資格：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>押注<\/th><th>可拉 Link<\/th><th>可滾 Inrc<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td><code>&lt; $2<\/code><\/td><td>否<\/td><td>否<\/td><\/tr><tr><td>新手<\/td><td><code>&gt;= $2<\/code><\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>老手<\/td><td><code>&lt; $2<\/code><\/td><td>否<\/td><td>否<\/td><\/tr><tr><td>老手<\/td><td><code>&gt;= $2<\/code><\/td><td>是<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 與 BF／SF 都適用上表；押注金額依第 1.6 節判定。系統限制另見<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>。<\/li><li>Link RTP 與 Increment 由系統層依賭場設定，數學模型不得把彩金參數寫死在輪帶或 Paytable；模型只負責 Game RTP 與新手體驗，並在 <code>Game Description<\/code> 記錄採用的賭場與參數版本。<\/li><li>數學模型必須定義哪些派彩歸入 Link、哪些歸入 Game，不得重複計算。<\/li><\/ul>\n<h4 id=\"152-link-彩金配置\">1.5.2 Link 彩金配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>賭場<\/th><th>級距<\/th><th class=\"n\">初始金額<\/th><th class=\"n\">Startup%<\/th><th class=\"n\">Increment<\/th><th class=\"n\">RTP<\/th><\/tr><\/thead><tbody><tr><td>Online（小平台）<\/td><td>Grand<\/td><td class=\"n\">$100,000<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online（小平台）<\/td><td>Major<\/td><td class=\"n\">$20,000<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online<\/td><td>Grand<\/td><td class=\"n\">$500,000<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online<\/td><td>Major<\/td><td class=\"n\">$100,000<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>有 Link 的遊戲才依本表配置<\/strong>，沒有 Link 的遊戲不用此配置。<\/li><li><strong>賭場線上線下串連的配置不列入本表<\/strong>：若要讓某賭場的線上與線下（實體機台）彩金串在一起，線上的配置必須與該賭場線下<strong>一模一樣<\/strong>；而每款 Landbase 轉製遊戲在賭場的配置都不同，無法訂一套共用值。目前只有 MFB（Okada）一家賭場，所以真要串時先以 MFB 的配置為準（例：Grand <code>$1,000,000<\/code>／Startup 1.10%／Increment 0.20%／RTP 1.30%；Major <code>$100,000<\/code>／0.50%／0.20%／0.70%）；之後若不再有這需求就用不到，因此<strong>有要串時才依該遊戲、該賭場的配置另做<\/strong>。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>初始金額<\/td><td>彩池開出後重置的起始金額（Start Up Pool）<\/td><\/tr><tr><td>Startup%<\/td><td>押注中用來補足初始金額的比例；<code>Startup% = RTP − Increment<\/code><\/td><\/tr><tr><td>Increment<\/td><td>押注中滾入彩池、讓彩池累積上漲的比例（試算表的 Inrc）<\/td><\/tr><tr><td>RTP<\/td><td>該級距的彩金 RTP；<code>RTP = Startup% + Increment<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Grand ＋ Major RTP ＝ Link RTP 2.00%；表中兩種配置的 Increment 合計皆為 0.85%。<\/li><li>平均開出金額：<code>Average Jackpot Hit Value = 初始金額 ÷ Startup% × RTP<\/code>。例：Online Grand ＝ $500,000 ÷ 0.65% × 1.00% ≈ $769,231。<\/li><li>試算表只給初始金額、RTP 與 Increment，Startup% 依上式推得；試算表改版時三欄一起更新。<\/li><li>新手 <code>&gt;= $2<\/code> 的押注也會滾入 Increment，但新手不能中彩，所以新手的 Link RTP 為 0%。<\/li><\/ul>\n<h3 id=\"16-bet-mode\">1.6 Bet Mode<\/h3>\n<ul><li>老手的押注層級只分 <strong><code>&lt; $2<\/code>／<code>&gt;= $2<\/code> 兩級<\/strong>（低注／高注）；新手不分層級。<\/li><li>NB／EB 以該模式的實際押注金額判定；BF／SF 以 <strong>Feature 購買價格 ÷ Feature Price 倍數反推的基礎押注<\/strong>判定，不用購買總價。<\/li><li>倍率上限依<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>的系統最大賠付反推；Newbie 上限 BG <code>30x<\/code>／FG <code>120x<\/code>。<\/li><\/ul>\n<h2 id=\"2-card-system\">2. Card System<\/h2>\n<h3 id=\"21-設定結構\">2.1 設定結構<\/h3>\n<p>啟用 Card System 時，Oldhand 的押注層級只有兩套：<\/p>\n<pre><code>oldhand\n├─ normal_bet    → low_bet／high_bet → weight_bg／weight_fg\n├─ extra_bet     → low_bet／high_bet → weight_bg／weight_fg\n├─ buy_feature   → low_bet／high_bet → weight_fg\n└─ super_feature → low_bet／high_bet → weight_fg<\/code><\/pre>\n<ul><li><code>low_bet<\/code> 對應 <code>&lt; $2<\/code>，<code>high_bet<\/code> 對應 <code>&gt;= $2<\/code>；不得保留 <code>medium_bet<\/code>／<code>big_bet<\/code> 的空殼設定。<\/li><li>區間工作表（<code>Multiplier_Weight<\/code>、<code>Avg_Multi<\/code>、<code>Nature_Prob<\/code>）的 Oldhand 欄位依低／高注命名，例如 <code>NB_BG_Low<\/code>／<code>NB_BG_High<\/code>；Newbie 欄位不變。<\/li><li>是否啟用 Card System 隨第 1.1 節數學調性決定；未啟用時不得建立空白權重欄或 Card System 設定。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-送驗規範\" hidden><h1 id=\"landbase-轉製-送驗規範\">Landbase 轉製 送驗規範<\/h1>\n<p>本頁說明 <strong>Landbase 轉製遊戲<\/strong>（Game ID <code>102xxx<\/code>／<code>105xxx<\/code>）的送驗包內容與各文件要注意的地方。轉製遊戲的數學與文件來自 Landbase 原機團隊。<\/p>\n<p>本頁內容與送驗根目錄 <code>送驗規範.md<\/code> 的「Landbase 轉製遊戲」章相同，修改時兩邊同步。<\/p>\n<h2 id=\"1-通用原則\">1. 通用原則<\/h2>\n<h3 id=\"11-一款遊戲的送驗產出\">1.1 一款遊戲的送驗產出<\/h3>\n<p>送驗包只有<strong>一個 zip<\/strong>，不再另建 <code>{GameID}_note/<\/code>：送驗文件與 Landbase 轉來的模擬資產全部放進 <code>{GameID}/<\/code>，打包成 <code>{GameID}.zip<\/code>（另存 <code>備份/{GameID}_YYMMDD.zip<\/code>）。<\/p>\n<pre><code>{GameID}/\n├─ {GameID}_Game Description.docx\n├─ {GameID}_Game Description_No Progressive.docx\n├─ {GameID}_Game Document Description.docx\n├─ {GameID}_SHA1.txt\n├─ PARsheet/\n├─ flowcharts/\n└─ simulation/\n   ├─ A0xx-Way Game.ipynb\n   ├─ BallTable.xlsx / StripTable.xlsx / GameFeature.xlsx / Pays.xlsx\n   ├─ DefineSymbols.py\n   └─ common/<\/code><\/pre>\n<ul><li>RTP 版本數通常 4～6 個（RTP 選項 × 有無彩金），每個版本都要有對應的 PARsheet。<\/li><li>歷史例外：102002（260427 批次）的檔名為 <code>102002 Game Description.docx<\/code>（空格）且無數學說明文件，屬早期交付，不作為新案依據。<\/li><\/ul>\n<h3 id=\"12-必要檔案與命名\">1.2 必要檔案與命名<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>檔名<\/th><\/tr><\/thead><tbody><tr><td>Game Description<\/td><td><code>{GameID}_Game Description.docx<\/code>、<code>{GameID}_Game Description_No Progressive.docx<\/code><\/td><\/tr><tr><td>數學說明文件<\/td><td><code>{GameID}_Game Document Description.docx<\/code><\/td><\/tr><tr><td><code>PARsheet/<\/code><\/td><td><code>H0xxR_Opt01.xlsx<\/code>～<code>_Opt06.xlsx<\/code>（RTP 選項 × 有無彩金），或 <code>H011194<\/code>／<code>H011196<\/code>／<code>H011294<\/code>… 的「變體＋RTP」命名<\/td><\/tr><tr><td>SHA1 清單<\/td><td><code>{GameID}_SHA1.txt<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Landbase 遊戲用 <code>A0xx<\/code>／<code>S0xx<\/code>／<code>AS0xx<\/code> 代號，轉線上後改用 <code>H0xx<\/code> ParSheet ID 與 6 碼 Game ID：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Landbase<\/th><th>ParSheet ID<\/th><th>Game ID<\/th><th>遊戲<\/th><\/tr><\/thead><tbody><tr><td>A030<\/td><td>H009R<\/td><td>105005<\/td><td>Jin Feng Fei Wu 金鳳飛舞<\/td><\/tr><tr><td>A031<\/td><td>H010R<\/td><td>105006<\/td><td>Hua Hao Yue Yuan 花好月圓<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>同一套數學可對應多個 Game ID（<code>H0071<\/code> → 105001／105003）。<\/li><li>對應關係以 <code>iGaming 遊戲代號一覽.xlsx<\/code> 為準；查不到不得逕行送驗。<\/li><li>Landbase 本身若另出菲律賓版，會再立新代號（A009 → A028、A010 → A029），<strong>不要與線上版混用<\/strong>。<\/li><li>檔名一律 <code>{GameID}_<\/code> 底線前綴，不用 Landbase 的連字號、全大寫。<\/li><\/ul>\n<h3 id=\"13-禁止出現的內容\">1.3 禁止出現的內容<\/h3>\n<p>Landbase 文件可能含下列內容，送驗包所有文件（Game Description、Game Document Description、PARsheet）一律不得出現；以不分大小寫搜尋，含表格儲存格，找到即為錯誤，必須移除後才可送驗。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檢查項目<\/th><th>關鍵字<\/th><\/tr><\/thead><tbody><tr><td>Extra Bet 敘述<\/td><td><code>extra bet<\/code><\/td><\/tr><tr><td>Buy Feature 敘述<\/td><td><code>buy feature<\/code><\/td><\/tr><tr><td>Super Feature 敘述<\/td><td><code>super feature<\/code><\/td><\/tr><tr><td>&gt;$2 拉彩金門檻<\/td><td><code>&gt;$2<\/code>、<code>&gt; $2<\/code>、<code>bet $2<\/code>、<code>$2 or more<\/code>、<code>more than $2<\/code><\/td><\/tr><tr><td>新手卡組內容<\/td><td><code>newbie<\/code>、<code>新手<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手卡組屬內部營運機制，不隨遊戲送驗：PARsheet 的新手工作表／欄位、文件內的新手敘述一律移除。<\/li><\/ul>\n<h3 id=\"14-sha1-清單\">1.4 SHA1 清單<\/h3>\n<ul><li><code>{GameID}_SHA1.txt<\/code> 必要，涵蓋 zip 內所有檔案（清單本身除外），每次打包前重產，且一起打包進 zip。<\/li><\/ul>\n<h2 id=\"2-送驗文件\">2. 送驗文件<\/h2>\n<h3 id=\"21-數學模型parsheet\">2.1 數學模型／PARsheet<\/h3>\n<ul><li>須有 Overview 六項必要資訊（BG／FG／Bonus／Link RTP、免費遊戲週期、JP 符號出現率）；Landbase 簡易 PARsheet（只分「單機遊戲」／「彩金遊戲」）不足時要補齊。<\/li><li><strong>RTP 口徑<\/strong>：Landbase 的 RTP 可能不含彩金；轉線上後重新拆成 <strong>Game／Link<\/strong> 兩項（不拆 Bonus），Game List 的 <code>BASE GAME RTP%<\/code> 與報告的客戶計算 RTP 一致（排除 Link）。<\/li><li><code>LLF_Calculator (H5).xlsx<\/code> 這類帶 <code>(H5)<\/code> 的計算器屬線上版專用，放 <code>PARsheet/<\/code>。<\/li><\/ul>\n<h3 id=\"22-模擬程式\">2.2 模擬程式<\/h3>\n<ul><li>不放 <code>Simulator/<\/code>，沒有不算缺漏；Landbase 轉來的模擬資產放 <code>simulation/<\/code>、流程圖放 <code>flowcharts/<\/code>（第 1.1 節）。<\/li><li><code>flowcharts/<\/code> 放流程圖（<code>01_base_game.png<\/code>、<code>02_hs_phase1.png<\/code>…）；<code>A0xx-Way Game.ipynb<\/code> 是 Landbase 原始模擬 notebook；<code>common/<\/code> 放 <code>DataExport.py<\/code>、<code>InputSettings.py<\/code>。<\/li><li><strong><code>__pycache__/<\/code> 一律清掉<\/strong>：105005、105006、106004 的送驗包都曾夾帶編譯中間檔，那是機器與 Python 版本相依的產物，不該進認證範圍。<\/li><li><code>.ipynb<\/code> 若與交付的 <code>.py<\/code> 內容不同步，兩者都不可交付；先確認哪一份是正式版。<\/li><\/ul>\n<h3 id=\"23-數學說明文件game-document-description\">2.3 數學說明文件（Game Document Description）<\/h3>\n<ul><li>Landbase 團隊交付的 DOCX，說明 PARsheet 各選項；內容須與 <code>PARsheet/<\/code> 的選項逐一對應。<\/li><\/ul>\n<h3 id=\"24-game-description\">2.4 Game Description<\/h3>\n<ul><li>基本上都要兩份：含彩金版與 <code>_No Progressive<\/code> 版，兩份除彩金章節外須逐字相同。<\/li><li>自既有核准模板重做為<strong>單一英文版<\/strong>，不得沿用 Landbase 的雙語檔（<code>{ID}-GAME DESCRIPTION - CH.docx<\/code>／<code>- ENG.docx<\/code>）。<\/li><li><strong>彩金敘述<\/strong>：Landbase 原機的彩金機制與線上彩金不同，彩金章節須改寫為線上彩金版本，不可沿用。<\/li><li><strong>盤面與得分方式<\/strong>：<code>Way Game<\/code>／<code>Line Game<\/code> 的描述要與線上 Game Rule 一致。<\/li><li><strong>不放圖片<\/strong>：Game Description 內一律不放任何圖片（符號圖、盤面圖、走線圖、示意圖）；需要舉例時，符號一律用代號文字表示（<code>M1<\/code>、<code>M2<\/code>…），不用圖片。<\/li><\/ul>\n<h2 id=\"3-檢查清單送驗前\">3. 檢查清單（送驗前）<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> Landbase 代號 → ParSheet ID → Game ID 的對應已自代號一覽確認。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Description 已重做為單一英文版，非沿用 Landbase 雙語檔。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> PARsheet 為完整版，Overview 必要欄位齊全，非簡易 PARsheet。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 送驗文件與模擬資產已放進同一個 <code>{GameID}.zip<\/code>，SHA1 清單已重產並一起打包，<code>__pycache__/<\/code> 已清除。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> RTP 已重新拆成 Game／Link；彩金敘述已改為線上彩金版本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 第 1.3 節的禁止內容已全部移除。<\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', '系統機制', 'math', '送驗規範'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-reskin">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Reskin 開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:999px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:620px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:52px; border-bottom:1px dashed var(--grid)}\n.tl-row:first-child .tl-track{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-bar.event{background:var(--s2); opacity:.85; height:16px; top:6px}\n.tl-label{position:absolute; top:24px; font-size:1em; color:var(--ink); white-space:nowrap}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -m 5 10v10h14V10\"/><\/svg>總覽<\/button><button class=\"tab\" role=\"tab\" id=\"tab-g1\" data-tab=\"knowhow\" data-tabs=\"knowhow\" aria-selected=\"false\" tabindex=\"-1\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 18h6\"/><path d=\"M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/><\/svg>Knowhow<\/button><button class=\"tab\" role=\"tab\" id=\"tab-g2\" data-tab=\"math\" data-tabs=\"math\" aria-selected=\"false\" tabindex=\"-1\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 4H6l6 8-6 8h12\"/><\/svg>數學設計<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-guide\"><\/nav><nav class=\"toc\" id=\"toc-knowhow\" hidden><a class=\"toc-2\" href=\"#1-市場與平台要求\" data-tab=\"knowhow\">1. 市場與平台要求<\/a><a class=\"toc-2\" href=\"#2-幣別\" data-tab=\"knowhow\">2. 幣別<\/a><\/nav><nav class=\"toc\" id=\"toc-math\" hidden><a class=\"toc-2\" href=\"#1-數學模型\" data-tab=\"math\">1. 數學模型<\/a><a class=\"toc-3\" href=\"#11-必要內容\" data-tab=\"math\">1.1 必要內容<\/a><a class=\"toc-3\" href=\"#12-模型命名\" data-tab=\"math\">1.2 模型命名<\/a><a class=\"toc-3\" href=\"#13-押注選項\" data-tab=\"math\">1.3 押注選項<\/a><a class=\"toc-3\" href=\"#14-rtp-配置\" data-tab=\"math\">1.4 RTP 配置<\/a><a class=\"toc-3\" href=\"#15-彩金配置\" data-tab=\"math\">1.5 彩金配置<\/a><a class=\"toc-3\" href=\"#16-bet-mode\" data-tab=\"math\">1.6 Bet Mode<\/a><a class=\"toc-2\" href=\"#2-待確認事項\" data-tab=\"math\">2. 待確認事項<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-guide\"><h1 id=\"reskin-導覽\">Reskin 導覽<\/h1>\n<p>本規範適用於 <strong>Reskin 遊戲<\/strong>：以既有遊戲（iGaming 遊戲或 Landbase 轉製遊戲）換皮，輸出到 GC／SC 雙幣市場。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁籤<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"knowhow\">Knowhow<\/a><\/td><td>市場、平台 RTP 要求、幣別<\/td><\/tr><tr><td>系統相關<\/td><td>系統機制、天花板說明、腳本規範、壓測說明書、後端報表（待定）<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學設計<\/a><\/td><td>押注結構、GC／SC 押注選項、RTP 配置（92／94／96）、Link 彩金<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-knowhow\" hidden><h1 id=\"reskin-knowhow\">Reskin Knowhow<\/h1>\n<p>本頁記錄 Reskin 產線的市場與平台背景，作為數學設計的前提。<\/p>\n<h2 id=\"1-市場與平台要求\">1. 市場與平台要求<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>市場<\/td><td>歐美<\/td><\/tr><tr><td>平台 RTP 要求<\/td><td>須提供總 RTP（Total (+機制)）<code>92%<\/code>、<code>94%<\/code>、<code>96%<\/code> 三個版本；彩金都一樣插在遊戲裡，只差 Game RTP<\/td><\/tr><tr><td>幣別<\/td><td>GC、SC 兩種<\/td><\/tr><tr><td>押注層級<\/td><td>不分 <code>&lt; $2<\/code>／<code>&gt;= $2<\/code>；系統機制不會依押注金額擋拉彩金<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>據了解（未經平台正式確認），平台會在玩家<strong>第一次玩該遊戲時<\/strong>，依玩家過去的遊玩習慣指定 92／94／96 其中一個版本給該玩家。<\/li><li>因此三個版本都會在線上實際被玩到，皆須完整製作、模擬驗證與送驗，不能只做主版本。<\/li><li>各版本的 RTP 拆分見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.4 節。<\/li><\/ul>\n<h2 id=\"2-幣別\">2. 幣別<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>幣別<\/th><th>性質<\/th><th class=\"n\">Denom<\/th><th class=\"n\">1 倍押注<\/th><th>押注範圍<\/th><\/tr><\/thead><tbody><tr><td>GC<\/td><td>遊戲幣（無現金價值，不可兌換）<\/td><td class=\"n\"><code>20<\/code><\/td><td class=\"n\"><code>2,000 GC<\/code><\/td><td><code>2,000<\/code>～<code>100,000 GC<\/code>（上線 18 檔）<\/td><\/tr><tr><td>SC<\/td><td>錢（可兌換現金）<\/td><td class=\"n\"><code>0.002<\/code><\/td><td class=\"n\"><code>0.2 SC<\/code><\/td><td><code>0.2<\/code>～<code>200 SC<\/code>（上線 40 檔）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>兩幣別共用同一張 44 組 Bet Multiplier，只有 Denom 不同；押注清單見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.3 節。<\/li><li>兩幣別是否共用同一套 RTP、Card System 與彩金資格尚待確認，確認前使用相同數學。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-math\" hidden><h1 id=\"reskin-數學模型規範\">Reskin 數學模型規範<\/h1>\n<p>本頁說明 <strong>Reskin 遊戲<\/strong>的數學模型：以既有遊戲數學為底，換皮輸出到 GC／SC 雙幣市場的版本。<\/p>\n<p>目前的需求來源文件（<code>個人工作區/專案紀錄/<\/code> 下的 Reskin 需求資料夾）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>日期<\/th><th>內容<\/th><th>狀態<\/th><\/tr><\/thead><tbody><tr><td>押注幣別工作簿（<code>bet_currency_*.xlsx<\/code>）<\/td><td>2026-08-13<\/td><td>工作表 <code>v2<\/code>（唯一未隱藏）：44 組 Bet Multiplier、SC／GC 的 Denom 與押注金額；<code>Sheet1<\/code>、<code>v1<\/code> 為隱藏的舊草稿<\/td><td><strong>現行版<\/strong><\/td><\/tr><tr><td><code>Bet Option規劃.pdf<\/code><\/td><td>2026-07-30<\/td><td>Bet Multiplier 44 組、Reskin SC／GC 押注金額<\/td><td>較舊；GC 只列 16 檔<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-數學模型\">1. 數學模型<\/h2>\n<h3 id=\"11-必要內容\">1.1 必要內容<\/h3>\n<ul><li>數學調性：待定。<\/li><\/ul>\n<h3 id=\"12-模型命名\">1.2 模型命名<\/h3>\n<p>命名為 <code>H&lt;遊戲編號&gt;1&lt;RTP&gt;&lt;Variant&gt;.xlsx<\/code>，<code>&lt;RTP&gt;<\/code> 填 Reskin 版本（Total (+機制)），<strong>不是 Game RTP<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>版本<\/th><th>RTP 模型<\/th><th>Overview 模型名稱<\/th><th>Config<\/th><\/tr><\/thead><tbody><tr><td>92 版<\/td><td><code>H0xx192A.xlsx<\/code><\/td><td><code>H0xx192-&lt;版本&gt;<\/code><\/td><td><code>config_92A.js<\/code><\/td><\/tr><tr><td>94 版<\/td><td><code>H0xx194A.xlsx<\/code><\/td><td><code>H0xx194-&lt;版本&gt;<\/code><\/td><td><code>config_94A.js<\/code><\/td><\/tr><tr><td>96 版<\/td><td><code>H0xx196A.xlsx<\/code><\/td><td><code>H0xx196-&lt;版本&gt;<\/code><\/td><td><code>config_96A.js<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>每個版本的模型檔都包含第 1.4 節的四組卡片，<strong>同一檔內分頁存放，不拆成多個檔<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>卡片<\/th><th>工作表<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>NB／EB 老手<\/td><td><code>Multiplier Weight<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 老手<\/td><td><code>Multiplier Weight<\/code><\/td><td>BF／SF 區塊<\/td><\/tr><tr><td>NB／EB 新手<\/td><td><code>Multiplier Weight (new_player)<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 新手<\/td><td><code>Multiplier Weight (new_player)<\/code><\/td><td>BF／SF 區塊；原作若沒有（BF／SF 不分新手），轉 Reskin 時要補<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>卡片目標只看第 1.4 節表中的 Game（Landbase 轉製為 Game+Bonus）欄，依來源遊戲類型取用：<ul><li>iGaming（第 1.4.1 節），例 96 版：NB／EB 老手 Game 91%，其餘三組 Game 92%；Bonus 與 Progressive 不由卡片負責。<\/li><li>Landbase 轉製（第 1.4.2 節），例 96 版：NB／EB 新手與老手 94%、BF／SF 老手 94%、BF／SF 新手 96%。<\/li><\/ul><\/li><li>只有一套數學時只建 A，不建空白 B。<\/li><li>從原作轉來、檔名相同（如 <code>H0xx192A<\/code>、<code>H0xx194A<\/code>）時，以新版本覆蓋，原作版本保留在 <code>Versions/<\/code> 舊版資料夾。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<h4 id=\"131-押注結構\">1.3.1 押注結構<\/h4>\n<p>押注金額由三個參數相乘，不直接列舉金額：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits（所有市場固定）<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>定義<\/th><th>由誰決定<\/th><\/tr><\/thead><tbody><tr><td>最小押分<\/td><td>1 倍押注的 credit 數，固定 <code>100<\/code><\/td><td>產線共用<\/td><\/tr><tr><td>Denom<\/td><td>每 credit 的幣值，依市場／幣別不同<\/td><td>市場設定（第 1.3 節）<\/td><\/tr><tr><td>Bet Multiplier<\/td><td>押注倍數選項，<code>1<\/code>～<code>1000<\/code> 共 44 組<\/td><td>產線共用（第 1.3.1 節）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3<\/th><th class=\"n\">4<\/th><th class=\"n\">5<\/th><th class=\"n\">6<\/th><th class=\"n\">7<\/th><th class=\"n\">8<\/th><th class=\"n\">9<\/th><th class=\"n\">10<\/th><th class=\"n\">11<\/th><th class=\"n\">12<\/th><th class=\"n\">13<\/th><th class=\"n\">14<\/th><th class=\"n\">15<\/th><th class=\"n\">16<\/th><th class=\"n\">17<\/th><th class=\"n\">18<\/th><th class=\"n\">19<\/th><th class=\"n\">20<\/th><th class=\"n\">21<\/th><th class=\"n\">22<\/th><th class=\"n\">23<\/th><th class=\"n\">24<\/th><th class=\"n\">25<\/th><th class=\"n\">26<\/th><th class=\"n\">27<\/th><th class=\
