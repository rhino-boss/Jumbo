的 Previous／Next 兩顆同款（深藍底、細框、淺色字，共用 <code>demogame_common.js<\/code> 套用）；設定區文字標籤 12px 一般字重、下拉選項同按鈕；有名稱的區域標題 12px 粗體、說明色、不轉大寫，標題列滿版、下方加一條分隔線（同紀錄區）；遊戲區不顯示標題。倍率線型、紀錄、版本紀錄的標題後有「+」，點下去用彈窗顯示完整內容（倍率線型為大圖），彈窗一開就是最大尺寸（不隨內容長高，沒資料的地方維持深色底），可按 ⟳ 旋轉 90°（寬高對調後滿版）；直式手機放大倍率線型時一開就是橫的，紀錄與版本紀錄維持直式，關閉後放回原位；所有捲軸隱藏但保留上下捲動。<\/li><\/ul>\n<p>共用資源固定放在 <code>Slots/<\/code>：<\/p>\n<pre><code>Slots/\n├─ demogame_common.css\n├─ demogame_common.js\n└─ H0xx_遊戲名稱/\n   └─ index.html<\/code><\/pre>\n<p>每款遊戲的 <code>index.html<\/code> 必須使用相對路徑載入：<\/p>\n<pre><code>&lt;link rel=\"stylesheet\" href=\"../demogame_common.css?v=1\"&gt;\n&lt;script src=\"../demogame_common.js?v=1\"&gt;&lt;/script&gt;<\/code><\/pre>\n<ul><li><code>demogame_common.css<\/code> 維護所有共用區域的版面、色彩、間距、元件狀態與響應式規則。<\/li><li><code>demogame_common.js<\/code> 維護共用初始化、操作控制、Setting、Config／Profile、Version、Language、Help、Debug 與共用狀態同步。<\/li><li>共用功能或樣式有異動時，修改 <code>demogame_common.css<\/code>／<code>demogame_common.js<\/code>，不得在每款遊戲的 <code>index.html<\/code> 複製一份再各自修改。<\/li><li>By Game 樣式與程式保留在該遊戲的 <code>index.html<\/code> 或遊戲專屬資源，不得放入共用檔案影響其他遊戲。<\/li><li>遊戲專屬 CSS 不得覆寫共用區域，除非本規範明確提供可覆寫的 CSS Variable 或 Hook。<\/li><\/ul>\n<h3 id=\"23-符號顯示規則所有遊戲\">2.3 符號顯示規則（所有遊戲）<\/h3>\n<p>盤面符號一律依下列規則顯示，樣式由 <code>demogame_common.css<\/code> 的 Symbol display standard 統一套用：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>顯示<\/th><\/tr><\/thead><tbody><tr><td>Image 開啟，且該符號有美術<\/td><td>只顯示符號圖；<strong>不顯示符號代號、不畫符號框<\/strong>（無框線、無底色）<\/td><\/tr><tr><td>Image 關閉，或該符號無美術<\/td><td>顯示<strong>符號框＋符號代號<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>符號代號（<code>M1<\/code>、<code>M2<\/code>、<code>A<\/code>、<code>C1<\/code>…）一律使用一般字重，<strong>不得使用粗體<\/strong>。<\/li><li>符號框＋代號的樣式所有遊戲統一（共用 <code>demogame_common.js<\/code> 依格子代號自動套用，各遊戲不另設；沒有特別要求就照這套）：沒圖時一定顯示符號代號（Scatter 一律顯示 C1、Wild 一律顯示 WW），只露出一部分的格子（例如頂端 peek 列）畫成整顆符號被盤面上緣截斷（頂端不畫框線），文字上下左右置中、Consolas 19px 一般字重、文字本身不加底色；M 獎與字獎（A／K／Q／J／10）都有底版，字獎深藍底，M1～M8 用同亮度、不同色相的低彩度漸層（M1 酒紅、M2 靛紫、M3 墨綠、M4 寶藍、M5 青、M6 梅紫、M7 棕、M8 橄欖）；C1／C2／SC 橘色亮漸層；Wild 青綠漸層；金框符號保留原底色、外框一律金色，且跟著符號一直顯示（得分時也保留）。Help 賠率表的代號方格用同一套配色。H014 數字格不套用。<\/li><li>有符號美術的遊戲必須接入共用 Image 開關：頁面在載入 <code>demogame_common.js<\/code> 前定義 <code>window.DEMOGAME_IMAGE_TOGGLE = { supported: true, defaultEnabled: true, setEnabled(enabled) { … } }<\/code>，<code>setEnabled<\/code> 內切換是否輸出符號圖並重繪目前盤面；不得自行另做圖片開關。共用模組會在 Setting 產生 <code>Image<\/code> 開關，選擇存於 <code>localStorage<\/code>（<code>slotDemoSymbolImages<\/code>）。<\/li><li>有輸出符號圖的格子必須加上 <code>has-symbol-art<\/code>；圖片載入失敗時移除此 class 並改顯示代號。<\/li><li><strong>圖片預載（必做）<\/strong>：放到網頁上時，圖片若等第一次用到才下載，盤面會先出現空白格。有符號美術的遊戲必須在 <code>DEMOGAME_IMAGE_TOGGLE<\/code> 加上 <code>images<\/code>：本遊戲會用到的<strong>所有<\/strong>圖片網址（陣列，或回傳陣列的函式），包含大符號長圖、金框等所有變體。共用模組會在開局前預載並解碼完成：<ul><li>預載期間擋住點擊與鍵盤；超過 120 ms 才顯示「載入圖片 n / N」遮罩，避免已有快取時畫面閃一下。<\/li><li>解碼最多等 1.5 秒；分頁在背景時略過解碼（瀏覽器在背景分頁不會完成 <code>decode()<\/code>），不得因此卡住遮罩。<\/li><li>任一張載入失敗：關閉 Image 開關、改用文字顯示，並提示失敗張數；不得停在載入畫面。<\/li><li>預載邏輯只寫在 <code>demogame_common.js<\/code>，遊戲專屬程式只提供 <code>images<\/code> 清單，不得自行另寫預載。<\/li><\/ul><\/li><li><strong>圖片格式<\/strong>：Demo 使用的符號圖一律用 WebP（<code>quality 90<\/code>、保留透明），檔名與原 PNG 相同、副檔名改 <code>.webp<\/code>，放在 <code>Source/Image/<\/code>；原始 PNG 保留作為美術原檔，Demo 不引用。<\/li><li>無美術時的代號可使用共用標籤 <code>&lt;span class=\"slot-symbol-label\"&gt;代號&lt;/span&gt;<\/code>（置中、一般字重）。<\/li><li>沒有任何符號美術的遊戲不接 Image 開關，固定顯示符號框＋代號。<\/li><li>中獎、轉換等<strong>狀態<\/strong>框線（<code>.hit<\/code>、<code>.convert<\/code>、<code>.wild-mark<\/code>、<code>.fx-win<\/code>）不受此規則影響。<\/li><li>符號一體：符號的字、框、底板是一體，所有動畫（長出來、消除、補牌、掉落）都整格一起動，不能只有部分變化（例如框先出現、字才長出來）。顯示得分框時，沒得分的符號完全不變（不變暗、不換框）。<\/li><li>得分符號只把外框換成藍色框起來（金框符號得分時保留金框、外圈加藍框）（共用 <code>demogame_common.js<\/code> 套用），不放大、不閃、不跳；各遊戲不得另做中獎動畫。消除與掉落動畫不受影響。<\/li><li>Hook：框線本身屬規則狀態、且沒有對應美術時（例如純 CSS 的金框），在該格加 <code>keep-symbol-frame<\/code> 保留框線。金框若已有美術（例如 Frame 圖或金框版符號圖），不得再疊加 CSS 框。<\/li><\/ul>\n<h2 id=\"3-補牌方式\">3. 補牌方式<\/h2>\n<p>每款有消除機制的遊戲，必須在 Game Rule、Config 對應說明與 Demogame 中指定唯一補牌方式。Simulator 與 Demogame 必須使用相同邏輯。<\/p>\n<ol><li><strong>消除後原地補牌<\/strong><ul><li>中獎符號消除後，只在原本的空格位置抽取並顯示新符號。<\/li><li>盤面上未消除的符號維持原座標，不播放向下移動動畫。<\/li><li>新符號在空格原位「長出來」（縮放 0→1，共用 <code>demogameMotion.grow()<\/code>），<strong>不得播放掉落動畫<\/strong>。<\/li><\/ul><\/li><li><strong>消除後掉落補牌<\/strong><ul><li>中獎符號消除後，同一 Reel／Column 上方未消除的符號依重力向下補位。<\/li><li>剩餘空格由新符號從盤面上方掉入。<\/li><li>動畫必須區分既有符號的 Settle 與新符號的 Drop／Refill。<\/li><li>掉落整段時間＝一輪從滾動到滾停的時間（共用 <code>demogameMotion.dropMs()<\/code>）。<\/li><\/ul><\/li><li><strong>特殊補牌（By Game）<\/strong><ul><li>不符合前兩類的 Random、Parallel、跨欄移動、整盤替換或其他特殊補牌皆歸此類。<\/li><li>必須在該遊戲的 <code>game_rule.md<\/code> 與數學模型的 <code>Game Description<\/code> 工作表中明確定義抽取來源、移動方向、補牌順序、保留位置及動畫。<\/li><li>不得把單一遊戲的特殊補牌邏輯寫成所有遊戲共用的預設行為。<\/li><\/ul><\/li><\/ol>\n<ul><li>補牌資料必須來自 Config 定義的 Reel／Drop Table／Weight，不得只為動畫另外抽一組結果。<\/li><li>補牌後重新判獎的次數、盤面與得分必須可由 Debug 結果重現，並與 Simulator 對帳。<\/li><li>Symbol 轉 Wild、鎖定位置或不補牌的位置，必須先依遊戲規則處理，再執行選定的補牌方式。<\/li><\/ul>\n<h2 id=\"4-必要行為\">4. 必要行為<\/h2>\n<ul><li>支援 Normal Spin，以及遊戲實際存在的 Extra Bet、Buy Feature、Super Feature。<\/li><li>押注選項依 Bet Currency：1～1500 加上最大押注 2000／3000／5000；押注層級由數學定義的遊戲（例如 H014 依押注各有自然表）以 Config 為準。<\/li><li>Bet 顯示與 Credit 扣款使用實際模式成本；Win 依流程即時更新：每次消除得分就加上去（BG 局與每轉 FG），局末數值與結算相同；觸發 FG 那局（含 BF 入場盤）的 BG 得分要累積進 FG，FG 期間 Win＝觸發局 BG 得分＋FG 累計，FG 結束時等於整局總得分；Debug 的 Previous／Next 逐步檢視時，Win 同步顯示該步的累計得分。<\/li><li>Auto、Speed、Reset 不得改變 RNG、得分或統計結果。<\/li><li>Speed 為 1～5 五階：1～4 階轉輪由左到右逐輪停；第 5 階不逐輪停，Spin 後所有轉輪同時到位（BG、FG、Respin 皆同）。<\/li><li>轉輪滾動一律照 H020 超級寶石的滾法：每輪是一條連續往下捲動的輪帶，由左到右依序停在結果上；不得用每一幀換一次符號的方式表現滾動。轉輪類遊戲停輪前要多往下滾約 18% 格高再回彈到正確位置（總時間不變，輪帶上方墊一格避免露出空白）；Speed 1～4 每輪至少滾 10 個符號，Speed 5 維持。掉落類遊戲（H013、H019、H027、H045、急速糖果 2、糖果狂歡 2500）Spin 不播輪帶滾動：舊盤面整欄往下掉出、新符號整欄從上方掉入並輕微回彈，由左到右逐欄錯開（Speed 5 同時），每欄時間＝<code>reelSpinMs()<\/code>，用共用 <code>demogameMotion.dropSpin()<\/code>；連消後的補牌方式維持各遊戲原本規則。<\/li><li>動畫時間統一由共用 <code>window.demogameMotion<\/code> 提供，各遊戲不得自訂：一輪滾動到滾停 <code>reelSpinMs()<\/code>＝700／520／380／260／180 ms（Speed 1～5），逐輪停錯開 <code>stopStaggerMs()<\/code>＝120／100／80／60／0 ms；掉落補牌 <code>dropMs()<\/code>、原地補牌長出來 <code>growMs()<\/code> 都等於 <code>reelSpinMs()<\/code>。<\/li><li>每一轉（BG 局與每一轉 FG）算完分後固定停 0.5 秒（共用 <code>window.demogameRoundPause()<\/code>），才放行下一轉或 Auto；這段停頓不受 Speed 影響，Simulation 不停頓。<\/li><li>BG、Cascade、FG、Retrigger 與 Feature 狀態按真實流程播放。<\/li><li>FG 結束回到 BG 時，盤面還原成觸發 FG 那局的 BG 最終盤面（BF 為入場盤），Feature Status 回到基礎遊戲。<\/li><li>Config、Version、Profile、押注層級、Card System 與 Language 只顯示實際支援的內容。<\/li><li>Help 與 <code>game_help_draft.md<\/code> 一致，不在 HTML 另維護一份規則。<\/li><li>Help 至少要有賠率表：<code>game_help_draft.md<\/code> 沒有賠率（或讀不到、只剩離線副本）時，由 Config 的 Paytable 依目前押注產生。<\/li><li>Help 版式（共用 <code>demogame_common.js<\/code>）：標題由大到小（區塊標題 20px 置中 → 副標題 15px 置中 → 規則 13px），區塊之間用分隔線、規則前加方塊符號；賠率表顯示成兩欄符號卡片，每張是「符號＋由大到小的 <code>N - 派彩<\/code>」。有符號美術的遊戲要定義 <code>window.DEMOGAME_SYMBOL_ART = { 代號: 圖片網址 }<\/code>，卡片用該圖；沒美術或 Image 關閉時，顯示與盤面同款的深色代號方格（C1／SC 金色、WW 綠色）。<\/li><li>連線（Line）遊戲有得分時要在盤面畫出得分線：呼叫共用 <code>window.demogameWinLines.draw(盤面容器, [[格子元素…], …])<\/code>，每條得分線要依線圖（paylines）整條畫出、連過每一輪的格子中心，不能只畫中獎的那幾連，顏色依序輪替；每次重畫盤面後要重新呼叫。<\/li><\/ul>\n<h2 id=\"5-debug-與重現\">5. Debug 與重現<\/h2>\n<p>Debug Mode 至少可查看：<\/p>\n<ul><li>Config、Version、Profile、Bet Mode、Mode／Feature Price 倍數、base bet、實際模式押注、<code>bet_tier_amount<\/code>、押注層級、Link 資格、BG／FG Max Multiplier 與 Card System 狀態。<\/li><li>Card 抽獎值、卡片區間與 Retry 次數。<\/li><li>Table、Drop Mode 與盤面表（記在 Log）；停輪與整局抽樣以 RNG 碼重現（見下方「可重現 RNG」）。<\/li><li>初始盤面、每段 Cascade、Line／Ways Win、Multiplier 與最終結果。<\/li><li>FG 觸發、局數、Retrigger、整包 Win 及即時 Log。<\/li><li>最後調性更新（共用，頁尾 <code>.footer-note<\/code>）：頁面在載入 <code>demogame_common.js<\/code> 前設 <code>window.DEMOGAME_LAST_TUNING = \"YYYY-MM-DD HH:MM\"<\/code>，頁尾顯示「最後調性更新：日期 時間」（24 小時制，到分鐘）。<strong>只有數學模型或倍率（卡片）權重調整才更新<\/strong>（與 <code>修改紀錄.md<\/code> 最新一項同日）；介面、演出、文件修改不更新。<\/li><li>數值報告按鈕（共用）：有 <code>其他/數值報告_&lt;遊戲中文名&gt;.html<\/code> 的遊戲，在載入 <code>demogame_common.js<\/code> 前設 <code>window.DEMOGAME_REPORT_URL<\/code>，標題列右側出現「報告」按鈕（英文 Report），與說明、重置排在一起。<\/li><li>BG／FG 最大倍數（共用，併在「統計」區，取代原「最高倍數」列）：頁面在載入 <code>demogame_common.js<\/code> 前設 <code>window.DEMOGAME_HISTORY = true<\/code>，每局呼叫 <code>window.demogameHistory.record({ bg, fg })<\/code>（BG 得分、該局 FG 總得分，皆 ÷ 底注）；沒有 FG 的遊戲只顯示 BG 列，重置清空。<\/li><li>Log（共用 <code>window.demogameLog(text, type)<\/code>）：帶時間的即時紀錄，Clear 清空，最多保留 500 行；所有遊戲行格式一致（照 H045），不記演出過程：<ul><li><code>Config &lt;名稱&gt; loaded | Version &lt;版本&gt; | Card System On|Off<\/code><\/li><li><code>#&lt;局號&gt; Normal Bet|Extra Bet|Buy Feature|Super Feature | Bet &lt;押注&gt;[ | Card Range set][ | Replay]<\/code><\/li><li><code>RNG &lt;碼&gt;<\/code>（可點，複製並填入 RNG 欄）<\/li><li><code>BG|BF Entry | &lt;盤面表&gt; | Cascade &lt;n&gt; | C1 &lt;n&gt; | Win &lt;得分&gt; (&lt;倍數&gt;x)<\/code><\/li><li><code>Free Game triggered | &lt;n&gt; spins[ (Retrigger ×k)]<\/code>、<code>FG &lt;i&gt;/&lt;n&gt; | … | Win &lt;得分&gt;<\/code>、<code>FG complete | Total &lt;得分&gt; (&lt;倍數&gt;x)<\/code><\/li><li><code>Error | &lt;訊息&gt;<\/code><\/li><\/ul><\/li><li>Simulation（共用，<code>#batch-simulation<\/code>）：N 局獨立數學模擬，Start 執行中只顯示「進行中」（English：Running），不跳局數。FG 觸發顯示「比例 (N 場)」；最高倍數為單局總得分倍數（BF ÷ 底注）；消除分布轉置為「消除次數 × BG／FG」，與倍率線型一樣各自框成一區並有標題。各遊戲提供：<ul><li><code>window.demogameSimulateRound({ mode })<\/code>：用與畫面相同的遊戲邏輯產生一局（不得另寫簡化數學），回傳 <code>multiplier<\/code>（總得分含 FG ÷ 實際押注）、<code>lineMultiplier<\/code>（BF ÷ 底注，其餘同 <code>multiplier<\/code>）、<code>fgTriggered<\/code>、<code>maxMultiplier<\/code>、<code>retryLimitExceeded<\/code>、<code>retryCount<\/code>、<code>bgCascade<\/code>、<code>fgCascades<\/code>；<code>mode<\/code> 只在該局暫時套用，不得改動畫面押注模式與統計。<\/li><li><code>window.demogameSimulationModes = [{ value, label }]<\/code>：只列實際支援的押注模式，面板據此顯示押注模式選單。<\/li><\/ul><\/li><li>累積倍率線型（共用，統計區下方，標題「倍率線型 (押注模式)」）：畫面實際遊玩的局，NB 記在 NB、EB 記在 EB，BF／SF 不記錄；依目前押注模式顯示對應的累積圖（標準 64 區間、Y 軸 1%），重置清空。遊戲每局（含 FG）結束時呼叫 <code>window.demogameLineChart.record(總得分 ÷ 押注, \"NB\"|\"EB\")<\/code>；押注模式按鈕沒有 is-active 樣式時另呼叫 <code>setMode()<\/code>。<\/li><li>倍率線型（共用，併入 Simulation 面板）：該次模擬每局 <code>lineMultiplier<\/code> 的標準 64 區間分布，X 軸逐一標出 (下限, 上限]，Y 軸 NB／EB 1%、BF 20%，超過上限或為 0 的區間不畫點、線在該處斷開。沒有 Simulation 面板的頁面才在 Set RNG 上方顯示即時線型（NB 一局含 FG 結束時呼叫 <code>window.demogameLineChart?.record(該局總得分 ÷ 底注)<\/code>；批次模擬不得呼叫）。<\/li><\/ul>\n<p>Set RNG 的各欄位（卡片區間、遊戲專屬選單、RNG）互斥：設定其中一個時其他回到預設（共用模組處理）。所有設定都每局沿用，按重置才清空，遊戲不得在 Spin、FG、切換模式後自行清掉。指定值要檢查格式；不得因指定 RNG 進入無限重跑。<\/p>\n<p><strong>Set RNG（共用，<code>#set-rng-panel<\/code>）<\/strong>：欄位排成一列等寬（卡片 BG 區間、遊戲專屬選單、RNG <code>#rngInput<\/code>、重置 <code>#setRngResetBtn<\/code>）。<\/p>\n<p><strong>可重現 RNG（共用 <code>window.demogameRng<\/code>）<\/strong>：每局（BG＋整場 FG）以一組 32-bit 種子算出；Log 印一行 <code>RNG &lt;Config-Profile&gt;/&lt;NB|EB|BF|SF&gt;/&lt;on|off&gt;/&lt;選項|-&gt;/&lt;種子 8 碼&gt;<\/code>，點一下複製並填入 RNG 欄，按 Spin 整局重跑出相同結果。遊戲在每局開始呼叫 <code>demogameRng.takeInput()<\/code> 取碼、用 <code>demogameRng.run(seed, fn)<\/code> 一次算完整局結果（表演用亂數放在外面），選項欄放重現所需的遊戲專屬設定（例：腳本名稱、<code>r&lt;卡片區間&gt;<\/code>）。<\/p>\n<h2 id=\"6-與-simulator-對帳\">6. 與 Simulator 對帳<\/h2>\n<p>至少準備下列可重現案例：無獎 BG、一般得分、Wild／Scatter、Cascade／Multiplier、FG Trigger／Retrigger、各 Bet Mode、Newbie、Oldhand 小／中／大 Bet、Link 可用／不可用、Card System range／free_game／Retry、Max Win 截斷及遊戲專屬 Feature。<\/p>\n<p>逐項確認盤面、RNG、各段得分、Total Win、Coin In、倍率、Feature 狀態與 Retry 計數一致。<\/p>\n<h2 id=\"7-交付檢查\">7. 交付檢查<\/h2>\n<p>Demogame 的「版本紀錄」（<code>#change-log-wrap<\/code>，Debug Mode 開啟時顯示）是專案根目錄 <code>修改紀錄.md<\/code> 的複本，只說明各版本的<strong>調性差異<\/strong>：<\/p>\n<ul><li>格式同 <a href=\"#\" class=\"tab-link\" data-tab=\"outputs\" data-anchor=\"2-修改紀錄格式\">產出與紀錄規範 第 2 節<\/a>：依四碼版本分節、新到舊，列出全部版本；每個版本一個 <code>&lt;article class=\"change-log-entry\"&gt;<\/code>，標題 <code>&lt;h4&gt;v&lt;第 1 碼&gt;（&lt;四碼版本&gt;）&lt;/h4&gt;<\/code>，內文 <code>&lt;ol&gt;<\/code> 編號清單，項目與 <code>修改紀錄.md<\/code> 相同（同一版本內由舊到新、句尾附 <code>（MM/DD）<\/code>）。設定區目前選的版本那一節由共用模組標示。<\/li><li>每次 <code>修改紀錄.md<\/code> 新增或修改項目，同一次修改中同步更新 <code>#changeLogBody<\/code>。<\/li><li>沒有任何調性紀錄時（<code>修改紀錄.md<\/code> 只有標題），<code>#changeLogBody<\/code> 留空，共用模組會把整個版本紀錄區隱藏；不得用「現行版本」「細節無紀錄」之類的佔位項目充數。<\/li><li>通則：沒有內容的區域一律不顯示（特殊指標、版本紀錄、空的 Set RNG 容器等由共用模組自動隱藏）。<\/li><li>盤面上方狀態列最前面固定顯示 Base Game／Free Game 標籤（中文：基礎遊戲／免費遊戲），由共用模組依 <code>body.fg-mode<\/code> 切換，所以狀態列一律顯示；遊戲進入 FG 時必須在 <code>body<\/code> 加上 <code>fg-mode<\/code>。狀態列由共用模組統一配色，各遊戲不另設：場景標籤（Base Game、Free Game、Buy Feature、Super Feature 等，含特色狀態顯示的場景名稱）用深藍底、淺藍字膠囊；其他資訊（連消、倍數、FG 剩餘、Table 等）一律用黃色膠囊（淡黃底、黃字 12px）；膠囊都不加外框。<\/li><li>Demogame 介面、演出、Debug、共用模組與文件的修改<strong>不記在頁面上<\/strong>（以 git commit 訊息為準），也不寫進 <code>修改紀錄.md<\/code>。<\/li><\/ul>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 離線開啟無錯誤，Console 無未處理例外。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 「版本紀錄」（<code>#changeLogBody<\/code>）與 <code>修改紀錄.md<\/code> 內容一致（依版本分節、新到舊、只記調性）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>demogame_common.css<\/code> 與 <code>demogame_common.js<\/code> 由 <code>../<\/code> 相對路徑載入，且共用功能未複製進遊戲專屬程式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 圖示範圍內的標題、Feature Status、盤面、動畫與 Message 屬 By Game；其餘 UI 使用共用資源。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> By Game CSS／JavaScript 未覆寫或複製共用區域的版面與控制邏輯。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 符號顯示符合 2.3：Image 開＝只顯示圖（無代號、無符號框），Image 關或無美術＝符號框＋代號；代號不粗體；有美術的遊戲已接共用 Image 開關。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 有符號美術時：<code>DEMOGAME_IMAGE_TOGGLE.images<\/code> 列出全部圖片（含大符號、金框等變體），以本機伺服器開啟確認 <code>window.__demogameImageCache<\/code> 張數等於清單、全部 <code>naturalWidth &gt; 0<\/code>、載入遮罩已消失；Demo 引用的圖片皆為 <code>.webp<\/code>，無 <code>.png<\/code> 引用。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補牌方式已選定為原地、掉落或特殊補牌，並與 Game Rule、Config、Simulator 一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 原地補牌不移動保留符號；掉落補牌正確區分 Settle 與新符號 Drop。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 切換後所有資料與顯示同步更新。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有支援的 Bet Mode 均可完成完整流程。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System Off／On、Newbie、Oldhand 小／中／大 Bet 與 Link 資格行為正確。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Debug 資訊足以重現並與 Simulator 對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Demo 統計口徑與模擬報表一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 不存在寫死的舊遊戲名稱、倍率、Table、輪帶或 Help。<\/li><\/ul>\n<h2 id=\"8-demo-版-rtp-120\">8. Demo 版 RTP 120%<\/h2>\n<p>Demo 網頁（展示、試玩）用的卡片權重，RTP 120%。規則依數學模型規範 §1.5.3，本節是操作方式。<\/p>\n<ul><li><strong>來源<\/strong>：只用<strong>老手中 Bet<\/strong>（92A）一套衍生；<strong>不分大小 Bet、新老手、A／B 版<\/strong>，新手直接複製老手（含倍數上限）。<\/li><li><strong>NB／EB<\/strong>：差額 <code>120% − 92%<\/code> 一半加在 BG <code>(25, 30]<\/code>、一半提高 FG 觸發卡權重（縮短 FG 週期），兩者都從 <code>(-1, 0]<\/code> 扣；FG 倍率區間不動。觸發把本身的 BG 得分會一起變多，要先從 BG 補足量扣掉。EB 以 NB 基準成本換算（EB 2x 時補足量 ×2）。<\/li><li><strong>BF／SF<\/strong>：平均倍數拉到 <code>購買價 × 120%<\/code>；購買價以上（贏錢）的區間等比例升、以下（賠錢）的區間等比例降，各段形狀不變。<\/li><li><strong>不跑模擬驗證<\/strong>：以卡片權重精算即可。<\/li><li><strong>不升版號、不記修改紀錄<\/strong>：屬 Demo 用參數，不是數學調性。<\/li><li><strong>檔案<\/strong>：出工作簿與 config，不做 PARsheet、報表。<ul><li>工作簿 <code>Source/&lt;MathID&gt;1120_Demo.xlsx<\/code>（例 <code>H0451120_Demo.xlsx<\/code>）：複製 92A 工作簿改 Multiplier_Weight，新手欄＝老手欄（含 Avg_Multi、Nature_Prob），Overview 型號改同檔名、Pay Back 區塊重算；區間平均用 Avg_Multi 精算。存檔後跑 <code>_check_xlsx_style.py<\/code>。<\/li><li><code>config_120A_Demo.js<\/code> 由工作簿轉出，放遊戲根目錄；<code>config_code<\/code>／<code>rtp_label<\/code> 為 <code>120A_Demo<\/code>，並加 <code>demo_only<\/code> 註記。<\/li><li>兩者都複製一份到 <code>Versions/&lt;目前版本&gt;/<\/code>（工作簿放 <code>Source/<\/code>），並加進 <code>Versions/version_manifest.js／.json<\/code> 目前版本的 <code>sources<\/code>／<code>configs<\/code>，Demo 選單顯示「120A Demo（RTP 120%）」；改 manifest 後要升 <code>index.html<\/code> 的 <code>?v=<\/code> 尾碼。<\/li><li>不交 SPS、不進送驗文件。<\/li><\/ul><\/li><li>例：H045 v6.0.0.3 — NB FG 週期 150 → 96.2 轉、EB 30 → 24.5 轉；BF 平均 46.25x → 60x、贏錢率 30% → 48.9%。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-proposal\" hidden><h1 id=\"提案報告規範\">提案報告規範<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集（Omniplay 產線），總覽、共通原則與完成條件見 <a href=\"#\" class=\"tab-link\" data-tab=\"overview\">_README.md<\/a>。<\/p>\n<p><strong>存放位置<\/strong>（總表見<a href=\"#\" class=\"tab-link\" data-tab=\"outputs\" data-anchor=\"3-專案目錄與存放位置\">產出與紀錄規範<\/a>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td>發想中遊戲（尚無 Game ID）的提案簡報<\/td><td><code>Slots/遊戲發想/&lt;遊戲名&gt;/提案/<\/code><\/td><\/tr><tr><td>已有 Game ID 的遊戲的提案簡報<\/td><td><code>Slots/H0xx_遊戲名稱/其他/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-用途與範圍\">1. 用途與範圍<\/h2>\n<p>提案報告（遊戲提案說明簡報）用於向內部或客戶說明一款遊戲的玩法、規格、特色與競品差異，適用於遊戲發想與正式專案。<\/p>\n<ul><li><strong>版式直接參考指定的過去簡報修改<\/strong>，不另訂版面規則；沒有指定時用 <code>JB 工作區/game_spec/101026_Super Neko/04_客戶提案/SUPER_NEKO_提案說明_v16.pptx<\/code>。<\/li><li>範例：<code>Slots/遊戲發想/急速糖果 2/提案/CANDY_RUSH_2_提案說明_v01.pptx<\/code>。<\/li><\/ul>\n<h2 id=\"2-檔案\">2. 檔案<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>格式<\/td><td><code>.pptx<\/code>，16:9<\/td><\/tr><tr><td>檔名<\/td><td><code>{英文遊戲名大寫，空格改底線}_提案說明_v{兩位數版本}.pptx<\/code>，例：<code>CANDY_RUSH_2_提案說明_v01.pptx<\/code><\/td><\/tr><tr><td>版本<\/td><td>內容每次修改版本 +1，舊版保留不覆蓋<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"3-章節結構\">3. 章節結構<\/h2>\n<p>章節名稱與順序固定。中文標題不加編號；右上頁碼用兩位數章節號（<code>01<\/code>～<code>08<\/code>），同一章的多頁沿用該章頁碼。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁碼<\/th><th>英文小標<\/th><th>章節<\/th><th>必要內容<\/th><\/tr><\/thead><tbody><tr><td>—<\/td><td>—<\/td><td>封面<\/td><td>英文遊戲名、中文遊戲名、三個賣點標籤、<code>遊戲提案說明 · 遊戲代號 · 規則基底／數學 · JumboRD<\/code><\/td><\/tr><tr><td>01<\/td><td>OVERVIEW<\/td><td>遊戲概述<\/td><td>簡單說明玩法與核心特色：主題與定位一句話、核心特色、demo 主畫面<\/td><\/tr><tr><td>02<\/td><td>GAME SPEC<\/td><td>遊戲規格一覽<\/td><td>只列規格，不說明怎麼玩：Line／Way 類型、盤面、押注模式、最大贏分／RTP 等<\/td><\/tr><tr><td>03<\/td><td>SYMBOLS<\/td><td>符號說明與賠付<\/td><td>符號種類（一般符號、特殊符號）與賠率表；註腳寫得分公式<\/td><\/tr><tr><td>03<\/td><td>ART REQUIREMENT<\/td><td>符號與美術需求（<strong>隱藏頁<\/strong>）<\/td><td>一般與特殊符號清單（代號、等級）、美術風格參考、其他需求（場景、Loading、大廳 Icon、特色演出）；<strong>一定要做，但設為隱藏投影片<\/strong>，簡報時不播放<\/td><\/tr><tr><td>04<\/td><td>CORE GAMEPLAY<\/td><td>核心玩法<\/td><td>逐項說明玩法要素；內容多時拆成多頁，每頁只講一個特色<\/td><\/tr><tr><td>05<\/td><td>FREE GAME<\/td><td>免費遊戲<\/td><td>觸發、FG 內規則（例：倍數累積或重置）、加局<\/td><\/tr><tr><td>06<\/td><td>GAME FLOW<\/td><td>遊戲流程圖<\/td><td>不要畫太細，只針對容易看不懂的地方畫流程<\/td><\/tr><tr><td>07<\/td><td>SPECIAL BET<\/td><td>特殊押注<\/td><td>Extra Bet、Buy Feature 等；有才放，每種押注一頁（例：3 種 EB、2 種 BF 拆成 5 頁）<\/td><\/tr><tr><td>08<\/td><td>VS. {競品}<\/td><td>與{競品}差異對照<\/td><td>一句話核心差異＋對照表（最右欄為本作）＋結論註腳<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td>Q&amp;A<\/td><td>待確認事項，寫成可決策的問題並標明對象（數學／PM／美術）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>主章節不可刪除；只有「特殊押注」在遊戲沒有 Extra Bet、Buy Feature 時整章省略，並在規格表寫「不提供」。<\/li><li>競品預設為規則基底遊戲；另有指定時依指定。<\/li><\/ul>\n<h2 id=\"4-內容規則\">4. 內容規則<\/h2>\n<ul><li><strong>規則與數值<\/strong>一律以 <code>game_rule.md<\/code> 與 Config 為準，不得出現與 Game Rule 不一致的內容。<\/li><li><strong>未定案的數值<\/strong>在數字後加 <code>*<\/code>，該頁註腳寫「* 為待確認數值」；尚未調校完成的 RTP、最大贏分寫「待數學訂定」，並列入 Q&amp;A。不得用 ⏳ 等 emoji（PowerPoint 會顯示成圖示）。<\/li><li><strong>文字精簡<\/strong>：每頁一句話主旨＋條列不超過 4～5 項，細節留在 Game Rule；賠率表欄位過多時只列代表欄，註腳註明完整賠率見 <code>game_rule.md<\/code>。<\/li><li><strong>demo 截圖<\/strong>一律從該遊戲 Demogame 擷取，不用示意繪圖代替：<ul><li>用 Debug 的 RNG Seed 重現指定局、逐幀停在要展示的瞬間，以 2 倍解析度擷取，確保可重現。<\/li><li>只取 By Game 區域（Feature Status＋盤面＋盤面訊息），不得帶到 Debug 面板；Stats 不得出現誤導數字（需要時用全新頁面跑單局）。<\/li><li>每張截圖附一行圖說，說明畫面重點。<\/li><\/ul><\/li><\/ul>\n<h2 id=\"5-製作與檢查\">5. 製作與檢查<\/h2>\n<ul><li>建議以 <code>pptxgenjs<\/code> 產生（版面以程式定義，方便改版重建）；產生腳本與暫存截圖放暫存區，專案內只保留最終 <code>.pptx<\/code>。<\/li><li>交付前檢查：<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 章節與頁碼符合第 3 節，「符號與美術需求」頁已設為隱藏。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 規則、數值、截圖符合第 4 節。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 以 PowerPoint 匯出圖片逐頁目視：沒有文字溢出、元件重疊。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 檔名、版本符合第 2 節，pptx 技能的 <code>validate.py<\/code> 通過。<\/li><\/ul><\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['overview', 'gamerule', 'report', 'demoreport', 'outputs', 'sim', 'demo', 'proposal'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-flow">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>開發流程<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:999px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:620px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:52px; border-bottom:1px dashed var(--grid)}\n.tl-row:first-child .tl-track{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-bar.event{background:var(--s2); opacity:.85; height:16px; top:6px}\n.tl-label{position:absolute; top:24px; font-size:1em; color:var(--ink); white-space:nowrap}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n/* 嵌入入口時：頁首、頁籤、左側目錄由入口負責，這裡只留內文；藏拉條、仍可上下捲動 */\nhtml.embedded{scrollbar-width:none; -ms-overflow-style:none}\nhtml.embedded::-webkit-scrollbar{display:none}\nhtml.embedded body{background:transparent}\nhtml.embedded .wrap{max-width:none; padding:0}\nhtml.embedded header.page, html.embedded .tabs, html.embedded .toc,\nhtml.embedded .toc:not([hidden]):has(.toc-doc){display:none!important}\nhtml.embedded .body-row{display:block; padding:0}\nhtml.embedded main{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:26px 32px 60px}\nhtml.embedded .panel h1{color:var(--accent); font-weight:500; font-size:30px}\nhtml.embedded h2{color:var(--accent); border-bottom-color:var(--grid)}\n:root{--accent:#c8501e}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--accent:#e9773d}}\n:root[data-theme=\"dark\"]{--accent:#e9773d}\n@media (max-width:700px){html.embedded main{padding:18px 16px 40px}}\n<\/style>\n<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');<\/script>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"page\">\n  <div class=\"eyebrow\">iGaming · 開發流程<\/div>\n  <h1 class=\"site\">開發流程<\/h1>\n  <p class=\"meta\">由 <code>專案需知/開發流程/*.md<\/code> 產生（<code>_build_html.py<\/code>）　|　2026-10-29<\/p>\n<\/header>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"規範文件\"><button class=\"tab\" role=\"tab\" id=\"tab-g0\" data-tab=\"flow\" data-tabs=\"flow\" aria-selected=\"true\" tabindex=\"0\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"5\" r=\"2\"/><circle cx=\"6\" cy=\"19\" r=\"2\"/><circle cx=\"18\" cy=\"12\" r=\"2\"/><path d=\"M6 7v10\"/><path d=\"M6 12h4a4 4 0 0 0 4-4V7\"/><path d=\"M16 12h-2\"/><\/svg>開發流程<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-flow\"><a class=\"toc-2\" href=\"#1-基本原則\" data-tab=\"flow\">1. 基本原則<\/a><a class=\"toc-2\" href=\"#2-必要產出文件\" data-tab=\"flow\">2. 必要產出文件<\/a><a class=\"toc-2\" href=\"#3-八個步驟總覽\" data-tab=\"flow\">3. 八個步驟總覽<\/a><a class=\"toc-2\" href=\"#4-各步驟的產出與過關條件\" data-tab=\"flow\">4. 各步驟的產出與過關條件<\/a><a class=\"toc-3\" href=\"#41-檔案確認與檢查\" data-tab=\"flow\">4.1 檔案確認與檢查<\/a><a class=\"toc-3\" href=\"#42-工作進度表\" data-tab=\"flow\">4.2 工作進度表<\/a><a class=\"toc-2\" href=\"#5-各步驟怎麼做\" data-tab=\"flow\">5. 各步驟怎麼做<\/a><a class=\"toc-3\" href=\"#51-開案與數學目標確認\" data-tab=\"flow\">5.1 開案與數學目標確認<\/a><a class=\"toc-3\" href=\"#52-建立基礎數學模型\" data-tab=\"flow\">5.2 建立基礎數學模型<\/a><a class=\"toc-3\" href=\"#53-建立-rtpvariant-與-card-system\" data-tab=\"flow\">5.3 建立 RTP／Variant 與 Card System<\/a><a class=\"toc-3\" href=\"#54-轉檔與-config-驗證\" data-tab=\"flow\">5.4 轉檔與 Config 驗證<\/a><a class=\"toc-3\" href=\"#55-simulator-開發與-debug\" data-tab=\"flow\">5.5 Simulator 開發與 Debug<\/a><a class=\"toc-3\" href=\"#56-模擬順序\" data-tab=\"flow\">5.6 模擬順序<\/a><a class=\"toc-3\" href=\"#57-調參循環\" data-tab=\"flow\">5.7 調參循環<\/a><a class=\"toc-3\" href=\"#58-對帳與交付\" data-tab=\"flow\">5.8 對帳與交付<\/a><a class=\"toc-2\" href=\"#6-改了什麼要重跑什麼\" data-tab=\"flow\">6. 改了什麼要重跑什麼<\/a><a class=\"toc-2\" href=\"#7-禁止事項\" data-tab=\"flow\">7. 禁止事項<\/a><a class=\"toc-2\" href=\"#8-完成前檢查清單\" data-tab=\"flow\">8. 完成前檢查清單<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-flow\"><h1 id=\"slot-數學開發流程\">Slot 數學開發流程<\/h1>\n<p>本文件定義新 Slot 專案的<strong>數學開發流程、製作順序、操作方式、階段產物與完成條件<\/strong>。<\/p>\n<p>實作欄位、命名、版本、Card System、Simulator、Demogame、Config 與報表格式等細節，統一依照本資料夾的各規範文件（總覽見 _README.md）。本文件不重複定義實作規格；內容有差異時，以各規範文件為準。<\/p>\n<p>適用範圍：<code>Slots/H0xx_遊戲名稱/<\/code> 下的新遊戲數學模型、既有模型改版，以及 RTP、Card System、Feature 或 Bet Mode 參數調整。<\/p>\n<h2 id=\"1-基本原則\">1. 基本原則<\/h2>\n<p>過往專案可看到數種演進中的做法：<\/p>\n<ul><li>H013、H015、H019 使用 RTP Config、Simulator 與 Record 的基本流程。<\/li><li>H016、H028 已拆分基礎 <code>config.js<\/code> 與 RTP／Variant Config，並保留 <code>Versions/<\/code>，較符合目前標準。<\/li><li>H026 同時存在 92／94 與 A／B Variant，適合作為多模型組合的參考。<\/li><li>早期專案（H013～H027）曾使用 <code>xlsx_to_config.py<\/code>、<code>model_sync.py<\/code> 等轉檔腳本同步 Source 與程式資料；此做法已淘汰，Excel 與 Config 之間的轉換一律由 AI 執行，專案內不建立、不維護轉檔工具。<\/li><\/ul>\n<p>新專案採用以下統一原則：<\/p>\n<ol><li><code>game_rule.md<\/code> 定義玩法，數學 XLSX／<code>Source/<\/code> 定義正式參數。<\/li><li>Config 必須由 Source 轉出（轉換由 AI 執行，不建立轉檔工具），不直接手改轉出的參數。<\/li><li>Simulator 與 Demogame 使用同一份 Config。<\/li><li>先驗證 Card System Off 的自然機率，再驗證 Card System On。<\/li><li>每次調參都依「Source → 版本 → Config → Simulator → Record → 對帳」完整重跑。<\/li><li>舊專案若與目前命名、版本或報表格式不同，不直接複製舊格式；依現行規格建立。<\/li><li><code>game_rule.md<\/code> 是遊戲規則的正式來源，要寫明玩法、判獎順序、倍率口徑、Feature 流程與例外；數學模型、程式與 Help 都要與它一致，程式不可補猜未定義的規則。<\/li><li>同一項資料出現在多個檔案時，修改要同步更新並完成對帳。<\/li><li>未支援的 RTP、Variant、Bet Mode、Profile 或 Feature，不得出現在 Config、Simulator 批次或 Demogame 選單。<\/li><li>會影響結果分布、RTP、觸發率、最大獎或 Retry 的修改，都要更新版本並重新模擬。<\/li><\/ol>\n<h2 id=\"2-必要產出文件\">2. 必要產出文件<\/h2>\n<p>每個專案必須產出的文件與 <code>修改紀錄.md<\/code> 格式見產出與紀錄規範.md。<\/p>\n<h2 id=\"3-八個步驟總覽\">3. 八個步驟總覽<\/h2>\n<p>八個大步驟，每一步的工作、產出與進入下一步的條件見第 4 節：<\/p>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">提案<\/div><div class=\"step-desc\">整理玩法、規格、特色與競品差異，製作提案簡報<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">開案<\/div><div class=\"step-desc\">遊戲規格確認：Game Rule、數學目標、模型組合<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">數學開發<\/div><div class=\"step-desc\">模型製作 → 模擬程式 → Demogame<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">調性調整<\/div><div class=\"step-desc\">卡片權重校準、Card System 驗證、調參與正式模擬、數值報告<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">後端對接／報表驗證<\/div><div class=\"step-desc\">SPS 設定交付、後端報表驗證、挑腳本<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">6<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">文件製作<\/div><div class=\"step-desc\">數值文件、Help<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">7<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">文件檢查<\/div><div class=\"step-desc\">所有要交付給其他人的檔案逐項檢查，版本凍結<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">8<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">Demo 報告<\/div><div class=\"step-desc\">全部做完後整理設計重點、獨有巧思、製作困難與反饋<\/div><\/div><\/div><\/div>\n<h2 id=\"4-各步驟的產出與過關條件\">4. 各步驟的產出與過關條件<\/h2>\n<p>不得因為某個程式可以先寫就跳過前置規則。上一階段的完成條件成立後，才進入下一階段。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">順序<\/th><th>階段<\/th><th>主要工作<\/th><th>產出<\/th><th>進入下一階段的條件<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">1<\/td><td>提案<\/td><td>整理玩法、規格、特色與競品差異，製作提案簡報<\/td><td>提案簡報 <code>.pptx<\/code><\/td><td>提案通過、確定開案<\/td><\/tr><tr><td class=\"n\">2<\/td><td>開案（遊戲規格確認）<\/td><td>確認 Game ID、盤面、判獎、Bet Mode、Feature、RTP 拆分、Link 資格、Hit Rate、Max Win、Profile、押注層級與 Variant；<strong>與使用者確認數學模型組合<\/strong>（預設 92A／92B／94A／94B，各含 Newbie／Oldhand 與對應押注區）<\/td><td>已確認的 <code>game_rule.md<\/code>、數學目標表<\/td><td>核心規則、計算口徑與模型組合無待確認項目<\/td><\/tr><tr><td class=\"n\">3.1<\/td><td>數學開發：模型製作<\/td><td>基礎數學模型 → RTP／Variant 與 Card System 區間 → Mapping → 由 AI 轉出 Config<\/td><td><code>H0xx1.xlsx<\/code>、<code>H0xx1&lt;RTP&gt;&lt;Variant&gt;.xlsx<\/code>、<code>config*.js<\/code><\/td><td>自然機率可計算、理論上限已確認；Source、Config、版本逐項一致<\/td><\/tr><tr><td class=\"n\">3.2<\/td><td>數學開發：模擬程式<\/td><td>實作 Simulator；小場次 Debug 與單局驗證；Card System Off 大場次自然機率報表（NB 10⁹ 局、BF 10⁸ 局）<\/td><td><code>Simulator.py<\/code>、自然機率報表<\/td><td>固定 Seed 可重現；代表性案例符合 Game Rule；RTP Breakdown、Hit Rate、Feature 與分布合理<\/td><\/tr><tr><td class=\"n\">3.3<\/td><td>數學開發：Demogame<\/td><td>依 Config 製作可操作的 Demo，與 Simulator 單局對帳<\/td><td><code>index.html<\/code><\/td><td>Config、Simulator、Demogame 單局結果一致<\/td><\/tr><tr><td class=\"n\">4<\/td><td>調性調整<\/td><td>依自然機率報表校準卡片權重；Card System On 分 RTP／Variant／Profile／押注層級驗證；調參與正式大場次模擬；Max Win、Retry 與極值驗證；數值報告對標競品與前作<\/td><td>校準後的 <code>Multiplier_Weight<\/code> 與 Config、Card-On 報表、<code>數值報告_&lt;遊戲中文名&gt;<\/code><\/td><td>所有組合符合目標與誤差要求，調性經使用者確認<\/td><\/tr><tr><td class=\"n\">5<\/td><td>後端對接／報表驗證<\/td><td>交付 SPS <strong>Config 與模擬程式<\/strong>（不交數學模型、PARsheet）；讀後端報表驗證 RTP；<strong>挑腳本<\/strong><\/td><td>交給 SPS 的 <code>config*.js<\/code>、<code>Simulator.py<\/code>，後端報表彙整、腳本<\/td><td>後端報表與 Simulator 一致，腳本挑選完成<\/td><\/tr><tr><td class=\"n\">6<\/td><td>文件製作<\/td><td><strong>數值文件<\/strong>：<code>game_description.md<\/code>、PARsheet、Math Document Description；<strong>Help<\/strong>：<code>game_help_draft.md<\/code> → <code>{GameID}_Help.xlsx<\/code> → Game Description<\/td><td>各文件<\/td><td>文件內容與 Game Rule、數學模型一致<\/td><\/tr><tr><td class=\"n\">7<\/td><td>文件檢查<\/td><td>檢查<strong>所有要交付給其他人的檔案<\/strong>（Help、Game Description、Math Document Description、PARsheet、數學模型、Config、Simulator、Demogame、腳本）；版本凍結、整理 Record<\/td><td>檢查紀錄、完整專案目錄<\/td><td>本文件第 8 節全部通過<\/td><\/tr><tr><td class=\"n\">8<\/td><td>Demo 報告<\/td><td>全部做完後，整理這款遊戲的設計重點、跟競品不同的獨有巧思、製作過程的困難與反饋，並用數據佐證（見Demo報告規範）<\/td><td><code>demo_report_draft.md<\/code> → <code>其他/{英文遊戲名}_Demo報告_v01.pptx<\/code><\/td><td>使用者確認<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"41-檔案確認與檢查\">4.1 檔案確認與檢查<\/h3>\n<p><strong>每個階段結束前、每次把檔案交給其他人（SPS、PM、美術、送驗）前，都必須先做檔案確認與內容檢查<\/strong>；任一項不通過，不得進入下一階段，也不得交付。<\/p>\n<ul><li><strong>檔案確認<\/strong>：檔名、存放位置符合規範（見產出與紀錄規範第 3 節）；版本號與來源一致；是最新版，沒有舊版或暫存檔混在交付內容裡。<\/li><li><strong>內容檢查<\/strong>：依下表對應規範的檢查清單逐項確認，並把結果記在修改紀錄或交付說明。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>階段<\/th><th>要確認的檔案<\/th><th>內容檢查依據<\/th><\/tr><\/thead><tbody><tr><td>1 提案<\/td><td>提案簡報 <code>.pptx<\/code><\/td><td>提案報告規範.md 5 製作與檢查<\/td><\/tr><tr><td>2 開案<\/td><td><code>game_rule.md<\/code>、數學目標表<\/td><td>GameRule規範.md 3 交付檢查<\/td><\/tr><tr><td>3.1 模型製作<\/td><td>數學模型 <code>.xlsx<\/code>、<code>config*.js<\/code><\/td><td>數學模型規範.md；xlsx 依 math-model-xlsx-edit skill 跑 <code>_check_xlsx_style.py<\/code>；Source、Config、版本逐項比對<\/td><\/tr><tr><td>3.2 模擬程式<\/td><td><code>Simulator.py<\/code>、自然機率報表<\/td><td>模擬程式規範.md 2.5 最終交付檢查<\/td><\/tr><tr><td>3.3 Demogame<\/td><td><code>index.html<\/code>、共用 css／js<\/td><td>Demogame規範.md 7 交付檢查<\/td><\/tr><tr><td>4 調性調整<\/td><td>校準後的數學模型與 Config、Card-On 報表、數值報告<\/td><td>數學模型規範.md 2.7 合理性檢查；模擬結果符合目標（判定方式見模擬程式規範 §1.2.2）<\/td><\/tr><tr><td>5 後端對接／報表驗證<\/td><td>給 SPS 的 Config 與模擬程式、後端報表彙整、腳本<\/td><td>模擬程式規範.md 2.5 最終交付檢查；壓測說明書.md 3.5、後端報表.md 6、腳本規範.md 6 檢查清單<\/td><\/tr><tr><td>6 文件製作<\/td><td>Help、Game Description、Math Document Description、PARsheet、<code>game_description.md<\/code><\/td><td>數學文件規範.md 1.5、2.3 交付檢查與 PARsheet 交付前檢查；送驗文件規範.md 7 送驗前檢查清單<\/td><\/tr><tr><td>7 文件檢查<\/td><td>所有要交付給其他人的檔案<\/td><td>以上各階段檢查全部重跑一次；本文件第 8 節完成前檢查清單<\/td><\/tr><tr><td>8 Demo 報告<\/td><td><code>demo_report_draft.md<\/code>、Demo 報告 <code>.pptx<\/code><\/td><td>Demo報告規範：每個設計點都有原因與數據佐證；反饋與線上數據註明來源與日期<\/td><\/tr><\/tbody><\/table><\/div>\n<p>各階段的實作要求請查閱：<\/p>\n<ul><li>提案：提案報告規範.md<\/li><li>後端對接／報表驗證：後端報表.md、壓測說明書.md；挑腳本：腳本規範.md<\/li><li>數學文件、模型命名、版本與 RTP：數學模型規範.md<\/li><li>Card System：數學模型規範.md<\/li><li>Simulator、BATCH_RUNS、Console 與 Record：模擬程式規範.md<\/li><li>Demogame 與單局對帳：Demogame規範.md<\/li><li>Config、轉檔與版本歷史：模擬程式規範.md<\/li><li>Game Rule：GameRule規範.md；Help、Game Description：數學文件規範.md；Game List：送驗文件規範.md<\/li><li>送驗文件（Game Description DOCX、Math Document Description、數學模型送驗版）：送驗文件規範.md<\/li><\/ul>\n<h3 id=\"42-工作進度表\">4.2 工作進度表<\/h3>\n<p>每款遊戲在專案根目錄放 <code>進度.md<\/code>，記錄上表各階段工項的完成狀態；每次開啟該遊戲的工作 Session，先顯示進度條再開始工作。<\/p>\n<pre><code>py 專案需知/其他/progress.py H045<\/code><\/pre>\n<ul><li>遊戲還沒有 <code>進度.md<\/code> 時，腳本依預設工項建立（工項取自上表各階段的產出）；之後<strong>依遊戲自行增刪工項<\/strong>，以 <code>進度.md<\/code> 為準。<\/li><li>狀態欄：空白＝未完成；<strong><code>ok<\/code>＝使用者確認完成<\/strong>（只有使用者確認後才可標 ok）；完成後若再調整，同一列依序改為 <code>v2<\/code>、<code>v3<\/code>…。<\/li><li>紀錄欄依序附日期與內容，例：<code>ok 2026-10-16；v2 2026-10-20 調整 BG 權重<\/code>；不刪舊紀錄。<\/li><li>進度條＝有狀態的工項數 ÷ 全部工項數；腳本另列出下一個未完成的工項。<\/li><\/ul>\n<h2 id=\"5-各步驟怎麼做\">5. 各步驟怎麼做<\/h2>\n<h3 id=\"51-開案與數學目標確認\">5.1 開案與數學目標確認<\/h3>\n<ol><li>建立 <code>H0xx_遊戲名稱/<\/code> 專案資料夾。<\/li><li>讀取並確認 <code>game_rule.md<\/code>。<\/li><li><strong>與使用者確認本專案的數學模型組合<\/strong>——每款遊戲的數學模型都不一樣，不得逕自沿用他款設定。未特別說明時，預設組合為：<ul><li>A／B 兩個 Variant × 92／94 兩個 RTP，乘開共 <strong>4 個版本<\/strong>（92A、92B、94A、94B）。<\/li><li>每個版本都有 Newbie／Oldhand 兩種 Profile。<\/li><li>各版本依其支援內容有對應的押注區（Oldhand 小／中／大 Bet 層級）。<\/li><\/ul><\/li><li>列出所有正式支援組合：RTP、Variant、Profile、Oldhand 小／中／大 Bet、NB／EB 或 BF／SF 模式類別、Bet Mode、Card System Off／On。<\/li><li>為每個組合定義 Link／Bonus Game／Game RTP、Total RTP、Link 資格、Hit Rate、Feature Frequency、BG／FG Max Multiplier 與其他遊戲專屬指標。<\/li><li>將未決定的判獎順序、倍率分母、Feature 上限與例外退回確認；未確認前不製作正式模型。<\/li><\/ol>\n<h3 id=\"52-建立基礎數學模型\">5.2 建立基礎數學模型<\/h3>\n<ol><li>先完成 Base Game，再依狀態順序完成 Feature。<\/li><li>建立 Symbol、Paytable、Reel Strip／Weight、Table 與 Bet Mode。<\/li><li>建立 BG、FG、Cascade、Multiplier、Retrigger、Jackpot 等流程。<\/li><li>計算 RTP Breakdown 與理論 Max Win，不只計算 Total RTP。<\/li><li>建立基礎數學 XLSX，版本依規格使用 1 碼。<\/li><\/ol>\n<h3 id=\"53-建立-rtpvariant-與-card-system\">5.3 建立 RTP／Variant 與 Card System<\/h3>\n<ol><li>只建立 5.1 與使用者確認過的 92／94、A／B 組合（未特別說明時為 92A、92B、94A、94B 四版本，各含 Newbie／Oldhand 與對應押注區）。<\/li><li>A／B 表示數學 Variant，不表示 Newbie／Oldhand。<\/li><li>依 Profile、Oldhand 小／中／大 Bet 與 Bet Mode 建立 BG／FG 卡片區間及權重；NB／EB 以實際模式押注、BF／SF 以 Feature 基礎押注選擇層級。<\/li><li>確認每張正權重卡片的區間可達，並定義 Retry 行為。<\/li><li>建立 RTP／Variant XLSX，版本依規格使用四段格式。<\/li><\/ol>\n<h3 id=\"54-轉檔與-config-驗證\">5.4 轉檔與 Config 驗證<\/h3>\n<ol><li>在數學模型的 <code>Game Description<\/code> 工作表記錄每項 Config 資料的來源。<\/li><li>由 AI 依 Source 與 Mapping 轉出 Config；專案內不建立、不維護 Excel↔Config 轉檔工具。<\/li><li>執行欄位、型別、陣列長度、ID、Weight、Min／Max、版本與模式驗證。<\/li><li>比較轉檔前後資料，確認 Config 可由 Source 重建且沒有非預期差異。<\/li><li>轉檔錯誤時修正 Source 或 Mapping 後重新轉出，不直接修改 Config 大型陣列。<\/li><\/ol>\n<h3 id=\"55-simulator-開發與-debug\">5.5 Simulator 開發與 Debug<\/h3>\n<ol><li>先完成自然機率核心，再加入 Card System 篩選與 Retry。<\/li><li>讓 Simulator 直接讀取正式 Config，不另寫一份參數。<\/li><li>建立固定 Seed、單執行緒與逐局 Trace 模式。<\/li><li>建立強制／指定案例，驗證無獎、一般獎、Wild、Scatter、Feature、Retrigger、倍率與封頂。<\/li><li>小場次確認正確後，再加入 Numba、多執行緒、BATCH_RUNS 與 Excel 報表。<\/li><\/ol>\n<h3 id=\"56-模擬順序\">5.6 模擬順序<\/h3>\n<p>模擬必須依下列順序執行：<\/p>\n<ol><li>小場次、Card System Off：驗證流程與報表。<\/li><li>中場次、Card System Off：確認自然機率 RTP 與分布。<\/li><li>大場次、Card System Off：以 NB 10⁹ 局（BF 為 10⁸ 局）產出自然機率正式報表。<\/li><li>卡片權重調性校準：依上一步報表分配各得分區間的卡片權重，使分布、RTP 拆分與 FG 週期符合目標遊戲調性；完成後才進入 Card System On。<\/li><li>小場次、Card System On：確認抽卡、Profile、Oldhand 押注層級、Link 資格、倍率上限、Mode 與 Retry。<\/li><li>中場次、Card System On：調整區間、權重與目標 RTP。<\/li><li>所有正式組合的大場次模擬。<\/li><li>Max Win、低機率 Feature 與 Retry 邊界的專項驗證。<\/li><\/ol>\n<p>最低批次矩陣：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類型<\/th><th>RTP／Variant<\/th><th>Profile<\/th><th><code>bet_tier_amount<\/code><\/th><th>Bet Mode<\/th><th>Card System<\/th><\/tr><\/thead><tbody><tr><td>自然機率基準<\/td><td>基礎 Config<\/td><td>不適用<\/td><td>各門檻所需代表值<\/td><td>每個支援 Mode<\/td><td>Off<\/td><\/tr><tr><td>Newbie<\/td><td>每個正式 RTP／Variant<\/td><td>Newbie<\/td><td>不分層級，但仍記錄判定金額<\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><tr><td>Oldhand 小 Bet<\/td><td>每個正式 <code>94x<\/code>／Variant<\/td><td>Oldhand<\/td><td><code>&lt; $2<\/code>，至少驗證 <code>$1.99<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><tr><td>Oldhand 中 Bet<\/td><td>每個正式 <code>92x<\/code>／Variant<\/td><td>Oldhand<\/td><td><code>$2～$100<\/code>，至少驗證 <code>$2<\/code>、<code>$100<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><tr><td>Oldhand 大 Bet<\/td><td>每個正式 <code>92x<\/code>／Variant<\/td><td>Oldhand<\/td><td><code>&gt; $100<\/code>，至少驗證 <code>$100.01<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 的 <code>bet_tier_amount<\/code> 使用實際模式押注金額；BF／SF 使用 Feature 購買價格除以 Feature Price 倍數後的基礎押注。<\/li><li>若遊戲支援 EB 2x，至少驗證 base bet <code>$1<\/code> 會以 <code>$2<\/code> 判為中 Bet。<\/li><li>若遊戲支援 BF 75x，至少驗證購買 <code>$75<\/code> 判為小 Bet、購買 <code>$150<\/code> 判為中 Bet。<\/li><\/ul>\n<p>不存在的 Mode、Profile 或 Variant 不建立空批次，也不以全零結果冒充驗證完成。<\/p>\n<h3 id=\"57-調參循環\">5.7 調參循環<\/h3>\n<p>每一次調參都執行完整循環：<\/p>\n<pre><code>確認差距與原因\n    ↓\n修改對應 Source XLSX\n    ↓\n依異動內容更新版本\n    ↓\n重新產生 Config\n    ↓\n執行轉檔與資料驗證\n    ↓\n先跑小場次確認流程\n    ↓\n再跑中／大場次確認統計\n    ↓\n保存新 Record 並與前版比較<\/code><\/pre>\n<p>調參時依序判斷：<\/p>\n<ol><li>先確認程式與統計口徑是否錯誤。<\/li><li>再檢查自然機率的 Paytable、Reel、Table、Feature。<\/li><li>最後才調整 Card System 區間與權重。<\/li><li>不得只為讓 Total RTP 接近目標而忽略 RTP Breakdown、Hit Rate、Feature Frequency、分布或 Retry。<\/li><\/ol>\n<h3 id=\"58-對帳與交付\">5.8 對帳與交付<\/h3>\n<p>卡片權重完成後出數值報告（數值報告規範）；全部做完（第 7 步文件檢查通過）後出 Demo 報告（Demo報告規範）。<\/p>\n<ol><li>選定可重現的代表性 RNG／Seed。<\/li><li>逐項核對 Config、Simulator 與 Demogame 的盤面、判獎、Feature、倍率、Total Win、Coin In 與 Retry。<\/li><li>完成所有正式組合的最新 Record。<\/li><li>將正式 Config 與歷史版本關係寫入 <code>Versions/<\/code> 與 manifest。<\/li><li>確認產出與紀錄規範第 1 節的必要產出文件全部齊備且為同一正式版本。<\/li><li>清除暫存檔、舊測試輸出及不屬於正式交付的檔案。<\/li><li>依第 8 節完成最終驗收。<\/li><\/ol>\n<p><strong>交付 SPS 打包<\/strong>（第 5 步後端對接；2026-10-22，以 H020 超級寶石為範例）<\/p>\n<ul><li>放在 <code>其他/To SPS/<\/code>，每次交付打成<strong>一個 zip<\/strong>：<code>&lt;GameID&gt;_&lt;RTP／Variant 四碼版本去點&gt;.zip<\/code>（例：<code>101007_2220.zip<\/code>＝2.2.2.0、<code>101015_6000.zip<\/code>＝6.0.0.0）。<\/li><li>zip 內只放：<code>config.js<\/code>、該遊戲所有 <code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code>、<code>Simulator.py<\/code>、<code>給SPS說明_&lt;四碼版本&gt;.txt<\/code>；不放數學模型 XLSX、PARsheet、報表、json。<\/li><li><code>給SPS說明_&lt;版本&gt;.txt<\/code> 寫：與上一個交付版本的差異（基礎數學、規則／程式要後端同步的地方、卡片權重）、驗證目標與我方 Card-On 結果（判定見模擬程式規範 §1.2.2）。<\/li><li>舊版 zip 保留不刪（追溯用）；<code>To SPS/<\/code> 內不留散檔，只放各版 zip。<\/li><li>驗證結果確定後才打包；打包後重新交付須換新版本號，不得覆寫已交付的 zip。<\/li><\/ul>\n<p><strong>挑 BF 腳本：提供累積權重範圍<\/strong>（第 5 步挑腳本；2026-10-28，以 H045 超級鑽石為範例）<\/p>\n<ul><li>挑腳本階段<strong>不改數學模型<\/strong>，只讀現行 <code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code> 的 Card System。<\/li><li>主動提供<strong>最接近 BF 平均倍數的兩個區間<\/strong>：BF 平均倍數 ≈ 購買價 × BF RTP 目標（例：H045 為 50 × 92.5% ≈ 46x → <code>(40, 45]<\/code>、<code>(45, 50]<\/code>）。<\/li><li>每個區間<strong>只給一個數字<\/strong>（骰 0～總權重 − 1 的累積權重值），<strong>數字不加千分位逗號<\/strong>。<\/li><li>數字的算法：依 config 卡片順序從 0 累加，某區間的範圍＝<code>[前面所有卡權重加總, 前面加總＋本格權重 − 1]<\/code>，骰到範圍內就開該區間（與 Simulator <code>pick_card<\/code> 相同）。<\/li><li>取同系列（例：A 版 92A／94A／92A_Bet100、B 版同理）各份範圍的<strong>交集中點<\/strong>，一個數字各份都開同一區間、一個腳本通用；沒有交集才分模型各給一個（取各自範圍中點），並註明。<\/li><li>新手卡片若與老手相同要註明。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>系列<\/th><th><code>(40, 45]<\/code><\/th><th><code>(45, 50]<\/code><\/th><\/tr><\/thead><tbody><tr><td>A 版（92A／94A／92A_Bet100）<\/td><td>628507828<\/td><td>669663120<\/td><\/tr><\/tbody><\/table><\/div>\n<p>（H045 v6.0.0.3 老手 BF，總權重 10 億）<\/p>\n<h2 id=\"6-改了什麼要重跑什麼\">6. 改了什麼要重跑什麼<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>異動<\/th><th>必做流程<\/th><\/tr><\/thead><tbody><tr><td>Paytable、Reel、Table、Feature、Bet Mode、判獎<\/td><td>更新基礎 XLSX與版本 → 同步受影響 RTP／Variant → 轉 Config → 全部受影響批次重跑 → Demogame 對帳<\/td><\/tr><tr><td>Card System 區間或權重<\/td><td>更新受影響 RTP／Variant XLSX 第 2 碼 → 轉 Config → Card System On 批次重跑 → 檢查占比與 Retry<\/td><\/tr><tr><td>SCR<\/td><td>更新受影響 RTP／Variant XLSX 第 3 碼 → 轉 Config → 重跑 SCR 相關批次<\/td><\/tr><tr><td>文件、說明或排版<\/td><td>依規格更新第 4 碼；若不影響執行結果，不沿用舊版號產生新正式報表<\/td><\/tr><tr><td>Simulator 數學邏輯<\/td><td>修正程式 → 固定 Seed 回歸 → 小場次 → 所有受影響正式批次 → Demogame 對帳<\/td><\/tr><tr><td>報表或顯示邏輯<\/td><td>驗證統計來源未變 → 核對 Console 與 Excel → 依影響範圍重產報表<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"7-禁止事項\">7. 禁止事項<\/h2>\n<ul><li>未確認 Game Rule 就自行補猜核心數學規則。<\/li><li>直接修改由 XLSX 產生的 Config 參數來避開轉檔。<\/li><li>建立或保留 Excel↔Config、Config↔Excel 的轉檔工具；轉換一律由 AI 執行。<\/li><li>Simulator、Demogame 與 Config 各維護一套參數。<\/li><li>只跑 Card System On，不保留自然機率基準。<\/li><li>只驗證 Total RTP，不驗證 RTP Breakdown、分布、Feature 與 Retry。<\/li><li>Card System Retry 時重抽目標卡、重複扣款或污染場次統計。<\/li><li>未升版就覆寫正式 XLSX、Config 或 Record。<\/li><li>建立產品未使用的空白 B Variant、Mode 或 Profile。<\/li><li>直接複製舊專案的不相容命名、版本、報表欄位或遊戲專屬統計。<\/li><li>用全零欄位表示不存在或尚未驗證的功能。<\/li><\/ul>\n<h2 id=\"8-完成前檢查清單\">8. 完成前檢查清單<\/h2>\n<p>以下條件全部成立，數學開發才算完成：<\/p>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 的核心流程、判獎、倍率、Feature 與例外均已確認。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個正式 RTP、Variant、Profile、Oldhand 小／中／大 Bet 與 Bet Mode 都有明確目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個付費遊戲組合均驗證 Link／Bonus Game／Game RTP、Total RTP、Link 資格及 BG／FG Max Multiplier。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> BF／SF 分開驗證 Newbie、Oldhand 小 Bet、Oldhand 中 Bet 與 Oldhand 大 Bet，Total RTP 均為 96.50%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 基礎與 RTP／Variant XLSX 的命名及版本正確。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 可由 Source 完整重建，Mapping 可追溯。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Source、Config、Simulator、Demogame 與 Record 使用同一正式版本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 固定 Seed 可重現相同結果。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System Off 的自然機率基準已完成，且大場次正式報表為 NB 10⁹ 局（BF 10⁸ 局）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 卡片權重已依自然機率大場次報表校準至目標遊戲調性。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System On 的所有正式組合已完成。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> RTP、RTP Breakdown、Hit Rate、Feature Frequency 與分布符合目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card 權重占比合理，Retry Limit Exceeded 為零或已有核准處理方式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Max Win、封頂及理論可達路徑已驗證。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Console 與 Record 報表內容及統計口徑一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 代表性單局已完成 Config、Simulator、Demogame 三方對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 最新正式 Record 已保存，歷史版本未被覆寫。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 產出與紀錄規範第 1 節的必要產出文件全部齊備：<code>game_rule.md<\/code>、<code>game_help_draft.md<\/code>／<code>{GameID}_Help.xlsx<\/code>、<code>game_description.md<\/code>、數學模型／PARsheet、<code>config.js<\/code>、<code>Simulator.py<\/code>、<code>index.html<\/code>、<code>數值報告_&lt;遊戲中文名&gt;.md<\/code>＋<code>.html<\/code>、<code>注意事項.md<\/code>、<code>{GameID}_Game Description.docx<\/code>、<code>{GameID}_Math Document Description.md<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 暫存檔、快取與測試輸出未列入正式交付。<\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['flow'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

}
function openSite(key, tab, anchor) {
  if (!SITES[key]) key = KEYS[0];
  var groups = SITES[key].meta.groups || [];
  cur = { key: key, tab: tab || (groups[0] ? groups[0][1][0] : null), anchor: anchor || '' };
  frame.onload = function () { if (cur.tab) frame.contentWindow.postMessage({ goTab: cur.tab, goAnchor: cur.anchor }, '*'); };
  var doc = document.getElementById('doc-' + key);
  if (doc) { frame.removeAttribute('src'); frame.srcdoc = JSON.parse(doc.textContent); }
  else { frame.removeAttribute('srcdoc'); frame.src = SITES[key].src; }
  markNav(); renderToc(); setHash();
}
document.querySelector('.nav') && document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
</body>
