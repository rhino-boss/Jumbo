<h4 id=\"151-link-資格\">1.5.1 Link 資格<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>級距<\/td><td>Grand、Major 兩層累積彩池<\/td><\/tr><tr><td>Link RTP<\/td><td><strong>2%<\/strong>，92／94／96 三版相同（第 1.4 節的 Progressive）<\/td><\/tr><tr><td>資格<\/td><td>見下表；<strong>不分押注大小<\/strong>，系統不依押注金額擋<\/td><\/tr><tr><td>幣別<\/td><td>GC、SC 是否各自一組彩池待確認（第 2 章）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>可拉 Link<\/th><th>可滾 Inrc<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>老手<\/td><td>是<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 與 BF／SF 都適用上表；新手的押注照樣滾入彩池，但不能中彩，所以新手 Progressive 為 0%。<\/li><li>彩金參數由系統層設定，數學模型不得寫死在輪帶或 Paytable；模型只負責 Game RTP，並在 <code>Game Description<\/code> 記錄採用的彩金參數版本。<\/li><\/ul>\n<h4 id=\"152-link-彩金配置\">1.5.2 Link 彩金配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>幣別<\/th><th>級距<\/th><th class=\"n\">初始金額<\/th><th class=\"n\">Startup%<\/th><th class=\"n\">Increment<\/th><th class=\"n\">RTP<\/th><\/tr><\/thead><tbody><tr><td>SC<\/td><td>Grand<\/td><td class=\"n\">100,000 SC<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>SC<\/td><td>Major<\/td><td class=\"n\">20,000 SC<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>GC<\/td><td>Grand<\/td><td class=\"n\">10,000,000 GC<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>GC<\/td><td>Major<\/td><td class=\"n\">2,000,000 GC<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>有 Link 的遊戲才依本表配置<\/strong>，沒有 Link 的遊戲不用此配置。<\/li><li>GC、SC 的彩金大小（初始金額）各自設定，見上表；Startup%、Increment、RTP 兩幣別相同。<\/li><li><strong>賭場線上線下串連的配置不列入本表<\/strong>：若要讓某賭場的線上與線下（實體機台）彩金串在一起，線上的配置必須與該賭場線下<strong>一模一樣<\/strong>；而每款遊戲在賭場的配置都不同，無法訂一套共用值。目前只有 MFB（Okada）一家賭場，所以真要串時先以 MFB 的配置為準（例：Grand <code>$1,000,000<\/code>／Startup 1.10%／Increment 0.20%／RTP 1.30%；Major <code>$100,000<\/code>／0.50%／0.20%／0.70%）；之後若不再有這需求就用不到，因此<strong>有要串時才依該遊戲、該賭場的配置另做<\/strong>。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>初始金額<\/td><td>彩池開出後重置的起始金額（Start Up Pool）<\/td><\/tr><tr><td>Startup%<\/td><td>押注中用來補足初始金額的比例；<code>Startup% = RTP − Increment<\/code><\/td><\/tr><tr><td>Increment<\/td><td>押注中滾入彩池、讓彩池累積上漲的比例（試算表的 Inrc）<\/td><\/tr><tr><td>RTP<\/td><td>該級距的彩金 RTP；<code>RTP = Startup% + Increment<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Grand ＋ Major RTP ＝ Link RTP 2.00%；Increment 合計 0.85%。<\/li><li>平均開出金額：<code>Average Jackpot Hit Value = 初始金額 ÷ Startup% × RTP<\/code>。例：SC Grand ＝ 100,000 ÷ 0.65% × 1.00% ≈ 153,846 SC。<\/li><li>試算表只給初始金額、RTP 與 Increment，Startup% 依上式推得；試算表改版時三欄一起更新。<\/li><\/ul>\n<h3 id=\"16-bet-mode\">1.6 Bet Mode<\/h3>\n<ul><li>Reskin <strong>不分押注層級<\/strong>：沒有 <code>&lt; $2<\/code>／<code>&gt;= $2<\/code>（小／中／大 Bet）之分，系統也不依押注金額擋拉彩金。<\/li><li>數學模型的 Bet Mode 成本（EB 倍數、BF／SF 價格倍數）以 1 倍押注為基準定義；Reskin 不改這些倍數。<\/li><li>Simulator 依版本指定 Config，不依押注金額自動選檔。<\/li><\/ul>\n<h2 id=\"2-待確認事項\">2. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>現況<\/th><th>需決定<\/th><\/tr><\/thead><tbody><tr><td>雙幣 RTP／機制<\/td><td>未定義<\/td><td>GC 與 SC 是否共用 RTP、新手體驗、Card System Profile<\/td><\/tr><tr><td>彩金幣別<\/td><td>配置見第 1.5.2 節<\/td><td>GC、SC 是否各自一組彩池<\/td><\/tr><tr><td>系統最大賠付<\/td><td>未定義<\/td><td>各市場單把派彩上限，以及超過時截斷或重骰<\/td><\/tr><tr><td>Feature 購買上限<\/td><td><code>Sheet1<\/code> 舊草稿曾標示「Super Feature 可使用最大押注」「Buy Feature 可使用押注」<\/td><td>現行版是否仍限制 BF／SF 可用的押注檔位<\/td><\/tr><\/tbody><\/table><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', 'math'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-mine">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Mine 開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:999px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:620px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:52px; border-bottom:1px dashed var(--grid)}\n.tl-row:first-child .tl-track{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-bar.event{background:var(--s2); opacity:.85; height:16px; top:6px}\n.tl-label{position:absolute; top:24px; font-size:1em; color:var(--ink); white-space:nowrap}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n/* 嵌入入口時：頁首、頁籤、左側目錄由入口負責，這裡只留內文；藏拉條、仍可上下捲動 */\nhtml.embedded{scrollbar-width:none; -ms-overflow-style:none}\nhtml.embedded::-webkit-scrollbar{display:none}\nhtml.embedded body{background:transparent}\nhtml.embedded .wrap{max-width:none; padding:0}\nhtml.embedded header.page, html.embedded .tabs, html.embedded .toc,\nhtml.embedded .toc:not([hidden]):has(.toc-doc){display:none!important}\nhtml.embedded .body-row{display:block; padding:0}\nhtml.embedded main{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:26px 32px 60px}\nhtml.embedded .panel h1{color:var(--accent); font-weight:500; font-size:30px}\nhtml.embedded h2{color:var(--accent); border-bottom-color:var(--grid)}\n:root{--accent:#c8501e}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--accent:#e9773d}}\n:root[data-theme=\"dark\"]{--accent:#e9773d}\n@media (max-width:700px){html.embedded main{padding:18px 16px 40px}}\n<\/style>\n<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');<\/script>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"page\">\n  <div class=\"eyebrow\">iGaming · Mine<\/div>\n  <h1 class=\"site\">Mine 開發規範<\/h1>\n  <p class=\"meta\">由 <code>專案需知/其他/*.md、專案需知/開發規範/*.md<\/code> 產生（<code>_build_html.py<\/code>）　|　2026-10-29<\/p>\n<\/header>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"規範文件\"><button class=\"tab\" role=\"tab\" id=\"tab-g0\" data-tab=\"overview\" data-tabs=\"overview\" aria-selected=\"true\" tabindex=\"0\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\ class=\"toc-3\" href=\"#25-最終交付檢查\" data-tab=\"sim\">2.5 最終交付檢查<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"demo\">Demogame規範<\/a><\/nav><nav class=\"toc\" id=\"toc-demo\" hidden><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"gamerule\">GameRule規範<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"sim\">模擬程式規範<\/a><a href=\"#\" class=\"tab-link toc-doc on\" data-tab=\"demo\">Demogame規範<\/a><a class=\"toc-2\" href=\"#1-用途與載入\" data-tab=\"demo\">1. 用途與載入<\/a><a class=\"toc-3\" href=\"#11-遊戲類型命名規則\" data-tab=\"demo\">1.1 遊戲類型命名規則<\/a><a class=\"toc-2\" href=\"#2-共用區域與-by-game-區域\" data-tab=\"demo\">2. 共用區域與 By Game 區域<\/a><a class=\"toc-3\" href=\"#21-by-game-區域\" data-tab=\"demo\">2.1 By Game 區域<\/a><a class=\"toc-3\" href=\"#22-共用區域\" data-tab=\"demo\">2.2 共用區域<\/a><a class=\"toc-3\" href=\"#23-符號顯示規則所有遊戲\" data-tab=\"demo\">2.3 符號顯示規則（所有遊戲）<\/a><a class=\"toc-2\" href=\"#3-補牌方式\" data-tab=\"demo\">3. 補牌方式<\/a><a class=\"toc-2\" href=\"#4-必要行為\" data-tab=\"demo\">4. 必要行為<\/a><a class=\"toc-2\" href=\"#5-debug-與重現\" data-tab=\"demo\">5. Debug 與重現<\/a><a class=\"toc-2\" href=\"#6-與-simulator-對帳\" data-tab=\"demo\">6. 與 Simulator 對帳<\/a><a class=\"toc-2\" href=\"#7-交付檢查\" data-tab=\"demo\">7. 交付檢查<\/a><a class=\"toc-2\" href=\"#8-demo-版-rtp-120\" data-tab=\"demo\">8. Demo 版 RTP 120%<\/a><\/nav><nav class=\"toc\" id=\"toc-proposal\" hidden><a href=\"#\" class=\"tab-link toc-doc on\" data-tab=\"proposal\">提案報告規範<\/a><a class=\"toc-2\" href=\"#1-用途與範圍\" data-tab=\"proposal\">1. 用途與範圍<\/a><a class=\"toc-2\" href=\"#2-檔案\" data-tab=\"proposal\">2. 檔案<\/a><a class=\"toc-2\" href=\"#3-章節結構\" data-tab=\"proposal\">3. 章節結構<\/a><a class=\"toc-2\" href=\"#4-內容規則\" data-tab=\"proposal\">4. 內容規則<\/a><a class=\"toc-2\" href=\"#5-製作與檢查\" data-tab=\"proposal\">5. 製作與檢查<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"report\">數值報告規範<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"demoreport\">Demo報告規範<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-overview\"><h1 id=\"mine-總覽\">Mine 總覽<\/h1>\n<p>本站是自己用的開發規範（要產出什麼、長什麼樣），<strong>不同步給其他人<\/strong>。開發順序見「開發流程」；各產線的規範見 Omniplay／Landbase／Reskin。開新專案先讀開發流程第 4 節，再讀該步驟對應的規範。<\/p>\n<h2 id=\"1-文件\">1. 文件<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"outputs\">產出與紀錄規範<\/a><\/td><td>每個專案必須產出的文件、<code>修改紀錄.md<\/code> 格式、專案目錄與存放位置<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"gamerule\">GameRule規範<\/a><\/td><td><code>game_rule.md<\/code> 的固定章節骨架、必要欄位與交付檢查<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範<\/a><\/td><td>Simulator 架構、批次、Console 與報表格式；Config 轉檔、驗證與版本<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範<\/a><\/td><td>Demogame 載入、共用／By Game 區域、補牌、Debug、對帳；Demo 版 RTP 120%<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"proposal\">提案報告規範<\/a><\/td><td>提案說明簡報（.pptx）的章節與版式<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><td>本作與競品、前作的差異分析報告<\/td><\/tr><tr><td><a href=\"#\" class=\"tab-link\" data-tab=\"demoreport\">Demo報告規範<\/a><\/td><td>給內部與客戶說明設計理由的 Demo 報告<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"2-資料夾與網頁\">2. 資料夾與網頁<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>位置<\/th><th>內容<\/th><th>同步<\/th><\/tr><\/thead><tbody><tr><td><code>開發規範/Omniplay/<\/code>、<code>Landbase/<\/code>、<code>Reskin/<\/code><\/td><td>各產線規範<\/td><td>Omniplay 發佈到團隊共享區；Landbase／Reskin 同步到 SVN 說明書（只更新已放入的檔）<\/td><\/tr><tr><td><code>開發規範/*.md<\/code><\/td><td>本站（Mine）<\/td><td>不同步<\/td><\/tr><tr><td><code>開發流程/<\/code><\/td><td>開發流程<\/td><td>不同步<\/td><\/tr><tr><td><code>其他/<\/code><\/td><td><code>_build_html.py<\/code> 等工具<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>任何 <code>.md<\/code> 改完，同一次修改內在 <code>其他/<\/code> 執行 <code>py _build_html.py<\/code>，重建 <code>專案需知/<\/code> 最外層的網頁與入口 <code>igaming_specification.html<\/code>；不得手改 HTML。<\/li><li>三產線互不提及對方的數值；產線資料夾只放自己的文件。<\/li><\/ul>\n<h2 id=\"3-專有名詞\">3. 專有名詞<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>意義<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>後端報表<\/td><td>後端 SPS（RTP Validator）依分支壓測後輸出的 TXT 報表，以壓縮檔交付（例：<code>JHS101027-RTP-Validator-Mode-6-By-Branch-On-Cloud-876.zip<\/code>）；每個分支一個資料夾、一份 TXT，內含 RTP 拆解、救援／JP RTP、符號命中、倍率分桶等。口頭說「SPS 的表格」「SPS 報表」都指這個。<\/td><td>讀法、指標換算與核對方法見 後端報表.md；壓測要壓哪些組合與判定標準見 壓測說明書.md。<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-gamerule\" hidden><h1 id=\"gamerule規範\">GameRule規範<\/h1>\n<p>存放位置：遊戲專案根目錄 <code>game_rule.md<\/code>。<\/p>\n<p>Game Rule 是遊戲規則說明文件。<\/p>\n<h2 id=\"1-用途\">1. 用途<\/h2>\n<p>Game Rule 用於設定遊戲玩法規則，是數學模型、Config、Simulator、Demogame、Help 與測試案例共同遵循的規則來源。<\/p>\n<h2 id=\"2-必要規則\">2. 必要規則<\/h2>\n<ul><li>每款遊戲必須提供 <code>game_rule.md<\/code>，並明確定義遊戲基礎設定、得分方式、Symbol 功能、判獎順序、Bet Mode、BG／FG 流程、Feature、Retrigger、Multiplier、Max Win、Jackpot 與例外處理。<\/li><li>Game Rule 必須沿用本節定義的固定章節骨架、標題層級、表格形式及規則表達方式。<\/li><li>數學模型、Config、Simulator、Demogame 與 Help 不得自行補充或改寫 <code>game_rule.md<\/code> 未定義的玩法。<\/li><li>規則變更時，必須同步檢查並更新數學文件、Config、Simulator、Demogame、<code>{GameID}_Help.xlsx<\/code>、<code>game_help_draft.md<\/code> 與測試案例。<\/li><li>Game Rule 與其他來源內容衝突時，必須先確認正式規則，不得由開發端自行選擇其中一種實作。<\/li><\/ul>\n<p>Game Rule 必須保留下列基本結構：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">順序<\/th><th>章節<\/th><th>格式要求<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">1<\/td><td><code>§1. 遊戲基本資訊<\/code><\/td><td>使用「項目／說明」表格記錄本節規定的基礎資料。<\/td><\/tr><tr><td class=\"n\">2<\/td><td><code>§2. 盤面結構<\/code><\/td><td>包含盤面示意圖與 Reel／Row、得分方向及補牌流程的文字說明。<\/td><\/tr><tr><td class=\"n\">3<\/td><td><code>§3. 符號類別<\/code><\/td><td>分開定義一般符號與特殊符號，說明出現位置、替代關係及功能。<\/td><\/tr><tr><td class=\"n\">4<\/td><td><code>§4. 賠率表（Pay Table）<\/code><\/td><td>使用表格列出符號、得分數量及倍率口徑。<\/td><\/tr><tr><td class=\"n\">5<\/td><td><code>§5. 核心特色<\/code><\/td><td>依遊戲機制建立子章節，完整說明特色符號、轉換、Multiplier 或其他核心玩法。<\/td><\/tr><tr><td class=\"n\">6<\/td><td><code>§6. 免費遊戲（Free Spins / Free Game, FG）<\/code><\/td><td>分別定義觸發、FG 玩法及 Retrigger。<\/td><\/tr><tr><td class=\"n\">7<\/td><td><code>§7. 核心遊戲流程（Base Game）<\/code><\/td><td>依實際執行順序編號描述 Spin、判獎、消除／補牌、結算與 Feature Trigger。<\/td><\/tr><tr><td class=\"n\">8<\/td><td><code>§8. 押注模式<\/code><\/td><td>依遊戲實際支援內容分別說明 Extra Bet 與 Buy Feature。<\/td><\/tr><tr><td class=\"n\">9<\/td><td><code>§9. 邊界 / 例外情境（Edge Cases）<\/code><\/td><td>依機制分類列出可直接驗證的邊界條件及例外處理。<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>§1. 遊戲基本資訊<\/code> 必須包含下列欄位：<\/p>\n<ul><li><code>Game ID<\/code><\/li><li><code>PARsheet ID<\/code><\/li><li><code>遊戲中文名稱<\/code><\/li><li><code>遊戲英文名<\/code><\/li><li><code>遊戲類型<\/code>：依實際遊戲機制列出完整類型，例如 <code>2,025–32,400 Ways / Megaways / Cascade<\/code>。<\/li><li><code>盤面規格<\/code><\/li><li><code>中獎方式<\/code>：使用 <code>Line Game<\/code>、<code>Way Game<\/code>、<code>Pay Anywhere<\/code> 或 <code>Cluster Pay<\/code>；只能選擇符合實際判獎邏輯的類型。<\/li><li><code>押注模式<\/code><\/li><\/ul>\n<p><code>§8. 押注模式<\/code> 依遊戲實際支援內容包含：<\/p>\n<ul><li><code>Extra Bet<\/code>：遊戲有 Extra Bet 時，說明價格、流程與 Normal Bet 的差異；沒有時可省略此子章節。<\/li><li><code>Buy Feature（購買特色）<\/code>：遊戲有 Buy Feature 時，說明購買價格、入口 Spin、FG 觸發方式與得分計算；沒有時可省略此子章節。<\/li><\/ul>\n<ul><li>§1～§9 的章節名稱與順序不得任意更動；遊戲沒有 FG 時，仍須保留 §6 並明確寫「不適用」或「不提供」。<\/li><li>可依各遊戲機制在固定章節下新增子章節，但不得改變核心章節順序。<\/li><li>規則必須以開發與測試可直接實作、驗證的方式描述，不得只使用宣傳文案或未定義的概念性敘述。<\/li><\/ul>\n<p>遊戲類型的統一命名規則見<a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範.md<\/a>第 1.1 節；Game Rule、Demogame 與 Help 必須使用相同術語。<\/p>\n<h2 id=\"3-交付檢查\">3. 交付檢查<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code>game_rule.md<\/code> 已涵蓋所有實際支援的玩法、模式與 Feature。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 已依本節規定的 §1～§9 基本格式建立，固定章節、順序與表格形式完整。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §1 已包含 Game ID、PARsheet ID、中英文名稱、遊戲類型、盤面規格、中獎方式與押注模式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §8 已依實際支援內容完整說明 Extra Bet 與 Buy Feature。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 判獎順序、倍率分母、觸發條件、結束條件與上限均可直接實作及測試。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 與數學模型、Config、Simulator、Demogame 及 Help 的規則一致。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-report\" hidden><h1 id=\"數值報告規範\">數值報告規範<\/h1>\n<p>卡片權重完成後（開發流程第 4 節卡片權重調性校準之後），產出數值報告（即本作與競品、前作的差異分析），比較本作與競品（及使用者指定的前作）的玩法指標，作為調性是否到位的依據。<\/p>\n<p><strong>檔案與格式<\/strong><\/p>\n<ul><li>檔名 <code>其他/數值報告_&lt;遊戲中文名&gt;.md<\/code> ＋ 同名 <code>.html<\/code>（例：<code>數值報告_宙斯 2500<\/code>、<code>數值報告_超級鑽石<\/code>、<code>數值報告_錢來襲<\/code>），兩份內容一致；不另取其他檔名。舊名 <code>差異分析_&lt;遊戲中文名&gt;<\/code> 一律改為此名。<\/li><li>遊戲名稱一律用英文名（例：Super Diamond、Super Ace、Lucky Ace），不用 H0xx 代號。<\/li><li><strong>大標題＝<code>&lt;本作英文名&gt; 數值報告<\/code><\/strong>（例：<code>Super Diamond 數值報告<\/code>），不寫「A vs B vs C」；比較對象改在「基本資訊」章交代。<\/li><li>章節（頁簽）名稱照下表「必要章節」的中文名，不加英文括號（例：寫「連消分布」，不寫「連消分布（Combo）」）。<\/li><li>HTML 最上方放「← 返回 Demo」，連回 <code>../index.html<\/code>；從 Demo 點進來時改為回上一頁。Demo 的數值報告按鈕在同一分頁開啟，推上網頁後也能用瀏覽器上一頁返回。<\/li><li><strong>新報告要收錄到 Omniplay 首頁<\/strong>：數值報告區不會自動掃描，第一次產出並推上 GitHub 後，在 <code>AI 工作區/Jumbo_Output/catalog.js<\/code> 的「數值報告」區加一筆（title 遊戲中文名、kind \"數值報告\"、url 用 rhino-boss.github.io 完整網址、game 代號、desc 一行「本作 vs 競品：主要章節」、date 產出日期），同時把 index.html／all.html 的 <code>?v=<\/code> 快取版號加一碼，再推上 Jumbo_Release。<\/li><li>HTML 版式同 <code>市場資訊/H5/遊戲資訊/<\/code> 的競品分析報告：每章一個頁簽、頁簽只排一列可橫拉但不顯示拉條；表格不得出現橫向拉條（儲存格自動換行）。<\/li><li><strong>卡片版型<\/strong>：HTML 產出後一律跑 <code>py -X utf8 專案需知/其他/_report_card_style.py &lt;數值報告_xxx.html&gt;<\/code>：淺灰底＋圓角卡片（深色模式為深灰卡片）、膠囊頁簽、襯線大標題，每節（<code>###<\/code>）一張卡片；倍率線型的圖例每一條線都可點選開關。可重複執行，重產 HTML 後再跑一次即可。<\/li><li>百分比表格套條件式橫條（同競品報告：同表共用刻度、最大值以強調色、合計列不畫）；表格內只放百分比，不附括號內的分子／分母。<\/li><\/ul>\n<p><strong>比較口徑<\/strong><\/p>\n<ul><li>本作與前作一律用 <strong>Card-On<\/strong>（正式 RTP／Variant、Oldhand）報表；競品用實機側錄資料。自然機率（Card-Off）只可作附加欄，不得當主比較欄。<\/li><li>模擬在模擬機執行（NB ≥ 10⁶ 局、BF ≥ 10⁵ 次），報表存 <code>Record/<\/code> 並在報告來源表列出檔名。<\/li><li>指標口徑與競品報告一致；口徑不同時（例：分母只算初始盤面）以競品口徑為準並在該節說明。<\/li><\/ul>\n<p><strong>必要章節<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>章節<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1. 基本資訊（放在最前面）<\/td><td>頁簽之外只留大標題。<strong>開頭第一節為「比較對象」表<\/strong>：固定三欄「類別｜遊戲｜為什麼比」、固定三列「競品／前作／同系列」；遊戲寫英文名＋廠商或版本（例：Money Coming（JILI）、Money Boost 1.0.0.2（原始版））；為什麼比用一句話說明比較目的；沒有的列遊戲欄填「—」並註明（例：目前沒有同系列作品。）。<strong>報告抬頭資訊一律放在本章<\/strong>：產出日期、比較口徑（本作／前作／競品各用哪種資料、Profile）、本作版本與主要設定摘要（盤面表與選表比例、補牌與倍數規則、賠率、FG 階梯、BF 價格、EB、自然率門檻、Max Win 等）、<strong>資料來源表<\/strong>（來源｜樣本數｜報表檔名）。<strong>遊戲簡介 200 字內<\/strong>：盤面、怎麼贏、特色機制、FG 怎麼觸發、BF 價格，寫到玩家看完就懂規則。<strong>玩法深淺<\/strong>（NB、BF 分列，與競品／前作／同系列並列）：RTP、標準差（NB 以押注計、BF 以購買價計）、<strong>≥1000x／≥5000x／≥10000x 週期<\/strong>（以底注計；NB 為每局、BF 為每次購買），並給一句「平／深」結論（看標準差與存活中位數，平均把數由 RTP 決定不具鑑別度）。<strong>存活模擬<\/strong>：1000 人各帶 1000 元、每把押 1 元玩 NB 至不夠下注，列平均、中位數、最早死 10%（P10）、最晚死 10%（P90）把數；以 Card-On 報表每局總得分分布（BG 非觸發局＋觸發局含觸發把）抽樣，註明抽樣方式。<\/td><\/tr><tr><td>2. 核心指標<\/td><td>Total RTP、BG Hit Rate、FG Hit Rate（每轉）、FG 週期；有 Buy Feature 的遊戲加列 <strong>BF 贏錢率<\/strong>（見第 10 章）<\/td><\/tr><tr><td>3. 金框比例<\/td><td>平均每盤金框數、每格金框率、有金框盤面占比、各輪金框率（BG／FG 分開）<\/td><\/tr><tr><td>4. 金框使用率<\/td><td>被消到而翻牌的金框數 ÷ 初始盤面金框數（BG／FG 分開）<\/td><\/tr><tr><td>5. 倍率線型<\/td><td>NB-BG、NB-FG、BF 各兩張折線圖：主圖（縱軸 BG 0–1%、FG／BF 0–16%）＋<strong>放大圖（縱軸 BG 0–0.1%、FG／BF 0–1%）<\/strong>，每張都含競品、前作、本作（卡片後，實線）與<strong>本作自然機率（Card-Off，卡片前，同色虛線，預設隱藏、點圖例才顯示）<\/strong>；64 區間全標；縱軸固定（BG 0–1%、FG／BF 0–16%），<strong>圖例可點選切換各線顯示／隱藏<\/strong>（關閉的圖例淡化加刪除線）；附 FG／BF 門檻機率表（含本作自然欄）；<strong>滑鼠游標移到圖上鎖定該區間<\/strong>，畫垂直線並列出各線數值（隱藏的線不列）；<strong>圖例只寫名稱＋版本<\/strong>（例：Super Ace、Super Diamond v5.0.0.0、Super Diamond v5.0.0.0 自然），不加括號說明；<strong>圖下不加說明<\/strong>；<strong>每個區間都畫點<\/strong>，機率 0 的點在 0 的位置，整條線全部連起來（不斷開）且<strong>線半透明<\/strong>，超過縱軸上限的部分被圖框裁掉；<strong>x 軸寫法<\/strong> <code>0<\/code>、<code>0 &lt; x &lt;= 1<\/code>、<code>1 &lt; x &lt;= 2<\/code>…（整數不加小數點，有小數才寫）；<strong>競品一律灰色<\/strong>，本作用彩色<\/td><\/tr><tr><td>6. 連消分布<\/td><td>BG 每局、FG 每轉的 0／1／2／3／4／5+ 次，含與競品的差（pp）<\/td><\/tr><tr><td>7. 大鬼出現率<\/td><td>BG 每局、FG 每轉；並註明本作 BG 幾局一次、FG 每場幾次<\/td><\/tr><tr><td>8. 符號消除分布<\/td><td>各符號 3／4／5 連的 Hit Rate 與 RTP（BG／FG 分開）<\/td><\/tr><tr><td>9. WILD 倍數分布<\/td><td>有帶倍數 Wild 的遊戲才需要：各種 Wild（如小鬼、大鬼本體、分裂）分開列各倍數占比<\/td><\/tr><tr><td>10. BF 回收分布（贏錢率）<\/td><td>有 Buy Feature 的遊戲才需要。口徑＝每次購買的總贏分 ÷ <strong>購買價<\/strong>（各遊戲自己的價格，例：競品 40.5x、本作 50x）；分段同競品報告：&lt; 20%、&lt; 40%、&lt; 60%、&lt; 80%、&lt; 100%（賠錢）、<strong>&gt; 100%（贏錢率）<\/strong>、&gt; 150%、&gt; 200%、&gt; 300%、&gt; 500%，並列 BF RTP。競品用側錄、本作／前作用 Card-On BF 報表；報表倍率區間沒切在門檻上時以相鄰區間估計並註明「約」<\/td><\/tr><tr><td>11. 得分區間與最大獎機率<\/td><td>由卡片權重 <code>config_9xx.js<\/code> 精算（非模擬）。每個 <strong>RTP／Variant（A／B 版）× 押注模式（NB／EB／BF）× 新老手 × 押注層級（小／中／大 Bet；卡片不分層級時標「不分」）<\/strong> 一列：BG 得分區間（有權重的最低～最高區間）、FG／BF 得分區間、<strong>最大獎區間<\/strong>（可開出的最高區間）、<strong>最大獎機率<\/strong>（每局；BF 為每次購買）與週期<\/td><\/tr><\/tbody><\/table><\/div>\n<p>沒有對應機制的章節（例如無金框、無大鬼）可省略，但要在報告開頭註明；頁簽編號一律從 1 依序連號，省略章節後也重新連號（不沿用本表編號）。指標未達使用者設定的對標目標時，於回報中列出差距與可調的槓桿，由使用者決定是否調整；調整後重跑 Card-On 並重出數值報告。<\/p><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-demoreport\" hidden><h1 id=\"demo報告規範\">Demo報告規範<\/h1>\n<p>全部做完（開發流程第 7 步文件檢查通過）後製作，給內部與客戶說明「這款為什麼這樣設計」。<\/p>\n<p><strong>檔案<\/strong>（做法同 Help：先 md 確認稿，再轉正式檔）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>位置<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td><code>demo_report_draft.md<\/code><\/td><td>遊戲資料夾根目錄（與 <code>game_help_draft.md<\/code> 同層）<\/td><td>內容的前置確認稿，<strong>以 md 為主<\/strong>；格式參考 <code>game_help_draft.md<\/code>：開頭說明＋Meta 表，每頁一個 <code>## <\/code> 小節、內容用表格或條列<\/td><\/tr><tr><td><code>{英文遊戲名大寫，空格改底線}_Demo報告_v{兩位數版本}.pptx<\/code><\/td><td><code>其他/<\/code><\/td><td>由 md 轉出；版式照<a href=\"#\" class=\"tab-link\" data-tab=\"proposal\">提案報告規範.md<\/a>（直接參考指定的過去提案簡報修改，16:9、右上頁碼、英文小標）；內容每次修改版本 +1，舊版保留<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>內容<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>章節<\/th><th>寫什麼<\/th><\/tr><\/thead><tbody><tr><td>1. 遊戲設計重點<\/td><td>這款的核心玩法與賣點，一段話講清楚<\/td><\/tr><tr><td>2. 跟競品不同的地方<\/td><td>對標競品後刻意做的差異、獨有巧思（機制、表現、數值調性），每點寫「做了什麼、為什麼」<\/td><\/tr><tr><td>3. 製作過程的困難與反饋<\/td><td>製作中遇到的問題、收到的反饋（客戶、主管、數學、測試…）與對應的調整；反饋來源見 <code>Slots/其他/一些記錄/反饋紀錄.md<\/code><\/td><\/tr><tr><td>4. 數據佐證<\/td><td>用數值報告與線上數據說明調整的效果；線上數據見 <code>Slots/其他/一些記錄/基本資訊.md<\/code>，註明數據日期<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>寫法<\/strong><\/p>\n<ul><li>每個設計點都要有「原因 → 做法 → 數據」。數據取自數值報告（大獎週期、倍率線型、玩法深淺）與線上數據換算。<\/li><li>例：製作中被反應「我們的遊戲太平，玩起來沒有變化，排行榜很難出現 5000x 以上的推播」→ 這款特別調整了 5000x 以上的出現率 → 搭配線上數據（皮娜塔在前 6 名平台一天約 200 萬～3,000 萬轉，2026-10-22），以「每日轉數 × 5000x 以上機率」換算每天預期出現幾次，說明每天都看得到千倍以上的獎項推播。<\/li><li>只寫已定案、已驗證的內容；試驗中或被否決的方案不寫（可在「困難與反饋」交代為什麼沒採用）。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-outputs\" hidden><h1 id=\"產出與紀錄規範\">產出與紀錄規範<\/h1>\n<p>本文件定義每個 Slot 專案<strong>必須產出的文件<\/strong>與 <code>修改紀錄.md<\/code> 的格式。製作順序與各階段操作見開發流程.md。<\/p>\n<h2 id=\"1-必要產出文件\">1. 必要產出文件<\/h2>\n<p>每個專案必須產出下列文件；任一項缺漏，專案不得視為完成交付：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>產出<\/th><th>說明<\/th><th>依據規範<\/th><\/tr><\/thead><tbody><tr><td><code>game_rule.md<\/code><\/td><td>遊戲規則正式來源<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code>game_help_draft.md<\/code> → <code>{GameID}_Help.xlsx<\/code><\/td><td>Help 先寫 Markdown 草稿再轉 xlsx，兩者內容一致<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code>game_description.md<\/code><\/td><td>模型參數使用方式說明<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code>H0xx1*.xlsx<\/code> → PARsheet<\/td><td>數學模型為正式參數來源，另轉出對外提供的 PARsheet<\/td><td>數學模型規範.md、數學文件規範.md<\/td><\/tr><tr><td><code>config.js<\/code>、<code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code><\/td><td>Simulator 與 Demogame 共用的執行參數，由數學模型轉出<\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code>Simulator.py<\/code><\/td><td>模擬程式<\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code>index.html<\/code><\/td><td>Demogame<\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範.md<\/a><\/td><\/tr><tr><td><code>數值報告_&lt;遊戲中文名&gt;.md<\/code>＋<code>.html<\/code><\/td><td>本作與對標競品、前作的差異分析<\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><\/tr><tr><td><code>修改紀錄.md<\/code><\/td><td>專案根目錄，依版本記錄數學調性的修改，格式見第 2 節<\/td><td>本文件<\/td><\/tr><tr><td><code>注意事項.md<\/code><\/td><td>本遊戲的特別操作與已知例外：偏離規範或預設的設定、經使用者同意暫不處理的檢查項、與其他遊戲不同的做法；每項註明日期、版本與原因，改模型、改權重或交接前必讀<\/td><td>本文件<\/td><\/tr><tr><td><code>{GameID}_Game Description.docx<\/code><\/td><td>依 Help 填寫，分完整版與送驗版<\/td><td>送驗文件規範.md<\/td><\/tr><tr><td><code>{GameID}_Math Document Description.md<\/code><\/td><td>數學模型的工作表、參數、遊戲邏輯與卡片系統說明<\/td><td>送驗文件規範.md<\/td><\/tr><tr><td><code>文件/{GameID}_腳本規格.xlsx<\/code><\/td><td>挑腳本用的腳本表（2026-10-28 起統一此檔名）<\/td><td>腳本規範.md<\/td><\/tr><\/tbody><\/table><\/div>\n<p>各檔案的存放位置見第 3 節。<\/p>\n<ul><li>上表「→」的轉換與 Config 一律由 AI 轉出，專案內不建立、不維護任何轉檔工具。<\/li><li>轉換結果必須可由來源重建；轉換錯誤時修正來源後重新轉出，不直接修補轉出結果。<\/li><\/ul>\n<h2 id=\"2-修改紀錄格式\">2. 修改紀錄格式<\/h2>\n<p><code>修改紀錄.md<\/code> 放在專案根目錄，<strong>依版本分節、不以日期分節<\/strong>：<\/p>\n<ul><li>每個四碼版本一節，標題寫 <code>## v&lt;第 1 碼&gt;（&lt;四碼版本&gt;）<\/code>，例如 <code>## v5（5.1.0.0）<\/code>、<code>## v5（5.0.0.0）<\/code>；由新到舊排列。<\/li><li>只改倍率權重（卡片權重，數學模型規範 1.3 第 2 碼）時升成 <code>5.1.0.0<\/code> 這類版本，同樣<strong>獨立成一節<\/strong>，只列該版本內的修改；SCR（第 3 碼）、其他文件（第 4 碼）同理。<\/li><li>每節用編號清單，一項一件事，句尾以全形括號附日期 <code>（MM/DD）<\/code>。<\/li><li><strong>只記錄跟數學調性有關的內容<\/strong>：規則、賠率、輪帶、金框與倍數權重、卡片權重、RTP 拆分與週期、模擬驗證結果等。Demogame 介面、演出、文件、工具的修改不記在這裡（以 git commit 為準）。Demogame 的「版本紀錄」（<code>index.html<\/code> 的 <code>#change-log-wrap<\/code>）是本檔的複本，本檔更新時同步更新。<\/li><li>項目歸到<strong>修改當時的目前版本<\/strong>；<strong>只記已完成的修改<\/strong>，不寫進行中、待辦或「待重算」之類的狀態。<\/li><li>數學版本細節另見 <code>Versions/version_manifest.json<\/code>。<\/li><li>每次新增調性項目（數學模型或倍率權重調整）時，同步把 Demogame <code>index.html<\/code> 的 <code>window.DEMOGAME_LAST_TUNING<\/code> 改成當下的日期與時間 <code>YYYY-MM-DD HH:MM<\/code>（頁尾「最後調性更新」，見 <a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範<\/a> 第 5 節）。<\/li><\/ul>\n<p>範例：<\/p>\n<pre><code>## v5（5.1.0.0）\n\n1. 92A 卡片權重重解：BG Trigger Cap 350x → 300x。（10/20）\n2. Card-On 驗證 Oldhand 92.03%、Newbie 92.98%、BF 92.51%。（10/20）\n\n## v5（5.0.0.0）\n\n1. 升 v5：啟用盤面表 2（高連消表），BG 選表 9 : 1、FG 2 : 8。（10/12）\n2. 表 2 補牌權重集中、輪帶 M1～M4 約一半換成低倍符號。（10/12）<\/code><\/pre>\n<h2 id=\"3-專案目錄與存放位置\">3. 專案目錄與存放位置<\/h2>\n<pre><code>Slots/H0xx_遊戲名稱/\n├─ game_rule.md\n├─ game_help_draft.md\n├─ game_description.md\n├─ 注意事項.md                 ← 本遊戲的特別操作與已知例外\n├─ Simulator.py\n├─ index.html\n├─ config.js\n├─ config_92A.js\n├─ config_94A.js\n├─ Source/\n│  ├─ H0xx1.xlsx\n│  ├─ H0xx192A.xlsx\n│  ├─ H0xx194A.xlsx\n├─ 文件/\n│  ├─ &lt;GameID&gt;_Help.xlsx\n│  ├─ &lt;GameID&gt;_Game Description.docx           ← 完整版（內容同 Help，不刪減）\n│  ├─ &lt;GameID&gt;_Math Document Description.md\n│  ├─ PARsheet/                 ← 專案的正式 PARsheet（主檔名加 R，底線後綴在 R 之後）\n│  │  ├─ H0xx1R.xlsx\n│  │  └─ H0xx19xR.xlsx\n│  └─ &lt;GameID&gt;/                 ← 送驗文件包\n│     ├─ &lt;GameID&gt;_Game Description.docx        ← 送驗版（移除送驗禁止項目）\n│     ├─ PARsheet/             ← 數學模型送驗版（移除送驗禁止項目）\n│     │  └─ H0xx19x.xlsx\n│     └─ Simulator/\n│        ├─ Simulator.py\n│        └─ config_9x.js\n├─ 其他/\n│  ├─ 數值報告_&lt;遊戲中文名&gt;.md   ← 數值報告：與對標競品、前作的差異分析（見數值報告規範）\n│  └─ 數值報告_&lt;遊戲中文名&gt;.html\n├─ Record/\n└─ Versions/\n   ├─ version_manifest.js\n   └─ version_manifest.json<\/code><\/pre>\n<ul><li>A／B、92／94、Buy／Super Feature 只依產品實際需求增減。<\/li><li>目錄中的檔名、版本及報表命名必須符合現行規格，不以舊遊戲的歷史命名為準。<\/li><li><code>Source/<\/code> 內不放任何轉檔腳本；Excel↔Config 轉換由 AI 執行。<\/li><li>數值報告（與競品、前作的數學差異分析）一律命名 <code>數值報告_&lt;遊戲中文名&gt;.md<\/code>＋<code>.html<\/code>（例：<code>數值報告_錢來襲.md<\/code>），放在專案 <code>其他/<\/code>；不再使用 <code>差異分析_&lt;遊戲名稱&gt;<\/code>、<code>競品比較_H0xx.md<\/code>、<code>競品差異分析_&lt;競品名&gt;.md<\/code> 等舊檔名。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>存放位置<\/th><th>放什麼<\/th><th>製作方式見<\/th><\/tr><\/thead><tbody><tr><td>專案根目錄<\/td><td><code>game_rule.md<\/code>、<code>game_help_draft.md<\/code>、<code>game_description.md<\/code>、<code>注意事項.md<\/code>、<code>config.js<\/code>、<code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code>、<code>Simulator.py<\/code>、<code>index.html<\/code><\/td><td>各檔對應規範（見第 1 節）<\/td><\/tr><tr><td><code>Source/<\/code><\/td><td>數學模型 <code>H0xx1*.xlsx<\/code><\/td><td>數學模型規範.md<\/td><\/tr><tr><td><code>文件/<\/code><\/td><td><code>{GameID}_Help.xlsx<\/code>、<code>{GameID}_Game Description.docx<\/code>（完整版）、<code>{GameID}_Math Document Description.md<\/code><\/td><td>數學文件規範.md、送驗文件規範.md<\/td><\/tr><tr><td><code>文件/PARsheet/<\/code><\/td><td>PARsheet（主檔名加 <code>R<\/code>，底線後綴在 <code>R<\/code> 之後）<\/td><td>數學文件規範.md PARsheet 節<\/td><\/tr><tr><td><code>文件/{GameID}/<\/code><\/td><td>送驗資料夾<\/td><td>送驗文件規範.md 1.1<\/td><\/tr><tr><td><code>其他/<\/code><\/td><td><code>數值報告_&lt;遊戲中文名&gt;.md<\/code>＋<code>.html<\/code><\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><\/tr><tr><td><code>Record/<\/code><\/td><td>模擬報表 <code>.xlsx<\/code><\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code>Versions/<\/code><\/td><td>各版本的 Source、Config、Simulator 備份與 <code>version_manifest<\/code><\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code>文件/{GameID}/<\/code> 只放送驗標的，外層文件不得複製進去。<\/li><li>範例：<code>H026_彩罐熱舞 1000/<\/code>。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-sim\" hidden><h1 id=\"模擬程式規範\">模擬程式規範<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 <a href=\"#\" class=\"tab-link\" data-tab=\"overview\">_README.md<\/a>。<\/p>\n<p>內容涵蓋：模擬程式（第 3 章）、Config（第 5 章）。<\/p>\n<p><strong>存放位置<\/strong>（路徑以遊戲專案資料夾 <code>Slots/H0xx_遊戲名稱/<\/code> 為準，總表見<a href=\"#\" class=\"tab-link\" data-tab=\"outputs\" data-anchor=\"3-專案目錄與存放位置\">產出與紀錄規範<\/a>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td><code>Simulator.py<\/code>、<code>config.js<\/code>、<code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code><\/td><td>專案根目錄<\/td><\/tr><tr><td>模擬報表 <code>.xlsx<\/code><\/td><td><code>Record/<\/code><\/td><\/tr><tr><td>版本備份（Source、Config、Simulator 等）<\/td><td><code>Versions/&lt;版本&gt;/<\/code><\/td><\/tr><tr><td>版本清單 <code>version_manifest.js<\/code>／<code>.json<\/code><\/td><td><code>Versions/<\/code><\/td><\/tr><tr><td>系統機制（新手體驗、老手救援）的模擬程式與資料<\/td><td>工作區 <code>System/simulator/<\/code>（<code>rowdata/<\/code>、<code>record/<\/code>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-模擬程式\">1. 模擬程式<\/h2>\n<p><code>Simulator.py<\/code> 是數學模型的主要驗證工具。數學邏輯、批次設定、Console 輸出與 Excel 報表必須使用相同的統計口徑。<\/p>\n<h3 id=\"11-程式架構\">1.1 程式架構<\/h3>\n<h4 id=\"111-加速numba多執行緒\">1.1.1 加速：Numba、多執行緒<\/h4>\n<ul><li>高頻數學核心使用 Numba 編譯；適用的核心函式使用 <code>@njit(nogil=True)<\/code>。<\/li><li>使用多執行緒平行執行模擬，例如 <code>ThreadPoolExecutor<\/code>；每個 Worker 必須持有獨立的 RNG 狀態。<\/li><li>正式計時前先執行 Warm-up，Numba 首次編譯時間不得計入 <code>duration<\/code>。<\/li><li>Numba Core 只處理數值及固定型別 Array／Tuple；Config 解析、字串、DataFrame 與 Excel 留在 Python 層。<\/li><li>預先配置統計陣列與暫存 Buffer，模擬迴圈內不得反覆建立大型物件。<\/li><li>場次平均分配給各 Worker，餘數由前幾個 Worker 各多執行一場；合併後必須等於 <code>total_rounds<\/code>。<\/li><li>Worker 回傳相同 shape／dtype；Count 與 Pay 欄位相加，Max 欄位取最大值。<\/li><li>固定 RNG、逐局 Trace 與 Debug 重現模式使用單執行緒。<\/li><\/ul>\n<h4 id=\"112-程式邏輯\">1.1.2 程式邏輯<\/h4>\n<p>程式依下列順序執行：<\/p>\n<ol><li>讀取 <code>BATCH_RUNS<\/code> 的本批參數。<\/li><li>載入 <code>config_file<\/code> 的自然機率參數。<\/li><li>載入 <code>config_rtp_file<\/code> 的倍率權重參數。<\/li><li>驗證兩份 Config 的 <code>game_id<\/code>、版本與資料相容性。<\/li><li>將 Config 正規化為模擬核心使用的固定型別資料。<\/li><li>依 <code>bet_mode<\/code>、Card System 開關、Profile 與基礎押注額建立本批設定，並選出押注層級、Link 資格及倍率上限。<\/li><li>執行 Warm-up，再開始正式計時與多執行緒模擬。<\/li><li>合併 Worker 統計，計算 RTP、Hit Rate、Feature、Retry 與遊戲專屬指標。<\/li><li>依固定格式印出執行結果。<\/li><li>需要輸出時，將相同結果寫入 <code>Record/*.xlsx<\/code>。<\/li><\/ol>\n<p>數學核心與報表／顯示邏輯必須分離。Card System 關閉時，不得執行抽卡或 Retry；<code>config_rtp_file<\/code> 不得改變 <code>config_file<\/code> 所定義的原始盤面與自然機率邏輯。<\/p>\n<h4 id=\"113-執行結束後印出的內容\">1.1.3 執行結束後印出的內容<\/h4>\n<p>每個 Batch 結束後必須依第 1.3 節的順序與格式輸出，不得只印 RTP。欄位名稱固定使用英文，數值格式由共用格式化函式處理。<\/p>\n<h4 id=\"114-輸出報表\">1.1.4 輸出報表<\/h4>\n<ul><li>報表固定輸出至該遊戲的 <code>Record/<\/code>，格式為 <code>.xlsx<\/code>。<\/li><li>報表與 Console 必須來自同一份統計結果，不得重新計算成不同口徑。<\/li><li>報表檔名固定沿用 H026 的命名順序，不得由個別遊戲任意調換欄位。<\/li><\/ul>\n<p>報表檔名格式：<\/p>\n<pre><code>Card System Off：\n&lt;base_game_id&gt;_&lt;base_version_tag&gt;_&lt;timestamp&gt;_betmode&lt;bet_mode&gt;_&lt;rounds_tag&gt;.xlsx\n\nCard System On（Newbie／Oldhand）：\n&lt;rtp_game_id&gt;_&lt;rtp_version_tag&gt;_&lt;timestamp&gt;_betmode&lt;bet_mode&gt;_&lt;rounds_tag&gt;_&lt;rtp_tag&gt;_&lt;profile&gt;[_&lt;bet_tier&gt;].xlsx<\/code><\/pre>\n<p>各段規則：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>段落<\/th><th>規則<\/th><th>範例<\/th><\/tr><\/thead><tbody><tr><td><code>base_game_id<\/code><\/td><td>Card System Off 時，使用基礎 Config／基礎 XLSX 的完整 Game ID。<\/td><td><code>H0161<\/code><\/td><\/tr><tr><td><code>base_game_id<\/code>（多套基礎數學）<\/td><td>同一遊戲有 A／B 等多套基礎數學時，使用該 Config <code>source_xlsx<\/code> 對應的基礎 XLSX 檔名（含家族後綴），讓自然機率報表能分辨來自哪一套；不得只寫共同前綴。<\/td><td><code>H0271A<\/code>、<code>H0271B<\/code><\/td><\/tr><tr><td><code>base_version_tag<\/code><\/td><td>Card System Off 時，使用基礎數學的 1 碼版本並補滿 2 位數。<\/td><td><code>2<\/code> → <code>02<\/code><\/td><\/tr><tr><td><code>rtp_game_id<\/code><\/td><td>Card System On 時，使用 RTP／Variant Config 內的完整 Game ID。<\/td><td><code>H016192A<\/code><\/td><\/tr><tr><td><code>rtp_version_tag<\/code><\/td><td>Card System On 時，四段版本各補滿 2 位數，再移除分隔點後依序串接。<\/td><td><code>2.1.3.13<\/code> → <code>02010313<\/code><\/td><\/tr><tr><td><code>timestamp<\/code><\/td><td>報表產生時間，格式為 <code>YYMMDDHHmm<\/code>。<\/td><td><code>2608141530<\/code><\/td><\/tr><tr><td><code>bet_mode<\/code><\/td><td>使用整數 Bet Mode。<\/td><td><code>0<\/code><\/td><\/tr><tr><td><code>rounds_tag<\/code><\/td><td><code>10^N<\/code> 場寫成 <code>10N<\/code>；非 10 的整次方則使用完整場次。<\/td><td><code>10^8<\/code> → <code>108<\/code><\/td><\/tr><tr><td><code>rtp_tag<\/code><\/td><td>Card System On 時，取實際 RTP 小數點後 4 位，不含小數點與 <code>%<\/code>。<\/td><td><code>92.01%<\/code> → <code>9201<\/code><\/td><\/tr><tr><td><code>profile<\/code><\/td><td>Card System On 時使用 <code>newbie<\/code> 或 <code>oldhand<\/code>；NB／EB／BF／SF 均不得省略。<\/td><td><code>oldhand<\/code><\/td><\/tr><tr><td><code>bet_tier<\/code><\/td><td>Oldhand 使用 <code>small_bet<\/code>、<code>medium_bet<\/code> 或 <code>big_bet<\/code>；Newbie 省略。<\/td><td><code>medium_bet<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>&gt; Card System On／Off 由檔名結構區分（On 帶 <code>rtp_tag<\/code>＋<code>profile<\/code> 段），檔名<strong>不加<\/strong> <code>card<\/code> 後綴。<\/p>\n<p>範例：<\/p>\n<pre><code>Card System Off：\nH0161_02_2608141342_betmode0_105.xlsx\n\nCard System Off（多套基礎數學，B 版）：\nH0271B_05_2609290215_betmode1_109.xlsx\n\nCard System On（Oldhand 中 Bet）：\nH016192A_02000000_2608141341_betmode0_105_9600_oldhand_medium_bet.xlsx\n\nCard System On（Feature Buy，Oldhand 小 Bet）：\nH026194A_02010313_2608141530_betmode2_108_9650_oldhand_small_bet.xlsx<\/code><\/pre>\n<ul><li>Card System Off 的檔名只能使用 <code>config_file<\/code> 所對應的基礎 <code>game_id<\/code> 與 1 碼版本，不得使用 <code>config_rtp_file<\/code> 的 RTP／Variant Game ID 或四段版本。<\/li><li>多套基礎數學（A／B）的 Card System Off 檔名一律帶家族後綴（<code>H0271A<\/code>／<code>H0271B<\/code>）；Card System On 則由 RTP／Variant <code>game_id<\/code> 本身帶出家族（<code>H027192A<\/code>／<code>H027192B<\/code>）。<\/li><li>Card System On 的檔名使用 <code>config_rtp_file<\/code> 所對應的 RTP／Variant <code>game_id<\/code> 與四段版本。<\/li><li><code>base_version_tag<\/code> 固定為 2 位數；例如基礎版本 <code>2<\/code> 輸出為 <code>02<\/code>。<\/li><li><code>rtp_version_tag<\/code> 每一段都必須補滿 2 位數，不是只移除 <code>.<\/code>；<code>2.1.3.13<\/code> 必須轉成 <code>02010313<\/code>，不得輸出成 <code>21313<\/code>。<\/li><li>四段中的單段若超過 2 位數，視為版本格式錯誤，停止輸出報表並提示修正版本。<\/li><li>檔名不得包含空白、冒號、百分比符號或版本分隔點。<\/li><\/ul>\n<p><code>Overview<\/code> 工作頁：<\/p>\n<ul><li>內容、欄位順序、欄位名稱、數值與格式必須和第 1.3 節的 Console 輸出一致，不得重新排序。<\/li><li>不寫入 Batch 標題，例如 <code><mark class=\"hl-warn\">= Batch 1/1: {...} <\/mark>=<\/code>。<\/li><li>不寫入 <code>&lt;&lt; By Game Info &gt;&gt;<\/code> 標題；Game Info 欄位依 Console 的既定順序接在共用輸出的最後一個欄位之後。Card System On 時接在 <code>retry_limit_fg<\/code> 後，Off 時接在 <code>standard_error<\/code> 後。<\/li><li>Card System 開啟時才顯示 <code>card_system_profile<\/code> 至 <code>retry_limit_fg<\/code>；關閉時整段不顯示，與 Console 規則一致。<\/li><li><code>Overview<\/code> 與 Console 必須使用同一份已計算結果，不得分別計算或套用不同格式。<\/li><\/ul>\n<p><code>Multiplier Line<\/code> 工作頁：<\/p>\n<ul><li>每一列對應報表定義的一個倍率區間，欄位名稱必須維持下列英文格式。<\/li><li>共用欄位依下列順序輸出：<\/li><\/ul>\n<pre><code>Interval\n\nbase_game_cnt\nbase_game_pay\nfree_game_cnt\nfree_game_pay\nfree_game_cnt_BF\nfree_game_pay_BF\nfree_game_cnt_SF\nfree_game_pay_SF\n\nInterval_Upper\nbg_trigger_fg_cnt_lte_upper\nbg_trigger_fg_pay_lte_upper\n\nFG_Hit_Rate\nFG_Spin_Count\n\nBG_Combo_1_Rate\nBG_Combo_2_Rate\nBG_Combo_3_Rate\nBG_Combo_4_Rate\nBG_Combo_5+_Rate\n\nFG_Combo_1_Rate\nFG_Combo_2_Rate\nFG_Combo_3_Rate\nFG_Combo_4_Rate\nFG_Combo_5+_Rate<\/code><\/pre>\n<ul><li><code>free_game_cnt_BF<\/code>、<code>free_game_pay_BF<\/code> 只在遊戲有 Buy Feature 時顯示。<\/li><li><code>free_game_cnt_SF<\/code>、<code>free_game_pay_SF<\/code> 只在遊戲有 Super Feature 時顯示。<\/li><li>不支援 BF／SF 時不得保留空白欄位或以 <code>0<\/code> 代替未支援功能。<\/li><li><code>Interval<\/code> 必須位於工作頁最前面，作為人員閱讀用的倍率區間文字；上限為 <code>0<\/code> 的第一列固定顯示 <code>0<\/code>，其餘列使用 <code>&lt;前一列上限，固定一位小數&gt; &lt; X &lt;= &lt;本列上限，固定一位小數&gt;<\/code>，例如 <code>0.0 &lt; X &lt;= 1.0<\/code>、<code>10.0 &lt; X &lt;= 15.0<\/code>。<\/li><li><code>Interval<\/code> 必須由同列及前一列的 <code>Interval_Upper<\/code> 自動產生，不得另維護一套區間；<code>X<\/code> 的倍率分母必須與本報表及 Card System 的倍率判定口徑一致。<\/li><li>**<code>base_game_cnt<\/code>／<code>base_game_pay<\/code> 與所有 <code>BG_*<\/code> 統計只計「未觸發 FG」的局**：倍率權重分「倍數卡（區間卡）」與「FG 卡」兩類，BG Multiplier Line 是倍數卡的推導來源，觸發 FG 的局屬 FG 卡口徑，不得混入；觸發局的 BG 得分一律進 <code>bg_trigger_fg_*_lte_upper<\/code> 累計欄。<\/li><li><code>Interval_Upper<\/code> 為該列倍率區間的數值上限；<code>bg_trigger_fg_cnt_lte_upper<\/code> 與 <code>bg_trigger_fg_pay_lte_upper<\/code> 分別累計所有「BG 成功觸發 FG，且該把 BG 倍數小於等於該列上限」的次數與 BG 得分。兩欄必須由未套 Profile cap 的原始觸發 BG 分桶累加，不得先過濾成單一 Profile。此兩欄是天花板機制（見數學模型規範 §2.3：觸發把超過卡組上限即重骰）的配套資料——<code>pay_lte_upper ÷ cnt_lte_upper<\/code> 於該 Profile 卡組上限那一列，即為 Detail 之 Free Game 列應填的截斷平均倍率。<\/li><li>Card System／倍率權重工具必須先從該 Profile／押注層級的正權重 BG <code>range<\/code> 卡取得最大區間上限，再以相同 <code>Interval_Upper<\/code> 讀取累計 count/pay；不得在程式內寫死 30x、70x 或其他上限。找不到完全相同的區間上限時必須停止並提示補齊倍率區間，不得取較接近的列。<\/li><li><code>cnt<\/code> 欄位使用整數；<code>pay<\/code> 欄位使用報表統一的得分精度；<code>Rate<\/code> 欄位使用一致的百分比格式。<\/li><\/ul>\n<p>共用欄位之後可接遊戲專屬的 By Game 欄位。H016 的 <code>Multiplier Line<\/code> 必須包含：<\/p>\n<pre><code>BG_Big_Ghost_2_Rate\nBG_Big_Ghost_3_Rate\nBG_Big_Ghost_4_Rate\n\nFG_Big_Ghost_2_Rate\nFG_Big_Ghost_3_Rate\nFG_Big_Ghost_4_Rate\n\nBG_Avg_Gold_Frames\nFG_Avg_Gold_Frames<\/code><\/pre>\n<ul><li><code>--- 以下是 By Game 資訊 ---<\/code> 只用於規格分組說明，不是 Excel 的實際欄位。<\/li><li>其他遊戲依自身玩法定義 By Game 欄位，不得沿用 H016 不適用的欄位。<\/li><li>報表另需保留 Feature、Symbol、Pay Range、卡片抽取占比等驗證所需工作頁。<\/li><\/ul>\n<h3 id=\"12-必要功能\">1.2 必要功能<\/h3>\n<h4 id=\"121-batch_runs\">1.2.1 <code>BATCH_RUNS<\/code><\/h4>\n<p><code>BATCH_RUNS<\/code> 用於定義要依序執行的模擬組合。每一筆至少包含：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th class=\"n\">必要<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td><code>config_file<\/code><\/td><td class=\"n\">是<\/td><td>自然機率參數檔；提供輪帶、Table、盤面與原始遊戲機率。<\/td><\/tr><tr><td><code>config_rtp_file<\/code><\/td><td class=\"n\">是<\/td><td>倍率權重參數檔；提供 RTP／Variant 與 Card System 使用的倍率權重。<\/td><\/tr><tr><td><code>bet_mode<\/code><\/td><td class=\"n\">是<\/td><td>押注模式，例如 <code>0<\/code> 為 Normal Bet；其他值依遊戲規格定義。<\/td><\/tr><tr><td><code>total_rounds<\/code><\/td><td class=\"n\">是<\/td><td>本批正式模擬的付費 Round 數，必須為正整數。<\/td><\/tr><tr><td><code>card_system_enabled<\/code><\/td><td class=\"n\">是<\/td><td>是否啟用 Card System，型別為 Boolean。<\/td><\/tr><tr><td><code>card_system_is_newbie<\/code><\/td><td class=\"n\">是<\/td><td><code>true<\/code> 為 Newbie、<code>false<\/code> 為 Oldhand；Card System 關閉時不套用 Profile。<\/td><\/tr><tr><td><code>base_bet<\/code><\/td><td class=\"n\">是<\/td><td>玩家選擇的基礎押注；Simulator 依 Bet Mode 與 Config 倍數計算實際押注及 <code>bet_tier_amount<\/code>，必須大於 0。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>範例：<\/p>\n<pre><code>BATCH_RUNS = [\n    {\n        \"config_file\": \"config.js\",\n        \"config_rtp_file\": \"config_92A.js\",\n        \"bet_mode\": 1,\n        \"total_rounds\": 1_000_000,\n        \"card_system_enabled\": True,\n        \"card_system_is_newbie\": False,\n        \"base_bet\": 1,\n    },\n]<\/code><\/pre>\n<ul><li>每批開始時印出 <code><mark class=\"hl-warn\">= Batch n/total: {...} <\/mark>=<\/code>，內容為該批完整設定。<\/li><li>每批重新載入兩份 Config，不得沿用上一批的全域狀態。<\/li><li>Config 的 <code>game_id<\/code> 不一致時立即停止，不得繼續模擬或輸出報表。<\/li><li>Card System Off 必須另跑自然機率基準；正式大場次前先以小場次檢查流程與報表。<\/li><li>NB／EB 必須用實際模式押注金額驗證 <code>$1.99<\/code>、<code>$2<\/code>、<code>$100<\/code>、<code>$100.01<\/code> 邊界；BF／SF 必須用反推後的 Feature 基礎押注驗證相同邊界。<\/li><li>至少包含 H026 類型案例：EB 2x、base bet <code>$1<\/code> 應判為中 Bet；BF 75x、購買 <code>$75<\/code> 應判為小 Bet，購買 <code>$150<\/code> 應判為中 Bet。<\/li><li>Newbie 與 Oldhand 小／中／大 Bet 必須分批驗證 Link／Bonus Game／Game RTP 拆分及 Total RTP。<\/li><\/ul>\n<h4 id=\"122-標準批次區塊與場次\">1.2.2 標準批次區塊與場次<\/h4>\n<p><code>BATCH_RUNS<\/code> 依下列四個區塊組織；當下用不到的區塊以註解保留，不刪除：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>區塊<\/th><th>用途<\/th><th>Card System<\/th><th>彩金<\/th><th class=\"n\">NB／EB 場次<\/th><th class=\"n\">BF／SF 場次<\/th><\/tr><\/thead><tbody><tr><td>1. 測試<\/td><td>流程與報表驗證<\/td><td>On<\/td><td>依需求<\/td><td class=\"n\"><code>10^5<\/code><\/td><td class=\"n\"><code>10^5<\/code><\/td><\/tr><tr><td>2. 自然機率<\/td><td>自然機率基準<\/td><td>Off<\/td><td>關<\/td><td class=\"n\"><code>10^9<\/code><\/td><td class=\"n\"><code>10^8<\/code><\/td><\/tr><tr><td>3. SCR<\/td><td>量測 SCR 供 OP Jackpot 頁使用<\/td><td>On<\/td><td>關<\/td><td class=\"n\"><code>10^8<\/code><\/td><td class=\"n\"><code>10^7<\/code><\/td><\/tr><tr><td>4. 正式模擬<\/td><td>確認正確性（含彩金與押注層級）<\/td><td>On<\/td><td>開（依搭配表）<\/td><td class=\"n\"><code>10^8<\/code><\/td><td class=\"n\"><code>10^7<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>SCR 區塊只跑必要組合<\/strong>：權重完全相同的組合只跑一筆代表——例如 Newbie 權重各 RTP／Variant 共用時只跑一筆、Buy Feature 權重各版共用時只跑一筆；Oldhand NB 各版權重不同則各跑一筆。<\/li><li><strong>自然機率區塊的組成依模型設計而定<\/strong>：BF／SF 的倍率權重若引用 NB FG 分布（如 H028 的 BF Detail 共用 NB FG 自然分布），自然機率只需 <code>bet_mode 0<\/code>，不另跑 BF／SF；<strong>此區塊要跑哪些 Bet Mode，製作前必須先與使用者確認<\/strong>，不得自行假設。<\/li><li>正式模擬區塊沿用相同精簡原則；押注層級邊界（<code>$2<\/code>、<code>$100<\/code>、<code>&gt;$100<\/code>）與 Feature 購買價層級必須各有代表批次。<\/li><li>各區塊內的組合仍須符合第 1.2.1 節的最低批次矩陣要求。<\/li><li><strong>驗證判定<\/strong>：不含救援、新手體驗等機制的 Card-On 驗證，以 <strong>95% 信賴區間<\/strong>判定是否通過：<code>|實測 RTP − 目標| ≤ 1.96σ<\/code>，<code>σ = volatility_std ÷ √局數<\/code>；<code>volatility_std<\/code> 取同一份報表，Simulator 的 <code>volatility_std<\/code> 已是「每局得分 ÷ 該模式實際押注」的標準差（EB／BF 已含模式倍數），<strong>不要再除模式倍數<\/strong>；只有標準差以底注計時才 ÷ 模式倍數。含救援、新手體驗等機制的驗證，以 <strong>2σ<\/strong> 判定（<code>|實測 RTP − 目標| ≤ 2σ<\/code>）。結果表必須列出 σ 倍數與「符合」欄。<\/li><\/ul>\n<h4 id=\"123-押注檔位自動選組\">1.2.3 押注檔位自動選組<\/h4>\n<p>模擬使用哪一組設定（RTP／Variant 模型＋OP Jackpot 檔）由<strong>使用者設定的押注<\/strong>決定，不由人工逐批對照：<\/p>\n<ul><li><strong>檔位判定<\/strong>：<code>small &lt; $2 ≤ medium ≤ $100 &lt; big<\/code>。<code>$2<\/code> 界線用 <code>bet_tier_amount<\/code>（NB／EB＝實際押注；BF／SF＝購買價 ÷ Feature 倍數）；<code>$100<\/code> 界線用<strong>基礎押注<\/strong>（NB／EB＝<code>base_bet<\/code>；BF／SF 同左），對齊 SPS <code>isHighBet()<\/code>。<\/li><li><strong>自動對應<\/strong>：使用者只設定「水位系列＋押注＋Bet Mode（＋Profile）」，程式依遊戲的檔位對應表自動選 <code>config_rtp_file<\/code> 與 OP Jackpot 檔；對應表由各遊戲定義並記錄於該遊戲的 <code>BATCH_RUNS<\/code> 註解或修改紀錄。<\/li><li>手動在批次中指定 <code>config_rtp_file<\/code> 時以手動值為準（override），並照常於報表 Base Info 印出實際使用的 config。<\/li><li>Newbie 若各版權重共用，則不分檔位、固定一組。<\/li><\/ul>\n<p>範例（H028 雷神爆金，老手）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔位<\/th><th>系列 A（92／94 水位）<\/th><th>系列 B（88／90 水位）<\/th><th>OP Jackpot<\/th><\/tr><\/thead><tbody><tr><td>小 Bet（&lt; $2）<\/td><td><code>config_94A.js<\/code><\/td><td><code>config_90B.js<\/code><\/td><td>C<\/td><\/tr><tr><td>中 Bet（$2 ~ $100）<\/td><td><code>config_92A.js<\/code><\/td><td><code>config_88B.js<\/code><\/td><td>B<\/td><\/tr><tr><td>大 Bet（&gt; $100）<\/td><td><code>config_92A_Bet100.js<\/code><\/td><td><code>config_88B_Bet100.js<\/code><\/td><td>B<\/td><\/tr><\/tbody><\/table><\/div>\n<p>（Newbie 四版權重共用，不分檔位，OP Jackpot 用 A。）<\/p>\n<p>&gt; H028 已實作：<code>CONFIG_RTP_FILE = \"AUTO\"<\/code>（預設）＋<code>RTP_SERIES = \"A\"/\"B\"<\/code> 依押注自動選 config；<code>JACKPOT_FILE = \"AUTO\"<\/code> 依 Profile／檔位自動選 JP 檔（newbie→A、老手小→C、中大→B）。環境變數 <code>H028_RTP_SERIES<\/code> 可逐批覆寫；<code>BATCH_RUNS<\/code> 內明寫 <code>config_rtp_file<\/code> 即為 override。邊界已以 $1／$2／$100／$101／$150 實測（94A→92A→92A_Bet100 切換正確）。<\/p>\n<h3 id=\"13-執行結束後印出的內容\">1.3 執行結束後印出的內容<\/h3>\n<h4 id=\"131-固定順序與共用格式\">1.3.1 固定順序與共用格式<\/h4>\n<p>Console 輸出順序是固定規範，不得依 dict、DataFrame 或統計完成時間任意排序。每個 Batch 必須依下列順序輸出：<\/p>\n<ol><li>Batch 標題：<code><mark class=\"hl-warn\">= Batch n/total: {...} <\/mark>=<\/code>。<\/li><li>遊戲資訊：<code>game_name<\/code>、<code>game_id<\/code>。<\/li><li>Config 與版本：<code>config_file<\/code>、<code>config_rtp_file<\/code>、<code>math_version<\/code>、<code>card_system<\/code>。<\/li><li>執行設定：<code>bet_mode<\/code>、<code>bet_multi<\/code>、<code>feature_price_multiplier<\/code>、<code>base_bet<\/code>、<code>bet_amount<\/code>、<code>bet_tier_amount<\/code>、<code>bet_tier<\/code>、<code>link_enabled<\/code>、<code>max_multiplier_bg<\/code>、<code>max_multiplier_fg<\/code>、<code>coin_in<\/code>、<code>total_rounds<\/code>、<code>duration<\/code>。<\/li><li>RTP 與 Feature 統計：從 <code>rtp_total<\/code> 到 <code>avg_fg_spins<\/code>。<\/li><li>FG／特殊符號統計：<code>bg_trigger_fg_cnt<\/code>、<code>bg_trigger_fg_pay<\/code>（Card System Off 另加 <code>bg_trigger_fg_cnt_newbie<\/code>、<code>bg_trigger_fg_pay_newbie<\/code>）、<code>special_symbol_cnt<\/code>、<code>SCR<\/code>。<\/li><li>波動資訊：<code>volatility_std<\/code>、<code>standard_error<\/code>。<\/li><li>Card System 資訊：從 <code>card_system_profile<\/code> 到 <code>retry_limit_fg<\/code>；只在 Card System 開啟時整段顯示。<\/li><li>遊戲專屬資訊：<code>&lt;&lt; By Game Info &gt;&gt;<\/code> 及該遊戲規定的 By Game 欄位。<\/li><\/ol>\n<ul><li>欄位必須依下方範例逐項排列，不得交換前後順序。<\/li><li>空白行只用於區塊分隔，不影響欄位順序；不得在同一區塊中插入其他欄位。<\/li><li>新增共用欄位時必須先更新本規範並指定位置，不得由個別遊戲自行插入。<\/li><li>Card System 關閉時只省略第 8 項；其他欄位順序不得改變。<\/li><\/ul>\n<pre><code>=== Batch 1/1: {'config_file': 'config.js', 'config_rtp_file': 'config_92A.js', 'bet_mode': 1, 'total_rounds': 1000000, 'card_system_enabled': True, 'card_system_is_newbie': False, 'base_bet': 1} ===\n\ngame_name               : 幸運王牌\ngame_id                 : H016\nconfig_file             : config.js\nconfig_rtp_file         : config_92A.js\nmath_version            : 0.0.0.0\ncard_system             : on\n\nbet_mode                : Extra Bet\nbet_multi               : 2\nfeature_price_multiplier: n/a\nbase_bet                : 1.0\nbet_amount              : 2.0\nbet_tier_amount         : 2.0\nbet_tier                : medium_bet\nlink_enabled            : true\nmax_multiplier_bg       : by_game\nmax_multiplier_fg       : 20000\ncoin_in                 : 100.0\ntotal_rounds            : 1,000,000\nduration                : 00.00 sec\n\nrtp_total               : 00.0000%\nrtp_link                : 00.0000%\nrtp_bonus          : 00.0000%\nrtp_game                : 00.0000%\nrtp_bg                  : 00.0000%\nrtp_fg                  : 00.0000%\nhit_rate_bg             : 00.0000%\nhit_rate_fg             : 00.0000%\nfg_trigger_rate         : 00.0000% (cycle 00.00 spins)\nretrigger_trigger_rate  : 00.0000% (cycle 00.00 free spins)\navg_fg_spins            : 10.03 spins\n\nbg_trigger_fg_cnt       : 1,000,000\nbg_trigger_fg_pay       : 1,000,000\nbg_trigger_fg_cnt_newbie: 1,000,000   ← 僅 Card System Off\nbg_trigger_fg_pay_newbie: 1,000,000   ← 僅 Card System Off\nspecial_symbol_cnt      : 1,000,000\nSCR                     : 1,000,000\n\nvolatility_std          : 00.00\nstandard_error          : 00.00\n\ncard_system_profile     : oldhand\ncard_retry_limit        : 10000\nretry_total             : 1,000,000\navg_retry               : 00.00\n\nretry_limit_exceeded    : 0\nretry_limit_bg_range    : 0\nretry_limit_bg_freegame : 0\nretry_limit_fg          : 0<\/code><\/pre>\n<ul><li><code>math_version<\/code> 顯示 RTP／Variant 模型的完整四段版本號，例如 <code>2.1.3.13<\/code>；Console 依數學文件原格式輸出，不得自行省略或改寫。只有報表檔名依第 1.1.4 節轉為 <code>02010313<\/code>。<\/li><li><code>duration<\/code> 顯示正式模擬耗時，不包含 Numba Warm-up，固定顯示到小數點後 2 位並加上 <code>sec<\/code>。<\/li><li><code>rtp_total = rtp_link + rtp_bonus + rtp_game<\/code>；三個分項的歸類必須依數學文件，且不得重複計算。<\/li><li><code>rtp_bg<\/code>／<code>rtp_fg<\/code> 是依場景的交叉檢視，不取代 Link／Bonus Game／Game 的產品 RTP 拆分。<\/li><li><code>bg_trigger_fg_cnt<\/code>／<code>bg_trigger_fg_pay<\/code> 為 BG 成功觸發 FG、且該把 BG 倍數 ≤ BG Trigger Cap 的次數與 BG 累計得分；超過 cap 的觸發把兩者都不計入。<code>pay ÷ cnt<\/code> 即為 Detail 之 Free Game 列應填的觸發把截斷平均倍率。自然 FG 觸發率看 <code>fg_trigger_rate<\/code>，不受 cap 影響。<\/li><li>Card System 關閉的自然機率報表必須<strong>分新老手<\/strong>統計：<code>bg_trigger_fg_cnt<\/code>／<code>bg_trigger_fg_pay<\/code> 用 Oldhand 的 cap，另加 <code>bg_trigger_fg_cnt_newbie<\/code>／<code>bg_trigger_fg_pay_newbie<\/code> 用 Newbie 的 cap（cap 取指定 RTP Config 該 Profile <code>base_game<\/code> 卡組最高正權重 <code>range<\/code> 上限；Extra Bet 取 <code>eb_base_game<\/code>）。新手上限 ≤ 老手，大倍數被擋得較多，觸發把平均倍率會不同，解新手權重時必須用新手那組。<\/li><li>Card System 開啟時只顯示目前 Profile 的 <code>bg_trigger_fg_cnt<\/code>／<code>bg_trigger_fg_pay<\/code>。<\/li><li><code>Multiplier Line<\/code> 的 <code>bg_trigger_fg_cnt_lte_upper<\/code>／<code>bg_trigger_fg_pay_lte_upper<\/code> 保留所有上限的累計結果；它們不受目前執行 Profile 影響，同一份 Card System Off 自然報表必須可供不同 Profile cap 共用。<\/li><li>Card System 關閉時，從 <code>card_system_profile<\/code> 到 <code>retry_limit_fg<\/code> 的整個區塊不顯示。<\/li><li><code>card_retry_limit<\/code> 正式設定為 <code>10000<\/code>。<\/li><li><code>avg_retry<\/code> 固定顯示到小數點後 2 位。<\/li><li>次數及累計值使用千分位逗號，例如 <code>1,000,000<\/code>。<\/li><li>百分比欄位固定顯示 <code>%<\/code>；Cycle 必須同時顯示平均間隔與正確單位。<\/li><li><code>special_symbol_cnt<\/code> 統計出現特殊符號 <code>SC<\/code> 的 Spin 次數，Base Spin 與每一次 Free Spin 都要納入。<\/li><li>單次 Base Spin／Free Spin 只要盤面出現至少一個 <code>SC<\/code> 就加 <code>1<\/code>；同一 Spin 出現多個 <code>SC<\/code> 仍只加 <code>1<\/code>。<\/li><li>Cascade 過程若同屬同一次 Spin，不得因不同盤面重複累加；該 Spin 最終最多計數 <code>1<\/code>。<\/li><li><code>special_symbol_rate = special_symbol_cnt / total_rounds<\/code>，只作為 SCR 的中間計算值；分母只使用付費場數，不加 Free Spin 數。<\/li><li><code>SCR = special_symbol_rate × 10,000,000,000<\/code>。<\/li><li>Console 與 <code>Overview<\/code> 不輸出 <code>special_symbol_rate<\/code>，只輸出換算後的 <code>SCR<\/code>。<\/li><li><code>total_rounds = 0<\/code> 時，<code>SCR<\/code> 輸出 <code>0<\/code>，不得除以零。<\/li><li>不適用的 Feature 欄位可不顯示，但不得以錯誤的 <code>0<\/code> 冒充已驗證結果。<\/li><\/ul>\n<h4 id=\"132-game-info\">1.3.2 Game Info<\/h4>\n<p><code>&lt;&lt; By Game Info &gt;&gt;<\/code> 固定放在共用輸出的最後：Card System On 時接在 <code>retry_limit_fg<\/code> 之後，Off 時接在 <code>standard_error<\/code> 之後。此區用來顯示遊戲專屬統計；欄位依玩法增減，不適用的欄位不得沿用其他遊戲。<\/p>\n<p>H016 範例：<\/p>\n<pre><code>&lt;&lt; By Game Info &gt;&gt;\n\navg_cascades_bg        : 0.410662\navg_cascades_fg        : 0.6329912625344514\ngolden_converted       : 182505\nw2_events              : 4427\nw2_bg_event_rate       : 0.330700%\nw2_fg_event_rate       : 1.313552%\nw2_bg_count_2          : 2917\nw2_bg_count_3          : 373\nw2_bg_count_4          : 17\nw2_fg_count_2          : 1069\nw2_fg_count_3          : 48\nw2_fg_count_4          : 3\nm1_bg_spin_rate        : 79.9233<\/code><\/pre>\n<ul><li>H016 的 By Game 欄位必須依上方順序輸出，不得依字母排序或統計產生順序重排。<\/li><li>H016 若新增其他 By Game 欄位，新增欄位接在既有欄位之後，並同步更新本規範。<\/li><\/ul>\n<h3 id=\"14-驗證清單\">1.4 驗證清單<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code>BATCH_RUNS<\/code> 每筆均包含七個必要欄位。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 自然機率與倍率權重分別從 <code>config_file<\/code>、<code>config_rtp_file<\/code> 載入。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 固定 RNG／種子可重現相同結果。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Worker 合併後的總場次等於 <code>total_rounds<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Console 與 Excel 報表的共用欄位及數值一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>bg_trigger_fg_cnt<\/code> 與 <code>bg_trigger_fg_pay<\/code> 位於 <code>avg_fg_spins<\/code> 後，且次數與 BG 得分口徑正確。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>free_game<\/code> 卡接受的觸發 BG 均未超過同 Profile 正權重 BG <code>range<\/code> 卡的最大上限；超過上限的結果已重跑。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System Off 的自然機率報表分新老手：<code>bg_trigger_fg_cnt<\/code>／<code>bg_trigger_fg_pay<\/code> 依 Oldhand cap、<code>bg_trigger_fg_cnt_newbie<\/code>／<code>bg_trigger_fg_pay_newbie<\/code> 依 Newbie cap 過濾（次數與得分同一口徑）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>Multiplier Line<\/code> 的第一欄為由 <code>Interval_Upper<\/code> 自動產生的 <code>Interval<\/code>；每一列均有 <code>Interval_Upper<\/code> 與累計至該上限的 BG Trigger count/pay；累計值單調不減；Oldhand／Newbie cap 那一列的 count／pay 分別等於 Overview 的 <code>bg_trigger_fg_cnt<\/code>／<code>bg_trigger_fg_pay<\/code> 與 <code>_newbie<\/code> 兩欄。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 倍率權重工具從 Profile 的最大正權重 BG range 自動選取完全相同上限的累計 count/pay，未寫死個別 Profile 或遊戲 cap。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>special_symbol_cnt<\/code> 同時統計 Base Spin 與 Free Spin，且同一 Spin 即使出現多個 <code>SC<\/code> 也只累加一次。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>SCR<\/code> 等於 <code>(special_symbol_cnt / total_rounds) × 10,000,000,000<\/code>，且 Console 與 <code>Overview<\/code> 的數值一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System 區塊位於 <code>standard_error<\/code> 後；Card System Off 時整段移除且其他欄位不重排。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>Overview<\/code> 與 Console 的內容及順序一致，且未包含 Batch 與 <code>&lt;&lt; By Game Info &gt;&gt;<\/code> 標題。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>Multiplier Line<\/code> 包含所有共用欄位，並依遊戲功能正確顯示或移除 BF／SF 與 By Game 欄位。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 報表檔名依 H026 規則排列，時間、Bet Mode、場次段均正確，且不含 <code>card<\/code> 後綴。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System Off 使用基礎 <code>game_id<\/code> 與 2 位數基礎版本，例如 <code>H0161_02<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System On 使用 RTP／Variant <code>game_id<\/code> 與補零後的四段版本，例如 <code>H016192A_02000000<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Oldhand 的 Card System On 報表檔名包含 <code>small_bet<\/code>、<code>medium_bet<\/code> 或 <code>big_bet<\/code>，且與 <code>bet_amount<\/code> 判定結果一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 四段版本已逐段補滿 2 位數，例如 <code>2.1.3.13<\/code> 正確輸出為 <code>02010313<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> RTP 與 Feature Trigger 接近目標，偏差有統計解釋。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Newbie 的 BG／FG Max Multiplier 分別不超過 30x／120x，且 Link RTP 為 0%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Oldhand 小 Bet 的 FG Max Multiplier 不超過 20000x，且 Link RTP 為 0%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Oldhand 中 Bet 的 FG Max Multiplier 不超過 20000x，且 Link RTP 為 2%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Oldhand 大 Bet 的 BG／FG Max Multiplier 不超過 1000x（BG 另不超過天花板推得的上限），且 Link RTP 為 2%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 各批次皆滿足 <code>rtp_total = rtp_link + rtp_bonus + rtp_game<\/code>，並符合《數學模型規範》第 1.5 節目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> BF／SF Newbie 為 <code>0% + 4% + 92.5% = 96.5%<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> BF／SF Oldhand 小 Bet 為 <code>0% + 4% + 92.5% = 96.5%<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> BF／SF Oldhand 中／大 Bet 為 <code>2% + 2% + 92.5% = 96.5%<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System 設定占比與實際占比一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Retry Limit Exceeded 為零，或已有明確原因與核准處理方式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 最大獎未超出限制，理論可達結果有相應測試。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 畫面會出現的元素（倍數球、轉盤每一格、特色符號、各種得分組合）在 Card-On 下都有機會得分，依《數學模型規範》第 2.7 節檢查並列入數值報告。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有正式 Config／Mode／Profile 均有最新版本報表。<\/li><\/ul>\n<hr>\n<h2 id=\"2-config\">2. Config<\/h2>\n<h3 id=\"21-定位與轉檔\">2.1 定位與轉檔<\/h3>\n<p>Config 分為基礎 Config 與 RTP／Variant Config：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Config<\/th><th>對應數學文件<\/th><th>版本格式<\/th><\/tr><\/thead><tbody><tr><td><code>config.js<\/code><\/td><td><code>H&lt;遊戲編號&gt;1.xlsx<\/code>，例如 <code>H0161.xlsx<\/code><\/td><td><code>excel_version<\/code> 為 1 碼<\/td><\/tr><tr><td><code>config_A.js<\/code>、<code>config_B.js<\/code><\/td><td>有 A／B 兩套基礎數學時取代 <code>config.js<\/code>：<code>H&lt;遊戲編號&gt;1A.xlsx<\/code>、<code>H&lt;遊戲編號&gt;1B.xlsx<\/code>，例如 <code>config_A.js<\/code> 對應 <code>H0271A.xlsx<\/code><\/td><td><code>excel_version<\/code> 為 1 碼<\/td><\/tr><tr><td><code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code><\/td><td><code>H&lt;遊戲編號&gt;1&lt;RTP&gt;&lt;Variant&gt;.xlsx<\/code>，例如 <code>config_92A.js<\/code> 對應 <code>H016192A.xlsx<\/code><\/td><td><code>excel_version<\/code> 為 4 碼，且第 1 碼對應基礎版本<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>基礎 Config 只放基礎數學（輪帶、Paytable、Symbol、Feature、Bet Mode 等）；RTP／Variant Config 只放卡片權重與該版本的 RTP 參數，不得把基礎資料合併進 RTP／Variant Config。<\/li><li>有 A／B 兩套基礎數學時，不建立 <code>config.js<\/code>；<code>config_&lt;RTP&gt;A.js<\/code> 搭配 <code>config_A.js<\/code>，<code>config_&lt;RTP&gt;B.js<\/code> 搭配 <code>config_B.js<\/code>，Simulator 與 Demogame 依 Variant 字母載入對應的基礎 Config。<\/li><\/ul>\n<ul><li><code>Newbie<\/code>／<code>Oldhand<\/code> 是 Card System 的 Player Profile，不寫入 Config 檔名。<\/li><li>RTP／Variant 模型的 XLSX、Config、Simulator、Demogame 與報表必須使用相同 Config 代號。<\/li><\/ul>\n<p>兩種 Config 都是 Simulator 與 Demogame 的執行參數，不是人工獨立維護的第二份數學文件。正式參數必須由各自對應的 <code>Source/*.xlsx<\/code> 轉出；轉換一律由 AI 依 mapping 執行，專案內不建立、不維護 Excel↔Config 轉檔工具。<\/p>\n<pre><code>修改基礎或 RTP／Variant Source XLSX\n      ↓\n依文件類型更新 1 碼或 4 碼版本\n      ↓\n由 AI 依 Source 與 mapping 轉出 Config\n      ↓\n檢查欄位、型別、長度、權重與版本\n      ↓\n完成 XLSX → Config → 程式讀取對帳\n      ↓\n執行 Simulator 與 Demogame 驗證<\/code><\/pre>\n<p>禁止直接修改 Config 中由 XLSX 產生的大型陣列來規避轉檔；結果錯誤時應修正 XLSX 或 mapping 後重新轉出。<\/p>\n<h3 id=\"22-最低資料\">2.2 最低資料<\/h3>\n<p>Config 至少應提供遊戲實際需要的：<\/p>\n<ul><li><code>game_id<\/code>、<code>game_name<\/code>、<code>excel_version<\/code> 與 Config 類型／代號。<\/li><li>Reel 數、盤面尺寸、Symbol ID／名稱／屬性。<\/li><li>Reel Strip／Weight／Length、Paytable、Payline／Ways／Cluster。<\/li><li>Table、Table Weight、Drop Mode 與各 Scene 資料。<\/li><li>Bet Mode ID、成本倍率、Bet Level／DENOM。<\/li><li>BG、FG、Cascade、Multiplier、Retrigger 與 Feature 參數。<\/li><li>Card System 開關、Retry Limit、Profile、NB／EB 與 BF／SF 的押注層級判定方式、Oldhand 小／中／大 Bet 門檻、卡片區間與各模式／層級權重。<\/li><li>Link 資格、Link／Bonus Game／Game RTP 目標與 Total RTP。<\/li><li>Newbie BG／FG、Oldhand 小／中／大 Bet 的 Max Win／Max Multiplier 與其他產品限制。<\/li><\/ul>\n<p>同一概念在不同 Config 間必須保持一致，並記錄於數學模型的 <code>Game Description<\/code> 工作表。<\/p>\n<h3 id=\"23-資料驗證\">2.3 資料驗證<\/h3>\n<ul><li><code>game_id<\/code> 與所在遊戲資料夾一致。<\/li><li><code>config.js<\/code> 的 <code>excel_version<\/code> 與基礎 XLSX 完全一致，且只能是 1 碼。<\/li><li>初次建立時，競品模型的基礎 XLSX／Config 版本為 <code>0<\/code>，非競品模型為 <code>1<\/code>；來源分類必須可追溯。<\/li><li><code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code> 的 <code>excel_version<\/code> 與對應 RTP／Variant XLSX 完全一致，且必須是 4 碼。<\/li><li>RTP／Variant Config 的版本第 1 碼，必須與對應的基礎 Config（<code>config.js<\/code>，或 A／B 時的 <code>config_A.js<\/code>／<code>config_B.js<\/code>）及基礎 XLSX 的版本相同。<\/li><li>Config 檔名、類型、內部 RTP／Variant 與來源 XLSX 相符。<\/li><li>所有 Weight 非負，啟用選項的總權重大於 0。<\/li><li>Newbie 與 Oldhand 小／中／大 Bet 的權重、Link 資格、RTP 拆分及倍率上限齊全且互相一致。<\/li><li>押注層級邊界必須精確符合 <code>&lt; $2<\/code>、<code>&gt;= $2 且 &lt;= $100<\/code>、<code>&gt; $100<\/code>，不得因浮點誤差選錯層級。<\/li><li>NB／EB 必須以實際模式押注判斷；BF／SF 必須以購買價格除以 Feature Price 倍數後的基礎押注判斷。<\/li><li>Reel、Weight、Paytable、Symbol 與 Mode 陣列長度相容。<\/li><li>所有 ID／索引在有效範圍，無重複或遺漏。<\/li><li>Min／Max、倍率、局數與 Max Win 限制合法。<\/li><li>未支援的 Mode／Profile／Feature 不存在或明確停用。<\/li><li>浮點精度足以還原來源數值，不因格式化造成 RTP 偏差。<\/li><\/ul>\n<h3 id=\"24-版本與歷史檔\">2.4 版本與歷史檔<\/h3>\n<ul><li>正式 Config 放在遊戲資料夾根層，包括基礎 <code>config.js<\/code>（A／B 時為 <code>config_A.js<\/code>、<code>config_B.js<\/code>）與實際支援的 <code>config_92A.js<\/code> 等 RTP／Variant Config。<\/li><li>歷史 Config 放在對應的 <code>Versions/<\/code> 版本目錄；基礎 Config 與 RTP／Variant Config 都必須保留來源及版本關係。<\/li><li><code>Versions/version_manifest.js<\/code> 記錄完整版本、可用 Config、路徑與變更說明。<\/li><li>Runtime、Simulator 與 Demogame 不得自行覆寫 Config 版本。<\/li><li>Index 載入基礎 Config（<code>config.js<\/code>、<code>config_A.js<\/code>、<code>config_B.js<\/code>）時顯示 1 碼基礎版本；載入 RTP／Variant Config 時顯示完整 4 碼版本。<\/li><li>RTP／Variant 版本若第 1、2 碼相同，Index 只顯示第 3、4 碼最新的版本。<\/li><li>Version 與 Config 選單只列出 manifest 中實際存在且相容的組合。<\/li><\/ul>\n<h3 id=\"25-最終交付檢查\">2.5 最終交付檢查<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code>config.js<\/code> 對應基礎 XLSX；每個 <code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code> 對應相同 RTP／Variant 的 XLSX。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 基礎 XLSX／Config 使用 1 碼版本，RTP／Variant XLSX／Config 使用 4 碼版本，且第 1 碼一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> XLSX、Config、Simulator、Demogame 與文件版本一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 可由 Source 重新轉出，且不會產生非預期差異。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個 Config 都有來源 XLSX 與 mapping 說明。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Simulator 與 Demogame 沒有重複或覆寫 Config 參數。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有可選 Config／Version／Profile／Mode 均真實存在且已驗證。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 最新模擬報表已保存於 <code>Record/<\/code>，結果符合目標與限制。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 代表性單局已完成 Config、Simulator、Demogame 三方對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>~$*.xlsx<\/code>、<code>__pycache__/<\/code>、臨時檔與測試輸出未列入正式交付。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 給 SPS 的檔案已依《開發流程》§5.8「交付 SPS 打包」打成 <code>其他/To SPS/&lt;GameID&gt;_&lt;四碼版本&gt;.zip<\/code>（<code>config*.js<\/code>、<code>Simulator.py<\/code>、<code>給SPS說明_&lt;版本&gt;.txt<\/code>）。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-demo\" hidden><h1 id=\"demogame規範\">Demogame規範<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 <a href=\"#\" class=\"tab-link\" data-tab=\"overview\">_README.md<\/a>。<\/p>\n<p><strong>存放位置<\/strong>（路徑以遊戲專案資料夾 <code>Slots/H0xx_遊戲名稱/<\/code> 為準，總表見<a href=\"#\" class=\"tab-link\" data-tab=\"outputs\" data-anchor=\"3-專案目錄與存放位置\">產出與紀錄規範<\/a>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td><code>index.html<\/code><\/td><td>專案根目錄<\/td><\/tr><tr><td>Demo 用符號圖（WebP）<\/td><td><code>Source/Image/<\/code><\/td><\/tr><tr><td>共用樣式與程式 <code>demogame_common.css<\/code>／<code>.js<\/code><\/td><td><code>Slots/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-用途與載入\">1. 用途與載入<\/h2>\n<p>Demogame 是模型邏輯、流程與 Debug 資訊的可操作驗證介面，不只是視覺展示。它必須能用單局結果證明 Config、Simulator 與遊戲規則一致。<\/p>\n<ul><li>主入口固定為 <code>index.html<\/code>，使用相對路徑，雙擊即可離線執行。<\/li><li>Config 選單只列 Config 代號，不列 Profile，Demogame 不提供 Newbie：例如 <code>BaseA<\/code>、<code>BaseB<\/code>、<code>92A<\/code>、<code>94A<\/code>、<code>92A_BET100<\/code>、<code>92B<\/code>。<\/li><li>卡片系統沒有獨立的開關，由 Config 選單決定：選 <code>Base<\/code> 為自然機率（卡片系統關），選 <code>92A<\/code> 等 Config 代號為卡片系統開（Oldhand）。<\/li><li>自然機率只依基礎數學 Variant 區分，與 RTP 家族無關：只有一套時顯示 <code>Base<\/code>；有 A／B 兩套時顯示 <code>BaseA<\/code>、<code>BaseB<\/code>。<\/li><li>標題列右側固定放「數值報告」（有報告時）、「說明」、「重置」三個文字按鈕（無底色、無外框，滑過才顯示底色），字型與標題相同，標題列高 44px；數值報告在同一分頁開啟。<\/li><li>標題列樣式各遊戲一致：代號＋名稱 15px 粗體、上下置中（由共用 CSS 統一），不得另寫遊戲專屬的標題樣式。<\/li><li>盤面不得裁掉格子的特效：中獎放大、百搭彈出與外發光在最外側一欄／一列也要完整顯示（共用 CSS 對 <code>#board.board-grid<\/code> 保留 14px 外圍可見範圍）。<\/li><li>遊戲名稱、盤面、輪帶、權重、Paytable、Bet Mode 與 Feature 參數從 Config 取得。<\/li><li>不得為演出方便另寫一套簡化數學邏輯。<\/li><li>Config 無法載入或欄位不完整時要顯示明確錯誤，不得靜默使用舊值。<\/li><\/ul>\n<h3 id=\"11-遊戲類型命名規則\">1.1 遊戲類型命名規則<\/h3>\n<p>Game Rule、Demogame 與 Help 的遊戲類型統一使用以下格式：<\/p>\n<p><code>Video Slot - &lt;主要派彩類型&gt; / &lt;附加機制&gt;<\/code><\/p>\n<p>主要派彩類型只能依實際判獎邏輯選擇一種：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類型<\/th><th>統一英文<\/th><th>判定規則<\/th><\/tr><\/thead><tbody><tr><td>群集派彩<\/td><td><code>Cluster Pay<\/code><\/td><td>相同符號必須在盤面上依規定方向相鄰連接，且連接數量達門檻才得獎。<\/td><\/tr><tr><td>全盤計數<\/td><td><code>Pay Anywhere<\/code><\/td><td>相同符號在整個盤面的總數達門檻即得獎，不要求相鄰、連線或由最左輪開始。<\/td><\/tr><tr><td>路數派彩<\/td><td><code>N Ways<\/code><\/td><td>相同符號由最左輪起，在連續相鄰輪出現即得獎；文件中的 <code>N<\/code> 必須換成實際固定 Ways 或最小～最大 Ways。<\/td><\/tr><tr><td>線數派彩<\/td><td><code>N Lines<\/code><\/td><td>依固定 Payline 判獎；文件中的 <code>N<\/code> 必須換成實際線數。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code>Cascade<\/code>、<code>Megaways<\/code>、Multiplier 與 Feature 屬附加機制，不得代替主要派彩類型。<\/li><li>不要求相鄰的全盤計數玩法不得標示為 <code>Cluster Pay<\/code> 或 <code>Cluster Pays<\/code>。<\/li><li>連消流程使用的得分倍數統一稱為 <code>Cascade Multiplier<\/code>，不得再使用 <code>Progressive Multiplier<\/code>、<code>Progressive Cascade Multiplier<\/code> 或 <code>Progressive Win Multiplier<\/code>。<\/li><li>相同術語必須同步出現在 Game Rule、Index Help 與遊戲清單，不得各自使用不同名稱。<\/li><\/ul>\n<p>目前正式遊戲類型如下：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>遊戲<\/th><th>統一遊戲類型<\/th><\/tr><\/thead><tbody><tr><td>H013 糖果狂歡 1000<\/td><td><code>Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H015 賞金列車<\/td><td><code>Video Slot - 3,600 Ways / Cascade / Cascade Multiplier<\/code><\/td><\/tr><tr><td>H016 幸運王牌<\/td><td><code>Video Slot - 1,024 Ways / Cascade / Cascade Multiplier<\/code><\/td><\/tr><tr><td>H019 埃及秘寶<\/td><td><code>Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H026 彩罐熱舞 1000<\/td><td><code>Video Slot - 20 Lines / Cascade<\/code><\/td><\/tr><tr><td>H027 宙斯 2500<\/td><td><code>Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H028 雷神爆金<\/td><td><code>Video Slot - 2,025–32,400 Ways / Megaways / Cascade<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>目前正式遊戲沒有使用 <code>Cluster Pay<\/code>；日後只有實際採相鄰群集判獎的遊戲才能列入此類。<\/p>\n<h2 id=\"2-共用區域與-by-game-區域\">2. 共用區域與 By Game 區域<\/h2>\n<p>圖示中的遊戲顯示區域屬於 By Game 設計；除此之外的 Demogame 區域均為所有遊戲共用。<\/p>\n<h3 id=\"21-by-game-區域\">2.1 By Game 區域<\/h3>\n<p>下列區域依各遊戲盤面、Feature 與美術需求自行設計：<\/p>\n<ul><li>Game Title：遊戲 ID、遊戲名稱及遊戲專屬標題樣式。<\/li><li>Feature Status：Cascade／Combo、FG Left、Multiplier 與其他遊戲狀態（不顯示 Base Game／Free Game 模式標題；沒有要顯示的特色時整列隱藏，由共用模組處理）。<\/li><li>Reel／Board：盤面尺寸、Reel、Symbol、框體、特殊符號及遊戲專屬資訊。<\/li><li>Board Animation：Spin、中獎、消除、補牌、掉落、轉換、Multiplier 與 Feature 動畫。<\/li><li>Board Message：盤面下方的局數、FG 進度、得分、No Win 與遊戲流程訊息。<\/li><\/ul>\n<p>對應元素通常為 <code>#feature-bar<\/code>、<code>#strip-bar<\/code>、<code>#grid-panel<\/code>／<code>#board<\/code> 及盤面 Message Bar。實際 ID 可以依遊戲調整，但範圍與責任不得擴張到共用區域。<\/p>\n<p>By Game 區域必須：<\/p>\n<ul><li>從 Config 取得名稱、盤面、Symbol、倍率與 Feature 資料，不得寫死其他遊戲的內容。<\/li><li>只維護遊戲專屬 HTML、CSS、Render、動畫與狀態轉換。<\/li><li>將共用操作需要的狀態與結果透過固定介面交給共用模組，不得複製整套共用控制邏輯。<\/li><\/ul>\n<h3 id=\"22-共用區域\">2.2 共用區域<\/h3>\n<p>除第 2.1 節外，其餘區域與行為均由所有遊戲共用，包括：<\/p>\n<ul><li>Player：Credit、Bet、Win。Player／Play／Bet Mode 三區一律放在盤面下方（左欄），右欄只留統計；手機版（單欄）依序為盤面、這三區、統計（共用模組處理）。<\/li><li>Stats／Simulation。Stats（標題「基本指標」）放共用項目（總局數、RTP、中獎率、FG 觸發、BG／FG 最大倍數；原「最高倍數」與其重複，不再顯示）；遊戲自訂的特殊指標（只放觀察玩法機制用的即時統計，例如金框使用率；FG 週期等遊戲數據已在報告中，不放這裡）放在下方獨立的「特殊指標」區（共用模組自動把非共用列移入，也可在列上標 <code>data-by-game<\/code>），沒有特殊指標就不顯示這區。<\/li><li>Play：Spin、Auto、Bet Stepper、Speed。<\/li><li>Bet Mode 的容器、共用互動與狀態樣式；實際支援模式及倍率由 Config 決定。按鈕字體、大小一致、字一律白色：NB／EB 為切換鈕（選取中用「自動」鈕的深綠底白字），BF／SF 為購買鈕，用 SPIN 的藍底白字（共用模組依按鈕文字判斷）。<\/li><li>Debug Mode、Set RNG、Log 與歷史紀錄（Spin Result 面板與 Force FG 已停用，由共用模組隱藏；Reel RNG 停輪面板已拿掉，改用統計區的 BG／FG 最大倍數）。<\/li><li>Setting：Version、Config／Profile、Language、Help、Reset。<\/li><li>Language：共用區的固定英文標籤由 <code>demogame_common.js<\/code> 依 <code>#languageSelect<\/code> 統一切換中英（整段完全相同才替換）；By Game 區域與遊戲專屬文字仍由各遊戲自行翻譯，切回 English 必須還原。<\/li><li>共用彈窗、按鈕狀態、欄位樣式、響應式版面、無障礙與錯誤顯示。各區塊上下、左右間距一律 10px（含盤面與右欄、頁尾與設定區），頁尾文字置中、用區域標題的說明色。字體統一：所有按鈕 12px 粗體；Debug
