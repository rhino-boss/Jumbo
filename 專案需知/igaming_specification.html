例：<code>Buy Feature A2<\/code>）<\/td><\/tr><tr><td>RNG<\/td><td>預錄的 RNG 序列（逗號分隔）<\/td><\/tr><tr><td>Multi<\/td><td>該腳本的總得分倍率（以該模式單注為底）<\/td><\/tr><tr><td>RTP<\/td><td><code>Multi ÷ 押注 × 100%<\/code><\/td><\/tr><tr><td>抽選權重<\/td><td>同組腳本間的抽選權重<\/td><\/tr><tr><td>押注<\/td><td>該模式的成本倍數（NB＝1、BF＝購買價倍數）<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"4-挑選規則\">4. 挑選規則<\/h2>\n<h3 id=\"41-新手體驗\">4.1 新手體驗<\/h3>\n<ul><li>每支權重＝1、押注＝1；同名 A／B 兩支等權重擇一。<\/li><li>總倍率為體驗設計值，製作前與使用者確認（參考值：Free Game 12x、Jackpot Game 10x）。<\/li><\/ul>\n<h3 id=\"42-buy-feature\">4.2 Buy Feature<\/h3>\n<ul><li>每個版型三支：高／中／低 RTP 各一，另配抽選權重；押注＝Buy Feature 價格倍數。<\/li><li><strong>加權整合必須等於該遊戲 BF 的 RTP<\/strong>：<code>Σ(RTP × 權重) ÷ Σ(權重) = BF RTP<\/code>。BF RTP 取該遊戲數學模型規範的 BF／SF RTP 配置（有多個 RTP 版本時依版本）。<\/li><li>三檔 RTP 先定，權重由上式解出並整數化；解出後驗算到小數 2 位精確。<\/li><li>參考例（前作 92 版，當時 BF RTP 目標 96.00%）：105.67%×800＋88.80%×200＋81.53%×435 → 加權 96.00%。<\/li><\/ul>\n<h3 id=\"43-free-spin-系統\">4.3 Free Spin 系統<\/h3>\n<ul><li>適用新手 NB 的免費遊戲段（一段 10 把）。<\/li><li>挑法：10 把中<strong>挑一把跑 <code>0-1x<\/code> 腳本、挑一把跑 <code>9x<\/code> 腳本<\/strong>，其餘各把不中獎。<\/li><li><code>9x<\/code> 腳本固定 <strong>10 支<\/strong>，<strong>抽選權重鎖死全部＝1<\/strong>（等權重擇一），不得調整。<\/li><li>整段合計約 10x（參考值：0-1x＝44%＋9x＝955.56% → 999.56%）。<\/li><\/ul>\n<h3 id=\"44-版型與共用\">4.4 版型與共用<\/h3>\n<ul><li>腳本表依 RTP 版型分組（例：92 版一張）；同一支 RNG 序列若在多個 RTP 版可重放出相同結果，可跨版共用並註記。<\/li><li>大額投注使用獨立模型（<code>_Bet100<\/code>）的遊戲：腳本倍率不得超過該模型的倍率上限（例：大 Bet BG／FG 上限 1,000x）。<\/li><\/ul>\n<h2 id=\"5-製作前確認\">5. 製作前確認<\/h2>\n<ol><li>新手體驗涵蓋哪些押注模式（NB 以外是否含 EB／BF 體驗）。<\/li><li>各體驗腳本的目標倍率（Free Game／Jackpot Game）。<\/li><li>腳本表做哪些 RTP 版型、是否跨版共用。<\/li><li>Buy Feature 三檔 RTP 的目標值（權重由「加權＝BF RTP」約束解出）。<\/li><\/ol>\n<h2 id=\"6-交付檢查\">6. 交付檢查<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本表檔名為 <code>&lt;GameID&gt;_腳本規格.xlsx<\/code>，放在 <code>文件/<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本清單依第 2 節結構建立，未支援的模式沒有腳本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每支 RNG 序列已在正式 Config 下重放驗證，結果與表列 Multi 一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Buy Feature 各版型加權整合＝該遊戲 BF RTP（小數 2 位精確）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Free Spin 系統：<code>9x<\/code> 腳本 10 支、權重全部＝1；0-1x 與 9x 各佔一把、其餘不中獎。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本倍率未超出該模式（含 <code>_Bet100<\/code> 模型）的倍率上限。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 輪帶／掉落改版後已重新驗證重放（或重錄）。<\/li><\/ul>\n<h2 id=\"7-範例h028-雷神爆金1000101016\">7. 範例：H028 雷神爆金1000（101016）<\/h2>\n<p>支援 NB＋BF（無 Extra Bet），FG 觸發＝4 SC＝10 把：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類別<\/th><th>腳本<\/th><th>支數<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>NB Free Game A／B、NB Jackpot Game A／B<\/td><td>4<\/td><\/tr><tr><td>Buy Feature<\/td><td>BF A1～A3＋權重、BF B1～B3＋權重（押注 75；加權＝當時 BF RTP 96.00%）<\/td><td>6<\/td><\/tr><tr><td>Free Spin 系統<\/td><td>0-1x ×1＋9x ×10（權重全鎖 1）<\/td><td>11<\/td><\/tr><tr><td>合計<\/td><td><\/td><td><strong>21<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>無 Extra Bet，故不建立 EB 系列腳本；FG 觸發 10 把與 Free Spin 系統的「10 把挑法」一致。<\/p><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-stress\" hidden><h1 id=\"壓測說明書\">壓測說明書<\/h1>\n<p>這份文件回答兩個問題：<strong>要壓什麼<\/strong>，以及<strong>壓出來的數字怎麼判<\/strong>。<\/p>\n<p>設定來源為 <a href=\"#\" class=\"tab-link\" data-tab=\"math\" data-anchor=\"15-rtp-配置\">數學模型規範<\/a> 第 1.5 節與 <a href=\"#\" class=\"tab-link\" data-tab=\"mechanism\">機制說明.md<\/a>；本文件不重複定義設定本身。<\/p>\n<p>目前採用的機制版本：<strong>新手體驗 D 版<\/strong>、<strong>老手救援 B 版<\/strong>。<\/p>\n<p>壓測與其他驗證工具的分工：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>工具<\/th><th>產出<\/th><th>驗證對象<\/th><\/tr><\/thead><tbody><tr><td>數學模型 XLSX<\/td><td>理論 RTP、倍率權重<\/td><td>模型本身的理論值<\/td><\/tr><tr><td>Simulator<\/td><td>單一 Config／Bet Mode／Profile 的大場次報表<\/td><td>單一組合的 Game RTP、Feature 觸發率、Card System<\/td><\/tr><tr><td><strong>壓測<\/strong><\/td><td>固定玩家數 × 固定把數的後端報表<\/td><td><strong>玩家實際歷程下的 RTP<\/strong>，含新老手切換與機制介入<\/td><\/tr><tr><td><code>System/simulator_system.py<\/code><\/td><td>多分頁玩家模擬報表<\/td><td>機制本身的觸發率、Pool 上限、RTP 增量<\/td><\/tr><\/tbody><\/table><\/div>\n<p>關鍵差異：Simulator 每批固定一個 Profile，壓測則是<strong>同一位玩家從第 1 轉跑到第 N 轉<\/strong>，中途由新手期切到老手期，並且會被新手體驗與老手救援介入。<\/p>\n<hr>\n<h2 id=\"1-要壓什麼必跑組合\">1. 要壓什麼？（必跑組合）<\/h2>\n<h3 id=\"11-壓測把數影響\">1.1 壓測把數影響<\/h3>\n<p>壓測以「玩家數 × 每位玩家把數」定義。範例：20,000 位玩家 × 每人 500 把 = 10,000,000 spins。<\/p>\n<p>每人把數決定機制能不能驗到：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>生效轉數<\/th><th class=\"n\">需要的最少把數<\/th><\/tr><\/thead><tbody><tr><td>新手體驗 D 第一次判定<\/td><td>第 50 轉<\/td><td class=\"n\">50<\/td><\/tr><tr><td>新手體驗 D 第二次判定<\/td><td>第 150 轉<\/td><td class=\"n\">150<\/td><\/tr><tr><td>老手救援 B 起始<\/td><td>第 301 轉（新手期 200 ＋ 計算基底 100）<\/td><td class=\"n\">301<\/td><\/tr><tr><td>老手救援 B 第 1 個完整返還區間<\/td><td>301～450<\/td><td class=\"n\"><strong>450<\/strong><\/td><\/tr><tr><td>老手救援 B 第 2 個完整返還區間<\/td><td>451～600<\/td><td class=\"n\"><strong>600<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-押注分級與換算\">1.2 押注分級與換算<\/h3>\n<pre><code>實際押注 = Coin in × currency denom<\/code><\/pre>\n<p><code>currency denom<\/code> 直接寫在報表檔頭，不必另外查。目前平台值為 <code>0.002000<\/code>，即 <code>實際押注 = Coin in ÷ 500<\/code>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>分級<\/th><th>判定依據<\/th><th>Game RTP 版本<\/th><th class=\"n\">可拉 Link<\/th><th>上限倍數<\/th><\/tr><\/thead><tbody><tr><td>小 Bet<\/td><td><code>&lt; $2<\/code><\/td><td>94 版<\/td><td class=\"n\">✗<\/td><td>依數學文件「倍率線型」<\/td><\/tr><tr><td>中 Bet<\/td><td><code>$2 ~ $100<\/code><\/td><td>92 版<\/td><td class=\"n\">✓<\/td><td>依數學文件「倍率線型」<\/td><\/tr><tr><td>大 Bet<\/td><td><code>&gt; $100<\/code>（預設，各遊戲可不同）<\/td><td>92 版<\/td><td class=\"n\">✓<\/td><td>依數學文件「倍率線型」<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>一般模式（NB／EX1／EX2）：<code>$2<\/code> 界線用<strong>實際押注<\/strong>、<code>$100<\/code> 界線用<strong>基礎面額<\/strong>（實際押注 ÷ 模式倍率；對齊 SPS <code>isHighBet()<\/code>，2026-10-27）。<\/li><li>BF／SF 用<strong>基礎面額<\/strong>分級，界線放大為 <code>倍率 × $2<\/code> 與 <code>倍率 × $100<\/code>（等價於用面額判 <code>$2<\/code>／<code>$100<\/code>）。<ul><\/ul><\/li><\/ul>\n<h3 id=\"13-測項產生規則\">1.3 測項產生規則<\/h3>\n<p>先取得該遊戲支援的押注模式（<code>NB<\/code>／<code>EX1<\/code>／<code>EX2<\/code>／<code>BF<\/code>／<code>SF<\/code>）與各模式的押注倍率。不支援的模式整組跳過。<\/p>\n<p>每個支援的模式產生「小／中／大押注 × 新手／老手」共六格測項，再套一條排除規則：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>排除規則<\/th><th>適用<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td>倍率 <code>≥ 2<\/code> 時不產生<strong>小押注<\/strong><\/td><td>NB／EX1／EX2<\/td><td>Extra Bet 最低成本已是 $2，不可能落在小 Bet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>BF／SF 不套用上述排除，六格全跑。<\/p>\n<h3 id=\"14-實例h026\">1.4 實例：H026<\/h3>\n<p>H026 支援的模式與倍率：<code>NB = 1<\/code>、<code>EX1 = 2<\/code>、<code>BF = 75<\/code>；<code>EX2<\/code>、<code>SF<\/code> 不支援。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">#<\/th><th>模式<\/th><th>級距<\/th><th>新老手<\/th><th>押注範圍<\/th><th class=\"n\">目標 Game RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">1<\/td><td>NB<\/td><td>小押注<\/td><td>新手<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">2<\/td><td>NB<\/td><td>小押注<\/td><td>老手<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\">3<\/td><td>NB<\/td><td>中押注<\/td><td>新手<\/td><td><code>2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">4<\/td><td>NB<\/td><td>中押注<\/td><td>老手<\/td><td><code>2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">5<\/td><td>NB<\/td><td>大押注<\/td><td>新手<\/td><td><code>100 &lt; x<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">6<\/td><td>NB<\/td><td>大押注<\/td><td>老手<\/td><td><code>100 &lt; x<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">7<\/td><td>EX1<\/td><td>中押注<\/td><td>新手<\/td><td><code>2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">8<\/td><td>EX1<\/td><td>中押注<\/td><td>老手<\/td><td><code>2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">9<\/td><td>EX1<\/td><td>大押注<\/td><td>新手<\/td><td><code>100 &lt; x<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">10<\/td><td>EX1<\/td><td>大押注<\/td><td>老手<\/td><td><code>100 &lt; x<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">11<\/td><td>BF<\/td><td>小押注<\/td><td>新手<\/td><td><code>x &lt; 150<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">12<\/td><td>BF<\/td><td>小押注<\/td><td>老手<\/td><td><code>x &lt; 150<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">13<\/td><td>BF<\/td><td>中押注<\/td><td>新手<\/td><td><code>150 ≤ x ≤ 7500<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">14<\/td><td>BF<\/td><td>中押注<\/td><td>老手<\/td><td><code>150 ≤ x ≤ 7500<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">15<\/td><td>BF<\/td><td>大押注<\/td><td>新手<\/td><td><code>7500 &lt; x<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">16<\/td><td>BF<\/td><td>大押注<\/td><td>老手<\/td><td><code>7500 &lt; x<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EX1 小押注被排除（倍率 2 ≥ 2）；其餘支援的級距皆同時產生新手與老手測項。<\/p>\n<hr>\n<h2 id=\"2-壓測報表\">2. 壓測報表<\/h2>\n<h3 id=\"21-tg-訊息\">2.1 TG 訊息<\/h3>\n<p><strong>Formal RTP Report<\/strong><\/p>\n<p>壓測的主要判定對象是 TG 訊息中的 <code>Formal RTP Report<\/code>。訊息結構如下：<\/p>\n<pre><code>Formal RTP Report\nReport ID: &lt;報表編號&gt;\nGenerated At: &lt;產生時間&gt;\n- machineType = &lt;Game ID&gt;\n- extraBet = &lt;BetType&gt;\n- Bet = &lt;實際押注&gt;\n- OldHand Init = &lt;enabled | disabled&gt;\n\nScenario RTP\n整體 RTP\n- Game RTP = xx.xx%\n- Jackpot RTP = xx.xx%\n- Bonus Game RTP = xx.xx%\n前 50 次 Spin ...\n前 200 次 Spin ...\nRTP &lt;=200 ...\nRTP &gt;200 以後 ...\n\nSettingID RTP\nSettingID 1 xxx（一般）\n- Game RTP = xx.xx%\n- Jackpot RTP = xx.xx%\n- Bonus Game RTP = xx.xx%\nSettingID 2 xxx（新手體驗 D）\n...\n\nSettingID Trigger Count\n...<\/code><\/pre>\n<p><strong>Scenario RTP：五個時間切片<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>顯示欄<\/th><th>來源標籤<\/th><th>涵蓋範圍<\/th><th>是否判定<\/th><\/tr><\/thead><tbody><tr><td>整體<\/td><td><code>整體 RTP<\/code><\/td><td>全部 spin<\/td><td>只判 <code>0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>~50<\/td><td><code>前 50 次 Spin<\/code><\/td><td>每位玩家第 1～50 轉<\/td><td>只判 <code>0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>~200<\/td><td><code>前 200 次 Spin<\/code>（或 <code>前 100 次 Spin<\/code>）<\/td><td>每位玩家第 1～200 轉<\/td><td>只判 <code>0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td><strong>OG ~200<\/strong><\/td><td><code>RTP &lt;=200<\/code>（或 <code>&lt;=100<\/code>）<\/td><td><strong>新手期<\/strong>（≤200 轉）<\/td><td><strong>依目標值判定<\/strong><\/td><\/tr><tr><td><strong>OG 200~<\/strong><\/td><td><code>RTP &gt;200 以後<\/code><\/td><td><strong>老手期<\/strong>（&gt;200 轉）<\/td><td><strong>依目標值判定<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>前三欄是觀察用，只確認沒有爆掉。真正的目標值判定只做後兩欄。<\/p>\n<p>因為報表本身已經把新手期與老手期分開，<strong>逐欄各判自己的目標值，不需要做加權平均<\/strong>。<\/p>\n<p>每一欄都有三個 RTP：<code>Game RTP<\/code>、<code>Jackpot RTP<\/code>（＝Link）、<code>Bonus Game RTP<\/code>（＝Bonus）。<\/p>\n<p><strong>SettingID RTP：機制拆分<\/strong><\/p>\n<p>各機制的 RTP 貢獻由 SettingID 分開列出：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>SettingID<\/th><th>名稱<\/th><th>歸屬<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>一般（沒有機制）<\/td><td>自然結果基準<\/td><\/tr><tr><td>2, 4, 5, 6, 7, 8<\/td><td>新手救援、新手體驗 D（新手體驗 FG）、新手 mini game 體驗 D（新手體驗 JP）等<\/td><td><strong>新手體驗<\/strong>，取 Game RTP <strong>加總<\/strong><\/td><\/tr><tr><td>3<\/td><td>老手救援<\/td><td><strong>老手救援<\/strong>，取 Game RTP<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>新老手模式的區分<\/strong><\/p>\n<p><code>OldHand Init<\/code> 決定這次壓測玩家的起始身分：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><code>OldHand Init<\/code><\/th><th>模式<\/th><th>玩家歷程<\/th><th>OG ~200 欄的目標<\/th><\/tr><\/thead><tbody><tr><td><code>disabled<\/code><\/td><td><strong>新手<\/strong><\/td><td>從第 1 轉開始，≤200 轉是新手期<\/td><td>新手目標（93%）<\/td><\/tr><tr><td><code>enabled<\/code><\/td><td><strong>老手<\/strong><\/td><td>玩家一開始就是老手<\/td><td>老手目標（92% 或 94%）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>若 <code>OldHand Init<\/code> 欄位缺漏，退而用「Jackpot RTP 是否 &gt; 0」推斷（老手才會有 Link 收入）。這是備援，不是正規判斷依據。<\/p>\n<h3 id=\"22-壓縮檔rtp-validator-txt\">2.2 壓縮檔：RTP Validator TXT<\/h3>\n<p>ZIP／RAR 壓縮檔內是 <strong>RTP Validator<\/strong> 的逐分支 TXT（每個 <code>Coin in<\/code> × <code>WTIdx<\/code> 一個資料夾）。它不是判定的主報表，但提供了統計判定需要的關鍵資料：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code>pool[n] hit = N, ttlWin = X, avg = Y, rtp = Z<\/code><\/td><td>各彩金獎級的命中次數與 RTP，用於硬檢查及異常追查<\/td><\/tr><tr><td><code>TotalSpin<\/code>、<code>TotalBet<\/code>、<code>currency denom<\/code><\/td><td>樣本量與押注換算<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐分支 TXT 的完整讀法（命名、Coin in／WTIdx 對應、各區段、倍率權重核對）見 <a href=\"#\" class=\"tab-link\" data-tab=\"backend\">後端報表<\/a>。<\/p>\n<p><code>pool[n] rtp<\/code> 的分母是<strong>基準押注<\/strong>（<code>default_coin_in<\/code>，H026 為 100），不是該次的實際 <code>Coin in<\/code>。所以同一個 pool 的 rtp 在不同押注下應該一致，這本身就是一項檢查。<\/p>\n<hr>\n<h2 id=\"3-壓測標準\">3. 壓測標準<\/h2>\n<h3 id=\"31-目標值\">3.1 目標值<\/h3>\n<h4 id=\"311-game-rtp\">3.1.1 Game RTP<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th>押注範圍<\/th><th class=\"n\">OG ~200（新手期）<\/th><th class=\"n\">OG 200~（老手期）<\/th><\/tr><\/thead><tbody><tr><td>新手（<code>OldHand Init = disabled<\/code>）<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">93%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td>新手<\/td><td><code>2 ≤ x<\/code><\/td><td class=\"n\">93%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>老手（<code>OldHand Init = enabled<\/code>）<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">94%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td>老手<\/td><td><code>2 ≤ x<\/code><\/td><td class=\"n\">92%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td>全部<\/td><td class=\"n\">92.5%<\/td><td class=\"n\">92.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>x<\/code> 為報表中的實際押注 <code>Bet<\/code>。一般模式的 <code>$2<\/code> 界線直接判斷 <code>x<\/code>，<code>$100<\/code>（大 Bet）界線以 <code>x ÷ 模式倍率<\/code>（基礎面額）判斷；BF／SF 一律以 <code>x ÷ 模式倍率<\/code> 判斷基礎面額。<\/p>\n<h4 id=\"312-link-與-bonus\">3.1.2 Link 與 Bonus<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th>押注範圍<\/th><th class=\"n\">Link OG ~200<\/th><th class=\"n\">Link OG 200~<\/th><th class=\"n\">Bonus 兩欄<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>新手<\/td><td><code>2 ≤ x<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>老手<\/td><td><code>x &lt; 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>老手<\/td><td><code>2 ≤ x<\/code><\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td><code>x &lt; 模式倍率 × 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">4%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td><code>模式倍率 × 2 ≤ x<\/code><\/td><td class=\"n\">老手 2%／新手 0%<\/td><td class=\"n\">2%<\/td><td class=\"n\">老手 2%／新手 4%<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Link 目標為 0% 時必須精確等於 0%<\/strong>，不套用任何容許範圍 — 這是規則問題不是精度問題（小 Bet 不能拉 Link、新手期不能拉 Link）。<\/p>\n<h4 id=\"313-機制目標\">3.1.3 機制目標<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>來源<\/th><th class=\"n\">目標<\/th><th>判定欄<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>SettingID 2, 4, 5, 6, 7, 8 的 Game RTP 加總<\/td><td class=\"n\">1%<\/td><td>OG ~200<\/td><\/tr><tr><td>老手救援<\/td><td>SettingID 3 的 Game RTP<\/td><td class=\"n\">1%<\/td><td>OG 200~<\/td><\/tr><\/tbody><\/table><\/div>\n<p>機制依〈3.2 判定方式〉判定；目標為 0% 時必須精確等於 0%。<\/p>\n<p>&gt; 注意：老手救援 B 版的返還公式為 <code>(0.95 − Total Win / Total Bet) × Total Bet<\/code> &gt; （機制說明附錄 B.2.4），是補到 RTP 95%，而觸發門檻只要 <code>RTP &lt; 50%<\/code>。 &gt; 機制說明附錄 B.2.9 已標註「返還目標寫 55% 但公式是 95%，兩者不一致」。 &gt; 因此 1% 這個目標在 B 版下是否成立需要實測確認，見〈待確認事項〉。<\/p>\n<h3 id=\"32-判定方式\">3.2 判定方式<\/h3>\n<p>各項目以〈3.1 目標值〉中的目標為基準，容許範圍如下：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">容許範圍<\/th><\/tr><\/thead><tbody><tr><td>Game RTP<\/td><td class=\"n\">目標值 ±0.5 個百分點<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">目標值 ±0.5 個百分點<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">目標值 ±1.5 個百分點<\/td><\/tr><tr><td>新手體驗／老手救援機制<\/td><td class=\"n\">目標值 ±1.5 個百分點<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>目標值為 0% 時不套用容許範圍，實測值必須精確等於 0%；只要出現任何數值就判定失敗。<\/strong><\/p>\n<h3 id=\"33-硬檢查\">3.3 硬檢查<\/h3>\n<p>不涉及統計容差，不符合就是錯：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檢查項<\/th><th>條件<\/th><\/tr><\/thead><tbody><tr><td>小 Bet 不可拉 Link<\/td><td>小 Bet 所有欄的 <code>Jackpot RTP<\/code> 必須為 0，且 <code>pool[1]<\/code>、<code>pool[2]<\/code> 的 hit 必須為 0<\/td><\/tr><tr><td>新手期不可拉 Link<\/td><td>新手模式的 <code>OG ~200<\/code> 欄 <code>Jackpot RTP<\/code> 必須為 0<\/td><\/tr><tr><td>前三欄範圍<\/td><td><code>整體<\/code>／<code>~50<\/code>／<code>~200<\/code> 的 Game RTP 必須 <code>0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>RTP 拆解<\/td><td><code>Game RTP + Jackpot RTP + Bonus Game RTP<\/code> 須等於總 RTP（浮點誤差內）<\/td><\/tr><tr><td>上限倍數<\/td><td>各分級的實際開出最大倍數不得超過數學文件「倍率線型」所定義的上限<\/td><\/tr><tr><td>BG Trigger Cap<\/td><td>BG 進 FG 的最大倍數不得超過同 Profile 的 BG Trigger Cap<\/td><\/tr><tr><td>Scatter Pay<\/td><td>遊戲無 Scatter Pay 時對應欄位必須為 0<\/td><\/tr><tr><td><code>pool[n] rtp<\/code> 一致性<\/td><td>同一個 pool 的 rtp 在不同 <code>Coin in<\/code> 下應一致（分母是基準押注，與實際押注無關）<\/td><\/tr><tr><td>Bet Mode 對應<\/td><td>判定用的目標必須依 <code>extraBet<\/code> 決定，不可只看 <code>Coin in<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"34-實測參考值h026\">3.4 實測參考值（H026）<\/h3>\n<p>以下依目前〈3.2 判定方式〉整理 H026 的判定範圍。其他遊戲若目標值相同，可使用相同容許範圍；押注分級與上限倍數仍須依各遊戲文件判定。<\/p>\n<h4 id=\"341-各項目通過範圍\">3.4.1 各項目通過範圍<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">目標值<\/th><th class=\"n\">通過範圍<\/th><\/tr><\/thead><tbody><tr><td>Game RTP（一般模式新手期）<\/td><td class=\"n\">93%<\/td><td class=\"n\">92.5%～93.5%<\/td><\/tr><tr><td>Game RTP（老手低押注）<\/td><td class=\"n\">94%<\/td><td class=\"n\">93.5%～94.5%<\/td><\/tr><tr><td>Game RTP（老手中／大押注）<\/td><td class=\"n\">92%<\/td><td class=\"n\">91.5%～92.5%<\/td><\/tr><tr><td>Game RTP（Buy／Super Feature）<\/td><td class=\"n\">92.5%<\/td><td class=\"n\">92.0%～93.0%<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">2%<\/td><td class=\"n\">1.5%～2.5%<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">4%<\/td><td class=\"n\">3.5%～4.5%<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">2%<\/td><td class=\"n\">0.5%～3.5%<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">0%<\/td><td class=\"n\"><strong>必須精確等於 0%<\/strong><\/td><\/tr><tr><td>新手體驗／老手救援機制<\/td><td class=\"n\">1%<\/td><td class=\"n\">0%～2.5%<\/td><\/tr><tr><td>未配置的機制<\/td><td class=\"n\">0%<\/td><td class=\"n\"><strong>必須精確等於 0%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>機制目標 1% 套用 ±1.5pp 後，數學下限為 −0.5%；RTP 不會小於 0%，因此實際通過範圍寫為 0%～2.5%。<\/p>\n<h4 id=\"342-已知實測案例\">3.4.2 已知實測案例<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">實測值<\/th><th class=\"n\">目標值<\/th><th class=\"n\">差異<\/th><th>判定<\/th><\/tr><\/thead><tbody><tr><td>H026 <code>NoExtraBet<\/code>、<code>Coin in = 500<\/code>、老手 Game RTP<\/td><td class=\"n\">93.4111%<\/td><td class=\"n\">94%<\/td><td class=\"n\">−0.5889pp<\/td><td>❌ 超出 ±0.5pp<\/td><\/tr><tr><td>H026 Bonus Game RTP（已知 12 次實測範圍）<\/td><td class=\"n\">1.970%～2.033%<\/td><td class=\"n\">2%<\/td><td class=\"n\">−0.030pp～+0.033pp<\/td><td>✅ 落在 1.5%～2.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"343-pool-獎級對照\">3.4.3 Pool 獎級對照<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>pool<\/th><th>獎級<\/th><th class=\"n\">倍率（相對基準押注 100）<\/th><th class=\"n\">理論 RTP<\/th><th>歸屬<\/th><\/tr><\/thead><tbody><tr><td>pool[1]<\/td><td>Grand<\/td><td class=\"n\">約 18,000x ～ 20,000x（累進，會變動）<\/td><td class=\"n\">1%<\/td><td>Link<\/td><\/tr><tr><td>pool[2]<\/td><td>Major<\/td><td class=\"n\">約 9,500x ～ 10,200x（累進，會變動）<\/td><td class=\"n\">1%<\/td><td>Link<\/td><\/tr><tr><td>pool[3]<\/td><td>Minor<\/td><td class=\"n\">50x（固定）<\/td><td class=\"n\">0.8%<\/td><td>Bonus<\/td><\/tr><tr><td>pool[4]<\/td><td>Mini<\/td><td class=\"n\">10x（固定）<\/td><td class=\"n\">1.2%<\/td><td>Bonus<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code>pool[1]<\/code> 最大、<code>pool[4]<\/code> 最小。<code>Jackpot RTP<\/code> = pool[1] + pool[2]；<code>Bonus Game RTP<\/code> = pool[3] + pool[4]。<\/p>\n<h3 id=\"35-檢查清單\">3.5 檢查清單<\/h3>\n<h4 id=\"351-前置\">3.5.1 前置<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 已記錄玩家數、每人把數、<code>N<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每人把數 ≥ 600（老手救援 B 至少 2 個完整返還區間）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 已取得 <code>currency denom<\/code> 與該遊戲的大 Bet 門檻、上限倍數。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 已取得該遊戲各模式的押注倍率，並產生完整測項清單。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個測項都有對應的 <code>Formal RTP Report<\/code>。<\/li><\/ul>\n<h4 id=\"352-判定資料\">3.5.2 判定資料<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 每格的 Game／Link／Bonus 目標值與實測值都已取得。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 新手體驗與老手救援機制的目標值與實測值都已取得。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有差異都以百分點（pp）記錄。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 各 pool 的 <code>hit<\/code> 已取得，供硬檢查與異常追查。<\/li><\/ul>\n<h4 id=\"353-判定\">3.5.3 判定<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 前三欄 Game RTP 都在 <code>0 ≤ x &lt; 100%<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>OG ~200<\/code> 與 <code>OG 200~<\/code> 的 Game／Link／Bonus 都已逐項判定。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game／Bonus 都在目標值 ±0.5pp 內。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Link／機制都在目標值 ±1.5pp 內。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有目標為 0% 的項目都確認精確為 0%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 硬檢查全部通過。<\/li><\/ul>\n<h4 id=\"354-紀錄\">3.5.4 紀錄<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 通過的測項已記錄 <code>Report ID<\/code>、時間、目標值、實測值與差異。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 未跑的測項已列出並註明原因。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 警示與異常都有結論或追查方向。<\/li><\/ul>\n<h3 id=\"36-常見異常與處置\">3.6 常見異常與處置<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>現象<\/th><th>可能原因<\/th><th>處置<\/th><\/tr><\/thead><tbody><tr><td>Game 超出目標 ±0.5pp，且各押注同方向<\/td><td>設定或口徑錯誤<\/td><td>追查 Config 家族、Profile、押注分級是否套錯<\/td><\/tr><tr><td>Game 超出目標 ±0.5pp，但只有一格<\/td><td>該格設定單獨出錯<\/td><td>檢查該 <code>Coin in<\/code> 的 WTIdx／Config 對應<\/td><\/tr><tr><td>Link 超出目標 ±1.5pp<\/td><td>彩金設定、獎額或權重異常<\/td><td>追查 <code>pool[1]<\/code>／<code>pool[2]<\/code> 設定<\/td><\/tr><tr><td>Link &gt; 0% 但目標 0%<\/td><td>Bet 分級或 Link 資格設定錯<\/td><td><strong>硬性錯誤<\/strong>，直接退回<\/td><\/tr><tr><td>Bonus 超出目標 ±0.5pp<\/td><td>Bonus 權重或獎額異常<\/td><td>追查 <code>pool[3]<\/code>／<code>pool[4]<\/code> 權重與獎額<\/td><\/tr><tr><td>機制超出目標 ±1.5pp<\/td><td>新手體驗或老手救援設定異常<\/td><td>追查對應 SettingID 的設定與觸發狀況<\/td><\/tr><tr><td><code>pool[n] rtp<\/code> 隨 <code>Coin in<\/code> 變動<\/td><td>彩金分母口徑錯<\/td><td>追查後端 rtp 計算<\/td><\/tr><tr><td>缺某個測項<\/td><td>該組合未納入本批壓測<\/td><td>列入待跑，不得視為通過<\/td><\/tr><tr><td><code>OldHand Init<\/code> 缺漏<\/td><td>報表欄位不全<\/td><td>用 Link &gt; 0 推斷並在報告註明，或要求重出報表<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"4-建議作法\">4. 建議作法<\/h2>\n<p><strong>建議每人 600 把以上<\/strong>，讓老手救援 B 至少有 2 個完整返還區間。500 把只有 1 個完整區間，救援樣本偏少。<\/p>\n<hr>\n<h2 id=\"5-待確認事項\">5. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>現況<\/th><th>影響<\/th><\/tr><\/thead><tbody><tr><td><code>SettingID Trigger Count<\/code> 區段內容<\/td><td>尚未取得樣本。若含各機制的觸發次數，可用於機制異常追查<\/td><td>影響機制異常的追查資訊是否完整<\/td><\/tr><tr><td>老手救援 B 的 1% 目標是否成立<\/td><td>B 版補到 RTP 95%、門檻 <code>RTP &lt; 50%<\/code>，遠寬於 C 版；機制說明附錄 B.2.9 已標註公式與目標不一致<\/td><td>若實際增量不是 1%，〈機制目標〉要改<\/td><\/tr><tr><td>老手救援 B 的判定頻率<\/td><td>機制說明附錄 B.2 寫每 150 把一次，但範例是每 50 把一次（B.2.9 已標註）<\/td><td>影響「每人幾把才夠」的建議值<\/td><\/tr><tr><td>各遊戲的大 Bet 門檻<\/td><td>預設 <code>&gt; $100<\/code>，未逐款確認<\/td><td>影響分級判定<\/td><\/tr><tr><td>各分級 Bet 上限倍數<\/td><td>依各遊戲數學文件「倍率線型」，未集中列表<\/td><td>硬檢查需逐款查數學文件<\/td><\/tr><tr><td>A／B 變體平均分散下的上限驗證<\/td><td>A／B 在同一設定下平均分散，混合後最大倍數由上限較高的變體決定<\/td><td>若大 Bet 也混入高上限變體，數學文件定義的上限可能驗不出來<\/td><\/tr><tr><td><code>Game RTP<\/code> 的口徑<\/td><td>報表的 <code>TotalRtp (excluding JP/bonus)<\/code> 含 Scatter；判定程式的 Game RTP 只加 BG + FG，不含 Scatter<\/td><td>無 Scatter Pay 的遊戲兩者一致，有 Scatter Pay 的遊戲會不一致<\/td><\/tr><tr><td>Buy／Super Feature 缺 newbie profile<\/td><td>部分遊戲的 <code>card_system<\/code> 只在 <code>oldhand<\/code> 下定義 <code>buy_feature<\/code>，<code>newbie<\/code> 沒有對應設定<\/td><td>BF／SF 的「新手」測項是否成立、以及套用哪一組卡片，需逐款確認<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-backend\" hidden><h1 id=\"後端報表\">後端報表<\/h1>\n<p>這份筆記說明<strong>後端 SPS（RTP Validator）逐分支 TXT 報表<\/strong>怎麼讀、怎麼換算成 Simulator 的指標、怎麼拿來核對倍率權重。<\/p>\n<p>它與 <a href=\"#\" class=\"tab-link\" data-tab=\"stress\">壓測說明書<\/a> 的分工：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>報表<\/th><th>內容<\/th><th>用途<\/th><th>說明文件<\/th><\/tr><\/thead><tbody><tr><td>TG <code>Formal RTP Report<\/code><\/td><td>固定玩家數 × 把數的玩家歷程 RTP<\/td><td>新老手切換與機制介入後的 RTP 判定<\/td><td><a href=\"#\" class=\"tab-link\" data-tab=\"stress\" data-anchor=\"2-壓測報表\">壓測說明書<\/a><\/td><\/tr><tr><td><strong>SPS 逐分支 TXT<\/strong>（ZIP／RAR）<\/td><td>每個 <code>BetType<\/code> × <code>Coin in<\/code> × <code>WTIdx<\/code> 一份統計<\/td><td><strong>核對後端是否套對權重表、Card System 是否與 Simulator 一致<\/strong><\/td><td>本文件<\/td><\/tr><\/tbody><\/table><\/div>\n<p>SPS 報表固定一張權重表跑到底，不經過新老手切換與機制介入，所以可以直接和 Simulator 的 Card-On 報表、倍率權重工作簿逐格比對。<\/p>\n<hr>\n<h2 id=\"1-檔案結構與命名\">1. 檔案結構與命名<\/h2>\n<p>壓縮檔內每個分支一個資料夾，資料夾內一份 TXT（檔名為時間戳記，無意義）：<\/p>\n<pre><code>JHS&lt;GameID&gt;_&lt;BetType&gt;_Null_&lt;Coin in&gt;_WTIdx_&lt;n&gt;/&lt;時間戳記&gt;.txt<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>片段<\/th><th>意義<\/th><th>範例<\/th><\/tr><\/thead><tbody><tr><td><code>&lt;GameID&gt;<\/code><\/td><td>遊戲編號<\/td><td><code>101027<\/code><\/td><\/tr><tr><td><code>&lt;BetType&gt;<\/code><\/td><td>押注模式（見下表）<\/td><td><code>NoExtraBet<\/code><\/td><\/tr><tr><td><code>&lt;Coin in&gt;<\/code><\/td><td>該分支每轉實際押注（coin 單位）<\/td><td><code>5000<\/code><\/td><\/tr><tr><td><code>WTIdx_&lt;n&gt;<\/code><\/td><td>權重表索引（WeightTableIdx），對應哪一組 Profile／版本由後端設定，<strong>每款遊戲要先確認<\/strong><\/td><td><code>WTIdx_2<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"11-bettype-對應\">1.1 BetType 對應<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>BetType<\/th><th>押注模式<\/th><th class=\"n\">模式倍數<\/th><\/tr><\/thead><tbody><tr><td><code>NoExtraBet<\/code><\/td><td>Normal Bet（NB）<\/td><td class=\"n\">1<\/td><\/tr><tr><td><code>ExtraBet_PowerUp<\/code><\/td><td>Extra Bet（EB）<\/td><td class=\"n\">依遊戲（H027 為 2）<\/td><\/tr><tr><td><code>ExtraBet_BuyFreeGame<\/code><\/td><td>Buy Feature（BF）<\/td><td class=\"n\">依遊戲（H027 為 100）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-coin-in-config\">1.2 Coin in → Config<\/h3>\n<pre><code>實際押注（$）＝ Coin in × currency denom\n基礎押注（$）＝ 實際押注 ÷ 模式倍數<\/code><\/pre>\n<p>再依 <a href=\"#\" class=\"tab-link\" data-tab=\"math\" data-anchor=\"171-押注模式分類與層級判定\">數學模型規範 §1.7.1<\/a> 決定押注層級：<\/p>\n<ul><li>NB／EB：小 Bet（<code>&lt; $2<\/code>）用<strong>實際押注<\/strong>判，大 Bet（<code>&gt; $100<\/code>）用<strong>基礎押注<\/strong>判（對齊 SPS <code>isHighBet()<\/code>，2026-10-27）。例：EB 基礎 <code>$60<\/code>（實際 <code>$120<\/code>）是中 Bet。<\/li><li>BF／SF 用<strong>基礎押注<\/strong>判同一組邊界。<\/li><li>小 Bet → 94 版；中 Bet → 92 版；大 Bet → 92_Bet100 版。<\/li><\/ul>\n<p>檔頭的 <code>betMultiplier<\/code> 是基礎押注對 <code>default_coin_in<\/code> 的倍數，可用來交叉核對：<code>基礎押注 = betMultiplier × default_coin_in × currency denom<\/code>。<\/p>\n<h3 id=\"13-wtidx-對應\">1.3 WTIdx 對應<\/h3>\n<p>WTIdx 的順序由後端決定，沒有固定規則。拿到報表後先用數據反推並向後端確認：<\/p>\n<ul><li><strong>Newbie 與 Oldhand<\/strong>：看 BG 有次數的最高區間（Newbie 受 BG 倍率上限限制，如 30x）。<\/li><li><strong>A 版與 B 版<\/strong>：看 BG 最高區間、<code>BG WheelTable<\/code> 的選表比例（應接近該版 Parameter 的選表權重）。<\/li><li>推得的對應要與後端設定表一致，不一致時以後端設定為準並回報差異。<\/li><\/ul>\n<hr>\n<h2 id=\"2-檔頭欄位\">2. 檔頭欄位<\/h2>\n<pre><code>BetType = NoExtraBet\nWeightTableIdx = 0\nversion = H027192:A-7.0.0.0 B-7.0.0.0/H027194:A-7.0.0.0 B-7.0.0.0 GameID = 101027, JP optionID = 28, Coin in = 5000, currency denom = 0.002000, betMultiplier = 50, ...\nTotalSpin = 10000000, TotalBet = 50000000000<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>意義<\/th><th>檢查<\/th><\/tr><\/thead><tbody><tr><td><code>BetType<\/code>、<code>WeightTableIdx<\/code><\/td><td>同資料夾名稱<\/td><td>與資料夾名稱一致<\/td><\/tr><tr><td><code>version<\/code><\/td><td>後端載入的各 RTP／Variant 模型版本<\/td><td><strong>必須等於各倍率權重工作簿 <code>Overview!B3<\/code><\/strong><\/td><\/tr><tr><td><code>JP optionID<\/code><\/td><td>OP Jackpot 設定編號<\/td><td>與上線設定一致<\/td><\/tr><tr><td><code>Coin in<\/code>、<code>currency denom<\/code><\/td><td>見 §1.2<\/td><td>—<\/td><\/tr><tr><td><code>TotalSpin<\/code><\/td><td>付費轉數（樣本量）<\/td><td>—<\/td><\/tr><tr><td><code>TotalBet<\/code><\/td><td>總押注（coin），＝ <code>TotalSpin × Coin in<\/code><\/td><td>不等時代表有中途改押<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"3-報表區段\">3. 報表區段<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>區段<\/th><th>內容<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code>Total RTP<\/code><\/td><td><code>BaseGameRtp<\/code>、<code>ScatterRtp<\/code>、<code>FreeGameRtp<\/code>、<code>TotalRtp (excluding JP/bonus)<\/code>、<code>BonusJP Rtp<\/code>、<code>LinkJP Rtp<\/code><\/td><td>RTP 對帳<\/td><\/tr><tr><td><code>BaseGame info<\/code><\/td><td><code>BaseGameTTLWin<\/code>、<code>BG SymbolHit[符號][連線長度]<\/code>、<code>BG WheelTable[n] Count<\/code>（BG 選表次數）、<code>BG FeatureHit[n]<\/code><\/td><td>選表比例、符號命中<\/td><\/tr><tr><td><code>FreeGame info<\/code><\/td><td><code>FreeGameTTLRound<\/code>（免費轉總數）、<code>FreeGameTTLWin<\/code>、<code>FG SymbolHit<\/code>、<code>FG Wheel Table<\/code><\/td><td>FG 場次與得分<\/td><\/tr><tr><td><code>JP info<\/code><\/td><td><code>pool[n] hit / ttlWin / avg / rtp<\/code>、<code>JPTotalRound<\/code>、<code>avgPeriod<\/code><\/td><td>JP 硬檢查（見 <a href=\"#\" class=\"tab-link\" data-tab=\"stress\" data-anchor=\"22-壓縮檔rtp-validator-txt\">壓測說明書 §2.2<\/a>）<\/td><\/tr><tr><td><code>BaseGame 倍數<\/code><\/td><td>每轉 BG 得分的分桶次數與 Pay；<strong>不含觸發 FG 的那一轉<\/strong><\/td><td>BG 線型核對<\/td><\/tr><tr><td><code>BaseGame 進 FreeGame 倍數<\/code><\/td><td>只統計觸發 FG 那一轉的 BG 得分<\/td><td>觸發轉天花板、扣除觸發轉<\/td><\/tr><tr><td><code>整場FreeGame 倍數<\/code><\/td><td>每一場 FG（整場總分）的分桶次數與 Pay<\/td><td>FG 線型核對<\/td><\/tr><tr><td><code>FreeGame 單round 倍數<\/code><\/td><td>每一個免費轉的得分分桶<\/td><td>參考<\/td><\/tr><tr><td><code>by Game Data<\/code><\/td><td>消除次數、<code>BGtableWin[n]<\/code>（各選表總得分）、<code>Freegame Count<\/code>（FG 場數）、<code>bgC1Count<\/code>／<code>fgC1Count<\/code>（每轉特殊符號數量分布）<\/td><td>觸發率、SCR 參考<\/td><\/tr><tr><td><code>Base Game RNG INFO<\/code>、<code>FreeGame RNG INFO<\/code> 等<\/td><td>後端 RNG 除錯資料<\/td><td>不用於判定<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>分桶標籤<\/strong>：<code>Nx<\/code> 代表區間 <code>(N, 下一個標籤]<\/code>，<code>00<\/code> 代表 0 分。例如 <code>BaseGame 10x<\/code> 是 <code>(10, 15]<\/code>，<code>BaseGame 0x<\/code> 是 <code>(0, 1]<\/code>。標籤與 <a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範 §1.8<\/a> 的 64 格線一一對應。<\/p>\n<p>各分桶列後面的 <code>1C1<\/code>～<code>5C1<\/code> 欄依特殊符號數量拆分次數，目前未用於判定。<\/p>\n<hr>\n<h2 id=\"4-指標換算\">4. 指標換算<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Simulator 指標<\/th><th>SPS 換算<\/th><\/tr><\/thead><tbody><tr><td>總 RTP（不含 JP）<\/td><td><code>TotalRtp (excluding JP/bonus)<\/code> ＝ <code>BaseGameRtp + ScatterRtp + FreeGameRtp<\/code><\/td><\/tr><tr><td>BG RTP<\/td><td><code>BaseGameRtp + ScatterRtp<\/code>（Scatter 賠付屬 BG；BF 的入場轉也記在 <code>ScatterRtp<\/code>）<\/td><\/tr><tr><td>FG RTP<\/td><td><code>FreeGameRtp<\/code><\/td><\/tr><tr><td>BG Hit Rate<\/td><td><code>1 − BaseGame 00 ÷ TotalSpin<\/code><\/td><\/tr><tr><td>FG 觸發率<\/td><td><code>Freegame Count ÷ TotalSpin<\/code><\/td><\/tr><tr><td>平均 FG 轉數<\/td><td><code>FreeGameTTLRound ÷ Freegame Count<\/code><\/td><\/tr><tr><td>FG 平均倍數（基礎投注口徑）<\/td><td><code>FreeGameTTLWin ÷ Freegame Count ÷ Coin in × 模式倍數<\/code><\/td><\/tr><tr><td>區間平均倍數（基礎投注口徑）<\/td><td><code>Pay ÷ 次數 ÷ Coin in × 模式倍數<\/code><\/td><\/tr><tr><td>JP RTP<\/td><td><code>BonusJP Rtp<\/code>、<code>LinkJP Rtp<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>SCR<\/strong>：SPS 沒有直接輸出 SCR。可用 <code>(bgC1Count ≥1 的次數 ＋ fgC1Count ≥1 的次數) ÷ TotalSpin × 10¹⁰<\/code> 近似，但<strong>計數定義尚未與 Simulator 對齊<\/strong>（H027 實測 NB／EB 低約 1%，BF 高約 13%），所以 OP Jackpot 的 SCR 一律用 Simulator Card-On 報表的值，不用 SPS 推算值。<\/p>\n<hr>\n<h2 id=\"5-倍率權重核對方法\">5. 倍率權重核對方法<\/h2>\n<h3 id=\"51-bg\">5.1 BG<\/h3>\n<p><code>BaseGame 倍數<\/code> 區段<strong>已排除觸發 FG 的那一轉<\/strong>，與 模擬程式規範 §1.1.4 的 BG 統計口徑相同，直接比對即可，不要再扣一次：<\/p>\n<pre><code>BaseGame 00 次數 ＋ 各桶次數 ＋ Freegame Count ＝ TotalSpin\nBaseGame 倍數 Pay 合計 ＋ BaseGame 進 FreeGame 倍數 Pay 合計 ＝ BaseGameTTLWin<\/code><\/pre>\n<ol><li>每桶占比 ＝ 次數 ÷ <code>TotalSpin<\/code>，對應倍率權重工作簿 <code>Multiplier_Weight<\/code> 的 BG 欄（權重 ÷ 10⁹）。<\/li><li><code>BaseGame 00<\/code> 占比對應 <code>(-1, 0]<\/code>；Free Game 列對應 <code>Freegame Count ÷ TotalSpin<\/code>。<\/li><li><code>BaseGame 進 FreeGame 倍數<\/code> 只用來檢查觸發轉的 BG 得分有沒有超過 BG Trigger Cap。<\/li><\/ol>\n<h3 id=\"52-fgbf\">5.2 FG／BF<\/h3>\n<p><code>整場FreeGame 倍數<\/code> 各桶次數 ÷ 總場數，對應 FG 欄（BF 對應 BF 欄）。<\/p>\n<h3 id=\"53-判定\">5.3 判定<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>標準<\/th><\/tr><\/thead><tbody><tr><td>總 RTP（不含 JP）<\/td><td><code>σ = volatility_std ÷ 模式倍數 ÷ √TotalSpin<\/code>，**\\<\/td><td>實測 − 目標\\<\/td><td>≤ 2σ**；<code>volatility_std<\/code> 取同 Config／Profile／模式的 Simulator Card-On 報表<\/td><\/tr><tr><td>有權重的區間<\/td><td><code>z = (實測占比 − 權重) ÷ √(權重 × (1 − 權重) ÷ N)<\/code>，**\\<\/td><td>z\\<\/td><td>≤ 3**<\/td><\/tr><tr><td>權重為 0 的區間<\/td><td>次數必須為 0（超限保留最後結果的情況除外，數量須 ≤ Retry 超限次數）<\/td><\/tr><tr><td>最高／最低有次數的區間<\/td><td>與權重表的最高／最低有權重區間相同（樣本太少時最高區間可能沒抽到）<\/td><\/tr><tr><td>觸發轉 BG 得分<\/td><td>不得超過 Config <code>free_game<\/code> 卡的 <code>max<\/code>（BG Trigger Cap）<\/td><\/tr><tr><td>區間平均倍數<\/td><td>與 <code>Avg_Multi<\/code> 工作表相近；差異大時代表區間內條件分布不同<\/td><\/tr><\/tbody><\/table><\/div>\n<p>N 為該欄的總樣本數（BG 用 <code>TotalSpin<\/code>，FG 用總場數）。Simulator 的 <code>volatility_std<\/code> 以 Normal Bet 基準成本計，換成 RTP 的 σ 時必須除以模式倍數（EB ÷2、BF ÷100），漏除會讓 EB／BF 的 σ 被高估、偏差看起來比實際小。單一報表 64 格同時檢定，偶有一兩格 |z| 落在 3 附近屬正常；多格同向偏離才是問題。<\/p>\n<hr>\n<h2 id=\"6-檢查清單\">6. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 資料夾數量 ＝ BetType × Coin in × WTIdx 的必跑組合，沒有缺漏<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code>version<\/code> 等於所有倍率權重工作簿的 <code>Overview!B3<\/code><\/li><li class=\"check\"><span class=\"cb\">☐<\/span> WTIdx 對應的 Profile／版本已和後端確認<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個 Coin in 落在預期的押注層級，套用預期的 config（92／94／Bet100）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 各區間占比、上下限、權重 0 區間依 §5.3 通過<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Newbie 觸發轉的 BG 得分沒有超過 BG 上限<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 總 RTP、BG／FG RTP、BG Hit Rate、FG 觸發率與 Simulator Card-On 報表在抽樣誤差內一致<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 若 RTP 系統性偏低，先對照 Simulator 的 Retry 超限次數，再查後端重抽上限是否與 Config <code>retry_limit<\/code> 相同<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> JP 依 <a href=\"#\" class=\"tab-link\" data-tab=\"stress\" data-anchor=\"33-硬檢查\">壓測說明書 §3.3<\/a> 硬檢查<\/li><\/ul>\n<hr>\n<h2 id=\"7-實例h027-v7\">7. 實例：H027 v7<\/h2>\n<p>壓縮檔 <code>101027_AB版.rar<\/code>，32 份報表，每份 NB／EB 10⁷ 轉、BF 10⁶ 次。<\/p>\n<h3 id=\"71-coin-in-對應\">7.1 Coin in 對應<\/h3>\n<p><code>currency denom = 0.002<\/code>，<code>default_coin_in = 100<\/code>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>BetType<\/th><th class=\"n\">Coin in<\/th><th class=\"n\">實際押注<\/th><th class=\"n\">基礎押注<\/th><th>押注層級<\/th><th>Config<\/th><\/tr><\/thead><tbody><tr><td><code>NoExtraBet<\/code><\/td><td class=\"n\">500<\/td><td class=\"n\">$1<\/td><td class=\"n\">$1<\/td><td>小 Bet<\/td><td>94<\/td><\/tr><tr><td><code>NoExtraBet<\/code><\/td><td class=\"n\">5,000<\/td><td class=\"n\">$10<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><tr><td><code>NoExtraBet<\/code><\/td><td class=\"n\">750,000<\/td><td class=\"n\">$1,500<\/td><td class=\"n\">$1,500<\/td><td>大 Bet<\/td><td>92_Bet100<\/td><\/tr><tr><td><code>ExtraBet_PowerUp<\/code><\/td><td class=\"n\">1,000<\/td><td class=\"n\">$2<\/td><td class=\"n\">$1<\/td><td>中 Bet（依實際押注）<\/td><td>92<\/td><\/tr><tr><td><code>ExtraBet_PowerUp<\/code><\/td><td class=\"n\">10,000<\/td><td class=\"n\">$20<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><tr><td><code>ExtraBet_PowerUp<\/code><\/td><td class=\"n\">1,500,000<\/td><td class=\"n\">$3,000<\/td><td class=\"n\">$1,500<\/td><td>大 Bet<\/td><td>92_Bet100<\/td><\/tr><tr><td><code>ExtraBet_BuyFreeGame<\/code><\/td><td class=\"n\">50,000<\/td><td class=\"n\">$100<\/td><td class=\"n\">$1<\/td><td>小 Bet（依基礎押注）<\/td><td>94（BF 權重 92＝94 共用）<\/td><\/tr><tr><td><code>ExtraBet_BuyFreeGame<\/code><\/td><td class=\"n\">500,000<\/td><td class=\"n\">$1,000<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EB $2 那組實測 FG RTP 約 49.8%，是 92 家族水準，確認後端用實際押注分層。此批沒有 BF 大 Bet（基礎押注需 &gt; $100，即 Coin in &gt; 5,000,000）。<\/p>\n<h3 id=\"72-wtidx-對應\">7.2 WTIdx 對應<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>WTIdx<\/th><th>對應<\/th><th>反推依據<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>A 版 Newbie<\/td><td>BG 最高 30x、選表 (3) 約 17%<\/td><\/tr><tr><td>1<\/td><td>B 版 Newbie<\/td><td>BG 最高 30x、選表比例同 B<\/td><\/tr><tr><td>2<\/td><td>A 版 Oldhand<\/td><td>BG 最高 (200, 250]<\/td><\/tr><tr><td>3<\/td><td>B 版 Oldhand<\/td><td>BG 最高 (1000, 2000]<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"73-核對結果\">7.3 核對結果<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>版本字串<\/td><td><code>H027192:A-3.1.0.0<\/code>，其餘 7.0.0.0；數據內容是 v7，屬版號未更新<\/td><\/tr><tr><td>區間分布<\/td><td>64 區間與 v7 權重一致；BG 各桶差 ≤ 0.015 pp，FG 最大 \\<\/td><td>z\\<\/td><td>≤ 3.0，上下限全對<\/td><\/tr><tr><td>BG Hit Rate、FG 週期、FG 均倍<\/td><td>全部在抽樣誤差內（28.17～28.23%、NB 1/444～456、EB 1/90）<\/td><\/tr><tr><td>Newbie、BF RTP<\/td><td>16 組只有 A Newbie NB $10 偏 +2.1σ，其餘 ≤ 1.9σ<\/td><\/tr><tr><td>Oldhand NB RTP<\/td><td>6 組都在 2σ 內，但 5 組偏低，與 Simulator 的 Retry 超限方向一致<\/td><\/tr><tr><td>Oldhand EB RTP<\/td><td>A 三組 −2.2～−2.6σ、B $20 −3.6σ；BG 高倍桶 \\<\/td><td>z\\<\/td><td>到 4.3，屬 Retry 超限造成的高倍桶不足<\/td><\/tr><tr><td>Newbie 觸發轉<\/td><td>12 組全部有觸發轉 BG 得分超過 30x（每組 13～125 次，約 0.06～0.11% 的觸發），違反 <code>free_game<\/code> 卡 <code>max = 30<\/code><\/td><\/tr><tr><td>SCR<\/td><td>SPS 推算值與 Simulator 不一致（見 §4），OP Jackpot 仍用 Simulator 值<\/td><\/tr><tr><td>JP<\/td><td>EB 的 <code>BonusJP Rtp<\/code> 約 0.1%，NB 約 2%，待後端確認 JP 設定是否刻意<\/td><\/tr><\/tbody><\/table><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-ceiling\" hidden><h1 id=\"天花板說明\">天花板說明<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 _README.md。<\/p>\n<p>天花板是系統對派彩金額設的上限。<strong>超過上限的結果整把重骰<\/strong>：重骰後該結果不會出現，不是把派彩截到上限。數學模型、Config、Simulator 與 Demogame 必須實作同一套天花板。<\/p>\n<h2 id=\"1-金額上限\">1. 金額上限<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>範圍<\/th><th class=\"n\">押注 <code>&lt;= $1,500<\/code><\/th><th class=\"n\">押注 <code>&gt; $1,500<\/code><\/th><th>超過時<\/th><\/tr><\/thead><tbody><tr><td>單把 BG 派彩<\/td><td class=\"n\"><code>$500,000<\/code><\/td><td class=\"n\"><code>$1,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><tr><td>單場 FG 派彩<\/td><td class=\"n\"><code>$2,000,000<\/code><\/td><td class=\"n\"><code>$5,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><tr><td>系統賠付上限（單把總派彩）<\/td><td class=\"n\"><code>$10,000,000<\/code><\/td><td class=\"n\"><code>$10,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>押注 <code>$1,500<\/code> 屬於低的那一級；只有大於 <code>$1,500<\/code> 才適用 <code>$1,000,000<\/code>／<code>$5,000,000<\/code>。<\/li><\/ul>\n<p>各押注層級使用的模型與天花板：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>押注層級<\/th><th>押注金額 <code>x<\/code><\/th><th>使用模型<\/th><th class=\"n\">BG 天花板<\/th><th class=\"n\">FG 天花板<\/th><\/tr><\/thead><tbody><tr><td>小 Bet<\/td><td><code>x &lt; $2<\/code><\/td><td>94 版<\/td><td class=\"n\"><code>$500,000<\/code><\/td><td class=\"n\"><code>$2,000,000<\/code><\/td><\/tr><tr><td>中 Bet<\/td><td><code>$2 &lt;= x &lt;= $100<\/code><\/td><td>92 版<\/td><td class=\"n\"><code>$500,000<\/code><\/td><td class=\"n\"><code>$2,000,000<\/code><\/td><\/tr><tr><td>大 Bet<\/td><td><code>$100 &lt; x &lt;= $1,500<\/code><\/td><td>92_Bet100 版<\/td><td class=\"n\"><code>$500,000<\/code><\/td><td class=\"n\"><code>$2,000,000<\/code><\/td><\/tr><tr><td>超大 Bet<\/td><td><code>x &gt; $1,500<\/code><\/td><td>92_Bet100 版（與大 Bet 共用）<\/td><td class=\"n\"><code>$1,000,000<\/code><\/td><td class=\"n\"><code>$5,000,000<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>超大 Bet 不另做模型，與大 Bet 共用 <code>_Bet100<\/code> 權重，只有天花板較寬；所以 <code>_Bet100<\/code> 權重必須同時通過大 Bet（以 <code>$1,500<\/code> 驗算）與超大 Bet（以遊戲最大押注驗算）兩組天花板，取較嚴者（見第 2 節）。<\/li><li>押注金額的判定方式與<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.7.1 節相同：NB／EB 的小 Bet 用實際押注、大 Bet 用基礎押注，BF／SF 用購買價格反推的基礎押注。<\/li><li>系統賠付上限對所有押注一律 <code>$10,000,000<\/code>，是 BG、FG 上限之外的最後一道保護。<\/li><\/ul>\n<h2 id=\"2-對倍率上限的影響\">2. 對倍率上限的影響<\/h2>\n<p>每個押注層級的倍率上限必須讓該層最大押注踩不到天花板，否則高注玩家會實際觸發重骰、RTP 系統性偏低：<\/p>\n<pre><code>BG 倍率上限 × 該層最大押注 ≤ BG 上限\nFG 倍率上限 × 該層最大押注 ≤ FG 上限<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">遊戲最大押注<\/th><th>BG 上限<\/th><th>BG 最高可填區間<\/th><th>FG 上限<\/th><th>FG 最高可填區間<\/th><th>系統上限（單把總派彩）<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><code>$1,000<\/code><\/td><td><code>$500,000 ÷ 1000 = 500x<\/code><\/td><td><code>(450, 500]<\/code><\/td><td><code>$2,000,000 ÷ 1000 = 2000x<\/code>，但大 Bet 上限 <code>1000x<\/code><\/td><td><code>(950, 1000]<\/code><\/td><td><code>$10,000,000 ÷ 1000 = 10000x<\/code><\/td><\/tr><tr><td class=\"n\"><code>$1,500<\/code><\/td><td><code>$500,000 ÷ 1500 = 333x<\/code><\/td><td><code>(250, 300]<\/code><\/td><td><code>$2,000,000 ÷ 1500 = 1333x<\/code>，但大 Bet 上限 <code>1000x<\/code><\/td><td><code>(950, 1000]<\/code><\/td><td><code>$10,000,000 ÷ 1500 = 6667x<\/code><\/td><\/tr><tr><td class=\"n\"><code>$5,000<\/code>（例：H026、H027、H028）<\/td><td><code>$1,000,000 ÷ 5000 = 200x<\/code><\/td><td><code>(180, 200]<\/code><\/td><td><code>$5,000,000 ÷ 5000 = 1000x<\/code><\/td><td><code>(950, 1000]<\/code><\/td><td><code>$10,000,000 ÷ 5000 = 2000x<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>配權重時以各卡片區間的上限驗算：區間上限 × 該層最大押注超過天花板的區間，不得配權重。例：<code>$1,500<\/code> 的 BG 上限是 333x，<code>(300, 350]<\/code> 的上限 350 已超過，所以 BG 只能填到 <code>(250, 300]<\/code>；押注開到 <code>$5,000<\/code> 時再取超大 Bet 的 200x，只能填到 <code>(180, 200]<\/code>。<\/li><li>系統上限管的是 BG＋FG 加總：<code>$5,000<\/code> 時 <code>200 + 1000 = 1200x<\/code>，在 2000x 內不會擋到。<\/li><li>大 Bet 共用同一套權重時，取該層所有押注中最嚴的一個；押注開到 <code>$5,000<\/code> 的遊戲，大 Bet 只能填到 BG <code>(180, 200]<\/code>、FG <code>(950, 1000]<\/code>。<\/li><li>以 NB 驗算即可：大 Bet 一律用基礎押注分級，EB 與 NB 同一基礎押注落在同一級；卡片倍率以 NB 基準成本為分母，派彩金額相同。<\/li><li>計算結果比<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.7.2 節的預設上限低時，以天花板推得的值為準，並記錄於數學文件；比預設高時（例：上表 <code>$1,000<\/code> 的 FG <code>2000x<\/code>）仍以預設為準，大 Bet 一律不超過 <code>1000x<\/code>。<\/li><li>押注跨越 <code>$1,500<\/code> 的遊戲，<code>&lt;= $1,500<\/code> 與 <code>&gt; $1,500<\/code> 要分開驗算。<\/li><\/ul>\n<h2 id=\"3-實作與驗證\">3. 實作與驗證<\/h2>\n<ul><li>Simulator 與 Demogame 必須實作相同的重骰，否則模擬結果與實際遊戲不一致。<\/li><li>卡片系統的觸發局 BG 上限（<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 2.3 節的天花板機制）是另一道限制，兩者同時成立。<\/li><li>模擬報表要能看出重骰次數；重骰比例明顯不為 0 時，先檢查倍率上限與區間權重是否違反第 2 節。<\/li><\/ul>\n<h2 id=\"4-檢查清單\">4. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 各押注層級的 BG／FG 倍率上限已依第 2 節驗算並記錄於數學文件。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 超過天花板的卡片區間權重為 0。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Simulator 與 Demogame 已實作 BG、FG 與系統賠付上限的重骰。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 正式模擬的重骰次數為 0 或已說明原因。<\/li><\/ul><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-mechanism\" hidden><h1 id=\"系統機制\">系統機制<\/h1>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 _README.md。<\/p>\n<h2 id=\"1-總覽\">1. 總覽<\/h2>\n<h3 id=\"11-機制說明\">1.1 機制說明<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>現行版本<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td><strong>D 版<\/strong><\/td><td>新手期分兩階段：新手體驗（第 41～60 轉）、新手救援（第 140～160 轉）各隨機判定一次，RTP 偏低就把該轉改成設定倍數。<\/td><\/tr><tr><td>老手救援<\/td><td><strong>C-2<\/strong><\/td><td>以天為單位（<strong>台灣時間 04:00<\/strong> 刷新）的保底救援：主救援 40～400 轉、延伸救援 440～1,000 轉，觸發點前後 5 轉隨機判定；救援成本由每日刷新的救援池支付（每轉提撥玩家押注的 <strong><span class=\"tune\">1%<\/span><\/strong>）。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>標示方式：<strong>粗體<\/strong>為重要數值；<span class=\"tune\">紅色虛線<\/span>為後端要做成可調整的參數。兩個機制都由 Card System 重骰產生結果，演出與自然得分無法區分。各機制的 RTP 預算見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.5 節；壓測驗證見<a href=\"#\" class=\"tab-link\" data-tab=\"stress\">壓測說明書.md<\/a>。模擬程式一律到模擬機執行（<code>ssh sim<\/code>，<code>/root/Simulator/System_老手救援/<\/code>）。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td>系統機制模擬程式（新手體驗、老手救援、救援池、套利）<\/td><td>工作區 <code>System/simulator/<\/code><\/td><\/tr><tr><td>模擬用 rowdata、模擬結果（<code>report_numbers.json<\/code> 等）<\/td><td><code>System/simulator/rowdata/<\/code>、<code>System/simulator/record/<\/code><\/td><\/tr><tr><td>給主管的機制報告<\/td><td><code>System/報告/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-流程圖\">1.2 流程圖<\/h3>\n<p>新玩家第一天第 1～1,000 轉會遇到的事件（重複事件只畫一次）：<\/p>\n<div class=\"tl-wrap\"><div class=\"tl\"><div class=\"tl-row\"><div class=\"tl-lane\">階段<\/div><div class=\"tl-track\"><div class=\"tl-bar phase\" style=\"left:0.00%;width:34.00%\">新手期（暫定 200 轉）<\/div><div class=\"tl-bar phase2\" style=\"left:34.00%;width:58.00%\">老手期<\/div><div class=\"tl-bar stop\" style=\"left:92.00%;width:8.00%\">停止<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\">新手期<\/div><div class=\"tl-track\"><div class=\"tl-bar event\" style=\"left:6.80%;width:3.40%\"><\/div><div class=\"tl-label\" style=\"left:6.80%\">新手體驗<\/div><div class=\"tl-bar event\" style=\"left:23.63%;width:3.57%\"><\/div><div class=\"tl-label\" style=\"left:23.63%\">新手救援<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\">主救援<\/div><div class=\"tl-track\"><div class=\"tl-bar event\" style=\"left:36.47%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:39.37%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:42.27%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:45.16%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:48.06%;width:0.80%\"><\/div><div class=\"tl-label\" style=\"left:36.47%\">每 40 轉一個區間，隨機一轉判定<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\">延伸救援<\/div><div class=\"tl-track\"><div class=\"tl-bar event\" style=\"left:50.97%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:53.86%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:56.77%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:59.66%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:62.56%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:65.47%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:68.37%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:71.27%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:74.16%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:77.06%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:79.97%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:82.87%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:85.77%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:88.66%;width:0.80%\"><\/div><div class=\"tl-bar event\" style=\"left:91.56%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:50.97%\">每 40 轉一個區間，看往前 400 轉<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">轉數<\/div><div class=\"tl-track tl-axis\"><div class=\"tl-tick\" style=\"left:0.17%\">1<\/div><div class=\"tl-tick\" style=\"left:6.97%\">41<\/div><div class=\"tl-tick\" style=\"left:23.80%\">140<\/div><div class=\"tl-tick\" style=\"left:34.00%\">200<\/div><div class=\"tl-tick\" style=\"left:48.50%\">400<\/div><div class=\"tl-tick\" style=\"left:92.00%\">1,000<\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong>新手期<\/strong>（暫定前 <span class=\"tune\">200<\/span> 轉）：<strong>新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong>新手救援<\/strong>第 <span class=\"tune\">140～160<\/span> 轉，各隨機判定一次。<\/li><li><strong>新手期結束後才開始老手救援<\/strong>：第一天主救援從第 235～245 轉區間開始（第 35～205 轉的區間落在新手期內，不判定）；之後每一天（已是老手）從當日第 35～45 轉區間開始。<\/li><li><strong>主救援<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個區間（觸發點前後 <span class=\"tune\">5<\/span> 轉），到第 395～405 轉為止。<\/li><li><strong>延伸救援<\/strong>：第 <span class=\"tune\">440～1,000<\/span> 轉，同樣每 40 轉一個區間；超過 <span class=\"tune\">1,000<\/span> 轉停止判定。<\/li><li>每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 刷新：當日轉數、當日 RTP 與救援池餘額歸零。<\/li><\/ul>\n<h2 id=\"2-新手體驗\">2. 新手體驗<\/h2>\n<h3 id=\"21-機制目標\">2.1 機制目標<\/h3>\n<ul><li><strong>新手早期就有一次像樣的體驗<\/strong>：區間內隨機挑一轉，檢查第 1 轉到判定回合前的 RTP；偏低就把判定回合得分改成指定體驗分數。<\/li><li><strong>新手體驗是推廣期<\/strong>：送出的 RTP 是額外多給的，不是每位玩家在每款遊戲都拿得到；原則上一位玩家<strong>同一時期在平台上只體驗一次<\/strong>（同時避免套利），但新遊戲上線時仍要有新手體驗（資格見第 2.2.4 節）。<\/li><\/ul>\n<h3 id=\"22-機制介紹數值設定\">2.2 機制介紹／數值設定<\/h3>\n<h4 id=\"221-運作方式\">2.2.1 運作方式<\/h4>\n<ul><li>新手期只做新手體驗，不做老手救援；新手體驗 RTP 預算為 <strong>2%<\/strong>。<\/li><li>兩階段：<strong>新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong>新手救援<\/strong>第 <span class=\"tune\">140～160<\/span> 轉，各在區間內隨機挑一轉判定。<\/li><li><code>RTP = 判定回合前累計得分 ÷ 判定回合前累計押注<\/code>（第 1 轉～判定回合前一轉）。<\/li><li>設定得分 ＝ 設定倍數 × 判定回合的 Total Bet，<strong>取代<\/strong>原始得分（不是額外加上）；原始得分較高時總得分可能反而降低。<\/li><li>新手救援的 RTP 含新手體驗改寫後的結果。<\/li><li>押注、Extra Bet、Buy Feature、異常加押與演出對應的做法尚待確認。<\/li><\/ul>\n<h4 id=\"222-判定回合門檻倍數\">2.2.2 判定回合／門檻／倍數<\/h4>\n<p><strong>門檻與設定倍數依遊戲調整，下表數值為範例。<\/strong><\/p>\n<p><strong>新手體驗<\/strong>：第 <span class=\"tune\">41～60<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">15×<\/span><\/td><td class=\"n\">25%～37%<\/td><td class=\"n\">87%<\/td><\/tr><tr><td class=\"n\"><span class=\"tune\"><code>50%～&lt;70%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">10×<\/span><\/td><td class=\"n\">17%～24%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\"><span class=\"tune\"><code>≥70%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>新手救援<\/strong>：第 <span class=\"tune\">140～160<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">30×<\/span><\/td><td class=\"n\">19%～21%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td class=\"n\"><span class=\"tune\"><code>65%～&lt;85%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">15×<\/span><\/td><td class=\"n\">9%～11%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td class=\"n\"><span class=\"tune\"><code>≥85%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>RTP 增量 ＝ 設定倍數 ÷ 判定轉數（判定轉隨機，所以是範圍）。<\/li><li>極限 RTP ＝ 該 RTP 區間上限 ＋ 最大 RTP 增量，即設定後 RTP 的最高可能值。<\/li><\/ul>\n<h4 id=\"223-流程圖\">2.2.3 流程圖<\/h4>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手體驗：到達判定轉<\/div><div class=\"step-desc\">第 41～60 轉內隨機一轉<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;50%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 50%～&lt;70%<\/span><span>判定回合得分改為 10×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥70%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手救援：到達判定轉<\/div><div class=\"step-desc\">第 140～160 轉內隨機一轉；RTP 已含新手體驗的結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;65%<\/span><span>判定回合得分改為 30×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 65%～&lt;85%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥85%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手期結束<\/div><div class=\"step-desc\">進入老手期，改由老手救援判定<\/div><\/div><\/div><\/div>\n<h4 id=\"224-其他設定新手體驗資格\">2.2.4 其他設定：新手體驗資格<\/h4>\n<p>新手體驗以「<strong>資格<\/strong>」控制，每位玩家同一時期最多用一次；只看<strong>有沒有用過新手體驗<\/strong>，與該遊戲是新手期或老手期無關。中辦、北辦的標籤與資格<strong>分開計算<\/strong>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>標籤<\/th><th>定義<\/th><th>資格<\/th><\/tr><\/thead><tbody><tr><td><strong>全新玩家<\/strong><\/td><td>還沒用過新手體驗（第一次接觸平台遊戲）<\/td><td>有資格，任何一款遊戲都可以觸發<\/td><\/tr><tr><td><strong>舊玩家<\/strong><\/td><td>已經用過新手體驗<\/td><td>沒有資格，直到下一款新遊戲上線<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>什麼叫用過<\/strong>：任一款遊戲的<strong>新手體驗或新手救援<\/strong>判定成功、實際改成設定倍數；兩次都「不處理」不算。用掉資格後，同一款遊戲接下來的新手救援照常進行。<\/li><li><strong>用過即變舊玩家<\/strong>：從那一轉起所有遊戲都沒有新手體驗。<\/li><li><strong>新遊戲上線<\/strong>：上線當下已是舊玩家者重新拿到一次資格，<strong>只能在這款新遊戲使用<\/strong>；推廣期間才變舊玩家者，這款不給。<\/li><li><strong>資格未用又有新遊戲上線<\/strong>：只能到最新的遊戲用；用掉後等下一款新遊戲。<\/li><li>同一時間只有最新上線的一款是推廣遊戲。<\/li><\/ul>\n<p>範例（平台現有 A～E 共 5 款遊戲）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時間點<\/th><th>事件<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>全新玩家小明玩遊戲 B，兩次判定都因 RTP 偏高、不處理<\/td><td>沒用掉資格，仍是全新玩家。<\/td><\/tr><tr><td>2<\/td><td>小明改玩遊戲 C，新手救援判定成功<\/td><td>用掉資格、變舊玩家，A～E 都沒有新手體驗。<\/td><\/tr><tr><td>3<\/td><td>新遊戲 F 上線<\/td><td>小明（上線當下已是舊玩家）在 F 重新有資格；A～E 沒有。<\/td><\/tr><tr><td>4<\/td><td>全新玩家小華在 F 推廣期間，於遊戲 A 用掉資格<\/td><td>小華推廣期間才變舊玩家，F 不給。<\/td><\/tr><tr><td>5<\/td><td>小明還沒在 F 用掉資格，新遊戲 G 就上線<\/td><td>小明的資格移到 G；F 恢復一般遊戲。小華（G 上線當下已是舊玩家）在 G 也有資格。<\/td><\/tr><tr><td>6<\/td><td>小明在 G 新手體驗判定成功<\/td><td>用掉資格，直到下一款新遊戲上線。<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"23-模擬結果\">2.3 模擬結果<\/h3>\n<p>模擬（彩罐熱舞 rowdata 92% 基礎，10,000 人 × 200 轉，<code>System/simulator/simulator_system_newbie_d.py<\/code>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>總體指標（新手期 200 轉）<\/th><th class=\"n\">彩罐熱舞<\/th><\/tr><\/thead><tbody><tr><td>RTP（沒有機制）<\/td><td class=\"n\">91.9939%<\/td><\/tr><tr><td>新手體驗增量<\/td><td class=\"n\"><strong>+8.5774%<\/strong><\/td><\/tr><tr><td>RTP（含新手體驗）<\/td><td class=\"n\"><strong>100.5713%<\/strong><\/td><\/tr><tr><td>用到新手體驗的玩家比例<\/td><td class=\"n\">68.22%<\/td><\/tr><tr><td>觸發率（判定成功 ÷ 總判定）<\/td><td class=\"n\">50.65%（10,130 / 20,000）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>階段<\/th><th>判定區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">觸發率<\/th><th class=\"n\">使用量<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>第 41～60 轉<\/td><td class=\"n\">15×<\/td><td class=\"n\">34.14%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手體驗<\/td><td>第 41～60 轉<\/td><td class=\"n\">10×<\/td><td class=\"n\">17.72%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手體驗小計<\/td><td><\/td><td class=\"n\"><\/td><td class=\"n\"><strong>51.86%<\/strong><\/td><td class=\"n\"><strong>+3.22%<\/strong><\/td><\/tr><tr><td>新手救援<\/td><td>第 140～160 轉<\/td><td class=\"n\">30×<\/td><td class=\"n\">24.99%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手救援<\/td><td>第 140～160 轉<\/td><td class=\"n\">15×<\/td><td class=\"n\">24.45%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手救援小計<\/td><td><\/td><td class=\"n\"><\/td><td class=\"n\"><strong>49.44%<\/strong><\/td><td class=\"n\"><strong>+5.36%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>設定倍數<\/th><th class=\"n\">占比<\/th><\/tr><\/thead><tbody><tr><td>10×<\/td><td class=\"n\">17.49%<\/td><\/tr><tr><td>15×<\/td><td class=\"n\">57.84%<\/td><\/tr><tr><td>30×<\/td><td class=\"n\">24.67%<\/td><\/tr><tr><td><strong>合計<\/strong><\/td><td class=\"n\"><strong>100%（10,130 次）<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>以範例數值計算，新手體驗增量 +8.58%，遠超過 2% 預算<\/strong>，新手期 200 轉總 RTP 達 100.57%；正式上線前需依遊戲重新調整門檻與設定倍數。<\/li><li>合併成「≥70% 不處理」後，少了原本 70%～&lt;100% 改成 0 分的扣回，成本因此上升。<\/li><li>判定成功中有 1.3%（新手體驗）、0.9%（新手救援）的原始得分比設定得分高，玩家反而少拿。<\/li><li>rowdata 為老手配置的 92% 基礎；新手配置基礎 RTP 若不同需另跑。<\/li><\/ul>\n<h3 id=\"24-套利檢查\">2.4 套利檢查<\/h3>\n<p>10,000 名玩家、每人一個新手期，欄位算法同第 3.5 節；超過 97% 標黃、超過 100% 標紅。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>套利手法<\/th><th>情境<\/th><th class=\"n\">平均停在<\/th><th class=\"n\">新手體驗增量<\/th><th class=\"n\">RTP（有機制）<\/th><th class=\"n\">RTP（無機制）<\/th><th class=\"n\">EV／日（bet）<\/th><\/tr><\/thead><tbody><tr><td>固定轉數閃人<\/td><td>固定玩 60 轉就閃<\/td><td class=\"n\">60 轉<\/td><td class=\"n\">+10.72%<\/td><td class=\"n\"><mark class=\"hl-danger\">103.40%<\/mark><\/td><td class=\"n\">92.68%<\/td><td class=\"n\">+2.04<\/td><\/tr><tr><td><\/td><td>固定玩 100 轉就閃<\/td><td class=\"n\">100 轉<\/td><td class=\"n\">+6.43%<\/td><td class=\"n\"><mark class=\"hl-warn\">98.32%<\/mark><\/td><td class=\"n\">91.89%<\/td><td class=\"n\">-1.68<\/td><\/tr><tr><td><\/td><td>固定玩 160 轉就閃<\/td><td class=\"n\">160 轉<\/td><td class=\"n\">+10.72%<\/td><td class=\"n\"><mark class=\"hl-danger\">102.37%<\/mark><\/td><td class=\"n\">91.65%<\/td><td class=\"n\">+3.80<\/td><\/tr><tr><td><\/td><td>固定玩 200 轉就閃<\/td><td class=\"n\">200 轉<\/td><td class=\"n\">+8.58%<\/td><td class=\"n\"><mark class=\"hl-danger\">100.57%<\/mark><\/td><td class=\"n\">91.99%<\/td><td class=\"n\">+1.14<\/td><\/tr><tr><td>拿到就閃人<\/td><td>拿到任何體驗就閃（否則玩到 200）<\/td><td class=\"n\">114 轉<\/td><td class=\"n\"><\/td><td class=\"n\"><mark class=\"hl-danger\">100.53%<\/mark><\/td><td class=\"n\">91.99%<\/td><td class=\"n\">+0.61<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>停手點：固定玩 N 轉者有／無機制都停在第 N 轉；「拿到就閃」有機制停在第一次被設定得分的那一轉（都沒有則第 200 轉），無機制停在第 200 轉。<\/li><li>以範例數值，「玩到第 60 轉就閃」與「玩到第 160 轉就閃」RTP 都超過 100%，可以穩定套利；門檻與設定倍數調整後需重驗。<\/li><\/ul>\n<h2 id=\"3-老手救援\">3. 老手救援<\/h2>\n<p>本節為<strong>中辦<\/strong>的做法；北辦另有一套（未納入本文件）。兩辦的救援池、累積數值與統計<strong>全部分開計算<\/strong>。<\/p>\n<pre><code>目標：Total RTP 96% ＋ 老手救援 1% ＝ 97%<\/code><\/pre>\n<ul><li>上式是<strong>目標值<\/strong>；實際貢獻由門檻與救援倍數決定，<strong>尚未定案<\/strong>。<\/li><\/ul>\n<h3 id=\"31-前情提要\">3.1 前情提要<\/h3>\n<ul><li>好體驗只有隔天會記得，救援必須當天發生才有留存效果。<\/li><li>當日未開出 <strong>50×<\/strong> 以上大獎的老手，隔日流失率明顯上升；決定留存的是當天有沒有一次夠大的體驗，不是輸贏總額。<\/li><li>當日遊玩超過 <strong>500 轉<\/strong>的玩家，隔日留存都在 <strong>60%<\/strong> 以上，留存效益最高的救援區段在前 400 轉。<\/li><li>SPS 最小監測單位為 <strong>40 轉<\/strong>，最快每 40 轉判定並救援一次。<\/li><\/ul>\n<h3 id=\"32-機制目標\">3.2 機制目標<\/h3>\n<ul><li><strong>短期體驗不好就救<\/strong>：以當日短期體驗為基準，當天就出手，不等長期統計。<\/li><li><strong>補上缺席的大倍數體驗<\/strong>：好體驗＝當日最大單局倍數。玩得夠久卻沒碰到大倍數的玩家，在流失前當天由系統給出，演出與自然大獎無法區分。<\/li><li><strong>400 轉後延續同一套標準<\/strong>（延伸救援）：沿用主救援最後一段的門檻與倍數，改看往前 400 轉 RTP。<\/li><\/ul>\n<h3 id=\"33-機制介紹數值設定\">3.3 機制介紹／數值設定<\/h3>\n<h4 id=\"331-運作方式\">3.3.1 運作方式<\/h4>\n<ul><li><strong>以天為循環<\/strong>：每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 刷新，當日轉數、當日 RTP 與救援池餘額全部歸零。<\/li><li><strong>主救援（當日 <span class=\"tune\">40～400<\/span> 轉）<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發區間（觸發點前後 <span class=\"tune\">5<\/span> 轉，例如 35～45、75～85 轉），每人每天在區間內隨機挑一轉判定，須同時符合：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"tune\"><code>&lt;50%<\/code><\/span><\/li><li>條件 2：當日累積 RTP 低於該觸發點門檻（第 3.3.2 節）<\/li><\/ul><\/li><li><strong>延伸救援（當日 <span class=\"tune\">440～1,000<\/span> 轉）<\/strong>：沿用主救援第 395～405 轉那一段的設定，條件 2 改看往前 400 轉：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"tune\"><code>&lt;50%<\/code><\/span><\/li><li>條件 2：往前抓 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"tune\"><code>&lt;65%<\/code><\/span><\/li><\/ul><\/li><li>判定回合本身不納入統計；當日不到 35 轉不判定，超過 <strong><span class=\"tune\">1,000<\/span> 轉<\/strong>停止判定。<\/li><li>命中時由 Card System 在<strong>救援倍數對應的卡片區間<\/strong>重骰（例：100× 對應 (90, 100]）；該轉最終得分取「自然得分」與「重骰結果」較高者，<code>救援成本 = 救援後最終得分 − 該轉自然得分<\/code>。<\/li><li>每筆救援發放前都要通過救援池檢查（第 3.3.3 節）。<\/li><li>救援得分計入當日累積 RTP，被救過的玩家通常自然脫離觸發區；判定轉隨機，玩家無法預測、也無法從畫面判斷是否為救援。<\/li><\/ul>\n<h4 id=\"332-觸發點門檻倍數\">3.3.2 觸發點／門檻／倍數<\/h4>\n<p>主救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">門檻（當日累積 RTP）<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">35～45<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;25%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(20, 25]<\/span><\/td><td class=\"n\">44%～71%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td>第 <span class=\"tune\">75～85<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;30%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(45, 50]<\/span><\/td><td class=\"n\">53%～67%<\/td><td class=\"n\">97%<\/td><\/tr><tr><td>第 <span class=\"tune\">115～125<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;35%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(60, 70]<\/span><\/td><td class=\"n\">48%～61%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td>第 <span class=\"tune\">155～165<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;40%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(70, 80]<\/span><\/td><td class=\"n\">42%～52%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>第 <span class=\"tune\">195～205<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;45%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(80, 90]<\/span><\/td><td class=\"n\">39%～46%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">235～245<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><td class=\"n\">37%～43%<\/td><td class=\"n\">93%<\/td><\/tr><tr><td>第 <span class=\"tune\">275～285<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><td class=\"n\">32%～36%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">315～325<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><td class=\"n\">28%～32%<\/td><td class=\"n\">87%<\/td><\/tr><tr><td>第 <span class=\"tune\">355～365<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;60%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><td class=\"n\">25%～28%<\/td><td class=\"n\">88%<\/td><\/tr><tr><td>第 <span class=\"tune\">395～405<\/span> 轉<\/td><td class=\"n\"><span class=\"tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><td class=\"n\">22%～25%<\/td><td class=\"n\">90%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>救援倍數以 Card System 卡片倍率區間表示（見數學模型規範第 1.8 節），實際得分落在區間內。<\/li><li>RTP 增量 ＝ 救援倍數 ÷ 判定轉數，取區間下限配最晚一轉、上限配最早一轉，所以是範圍。<\/li><li>極限 RTP ＝ 門檻 ＋ 最大 RTP 增量，即救援後當日 RTP 最高可能值，全表低於 <strong>100%<\/strong>。<\/li><\/ul>\n<p>延伸救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th>條件<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">440～1,000<\/span> 轉，每 40 轉一個區間（前後 <span class=\"tune\">5<\/span> 轉隨機）<\/td><td>前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"tune\"><code>&lt;50%<\/code><\/span> 且往前 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"tune\">(90, 100]<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"333-救援池\">3.3.3 救援池<\/h4>\n<p>救援的唯一資金來源：救援機制決定誰該救、救多少；救援池決定這一筆付不付得起。<\/p>\n<pre><code>提撥額     = 該轉 Total Bet × 1%\n救援池餘額 = Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<ul><li><strong>單一救援池<\/strong>：中辦全部進同一個池，不設個人池；北辦的池分開，不流用。<\/li><li><strong>提撥比例<\/strong>：每 spin 把該把 Total Bet 的 <span class=\"tune\">1%<\/span> 放進救援池（比例可調）。<\/li><li><strong>每日刷新<\/strong>：每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 餘額歸零（與當日轉數、RTP 同時）。<\/li><li><strong>發放前檢查<\/strong>：<strong>每次判定成立都要先看救援池有沒有錢<\/strong>；不夠付這一筆就不救援（硬性上限，發出總額不會超過提撥總額）。<\/li><li><strong>增量記帳<\/strong>：自然得分較高時增量為 0、不扣款。<\/li><li><strong>監控指標<\/strong>：救援池餘額、每日提撥與發放、不救率、各區間觸發率與使用量、用到救援的玩家比例。<\/li><\/ul>\n<h4 id=\"334-流程圖\">3.3.4 流程圖<\/h4>\n<p>當日流程：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>轉數<\/th><th>階段<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1～34<\/td><td>累積期<\/td><td>不判定，只累積當日 RTP。<\/td><\/tr><tr><td>35～405<\/td><td>主救援<\/td><td>10 個區間（35～45、75～85…395～405），各區間隨機一轉判定：前 40 轉 RTP <code>&lt;50%<\/code> 且當日累積 RTP 低於該區間門檻，命中救對應卡片區間（門檻與倍數見第 3.3.2 節主救援表）。<\/td><\/tr><tr><td>406～434<\/td><td>間隔<\/td><td>不判定。<\/td><\/tr><tr><td>435～1,005<\/td><td>延伸救援 · (90, 100]<\/td><td>每 40 轉一個區間（435～445、475～485…995～1,005），區間內隨機一轉判定：前 40 轉 RTP <code>&lt;50%<\/code> 且往前 400 轉 RTP <code>&lt;65%<\/code>，命中救 (90, 100]。<\/td><\/tr><tr><td>&gt;1,000<\/td><td>停止判定<\/td><td>隔日留存已在 70% 以上，不再投入救援（最後一個區間只判定到第 1,000 轉）。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>單次判定的流程：<\/p>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">主救援、延伸救援都是每 40 轉一個區間，在區間內隨機挑一轉；取出該轉的門檻與救援倍數<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">條件 1 前 40 轉 RTP &lt;50%；條件 2 主救援看當日累積 RTP、延伸救援看往前 400 轉 RTP<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>具備救援資格，進入救援池檢查<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本次結束，等下一個區間<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與這一筆的救援成本<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援（硬性上限）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">發放與記帳<\/div><div class=\"step-desc\">Card System 在卡片區間內重骰結果；救援成本自救援池扣款，救援得分計入當日累積 RTP<\/div><\/div><\/div><\/div>\n<h3 id=\"34-模擬結果\">3.4 模擬結果<\/h3>\n<p>主救援（c2-1.8，彩罐熱舞 10,000 人 × 400 轉，不套救援池上限；救援倍數以卡片區間上限計，屬保守估計）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>總體指標（只計主救援，10,000 人 × 400 轉）<\/th><th class=\"n\">彩罐熱舞<\/th><\/tr><\/thead><tbody><tr><td>RTP（沒有機制）<\/td><td class=\"n\">92.1155%<\/td><\/tr><tr><td>主救援增量<\/td><td class=\"n\"><strong>+4.6216%<\/strong><\/td><\/tr><tr><td>RTP（含主救援）<\/td><td class=\"n\">96.7371%<\/td><\/tr><tr><td>用到主救援的玩家比例<\/td><td class=\"n\">26.97%<\/td><\/tr><tr><td>觸發率（判定成功 ÷ 總判定）<\/td><td class=\"n\">3.07%（2,930 / 95,359）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>第 395～405 轉區間部分落在第 400 轉之後，這些人當天沒玩到、不判定，所以總判定數少於 100,000。<\/li><li>觸發點固定時（c2-1.4）主救援增量 +5.07%；改成區間隨機後降到 +4.62%，主因是最後一個區間有一半落在第 400 轉之後。<\/li><li>門檻若推到極限 RTP 接近 100%（整數門檻、取區間最早一轉，最高 99.87%），主救援增量為 +8.62%。<\/li><\/ul>\n<p>使用量 ＝ 該區間實際發放 ÷ 前 400 轉總押注；「加入新手期 200 轉」＝當日前 200 轉屬新手期、不做救援判定，當日累積 RTP 仍從第 1 轉起算。占比為各區間發放次數占合計 2,930 次的比例：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">救援倍數<\/th><th class=\"n\">觸發率<\/th><th class=\"n\">使用量<\/th><th class=\"n\">加入新手期 200 轉<\/th><th class=\"n\">占比<\/th><\/tr><\/thead><tbody><tr><td>第 35～45 轉<\/td><td class=\"n\">(20, 25]<\/td><td class=\"n\">11.00%<\/td><td class=\"n\">+0.66%<\/td><td class=\"n\">—<\/td><td class=\"n\">37.54%<\/td><\/tr><tr><td>第 75～85 轉<\/td><td class=\"n\">(45, 50]<\/td><td class=\"n\">2.46%<\/td><td class=\"n\">+0.30%<\/td><td class=\"n\">—<\/td><td class=\"n\">8.40%<\/td><\/tr><tr><td>第 115～125 轉<\/td><td class=\"n\">(60, 70]<\/td><td class=\"n\">1.82%<\/td><td class=\"n\">+0.31%<\/td><td class=\"n\">—<\/td><td class=\"n\">6.21%<\/td><\/tr><tr><td>第 155～165 轉<\/td><td class=\"n\">(70, 80]<\/td><td class=\"n\">1.67%<\/td><td class=\"n\">+0.33%<\/td><td class=\"n\">—<\/td><td class=\"n\">5.70%<\/td><\/tr><tr><td>第 195～205 轉<\/td><td class=\"n\">(80, 90]<\/td><td class=\"n\">2.07%<\/td><td class=\"n\">+0.46%<\/td><td class=\"n\">—<\/td><td class=\"n\">7.06%<\/td><\/tr><tr><td>第 235～245 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">2.17%<\/td><td class=\"n\">+0.54%<\/td><td class=\"n\">+1.16%<\/td><td class=\"n\">7.41%<\/td><\/tr><tr><td>第 275～285 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">2.85%<\/td><td class=\"n\">+0.70%<\/td><td class=\"n\">+1.00%<\/td><td class=\"n\">9.73%<\/td><\/tr><tr><td>第 315～325 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">1.22%<\/td><td class=\"n\">+0.30%<\/td><td class=\"n\">+0.42%<\/td><td class=\"n\">4.16%<\/td><\/tr><tr><td>第 355～365 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">2.54%<\/td><td class=\"n\">+0.63%<\/td><td class=\"n\">+0.74%<\/td><td class=\"n\">8.67%<\/td><\/tr><tr><td>第 395～405 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">1.50%<\/td><td class=\"n\">+0.37%<\/td><td class=\"n\">+0.40%<\/td><td class=\"n\">5.12%<\/td><\/tr><tr><td><strong>合計<\/strong><\/td><td class=\"n\"><\/td><td class=\"n\"><\/td><td class=\"n\"><strong>+4.62%<\/strong><\/td><td class=\"n\"><strong>+3.71%<\/strong><\/td><td class=\"n\"><strong>100%（2,930 次）<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>延伸救援（c2-1.8，彩罐熱舞 10,000 人 × 1,000 轉，前段套主救援；增量 ＝ 延伸救援增量 ÷ 401～1,000 轉區段總押注）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>總體指標（延伸救援，401～1,000 轉區段）<\/th><th class=\"n\">彩罐熱舞<\/th><\/tr><\/thead><tbody><tr><td>區段 RTP（沒有機制）<\/td><td class=\"n\">91.9230%<\/td><\/tr><tr><td>延伸救援增量<\/td><td class=\"n\"><strong>+6.8946%<\/strong><\/td><\/tr><tr><td>區段 RTP（含延伸救援）<\/td><td class=\"n\">99.0761%<\/td><\/tr><tr><td>用到延伸救援的玩家比例<\/td><td class=\"n\">39.05%<\/td><\/tr><tr><td>觸發率（判定成功 ÷ 總判定）<\/td><td class=\"n\">2.87%（4,169 / 145,481）<\/td><\/tr><tr><td>全日 1,000 轉總 RTP（主＋延伸）<\/td><td class=\"n\"><strong>98.1405%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>各區間觸發率：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">觸發率<\/th><th>觸發區間<\/th><th class=\"n\">觸發率<\/th><th>觸發區間<\/th><th class=\"n\">觸發率<\/th><\/tr><\/thead><tbody><tr><td>第 435～445 轉<\/td><td class=\"n\">3.11%<\/td><td>第 635～645 轉<\/td><td class=\"n\">2.90%<\/td><td>第 835～845 轉<\/td><td class=\"n\">2.77%<\/td><\/tr><tr><td>第 475～485 轉<\/td><td class=\"n\">3.21%<\/td><td>第 675～685 轉<\/td><td class=\"n\">3.03%<\/td><td>第 875～885 轉<\/td><td class=\"n\">2.7
