.toc ul ul{padding-left:14px; margin:3px 0 6px; list-style:none}
.toc ul ul li{font-size:12.5px}
.toc a{color:var(--ink-3); text-decoration:none}
.toc a:hover{color:var(--accent)}
.toc a.on{color:var(--accent); font-weight:600}
.toc .doc{color:var(--ink-2)}
main{flex:1; min-width:0; display:flex}
iframe{flex:1; width:100%; height:100%; border:0; display:block; background:transparent}
@media (max-width:760px){

2. 名詞與計算定義<\/a><a class=\"toc-2\" href=\"#3-判定時程\" data-tab=\"sps_oldhand\">3. 判定時程<\/a><a class=\"toc-2\" href=\"#4-判定條件與救援倍數\" data-tab=\"sps_oldhand\">4. 判定條件與救援倍數<\/a><a class=\"toc-3\" href=\"#41-主救援\" data-tab=\"sps_oldhand\">4.1 主救援<\/a><a class=\"toc-3\" href=\"#42-延伸救援\" data-tab=\"sps_oldhand\">4.2 延伸救援<\/a><a class=\"toc-2\" href=\"#5-救援執行\" data-tab=\"sps_oldhand\">5. 救援執行<\/a><a class=\"toc-2\" href=\"#6-救援池\" data-tab=\"sps_oldhand\">6. 救援池<\/a><a class=\"toc-2\" href=\"#7-參數分開設定新增需求\" data-tab=\"sps_oldhand\">7. 參數分開設定（新增需求）<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-sps_oldhand\"><h1 id=\"老手救援-c-2版\">老手救援 C-2版<\/h1>\n<p>給 SPS 實作<strong>中辦老手救援（C-2）<\/strong>用。機制設計與模擬結果見 Omniplay 開發規範〈系統機制〉第 3 節；本文件只寫實作需要的規則、參數與紀錄。<strong>數值皆為暫定<\/strong>，上線值以 Config 為準，程式不得寫死。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>機制版本<\/td><td>C-2（數學模擬版本 c2-1.8）<\/td><\/tr><tr><td>適用範圍<\/td><td>中辦；Oldhand 的 NB／EB<\/td><\/tr><tr><td>不適用<\/td><td>Newbie（新手期）、Buy Feature／Super Feature<\/td><\/tr><tr><td>北辦<\/td><td>另有一套，救援池、累積數值與統計<strong>全部分開<\/strong>，不在本文件範圍<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"1-機制摘要\">1. 機制摘要<\/h2>\n<ul><li><strong>以天為循環<\/strong>：每天<strong>台灣時間 04:00<\/strong> 刷新，當日轉數、當日統計與救援池餘額全部歸零。<\/li><li><strong>40 轉一桶<\/strong>：得分與押注每 40 轉累積成一桶，保留最近 10 桶；判定只看已經滿的桶。<\/li><li><strong>主救援<\/strong>（當日第 41～405 轉）：每 40 轉一個觸發點，在觸發點後第 1～5 轉隨機挑一轉判定；兩個條件都成立就用 Card System 在指定卡片倍率區間重骰。<\/li><li><strong>延伸救援<\/strong>（當日第 441 轉起，<strong>超過第 1,000 轉也照常判定<\/strong>）：同樣每 40 轉一個觸發點，條件 2 改看最近 10 桶（往前 400 轉）。<\/li><li><strong>押注檢查<\/strong>：判定轉押注超過判定用桶的平均押注，就取消該次救援（防加注套利）。<\/li><li><strong>救援池<\/strong>：每轉提撥押注的一定比例；發放前檢查餘額，不夠就不救。<\/li><li><strong>救援參數要能分開設定（新增需求）<\/strong>：老手期的 NB／EB × 小／中／大 Bet 共 6 組各自設定（第 7 節）；現在只有一套、無法拆開。<\/li><li>救援結果由 Card System 產生，演出與自然得分無法區分；玩家無法預測判定轉。<\/li><\/ul>\n<h2 id=\"2-名詞與計算定義\">2. 名詞與計算定義<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>當日<\/td><td>台灣時間 04:00 起至隔日 04:00 前（UTC+8）。<\/td><\/tr><tr><td>當日轉數<\/td><td>玩家在該款遊戲當日的第幾轉，從 1 起算；04:00 歸零。<\/td><\/tr><tr><td>觸發點 <code>t<\/code><\/td><td>40、80、120…，即每一桶滿的那一轉。<\/td><\/tr><tr><td>判定轉 <code>k<\/code><\/td><td>觸發點後第 1～5 轉（<code>t+1<\/code>～<code>t+5<\/code>）中抽中的那一轉。<\/td><\/tr><tr><td>得分<\/td><td>每轉最終得分，<strong>含先前救援後的結果<\/strong>（救援得分會計入後續統計）。<\/td><\/tr><tr><td>押注<\/td><td>每轉 Total Bet（實際押注）。<\/td><\/tr><tr><td>桶<\/td><td>當日第 1～40 轉為第 1 桶、第 41～80 轉為第 2 桶…；每桶記 Σ 得分、Σ 押注，滿 40 轉才算完成。<\/td><\/tr><tr><td>前 40 轉 RTP<\/td><td><strong>最近 1 個完成的桶<\/strong>，即第 <code>t−39<\/code>～<code>t<\/code> 轉。<\/td><\/tr><tr><td>當日累積 RTP<\/td><td><strong>所有完成的桶<\/strong>，即第 1～<code>t<\/code> 轉（主救援 <code>t ≤ 400<\/code>，最多 10 桶）。<\/td><\/tr><tr><td>往前 400 轉 RTP<\/td><td><strong>最近 10 個完成的桶<\/strong>，即第 <code>t−399<\/code>～<code>t<\/code> 轉。<\/td><\/tr><tr><td>平均押注<\/td><td>條件 2 用的那些桶（最近 10 桶）的 Σ 押注 ÷ 轉數。<\/td><\/tr><tr><td>救援成本<\/td><td>救援後最終得分 − 該轉自然得分（≥ 0）。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong>10 桶滾動<\/strong>：累積滿 10 桶後開始累積第 11 桶；第 11 桶滿時丟掉第 1 桶，之後每滿一桶就丟掉最舊的一桶，永遠保留最近 10 桶。<\/li><li>條件 2 一律取<strong>最近 10 桶<\/strong>（不足 10 桶就全拿）：第 400 轉以前就是當日累積，第 400 轉以後就是往前 400 轉。<\/li><li><strong>只看完成的桶<\/strong>：判定轉 <code>k<\/code> 與 <code>t+1<\/code>～<code>k−1<\/code> 都在還沒滿的桶內，不納入本次判定；這些轉數（含救援後得分）照常累積進該桶，下次判定才算進去。<\/li><li>例：判定轉為第 202 轉（觸發點 200）→ 條件 1 取第 5 桶（第 161～200 轉）；條件 2 取第 1～5 桶（第 1～200 轉）。<\/li><li>例：判定轉為第 443 轉（觸發點 440）→ 條件 1 取第 11 桶（第 401～440 轉）；條件 2 取第 2～11 桶（第 41～440 轉）。<\/li><li>門檻比較一律為<strong>嚴格小於<\/strong>（<code>&lt;<\/code>）。<\/li><li>所有 RTP 都以「得分 ÷ 押注」計算，跨不同押注金額的轉數直接加總。<\/li><\/ul>\n<h2 id=\"3-判定時程\">3. 判定時程<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>階段<\/th><th>觸發點 <code>t<\/code><\/th><th>判定區間<\/th><th class=\"n\">區間數<\/th><\/tr><\/thead><tbody><tr><td>主救援<\/td><td>40、80、…、400<\/td><td><code>[t+1, t+5]<\/code>（41～45、81～85…401～405）<\/td><td class=\"n\">10<\/td><\/tr><tr><td>延伸救援<\/td><td>440、480、520、…（不設上限）<\/td><td><code>[t+1, t+5]<\/code>（441～445、481～485…）<\/td><td class=\"n\">到當日結束<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>每個區間在 <code>[t+1, t+5]<\/code> 內<strong>均勻隨機<\/strong>抽一個整數作為判定轉；每人每天每區間只判定一次。<\/li><li>抽選在當日開始（或進入該區間前）完成，玩家無法得知。<\/li><li>玩家當日沒玩到抽中的那一轉 → 該區間不判定，不補判。<\/li><li><strong>延伸救援沒有停判轉<\/strong>，超過當日第 1,000 轉仍每 40 轉判定一次，直到 04:00 刷新；當日第 1～40 轉、第 406～440 轉不判定。<\/li><\/ul>\n<p><strong>第一個判定區間<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩家<\/th><th>第一個判定區間<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新玩家第一天<\/td><td><strong>第 241～245 轉<\/strong><\/td><td>前 200 轉是新手期，不做老手救援<\/td><\/tr><tr><td>第二天起（已是老手）<\/td><td><strong>第 41～45 轉<\/strong><\/td><td>照第 4 節從頭判定<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新玩家第一天跳過第 201～205 轉：這次判定看的桶是第 161～200 轉，還在新手期。<\/li><li>第 241～245 轉看的桶是第 201～240 轉，是第一個整桶都在老手期的桶。<\/li><li>當日轉數與桶都照常從第 1 轉起算，新手期的轉數也算進當日累積 RTP。<\/li><\/ul>\n<h2 id=\"4-判定條件與救援倍數\">4. 判定條件與救援倍數<\/h2>\n<h3 id=\"41-主救援\">4.1 主救援<\/h3>\n<p>兩個條件都成立才命中：<\/p>\n<ul><li>條件 1：前 40 轉 RTP（最近 1 桶）<code>&lt;50%<\/code><\/li><li>條件 2：當日累積 RTP（最近 10 桶）<code>&lt;<\/code> 該區間門檻<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">觸發點<\/th><th>判定區間<\/th><th class=\"n\">條件 2 門檻<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">40<\/td><td>第 41～45 轉<\/td><td class=\"n\"><code>&lt;25%<\/code><\/td><td class=\"n\">(20, 25]<\/td><\/tr><tr><td class=\"n\">80<\/td><td>第 81～85 轉<\/td><td class=\"n\"><code>&lt;30%<\/code><\/td><td class=\"n\">(45, 50]<\/td><\/tr><tr><td class=\"n\">120<\/td><td>第 121～125 轉<\/td><td class=\"n\"><code>&lt;35%<\/code><\/td><td class=\"n\">(60, 70]<\/td><\/tr><tr><td class=\"n\">160<\/td><td>第 161～165 轉<\/td><td class=\"n\"><code>&lt;40%<\/code><\/td><td class=\"n\">(70, 80]<\/td><\/tr><tr><td class=\"n\">200<\/td><td>第 201～205 轉<\/td><td class=\"n\"><code>&lt;45%<\/code><\/td><td class=\"n\">(80, 90]<\/td><\/tr><tr><td class=\"n\">240<\/td><td>第 241～245 轉<\/td><td class=\"n\"><code>&lt;50%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">280<\/td><td>第 281～285 轉<\/td><td class=\"n\"><code>&lt;55%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">320<\/td><td>第 321～325 轉<\/td><td class=\"n\"><code>&lt;55%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">360<\/td><td>第 361～365 轉<\/td><td class=\"n\"><code>&lt;60%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">400<\/td><td>第 401～405 轉<\/td><td class=\"n\"><code>&lt;65%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"42-延伸救援\">4.2 延伸救援<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發點<\/th><th>條件 1<\/th><th>條件 2<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>440 起每 40 轉（超過 1,000 轉照常）<\/td><td>前 40 轉 RTP（最近 1 桶）<code>&lt;50%<\/code><\/td><td>往前 400 轉 RTP（最近 10 桶）<code>&lt;65%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>卡片倍率區間的定義與倍率分母見 Omniplay 開發規範〈數學模型規範〉第 1.8 節、第 2.5 節。<\/li><\/ul>\n<h2 id=\"5-救援執行\">5. 救援執行<\/h2>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">取該區間的門檻與救援倍數（依判定轉的押注層級）<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">條件 1 最近 1 桶 RTP；條件 2 最近 10 桶 RTP（只看完成的桶）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>命中，進入押注檢查<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">押注檢查<\/div><div class=\"step-desc\">判定轉押注與判定用桶（最近 10 桶）的平均押注比較<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">判定轉押注 ≤ 平均押注<\/span><span>進入重骰<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">判定轉押注 &gt; 平均押注<\/span><span>取消本次救援，該轉照自然結果<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本區間結束，該轉照自然結果<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">重骰<\/div><div class=\"step-desc\">Card System 在救援倍數的卡片區間內產生候選結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與救援成本<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放：最終得分取較高者，救援池扣除救援成本<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援，該轉照自然結果<\/span><\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong>取較高者<\/strong>：自然得分高於候選得分時，最終得分＝自然得分，救援成本為 0、不扣池（仍記為命中）。<\/li><li><strong>押注檢查<\/strong>：判定轉押注 &gt; 判定用桶的平均押注（Σ 押注 ÷ 轉數，與條件 2 同一批桶）就取消，不重骰、不扣池、不補判。例：第 202 轉判定 → 跟第 1～200 轉的平均押注比。<\/li><li>救援只會往上補，不會讓玩家拿得比自然結果少。<\/li><li>救援後的最終得分計入所在的桶，影響後續判定（第 2 節）。<\/li><li>不救援時不補發、不累積、不延到下一個區間。<\/li><\/ul>\n<h2 id=\"6-救援池\">6. 救援池<\/h2>\n<pre><code>提撥額     = 該轉 Total Bet × pool_rate（依該轉的押注層級）\n救援池餘額 = 當日起始餘額 + Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>規則<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>範圍<\/td><td>中辦<strong>單一救援池<\/strong>（不分遊戲、不設個人池）；北辦的池分開，不流用。<\/td><\/tr><tr><td>提撥<\/td><td>每一轉 Oldhand NB／EB 押注依 <code>pool_rate<\/code> 提撥；暫定 <strong>1%<\/strong>。<\/td><\/tr><tr><td>刷新<\/td><td>每天台灣時間 04:00 餘額歸零；當日起始餘額暫定 0。<\/td><\/tr><tr><td>發放前檢查<\/td><td>每筆救援都要先檢查，餘額 &lt; 救援成本就不救（硬性上限，當日發出總額不超過當日可用總額）。<\/td><\/tr><tr><td>併發<\/td><td>8 台機器各自判定；同時觸發時前一筆還沒扣款，最多 8 名玩家會看到同一個餘額而全部發放，池子可能變負。超發量小，<strong>接受、不另處理<\/strong>。<\/td><\/tr><\/tbody><\/table><\/div>\n<h2 id=\"7-參數分開設定新增需求\">7. 參數分開設定（新增需求）<\/h2>\n<p><strong>現況：救援參數只有一套，NB／EB 與小／中／大 Bet 共用，無法拆開。<\/strong> <strong>要改成：NB／EB × 小／中／大 Bet 共 6 組，每組救援參數都能各自設定。<\/strong><\/p>\n<p>以下都只指<strong>老手期（Oldhand）<\/strong>；新手期（Newbie）不做老手救援，BF／SF 沒有救援，都不需要設定。A／B 版已經靠不同 Config 檔分開（<code>config_92A.js<\/code>／<code>config_92B.js<\/code>），不在這次需求內；A、B 兩個 Config 檔各有自己的 6 組。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><\/th><th>小 Bet<\/th><th>中 Bet<\/th><th>大 Bet<\/th><\/tr><\/thead><tbody><tr><td><strong>NB<\/strong><\/td><td>第 1 組<\/td><td>第 2 組<\/td><td>第 3 組<\/td><\/tr><tr><td><strong>EB<\/strong><\/td><td>第 4 組<\/td><td>第 5 組<\/td><td>第 6 組<\/td><\/tr><\/tbody><\/table><\/div>\n<p>每組各自設定的參數：<\/p>\n<ul><li>條件 1 門檻（前 40 轉 RTP）<\/li><li>條件 2 的 10 段門檻<\/li><li>救援倍數（10 段卡片區間）<\/li><li>延伸救援的條件與倍數<\/li><li>提撥比例（6 組都提撥進同一個救援池）<\/li><\/ul>\n<ul><li>押注層級依 Omniplay 開發規範〈數學模型規範〉第 1.7.1 節判定（<code>&lt; $2<\/code>、<code>$2～$100<\/code>、<code>&gt; $100<\/code>）。<\/li><li>6 組都要能設定，不得缺少或互相 fallback；目前 6 組先填相同數值（第 4 節），之後分開調整。<\/li><li>觸發節奏（40 轉一桶、保留 10 桶、觸發點後第 1～5 轉判定）、起判轉（41）、每日刷新時間（04:00）6 組共用。<\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['sps_oldhand'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
var SITES = {"sps": {"name": "老手救援 C-2版", "src": "", "meta": {"groups": [["系統相關", ["sps_oldhand"]]], "titles": {"sps_oldhand": "老手救援 C-2版"}, "toc": {"sps_oldhand": [[2, "1-機制摘要", "1. 機制摘要"], [2, "2-名詞與計算定義", "2. 名詞與計算定義"], [2, "3-判定時程", "3. 判定時程"], [2, "4-判定條件與救援倍數", "4. 判定條件與救援倍數"], [3, "41-主救援", "4.1 主救援"], [3, "42-延伸救援", "4.2 延伸救援"], [2, "5-救援執行", "5. 救援執行"], [2, "6-救援池", "6. 救援池"], [2, "7-參數分開設定新增需求", "7. 參數分開設定（新增需求）"]]}}}};
var KEYS = ["sps"];
var SINGLE = true;
var frame = document.getElementById('site');
var cur = { key: null, tab: null, anchor: '' };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function setHash() {
  var h = '#' + (SINGLE ? '' : cur.key + (cur.tab ? '/' : '')) + (cur.tab || '') + (cur.anchor ? '/' + cur.anchor : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}
// 目錄最多兩層：大類下只有一份文件時列章節；多份文件時只列文件名（章節看內文）
// 文件名去掉「規範」、章節去掉編號，各站寫法一致
var DOC_NAME = { 'GameRule規範': 'Game Rule', 'Demo報告規範': 'Demo 報告' };
function docName(t) { return DOC_NAME[t] || t.replace(/規範$/, ''); }
function secName(t) { return t.replace(/^\d+(\.\d+)*\.?\s*/, ''); }
function secLink(t, s, on) {
  return '<a href="#" data-tab="' + t + '" data-anchor="' + s[1] + '"' + (on ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a>';
}
// 整站只有一份文件（開發流程）：每章當一個大類、小節列在下面，與其他站同一種結構
function renderFlat(m, t) {
  var out = '', list = (m.toc || {})[t] || [], open = false;
  // 目前讀到的小節所屬的章（第 2 層）
  var curChap = '', last2 = '';
  list.forEach(function (s) { if (s[0] === 2) last2 = s[1]; if (s[1] === cur.anchor) curChap = last2; });
  list.forEach(function (s) {
    if (s[0] === 2) {
      if (open) out += '</ul></li>';
      out += '<li>' + secLink(t, s, s[1] === curChap) + '<ul>';
      open = true;
    } else if (open) {
      out += '<li>' + secLink(t, s, s[1] === cur.anchor) + '</li>';
    }
  });
  if (open) out += '</ul></li>';
  return out.replace(/<ul><\/ul>/g, '');
}
function renderToc() {
  var m = SITES[cur.key].meta, out = '';
  var gs = m.groups || [];
  if (gs.length === 1 && gs[0][1].length === 1) {
    setToc(renderFlat(m, gs[0][1][0]));
    return;
  }
  gs.forEach(function (g) {
    var ids = g[1], active = ids.indexOf(cur.tab) >= 0;
    out += '<li><a href="#" data-tab="' + ids[0] + '"' + (active ? ' class="on"' : '') + '>' + esc(g[0]) + '</a>';
    {   // 全部展開，不折疊
      out += '<ul>';
      if (ids.length > 1) {
        ids.forEach(function (t) {
          out += '<li><a href="#" data-tab="' + t + '"' + (t === cur.tab ? ' class="on"' : '') + '>' + esc(docName(m.titles[t])) + '</a></li>';
        });
      } else {
        var lst = (m.toc || {})[ids[0]] || [], ch = '', l2 = '';
        lst.forEach(function (s) { if (s[0] === 2) l2 = s[1]; if (s[1] === cur.anchor) ch = l2; });
        lst.filter(function (s) { return s[0] === 2; }).forEach(function (s) {
          out += '<li><a href="#" data-tab="' + ids[0] + '" data-anchor="' + s[1] + '"' + (active && s[1] === ch ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a></li>';
        });
      }
      out += '</ul>';
    }
    out += '</li>';
  });
  setToc(out);
}
// 沒有任何目錄項目時整個 Table of Contents 框拿掉
function setToc(h) {
  var u = document.getElementById('toc');
  u.innerHTML = h;
  u.closest('.toc').hidden = !u.querySelector('a');
}
function markNav() {
  document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.key === cur.key); });
}
function go(tab, anchor) {
  cur.tab = tab; cur.anchor = anchor || '';
  frame.contentWindow && frame.contentWindow.postMessage({ goTab: tab, goAnchor: anchor || '' }, '*');
  renderToc(); setHash();
}
function openSite(key, tab, anchor) {
  if (!SITES[key]) key = KEYS[0];
  var groups = SITES[key].meta.groups || [];
  cur = { key: key, tab: tab || (groups[0] ? groups[0][1][0] : null), anchor: anchor || '' };
  frame.onload = function () { if (cur.tab) frame.contentWindow.postMessage({ goTab: cur.tab, goAnchor: cur.anchor }, '*'); };
  var doc = document.getElementById('doc-' + key);
  if (doc) { frame.removeAttribute('src'); frame.srcdoc = JSON.parse(doc.textContent); }
  else { frame.removeAttribute('srcdoc'); frame.src = SITES[key].src; }
  markNav(); renderToc(); setHash();
}
document.querySelector('.nav') && document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
</body>
