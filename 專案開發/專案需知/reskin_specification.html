<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reskin 開發規範</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--surface:#f6f5f1; --panel:#ffffff; --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794; --rule:#dcdad3;
  --accent:#1b3a6b; --brand:#1b3a6b;
  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --accent:#6f97d8}}
:root[data-theme="dark"]{--surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --accent:#6f97d8}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{display:flex; flex-direction:column; background:var(--surface); color:var(--ink); font-family:var(--font-sans)}
/* 不顯示拉條，仍可上下捲動 */
aside, iframe{scrollbar-width:none; -ms-overflow-style:none}
aside::-webkit-scrollbar{display:none}
header{display:flex; align-items:center; gap:12px; padding:18px 28px 14px}
.logo{width:34px; height:34px; border-radius:8px; background:var(--brand); flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  display:grid; place-items:center}
.logo span{color:#fff; font-weight:700; font-size:17px; font-family:var(--font-sans)}
h1{margin:0 0 0 6px; font-size:22px; font-weight:500; color:var(--ink-2); letter-spacing:-.01em}
h1 b{color:var(--ink); font-weight:600}
.layout{flex:1; min-height:0; display:flex; gap:26px; padding:0 28px 22px}
aside{width:236px; flex:none; overflow-y:auto; padding:6px 2px 20px 0}
.nav{list-style:none; margin:0 0 22px; padding:0}
.nav > li{margin:0 0 6px}
.nav .top{display:block; font-size:17px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav a.top:hover{color:var(--accent)}
.nav .sub{list-style:none; margin:4px 0 0; padding:0 0 0 18px}
.nav .sub a{display:block; font-size:14px; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav .sub a:hover{color:var(--accent)}
.nav a.on, .nav span.top.on{color:var(--accent); font-weight:600}
.nav a:focus, .toc a:focus{outline:none}
.nav a:focus-visible, .toc a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.toc{border:1px solid var(--rule); border-radius:4px; padding:12px 12px 14px; background:var(--panel)}
.toc[hidden]{display:none}
.toc-title{font-size:16px; font-weight:600; margin:0 0 8px}
.toc ul{margin:0; padding-left:18px; list-style:square; color:var(--ink-3)}
.toc li{margin:3px 0; font-size:13.5px; line-height:1.4}
.toc ul ul{padding-left:14px; margin:3px 0 6px; list-style:none}
.toc ul ul li{font-size:12.5px}
.toc a{color:var(--ink-3); text-decoration:none}
.toc a:hover{color:var(--accent)}
.toc a.on{color:var(--accent); font-weight:600}
.toc .doc{color:var(--ink-2)}
main{flex:1; min-width:0; display:flex}
iframe{flex:1; width:100%; height:100%; border:0; display:block; background:transparent}
@media (max-width:760px){
  header{padding:14px 16px 10px}
  .layout{flex-direction:column; padding:0 16px 16px; gap:14px}
  aside{width:auto; overflow:visible; padding:0}
  /* 手機：整頁一起捲動（內文框高度跟著內容），只有標題列＋頁簽列固定在上方 */
  html, body{height:auto}
  body{display:block}
  header{position:sticky; top:0; z-index:80; background:var(--surface)}
  body .topnav{position:sticky; top:var(--hh, 56px); z-index:79; background:var(--surface); margin:0; padding:0 16px; border-bottom:1px solid var(--rule)}
  .layout{display:flex; padding-top:12px}
  main{height:auto; flex:none}
  iframe{height:600px}
}
/* 頂部搜尋框 */
.pv-search{position:relative; margin-left:auto; align-self:center; flex:0 1 340px; min-width:160px; padding-bottom:2px}
.pv-search input{width:100%; box-sizing:border-box; padding:6px 12px 6px 32px; border-radius:4px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); font:inherit; font-size:14px; outline:none}
.pv-search input:focus{border-color:var(--accent); box-shadow:none}
.pv-search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; font-size:14px}
.pv-search kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:4px; padding:0 5px; background:var(--surface)}
.pv-res{position:absolute; top:calc(100% + 4px); right:0; width:min(560px,calc(100vw - 32px)); max-height:70vh; overflow:auto; z-index:70; display:none;
  background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3); padding:4px 0}
.pv-res.on{display:block}
.pv-item{display:block; padding:8px 14px; border-radius:0; cursor:pointer; color:var(--ink); text-decoration:none}
.pv-item:hover,.pv-item.sel{background:rgba(255,255,255,.05)}
.pv-path{font-size:11.5px; color:var(--ink-3)}
.pv-title{font-weight:600; font-size:14px; margin:1px 0}
.pv-snip{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv-snip mark,.pv-title mark{background:color-mix(in srgb,var(--accent) 45%,transparent); color:inherit; border-radius:2px}
.pv-empty{padding:10px; color:var(--ink-3); font-size:13px}
header{display:flex; align-items:center; flex-wrap:wrap; gap:12px}
.topnav{display:flex; gap:2px; margin:0 28px 14px; border-bottom:1px solid var(--rule)}
.tn{position:relative}
.toc-secs{margin:2px 0 4px; padding-left:14px; list-style:none; border-left:1px solid var(--rule)}
.toc-secs a{font-size:12.5px}
.tn-btn{display:flex; align-items:center; gap:6px; font:inherit; font-size:14.5px; color:var(--ink-2); background:transparent;
  border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 14px 9px; margin-bottom:-1px; cursor:pointer}
.tn-btn:hover, .tn.open .tn-btn, .tn:hover .tn-btn{color:var(--ink)}
.tn.on .tn-btn{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tn-cur{display:none}
.tn-btn{white-space:nowrap; flex:none}
@media (max-width:700px){.tn-btn{padding:8px 10px 9px} .pv-search{display:none}}
.tn-arrow{font-size:10px; color:var(--ink-3)}
.tn-menu{position:absolute; top:calc(100% + 1px); left:0; min-width:180px; z-index:60; display:none; flex-direction:column;
  padding:4px 0; background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tn-menu::before{content:""; position:absolute; left:0; right:0; top:-6px; height:6px}
.tn:hover .tn-menu, .tn.open .tn-menu{display:flex}
.tn-menu a{display:block; padding:7px 16px; color:var(--ink-2); text-decoration:none; font-size:14px; white-space:nowrap}
.tn-menu a:hover{background:var(--panel-2, rgba(255,255,255,.04)); color:var(--ink)}
.tn-menu a.on{color:var(--accent); font-weight:600}
@media (min-width:900px){aside{position:sticky; top:12px; align-self:flex-start; max-height:calc(100vh - 24px)}}
</style>
</head>
<body>
<header><div class="logo"><span>J</span></div><h1><b>Reskin</b> 開發規範</h1></header>

<div class="layout">
<aside>
  <nav class="toc" aria-label="Table of Contents"><div class="toc-title">Table of Contents</div><ul id="toc"></ul></nav>
</aside>
<main><iframe id="site" title="規範內文"></iframe></main>
</div>
<script type="application/json" id="doc-reskin">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Reskin 開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n:is(strong,.tune,code,a,mark).nl{margin-left:0}\n:is(strong,.tune,code,a,mark).nr{margin-right:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:760px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:78px; border-bottom:1px dashed var(--grid)}\n.tl-track.short{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-lane{padding-top:44px}\n.tl-row:has(.tl-track.short) .tl-lane{padding-top:5px}\n.tl-lane.tl-axis-name{padding-top:2px}\n.tl-band{position:absolute; top:46px; height:18px; border-radius:3px; background:color-mix(in srgb,var(--c) 16%,transparent)}\n.tl-bar.event{background:var(--c); height:14px; top:48px; border-radius:2px}\n.tl-label{position:absolute; top:2px; font-size:.95em; font-weight:600; line-height:1.25; color:var(--c); white-space:nowrap}\n.tl-range{display:block; font-family:var(--font-mono); font-size:.85em; font-weight:500; color:var(--ink-2)}\n.tl-guide{position:absolute; top:64px; border-left:1px dashed var(--c); opacity:.7; pointer-events:none}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-axis.dense{height:40px}\n.tl-axis.dense .tl-tick{font-size:.78em}\n.tl-axis.dense .tl-tick:nth-child(even){top:15px}\n.tl-axis.dense .tl-tick:nth-child(even)::before{height:20px; top:-16px}\n.tl-periods{height:30px; border-bottom:none}\n.tl-period{position:absolute; top:2px; height:24px; line-height:24px; text-align:center; font-weight:600; font-size:.95em; color:var(--c);\n  background:color-mix(in srgb,var(--c) 16%,transparent); border:1.5px solid var(--c); border-radius:3px; box-sizing:border-box}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.subs{display:flex; flex-direction:column; align-items:flex-start; gap:2px; margin-top:8px}\n.sub-arrow{color:var(--ink-3); padding-left:14px; line-height:1.2}\n.sub-row.par{border:1px dashed var(--rule); border-radius:4px; padding:6px 8px 8px}\n.par-tag{font-size:.85em; color:var(--ink-3); margin-bottom:4px}\n.par-boxes{display:flex; gap:8px; flex-wrap:wrap}\n.sub{border:1px solid var(--rule); border-radius:4px; padding:4px 10px; background:var(--panel)}\n.sub-title{font-weight:600; font-size:.95em}\n.sub-desc{color:var(--ink-2); font-size:.88em}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\ ke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M18 4H6l6 8-6 8h12\"/><\/svg>數學設計<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-guide\"><\/nav><nav class=\"toc\" id=\"toc-knowhow\" hidden><a class=\"toc-2\" href=\"#1-市場與平台要求\" data-tab=\"knowhow\">1. 市場與平台要求<\/a><a class=\"toc-2\" href=\"#2-幣別\" data-tab=\"knowhow\">2. 幣別<\/a><\/nav><nav class=\"toc\" id=\"toc-系統機制\" hidden><a class=\"toc-2\" href=\"#1-總覽\" data-tab=\"系統機制\">1. 總覽<\/a><a class=\"toc-3\" href=\"#11-機制說明\" data-tab=\"系統機制\">1.1 機制說明<\/a><a class=\"toc-3\" href=\"#12-流程圖\" data-tab=\"系統機制\">1.2 流程圖<\/a><a class=\"toc-2\" href=\"#2-新手體驗\" data-tab=\"系統機制\">2. 新手體驗<\/a><a class=\"toc-3\" href=\"#21-機制目標\" data-tab=\"系統機制\">2.1 機制目標<\/a><a class=\"toc-3\" href=\"#22-機制介紹數值設定\" data-tab=\"系統機制\">2.2 機制介紹／數值設定<\/a><a class=\"toc-2\" href=\"#3-老手救援\" data-tab=\"系統機制\">3. 老手救援<\/a><a class=\"toc-3\" href=\"#31-機制目標\" data-tab=\"系統機制\">3.1 機制目標<\/a><a class=\"toc-3\" href=\"#32-機制介紹數值設定\" data-tab=\"系統機制\">3.2 機制介紹／數值設定<\/a><a class=\"toc-2\" href=\"#4-待確認事項\" data-tab=\"系統機制\">4. 待確認事項<\/a><\/nav><nav class=\"toc\" id=\"toc-math\" hidden><a class=\"toc-2\" href=\"#1-數學模型\" data-tab=\"math\">1. 數學模型<\/a><a class=\"toc-3\" href=\"#11-必要內容\" data-tab=\"math\">1.1 必要內容<\/a><a class=\"toc-3\" href=\"#12-模型命名\" data-tab=\"math\">1.2 模型命名<\/a><a class=\"toc-3\" href=\"#13-押注選項\" data-tab=\"math\">1.3 押注選項<\/a><a class=\"toc-3\" href=\"#14-rtp-配置\" data-tab=\"math\">1.4 RTP 配置<\/a><a class=\"toc-3\" href=\"#15-彩金配置\" data-tab=\"math\">1.5 彩金配置<\/a><a class=\"toc-3\" href=\"#16-bet-mode\" data-tab=\"math\">1.6 Bet Mode<\/a><a class=\"toc-2\" href=\"#2-待確認事項\" data-tab=\"math\">2. 待確認事項<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-guide\"><div class=\"sec-head\"><h1 id=\"reskin-導覽\">Reskin 導覽<\/h1><p class=\"updated\">最後更新：2026-11-11<\/p>\n<p>本規範適用於 <strong class=\"nr\">Reskin 遊戲<\/strong>：以既有遊戲（iGaming 遊戲或 Landbase 轉製遊戲）換皮，輸出到 GC／SC 雙幣市場。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁籤<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"knowhow\">Knowhow<\/a><\/td><td>市場、平台 RTP 要求、幣別<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"系統機制\">系統相關<\/a><\/td><td>系統機制（新手體驗、老手救援）；天花板說明、腳本規範、壓測說明書、後端報表待定<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"math\">數學設計<\/a><\/td><td>押注結構、GC／SC 押注選項、RTP 配置（92／94／96）、Link 彩金<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-knowhow\" hidden><div class=\"sec-head\"><h1 id=\"reskin-knowhow\">Reskin Knowhow<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁記錄 Reskin 產線的市場與平台背景，作為數學設計的前提。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-市場與平台要求\">1. 市場與平台要求<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>市場<\/td><td>歐美<\/td><\/tr><tr><td>平台 RTP 要求<\/td><td>須提供總 RTP（Total (+機制)）<code class=\"nl nr\">92%<\/code>、<code class=\"nl nr\">94%<\/code>、<code class=\"nl\">96%<\/code> 三個版本；彩金都一樣插在遊戲裡，只差 Game RTP<\/td><\/tr><tr><td>幣別<\/td><td>GC、SC 兩種<\/td><\/tr><tr><td>押注層級<\/td><td>不分 <code class=\"nr\">&lt; $2<\/code>／<code class=\"nl nr\">&gt;= $2<\/code>；系統機制不會依押注金額擋拉彩金<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>據了解（未經平台正式確認），平台會在玩家<strong class=\"nr\">第一次玩該遊戲時<\/strong>，依玩家過去的遊玩習慣指定 92／94／96 其中一個版本給該玩家。<\/li><li>因此三個版本都會在線上實際被玩到，皆須完整製作、模擬驗證與送驗，不能只做主版本。<\/li><li>各版本的 RTP 拆分見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.4 節。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-幣別\">2. 幣別<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>幣別<\/th><th>性質<\/th><th class=\"n\">Denom<\/th><th class=\"n\">1 倍押注<\/th><th>押注範圍<\/th><\/tr><\/thead><tbody><tr><td>GC<\/td><td>遊戲幣（無現金價值，不可兌換）<\/td><td class=\"n\"><code class=\"nl nr\">20<\/code><\/td><td class=\"n\"><code class=\"nl nr\">2,000 GC<\/code><\/td><td><code class=\"nl nr\">2,000<\/code>～<code class=\"nl nr\">100,000 GC<\/code>（上線 18 檔）<\/td><\/tr><tr><td>SC<\/td><td>錢（可兌換現金）<\/td><td class=\"n\"><code class=\"nl nr\">0.002<\/code><\/td><td class=\"n\"><code class=\"nl nr\">0.2 SC<\/code><\/td><td><code class=\"nl nr\">0.2<\/code>～<code class=\"nl nr\">200 SC<\/code>（上線 40 檔）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>兩幣別共用同一張 44 組 Bet Multiplier，只有 Denom 不同；押注清單見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.3 節。<\/li><li>兩幣別是否共用同一套 RTP、Card System 與彩金資格尚待確認，確認前使用相同數學。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-系統機制\" hidden><div class=\"sec-head\"><h1 id=\"reskin-系統機制\">Reskin 系統機制<\/h1><p class=\"updated\">最後更新：2026-11-11<\/p>\n<p>本頁說明 <strong>Reskin 遊戲<\/strong>的系統機制：新手體驗與老手救援。各機制的 RTP 預算見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.4 節。<\/p>\n<p>標示方式：<strong class=\"nl\">粗體<\/strong>為重要數值；<span class=\"nl tune\">紅色虛線<\/span>為後端要做成可調整的參數。兩個機制都由 Card System 在指定的卡片區間重骰產生結果，演出與自然得分無法區分。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-總覽\">1. 總覽<\/h2>\n<h3 id=\"11-機制說明\">1.1 機制說明<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>現行版本<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td><strong class=\"nl nr\">D 版<\/strong><\/td><td>新手期分兩階段：新手體驗（第 41～60 轉）、新手救援（第 141～160 轉）各隨機判定一次，RTP 偏低就把該轉改成設定倍數。<\/td><\/tr><tr><td>老手救援<\/td><td><strong class=\"nl nr\">C-2<\/strong><\/td><td>以天為單位刷新的保底救援：主救援 41～405 轉、延伸救援 441 轉起，觸發點後第 1～5 轉隨機判定、RTP 以 40 轉一桶統計；救援成本由每日刷新的救援池支付（每轉提撥玩家押注的 <strong class=\"nr\"><span class=\"tune\">1%<\/span><\/strong>）；參數依 NB／EB 分開設定。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>各來源遊戲的機制預算（同數學模型規範第 1.4 節）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>來源遊戲<\/th><th class=\"n\">新手 NB／EB<\/th><th class=\"n\">老手 NB／EB<\/th><th class=\"n\">BF／SF<\/th><\/tr><\/thead><tbody><tr><td>iGaming 遊戲<\/td><td class=\"n\">新手體驗 2%<\/td><td class=\"n\">老手救援 1%<\/td><td class=\"n\">0%（無機制）<\/td><\/tr><tr><td>Landbase 轉製遊戲<\/td><td class=\"n\">新手體驗 2%<\/td><td class=\"n\">0%（無老手救援）<\/td><td class=\"n\">0%（無機制）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-流程圖\">1.2 流程圖<\/h3>\n<p>新玩家第一天第 1～1,000 轉會遇到的事件（重複事件只畫一次）：<\/p>\n<div class=\"tl-wrap\"><div class=\"tl\"><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:5.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:8.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:5.60%\">新手體驗<span class=\"tl-range\">41～60 轉<\/span><\/div><\/div><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:19.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:22.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:19.60%\">新手救援<span class=\"tl-range\">141～160 轉<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s2)\"><div class=\"tl-guide\" style=\"left:32.80%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:36.70%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:40.30%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:43.90%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:47.50%;height:15px\"><\/div><div class=\"tl-band\" style=\"left:32.80%;width:15.15%\"><\/div><div class=\"tl-bar event\" style=\"left:32.80%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:36.70%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:40.30%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:43.90%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:47.50%;width:0.60%\"><\/div><di \"><\/div><div class=\"tl-bar event\" style=\"left:80.36%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:83.27%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:86.18%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:89.09%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:92.00%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:95.20%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:98.40%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:51.10%\">延伸救援<span class=\"tl-range\">441 轉起<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">轉數<\/div><div class=\"tl-track tl-axis dense\"><div class=\"tl-tick\" style=\"left:0.14%\">1<\/div><div class=\"tl-tick\" style=\"left:5.74%\">41<\/div><div class=\"tl-tick\" style=\"left:8.40%\">60<\/div><div class=\"tl-tick\" style=\"left:19.74%\">141<\/div><div class=\"tl-tick\" style=\"left:22.40%\">160<\/div><div class=\"tl-tick\" style=\"left:28.00%\">200<\/div><div class=\"tl-tick\" style=\"left:32.92%\">241<\/div><div class=\"tl-tick\" style=\"left:36.79%\">281<\/div><div class=\"tl-tick\" style=\"left:40.39%\">321<\/div><div class=\"tl-tick\" style=\"left:43.99%\">361<\/div><div class=\"tl-tick\" style=\"left:47.59%\">401<\/div><div class=\"tl-tick\" style=\"left:51.19%\">441<\/div><div class=\"tl-tick\" style=\"left:54.25%\">481<\/div><div class=\"tl-tick\" style=\"left:57.16%\">521<\/div><div class=\"tl-tick\" style=\"left:60.07%\">561<\/div><div class=\"tl-tick\" style=\"left:62.98%\">601<\/div><div class=\"tl-tick\" style=\"left:65.89%\">641<\/div><div class=\"tl-tick\" style=\"left:68.80%\">681<\/div><div class=\"tl-tick\" style=\"left:71.71%\">721<\/div><div class=\"tl-tick\" style=\"left:74.62%\">761<\/div><div class=\"tl-tick\" style=\"left:77.53%\">801<\/div><div class=\"tl-tick\" style=\"left:80.44%\">841<\/div><div class=\"tl-tick\" style=\"left:83.35%\">881<\/div><div class=\"tl-tick\" style=\"left:86.25%\">921<\/div><div class=\"tl-tick\" style=\"left:89.16%\">961<\/div><div class=\"tl-tick\" style=\"left:92.08%\">1,001<\/div><div class=\"tl-tick\" style=\"left:95.28%\">1,041<\/div><div class=\"tl-tick\" style=\"left:98.48%\">1,081<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">時期<\/div><div class=\"tl-track tl-periods\"><div class=\"tl-period\" style=\"--c:var(--s4);left:0.00%;width:28.00%\">新手期<\/div><div class=\"tl-period\" style=\"--c:var(--s1);left:28.00%;width:72.00%\">老手期<\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong class=\"nl nr\">新手期<\/strong>（暫定前 <span class=\"tune\">200<\/span> 轉）：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各隨機判定一次。<\/li><li><strong class=\"nl nr\">新手期結束後才開始老手救援<\/strong>：<ul><li>新玩家第一天：第一個判定區間是<strong class=\"nr\">第 241～245 轉<\/strong>。<\/li><li>第二天起（已是老手）：從當日<strong>第 41～45 轉<\/strong>開始。<\/li><li>第一天跳過第 201～205 轉，因為那次看的桶是第 161～200 轉，還在新手期；第 201～240 轉才是第一個整桶都在老手期的桶。<\/li><\/ul><\/li><li><strong class=\"nl nr\">主救援<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機判定，到第 401～405 轉為止。<\/li><li><strong class=\"nl nr\">延伸救援<\/strong>：第 <span class=\"tune\">440<\/span> 轉起，同樣每 40 轉一個區間；<strong class=\"nl nr\">超過 1,000 轉也照常判定<\/strong>，直到當日刷新。<\/li><li>每天在<span class=\"tune\">固定刷新時間<\/span>刷新：當日轉數、當日 RTP 與救援池餘額歸零（時區與時間見第 4 節待確認）。<\/li><li>Landbase 轉製遊戲沒有老手救援，只有新手期的兩次判定。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-新手體驗\">2. 新手體驗<\/h2>\n<h3 id=\"21-機制目標\">2.1 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">新手早期就有一次像樣的體驗<\/strong>：區間內隨機挑一轉，檢查第 1 轉到判定回合前的 RTP；偏低就把判定回合得分改成指定體驗分數。<\/li><li><strong class=\"nl nr\">新手體驗是推廣期<\/strong>：送出的 RTP 是額外多給的，不是每位玩家在每款遊戲都拿得到；原則上一位玩家<strong class=\"nr\">同一時期在平台上只體驗一次<\/strong>（同時避免套利），但新遊戲上線時仍要有新手體驗（資格見第 2.2.4 節）。<\/li><\/ul>\n<h3 id=\"22-機制介紹數值設定\">2.2 機制介紹／數值設定<\/h3>\n<h4 id=\"221-運作方式\">2.2.1 運作方式<\/h4>\n<ul><li>新手期只做新手體驗，不做老手救援；新手體驗 RTP 預算為 <strong class=\"nr\">2%<\/strong>（只有 NB／EB，BF／SF 沒有）。<\/li><li>兩階段：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各在區間內隨機挑一轉判定。<\/li><li><code class=\"nl nr\">RTP = 判定回合前累計得分 ÷ 判定回合前累計押注<\/code>（第 1 轉～判定回合前一轉）。<\/li><li>設定得分 ＝ 設定倍數 × 判定回合的 Total Bet，<strong class=\"nl\">取代<\/strong>原始得分（不是額外加上）；原始得分較高時總得分可能反而降低。<\/li><li>新手救援的 RTP 含新手體驗改寫後的結果。<\/li><\/ul>\n<h4 id=\"222-判定回合門檻倍數\">2.2.2 判定回合／門檻／倍數<\/h4>\n<p><strong class=\"nl nr\">門檻與設定倍數依遊戲調整，下表數值為範例<\/strong>；正式上線前要依該遊戲重新調整，使新手體驗增量符合 2% 預算。<\/p>\n<p><strong class=\"nl nr\">新手體驗<\/strong>：第 <span class=\"tune\">41～60<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">25%～37%<\/td><td class=\"n\">87%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>50%～&lt;70%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">10×<\/span><\/td><td class=\"n\">17%～24%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥70%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">新手救援<\/strong>：第 <span class=\"tune\">141～160<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">30×<\/span><\/td><td class=\"n\">19%～21%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>65%～&lt;85%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">9%～11%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥85%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>RTP 增量 ＝ 設定倍數 ÷ 判定轉數（判定轉隨機，所以是範圍）。<\/li><li>極限 RTP ＝ 該 RTP 區間上限 ＋ 最大 RTP 增量，即設定後 RTP 的最高可能值。<\/li><\/ul>\n<h4 id=\"223-流程圖\">2.2.3 流程圖<\/h4>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手體驗：到達判定轉<\/div><div class=\"step-desc\">第 41～60 轉內隨機一轉<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;50%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 50%～&lt;70%<\/span><span>判定回合得分改為 10×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥70%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手救援：到達判定轉<\/div><div class=\"step-desc\">第 141～160 轉內隨機一轉；RTP 已含新手體驗的結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;65%<\/span><span>判定回合得分改為 30×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 65%～&lt;85%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥85%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手期結束<\/div><div class=\"step-desc\">進入老手期，改由老手救援判定（Landbase 轉製遊戲沒有老手救援）<\/div><\/div><\/div><\/div>\n<h4 id=\"224-其他設定新手體驗資格\">2.2.4 其他設定：新手體驗資格<\/h4>\n<p>新手體驗以「<strong class=\"nl nr\">資格<\/strong>」控制，每位玩家同一時期最多用一次；只看<strong class=\"nr\">有沒有用過新手體驗<\/strong>，與該遊戲是新手期或老手期無關。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>標籤<\/th><th>定義<\/th><th>資格<\/th><\/tr><\/thead><tbody><tr><td><strong class=\"nl nr\">全新玩家<\/strong><\/td><td>還沒用過新手體驗（第一次接觸平台遊戲）<\/td><td>有資格，任何一款遊戲都可以觸發<\/td><\/tr><tr><td><strong class=\"nl nr\">舊玩家<\/strong><\/td><td>已經用過新手體驗<\/td><td>沒有資格，直到下一款新遊戲上線<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">什麼叫用過<\/strong>：任一款遊戲的<strong>新手體驗或新手救援<\/strong>判定成功、實際改成設定倍數；兩次都「不處理」不算。用掉資格後，同一款遊戲接下來的新手救援照常進行。<\/li><li><strong class=\"nl nr\">用過即變舊玩家<\/strong>：從那一轉起所有遊戲都沒有新手體驗。<\/li><li><strong class=\"nl nr\">新遊戲上線<\/strong>：上線當下已是舊玩家者重新拿到一次資格，<strong class=\"nl nr\">只能在這款新遊戲使用<\/strong>；推廣期間才變舊玩家者，這款不給。<\/li><li><strong class=\"nl nr\">資格未用又有新遊戲上線<\/strong>：只能到最新的遊戲用；用掉後等下一款新遊戲。<\/li><li>同一時間只有最新上線的一款是推廣遊戲。<\/li><\/ul>\n<p>範例（平台現有 A～E 共 5 款遊戲）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時間點<\/th><th>事件<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>全新玩家小明玩遊戲 B，兩次判定都因 RTP 偏高、不處理<\/td><td>沒用掉資格，仍是全新玩家。<\/td><\/tr><tr><td>2<\/td><td>小明改玩遊戲 C，新手救援判定成功<\/td><td>用掉資格、變舊玩家，A～E 都沒有新手體驗。<\/td><\/tr><tr><td>3<\/td><td>新遊戲 F 上線<\/td><td>小明（上線當下已是舊玩家）在 F 重新有資格；A～E 沒有。<\/td><\/tr><tr><td>4<\/td><td>全新玩家小華在 F 推廣期間，於遊戲 A 用掉資格<\/td><td>小華推廣期間才變舊玩家，F 不給。<\/td><\/tr><tr><td>5<\/td><td>小明還沒在 F 用掉資格，新遊戲 G 就上線<\/td><td>小明的資格移到 G；F 恢復一般遊戲。小華（G 上線當下已是舊玩家）在 G 也有資格。<\/td><\/tr><tr><td>6<\/td><td>小明在 G 新手體驗判定成功<\/td><td>用掉資格，直到下一款新遊戲上線。<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"3-老手救援\">3. 老手救援<\/h2>\n<p>只適用 <strong>iGaming 來源遊戲<\/strong>的老手 NB／EB；Landbase 轉製遊戲、新手、BF／SF 都沒有老手救援。<\/p>\n<pre><code>目標：老手救援 1%（自 Game RTP 移出，Total (+機制) 不變）<\/code><\/pre>\n<ul><li>上式是<strong class=\"nr\">目標值<\/strong>；實際貢獻由門檻與救援倍數決定，要依遊戲調到約 1%。<\/li><\/ul>\n<h3 id=\"31-機制目標\">3.1 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">短期體驗不好就救<\/strong>：以當日短期體驗為基準，當天就出手，不等長期統計。<\/li><li><strong class=\"nl nr\">補上缺席的大倍數體驗<\/strong>：好體驗＝當日最大單局倍數。玩得夠久卻沒碰到大倍數的玩家，在流失前當天由系統給出，演出與自然大獎無法區分。<\/li><li><strong class=\"nl nr\">400 轉後延續同一套標準<\/strong>（延伸救援）：沿用主救援最後一段的門檻與倍數，改看往前 400 轉 RTP。<\/li><\/ul>\n<h3 id=\"32-機制介紹數值設定\">3.2 機制介紹／數值設定<\/h3>\n<h4 id=\"321-運作方式\">3.2.1 運作方式<\/h4>\n<ul><li><strong class=\"nl nr\">以天為循環<\/strong>：每天在<span class=\"tune\">固定刷新時間<\/span>刷新，當日轉數、當日 RTP 與救援池餘額全部歸零。<\/li><li><strong class=\"nl nr\">40 轉一桶<\/strong>：當日第 1～40 轉為第 1 桶、第 41～80 轉為第 2 桶…；每桶記 Σ 得分、Σ 押注，保留最近 <span class=\"tune\">10<\/span> 桶滾動（第 11 桶滿時丟掉第 1 桶）。<\/li><li><strong class=\"nl nr\">主救援（當日 <span class=\"tune\">41～405<\/span> 轉）<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點 <code class=\"nr\">t<\/code>，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉（例如 41～45、81～85 轉）每人每天隨機挑一轉判定，須同時符合：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶，第 <code class=\"nr\">t−39<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><li>條件 2：當日累積 RTP 低於該觸發點門檻（第 3.2.2 節；所有完成的桶，第 1～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li><strong class=\"nl nr\">延伸救援（當日 <span class=\"tune\">441<\/span> 轉起，超過 1,000 轉照常）<\/strong>：沿用主救援第 401～405 轉那一段的設定，條件 2 改看往前 400 轉：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）<\/li><li>條件 2：往前抓 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶，第 <code class=\"nr\">t−399<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li>條件 2 在實作上都是「最近 10 桶」：第 400 轉以前不滿 10 桶，就是當日累積。例：第 202 轉判定 → 條件 1 取第 161～200 轉、條件 2 取第 1～200 轉。<\/li><li>判定只看完成的桶：判定轉與觸發點後到判定轉前的轉數（<code class=\"nl nr\">t+1<\/code>～<code class=\"nl nr\">k−1<\/code>）都在還沒滿的桶內，不納入本次判定，下次判定才算；當日不到 41 轉不判定；延伸救援沒有停判轉。<\/li><li>命中時由 Card System 在<strong>救援倍數對應的卡片區間<\/strong>重骰（例：100× 對應 (90, 100]）；該轉<strong>強制換成<\/strong>重骰結果，不跟自然得分比較高低（自然結果作廢）；<code class=\"nl nr\">救援成本 = 救援得分<\/code>，整筆從救援池扣。<\/li><li><strong class=\"nl nr\">押注檢查（防加注套利）<\/strong>：判定轉的押注超過判定用桶（最近 10 桶，不足 10 桶全拿）的平均押注，就取消該次救援，防止玩家在判定前改押大注拿大注的救援。<\/li><li>每筆救援發放前都要通過救援池檢查（第 3.2.3 節）。<\/li><li>救援得分計入當日累積 RTP，被救過的玩家通常自然脫離觸發區；判定轉隨機，玩家無法預測、也無法從畫面判斷是否為救援。<\/li><\/ul>\n<h4 id=\"322-觸發點門檻倍數\">3.2.2 觸發點／門檻／倍數<\/h4>\n<p><strong class=\"nl nr\">門檻與救援倍數依遊戲調整，下表數值為範例<\/strong>；正式上線前要依該遊戲調到救援 RTP 約 1%（實務上以「救援倍數不變、只壓門檻」為主）。<\/p>\n<p>主救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">門檻（當日累積 RTP）<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">41～45<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;25%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(20, 25]<\/span><\/td><td class=\"n\">44%～61%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">81～85<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;30%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(45, 50]<\/span><\/td><td class=\"n\">53%～62%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>第 <span class=\"tune\">121～125<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;35%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(60, 70]<\/span><\/td><td class=\"n\">48%～58%<\/td><td class=\"n\">93%<\/td><\/tr><tr><td>第 <span class=\"tune\">161～165<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;40%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(70, 80]<\/span><\/td><td class=\"n\">42%～50%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">201～205<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;45%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(80, 90]<\/span><\/td><td class=\"n\">39%～45%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">241～245<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">37%～41%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">281～285<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">32%～36%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">321～325<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">28%～31%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">361～365<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;60%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">25%～28%<\/td><td class=\"n\">88%<\/td><\/tr><tr><td>第 <span class=\"tune\">401～405<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">22%～25%<\/td><td class=\"n\">90%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>救援倍數以 Card System 卡片倍率區間表示，實際得分落在區間內。<\/li><li><strong class=\"nl nr\">EB 的救援倍數放大<\/strong>：救援得分一律以判定轉的<strong>實際押注<\/strong>計算（救援得分 = 救援倍數 × 實際押注），NB、EB 救同樣倍數，拿到的都是押注的同樣倍數。Card System 以 NB 基準成本為倍率分母，所以 EB 的救援倍數區間要乘上 EB 押注倍數。<\/li><li>RTP 增量 ＝ 救援倍數 ÷ 判定轉數，取區間下限配最晚一轉、上限配最早一轉，所以是範圍。<\/li><li>極限 RTP ＝ 門檻 ＋ 最大 RTP 增量，即救援後當日 RTP 最高可能值，全表低於 <strong class=\"nr\">100%<\/strong>。<\/li><\/ul>\n<p>延伸救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th>條件<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">441<\/span> 轉起（超過 1,000 轉照常），每 40 轉一個觸發點（觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機，即 441～445、481～485…）<\/td><td>前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）且往前 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶）<\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"323-救援池\">3.2.3 救援池<\/h4>\n<p>救援的唯一資金來源：救援機制決定誰該救、救多少；救援池決定這一筆付不付得起。<\/p>\n<pre><code>提撥額     = 該轉 Total Bet × 1%\n救援池餘額 = 當日起始餘額（暫定 0）＋ Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<ul><li><strong class=\"nl nr\">單一救援池<\/strong>：不設個人池；GC、SC 是否分池見第 4 節待確認。<\/li><li><strong class=\"nl nr\">提撥比例<\/strong>：每 spin 把該把 Total Bet 的 <span class=\"tune\">1%<\/span> 放進救援池（比例可調）。<\/li><li><strong class=\"nl nr\">每日刷新<\/strong>：每天在<span class=\"tune\">固定刷新時間<\/span>餘額歸零（與當日轉數、RTP 同時）。<\/li><li><strong class=\"nl nr\">發放前檢查<\/strong>：<strong class=\"nl nr\">每次判定成立都要先看救援池有沒有錢<\/strong>；不夠付這一筆就不救援（硬性上限，發出總額不會超過提撥總額）。多台機器同時觸發時，扣款要做成原子操作，避免超發。<\/li><li><strong class=\"nl nr\">監控指標<\/strong>：救援池餘額、每日提撥與發放、不救率、各區間觸發率與使用量、用到救援的玩家比例。<\/li><li>參數若沒先調到救援 RTP 約 1%，救援池會每天大量拒發，誰拿得到變成看誰先觸發；救援池是偶爾擋超發，不是主要的控制手段。<\/li><\/ul>\n<h4 id=\"324-流程圖\">3.2.4 流程圖<\/h4>\n<p>當日流程：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>轉數<\/th><th>階段<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1～40<\/td><td>累積期<\/td><td>不判定，只累積第 1 桶。<\/td><\/tr><tr><td>41～405<\/td><td>主救援<\/td><td>10 個區間（41～45、81～85…401～405），各區間隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且所有完成的桶（當日累積）RTP 低於該區間門檻，命中救對應卡片區間。<\/td><\/tr><tr><td>406～440<\/td><td>間隔<\/td><td>不判定。<\/td><\/tr><tr><td>441 起<\/td><td>延伸救援 · (90, 100]<\/td><td>每 40 轉一個區間（超過 1,000 轉照常，直到當日刷新），區間內隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且最近 10 桶（往前 400 轉）RTP <code class=\"nr\">&lt;65%<\/code>，命中救 (90, 100]。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>單次判定的流程：<\/p>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">主救援、延伸救援都是每 40 轉一個觸發點，在觸發點後第 1～5 轉隨機挑一轉；取出該轉的門檻與救援倍數<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">只看完成的桶：條件 1 最近 1 桶 RTP &lt;50%；條件 2 最近 10 桶 RTP（主救援＝當日累積、延伸救援＝往前 400 轉）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>具備救援資格，進入押注檢查<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本次結束，等下一個區間<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">押注檢查<\/div><div class=\"step-desc\">判定轉押注與判定用桶（最近 10 桶）的平均押注比較<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">判定轉押注 ≤ 平均押注<\/span><span>進入重骰<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">判定轉押注 &gt; 平均押注<\/span><span>取消本次救援（防加注套利）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">重骰<\/div><div class=\"step-desc\">Card System 在救援倍數的卡片區間內產生救援結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與這一筆的救援成本（＝救援得分）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放：該轉強制換成救援結果，救援池扣除救援成本<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援，該轉照自然結果（硬性上限）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">6<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">記帳<\/div><div class=\"step-desc\">救援得分計入所在的桶，影響後續判定<\/div><\/div><\/div><\/div>\n<h4 id=\"325-參數分版\">3.2.5 參數分版<\/h4>\n<p>Reskin <strong class=\"nr\">不分押注層級<\/strong>（見數學模型規範第 1.4 節），老手救援的參數只依 <strong>NB／EB<\/strong> 分開設定，每個 Config 檔 2 套。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>分層<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>條件 1 門檻（前 40 轉 RTP）<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>條件 2 的 10 段門檻<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>救援倍數（10 段卡片區間）<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>延伸救援的條件與倍數<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>提撥比例<\/td><td>NB／EB 各自設定<\/td><td>提撥進同一個救援池<\/td><\/tr><tr><td>觸發節奏（40 轉一桶、保留 10 桶、觸發點後第 1～5 轉判定）<\/td><td>共用<\/td><td>不可覆寫（統計桶跨 NB／EB 共用）<\/td><\/tr><tr><td>起判轉（41）<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><tr><td>每日刷新時間<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>oldhand_rescue\n├─ daily_reset_at        共用\n├─ cadence               共用\n└─ oldhand\n   ├─ nb\n   │  ├─ pool_rate\n   │  ├─ main → tiers[10]\n   │  └─ extended\n   └─ eb              同 nb 結構<\/code><\/pre>\n<ul><li>NB、EB 兩組都必須提供，不得缺少或互相 fallback。<\/li><li>報表要加 <code class=\"nr\">mode<\/code>（NB／EB）欄位，不可合併統計。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-待確認事項\">4. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>每日刷新時間<\/td><td>Reskin 市場的刷新時區與時間待定。<\/td><\/tr><tr><td>GC／SC 救援池<\/td><td>GC、SC 兩種幣別的救援池與統計是否分開計算；建議分開，兩幣不流用。<\/td><\/tr><tr><td>新手體驗資格<\/td><td>GC、SC 是否各自一次資格。<\/td><\/tr><tr><td>門檻與倍數<\/td><td>本頁數值為範例，每款 Reskin 遊戲都要依其自然 RTP 分布重新調整，新手體驗符合 2%、老手救援約 1%。<\/td><\/tr><tr><td>押注、EB、異常加押與演出<\/td><td>新手體驗在這些情境的做法待確認。<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-math\" hidden><div class=\"sec-head\"><h1 id=\"reskin-數學模型規範\">Reskin 數學模型規範<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁說明 <strong>Reskin 遊戲<\/strong>的數學模型：以既有遊戲數學為底，換皮輸出到 GC／SC 雙幣市場的版本。<\/p>\n<p>目前的需求來源文件（<code class=\"nl\">個人工作區/專案紀錄/<\/code> 下的 Reskin 需求資料夾）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>日期<\/th><th>內容<\/th><th>狀態<\/th><\/tr><\/thead><tbody><tr><td>押注幣別工作簿（<code class=\"nl nr\">bet_currency_*.xlsx<\/code>）<\/td><td>2026-08-13<\/td><td>工作表 <code class=\"nr\">v2<\/code>（唯一未隱藏）：44 組 Bet Multiplier、SC／GC 的 Denom 與押注金額；<code class=\"nl nr\">Sheet1<\/code>、<code class=\"nl\">v1<\/code> 為隱藏的舊草稿<\/td><td><strong class=\"nl nr\">現行版<\/strong><\/td><\/tr><tr><td><code class=\"nl nr\">Bet Option規劃.pdf<\/code><\/td><td>2026-07-30<\/td><td>Bet Multiplier 44 組、Reskin SC／GC 押注金額<\/td><td>較舊；GC 只列 16 檔<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"1-數學模型\">1. 數學模型<\/h2>\n<h3 id=\"11-必要內容\">1.1 必要內容<\/h3>\n<ul><li>數學調性：待定。<\/li><\/ul>\n<h3 id=\"12-模型命名\">1.2 模型命名<\/h3>\n<p>命名為 <code class=\"nr\">H&lt;遊戲編號&gt;1&lt;RTP&gt;&lt;Variant&gt;.xlsx<\/code>，<code class=\"nl\">&lt;RTP&gt;<\/code> 填 Reskin 版本（Total (+機制)），<strong class=\"nl nr\">不是 Game RTP<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>版本<\/th><th>RTP 模型<\/th><th>Overview 模型名稱<\/th><th>Config<\/th><\/tr><\/thead><tbody><tr><td>92 版<\/td><td><code class=\"nl nr\">H0xx192A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx192-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">config_92A.js<\/code><\/td><\/tr><tr><td>94 版<\/td><td><code class=\"nl nr\">H0xx194A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx194-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">config_94A.js<\/code><\/td><\/tr><tr><td>96 版<\/td><td><code class=\"nl nr\">H0xx196A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx196-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">config_96A.js<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>每個版本的模型檔都包含第 1.4 節的四組卡片，<strong class=\"nl nr\">同一檔內分頁存放，不拆成多個檔<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>卡片<\/th><th>工作表<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>NB／EB 老手<\/td><td><code class=\"nl nr\">Multiplier Weight<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 老手<\/td><td><code class=\"nl nr\">Multiplier Weight<\/code><\/td><td>BF／SF 區塊<\/td><\/tr><tr><td>NB／EB 新手<\/td><td><code class=\"nl nr\">Multiplier Weight (new_player)<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 新手<\/td><td><code class=\"nl nr\">Multiplier Weight (new_player)<\/code><\/td><td>BF／SF 區塊；原作若沒有（BF／SF 不分新手），轉 Reskin 時要補<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>卡片目標只看第 1.4 節表中的 Game（Landbase 轉製為 Game+Bonus）欄，依來源遊戲類型取用：<ul><li>iGaming（第 1.4.1 節），例 96 版：NB／EB 老手 Game 91%，其餘三組 Game 92%；Bonus 與 Progressive 不由卡片負責。<\/li><li>Landbase 轉製（第 1.4.2 節），例 96 版：NB／EB 新手與老手 94%、BF／SF 老手 94%、BF／SF 新手 96%。<\/li><\/ul><\/li><li>只有一套數學時只建 A，不建空白 B。<\/li><li>從原作轉來、檔名相同（如 <code class=\"nr\">H0xx192A<\/code>、<code class=\"nl nr\">H0xx194A<\/code>）時，以新版本覆蓋，原作版本保留在 <code>Versions/<\/code> 舊版資料夾。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<h4 id=\"131-押注結構\">1.3.1 押注結構<\/h4>\n<p>押注金額由三個參數相乘，不直接列舉金額：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits（所有市場固定）<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>定義<\/th><th>由誰決定<\/th><\/tr><\/thead><tbody><tr><td>最小押分<\/td><td>1 倍押注的 credit 數，固定 <code class=\"nr\">100<\/code><\/td><td>產線共用<\/td><\/tr><tr><td>Denom<\/td><td>每 credit 的幣值，依市場／幣別不同<\/td><td>市場設定（第 1.3 節）<\/td><\/tr><tr><td>Bet Multiplier<\/td><td>押注倍數選項，<code class=\"nl nr\">1<\/code>～<code class=\"nl\">1000<\/code> 共 44 組<\/td><td>產線共用（第 1.3.1 節）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3 td class=\"n\">92.00%<\/td><\/tr><tr><td>NB／EB<\/td><td>老手<\/td><td class=\"n\">90.00%<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">92.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">92.00%<\/td><\/tr><tr><td>BF／SF<\/td><td>新手<\/td><td class=\"n\">92.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">92.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">92.00%<\/td><\/tr><tr><td>BF／SF<\/td><td>老手<\/td><td class=\"n\">90.00%<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">92.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">92.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Landbase 轉製遊戲不拆 Bonus，表中 Game+Bonus 為合併值。<\/li><li>只分新手／老手，<strong class=\"nl nr\">不分押注層級<\/strong>；老手不論押注大小 Progressive（Link）皆為 2%。<\/li><li>三版的彩金一樣插在遊戲裡：老手 Progressive 皆 2%，新手皆 0%；版本差異全部由 Game RTP 吸收（老手 Game ＝ 版本 − 2%）。<\/li><li>新手不能拉彩金：NB／EB 以新手體驗 2% 補足，BF／SF 以 Game 補足（Game ＝ 版本 RTP）。<\/li><\/ul>\n<h3 id=\"15-彩金配置\">1.5 彩金配置<\/h3>\n<h4 id=\"151-link-資格\">1.5.1 Link 資格<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>級距<\/td><td>Grand、Major 兩層累積彩池<\/td><\/tr><tr><td>Link RTP<\/td><td><strong class=\"nl nr\">2%<\/strong>，92／94／96 三版相同（第 1.4 節的 Progressive）<\/td><\/tr><tr><td>資格<\/td><td>見下表；<strong class=\"nl nr\">不分押注大小<\/strong>，系統不依押注金額擋<\/td><\/tr><tr><td>幣別<\/td><td>GC、SC 是否各自一組彩池待確認（第 2 章）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>可拉 Link<\/th><th>可滾 Inrc<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>老手<\/td><td>是<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 與 BF／SF 都適用上表；新手的押注照樣滾入彩池，但不能中彩，所以新手 Progressive 為 0%。<\/li><li>彩金參數由系統層設定，數學模型不得寫死在輪帶或 Paytable；模型只負責 Game RTP，並在 <code>Game Description<\/code> 記錄採用的彩金參數版本。<\/li><\/ul>\n<h4 id=\"152-link-彩金配置\">1.5.2 Link 彩金配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>幣別<\/th><th>級距<\/th><th class=\"n\">初始金額<\/th><th class=\"n\">Startup%<\/th><th class=\"n\">Increment<\/th><th class=\"n\">RTP<\/th><\/tr><\/thead><tbody><tr><td>SC<\/td><td>Grand<\/td><td class=\"n\">100,000 SC<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>SC<\/td><td>Major<\/td><td class=\"n\">20,000 SC<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>GC<\/td><td>Grand<\/td><td class=\"n\">10,000,000 GC<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>GC<\/td><td>Major<\/td><td class=\"n\">2,000,000 GC<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">有 Link 的遊戲才依本表配置<\/strong>，沒有 Link 的遊戲不用此配置。<\/li><li>GC、SC 的彩金大小（初始金額）各自設定，見上表；Startup%、Increment、RTP 兩幣別相同。<\/li><li><strong class=\"nl nr\">賭場線上線下串連的配置不列入本表<\/strong>：若要讓某賭場的線上與線下（實體機台）彩金串在一起，線上的配置必須與該賭場線下<strong class=\"nr\">一模一樣<\/strong>；而每款遊戲在賭場的配置都不同，無法訂一套共用值。目前只有 MFB（Okada）一家賭場，所以真要串時先以 MFB 的配置為準（例：Grand <code class=\"nr\">$1,000,000<\/code>／Startup 1.10%／Increment 0.20%／RTP 1.30%；Major <code class=\"nr\">$100,000<\/code>／0.50%／0.20%／0.70%）；之後若不再有這需求就用不到，因此<strong class=\"nr\">有要串時才依該遊戲、該賭場的配置另做<\/strong>。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>初始金額<\/td><td>彩池開出後重置的起始金額（Start Up Pool）<\/td><\/tr><tr><td>Startup%<\/td><td>押注中用來補足初始金額的比例；<code class=\"nl nr\">Startup% = RTP − Increment<\/code><\/td><\/tr><tr><td>Increment<\/td><td>押注中滾入彩池、讓彩池累積上漲的比例（試算表的 Inrc）<\/td><\/tr><tr><td>RTP<\/td><td>該級距的彩金 RTP；<code class=\"nl nr\">RTP = Startup% + Increment<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Grand ＋ Major RTP ＝ Link RTP 2.00%；Increment 合計 0.85%。<\/li><li>平均開出金額：<code class=\"nl nr\">Average Jackpot Hit Value = 初始金額 ÷ Startup% × RTP<\/code>。例：SC Grand ＝ 100,000 ÷ 0.65% × 1.00% ≈ 153,846 SC。<\/li><li>試算表只給初始金額、RTP 與 Increment，Startup% 依上式推得；試算表改版時三欄一起更新。<\/li><\/ul>\n<h3 id=\"16-bet-mode\">1.6 Bet Mode<\/h3>\n<ul><li>Reskin <strong class=\"nr\">不分押注層級<\/strong>：沒有 <code class=\"nr\">&lt; $2<\/code>／<code class=\"nl nr\">&gt;= $2<\/code>（小／中／大 Bet）之分，系統也不依押注金額擋拉彩金。<\/li><li>數學模型的 Bet Mode 成本（EB 倍數、BF／SF 價格倍數）以 1 倍押注為基準定義；Reskin 不改這些倍數。<\/li><li>Simulator 依版本指定 Config，不依押注金額自動選檔。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-待確認事項\">2. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>現況<\/th><th>需決定<\/th><\/tr><\/thead><tbody><tr><td>雙幣 RTP／機制<\/td><td>未定義<\/td><td>GC 與 SC 是否共用 RTP、新手體驗、Card System Profile<\/td><\/tr><tr><td>彩金幣別<\/td><td>配置見第 1.5.2 節<\/td><td>GC、SC 是否各自一組彩池<\/td><\/tr><tr><td>系統最大賠付<\/td><td>未定義<\/td><td>各市場單把派彩上限，以及超過時截斷或重骰<\/td><\/tr><tr><td>Feature 購買上限<\/td><td><code class=\"nl\">Sheet1<\/code> 舊草稿曾標示「Super Feature 可使用最大押注」「Buy Feature 可使用押注」<\/td><td>現行版是否仍限制 BF／SF 可用的押注檔位<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', '系統機制', 'math'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data ||  drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

  // 目前讀到的小節所屬的章（第 2 層）
  var curChap = '', last2 = '';
  list.forEach(function (s) { if (s[0] === 2) last2 = s[1]; if (s[1] === cur.anchor) curChap = last2; });
  list.forEach(function (s) {
    if (s[0] === 2) {
      if (open) out += '</ul></li>';
      out += '<li>' + secLink(t, s, s[1] === curChap) + '<ul>';
      open = true;
    } else if (open) {
      out += '<li>' + secLink(t, s, s[1] === cur.anchor) + '</li>';
    }
  });
  if (open) out += '</ul></li>';
  return out.replace(/<ul><\/ul>/g, '');
}
function renderToc() {
  var m = SITES[cur.key].meta, out = '';
  var gs = m.groups || [];
  if (gs.length === 1 && gs[0][1].length === 1) {
    setToc(renderFlat(m, gs[0][1][0]));
    return;
  }
  gs.forEach(function (g) {
    var ids = g[1], active = ids.indexOf(cur.tab) >= 0;
    out += '<li><a href="#" data-tab="' + ids[0] + '"' + (active ? ' class="on"' : '') + '>' + esc(g[0]) + '</a>';
    {   // 全部展開，不折疊
      out += '<ul>';
      if (ids.length > 1) {
        ids.forEach(function (t) {
          out += '<li><a href="#" data-tab="' + t + '"' + (t === cur.tab ? ' class="on"' : '') + '>' + esc(docName(m.titles[t])) + '</a>';
          // 正在看的文件：底下展開它的章節（第 2 層），長文件也能直接跳
          if (t === cur.tab) {
            var lst = ((m.toc || {})[t] || []), ch = '', l2 = '';
            lst.forEach(function (s) { if (s[0] === 2) l2 = s[1]; if (s[1] === cur.anchor) ch = l2; });
            var secs = lst.filter(function (s) { return s[0] === 2; });
            if (secs.length) out += '<ul class="toc-secs">' + secs.map(function (s) {
              return '<li><a href="#" data-tab="' + t + '" data-anchor="' + s[1] + '"' + (s[1] === ch ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a></li>';
            }).join('') + '</ul>';
          }
          out += '</li>';
        });
      } else {
        var lst = (m.toc || {})[ids[0]] || [], ch = '', l2 = '';
        lst.forEach(function (s) { if (s[0] === 2) l2 = s[1]; if (s[1] === cur.anchor) ch = l2; });
        lst.filter(function (s) { return s[0] === 2; }).forEach(function (s) {
          out += '<li><a href="#" data-tab="' + ids[0] + '" data-anchor="' + s[1] + '"' + (active && s[1] === ch ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a></li>';
        });
      }
      out += '</ul>';
    }
    out += '</li>';
  });
  setToc(out);
}
// 沒有任何目錄項目時整個 Table of Contents 框拿掉
function setToc(h) {
  var u = document.getElementById('toc');
  u.innerHTML = h;
  u.closest('.toc').hidden = !u.querySelector('a');
}
function markNav() {
  document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.key === cur.key); });
  // 頂部頁簽：目前所在的大類亮起，按鈕上顯示目前的站名
  document.querySelectorAll('.tn').forEach(function (t) {
    var on = t.querySelector('a.on');
    t.classList.toggle('on', !!on);
    t.querySelector('.tn-cur').textContent = on ? on.textContent : '';
    t.classList.remove('open');
  });
}
function go(tab, anchor) {
  cur.tab = tab; cur.anchor = anchor || '';
  frame.contentWindow && frame.contentWindow.postMessage({ goTab: tab, goAnchor: anchor || '' }, '*');
  renderToc(); setHash();
}
function openSite(key, tab, anchor) {
  if (!SITES[key]) key = KEYS[0];
  var groups = SITES[key].meta.groups || [];
  cur = { key: key, tab: tab || (groups[0] ? groups[0][1][0] : null), anchor: anchor || '' };
  frame.onload = function () { if (cur.tab) frame.contentWindow.postMessage({ goTab: cur.tab, goAnchor: cur.anchor }, '*'); };
  var doc = document.getElementById('doc-' + key);
  if (doc) { frame.removeAttribute('src'); frame.srcdoc = JSON.parse(doc.textContent); }
  else { frame.removeAttribute('srcdoc'); frame.src = SITES[key].src; }
  markNav(); renderToc(); setHash();
}
document.querySelectorAll('.tn-btn').forEach(function (b) {
  b.addEventListener('click', function () {
    var t = b.parentNode, o = !t.classList.contains('open');
    document.querySelectorAll('.tn').forEach(function (x) { x.classList.remove('open'); });
    t.classList.toggle('open', o);
  });
});
document.addEventListener('click', function (e) { if (!e.target.closest('.tn')) document.querySelectorAll('.tn').forEach(function (x) { x.classList.remove('open'); }); });
// 同一時間只開一個選單：滑鼠移到別的頁簽時，關掉點開的那個；離開頁簽列也全部關閉
document.querySelectorAll('.tn').forEach(function (t) {
  t.addEventListener('mouseenter', function () { document.querySelectorAll('.tn').forEach(function (x) { if (x !== t) x.classList.remove('open'); }); });
});
document.querySelector('.topnav') && document.querySelector('.topnav').addEventListener('mouseleave', function () {
  document.querySelectorAll('.tn').forEach(function (x) { x.classList.remove('open'); });
});
document.querySelector('.nav') && document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  // ===== 全站搜尋：標題＋內文，Ctrl+K 聚焦，結果直接跳到該節 =====
  var idx = [];
  KEYS.forEach(function (key) {
    var el = document.getElementById('doc-' + key);
    if (!el) return;
    var dom = new DOMParser().parseFromString(JSON.parse(el.textContent), 'text/html');
    var site = SITES[key].name, titles = SITES[key].meta.titles || {};
    dom.querySelectorAll('section.panel').forEach(function (sec) {
      var tab = sec.id.replace(/^panel-/, ''), doc = titles[tab] || '';
      var cur = { key: key, tab: tab, anchor: '', title: doc, path: site + ' › ' + doc, text: '' };
      idx.push(cur);
      var walker = dom.createTreeWalker(sec, NodeFilter.SHOW_ELEMENT);
      for (var n = walker.nextNode(); n; n = walker.nextNode()) {
        if (/^H[1-4]$/.test(n.tagName) && n.id) {
          cur = { key: key, tab: tab, anchor: n.id, title: n.textContent.trim(), path: site + ' › ' + doc, text: '' };
          idx.push(cur);
        } else if (/^(P|LI|TD|TH|PRE|BLOCKQUOTE)$/.test(n.tagName)) {
          cur.text += ' ' + n.textContent.replace(/\s+/g, ' ');
        }
      }
    });
  });

  var hdr = document.querySelector('.topnav') || document.querySelector('header');
  var box = document.createElement('div');
  box.className = 'pv-search';
  box.innerHTML = '<span class="ico">⌕</span><input type="search" placeholder="搜尋所有規範…" aria-label="搜尋所有規範"><kbd>Ctrl K</kbd><div class="pv-res"></div>';
  hdr.appendChild(box);
  var input = box.querySelector('input'), res = box.querySelector('.pv-res'), hits = [], sel = 0;
  function e(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hl(s, q) { var i = s.toLowerCase().indexOf(q); return i < 0 ? e(s) : e(s.slice(0, i)) + '<mark>' + e(s.slice(i, i + q.length)) + '</mark>' + e(s.slice(i + q.length)); }
  function snip(t, q) { var i = t.toLowerCase().indexOf(q); if (i < 0) return ''; var a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + q.length + 60); }
  function search() {
    var q = input.value.trim().toLowerCase();
    if (!q) { res.classList.remove('on'); return; }
    hits = idx.map(function (r) {
      var t = r.title.toLowerCase().indexOf(q) >= 0, b = r.text.toLowerCase().indexOf(q) >= 0;
      return { r: r, s: t ? 2 : b ? 1 : 0 };
    }).filter(function (h) { return h.s; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 30);
    sel = 0;
    res.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a class="pv-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><div class="pv-path">' + e(h.r.path) + '</div><div class="pv-title">' + hl(h.r.title, q) + '</div>' +
        (h.s === 1 || snip(h.r.text, q) ? '<div class="pv-snip">' + hl(snip(h.r.text, q), q) + '</div>' : '') + '</a>';
    }).join('') : '<div class="pv-empty">找不到「' + e(input.value) + '」</div>';
    res.classList.add('on');
  }
  function pick(i) {
    var r = hits[i] && hits[i].r; if (!r) return;
    res.classList.remove('on'); input.blur();
    if (cur.key === r.key) go(r.tab, r.anchor); else openSite(r.key, r.tab, r.anchor);
  }
  input.addEventListener('input', search);
  input.addEventListener('focus', search);
  input.addEventListener('keydown', function (ev) {
    var items = res.querySelectorAll('.pv-item');
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!items.length) return;
      items[sel].classList.remove('sel'); sel = (sel + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter') { ev.preventDefault(); pick(sel); }
    else if (ev.key === 'Escape') { res.classList.remove('on'); input.blur(); }
  });
  res.addEventListener('mousedown', function (ev) { var a = ev.target.closest('.pv-item'); if (a) { ev.preventDefault(); pick(+a.dataset.i); } });
  document.addEventListener('click', function (ev) { if (!box.contains(ev.target)) res.classList.remove('on'); });
  document.addEventListener('keydown', function (ev) { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); input.focus(); input.select(); } });
})();
// 手機版：內文框高度跟著內容，整頁一起捲動；標題列高度給頁簽列的固定位置用
(function () {
  var mq = window.matchMedia('(max-width:760px)'), ro = null;
  function hh() { var h = document.querySelector('header'); document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
  function fit() {
    if (!mq.matches) { frame.style.height = ''; return; }
    try { var d = frame.contentDocument; frame.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px'; } catch (e) {}
  }
  frame.addEventListener('load', function () {
    fit();
    try { if (ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(frame.contentDocument.body); } catch (e) {}
  });
  window.addEventListener('message', function () { setTimeout(fit, 50); });
  window.addEventListener('resize', function () { hh(); fit(); });
  hh();
})();
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
