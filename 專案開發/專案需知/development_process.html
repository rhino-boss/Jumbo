<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開發流程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--surface:#f6f5f1; --panel:#ffffff; --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794; --rule:#dcdad3; --grid:#ebe9e3;
  --accent:#1b3a6b; --brand:#1b3a6b;
  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --grid:#2e2e2c; --accent:#6f97d8}}
:root[data-theme="dark"]{--surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --grid:#2e2e2c; --accent:#6f97d8}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{display:flex; flex-direction:column; background:var(--surface); color:var(--ink); font-family:var(--font-sans)}
/* 不顯示拉條，仍可上下捲動 */
aside, iframe{scrollbar-width:none; -ms-overflow-style:none}
aside::-webkit-scrollbar{display:none}
header{display:flex; align-items:center; gap:12px; padding:18px 28px 14px}
.logo{width:34px; height:34px; border-radius:8px; background:var(--brand); flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  display:grid; place-items:center}
.logo span{color:#fff; font-weight:700; font-size:17px; font-family:var(--font-sans)}
h1{margin:0 0 0 6px; font-size:22px; font-weight:500; color:var(--ink-2); letter-spacing:-.01em}
h1 b{color:var(--ink); font-weight:600}
.layout{flex:1; min-height:0; display:flex; gap:26px; padding:0 28px 22px}
aside{width:236px; flex:none; overflow-y:auto; padding:6px 2px 20px 0}
.nav{list-style:none; margin:0 0 22px; padding:0}
.nav > li{margin:0 0 6px}
.nav .top{display:block; font-size:17px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav a.top:hover{color:var(--accent)}
.nav .sub{list-style:none; margin:4px 0 0; padding:0 0 0 18px}
.nav .sub a{display:block; font-size:14px; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav .sub a:hover{color:var(--accent)}
.nav a.on, .nav span.top.on{color:var(--accent); font-weight:600}
.nav a:focus, .toc a:focus{outline:none}
.nav a:focus-visible, .toc a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.toc{border:1px solid var(--rule); border-radius:4px; padding:12px 12px 14px; background:var(--panel)}
.toc[hidden]{display:none}
.toc-title{font-size:16px; font-weight:600; margin:0 0 8px}
.toc ul{margin:0; padding-left:18px; list-style:square; color:var(--ink-3)}
.toc li{margin:0; font-size:13.5px; line-height:1.4}
.toc ul ul{padding-left:14px; margin:0; list-style:none}
.toc ul ul li{font-size:12.5px}
.toc a{display:block; padding:5px 2px; color:var(--ink-3); text-decoration:none; border-bottom:1px solid var(--grid)}
.toc a:hover{color:var(--accent)}
.toc a.on{color:var(--accent); font-weight:600}
.toc .doc{color:var(--ink-2)}
main{flex:1; min-width:0; display:flex}
iframe{flex:1; width:100%; height:100%; border:0; display:block; background:transparent}
@media (max-width:760px){
  header{padding:14px 16px 10px}
  .layout{flex-direction:column; padding:0 16px 16px; gap:14px}
  aside{width:auto; overflow:visible; padding:0}
  /* 手機：整頁一起捲動（內文框高度跟著內容），只有標題列＋頁簽列固定在上方 */
  html, body{height:auto}
  body{display:block}
  header{position:sticky; top:0; z-index:80; background:var(--surface)}
  body .topnav{position:sticky; top:var(--hh, 56px); z-index:79; background:var(--surface); margin:0; padding:0 16px; border-bottom:1px solid var(--rule)}
  .layout{display:flex; padding-top:12px}
  main{height:auto; flex:none}
  iframe{height:600px}
}
/* 頂部搜尋框 */
.pv-search{position:relative; margin-left:auto; align-self:center; flex:0 1 340px; min-width:160px; padding-bottom:2px}
.pv-search input{width:100%; box-sizing:border-box; padding:6px 12px 6px 32px; border-radius:4px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); font:inherit; font-size:14px; outline:none}
.pv-search input:focus{border-color:var(--accent); box-shadow:none}
.pv-search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; font-size:14px}
.pv-search kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:4px; padding:0 5px; background:var(--surface)}
.pv-res{position:absolute; top:calc(100% + 4px); right:0; width:min(560px,calc(100vw - 32px)); max-height:70vh; overflow:auto; z-index:70; display:none;
  background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3); padding:4px 0}
.pv-res.on{display:block}
.pv-item{display:block; padding:8px 14px; border-radius:0; cursor:pointer; color:var(--ink); text-decoration:none}
.pv-item:hover,.pv-item.sel{background:rgba(255,255,255,.05)}
.pv-path{font-size:11.5px; color:var(--ink-3)}
.pv-title{font-weight:600; font-size:14px; margin:1px 0}
.pv-snip{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv-snip mark,.pv-title mark{background:color-mix(in srgb,var(--accent) 45%,transparent); color:inherit; border-radius:2px}
.pv-empty{padding:10px; color:var(--ink-3); font-size:13px}
header{display:flex; align-items:center; flex-wrap:wrap; gap:12px}
.topnav{display:flex; gap:2px; margin:0 28px 14px; border-bottom:1px solid var(--rule)}
.tn{position:relative}
.toc-secs{margin:0; padding-left:14px; list-style:none}
.toc-secs a{font-size:12.5px}
.tn-btn{display:flex; align-items:center; gap:6px; font:inherit; font-size:14.5px; color:var(--ink-2); background:transparent;
  border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 14px 9px; margin-bottom:-1px; cursor:pointer}
.tn-btn:hover, .tn.open .tn-btn, .tn:hover .tn-btn{color:var(--ink)}
.tn.on .tn-btn{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tn-cur{display:none}
.tn-btn{white-space:nowrap; flex:none}
@media (max-width:700px){.tn-btn{padding:8px 10px 9px} .pv-search{display:none}}
.tn-arrow{font-size:10px; color:var(--ink-3)}
.tn-menu{position:absolute; top:calc(100% + 1px); left:0; min-width:180px; z-index:60; display:none; flex-direction:column;
  padding:4px 0; background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tn-menu::before{content:""; position:absolute; left:0; right:0; top:-6px; height:6px}
.tn:hover .tn-menu, .tn.open .tn-menu{display:flex}
.tn-menu a{display:block; padding:7px 16px; color:var(--ink-2); text-decoration:none; font-size:14px; white-space:nowrap}
.tn-menu a:hover{background:var(--panel-2, rgba(255,255,255,.04)); color:var(--ink)}
.tn-menu a.on{color:var(--accent); font-weight:600}
@media (min-width:900px){aside{position:sticky; top:12px; align-self:flex-start; max-height:calc(100vh - 24px)}}
</style>
</head>
<body>
<header><div class="logo"><span>J</span></div><h1><b>iGaming</b> 開發流程</h1></header>

<div class="layout">
<aside>
  <nav class="toc" aria-label="Table of Contents"><div class="toc-title">Table of Contents</div><ul id="toc"></ul></nav>
</aside>
<main><iframe id="site" title="規範內文"></iframe></main>
</div>
<script type="application/json" id="doc-flow">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>開發流程<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n:is(strong,.tune,code,a,mark).nl{margin-left:0}\n:is(strong,.tune,code,a,mark).nr{margin-right:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:760px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:78px; border-bottom:1px dashed var(--grid)}\n.tl-track.short{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-lane{padding-top:44px}\n.tl-row:has(.tl-track.short) .tl-lane{padding-top:5px}\n.tl-lane.tl-axis-name{padding-top:2px}\n.tl-band{position:absolute; top:46px; height:18px; border-radius:3px; background:color-mix(in srgb,var(--c) 16%,transparent)}\n.tl-bar.event{background:var(--c); height:14px; top:48px; border-radius:2px}\n.tl-label{position:absolute; top:2px; font-size:.95em; font-weight:600; line-height:1.25; color:var(--c); white-space:nowrap}\n.tl-range{display:block; font-family:var(--font-mono); font-size:.85em; font-weight:500; color:var(--ink-2)}\n.tl-guide{position:absolute; top:64px; border-left:1px dashed var(--c); opacity:.7; pointer-events:none}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-axis.dense{height:40px}\n.tl-axis.dense .tl-tick{font-size:.78em}\n.tl-axis.dense .tl-tick:nth-child(even){top:15px}\n.tl-axis.dense .tl-tick:nth-child(even)::before{height:20px; top:-16px}\n.tl-periods{height:30px; border-bottom:none}\n.tl-period{position:absolute; top:2px; height:24px; line-height:24px; text-align:center; font-weight:600; font-size:.95em; color:var(--c);\n  background:color-mix(in srgb,var(--c) 16%,transparent); border:1.5px solid var(--c); border-radius:3px; box-sizing:border-box}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.subs{display:flex; flex-direction:column; align-items:flex-start; gap:2px; margin-top:8px}\n.sub-arrow{color:var(--ink-3); padding-left:14px; line-height:1.2}\n.sub-row.par{border:1px dashed var(--rule); border-radius:4px; padding:6px 8px 8px}\n.par-tag{font-size:.85em; color:var(--ink-3); margin-bottom:4px}\n.par-boxes{display:flex; gap:8px; flex-wrap:wrap}\n.sub{border:1px solid var(--rule); border-radius:4px; padding:4px 10px; background:var(--panel)}\n.sub-title{font-weight:600; font-size:.95em}\n.sub-desc{color:var(--ink-2); font-size:.88em}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\n@media ( lass=\"tab\" role=\"tab\" id=\"tab-g0\" data-tab=\"flow\" data-tabs=\"flow\" aria-selected=\"true\" tabindex=\"0\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"5\" r=\"2\"/><circle cx=\"6\" cy=\"19\" r=\"2\"/><circle cx=\"18\" cy=\"12\" r=\"2\"/><path d=\"M6 7v10\"/><path d=\"M6 12h4a4 4 0 0 0 4-4V7\"/><path d=\"M16 12h-2\"/><\/svg>開發流程<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-flow\"><a class=\"toc-2\" href=\"#1-接手須知\" data-tab=\"flow\">1. 接手須知<\/a><a class=\"toc-3\" href=\"#11-閱讀順序\" data-tab=\"flow\">1.1 閱讀順序<\/a><a class=\"toc-3\" href=\"#12-環境\" data-tab=\"flow\">1.2 環境<\/a><a class=\"toc-2\" href=\"#2-規則\" data-tab=\"flow\">2. 規則<\/a><a class=\"toc-3\" href=\"#21-基本原則\" data-tab=\"flow\">2.1 基本原則<\/a><a class=\"toc-3\" href=\"#22-必問事項\" data-tab=\"flow\">2.2 必問事項<\/a><a class=\"toc-3\" href=\"#23-禁止事項\" data-tab=\"flow\">2.3 禁止事項<\/a><a class=\"toc-3\" href=\"#24-權限與對外\" data-tab=\"flow\">2.4 權限與對外<\/a><a class=\"toc-3\" href=\"#25-檔案\" data-tab=\"flow\">2.5 檔案<\/a><a class=\"toc-3\" href=\"#26-模擬\" data-tab=\"flow\">2.6 模擬<\/a><a class=\"toc-3\" href=\"#27-溝通\" data-tab=\"flow\">2.7 溝通<\/a><a class=\"toc-2\" href=\"#3-流程\" data-tab=\"flow\">3. 流程<\/a><a class=\"toc-3\" href=\"#31-階段總覽\" data-tab=\"flow\">3.1 階段總覽<\/a><a class=\"toc-3\" href=\"#32-檔案檢查\" data-tab=\"flow\">3.2 檔案檢查<\/a><a class=\"toc-2\" href=\"#4-製作\" data-tab=\"flow\">4. 製作<\/a><a class=\"toc-3\" href=\"#41-開案\" data-tab=\"flow\">4.1 開案<\/a><a class=\"toc-3\" href=\"#42-基礎模型\" data-tab=\"flow\">4.2 基礎模型<\/a><a class=\"toc-3\" href=\"#43-rtpvariant-與-card-system\" data-tab=\"flow\">4.3 RTP／Variant 與 Card System<\/a><a class=\"toc-3\" href=\"#44-config\" data-tab=\"flow\">4.4 Config<\/a><a class=\"toc-3\" href=\"#45-simulator\" data-tab=\"flow\">4.5 Simulator<\/a><a class=\"toc-3\" href=\"#46-模擬順序\" data-tab=\"flow\">4.6 模擬順序<\/a><a class=\"toc-3\" href=\"#47-調參循環\" data-tab=\"flow\">4.7 調參循環<\/a><a class=\"toc-3\" href=\"#48-對帳與交付\" data-tab=\"flow\">4.8 對帳與交付<\/a><a class=\"toc-2\" href=\"#5-交付與紀錄\" data-tab=\"flow\">5. 交付與紀錄<\/a><a class=\"toc-3\" href=\"#51-異動重跑\" data-tab=\"flow\">5.1 異動重跑<\/a><a class=\"toc-3\" href=\"#52-產出與紀錄\" data-tab=\"flow\">5.2 產出與紀錄<\/a><a class=\"toc-3\" href=\"#53-常用工具\" data-tab=\"flow\">5.3 常用工具<\/a><a class=\"toc-3\" href=\"#54-完成檢查清單\" data-tab=\"flow\">5.4 完成檢查清單<\/a><a class=\"toc-3\" href=\"#55-交接回報\" data-tab=\"flow\">5.5 交接回報<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-flow\"><div class=\"sec-head\"><h1 id=\"slot-數學開發流程\">Slot 數學開發流程<\/h1><p class=\"updated\">最後更新：2026-11-10<\/p>\n<p>本文件定義新 Slot 專案的<strong class=\"nr\">數學開發流程、製作順序、操作方式、階段產物與完成條件<\/strong>，也是接手開發者（人或 AI：Claude 或其他模型）的入口：讀完就能在這個工作區開一款新專案、照順序做到交付，並知道每一步用哪個工具、哪裡要停下來問使用者。<\/p>\n<p>實作欄位、命名、版本、Card System、Simulator、Demogame、Config 與報表格式等細節，統一依照 <code>專案需知/開發規範/<\/code> 下的各規範文件（總覽見 _README.md）。本文件不重複定義實作規格；內容有差異時，以各規範文件為準。<\/p>\n<p>適用範圍：<code class=\"nl\">Slots/H0xx_遊戲名稱/<\/code> 下的新遊戲數學模型、既有模型改版，以及 RTP、Card System、Feature 或 Bet Mode 參數調整。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-接手須知\">1. 接手須知<\/h2>\n<h3 id=\"11-閱讀順序\">1.1 閱讀順序<\/h3>\n<ol><li>依序讀完以下文件，再動手：<ol><li>本文件<\/li><li>_README.md：開發規範總覽，有文件清單與專有名詞<\/li><li>產出與紀錄規範.md：必要產出、修改紀錄格式、專案目錄<\/li><li>錯誤清單.md：過去犯過的錯，新遊戲開工前掃一遍<\/li><li>產線規範：Omniplay 看 導覽.md，Landbase、Reskin 看各自資料夾<\/li><\/ol><\/li><li>接手既有遊戲時，另外讀該遊戲的 <code class=\"nr\">個人筆記/修改紀錄.md<\/code>、<code class=\"nl nr\">個人筆記/注意事項.md<\/code>。<\/li><li>被問到「之前怎麼決定的」時，先查 工作紀錄.md；客戶與內部反饋在 <code class=\"nr\">Slots/其他/一些記錄/反饋紀錄.md<\/code>。<\/li><li>不確定的規則一律問使用者，不要從舊遊戲猜。舊專案的命名、版本與報表格式有很多是過渡期做法（見 §2.1）。<\/li><\/ol>\n<h3 id=\"12-環境\">1.2 環境<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>位置／用法<\/th><\/tr><\/thead><tbody><tr><td>工作區（git repo <code class=\"nr\">rhino-boss/Jumbo<\/code>，GitHub Pages 對外）<\/td><td><code class=\"nl nr\">C:\\Users\\rhinshen\\Mine\\個人工作區\\工作區<\/code><\/td><\/tr><tr><td>遊戲專案<\/td><td><code class=\"nl nr\">Slots/H0xx_遊戲名稱/<\/code>（目錄結構見產出與紀錄規範 §3）<\/td><\/tr><tr><td>遊戲發想<\/td><td><code class=\"nl nr\">Slots/其他/其他遊戲/遊戲發想/{遊戲名稱}/<\/code><\/td><\/tr><tr><td>克隆遊戲<\/td><td><code class=\"nl nr\">Slots/其他/其他遊戲/克隆遊戲/{英文名}/<\/code><\/td><\/tr><tr><td>遊戲代號、Game List<\/td><td><code class=\"nl nr\">Slots/其他/iGaming 遊戲代號一覽.xlsx<\/code>、<code class=\"nl nr\">Slots/其他/Game List_Online.xlsx<\/code><\/td><\/tr><tr><td>競品資料<\/td><td><code class=\"nl nr\">競品分析/<\/code>（遊戲數據報告）、<code class=\"nl nr\">市場資訊\\H5\\平台相關\\試玩平台<\/code>（Bigwinboard／Clash of Slots 爬蟲資料）<\/td><\/tr><tr><td>Demogame 共用檔<\/td><td><code class=\"nl nr\">Slots/demogame_common.js<\/code>、<code class=\"nl nr\">Slots/demogame_common.css<\/code><\/td><\/tr><tr><td>Python<\/td><td><code class=\"nl nr\">C:\\Users\\rhinshen\\AppData\\Local\\Programs\\Python\\Python313\\python.exe<\/code><\/td><\/tr><tr><td>Shell<\/td><td>Windows。PowerShell 會擋部分 <code>rm<\/code> 與 regex 指令，檔案操作改用 Python 腳本<\/td><\/tr><tr><td>模擬機<\/td><td><code class=\"nl nr\">ssh sim<\/code>（192.168.139.10，24 核、7 GB RAM、Python 3.11）。專案放 <code class=\"nr\">/root/Simulator/H0xx_名稱/<\/code><\/td><\/tr><tr><td>團隊共享區<\/td><td><code class=\"nl nr\">\\\\192.168.139.6\\Simulate\\專案需知<\/code>：Omniplay 團隊版，由 <code>_build_html.py<\/code> 自動發佈<\/td><\/tr><tr><td>送驗共享區<\/td><td><code class=\"nl nr\">\\\\192.168.139.6\\JIG_Certification\\送驗\\<\/code>：送驗規範完整版與送驗資料<\/td><\/tr><tr><td>SVN<\/td><td>外團隊規範在 <code class=\"nr\">D:\\SVN\\Slot\\IGaming\\說明書<\/code>；數學模型在 <code class=\"nr\">D:\\SVN\\Slot\\IGaming\\&lt;MathID&gt;\\<\/code>；PARsheet 在 <code class=\"nr\">D:\\SVN\\Math_Release\\IGaming\\&lt;MathID&gt;\\<\/code><\/td><\/tr><tr><td>Skill<\/td><td><code class=\"nl nr\">C:\\Users\\rhinshen\\.claude\\skills\\&lt;名稱&gt;\\SKILL.md<\/code>；非 Claude 的 AI 可直接讀 SKILL.md 當操作說明<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"2-規則\">2. 規則<\/h2>\n<h3 id=\"21-基本原則\">2.1 基本原則<\/h3>\n<p>過往專案可看到數種演進中的做法：<\/p>\n<ul><li>H013、H015、H019 使用 RTP Config、Simulator 與 Record 的基本流程。<\/li><li>H016、H028 已拆分基礎 <code>config.js<\/code> 與 RTP／Variant Config，並保留 <code class=\"nr\">Versions/<\/code>，較符合目前標準。<\/li><li>H026 同時存在 92／94 與 A／B Variant，適合作為多模型組合的參考。<\/li><li>早期專案（H013～H027）曾使用 <code class=\"nr\">xlsx_to_config.py<\/code>、<code class=\"nl\">model_sync.py<\/code> 等轉檔腳本同步 Source 與程式資料；此做法已淘汰，Excel 與 Config 之間的轉換一律由 AI 執行，專案內不建立、不維護轉檔工具。<\/li><\/ul>\n<p>新專案採用以下統一原則：<\/p>\n<ol><li><code class=\"nl\">game_rule.md<\/code> 定義玩法，數學 XLSX／<code class=\"nl\">Source/<\/code> 定義正式參數。<\/li><li>Config 必須由 Source 轉出（轉換由 AI 執行，不建立轉檔工具），不直接手改轉出的參數。<\/li><li>Simulator 與 Demogame 使用同一份 Config。<\/li><li>先驗證 Card System Off 的自然機率，再驗證 Card System On。<\/li><li>每次調參都依「Source → 版本 → Config → Simulator → Record → 對帳」完整重跑。<\/li><li>舊專案若與目前命名、版本或報表格式不同，不直接複製舊格式；依現行規格建立。<\/li><li><code class=\"nl\">game_rule.md<\/code> 是遊戲規則的正式來源，要寫明玩法、判獎順序、倍率口徑、Feature 流程與例外；數學模型、程式與 Help 都要與它一致，程式不可補猜未定義的規則。<\/li><li>同一項資料出現在多個檔案時，修改要同步更新並完成對帳。<\/li><li>未支援的 RTP、Variant、Bet Mode、Profile 或 Feature，不得出現在 Config、Simulator 批次或 Demogame 選單。<\/li><li>會影響結果分布、RTP、觸發率、最大獎或 Retry 的修改，都要更新版本並重新模擬（升版前先問使用者，見 §2.2）。<\/li><\/ol>\n<h3 id=\"22-必問事項\">2.2 必問事項<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>情況<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>跳版本號<\/td><td>所有遊戲都不得自行升版。覺得該升時先問；版本號記在 <code class=\"nr\">Source/version.txt<\/code>（只寫一行，同遊戲所有模型共用），不寫在 xlsx 裡；各碼何時升見 §5.1<\/td><\/tr><tr><td>數學模型組合<\/td><td>每款不同，開案時確認（預設 92A／92B／94A／94B，各含 Newbie／Oldhand）<\/td><\/tr><tr><td>規格參數<\/td><td>Cascade 階梯、賠率表等不得自改；要改先提出<\/td><\/tr><tr><td>Game Rule 未定義的規則<\/td><td>退回確認，程式不補猜<\/td><\/tr><tr><td>調性<\/td><td>卡片權重的調性要使用者確認才算完成<\/td><\/tr><tr><td>既有遊戲套新規則<\/td><td>新規則（例：Math Document Description 改出 DOCX 中英兩版）只套用新遊戲，舊遊戲要改先問<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"23-禁止事項\">2.3 禁止事項<\/h3>\n<ul><li>未確認 Game Rule 就自行補猜核心數學規則。<\/li><li>直接修改由 XLSX 產生的 Config 參數來避開轉檔。<\/li><li>建立或保留 Excel↔Config、Config↔Excel 的轉檔工具；轉換一律由 AI 執行。<\/li><li>Simulator、Demogame 與 Config 各維護一套參數。<\/li><li>只跑 Card System On，不保留自然機率基準。<\/li><li>只驗證 Total RTP，不驗證 RTP Breakdown、分布、Feature 與 Retry。<\/li><li>Card System Retry 時重抽目標卡、重複扣款或污染場次統計。<\/li><li>未升版就覆寫正式 XLSX、Config 或 Record。<\/li><li>建立產品未使用的空白 B Variant、Mode 或 Profile。<\/li><li>直接複製舊專案的不相容命名、版本、報表欄位或遊戲專屬統計。<\/li><li>用全零欄位表示不存在或尚未驗證的功能。<\/li><\/ul>\n<h3 id=\"24-權限與對外\">2.4 權限與對外<\/h3>\n<ul><li><strong class=\"nl nr\">模擬機<\/strong>：只碰 <code class=\"nr\">/root/Simulator<\/code>；嚴禁改 sshd、密碼、SELinux。AI 不代打任何密碼。<\/li><li><strong class=\"nl nr\">SVN<\/strong>：AI 只負責把檔案放進 SVN 工作資料夾，commit／上傳由使用者做。<\/li><li><strong class=\"nl nr\">git<\/strong>：只 commit 自己改的檔案，不要把別人進行中的修改一起帶上去。<\/li><li><strong class=\"nl nr\">產線隔離<\/strong>：Omniplay（OP）是使用者團隊負責，Landbase（LB）、Reskin（RS）是外團隊。<ul><li>三方互不知道對方的數值設定，只有使用者可以看全部。<\/li><li>三站的規範、文件、網頁互不提及、不共用。<\/li><\/ul><\/li><li><strong class=\"nl nr\">交給 SPS<\/strong>：只交 <code>config*.js<\/code> 與 <code class=\"nr\">Simulator.py<\/code>，不交 xlsx、PARsheet、json（§4.8）。<\/li><\/ul>\n<h3 id=\"25-檔案\">2.5 檔案<\/h3>\n<ul><li>不在專案資料夾留 <code>.bak<\/code> 或暫存檔。暫存放 AI 自己的暫存區，驗證完就刪。<\/li><li>用程式改數學模型 xlsx 時：<ul><li>清值要連格式一起清；寫值要從同檔同類儲存格複製樣式。<\/li><li>存檔後跑 <code class=\"nr\">專案需知/其他/_check_xlsx_style.py<\/code>，ERROR 必須為 0（見 math-model-xlsx-edit skill）。<\/li><\/ul><\/li><li>共用權重欄跨版本必須<strong class=\"nr\">逐格完全相同<\/strong>，不允許 ±1 的整數化尾差；以代表版複製到其他版。A／B 版差異範圍以外的內容也一樣（§4.3）。<\/li><li><code class=\"nl\">專案需知/<\/code> 的任何 <code>.md<\/code> 改完，同一次修改內都要跑 <code class=\"nr\">py 專案需知/其他/_build_html.py<\/code>。這支會重建網頁、發佈團隊版並同步 SVN 說明書；HTML 不得手改。<\/li><li>改 <code class=\"nr\">demogame_common.js<\/code>／<code class=\"nl\">.css<\/code> 時，必須同時升所有遊戲 <code>index.html<\/code> 引用的 <code>?v=<\/code> 版號，否則線上會吃到快取的舊檔。<\/li><\/ul>\n<h3 id=\"26-模擬\">2.6 模擬<\/h3>\n<ul><li><strong class=\"nl nr\">≥ 10⁶ 局一律到模擬機跑<\/strong>，本機只跑 ≤ 10⁵ 局的流程測試。<ul><li>Simulator 要用 <code class=\"nr\">ProcessPoolExecutor<\/code>；ThreadPool 受 GIL 限制只用到 1 核。<\/li><li>模擬機<strong class=\"nr\">一次只跑一個多程序工作<\/strong>。7 GB RAM 會爆，曾經導致整台卡死。<\/li><li>跑法：<code class=\"nl nr\">nohup bash run_xxx.sh &gt; run_xxx.log &amp;<\/code>，跑完用 <code>scp<\/code> 把 <code>Record/*.xlsx<\/code> 拉回本機。<\/li><\/ul><\/li><li>臨時、探索性的模擬只跑 10⁶ 局就回報。正式場次只用在正式文件與解權重（NB 10⁹ 局、BF 10⁸ 局）。<\/li><li>驗證規則：<ul><li>相同權重只跑一筆；BF 不跑 Newbie。<\/li><li>先跑 10⁶ 再跑正式場次。<\/li><li>結果表要有「符合」欄，判定方式見模擬程式規範 §1.2.2。<\/li><\/ul><\/li><li>調完卡片權重必查：規格上會出現的元素（例如 1000x／2500x 球），會不會因為卡片上限變成只出現、不得分。<\/li><\/ul>\n<h3 id=\"27-溝通\">2.7 溝通<\/h3>\n<ul><li>一律用<strong>繁體中文<\/strong>回覆。回覆只講重點，不要長篇表格與完整推導。<\/li><li>使用者改過的檔名以磁碟現況為準，不得改回；產生器的輸出名與所有引用都要跟進新名。<\/li><li>時間戳記一律用實際時間（<code class=\"nl nr\">Get-Date<\/code>／commit 時間），不可自編。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-流程\">3. 流程<\/h2>\n<h3 id=\"31-階段總覽\">3.1 階段總覽<\/h3>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">遊戲發想<\/div><div class=\"subs\"><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">1.1 競品分析<\/div><div class=\"sub-desc\">競品數據報告<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">1.2 提案<\/div><div class=\"sub-desc\">提案簡報<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">1.3 開案<\/div><div class=\"sub-desc\">game_rule.md、數學目標、模型組合<\/div><\/div><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">數學開發<\/div><div class=\"subs\"><div class=\"sub-row par\"><div class=\"par-tag\">同時開發<\/div><div class=\"par-boxes\"><div class=\"sub\"><div class=\"sub-title\">2.1 數學模型製作<\/div><div class=\"sub-desc\">數學模型<\/div><\/div><div class=\"sub\"><div class=\"sub-title\">2.2 模擬程式撰寫<\/div><div class=\"sub-desc\">Simulator.py<\/div><\/div><div class=\"sub\"><div class=\"sub-title\">2.3 Demogame 製作<\/div><div class=\"sub-desc\">index.html<\/div><\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">2.4 遊戲調性調整<\/div><div class=\"sub-desc\">A 版調性（NB／EB／BF／SF）<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">2.5 調性補齊<\/div><div class=\"sub-desc\">B 版、老手大／中／小押注、新老手<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">2.6 文件製作<\/div><div class=\"sub-desc\">Help、PARsheet、Game Description、Game List、腳本規格、送驗文件<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">2.7 交付前檢查<\/div><div class=\"sub-desc\">SPS、數學模型、模擬程式三方一致，玩家不會有爭議<\/div><\/div><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">遊戲上線<\/div><div class=\"subs\"><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">3.1 數據觀察<\/div><div class=\"sub-desc\">上線觀察<\/div><\/div><\/div><div class=\"sub-arrow\">↓<\/div><div class=\"sub-row\"><div class=\"sub\"><div class=\"sub-title\">3.2 Demo 報告<\/div><div class=\"sub-desc\">Demo 報告 pptx<\/div><\/div><\/div><\/div><\/div><\/div><\/div>\n<p>2.1～2.3 同時開發，三者要互相對帳（Source、Config、Simulator、Demogame 一致）才進 2.4。其餘不得因為某個程式可以先寫就跳過前置規則。上一步的條件成立、並通過 §3.2 檢查後，才進入下一步。標 <strong>停<\/strong> 的條件必須由使用者確認。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>步驟<\/th><th>主要工作<\/th><th>Skill／工具<\/th><th>產出<\/th><th>進入下一步的條件<\/th><\/tr><\/thead><tbody><tr><td><strong class=\"nl nr\">1 遊戲發想<\/strong><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>1.1 競品分析<\/td><td>整理競品的 RTP、Hit Rate、FG 週期、倍率線型等數據<\/td><td><code class=\"nl nr\">game-data-report<\/code>、<code class=\"nl nr\">multiplier-line-chart<\/code><\/td><td><code class=\"nl\">競品分析/遊戲數據_&lt;名稱&gt;.md<\/code>＋<code class=\"nr\">.html<\/code><\/td><td>—<\/td><\/tr><tr><td>1.2 提案<\/td><td>整理玩法、規格、特色與競品差異，製作提案簡報<\/td><td>pptx 照提案報告規範<\/td><td>提案簡報 <code class=\"nr\">.pptx<\/code><\/td><td><strong class=\"nl nr\">停<\/strong>：提案通過、確定開案<\/td><\/tr><tr><td>1.3 開案<\/td><td>確認 Game ID、盤面、判獎、Bet Mode、Feature、RTP 拆分、Link 資格、Hit Rate、Max Win、Profile、押注層級與 Variant；與使用者確認數學模型組合與 A／B 版差異範圍<\/td><td><code class=\"nl nr\">game-rule-generator<\/code>；GameRule規範<\/td><td>已確認的 <code class=\"nr\">game_rule.md<\/code>、數學目標表<\/td><td><strong class=\"nl nr\">停<\/strong>：核心規則、計算口徑、模型組合與 A／B 差異範圍無待確認項目<\/td><\/tr><tr><td><strong class=\"nl nr\">2 數學開發<\/strong><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>2.1 數學模型製作<\/td><td>基礎數學模型 → RTP／Variant 與 Card System 區間 → Mapping → 由 AI 轉出 Config<\/td><td><code class=\"nl nr\">math-model-xlsx-edit<\/code>、<code class=\"nl nr\">math-model-checker<\/code>；數學模型規範<\/td><td><code class=\"nl nr\">Source/*.xlsx<\/code>、<code class=\"nl nr\">version.txt<\/code>、<code class=\"nl nr\">config*.js<\/code><\/td><td>自然機率可計算、理論上限已確認；Source、Config、版本逐項一致<\/td><\/tr><tr><td>2.2 模擬程式撰寫<\/td><td>實作 Simulator；小場次 Debug 與單局驗證；Card System Off 大場次自然機率報表（模擬機，NB 10⁹ 局、BF 10⁸ 局）<\/td><td>模擬程式規範<\/td><td><code class=\"nl nr\">Simulator.py<\/code>、自然機率報表<\/td><td>固定 Seed 可重現；代表性案例符合 Game Rule；RTP Breakdown、Hit Rate、Feature 與分布合理<\/td><\/tr><tr><td>2.3 Demogame 製作<\/td><td>依 Config 製作可操作的 Demo，與 Simulator 單局對帳<\/td><td><code class=\"nl nr\">game-demo-generator<\/code>；Demogame規範<\/td><td><code class=\"nl nr\">index.html<\/code><\/td><td>Config、Simulator、Demogame 單局結果一致<\/td><\/tr><tr><td>2.4 遊戲調性調整<\/td><td>先調 A 版：依自然機率報表校準卡片權重，NB／EB／BF／SF 都要調；Card System On 驗證；數值報告對標競品與前作<\/td><td><code class=\"nl nr\">multiplier-weight-tuner<\/code>、<code class=\"nl nr\">multiplier-line-chart<\/code>、<code class=\"nl nr\">_report_card_style.py<\/code>；數值報告規範<\/td><td>A 版卡片權重與 Config、Card-On 報表、<code class=\"nl nr\">report.html<\/code>（數值報告）<\/td><td><strong class=\"nl nr\">停<\/strong>：A 版調性經使用者確認<\/td><\/tr><tr><td>2.5 調性補齊<\/td><td>依 A 版補齊 B 版、老手小／中／大押注、新手／老手各組合（§4.6 批次矩陣）；正式大場次；Max Win、Retry 與極值驗證<\/td><td><code class=\"nl nr\">multiplier-weight-tuner<\/code><\/td><td>全部組合的卡片權重、Config、Card-On 報表<\/td><td>所有組合符合目標與誤差要求<\/td><\/tr><tr><td>2.6 文件製作<\/td><td>Help、PARsheet、Game Description、Game List、腳本規格（挑 BF 腳本，§4.8）；送驗文件：Game Description（送驗版）、Math Document Description（只出英文版）<\/td><td><code class=\"nl nr\">game-help-generator<\/code>、<code class=\"nl nr\">game-description-generator<\/code>；數學文件規範、腳本規範、送驗文件規範<\/td><td><code class=\"nl\">對外文件/<\/code> 下各檔、<code class=\"nl nr\">對外文件/PARsheet/*R.xlsx<\/code>、腳本權重<\/td><td>文件內容與 Game Rule、數學模型一致<\/td><\/tr><tr><td>2.7 交付前檢查<\/td><td>交付 SPS（§4.8 打包）並讀後端報表，確認 <strong class=\"nr\">SPS、數學模型、模擬程式三方內容一致<\/strong>；檢查所有要交付的檔案內容沒有問題；確認玩家玩到時不會有爭議（見下方）<\/td><td><code class=\"nl nr\">backend-report<\/code>、<code class=\"nl nr\">math-doc-checker<\/code>、<code class=\"nl nr\">math-model-checker<\/code>、<code class=\"nl nr\">submission-organizer-ctool<\/code>；後端報表、壓測說明書<\/td><td><code class=\"nl nr\">對外文件/To SPS/&lt;GameID&gt;_&lt;版本&gt;.zip<\/code>、後端報表彙整、檢查紀錄、送驗包<\/td><td>§5.4 全部通過，版本凍結<\/td><\/tr><tr><td><strong class=\"nl nr\">3 遊戲上線<\/strong><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>3.1 數據觀察<\/td><td>依 <code>個人筆記/上線觀察.md<\/code> 觀察線上數據並回填結果；整理 Record、Versions（每個第一碼只留最新版）<\/td><td>—<\/td><td>上線觀察結果<\/td><td>—<\/td><\/tr><tr><td>3.2 Demo 報告<\/td><td>整理設計重點、跟競品不同的獨有巧思、製作困難與反饋，並用數據佐證<\/td><td>Demo報告規範<\/td><td><code class=\"nl\">demo_report_draft.md<\/code> → <code class=\"nr\">對外文件/{英文遊戲名}_Demo報告_v01.pptx<\/code><\/td><td><strong class=\"nl nr\">停<\/strong>：使用者確認<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">交付前檢查：玩家看到的結果必須跟規則一致<\/strong>。規則上看得到、玩家會以為能得分的東西，實際上就要能得分；不能出現「規則可以得分、實際沒得分」或「出現了卻永遠不會得分」的情況。過去的例子：<\/p>\n<ul><li>BF 按下後的進場盤（BG spin）出現了符合得分條件的盤面，但程式邏輯一律不得分，玩家會看到規則上該得分卻沒得分。進場盤要靠輪帶本身保證不得分。<\/li><li>宙斯過去某個版本 BG 有 2500x 球，但卡片權重沒有配到，實際得分時完全不會有 2500x 球。這也不允許（目前的 A 版是特例）。<\/li><\/ul>\n<p><strong class=\"nl nr\">過程中的紀錄<\/strong>：修改紀錄、注意事項、上線觀察，從開案到上線的每一步都要記錄（位置見 §5.2）。<\/p>\n<p>交付之後：<\/p>\n<ul><li><strong class=\"nl nr\">送驗<\/strong>：收到 Draft／Letter 時用 <code>submission-intake<\/code> 歸檔、檢查、更新狀態（串 <code class=\"nr\">inspection-report-checker<\/code>、<code class=\"nl nr\">report-file-management-ctool<\/code>、<code class=\"nl nr\">submission-status-overview<\/code>），各關卡停下來給使用者確認。<\/li><li><strong class=\"nl nr\">進測<\/strong>：PARsheet R 檔與 Source 原檔放進 SVN 對應資料夾（§1.2），由使用者自己 commit。<\/li><\/ul>\n<h3 id=\"32-檔案檢查\">3.2 檔案檢查<\/h3>\n<p><strong class=\"nl nr\">每一步結束前、每次把檔案交給其他人（SPS、PM、美術、送驗）前，都必須先做檔案確認與內容檢查<\/strong>；任一項不通過，不得進入下一步，也不得交付。<\/p>\n<ul><li><strong class=\"nl nr\">檔案確認<\/strong>：檔名、存放位置符合規範（見產出與紀錄規範第 3 節）；版本號與來源一致；是最新版，沒有舊版或暫存檔混在交付內容裡。<\/li><li><strong class=\"nl nr\">內容檢查<\/strong>：依下表對應規範的檢查清單逐項確認，並把結果記在修改紀錄或交付說明。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>步驟<\/th><th>要確認的檔案<\/th><th>內容檢查依據<\/th><\/tr><\/thead><tbody><tr><td>1.2 提案<\/td><td>提案簡報 <code class=\"nr\">.pptx<\/code><\/td><td>提案報告規範.md 5 製作與檢查<\/td><\/tr><tr><td>1.3 開案<\/td><td><code class=\"nl nr\">game_rule.md<\/code>、數學目標表<\/td><td>GameRule規範.md 3 交付檢查<\/td><\/tr><tr><td>2.1 數學模型製作<\/td><td>數學模型 <code class=\"nr\">.xlsx<\/code>、<code class=\"nl nr\">config*.js<\/code><\/td><td>數學模型規範.md；xlsx 依 math-model-xlsx-edit skill 跑 <code class=\"nr\">_check_xlsx_style.py<\/code>；Source、Config、版本逐項比對<\/td><\/tr><tr><td>2.2 模擬程式撰寫<\/td><td><code class=\"nl nr\">Simulator.py<\/code>、自然機率報表<\/td><td>模擬程式規範.md 2.5 最終交付檢查<\/td><\/tr><tr><td>2.3 Demogame 製作<\/td><td><code class=\"nl nr\">index.html<\/code>、共用 css／js<\/td><td>Demogame規範.md 7 交付檢查<\/td><\/tr><tr><td>2.4／2.5 調性<\/td><td>卡片權重、Config、Card-On 報表、數值報告<\/td><td>數學模型規範.md 2.7 合理性檢查；模擬結果符合目標（判定方式見模擬程式規範 §1.2.2）；規格會出現的元素是否都能得分（§2.6）<\/td><\/tr><tr><td>2.6 文件製作<\/td><td>Help、Game Description、Game List、PARsheet、腳本、Math Document Description<\/td><td>數學文件規範.md 1.5、2.3 交付檢查與 PARsheet 交付前檢查；腳本規範.md 6 檢查清單；送驗文件規範.md 7 送驗前檢查清單<\/td><\/tr><tr><td>2.7 交付前檢查<\/td><td>給 SPS 的 Config 與模擬程式、後端報表彙整、所有要交付的檔案<\/td><td>模擬程式規範.md 2.5 最終交付檢查；壓測說明書.md 3.5、後端報表.md 6；以上各步驟檢查全部重跑一次；§5.4 完成檢查清單<\/td><\/tr><tr><td>3.2 Demo 報告<\/td><td><code class=\"nl nr\">demo_report_draft.md<\/code>、Demo 報告 <code class=\"nr\">.pptx<\/code><\/td><td>Demo報告規範：每個設計點都有原因與數據佐證；反饋與線上數據註明來源與日期<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"4-製作\">4. 製作<\/h2>\n<h3 id=\"41-開案\">4.1 開案<\/h3>\n<ol><li>在 <code>Slots/<\/code> 建立 <code>H0xx_遊戲名稱/<\/code> 專案資料夾。<\/li><li>讀取並確認 <code class=\"nr\">game_rule.md<\/code>。<ul><li>建立 <code class=\"nr\">個人筆記/注意事項.md<\/code>：讀 錯誤清單，把本作可能再犯的列進「二、錯誤清單提醒」（格式見產出與紀錄規範第 1 節）。<\/li><\/ul><\/li><li><strong class=\"nl\">與使用者確認本專案的數學模型組合<\/strong>——每款遊戲的數學模型都不一樣，不得逕自沿用他款設定。未特別說明時，預設組合為：<ul><li>A／B 兩個 Variant × 92／94 兩個 RTP，乘開共 <strong class=\"nr\">4 個版本<\/strong>（92A、92B、94A、94B）。<\/li><li>每個版本都有 Newbie／Oldhand 兩種 Profile。<\/li><li>各版本依其支援內容有對應的押注區（Oldhand 小／中／大 Bet 層級）。<\/li><li><strong class=\"nl nr\">定義 A／B 版的差異範圍<\/strong>：寫明 A、B 差在哪些地方（新手期、老手期、哪些押注模式或押注層級）。差異範圍以外的內容 A、B 必須一模一樣；例如只設計老手期差異時，新手期的 A、B 版內容要完全相同。<\/li><\/ul><\/li><li>列出所有正式支援組合：RTP、Variant、Profile、Oldhand 小／中／大 Bet、NB／EB 或 BF／SF 模式類別、Bet Mode、Card System Off／On。<\/li><li>為每個組合定義 Link／Bonus Game／Game RTP、Total RTP、Link 資格、Hit Rate、Feature Frequency、BG／FG Max Multiplier 與其他遊戲專屬指標。<\/li><li>將未決定的判獎順序、倍率分母、Feature 上限與例外退回確認；未確認前不製作正式模型。<\/li><\/ol>\n<h3 id=\"42-基礎模型\">4.2 基礎模型<\/h3>\n<ol><li>先完成 Base Game，再依狀態順序完成 Feature。<\/li><li>建立 Symbol、Paytable、Reel Strip／Weight、Table 與 Bet Mode。<\/li><li>建立 BG、FG、Cascade、Multiplier、Retrigger、Jackpot 等流程。<\/li><li>計算 RTP Breakdown 與理論 Max Win，不只計算 Total RTP。<\/li><li>建立基礎數學 XLSX；建立 <code class=\"nr\">Source/version.txt<\/code>，初始版本見 §5.1。<\/li><\/ol>\n<h3 id=\"43-rtpvariant-與-card-system\">4.3 RTP／Variant 與 Card System<\/h3>\n<ol><li>只建立 §4.1 與使用者確認過的 92／94、A／B 組合（未特別說明時為 92A、92B、94A、94B 四版本，各含 Newbie／Oldhand 與對應押注區）。<\/li><li>A／B 表示數學 Variant，不表示 Newbie／Oldhand。只在開案定義的差異範圍內不同；範圍外（例：只設計老手期差異時的新手期）以 A 版為代表逐格複製到 B 版，不得有任何差異（同 §2.5 共用權重欄規則）。<\/li><li>依 Profile、Oldhand 小／中／大 Bet 與 Bet Mode 建立 BG／FG 卡片區間及權重；NB／EB 以實際模式押注、BF／SF 以 Feature 基礎押注選擇層級。<\/li><li>確認每張正權重卡片的區間可達，並定義 Retry 行為。<\/li><li>建立 RTP／Variant XLSX，與基礎模型共用 <code>version.txt<\/code> 的版本。<\/li><\/ol>\n<h3 id=\"44-config\">4.4 Config<\/h3>\n<ol><li>在數學模型的 <code>Game Description<\/code> 工作表記錄每項 Config 資料的來源。<\/li><li>由 AI 依 Source 與 Mapping 轉出 Config；專案內不建立、不維護 Excel↔Config 轉檔工具。<\/li><li>執行欄位、型別、陣列長度、ID、Weight、Min／Max、版本與模式驗證。<\/li><li>比較轉檔前後資料，確認 Config 可由 Source 重建且沒有非預期差異。<\/li><li>轉檔錯誤時修正 Source 或 Mapping 後重新轉出，不直接修改 Config 大型陣列。<\/li><\/ol>\n<h3 id=\"45-simulator\">4.5 Simulator<\/h3>\n<ol><li>先完成自然機率核心，再加入 Card System 篩選與 Retry。<\/li><li>讓 Simulator 直接讀取正式 Config，不另寫一份參數。<\/li><li>建立固定 Seed、單執行緒與逐局 Trace 模式。<\/li><li>建立強制／指定案例，驗證無獎、一般獎、Wild、Scatter、Feature、Retrigger、倍率與封頂。<\/li><li>小場次確認正確後，再加入 Numba、多程序（<code class=\"nl nr\">ProcessPoolExecutor<\/code>）、BATCH_RUNS 與 Excel 報表。<\/li><\/ol>\n<h3 id=\"46-模擬順序\">4.6 模擬順序<\/h3>\n<p>模擬必須依下列順序執行（≥ 10⁶ 局到模擬機跑，見 §2.6）：<\/p>\n<ol><li>小場次、Card System Off：驗證流程與報表。<\/li><li>中場次、Card System Off：確認自然機率 RTP 與分布。<\/li><li>大場次、Card System Off：以 NB 10⁹ 局（BF 為 10⁸ 局）產出自然機率正式報表。<\/li><li>卡片權重調性校準：依上一步報表分配各得分區間的卡片權重，使分布、RTP 拆分與 FG 週期符合目標遊戲調性；完成後才進入 Card System On。<\/li><li>小場次、Card System On：確認抽卡、Profile、Oldhand 押注層級、Link 資格、倍率上限、Mode 與 Retry。<\/li><li>中場次、Card System On：調整區間、權重與目標 RTP。<\/li><li>所有正式組合的大場次模擬。<\/li><li>Max Win、低機率 Feature 與 Retry 邊界的專項驗證。<\/li><\/ol>\n<p>最低批次矩陣：正式組合是「新手／老手 × A／B 版 × NB／EB／BF／SF × 老手小／中／大押注」的排列組合（BF／SF 不跑新手），每個存在的組合都要有一筆。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類型<\/th><th>RTP／Variant<\/th><th>Profile<\/th><th><code class=\"nl nr\">bet_tier_amount<\/code><\/th><th>Bet Mode<\/th><th>Card System<\/th><\/tr><\/thead><tbody><tr><td>自然機率基準<\/td><td>基礎 Config<\/td><td>不適用<\/td><td>各門檻所需代表值<\/td><td>每個支援 Mode<\/td><td>Off<\/td><\/tr><tr><td>Newbie<\/td><td>每個正式 RTP／Variant<\/td><td>Newbie<\/td><td>不分層級，但仍記錄判定金額<\/td><td>每個支援的 NB／EB（BF／SF 不跑 Newbie）<\/td><td>On<\/td><\/tr><tr><td>Oldhand 小 Bet<\/td><td>每個正式 RTP／Variant<\/td><td>Oldhand<\/td><td><code class=\"nl nr\">&lt; $2<\/code>，至少驗證 <code class=\"nr\">$1.99<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><tr><td>Oldhand 中 Bet<\/td><td>每個正式 RTP／Variant<\/td><td>Oldhand<\/td><td><code class=\"nl nr\">$2～$100<\/code>，至少驗證 <code class=\"nr\">$2<\/code>、<code class=\"nl nr\">$100<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><tr><td>Oldhand 大 Bet<\/td><td>每個正式 RTP／Variant<\/td><td>Oldhand<\/td><td><code class=\"nl nr\">&gt; $100<\/code>，至少驗證 <code class=\"nr\">$100.01<\/code><\/td><td>每個支援的 NB／EB／BF／SF<\/td><td>On<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 的 <code>bet_tier_amount<\/code> 使用實際模式押注金額；BF／SF 使用 Feature 購買價格除以 Feature Price 倍數後的基礎押注。<\/li><li>若遊戲支援 EB 2x，至少驗證 base bet <code>$1<\/code> 會以 <code>$2<\/code> 判為中 Bet。<\/li><li>若遊戲支援 BF 75x，至少驗證購買 <code>$75<\/code> 判為小 Bet、購買 <code>$150<\/code> 判為中 Bet。<\/li><\/ul>\n<p>不存在的 Mode、Profile 或 Variant 不建立空批次，也不以全零結果冒充驗證完成。<\/p>\n<h3 id=\"47-調參循環\">4.7 調參循環<\/h3>\n<p>每一次調參都執行完整循環：<\/p>\n<pre><code>確認差距與原因\n    ↓\n修改對應 Source XLSX（跑 _check_xlsx_style.py）\n    ↓\n先問使用者是否升版；要升就改 version.txt\n    ↓\n重新產生 Config，執行轉檔與資料驗證\n    ↓\n本機跑小場次確認流程\n    ↓\n到模擬機跑中／大場次確認統計\n    ↓\n保存新 Record 並與前版比較\n    ↓\n寫修改紀錄<\/code><\/pre>\n<p><strong class=\"nl nr\">只給目標時出 5 個版本<\/strong>：使用者只說明目標（例：「R3 特色出現時 Hit Rate 拉高多少」「特色多出一點」），沒指定改哪裡時，AI 自己找可調的參數，調出 <strong class=\"nr\">5 個版本<\/strong>，附指標對照表（現行版＋5 個候選，列出目標指標與會被連帶影響的指標，如 RTP、Hit Rate、FG 週期）讓使用者挑；探索階段每版只跑 10⁶ 局，挑定後才照上面的循環升版、跑正式場次。<\/p>\n<p>調參時依序判斷：<\/p>\n<ol><li>先確認程式與統計口徑是否錯誤。<\/li><li>再檢查自然機率的 Paytable、Reel、Table、Feature。<\/li><li>最後才調整 Card System 區間與權重。<\/li><li>不得只為讓 Total RTP 接近目標而忽略 RTP Breakdown、Hit Rate、Feature Frequency、分布或 Retry。<\/li><\/ol>\n<p>會改到哪些東西、要重跑什麼，查 §5.1。<\/p>\n<h3 id=\"48-對帳與交付\">4.8 對帳與交付<\/h3>\n<p>卡片權重完成後出數值報告（數值報告規範）；上線後出 Demo 報告（步驟 3.2）（Demo報告規範）。<\/p>\n<ol><li>選定可重現的代表性 RNG／Seed。<\/li><li>逐項核對 Config、Simulator 與 Demogame 的盤面、判獎、Feature、倍率、Total Win、Coin In 與 Retry。<\/li><li>完成所有正式組合的最新 Record。<\/li><li>將正式 Config 與歷史版本關係寫入 <code>Versions/<\/code> 與 manifest。<\/li><li>確認產出與紀錄規範第 1 節的必要產出文件全部齊備且為同一正式版本。<\/li><li>清除暫存檔、舊測試輸出及不屬於正式交付的檔案。<\/li><li>依 §5.4 完成最終驗收。<\/li><\/ol>\n<p><strong class=\"nl nr\">交付 SPS 打包<\/strong>（步驟 2.7 交付前檢查；2026-10-22，以 H020 超級寶石為範例）<\/p>\n<ul><li>放在 <code class=\"nr\">對外文件/To SPS/<\/code>，每次交付打成<strong class=\"nr\">一個 zip<\/strong>：<code class=\"nl nr\">&lt;GameID&gt;_&lt;RTP／Variant 四碼版本去點&gt;.zip<\/code>（例：<code class=\"nl\">101007_2220.zip<\/code>＝2.2.2.0、<code class=\"nl\">101015_6000.zip<\/code>＝6.0.0.0）。<\/li><li>zip 內只放：<code class=\"nl nr\">config.js<\/code>、該遊戲所有 <code class=\"nr\">config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code>、<code class=\"nl nr\">Simulator.py<\/code>、<code class=\"nl nr\">給SPS說明_&lt;四碼版本&gt;.txt<\/code>；不放數學模型 XLSX、PARsheet、報表、json。<\/li><li><code class=\"nl\">給SPS說明_&lt;版本&gt;.txt<\/code> 寫：與上一個交付版本的差異（基礎數學、規則／程式要後端同步的地方、卡片權重）、驗證目標與我方 Card-On 結果（判定見模擬程式規範 §1.2.2）。<\/li><li>舊版 zip 保留不刪（追溯用）；<code class=\"nl\">To SPS/<\/code> 內不留散檔，只放各版 zip。<\/li><li>驗證結果確定後才打包；打包後重新交付須換新版本號，不得覆寫已交付的 zip。<\/li><\/ul>\n<p><strong class=\"nl nr\">挑 BF 腳本：提供累積權重範圍<\/strong>（步驟 2.6 文件製作的腳本規格；2026-10-28，以 H045 超級鑽石為範例）<\/p>\n<ul><li>挑腳本階段<strong class=\"nr\">不改數學模型<\/strong>，只讀現行 <code>config_&lt;RTP&gt;&lt;Variant&gt;.js<\/code> 的 Card System。<\/li><li>主動提供<strong class=\"nr\">三個區間<\/strong>：讓 BF RTP 符合標準的平均倍數（購買價 × BF RTP 目標）所在區間，加上前一個與後一個區間（例：H045 為 50 × 92.5% ＝ 46.25x → <code class=\"nr\">(40, 45]<\/code>、<code class=\"nl nr\">(45, 50]<\/code>、<code class=\"nl nr\">(50, 60]<\/code>；2026-11-09）。用 <code>bf-script-pick<\/code> skill 產出。<\/li><li>每個區間<strong class=\"nr\">只給一個數字<\/strong>（骰 0～總權重 − 1 的累積權重值），<strong class=\"nl nr\">數字不加千分位逗號<\/strong>。<\/li><li>數字的算法：依 config 卡片順序從 0 累加，某區間的範圍＝<code class=\"nr\">[前面所有卡權重加總, 前面加總＋本格權重 − 1]<\/code>，骰到範圍內就開該區間（與 Simulator <code>pick_card<\/code> 相同）。<\/li><li>取同系列（例：A 版 92A／94A／92A_Bet100、B 版同理）各份範圍的<strong class=\"nr\">交集中點<\/strong>，一個數字各份都開同一區間、一個腳本通用；沒有交集才分模型各給一個（取各自範圍中點），並註明。<\/li><li>新手卡片若與老手相同要註明。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>系列<\/th><th><code class=\"nl nr\">(40, 45]<\/code><\/th><th><code class=\"nl nr\">(45, 50]<\/code>（目標）<\/th><th><code class=\"nl nr\">(50, 60]<\/code><\/th><\/tr><\/thead><tbody><tr><td>A 版（92A／94A／92A_Bet100）<\/td><td>627946250<\/td><td>669450070<\/td><td>728295872<\/td><\/tr><tr><td>B 版（92B／94B／92B_Bet100）<\/td><td>779293456<\/td><td>817274478<\/td><td>857941530<\/td><\/tr><\/tbody><\/table><\/div>\n<p>（H045 v7.0.1.0 老手 BF，總權重 10 億）<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"5-交付與紀錄\">5. 交付與紀錄<\/h2>\n<h3 id=\"51-異動重跑\">5.1 異動重跑<\/h3>\n<p>版本統一記在 <code class=\"nr\">Source/version.txt<\/code>（同遊戲所有模型共用一個四碼版本），詳見數學模型規範 §1.3。升某一碼時後面的碼歸零；所有升版都要先問使用者（§2.2）。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>異動<\/th><th>版本<\/th><th>必做流程<\/th><\/tr><\/thead><tbody><tr><td>調性調整：改自然機率參數（Paytable、Reel、Table、Feature、Bet Mode、判獎）<\/td><td>第 1 碼<\/td><td>改 Source → 轉全部 Config → 全部受影響批次重跑 → Demogame 對帳<\/td><\/tr><tr><td>調性調整：改倍率權重，且調性差異大<\/td><td>第 2 碼<\/td><td>改受影響 RTP／Variant XLSX → 轉 Config → Card System On 批次重跑 → 檢查占比與 Retry<\/td><\/tr><tr><td>補 SCR<\/td><td>第 3 碼<\/td><td>改受影響 RTP／Variant XLSX → 轉 Config → 重跑 SCR 相關批次<\/td><\/tr><tr><td>其他修正（含倍率權重位數錯位、只差一點點的微調；文件、說明或排版）<\/td><td>第 4 碼<\/td><td>依影響範圍重跑；不影響執行結果時，不沿用舊版號產生新正式報表<\/td><\/tr><tr><td>Simulator 數學邏輯<\/td><td>依造成的結果判斷<\/td><td>修正程式 → 固定 Seed 回歸 → 小場次 → 所有受影響正式批次 → Demogame 對帳<\/td><\/tr><tr><td>報表或顯示邏輯<\/td><td>不升版<\/td><td>驗證統計來源未變 → 核對 Console 與 Excel → 依影響範圍重產報表<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"52-產出與紀錄\">5.2 產出與紀錄<\/h3>\n<p>每個專案必須產出的文件與 <code>修改紀錄.md<\/code> 格式見產出與紀錄規範.md。紀錄寫在：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>紀錄<\/th><th>位置<\/th><th>寫什麼<\/th><\/tr><\/thead><tbody><tr><td>修改紀錄<\/td><td>各遊戲 <code class=\"nr\">個人筆記/修改紀錄.md<\/code><\/td><td>只記數學調性；依四碼版本分節，句尾附日期（產出與紀錄規範 §2）<\/td><\/tr><tr><td>注意事項<\/td><td>各遊戲 <code class=\"nr\">個人筆記/注意事項.md<\/code><\/td><td>本遊戲的特別操作與已知例外<\/td><\/tr><tr><td>上線觀察<\/td><td>各遊戲 <code class=\"nr\">個人筆記/上線觀察.md<\/code><\/td><td>上線後要觀察的項目與結果<\/td><\/tr><tr><td>錯誤清單<\/td><td><code class=\"nl nr\">專案需知/開發規範/錯誤清單.md<\/code><\/td><td>跨遊戲「做錯、後來修正」的事，新的在上<\/td><\/tr><tr><td>工作紀錄<\/td><td><code class=\"nl nr\">工作區/工作紀錄.md<\/code><\/td><td>討論與決議：日期、主題、參與人員、內容、決議、適用範圍，新的在上<\/td><\/tr><tr><td>反饋紀錄<\/td><td><code class=\"nl nr\">Slots/其他/一些記錄/反饋紀錄.md<\/code><\/td><td>客戶與內部反饋（客戶常嫌太平、高倍數太少、留存差，調性要參考）<\/td><\/tr><tr><td>基本資訊<\/td><td><code class=\"nl nr\">Slots/其他/一些記錄/基本資訊.md<\/code><\/td><td>線上轉數等基本數據指標<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"53-常用工具\">5.3 常用工具<\/h3>\n<p>放在 <code class=\"nr\">專案需知/其他/<\/code>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>工具<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">_build_html.py<\/code><\/td><td>規範 md → 網頁；同時發佈團隊版、同步 SVN 說明書<\/td><\/tr><tr><td><code class=\"nl nr\">_check_xlsx_style.py<\/code><\/td><td>數學模型 xlsx 格式檢查<\/td><\/tr><tr><td><code class=\"nl nr\">_report_card_style.py &lt;html&gt;<\/code><\/td><td>數值報告與競品報告套卡片版型；同時內嵌倍率線型的滑鼠提示<\/td><\/tr><tr><td><code class=\"nl nr\">_chart_hover.py &lt;html&gt;<\/code><\/td><td>單獨補倍率線型滑鼠提示（腳本本體是 <code class=\"nr\">chart_hover.js<\/code>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"54-完成檢查清單\">5.4 完成檢查清單<\/h3>\n<p>以下條件全部成立，數學開發才算完成：<\/p>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 的核心流程、判獎、倍率、Feature 與例外均已確認。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個正式 RTP、Variant、Profile、Oldhand 小／中／大 Bet 與 Bet Mode 都有明確目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個付費遊戲組合均驗證 Link／Bonus Game／Game RTP、Total RTP、Link 資格及 BG／FG Max Multiplier。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> BF／SF 分開驗證 Oldhand 小 Bet、中 Bet 與大 Bet（不跑 Newbie），Total RTP 符合各模型目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> A／B 版只在開案定義的差異範圍內不同，範圍外（例：新手期）逐格相同。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 基礎與 RTP／Variant XLSX 的命名正確，<code class=\"nl\">Source/version.txt<\/code> 版本正確。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 可由 Source 完整重建，Mapping 可追溯。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Source、Config、Simulator、Demogame 與 Record 使用同一正式版本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 固定 Seed 可重現相同結果。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System Off 的自然機率基準已完成，且大場次正式報表為 NB 10⁹ 局（BF 10⁸ 局）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 卡片權重已依自然機率大場次報表校準至目標遊戲調性。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card System On 的所有正式組合已完成。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> RTP、RTP Breakdown、Hit Rate、Feature Frequency 與分布符合目標。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Card 權重占比合理，Retry Limit Exceeded 為零或已有核准處理方式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Max Win、封頂及理論可達路徑已驗證。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Console 與 Record 報表內容及統計口徑一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 代表性單局已完成 Config、Simulator、Demogame 三方對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 最新正式 Record 已保存，歷史版本未被覆寫。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 產出與紀錄規範第 1 節的必要產出文件全部齊備：<code class=\"nl nr\">game_rule.md<\/code>、<code class=\"nl nr\">game_help_draft.md<\/code>／<code class=\"nl nr\">{GameID}_Help.xlsx<\/code>、<code class=\"nl nr\">game_description.md<\/code>、數學模型／PARsheet、<code class=\"nl nr\">config.js<\/code>、<code class=\"nl nr\">Simulator.py<\/code>、<code class=\"nl nr\">index.html<\/code>、<code class=\"nl\">個人筆記/數值報告.md<\/code>＋<code class=\"nr\">report.html<\/code>、<code class=\"nl nr\">個人筆記/注意事項.md<\/code>、<code class=\"nl nr\">個人筆記/上線觀察.md<\/code>、<code class=\"nl nr\">{GameID}_Game Description.docx<\/code>、<code class=\"nl nr\">{GameID}_Math Document Description_EN.docx<\/code>／<code class=\"nl nr\">_ZH.docx<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 暫存檔、快取與測試輸出未列入正式交付。<\/li><\/ul>\n<h3 id=\"55-交接回報\">5.5 交接回報<\/h3>\n<p>每段工作結束時，用以下格式回報，讓下一位接手者（人或 AI）能直接接續：<\/p>\n<ul><li><strong class=\"nl nr\">做了什麼<\/strong>：一兩句，附檔案路徑。<\/li><li><strong class=\"nl nr\">驗證結果<\/strong>：跑了什麼、場次、是否符合；沒驗證的要明說。<\/li><li><strong class=\"nl nr\">未完成與待確認<\/strong>：列出還要使用者決定的事。<\/li><li><strong class=\"nl nr\">紀錄<\/strong>：已更新哪些紀錄檔（修改紀錄、錯誤清單、工作紀錄）。<\/li><\/ul><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['flow'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>

var KEYS = ["flow"];

function renderFlat(m, t) {

    {   // 全部展開，不折疊

(function () {

  var idx = [];

  hdr.appendChild(box);

  function e(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hl(s, q) { var i = s.toLowerCase().indexOf(q); return i < 0 ? e(s) : e(s.slice(0, i)) + '<mark>' + e(s.slice(i, i + q.length)) + '</mark>' + e(s.slice(i + q.length)); }
  function snip(t, q) { var i = t.toLowerCase().indexOf(q); if (i < 0) return ''; var a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + q.length + 60); }

    }).filter(function (h) { return h.s; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 30);
    sel = 0;
    res.innerHTML = hits.length ? hits.map(function (h, i) {

        (h.s === 1 || snip(h.r.text, q) ? '<div class="pv-snip">' + hl(snip(h.r.text, q), q) + '</div>' : '') + '</a>';

  res.addEventListener('mousedown', function (ev) { var a = ev.target.closest('.pv-item'); if (a) { ev.preventDefault(); pick(+a.dataset.i); } });
  document.addEventListener('click', function (ev) { if (!box.contains(ev.target)) res.classList.remove('on'); });
  document.addEventListener('keydown', function (ev) { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); input.focus(); input.select(); } });
})();
// 手機版：內文框高度跟著內容，整頁一起捲動；標題列高度給頁簽列的固定位置用
(function () {
  var mq = window.matchMedia('(max-width:760px)'), ro = null;
  function hh() { var h = document.querySelector('header'); document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
  function fit() {
    if (!mq.matches) { frame.style.height = ''; return; }
    try { var d = frame.contentDocument; frame.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px'; } catch (e) {}
  }
  frame.addEventListener('load', function () {
    fit();
    try { if (ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(frame.contentDocument.body); } catch (e) {}
  });
  window.addEventListener('message', function () { setTimeout(fit, 50); });
  window.addEventListener('resize', function () { hh(); fit(); });
  hh();
})();
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
