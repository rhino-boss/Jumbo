=\"left:95.20%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:98.40%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:51.10%\">延伸救援<span class=\"tl-range\">441 轉起<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">轉數<\/div><div class=\"tl-track tl-axis dense\"><div class=\"tl-tick\" style=\"left:0.14%\">1<\/div><div class=\"tl-tick\" style=\"left:5.74%\">41<\/div><div class=\"tl-tick\" style=\"left:8.40%\">60<\/div><div class=\"tl-tick\" style=\"left:19.74%\">141<\/div><div class=\"tl-tick\" style=\"left:22.40%\">160<\/div><div class=\"tl-tick\" style=\"left:28.00%\">200<\/div><div class=\"tl-tick\" style=\"left:32.92%\">241<\/div><div class=\"tl-tick\" style=\"left:36.79%\">281<\/div><div class=\"tl-tick\" style=\"left:40.39%\">321<\/div><div class=\"tl-tick\" style=\"left:43.99%\">361<\/div><div class=\"tl-tick\" style=\"left:47.59%\">401<\/div><div class=\"tl-tick\" style=\"left:51.19%\">441<\/div><div class=\"tl-tick\" style=\"left:54.25%\">481<\/div><div class=\"tl-tick\" style=\"left:57.16%\">521<\/div><div class=\"tl-tick\" style=\"left:60.07%\">561<\/div><div class=\"tl-tick\" style=\"left:62.98%\">601<\/div><div class=\"tl-tick\" style=\"left:65.89%\">641<\/div><div class=\"tl-tick\" style=\"left:68.80%\">681<\/div><div class=\"tl-tick\" style=\"left:71.71%\">721<\/div><div class=\"tl-tick\" style=\"left:74.62%\">761<\/div><div class=\"tl-tick\" style=\"left:77.53%\">801<\/div><div class=\"tl-tick\" style=\"left:80.44%\">841<\/div><div class=\"tl-tick\" style=\"left:83.35%\">881<\/div><div class=\"tl-tick\" style=\"left:86.25%\">921<\/div><div class=\"tl-tick\" style=\"left:89.16%\">961<\/div><div class=\"tl-tick\" style=\"left:92.08%\">1,001<\/div><div class=\"tl-tick\" style=\"left:95.28%\">1,041<\/div><div class=\"tl-tick\" style=\"left:98.48%\">1,081<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">時期<\/div><div class=\"tl-track tl-periods\"><div class=\"tl-period\" style=\"--c:var(--s4);left:0.00%;width:28.00%\">新手期<\/div><div class=\"tl-period\" style=\"--c:var(--s1);left:28.00%;width:72.00%\">老手期<\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong class=\"nl nr\">新手期<\/strong>（暫定前 <span class=\"tune\">200<\/span> 轉）：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各隨機判定一次。<\/li><li><strong class=\"nl nr\">新手期結束後才開始老手救援<\/strong>：<ul><li>新玩家第一天：第一個判定區間是<strong class=\"nr\">第 241～245 轉<\/strong>。<\/li><li>第二天起（已是老手）：從當日<strong>第 41～45 轉<\/strong>開始。<\/li><li>第一天跳過第 201～205 轉，因為那次看的桶是第 161～200 轉，還在新手期；第 201～240 轉才是第一個整桶都在老手期的桶。<\/li><\/ul><\/li><li><strong class=\"nl nr\">主救援<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機判定，到第 401～405 轉為止。<\/li><li><strong class=\"nl nr\">延伸救援<\/strong>：第 <span class=\"tune\">440<\/span> 轉起，同樣每 40 轉一個區間；<strong class=\"nl nr\">超過 1,000 轉也照常判定<\/strong>，直到當日刷新。<\/li><li>每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 刷新：當日轉數、當日 RTP 與救援池餘額歸零。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-新手體驗\">2. 新手體驗<\/h2>\n<h3 id=\"21-機制目標\">2.1 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">新手早期就有一次像樣的體驗<\/strong>：區間內隨機挑一轉，檢查第 1 轉到判定回合前的 RTP；偏低就把判定回合得分改成指定體驗分數。<\/li><li><strong class=\"nl nr\">新手體驗是推廣期<\/strong>：送出的 RTP 是額外多給的，不是每位玩家在每款遊戲都拿得到；原則上一位玩家<strong class=\"nr\">同一時期在平台上只體驗一次<\/strong>（同時避免套利），但新遊戲上線時仍要有新手體驗（資格見第 2.2.4 節）。<\/li><\/ul>\n<h3 id=\"22-機制介紹數值設定\">2.2 機制介紹／數值設定<\/h3>\n<h4 id=\"221-運作方式\">2.2.1 運作方式<\/h4>\n<ul><li>新手期只做新手體驗，不做老手救援；新手體驗 RTP 預算為 <strong class=\"nr\">2%<\/strong>。<\/li><li>兩階段：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各在區間內隨機挑一轉判定。<\/li><li><code class=\"nl nr\">RTP = 判定回合前累計得分 ÷ 判定回合前累計押注<\/code>（第 1 轉～判定回合前一轉）。<\/li><li>設定得分 ＝ 設定倍數 × 判定回合的 Total Bet，<strong class=\"nl\">取代<\/strong>原始得分（不是額外加上）；原始得分較高時總得分可能反而降低。<\/li><li>新手救援的 RTP 含新手體驗改寫後的結果。<\/li><li>押注、Extra Bet、Buy Feature、異常加押與演出對應的做法尚待確認。<\/li><\/ul>\n<h4 id=\"222-判定回合門檻倍數\">2.2.2 判定回合／門檻／倍數<\/h4>\n<p><strong class=\"nl nr\">門檻與設定倍數依遊戲調整，下表數值為範例。<\/strong><\/p>\n<p><strong class=\"nl nr\">新手體驗<\/strong>：第 <span class=\"tune\">41～60<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">25%～37%<\/td><td class=\"n\">87%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>50%～&lt;70%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">10×<\/span><\/td><td class=\"n\">17%～24%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥70%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">新手救援<\/strong>：第 <span class=\"tune\">141～160<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">30×<\/span><\/td><td class=\"n\">19%～21%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>65%～&lt;85%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">9%～11%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥85%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>RTP 增量 ＝ 設定倍數 ÷ 判定轉數（判定轉隨機，所以是範圍）。<\/li><li>極限 RTP ＝ 該 RTP 區間上限 ＋ 最大 RTP 增量，即設定後 RTP 的最高可能值。<\/li><\/ul>\n<h4 id=\"223-流程圖\">2.2.3 流程圖<\/h4>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手體驗：到達判定轉<\/div><div class=\"step-desc\">第 41～60 轉內隨機一轉<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;50%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 50%～&lt;70%<\/span><span>判定回合得分改為 10×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥70%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手救援：到達判定轉<\/div><div class=\"step-desc\">第 141～160 轉內隨機一轉；RTP 已含新手體驗的結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;65%<\/span><span>判定回合得分改為 30×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 65%～&lt;85%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥85%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手期結束<\/div><div class=\"step-desc\">進入老手期，改由老手救援判定<\/div><\/div><\/div><\/div>\n<h4 id=\"224-其他設定新手體驗資格\">2.2.4 其他設定：新手體驗資格<\/h4>\n<p>新手體驗以「<strong class=\"nl nr\">資格<\/strong>」控制，每位玩家同一時期最多用一次；只看<strong class=\"nr\">有沒有用過新手體驗<\/strong>，與該遊戲是新手期或老手期無關。中辦、北辦的標籤與資格<strong class=\"nr\">分開計算<\/strong>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>標籤<\/th><th>定義<\/th><th>資格<\/th><\/tr><\/thead><tbody><tr><td><strong class=\"nl nr\">全新玩家<\/strong><\/td><td>還沒用過新手體驗（第一次接觸平台遊戲）<\/td><td>有資格，任何一款遊戲都可以觸發<\/td><\/tr><tr><td><strong class=\"nl nr\">舊玩家<\/strong><\/td><td>已經用過新手體驗<\/td><td>沒有資格，直到下一款新遊戲上線<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">什麼叫用過<\/strong>：任一款遊戲的<strong>新手體驗或新手救援<\/strong>判定成功、實際改成設定倍數；兩次都「不處理」不算。用掉資格後，同一款遊戲接下來的新手救援照常進行。<\/li><li><strong class=\"nl nr\">用過即變舊玩家<\/strong>：從那一轉起所有遊戲都沒有新手體驗。<\/li><li><strong class=\"nl nr\">新遊戲上線<\/strong>：上線當下已是舊玩家者重新拿到一次資格，<strong class=\"nl nr\">只能在這款新遊戲使用<\/strong>；推廣期間才變舊玩家者，這款不給。<\/li><li><strong class=\"nl nr\">資格未用又有新遊戲上線<\/strong>：只能到最新的遊戲用；用掉後等下一款新遊戲。<\/li><li>同一時間只有最新上線的一款是推廣遊戲。<\/li><\/ul>\n<p>範例（平台現有 A～E 共 5 款遊戲）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時間點<\/th><th>事件<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>全新玩家小明玩遊戲 B，兩次判定都因 RTP 偏高、不處理<\/td><td>沒用掉資格，仍是全新玩家。<\/td><\/tr><tr><td>2<\/td><td>小明改玩遊戲 C，新手救援判定成功<\/td><td>用掉資格、變舊玩家，A～E 都沒有新手體驗。<\/td><\/tr><tr><td>3<\/td><td>新遊戲 F 上線<\/td><td>小明（上線當下已是舊玩家）在 F 重新有資格；A～E 沒有。<\/td><\/tr><tr><td>4<\/td><td>全新玩家小華在 F 推廣期間，於遊戲 A 用掉資格<\/td><td>小華推廣期間才變舊玩家，F 不給。<\/td><\/tr><tr><td>5<\/td><td>小明還沒在 F 用掉資格，新遊戲 G 就上線<\/td><td>小明的資格移到 G；F 恢復一般遊戲。小華（G 上線當下已是舊玩家）在 G 也有資格。<\/td><\/tr><tr><td>6<\/td><td>小明在 G 新手體驗判定成功<\/td><td>用掉資格，直到下一款新遊戲上線。<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"23-模擬結果\">2.3 模擬結果<\/h3>\n<p>模擬（彩罐熱舞 rowdata 92% 基礎，10,000 人 × 200 轉，<code class=\"nl nr\">System/simulator/simulator_system_newbie_d.py<\/code>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>總體指標（新手期 200 轉）<\/th><th class=\"n\">彩罐熱舞<\/th><\/tr><\/thead><tbody><tr><td>RTP（沒有機制）<\/td><td class=\"n\">91.9939%<\/td><\/tr><tr><td>新手體驗增量<\/td><td class=\"n\"><strong class=\"nl nr\">+8.5774%<\/strong><\/td><\/tr><tr><td>RTP（含新手體驗）<\/td><td class=\"n\"><strong class=\"nl nr\">100.5713%<\/strong><\/td><\/tr><tr><td>用到新手體驗的玩家比例<\/td><td class=\"n\">68.22%<\/td><\/tr><tr><td>觸發率（判定成功 ÷ 總判定）<\/td><td class=\"n\">50.65%（10,130 / 20,000）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>階段<\/th><th>判定區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">觸發率<\/th><th class=\"n\">使用量<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>第 41～60 轉<\/td><td class=\"n\">15×<\/td><td class=\"n\">34.14%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手體驗<\/td><td>第 41～60 轉<\/td><td class=\"n\">10×<\/td><td class=\"n\">17.72%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手體驗小計<\/td><td><\/td><td class=\"n\"><\/td><td class=\"n\"><strong class=\"nl nr\">51.86%<\/strong><\/td><td class=\"n\"><strong class=\"nl nr\">+3.22%<\/strong><\/td><\/tr><tr><td>新手救援<\/td><td>第 141～160 轉<\/td><td class=\"n\">30×<\/td><td class=\"n\">24.99%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手救援<\/td><td>第 141～160 轉<\/td><td class=\"n\">15×<\/td><td class=\"n\">24.45%<\/td><td class=\"n\"><\/td><\/tr><tr><td>新手救援小計<\/td><td><\/td><td class=\"n\"><\/td><td class=\"n\"><strong class=\"nl nr\">49.44%<\/strong><\/td><td class=\"n\"><strong class=\"nl nr\">+5.36%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手救援區間模擬時為第 140～160 轉，之後改為第 141～160 轉；只差 1 轉，影響可忽略。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>設定倍數<\/th><th class=\"n\">占比<\/th><\/tr><\/thead><tbody><tr><td>10×<\/td><td class=\"n\">17.49%<\/td><\/tr><tr><td>15×<\/td><td class=\"n\">57.84%<\/td><\/tr><tr><td>30×<\/td><td class=\"n\">24.67%<\/td><\/tr><tr><td><strong class=\"nl nr\">合計<\/strong><\/td><td class=\"n\"><strong class=\"nl nr\">100%（10,130 次）<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">以範例數值計算，新手體驗增量 +8.58%，遠超過 2% 預算<\/strong>，新手期 200 轉總 RTP 達 100.57%；正式上線前需依遊戲重新調整門檻與設定倍數。<\/li><li>合併成「≥70% 不處理」後，少了原本 70%～&lt;100% 改成 0 分的扣回，成本因此上升。<\/li><li>判定成功中有 1.3%（新手體驗）、0.9%（新手救援）的原始得分比設定得分高，玩家反而少拿。<\/li><li>rowdata 為老手配置的 92% 基礎；新手配置基礎 RTP 若不同需另跑。<\/li><\/ul>\n<h3 id=\"24-套利檢查\">2.4 套利檢查<\/h3>\n<p>10,000 名玩家、每人一個新手期，欄位算法同第 3.5 節；超過 97% 標黃、超過 100% 標紅。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>套利手法<\/th><th>情境<\/th><th class=\"n\">平均停在<\/th><th class=\"n\">新手體驗增量<\/th><th class=\"n\">RTP（有機制）<\/th><th class=\"n\">RTP（無機制）<\/th><th class=\"n\">EV／日（bet）<\/th><\/tr><\/thead><tbody><tr><td>固定轉數閃人<\/td><td>固定玩 60 轉就閃<\/td><td class=\"n\">60 轉<\/td><td class=\"n\">+10.72%<\/td><td class=\"n\"><mark class=\"nl nr hl-danger\">103.40%<\/mark><\/td><td class=\"n\">92.68%<\/td><td class=\"n\">+2.04<\/td><\/tr><tr><td><\/td><td>固定玩 100 轉就閃<\/td><td class=\"n\">100 轉<\/td><td class=\"n\">+6.43%<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">98.32%<\/mark><\/td><td class=\"n\">91.89%<\/td><td class=\"n\">-1.68<\/td><\/tr><tr><td><\/td><td>固定玩 160 轉就閃<\/td><td class=\"n\">160 轉<\/td><td class=\"n\">+10.72%<\/td><td class=\"n\"><mark class=\"nl nr hl-danger\">102.37%<\/mark><\/td><td class=\"n\">91.65%<\/td><td class=\"n\">+3.80<\/td><\/tr><tr><td><\/td><td>固定玩 200 轉就閃<\/td><td class=\"n\">200 轉<\/td><td class=\"n\">+8.58%<\/td><td class=\"n\"><mark class=\"nl nr hl-danger\">100.57%<\/mark><\/td><td class=\"n\">91.99%<\/td><td class=\"n\">+1.14<\/td><\/tr><tr><td>拿到就閃人<\/td><td>拿到任何體驗就閃（否則玩到 200）<\/td><td class=\"n\">114 轉<\/td><td class=\"n\"><\/td><td class=\"n\"><mark class=\"nl nr hl-danger\">100.53%<\/mark><\/td><td class=\"n\">91.99%<\/td><td class=\"n\">+0.61<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>停手點：固定玩 N 轉者有／無機制都停在第 N 轉；「拿到就閃」有機制停在第一次被設定得分的那一轉（都沒有則第 200 轉），無機制停在第 200 轉。<\/li><li>以範例數值，「玩到第 60 轉就閃」與「玩到第 160 轉就閃」RTP 都超過 100%，可以穩定套利；門檻與設定倍數調整後需重驗。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-老手救援\">3. 老手救援<\/h2>\n<p>本節為<strong>中辦<\/strong>的做法；北辦另有一套（未納入本文件）。兩辦的救援池、累積數值與統計<strong class=\"nr\">全部分開計算<\/strong>。 給 SPS 的實作規格另見老手救援 C-2版。<\/p>\n<pre><code>目標：Total RTP 96% ＋ 老手救援 1% ＝ 97%<\/code><\/pre>\n<ul><li>上式是<strong class=\"nr\">目標值<\/strong>；實際貢獻由門檻與救援倍數決定，<strong class=\"nl nr\">尚未定案<\/strong>。<\/li><\/ul>\n<h3 id=\"31-前情提要\">3.1 前情提要<\/h3>\n<ul><li>好體驗只有隔天會記得，救援必須當天發生才有留存效果。<\/li><li>當日未開出 <strong>50×<\/strong> 以上大獎的老手，隔日流失率明顯上升；決定留存的是當天有沒有一次夠大的體驗，不是輸贏總額。<\/li><li>當日遊玩超過 <strong>500 轉<\/strong>的玩家，隔日留存都在 <strong>60%<\/strong> 以上，留存效益最高的救援區段在前 400 轉。<\/li><li>SPS 最小監測單位為 <strong class=\"nr\">40 轉<\/strong>，最快每 40 轉判定並救援一次。<\/li><li>SPS 的統計做法是 <strong class=\"nr\">40 轉一桶、保留最近 10 桶<\/strong>：滿 10 桶後開始累積第 11 桶，第 11 桶滿時丟掉第 1 桶，依此滾動。判定只能拿已經滿的桶，所以判定轉要放在觸發點<strong class=\"nr\">之後<\/strong>（第 <code class=\"nr\">t+1<\/code>～<code class=\"nl\">t+5<\/code> 轉），不能放在桶還沒滿的觸發點之前。<\/li><\/ul>\n<h3 id=\"32-機制目標\">3.2 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">短期體驗不好就救<\/strong>：以當日短期體驗為基準，當天就出手，不等長期統計。<\/li><li><strong class=\"nl nr\">補上缺席的大倍數體驗<\/strong>：好體驗＝當日最大單局倍數。玩得夠久卻沒碰到大倍數的玩家，在流失前當天由系統給出，演出與自然大獎無法區分。<\/li><li><strong class=\"nl nr\">400 轉後延續同一套標準<\/strong>（延伸救援）：沿用主救援最後一段的門檻與倍數，改看往前 400 轉 RTP。<\/li><\/ul>\n<h3 id=\"33-機制介紹數值設定\">3.3 機制介紹／數值設定<\/h3>\n<h4 id=\"331-運作方式\">3.3.1 運作方式<\/h4>\n<ul><li><strong class=\"nl nr\">以天為循環<\/strong>：每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 刷新，當日轉數、當日 RTP 與救援池餘額全部歸零。<\/li><li><strong class=\"nl nr\">40 轉一桶<\/strong>：當日第 1～40 轉為第 1 桶、第 41～80 轉為第 2 桶…；每桶記 Σ 得分、Σ 押注，保留最近 <span class=\"tune\">10<\/span> 桶滾動（第 11 桶滿時丟掉第 1 桶）。<\/li><li><strong class=\"nl nr\">主救援（當日 <span class=\"tune\">41～405<\/span> 轉）<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點 <code class=\"nr\">t<\/code>，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉（例如 41～45、81～85 轉）每人每天隨機挑一轉判定，須同時符合：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶，第 <code class=\"nr\">t−39<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><li>條件 2：當日累積 RTP 低於該觸發點門檻（第 3.3.2 節；所有完成的桶，第 1～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li><strong class=\"nl nr\">延伸救援（當日 <span class=\"tune\">441<\/span> 轉起，超過 1,000 轉照常）<\/strong>：沿用主救援第 401～405 轉那一段的設定，條件 2 改看往前 400 轉：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）<\/li><li>條件 2：往前抓 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶，第 <code class=\"nr\">t−399<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li>條件 2 在實作上都是「最近 10 桶」：第 400 轉以前不滿 10 桶，就是當日累積。例：第 202 轉判定 → 條件 1 取第 161～200 轉、條件 2 取第 1～200 轉。<\/li><li>判定只看完成的桶：判定轉與觸發點後到判定轉前的轉數（<code class=\"nl nr\">t+1<\/code>～<code class=\"nl nr\">k−1<\/code>）都在還沒滿的桶內，不納入本次判定，下次判定才算；當日不到 41 轉不判定；延伸救援沒有停判轉。<\/li><li>命中時由 Card System 在<strong>救援倍數對應的卡片區間<\/strong>重骰（例：100× 對應 (90, 100]）；該轉<strong>強制換成<\/strong>重骰結果，不跟自然得分比較高低（自然結果作廢）；<code class=\"nl nr\">救援成本 = 救援得分<\/code>，整筆從救援池扣。<\/li><li><strong class=\"nl nr\">押注檢查（防加注套利）<\/strong>：判定轉的押注超過判定用桶（最近 10 桶，不足 10 桶全拿）的平均押注，就取消該次救援。例：第 202 轉判定 → 跟第 1～200 轉的平均押注比。原因見第 3.5 節。<\/li><li>每筆救援發放前都要通過救援池檢查（第 3.3.3 節）。<\/li><li>救援得分計入當日累積 RTP，被救過的玩家通常自然脫離觸發區；判定轉隨機，玩家無法預測、也無法從畫面判斷是否為救援。<\/li><\/ul>\n<h4 id=\"332-觸發點門檻倍數\">3.3.2 觸發點／門檻／倍數<\/h4>\n<p>主救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">門檻（當日累積 RTP）<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">41～45<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;25%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(20, 25]<\/span><\/td><td class=\"n\">44%～61%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">81～85<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;30%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(45, 50]<\/span><\/td><td class=\"n\">53%～62%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>第 <span class=\"tune\">121～125<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;35%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(60, 70]<\/span><\/td><td class=\"n\">48%～58%<\/td><td class=\"n\">93%<\/td><\/tr><tr><td>第 <span class=\"tune\">161～165<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;40%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(70, 80]<\/span><\/td><td class=\"n\">42%～50%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">201～205<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;45%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(80, 90]<\/span><\/td><td class=\"n\">39%～45%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">241～245<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">37%～41%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">281～285<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">32%～36%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">321～325<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">28%～31%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">361～365<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;60%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">25%～28%<\/td><td class=\"n\">88%<\/td><\/tr><tr><td>第 <span class=\"tune\">401～405<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">22%～25%<\/td><td class=\"n\">90%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>救援倍數以 Card System 卡片倍率區間表示（見數學模型規範第 1.8 節），實際得分落在區間內。<\/li><li><strong class=\"nl nr\">EB 的救援倍數放大<\/strong>：救援得分一律以判定轉的<strong>實際押注<\/strong>計算（救援得分 = 救援倍數 × 實際押注），NB、EB 救同樣倍數，拿到的都是押注的同樣倍數。Card System 以 NB 基準成本為倍率分母，所以 EB 的救援倍數區間要乘上 EB 押注倍數。例：NB 押 $1、EB 押 $2（NB 的 2 倍），救 30× 時 NB 拿 $30、EB 拿 $60（卡片上是 60×）。（2026-11-05 決定）<\/li><li>RTP 增量 ＝ 救援倍數 ÷ 判定轉數，取區間下限配最晚一轉、上限配最早一轉，所以是範圍。<\/li><li>極限 RTP ＝ 門檻 ＋ 最大 RTP 增量，即救援後當日 RTP 最高可能值，全表低於 <strong class=\"nr\">100%<\/strong>（未計 <code class=\"nr\">t+1<\/code>～<code class=\"nl\">k−1<\/code> 那幾轉的自然得分，最多 4 轉）。<\/li><li>判定轉從前後 5 轉改為觸發點後 1～5 轉後，最早判定轉往後移 6 轉，最大增量下降；第 41～45 轉的極限 RTP 從 96% 降到 86%。<\/li><\/ul>\n<p>延伸救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th>條件<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">441<\/span> 轉起（超過 1,000 轉照常），每 40 轉一個觸發點（觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機，即 441～445、481～485…）<\/td><td>前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）且往前 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶）<\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"333-救援池\">3.3.3 救援池<\/h4>\n<p>救援的唯一資金來源：救援機制決定誰該救、救多少；救援池決定這一筆付不付得起。<\/p>\n<pre><code>提撥額     = 該轉 Total Bet × 1%\n救援池餘額 = 當日起始餘額（暫定 0）＋ Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<ul><li><strong class=\"nl nr\">單一救援池<\/strong>：中辦全部進同一個池，不設個人池；北辦的池分開，不流用。<\/li><li><strong class=\"nl nr\">提撥比例<\/strong>：每 spin 把該把 Total Bet 的 <span class=\"tune\">1%<\/span> 放進救援池（比例可調）。<\/li><li><strong class=\"nl nr\">每日刷新<\/strong>：每天 <strong><span class=\"tune\">台灣時間 04:00<\/span><\/strong> 餘額歸零（與當日轉數、RTP 同時）。<\/li><li><strong class=\"nl nr\">發放前檢查<\/strong>：<strong class=\"nl nr\">每次判定成立都要先看救援池有沒有錢<\/strong>；不夠付這一筆就不救援（硬性上限，發出總額不會超過提撥總額；多台機器同時觸發的超發見文末〈筆記〉）。<\/li><li><strong class=\"nl nr\">監控指標<\/strong>：救援池餘額、每日提撥與發放、不救率、各區間觸發率與使用量、用到救援的玩家比例。<\/li><\/ul>\n<h4 id=\"334-流程圖\">3.3.4 流程圖<\/h4>\n<p>當日流程：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>轉數<\/th><th>階段<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1～40<\/td><td>累積期<\/td><td>不判定，只累積第 1 桶。<\/td><\/tr><tr><td>41～405<\/td><td>主救援<\/td><td>10 個區間（41～45、81～85…401～405），各區間隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且所有完成的桶（當日累積）RTP 低於該區間門檻，命中救對應卡片區間（門檻與倍數見第 3.3.2 節主救援表）。<\/td><\/tr><tr><td>406～440<\/td><td>間隔<\/td><td>不判定。<\/td><\/tr><tr><td>441 起<\/td><td>延伸救援 · (90, 100]<\/td><td>每 40 轉一個區間（441～445、481～485…，超過 1,000 轉照常，直到當日刷新），區間內隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且最近 10 桶（往前 400 轉）RTP <code class=\"nr\">&lt;65%<\/code>，命中救 (90, 100]。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>單次判定的流程：<\/p>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">主救援、延伸救援都是每 40 轉一個觸發點，在觸發點後第 1～5 轉隨機挑一轉；取出該轉的門檻與救援倍數<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">只看完成的桶：條件 1 最近 1 桶 RTP &lt;50%；條件 2 最近 10 桶 RTP（主救援＝當日累積、延伸救援＝往前 400 轉）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>具備救援資格，進入押注檢查<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本次結束，等下一個區間<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">押注檢查<\/div><div class=\"step-desc\">判定轉押注與判定用桶（最近 10 桶）的平均押注比較<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">判定轉押注 ≤ 平均押注<\/span><span>進入重骰<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">判定轉押注 &gt; 平均押注<\/span><span>取消本次救援（防加注套利）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">重骰<\/div><div class=\"step-desc\">Card System 在救援倍數的卡片區間內產生救援結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與這一筆的救援成本（＝救援得分）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放：該轉強制換成救援結果，救援池扣除救援成本<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援，該轉照自然結果（硬性上限）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">6<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">記帳<\/div><div class=\"step-desc\">救援得分計入所在的桶，影響後續判定<\/div><\/div><\/div><\/div>\n<h4 id=\"335-參數分版分層\">3.3.5 參數分版分層<\/h4>\n<p>老手救援的參數依 <strong>NB／EB × 小／中／大 Bet<\/strong> 分開設定，每個 Config 檔 6 套；押注層級的判定沿用<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.7.1 節（<code class=\"nl nr\">&lt; $2<\/code>、<code class=\"nl nr\">$2～$100<\/code>、<code class=\"nl nr\">&gt; $100<\/code>）。<\/p>\n<ul><li><strong class=\"nl nr\">為什麼要分<\/strong>：NB／EB 與三個押注層級使用不同 Config 家族，自然 RTP 分布不同，同一組門檻的命中率與成本也不同；只用一套參數，等於 6 種情境共用一套只為其中一種調出來的數值。<\/li><li><strong class=\"nl nr\">適用範圍<\/strong>：只有 Oldhand 的 NB／EB；Newbie 不吃老手救援，BF／SF 沒有救援，都不用設定。<\/li><li><strong class=\"nl nr\">A／B 版已經靠檔案分開<\/strong>（<code class=\"nl nr\">config_92A.js<\/code>／<code class=\"nl nr\">config_92B.js<\/code>），不在這次需求內；要新增的是檔案內的 <strong>NB／EB × 押注層級<\/strong>維度。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>分層<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>條件 1 門檻（前 40 轉 RTP）<\/td><td><strong class=\"nl nr\">必須分<\/strong><\/td><td>6 組各自設定<\/td><\/tr><tr><td>條件 2 的 10 段門檻<\/td><td><strong class=\"nl nr\">必須分<\/strong><\/td><td>6 組各自設定<\/td><\/tr><tr><td>救援倍數（10 段卡片區間）<\/td><td><strong class=\"nl nr\">必須分<\/strong><\/td><td>6 組各自設定<\/td><\/tr><tr><td>延伸救援的條件與倍數<\/td><td><strong class=\"nl nr\">必須分<\/strong><\/td><td>6 組各自設定<\/td><\/tr><tr><td>提撥比例<\/td><td><strong class=\"nl nr\">必須分<\/strong><\/td><td>6 組各自設定，提撥進同一個救援池<\/td><\/tr><tr><td>觸發節奏（40 轉一桶、保留 10 桶、觸發點後第 1～5 轉判定）<\/td><td>共用<\/td><td>不可覆寫（統計桶跨 NB／EB、跨押注共用）<\/td><\/tr><tr><td>起判轉（41）<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><tr><td>每日刷新時間（台灣時間 04:00）<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Config 結構（沿用 Card System <code>oldhand → small_bet／medium_bet／big_bet<\/code> 的寫法）：<\/p>\n<pre><code>oldhand_rescue\n├─ daily_reset_at        共用\n├─ cadence               共用\n└─ oldhand\n   ├─ nb\n   │  ├─ small_bet\n   │  │  ├─ pool_rate\n   │  │  ├─ main → tiers[10]\n   │  │  └─ extended\n   │  ├─ medium_bet   同結構\n   │  └─ big_bet      同結構\n   └─ eb              同 nb 結構<\/code><\/pre>\n<ul><li>沿用 Card System 既有規則：<strong class=\"nl nr\">6 組都必須提供，不得缺少或互相 fallback<\/strong>。<\/li><li>驗證範圍：每個 Config 檔 6 組（A／B 兩檔共 12 組）；報表要加 <code class=\"nr\">mode<\/code>（NB／EB）與 <code>bet_tier<\/code> 欄位，不可合併統計。<\/li><li>待決：切換模式的套利防堵（第 3.5 節：共用一套參數，或分開參數＋防法 B）。<\/li><\/ul>\n<h3 id=\"34-模擬結果\">3.4 模擬結果<\/h3>\n<p>2026-11-05 依現行規則重跑：40 轉一桶、觸發點後第 1～5 轉判定、命中就強制換成救援結果、押注檢查；救援倍數以卡片區間上限計（保守估計）。自然結果取彩罐熱舞 rowdata（92% 基礎，每轉獨立）重新抽樣；每次模擬最多 100 萬轉，在模擬機執行（<code class=\"nl nr\">System/simulator/simulator_system_oldhand_c2_bucket.py<\/code>，結果在 <code class=\"nr\">System/simulator/record/bucket_*.json<\/code>）。人數較少，各區間的數字有 ±1% 上下的抽樣誤差，看趨勢為主。<\/p>\n<p><strong class=\"nl nr\">主救援<\/strong>（2,400 人 × 405 轉，不套救援池）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>總體指標<\/th><th class=\"n\">老手（每天從第 41 轉判定）<\/th><th class=\"n\">新玩家第一天（從第 241 轉判定）<\/th><\/tr><\/thead><tbody><tr><td>RTP（沒有機制）<\/td><td class=\"n\">92.06%<\/td><td class=\"n\">92.06%<\/td><\/tr><tr><td>主救援增量<\/td><td class=\"n\"><strong class=\"nl nr\">+4.92%<\/strong><\/td><td class=\"n\">+4.11%<\/td><\/tr><tr><td>RTP（含主救援）<\/td><td class=\"n\">96.98%<\/td><td class=\"n\">96.17%<\/td><\/tr><tr><td>用到主救援的玩家比例<\/td><td class=\"n\">28.21%<\/td><td class=\"n\">16.63%<\/td><\/tr><tr><td>觸發率（救援次數 ÷ 判定次數）<\/td><td class=\"n\">3.03%（728 / 24,000）<\/td><td class=\"n\">3.35%（402 / 12,000）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>判定區間<\/th><th class=\"n\">救援倍數<\/th><th class=\"n\">觸發率<\/th><th class=\"n\">使用量<\/th><th class=\"n\">新玩家第一天觸發率<\/th><\/tr><\/thead><tbody><tr><td>第 41～45 轉<\/td><td class=\"n\">(20, 25]<\/td><td class=\"n\">10.42%<\/td><td class=\"n\">+0.62%<\/td><td class=\"n\">—<\/td><\/tr><tr><td>第 81～85 轉<\/td><td class=\"n\">(45, 50]<\/td><td class=\"n\">2.63%<\/td><td class=\"n\">+0.32%<\/td><td class=\"n\">—<\/td><\/tr><tr><td>第 121～125 轉<\/td><td class=\"n\">(60, 70]<\/td><td class=\"n\">1.79%<\/td><td class=\"n\">+0.31%<\/td><td class=\"n\">—<\/td><\/tr><tr><td>第 161～165 轉<\/td><td class=\"n\">(70, 80]<\/td><td class=\"n\">1.58%<\/td><td class=\"n\">+0.30%<\/td><td class=\"n\">—<\/td><\/tr><tr><td>第 201～205 轉<\/td><td class=\"n\">(80, 90]<\/td><td class=\"n\">1.67%<\/td><td class=\"n\">+0.37%<\/td><td class=\"n\">—<\/td><\/tr><tr><td>第 241～245 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">2.13%<\/td><td class=\"n\">+0.52%<\/td><td class=\"n\">4.42%<\/td><\/tr><tr><td>第 281～285 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">3.04%<\/td><td class=\"n\">+0.75%<\/td><td class=\"n\">4.08%<\/td><\/tr><tr><td>第 321～325 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">1.38%<\/td><td class=\"n\">+0.34%<\/td><td class=\"n\">2.00%<\/td><\/tr><tr><td>第 361～365 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">2.67%<\/td><td class=\"n\">+0.65%<\/td><td class=\"n\">3.29%<\/td><\/tr><tr><td>第 401～405 轉<\/td><td class=\"n\">(90, 100]<\/td><td class=\"n\">3.04%<\/td><td class=\"n\">+0.74%<\/td><td class=\"n\">2.96%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>使用量 ＝ 該區間救援增量 ÷ 405 轉總 在 1,000 轉的差異就是抽樣誤差。<\/li><li>延伸救援不設停判轉後，增量穩定在約 +7%，不會因為玩得越久而越高；全日總 RTP 約 98%～98.6%，沒有超過 100%。<\/li><\/ul>\n<p><strong class=\"nl nr\">救援池 1%<\/strong>（每天所有玩家同步轉動、04:00 歸零、起始餘額 0；主救援＋延伸救援；救援成本＝整筆救援得分）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">當日轉數<\/th><th class=\"n\">人數<\/th><th class=\"n\">無機制 RTP<\/th><th class=\"n\">不設上限增量<\/th><th class=\"n\">實際發放增量<\/th><th class=\"n\">實際總 RTP<\/th><th class=\"n\">不救率<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">405 轉<\/td><td class=\"n\">2,400<\/td><td class=\"n\">92.06%<\/td><td class=\"n\">+4.94%<\/td><td class=\"n\">+0.98%<\/td><td class=\"n\">93.04%<\/td><td class=\"n\"><strong class=\"nl nr\">87.79%<\/strong><\/td><\/tr><tr><td class=\"n\">800 轉<\/td><td class=\"n\">1,250<\/td><td class=\"n\">91.31%<\/td><td class=\"n\">+5.89%<\/td><td class=\"n\">+0.95%<\/td><td class=\"n\">92.26%<\/td><td class=\"n\"><strong class=\"nl nr\">92.21%<\/strong><\/td><\/tr><tr><td class=\"n\">1,000 轉<\/td><td class=\"n\">1,000<\/td><td class=\"n\">92.65%<\/td><td class=\"n\">+5.69%<\/td><td class=\"n\">+0.95%<\/td><td class=\"n\">93.61%<\/td><td class=\"n\"><strong class=\"nl nr\">92.11%<\/strong><\/td><\/tr><tr><td class=\"n\">2,000 轉<\/td><td class=\"n\">500<\/td><td class=\"n\">91.04%<\/td><td class=\"n\">+6.78%<\/td><td class=\"n\">+0.97%<\/td><td class=\"n\">92.01%<\/td><td class=\"n\"><strong class=\"nl nr\">93.92%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>不救率 ＝ 判定成立、通過押注檢查，但因餘額不足沒發的次數 ÷ 判定成立次數。<\/li><li>救援池把實際發放鎖在約 <strong class=\"nr\">1%<\/strong>（提撥用掉 96%～100%），控制 RTP 的目的有達到。<\/li><li>但現行參數想發的是 5%～7%，池子只付得起約 1/5，<strong class=\"nl nr\">九成左右的判定成立都發不出來<\/strong>，誰拿得到要看誰先觸發。參數要先調到救援 RTP 約 1%（見第 3.5 節宙斯的試算），救援池才是偶爾擋超發，而不是每天大量拒發。<\/li><\/ul>\n<p><strong class=\"nl nr\">參數調到救援 RTP 約 1% 時<\/strong>（門檻調法：主救援 10 段與延伸救援門檻一起乘 0.72 後取整數 %，救援倍數不變；<code class=\"nl nr\">bucket_tuned.json<\/code>）：<\/p>\n<ul><li>主救援門檻改為 18%、22%、25%、29%、32%、36%、40%、40%、43%、47%；延伸救援條件 2 改為 <code class=\"nr\">&lt;47%<\/code>。不套救援 =\"n\">91.96%<\/td><td class=\"n\">-11.31<\/td><\/tr><tr><td><\/td><td>玩到第 605 轉就閃<\/td><td class=\"n\">605 轉<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">98.11%<\/mark><\/td><td class=\"n\">92.07%<\/td><td class=\"n\">-11.45<\/td><\/tr><tr><td><\/td><td>玩到第 805 轉就閃<\/td><td class=\"n\">805 轉<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">98.29%<\/mark><\/td><td class=\"n\">91.97%<\/td><td class=\"n\">-13.76<\/td><\/tr><tr><td><\/td><td>玩到第 1,000 轉就閃<\/td><td class=\"n\">1,000 轉<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">97.46%<\/mark><\/td><td class=\"n\">91.31%<\/td><td class=\"n\">-25.40<\/td><\/tr><tr><td>拿到就閃人<\/td><td>400 轉後拿到救援就閃（否則玩到 1,000）<\/td><td class=\"n\">862.2 轉<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">97.87%<\/mark><\/td><td class=\"n\">91.31%<\/td><td class=\"n\">-18.35<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>算法<\/th><\/tr><\/thead><tbody><tr><td>RTP（有機制）<\/td><td>Σ 所有玩家停手前的總得分（含救援）÷ Σ 停手前的總押注。<\/td><\/tr><tr><td>RTP（無機制）<\/td><td>同一群玩家、同樣停手點，得分只算自然得分。<\/td><\/tr><tr><td>平均停在<\/td><td>有機制時所有玩家停手轉數的平均。<\/td><\/tr><tr><td>EV／日（bet）<\/td><td>（Σ 停手前總得分 − Σ 停手前總押注）÷ 玩家數，即每人每天平均淨贏幾個 bet。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>判定轉在觸發點後 1～5 轉，所以閃人點取在判定區間的最後一轉（45、85…）；在觸發點（40、80…）就閃的人拿不到該區間的救援。<\/li><li>所有手法都沒有超過 100%，EV 都是負的，沒有穩定套利；延伸救援的固定轉數閃人約 97.5%～98.3%。<\/li><\/ul>\n<p><strong class=\"nl nr\">加注套利<\/strong>（已防堵）：<\/p>\n<ul><li><strong class=\"nl nr\">漏洞<\/strong>：條件只看 RTP（比例），跟押多少無關；救援金額卻是「倍數 × 判定轉押注」。玩家用最小注玩到 RTP 偏低（玩家看得到自己的輸贏），在觸發點後 5 轉改押大注，就能拿到大注的救援。<\/li><li><strong class=\"nl nr\">防法<\/strong>：判定轉押注 &gt; 判定用桶的平均押注 → 取消該次救援（第 3.3.1 節）。救援金額上限因此等於「倍數 × 平均押注」，跟一路押固定注的玩家相同。<\/li><li>模擬（2,400 人 × 405 轉；平常押 1，觸發點後 5 轉看自己條件成立就押 10）：<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>情境<\/th><th class=\"n\">RTP（有機制）<\/th><th class=\"n\">RTP（無機制）<\/th><th class=\"n\">救援次數<\/th><th class=\"n\">取消次數<\/th><\/tr><\/thead><tbody><tr><td>沒有押注檢查<\/td><td class=\"n\"><mark class=\"nl nr hl-danger\">134.85%<\/mark><\/td><td class=\"n\">92.01%<\/td><td class=\"n\">677<\/td><td class=\"n\">0<\/td><\/tr><tr><td>有押注檢查<\/td><td class=\"n\">91.92%<\/td><td class=\"n\">91.92%<\/td><td class=\"n\">0<\/td><td class=\"n\">1,398<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>沒有押注檢查時加注套利 RTP 高達 135%；有押注檢查後全部取消，套利玩家反而拿不到任何救援。<\/li><li>只擋加注、不擋降注：降注只會讓救援變小，沒有套利空間。<\/li><li>副作用：正常玩家剛好在判定區間加注，也會被取消。<\/li><\/ul>\n<p><strong class=\"nl nr\">換模式套利<\/strong>（NB／EB 參數不同時）：<\/p>\n<ul><li>6 組參數都調到救援 RTP 約 1%，但這是「只玩這一組」玩家的平均。會切換的玩家能先看自己的 RTP 再挑組，拿到較有利的那組，加總會超過 1%。<\/li><li>押注檢查擋不到：同一押注層級的 NB 與 EB 總押注相同（例：宙斯中 Bet 都是 $2），切換不會變成加注。<\/li><li>6 組數值相同時不存在；分開調整後就會出現。<\/li><\/ul>\n<p>宙斯 2500 試算（92A v7.4.0.0 Oldhand 中 Bet，NB／EB 每轉倍數分布取自 1 億轉 Record 報表；2,400 人 × 405 轉；只算主救援、不套救援池；<code class=\"nl nr\">System/simulator/simulator_system_oldhand_c2_mode_arb.py<\/code>）：<\/p>\n<ul><li>現行參數在宙斯上的救援 RTP：NB <strong class=\"nr\">7.03%<\/strong>、EB <strong class=\"nr\">8.86%<\/strong>，遠高於 1%。<\/li><li>NB、EB 各自調到救援 RTP <strong class=\"nr\">1.00% ± 0.02%<\/strong>，參數都取實際可設定的值（門檻取整數 %、救援倍數對齊卡片區間上限）：<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>組別<\/th><th>10 段門檻（%）<\/th><th>10 段救援倍數（卡片區間上限）<\/th><th class=\"n\">救援 RTP<\/th><\/tr><\/thead><tbody><tr><td>NB 門檻調法<\/td><td>17、20、24、27、32、34、37、37、41、44<\/td><td>現行（25、50、70、80、90、100…）<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>EB 門檻調法<\/td><td>12、14、16、19、20、24、26、26、28、31<\/td><td>現行<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>NB 強度調法<\/td><td>現行（25、30、35…65）<\/td><td>2、4、6、7、8、8、8、8、8、8<\/td><td class=\"n\">0.99%<\/td><\/tr><tr><td>EB 強度調法<\/td><td>現行<\/td><td>1、3、4、5、5、6、6、6、6、6<\/td><td class=\"n\">0.98%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>門檻調法＝救援倍數不變、只壓門檻；強度調法＝門檻不變、只壓救援倍數。強度調法壓到 1% 時救援只剩 1～8 倍，已不像救援，實務上應以門檻調法為主。<\/li><li>EB 的 FG 觸發率約 NB 的 5 倍（1.11% vs 0.22%），RTP 起伏大、低 RTP 的人多，所以調到 1% 時 EB 的參數一定比 NB 嚴。<\/li><\/ul>\n<p>換模式玩家的救援 RTP（只玩一個模式的人都約 1.00%；每格為「判定時切換／整桶切換」）：<\/p>\n<ul><li><strong class=\"nl nr\">判定時切換<\/strong>：平常玩基本模式，觸發點後 5 轉切到條件成立且倍數較大的模式。<\/li><li><strong class=\"nl nr\">整桶切換<\/strong>：另外在每桶開始時，若 RTP 已低於門檻最鬆模式的下一段門檻，整桶 40 轉改玩那個模式。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>NB／EB 調法<\/th><th>平常玩<\/th><th class=\"n\">沒有防法<\/th><th class=\"n\">防法 A：最近 1 桶<\/th><th class=\"n\">防法 B：判定用 10 桶<\/th><th class=\"n\">防法 C：10 桶都要成立<\/th><\/tr><\/thead><tbody><tr><td>門檻／門檻<\/td><td>EB<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">3.01%／2.89%<\/mark><\/td><td class=\"n\">0.93%／<mark class=\"nl nr hl-warn\">2.14%<\/mark><\/td><td class=\"n\">0.93%／1.05%<\/td><td class=\"n\">0.93%／0.59%<\/td><\/tr><tr><td>強度／強度<\/td><td>EB<\/td><td class=\"n\">1.48%／1.29%<\/td><td class=\"n\">1.03%／1.14%<\/td><td class=\"n\">1.03%／1.06%<\/td><td class=\"n\">1.03%／0.91%<\/td><\/tr><tr><td>門檻／強度<\/td><td>NB<\/td><td class=\"n\">1.22%／<mark class=\"nl nr hl-warn\">1.93%<\/mark><\/td><td class=\"n\">1.10%／0.88%<\/td><td class=\"n\">1.10%／1.43%<\/td><td class=\"n\">0.35%／0.42%<\/td><\/tr><tr><td>門檻／強度<\/td><td>EB<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">3.06%／3.06%<\/mark><\/td><td class=\"n\">1.00%／1.00%<\/td><td class=\"n\">1.00%／1.00%<\/td><td class=\"n\">0.74%／0.74%<\/td><\/tr><tr><td>強度／門檻<\/td><td>EB<\/td><td class=\"n\">1.86%／1.64%<\/td><td class=\"n\">0.98%／1.32%<\/td><td class=\"n\">0.98%／0.97%<\/td><td class=\"n\">0.54%／0.50%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>表中未列的組合（例如門檻／門檻平常玩 NB）切換也拿不到更多，都約 1.00%。<\/li><li><strong class=\"nl nr\">防法 A<\/strong>：判定用的參數看「最近 1 桶押注最多的模式」。擋住判定時切換，但整桶切換仍可多拿約 1%。<\/li><li><strong class=\"nl nr\">防法 B<\/strong>：判定用的參數看「判定用的 10 桶（條件 2 那一批）押注最多的模式」。兩種切換多半都回到約 1%，最多剩 +0.4%；要贏過多數就得大部分時間真的玩那個模式。<\/li><li><strong class=\"nl nr\">防法 C<\/strong>：判定用的 10 桶裡玩過的每個模式，條件都要成立，救援倍數取最小。套利完全消失，但正常混玩的玩家救援也被壓到 0.35%～0.74%。<\/li><li>建議用<strong class=\"nr\">防法 B<\/strong>：擋住大部分套利，又不會懲罰正常混玩的玩家。尚未寫入 C-2版 規格，待決定。<\/li><\/ul>\n<p><strong class=\"nl nr\">參數調到救援 RTP 約 1% 時的換模式套利<\/strong>（宙斯 NB／EB，門檻調法：救援倍數不變，主救援 10 段與延伸救援門檻一起縮，各自調到 1.00% ± 0.02%；一天 1,000 轉含延伸救援；1,000 人 × 1,000 轉；<code class=\"nl nr\">System/simulator/simulator_system_oldhand_c2_mode_pool.py<\/code>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th>主救援 10 段門檻（%）<\/th><th class=\"n\">延伸救援條件 2<\/th><th class=\"n\">救援 RTP<\/th><\/tr><\/thead><tbody><tr><td>NB<\/td><td>16、20、23、26、30、33、36、36、40、43<\/td><td class=\"n\"><code class=\"nl nr\">&lt;42%<\/code><\/td><td class=\"n\">0.98%<\/td><\/tr><tr><td>EB<\/td><td>14、17、18、21、24、26、29、29、31、34<\/td><td class=\"n\"><code class=\"nl nr\">&lt;34%<\/code><\/td><td class=\"n\">1.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>不套救援池（全員同一種玩法）的救援 RTP：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩法<\/th><th class=\"n\">沒有防法<\/th><th class=\"n\">防法 B<\/th><\/tr><\/thead><tbody><tr><td>只玩 NB<\/td><td class=\"n\">0.98%<\/td><td class=\"n\">0.98%<\/td><\/tr><tr><td>只玩 EB<\/td><td class=\"n\">1.00%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>平常玩 EB，判定時切換<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">2.49%<\/mark><\/td><td class=\"n\">1.05%<\/td><\/tr><tr><td>平常玩 EB，整桶切換<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">2.48%<\/mark><\/td><td class=\"n\">0.97%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>套 1% 救援池（同一個池：45% 只玩 NB、45% 只玩 EB、5% 判定時切換、5% 整桶切換）各群的救援 RTP：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩家群<\/th><th class=\"n\">沒有防法<\/th><th class=\"n\">防法 B<\/th><\/tr><\/thead><tbody><tr><td>只玩 NB<\/td><td class=\"n\">0.92%<\/td><td class=\"n\">0.95%<\/td><\/tr><tr><td>只玩 EB<\/td><td class=\"n\">0.73%<\/td><td class=\"n\">0.77%<\/td><\/tr><tr><td>判定時切換<\/td><td class=\"n\">1.01%<\/td><td class=\"n\">0.65%<\/td><\/tr><tr><td>整桶切換<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">2.12%<\/mark><\/td><td class=\"n\">1.02%<\/td><\/tr><tr><td>全體<\/td><td class=\"n\">0.90%（不救率 51%）<\/td><td class=\"n\">0.86%（不救率 48%）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>參數調到 1% 後，沒有防法時會切換的玩家仍可拿到約 2.5%，比只玩一個模式多約 1.5%。<\/li><li>有救援池時總發放仍鎖在約 1%，但會切換的玩家會吃掉其他人的份：整桶切換拿 2.12%，只玩 EB 的人只剩 0.73%。<\/li><li>加上防法 B 後，兩種切換都回到約 1%，有池時也不再搶別人的份。<\/li><li>切換玩家每群只有 50 人，各群數字有抽樣誤差，看方向為主。<\/li><\/ul>\n<p><strong class=\"nl nr\">另一種做法：NB、EB 共用同一套參數<\/strong>（宙斯，同上設定；以一半只玩 NB、一半只玩 EB 合計調到 1%；<code class=\"nl nr\">mode_shared_宙斯.json<\/code>）：<\/p>\n<ul><li>共用門檻：主救援 14、16、20、23、26、29、32、32、35、38（%），延伸救援 <code class=\"nr\">&lt;38%<\/code>；合計救援 RTP 1.02%。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩家<\/th><th class=\"n\">不套救援池<\/th><th class=\"n\">套 1% 救援池<\/th><\/tr><\/thead><tbody><tr><td>只玩 NB<\/td><td class=\"n\">0.41%<\/td><td class=\"n\">0.41%<\/td><\/tr><tr><td>只玩 EB<\/td><td class=\"n\">1.56%<\/td><td class=\"n\">1.31%<\/td><\/tr><tr><td>平常玩 EB，判定時切換<\/td><td class=\"n\">1.55%<\/td><td class=\"n\">0.75%<\/td><\/tr><tr><td>平常玩 EB，整桶切換<\/td><td class=\"n\">1.49%<\/td><td class=\"n\">1.89%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>兩個模式門檻一樣，切換挑不到比較鬆的門檻，<strong class=\"nl nr\">換模式套利消失<\/strong>（切換玩家跟只玩 EB 差不多；有池時切換群只有 50 人，數字看方向）。<\/li><li>代價是各模式拿到的救援不一樣：EB 起伏大、低 RTP 的人多，救援 RTP 約 1.6%，NB 只有約 0.4%。合計仍約 1%，由救援池控制總量。<\/li><li>結論：要「各模式各自精準 1%」就得分開參數並加防法 B；要「簡單、全部一起算」就共用一套參數，接受 NB 與 EB 的救援 RTP 不同。<\/li><\/ul>\n<p><strong class=\"nl nr\">防法 D：判定前由嚴的模式切到鬆的模式就取消該次救援<\/strong>（宙斯，NB／EB 各自調到 1% 的那組參數；1,000 人 × 1,000 轉；<code class=\"nl nr\">mode_defense_d_宙斯.json<\/code>）。EB 門檻較嚴、NB 較鬆，所以「EB → NB」算切到鬆的；看切換發生的範圍分兩種：D1＝最近 1 桶開始到判定轉（約 40 轉內），D10＝判定用 10 桶開始到判定轉（約 400 轉內）。另加「一般混玩」玩家：每桶隨機玩 NB 或 EB，不看自己的 RTP，代表正常換著玩的人。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩家<\/th><th class=\"n\">沒有防法<\/th><th class=\"n\">防法 B<\/th><th class=\"n\">防法 D1<\/th><th class=\"n\">防法 D10<\/th><\/tr><\/thead><tbody><tr><td>只玩 NB／只玩 EB<\/td><td class=\"n\">0.98%／1.00%<\/td><td class=\"n\">同左<\/td><td class=\"n\">同左<\/td><td class=\"n\">同左<\/td><\/tr><tr><td>判定時切換<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">2.49%<\/mark><\/td><td class=\"n\">1.05%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">0.00%<\/td><\/tr><tr><td>整桶切換<\/td><td class=\"n\"><mark class=\"nl nr hl-warn\">2.48%<\/mark><\/td><td class=\"n\">0.97%<\/td><td class=\"n\">0.69%<\/td><td class=\"n\">0.00%<\/td><\/tr><tr><td>一般混玩（每桶隨機）<\/td><td class=\"n\">1.31%<\/td><td class=\"n\">1.03%<\/td><td class=\"n\">0.69%<\/td><td class=\"n\">0.08%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>防法 D 可以擋住換模式套利：判定時切換的人一筆都拿不到，整桶切換的人也降到 1% 以下。<\/li><li>代價是正常換著玩的人也會被取消：每桶隨機換的玩家，D1 剩 0.69%、D10 幾乎拿不到。實際玩家換模式沒那麼頻繁，影響會比這小。<\/li><li>防法 B 對一般混玩最公平（1.03%），套利也擋到約 1%。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"附錄-a-新手體驗舊版本\">附錄 A. 新手體驗舊版本<\/h2>\n<p>現行版本是 D 版（第 2 節）；以下為 A～C 版的原始整理，保留作為設計沿革。<\/p>\n<h3 id=\"a1-a-版\">A.1 A 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 6～8 頁。<\/p>\n<ul><li><strong class=\"nl nr\">目的<\/strong>：推廣遊戲並協助新玩家理解遊戲特色，期望大部分玩家在第 50 場前體驗並了解 Free Game、Mini Game 等特色與主要得分方式。<\/li><li><strong class=\"nl nr\">適用條件<\/strong>（同時符合）：第 21～50 把；當下押注 <code class=\"nr\">Bet &lt;20<\/code>；尚未體驗過 Free Game（Buy Feature 不算已體驗）。<\/li><li><strong class=\"nl nr\">體驗內容<\/strong>：直接贈送一場 Free Game，目標倍數區間 <code class=\"nr\">(15x, 20x]<\/code>，計算需考慮 Scatter Pay。<\/li><li><strong class=\"nl nr\">成本限制<\/strong>：所有遊戲合計單日投入成本 50 萬，超過即關閉新手體驗。<\/li><li><strong class=\"nl nr\">執行流程<\/strong>：第 21～50 把隨機選一個判定回合 → 檢查是否曾觸發 Free Game（救援機制觸發的也算）→ 符合則贈送平均倍數位於 <code>(15x, 20x]<\/code> 的 Free Game。<\/li><li><strong class=\"nl nr\">特殊規則<\/strong>：<ul><li>新手體驗與新手救援不可同一回合觸發，隨機到同一回合須避開。<\/li><li>新手體驗不會觸發 Mini Game。<\/li><li>計算開始遊玩到觸發回合前的平均押注（不含觸發當下這一把）；觸發當下押注高於先前平均即取消，避免提高押注套利。<\/li><li>使用 Extra Bet 時以 Extra Bet 的 Total 為基準，例如 Extra Bet 為 Bet 1 的 8 倍時，體驗金額為 <code class=\"nr\">8 × (15～20)<\/code>。<\/li><\/ul><\/li><li><strong class=\"nl nr\">Scatter Pay 處理<\/strong>：FG 觸發帶 Scatter Pay 時卡片系統需納入考量。原始範例：預計給 19 倍、觸發先付 3 倍 Scatter Pay → 以 <code>19 - 3 = 16<\/code> 倍找 <code>(15x, 20x]<\/code> 結果 → 若輸出 19 倍再加 3 倍，實得 22 倍，可能超出 20 倍上限。<\/li><li><strong class=\"nl nr\">待確認<\/strong>：<ul><li>卡片系統產生 FG 結果時，後端無法在返還金額中精確處理 Scatter Pay。<\/li><li>成本估算需額外納入 Scatter Pay。<\/li><li>目的提到 Mini Game，但特殊規則明定不會觸發 Mini Game。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"a2-b-版\">A.2 B 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 9～11 頁。目的、成本限制、執行流程、特殊規則（不含 Extra Bet 條款）、Scatter Pay 範例同 A 版，差異如下：<\/p>\n<ul><li><strong class=\"nl nr\">適用條件<\/strong>：第 11～30 把；<code class=\"nl nr\">Bet &lt;20<\/code>；尚未體驗過 Free Game（Buy Feature 不算）。<\/li><li><strong class=\"nl nr\">體驗內容<\/strong>：Free Game 改用固定倍數，從 <code>(15x, 20x]<\/code> 區間挑一組既有腳本。<\/li><li><strong class=\"nl nr\">待確認<\/strong>：<ul><li>數值設定寫第 11～30 把，但流程寫第 21～50 把選判定回合，範圍不一致。<\/li><li>Scatter Pay 精確處理、成本估算、Mini Game 矛盾三點同 A 版。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"a3-c-版\">A.3 C 版<\/h3>\n<p>版本日期 2025-10-20；文件狀態：未完成；來源 PDF 第 12～14 頁。目的、成本限制、原始流程（第 21～50 把、<code class=\"nl\">(15x, 20x]<\/code> Free Game）、特殊規則（不含 Extra Bet 條款）、Scatter Pay 範例（19 倍、3 倍、16 倍、22 倍）同 A 版，差異如下：<\/p>\n<ul><li><strong class=\"nl nr\">適用條件<\/strong>（兩次共同限制 <code class=\"nr\">Bet &lt;20<\/code>）：<ul><li>第一次體驗：第 11～30 把，尚未體驗過 Mini Game（Buy Feature 不算），提供 Mini Game。<\/li><li>第二次體驗：第 51～80 把，尚未體驗過 Free Game（Buy Feature 不算），提供 Free Game。<\/li><\/ul><\/li><li><strong class=\"nl nr\">體驗內容<\/strong>：Jackpot Game 提供 Mini Bonus；Free Game 為固定倍數，從 <code>(15x, 20x]<\/code> 挑一組既有腳本。<\/li><li><strong class=\"nl nr\">待確認<\/strong>：<ul><li>文件已標示「未完成」。<\/li><li>第一次體驗提供 Mini Game，但特殊規則寫不會觸發 Mini Game。<\/li><li>適用條件為第 11～30、51～80 把，流程仍寫第 21～50 把。<\/li><li>只描述直接贈送 Free Game，尚無第一次 Mini Game 體驗的完整流程。<\/li><li>Jackpot Game、Mini Game、Mini Bonus 三個名稱的對應關係未定義。<\/li><\/ul><\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"附錄-b-老手救援舊版本\">附錄 B. 老手救援舊版本<\/h2>\n<p>現行版本是 C-2（第 3 節）；以下為 A、B、C 版的原始整理，保留作為設計沿革。<\/p>\n<h3 id=\"b1-a-版\">B.1 A 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 19～21 頁。<\/p>\n<ul><li><strong class=\"nl nr\">目的<\/strong>：避免玩家長時間處於低 RTP。累積損失達一定程度時，以 Free Game 或一把高分 Base Spin 返還部分損失。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>設定<\/th><\/tr><\/thead><tbody><tr><td>適用期間<\/td><td>老手期，第 200 轉後<\/td><\/tr><tr><td>偵測單位<\/td><td>每 100 把<\/td><\/tr><tr><td>RTP 計算資料<\/td><td>當下 100 把加上前 100 把，共 200 把<\/td><\/tr><tr><td>觸發門檻<\/td><td>RTP <code class=\"nr\">&lt;30%<\/code><\/td><\/tr><tr><td>返還比例<\/td><td>玩家損失金額的 25%<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>返還金額 = (Total Bet - Total Win - Scatter Pay) × 25%<\/code><\/pre>\n<ul><li>有 Scatter Pay 的遊戲需特殊處理。<\/li><li><strong class=\"nl nr\">返還倍數區間<\/strong>（取自卡片系統）：(15x, 20x]、(20x, 25x]、(25x, 30x]、(30x, 35x]、(35x, 40x]、(40x, 45x]、(45x, 50x]、(50x, 60x]、(60x, 70x]、(70x, 80x]、(80x, 90x]、(90x, 100x]。<\/li><li><strong class=\"nl nr\">執行流程<\/strong>（以第 351～450 把為例）：切成 351～360、361～370……441～450 等 10 把子區間，各挑一個判定 Spin → 抓前 100 把＋當下 100 把共 200 把的 Total Win、Total Bet 算 RTP，是否低於 30% → 符合則以損失的 25% 計算返還金額 → 判定所屬倍數區間 → 卡片系統重骰到落入該區間。<\/li><li><strong class=\"nl nr\">跨遊戲資料<\/strong>：以玩家為單位，所有遊戲紀錄合併計算（例：遊戲 A 玩 50 把、遊戲 B 玩 50 把，合併 100 把）；新手期結束後先額外累積 50 場作為判斷基底。<\/li><li><strong class=\"nl nr\">特殊規則<\/strong>：救援觸發時不得同時觸發其他獎勵遊戲（如 Jackpot Game）；以「龍意發」為例，救援期間不會出現 15 顆滿盤觸發 Grand。<\/li><\/ul>\n<hr>\n<h3 id=\"b2-b-版\">B.2 B 版<\/h3>\n<p>版本日期 2025-10-15；來源 PDF 第 22～26 頁。<\/p>\n<ul><li><strong class=\"nl nr\">目的<\/strong>：從 RTP 觀察玩家歷程，累積損失達一定程度時以 Free Game 救回不會輸太多的狀態，延長遊戲體驗。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>設定<\/th><\/tr><\/thead><tbody><tr><td>適用期間<\/td><td>老手期 100 次 Spin 後，即第 200＋100 轉後<\/td><\/tr><tr><td>返還區間<\/td><td>150 次 Spin<\/td><\/tr><tr><td>RTP 計算區間<\/td><td><code class=\"nl\">100 + N<\/code> 次 Spin<\/td><\/tr><tr><td>觸發門檻<\/td><td>RTP <code class=\"nr\">&lt;50%<\/code><\/td><\/tr><tr><td>返還目標<\/td><td>RTP <code class=\"nr\">55%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>返還金額 = (0.95 - Total Win / Total Bet) × Total Bet<\/code><\/pre>\n<ul><li><strong class=\"nl nr\">機制<\/strong>：每個 150 把返還區間選判定回合，往前抓 <code>100 + N<\/code> 把算 RTP；低於 50% 贈送一個 Free Game 救回目標值。返還倍數區間同 B.1。<\/li><li><strong class=\"nl nr\">執行流程<\/strong>（以第 351 把後為例，原文註明為概念說明、後端可能略有差異）：第 351～400 把隨機選 <code class=\"nr\">N1<\/code>，若 <code>N1 = 370<\/code> 則 <code class=\"nr\">N = 20<\/code>，往前統計 <code>100 + 20 = 120<\/code> 把 RTP，符合即返還；第 401～450 把再選 <code class=\"nr\">N2<\/code>，若 <code>N2 = 411<\/code> 則 <code class=\"nr\">N = 11<\/code>，統計 111 把；依此重複。<\/li><li><strong class=\"nl nr\">跨遊戲資料<\/strong>：以玩家為單位，所有遊戲紀錄納入 RTP；新手期結束後先累積 100 場作為計算基底。<\/li><li><strong class=\"nl nr\">特殊規則<\/strong>：同 B.1。<\/li><li><strong class=\"nl nr\">已知問題與待確認<\/strong>：<ul><li>返還目標寫 RTP 55%，公式的 <code>0.95<\/code> 卻是補到 RTP 95%，不一致。<\/li><li>寫每 150 把選一次判定，範例卻在 351～400、401～450 各選一次，頻率待確認。<\/li><li>Extra Bet 為 8 倍時返還上限理論上應為 800 倍，實際只有 100 倍；因 8 倍押注玩家占比不高，暫不修改。<\/li><li>需確認老手期玩家的平均遊玩把數。<\/li><\/ul><\/li><\/ul>\n<hr>\n<h3 id=\"b3-c-版雙池修訂\">B.3 C 版（雙池修訂）<\/h3>\n<p>版本日期：2026-08-28<\/p>\n<h4 id=\"b31-設計目的\">B.3.1 設計目的<\/h4>\n<pre><code>老手期總 RTP = 96%（基礎配置）+ 1%（救援提撥）= 97%<\/code><\/pre>\n<p>依短期、中期、長期 RTP 判斷救援資格；實際發放由共同池與個人池兩本帳控制，救援支出結構上不可能超過提撥總額。未進 FG 轉數不作為救援條件。<\/p>\n<h4 id=\"b32-判定週期\">B.3.2 判定週期<\/h4>\n<p>進入老手期（完成新手期 200 轉）後，從老手期第 1 轉起算，每滿 50 轉（第 50、100…轉）判定一次，判定回合固定、不隨機。<\/p>\n<h4 id=\"b33-遊玩時期\">B.3.3 遊玩時期<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時期<\/th><th class=\"n\">老手期轉數<\/th><\/tr><\/thead><tbody><tr><td>老手第 1 階段<\/td><td class=\"n\">1～100<\/td><\/tr><tr><td>老手第 2 階段<\/td><td class=\"n\">101～200<\/td><\/tr><tr><td>老手第 3 階段<\/td><td class=\"n\">201～300<\/td><\/tr><tr><td>老手第 4 階段<\/td><td class=\"n\">301 起<\/td><\/tr><\/tbody><\/table><\/div>\n<p>新手期為整體第 1～200 轉，執行新手體驗 D 版：新手第 1 階段第 1～100 轉（第 50 轉判定）、第 2 階段第 101～200 轉（第 150 轉判定）。<\/p>\n<h4 id=\"b34-判定資料\">B.3.4 判定資料<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>判定類型<\/th><th class=\"n\">統計範圍<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\">判定回合之前 50 轉<\/td><td>所有階段的共同前置條件<\/td><\/tr><tr><td>中期<\/td><td class=\"n\">判定回合之前 200 轉<\/td><td>各階段主要 RTP 條件<\/td><\/tr><tr><td>長期<\/td><td class=\"n\">判定回合之前 500 轉<\/td><td>僅老手第 4 階段使用<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>區間 RTP = 區間內實際最終得分合計 ÷ 區間內 Total Bet 合計<\/code><\/pre>\n<ul><li>判定回合本身不納入；各窗口須含新手體驗 D 版介入後的實際結果（含第 50、150 轉可能被改寫的得分）。<\/li><\/ul>\n<h4 id=\"b35-救援資格\">B.3.5 救援資格<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>窗口<\/th><th class=\"n\">第 1 階段<\/th><th class=\"n\">第 2 階段<\/th><th class=\"n\">第 3 階段<\/th><th class=\"n\">第 4 階段<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><\/tr><tr><td>中期<\/td><td class=\"n\"><code class=\"nl nr\">&lt;55%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;55%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><\/tr><tr><td>長期<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><td class=\"n\"><code class=\"nl nr\">&lt;100%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>第 4 階段長期規則只在已有完整 500 轉資料時執行，不足則不救援。<\/li><li>命中只代表具備資格，實際獎項與是否放行由救援池決定。<\/li><\/ul>\n<h4 id=\"b36-救援池\">B.3.6 救援池<\/h4>\n<p>每次 Spin 提撥投注額 1%，同一筆錢同時記入兩本帳（不是兩筆提撥）：<\/p>\n<pre><code>提撥額 = 該轉 Total Bet × 1%\n\n共同池餘額 = Σ 全平台提撥 − Σ 全平台已發救援成本\n個人池餘額 = Σ 該玩家提撥 − Σ 該玩家已領救援成本<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>池<\/th><th>守什麼<\/th><th>沒錢時<\/th><\/tr><\/thead><tbody><tr><td>共同池<\/td><td>平台總救援支出不超過總投注的 1%<\/td><td>硬性上限，一律不救援<\/td><\/tr><tr><td>個人池<\/td><td>單一玩家不長期超領<\/td><td>改用嚴格標準複判；通過仍可救援（透支）<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"b37-判定順序\">B.3.7 判定順序<\/h4>\n<ol><li>先依 3.3.8 決定預定獎項及完整救援成本。<\/li><li>共同池檢查：不足 → 取消救援；足夠 → 進個人池檢查。共同池關閉時跳過。<\/li><li>個人池檢查：足夠 → 用 3.3.5 一般門檻；不足 → 用 3.3.9 嚴格門檻。<\/li><li>門檻通過 → 發放並依 3.3.10 記帳；未通過 → 不救援。<\/li><\/ol>\n<h4 id=\"b38-救援獎項\">B.3.8 救援獎項<\/h4>\n<p>當日未曾有單局最終得分 ≥50 × 該局 Bet 者救 50×，已體驗過者救 20×；個人池餘額決定支應來源。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>當日 50× 體驗<\/th><th>個人池餘額<\/th><th>額外條件<\/th><th class=\"n\">獎項<\/th><th>支應來源<\/th><\/tr><\/thead><tbody><tr><td>未體驗<\/td><td><code class=\"nl nr\">≥50 × 該轉 Bet<\/code><\/td><td>無<\/td><td class=\"n\">50× FG<\/td><td>個人池<\/td><\/tr><tr><td>未體驗<\/td><td><code class=\"nl nr\">&lt;50 × 該轉 Bet<\/code><\/td><td>通過嚴格標準<\/td><td class=\"n\">50× FG<\/td><td>共同池（透支）<\/td><\/tr><tr><td>已體驗<\/td><td><code class=\"nl nr\">≥20 × 該轉 Bet<\/code><\/td><td>無<\/td><td class=\"n\">20× FG<\/td><td>個人池<\/td><\/tr><tr><td>已體驗<\/td><td><code class=\"nl nr\">&lt;20 × 該轉 Bet<\/code><\/td><td>通過嚴格標準<\/td><td class=\"n\">20× FG<\/td><td>共同池（透支）<\/td><\/tr><tr><td>—<\/td><td>不足<\/td><td>未通過嚴格標準<\/td><td class=\"n\">不救援<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>判定轉單一路徑結算：救援通過只用救援結果，未通過或取消才用自然結果，兩者不比較高低（與現行 C-2 取較高者不同）；自然結果保留作「無機制」對照，不加進最終得分。<\/li><li>救援結果一律由卡片系統重骰，不得直接塞分數或放置 Scatter；救援觸發時不得同時觸發其他獎勵遊戲（如 Jackpot Game）。<\/li><\/ul>\n<h4 id=\"b39-嚴格標準\">B.3.9 嚴格標準<\/h4>\n<p>獨立固定門檻，不隨一般門檻連動：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>窗口<\/th><th class=\"n\">一般標準<\/th><th class=\"n\">嚴格標準<\/th><\/tr><\/thead><tbody><tr><td>短期<\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;40%<\/code><\/td><\/tr><tr><td>中期（第 1～4 階段）<\/td><td class=\"n\"><code class=\"nl nr\">&lt;55% / 55% / 50% / 50%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;55% / 55% / 50% / 50%<\/code><\/td><\/tr><tr><td>長期（第 4 階段）<\/td><td class=\"n\"><code class=\"nl nr\">&lt;100%<\/code><\/td><td class=\"n\"><code class=\"nl nr\">&lt;100%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"b310-成本記帳\">B.3.10 成本記帳<\/h4>\n<pre><code>救援成本 = 救援流程產生的該轉完整最終得分<\/code><\/pre>\n<ul><li>救援成功時兩池均按完整救援結果扣款，自然結果不抵銷；以實際最終得分（含 Scatter Pay）計，不得用卡片目標倍數，否則低估支出。<\/li><li>報表「倍率差」＝ <code class=\"nr\">救援結果 − 自然結果<\/code>，僅供比較，可為負，不影響記帳。<\/li><li>正式系統依投注事件時間順序更新共同池；模擬器同一轉內以固定亂數種子打散玩家順序，避免共同池偏向較小玩家編號。<\/li><\/ul>\n<h4 id=\"b311-異常加押檢查\">B.3.11 異常加押檢查<\/h4>\n<p>判定前往前檢查歷史押注，辨識是否在可能取得救援前異常加押。待定義：往前檢查的轉數、基準（平均、中位數或其他）、高出多少視為異常並取消救援。<\/p>\n<h4 id=\"b312-玩家取得救援後的行為\">B.3.12 玩家取得救援後的行為<\/h4>\n<p>記錄取得救援後是否立即停玩，作為效果與套利風險觀察指標；目前不直接判定為套利。<\/p>\n<h4 id=\"b313-rtp-驗證與待確認事項\">B.3.13 RTP 驗證與待確認事項<\/h4>\n<p>模擬須驗證：老手期總 RTP 收斂於 97%（96% 基礎 + 1% 救援）；共同池餘額不得為負；共同池、個人池、嚴格標準擋下的次數分別統計；透支比例與 50×／20× 發放占比列入報表。<\/p>\n<p>待確認：<\/p>\n<ul><li>個人池初始額度：1% 提撥約需 2,000 轉攢滿 20×、5,000 轉攢滿 50×，前期幾乎都走透支；候選為進老手期贈送初始額度（例如 50 × Bet）或維持 0，先模擬透支比例再定案。<\/li><li>「當日體驗 50×」定義：日切基準（平台時區日曆日或 session）、是否含 BF／SF 局、是否含救援結果、以單局整包（含 FG）或單次事件計。<\/li><li>共同池範圍（建議每款遊戲各一池）與時間範圍（建議滾動窗口）。<\/li><li>BF／SF 是否提撥與計入判定窗口（建議不提撥、不計入）。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"筆記\">筆記<\/h2>\n<h3 id=\"sps-救援池同時觸發會超發2026-11-05\">SPS 救援池同時觸發會超發（2026-11-05）<\/h3>\n<ul><li><strong class=\"nl nr\">狀況<\/strong>：SPS 有 <strong>8 台機器<\/strong>各自判定，同一時間最多 8 名玩家觸發。檢查餘額時前一筆還沒扣款，8 筆都會看到同一個餘額、都判定「夠」而全部發放。<\/li><li><strong class=\"nl nr\">影響<\/strong>：當日發放可能超過救援池餘額，池子會變負；最多多發 7 筆救援成本（每筆最多約 100 × 押注）。<\/li><li><strong class=\"nl nr\">決議：不處理<\/strong>。池子變負也不會負太多（最多 7 筆）；救援池每天 04:00 歸零，負數不帶到隔天，只影響當天。<\/li><\/ul>\n<h3 id=\"救援形式改成一段好玩的過程想法2026-11-11\">救援形式改成「一段好玩的過程」（想法，2026-11-11）<\/h3>\n<ul><li><strong class=\"nl nr\">問題<\/strong>：現在救援是一把直接給（例：一把 50×），那一把會讓玩家的當日 RTP 劇烈跳動。<\/li><li><strong class=\"nl nr\">想法<\/strong>：RTP 偏低時不是一把給完，而是給玩家一段比較好玩的過程。<ul><li><strong class=\"nl nr\">換表<\/strong>：接下來一段轉數改用比較好的倍率權重（輪帶／卡片表）。<\/li><li><strong class=\"nl nr\">拆成多把<\/strong>：原本要給 50×，拆成 5 個 10×，在之後的 10 把內陸續給完。<\/li><\/ul><\/li><li><strong class=\"nl nr\">狀態<\/strong>：想法，尚未設計與模擬。之後要確認：拆分方式與給完的轉數、換表的持續轉數、救援池扣款時點（一次預扣或逐把扣）、拆分期間是否還會再觸發判定、套利檢查。<\/li><\/ul><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', 'math', 'docs', 'submission', 'script', 'stress', 'backend', 'ceiling', 'mechanism'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

// 沒有任何目錄項目時整個 Table of Contents 框拿掉

(function () {

    }).filter(function (h) { return h.s; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 30);
    sel = 0;
    res.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a class="pv-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><div class="pv-path">' + e(h.r.path) + '</div><div class="pv-title">' + hl(h.r.title, q) + '</div>' +
