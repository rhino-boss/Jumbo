a-tab=\"proposal\">2. 檔案<\/a><a class=\"toc-2\" href=\"#3-章節結構\" data-tab=\"proposal\">3. 章節結構<\/a><a class=\"toc-3\" href=\"#31-各頁內容與版面\" data-tab=\"proposal\">3.1 各頁內容與版面<\/a><a class=\"toc-2\" href=\"#4-內容規則\" data-tab=\"proposal\">4. 內容規則<\/a><a class=\"toc-2\" href=\"#5-製作與檢查\" data-tab=\"proposal\">5. 製作與檢查<\/a><a class=\"toc-2\" href=\"#6-版面規格\" data-tab=\"proposal\">6. 版面規格<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"report\">數值報告規範<\/a><a href=\"#\" class=\"tab-link toc-doc\" data-tab=\"demoreport\">Demo報告規範<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-overview\"><div class=\"sec-head\"><h1 id=\"開發規範總覽\">開發規範總覽<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本站是自己用的開發規範（要產出什麼、長什麼樣），<strong class=\"nl nr\">不同步給其他人<\/strong>。開發順序見「開發流程」；各產線的規範見 Omniplay／Landbase／Reskin。開新專案先讀開發流程「接手須知」與「流程」，再讀該步驟對應的規範。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-文件\">1. 文件<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"outputs\">產出與紀錄規範<\/a><\/td><td>每個專案必須產出的文件、<code class=\"nl\">修改紀錄.md<\/code> 格式、專案目錄與存放位置<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"gamerule\">GameRule規範<\/a><\/td><td><code class=\"nl\">game_rule.md<\/code> 的固定章節骨架、必要欄位與交付檢查<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"sim\">模擬程式規範<\/a><\/td><td>Simulator 架構、批次、Console 與報表格式；Config 轉檔、驗證與版本<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"demo\">Demogame規範<\/a><\/td><td>Demogame 載入、共用／By Game 區域、補牌、Debug、對帳；Demo 版 RTP 120%<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"proposal\">提案報告規範<\/a><\/td><td>提案說明簡報（.pptx）的章節與版式<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><td>本作與競品、前作的差異分析報告<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"demoreport\">Demo報告規範<\/a><\/td><td>給內部與客戶說明設計理由的 Demo 報告<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"2-資料夾與網頁\">2. 資料夾與網頁<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>位置<\/th><th>內容<\/th><th>同步<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">開發規範/Omniplay/<\/code>、<code class=\"nl nr\">Landbase/<\/code>、<code class=\"nl nr\">Reskin/<\/code><\/td><td>各產線規範<\/td><td>Omniplay 發佈到團隊共享區；Landbase／Reskin 同步到 SVN 說明書（只更新已放入的檔）<\/td><\/tr><tr><td><code class=\"nl nr\">開發規範/*.md<\/code><\/td><td>本站（開發規範）<\/td><td>不同步<\/td><\/tr><tr><td><code class=\"nl nr\">開發流程/<\/code><\/td><td>開發流程<\/td><td>不同步<\/td><\/tr><tr><td><code class=\"nl nr\">其他/<\/code><\/td><td><code class=\"nl\">_build_html.py<\/code> 等工具<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>任何 <code>.md<\/code> 改完，同一次修改內在 <code>其他/<\/code> 執行 <code class=\"nr\">py _build_html.py<\/code>，重建 <code>專案需知/<\/code> 最外層的網頁與入口 <code class=\"nr\">igaming_specification.html<\/code>；不得手改 HTML。<\/li><li>三產線互不提及對方的數值；產線資料夾只放自己的文件。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-專有名詞\">3. 專有名詞<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>意義<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>後端報表<\/td><td>後端 SPS（RTP Validator）依分支壓測後輸出的 TXT 報表，以壓縮檔交付（例：<code class=\"nl nr\">JHS101027-RTP-Validator-Mode-6-By-Branch-On-Cloud-876.zip<\/code>）；每個分支一個資料夾、一份 TXT，內含 RTP 拆解、救援／JP RTP、符號命中、倍率分桶等。口頭說「SPS 的表格」「SPS 報表」都指這個。<\/td><td>讀法、指標換算與核對方法見 後端報表.md；壓測要壓哪些組合與判定標準見 壓測說明書.md。<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-gamerule\" hidden><div class=\"sec-head\"><h1 id=\"gamerule規範\">GameRule規範<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>存放位置：遊戲專案根目錄 <code class=\"nr\">game_rule.md<\/code>。<\/p>\n<p>Game Rule 是遊戲規則說明文件。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-用途\">1. 用途<\/h2>\n<p>Game Rule 用於設定遊戲玩法規則，是數學模型、Config、Simulator、Demogame、Help 與測試案例共同遵循的規則來源。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"2-必要規則\">2. 必要規則<\/h2>\n<ul><li>每款遊戲必須提供 <code class=\"nr\">game_rule.md<\/code>，並明確定義遊戲基礎設定、得分方式、Symbol 功能、判獎順序、Bet Mode、BG／FG 流程、Feature、Retrigger、Multiplier、Max Win、Jackpot 與例外處理。<\/li><li>Game Rule 必須沿用本節定義的固定章節骨架、標題層級、表格形式及規則表達方式。<\/li><li>數學模型、Config、Simulator、Demogame 與 Help 不得自行補充或改寫 <code>game_rule.md<\/code> 未定義的玩法。<\/li><li>規則變更時，必須同步檢查並更新數學文件、Config、Simulator、Demogame、<code class=\"nl nr\">{GameID}_Help.xlsx<\/code>、<code class=\"nl\">game_help.md<\/code> 與測試案例。<\/li><li>Game Rule 與其他來源內容衝突時，必須先確認正式規則，不得由開發端自行選擇其中一種實作。<\/li><\/ul>\n<p>Game Rule 必須保留下列基本結構：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">順序<\/th><th>章節<\/th><th>格式要求<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">1<\/td><td><code class=\"nl nr\">§1. 遊戲基本資訊<\/code><\/td><td>使用「項目／說明」表格記錄本節規定的基礎資料。<\/td><\/tr><tr><td class=\"n\">2<\/td><td><code class=\"nl nr\">§2. 盤面結構<\/code><\/td><td>包含盤面示意圖與 Reel／Row、得分方向及補牌流程的文字說明。<\/td><\/tr><tr><td class=\"n\">3<\/td><td><code class=\"nl nr\">§3. 符號類別<\/code><\/td><td>分開定義一般符號與特殊符號，說明出現位置、替代關係及功能。<\/td><\/tr><tr><td class=\"n\">4<\/td><td><code class=\"nl nr\">§4. 賠率表（Pay Table）<\/code><\/td><td>使用表格列出符號、得分數量及倍率口徑。<\/td><\/tr><tr><td class=\"n\">5<\/td><td><code class=\"nl nr\">§5. 核心特色<\/code><\/td><td>依遊戲機制建立子章節，完整說明特色符號、轉換、Multiplier 或其他核心玩法。<\/td><\/tr><tr><td class=\"n\">6<\/td><td><code class=\"nl nr\">§6. 免費遊戲（Free Spins / Free Game, FG）<\/code><\/td><td>分別定義觸發、FG 玩法及 Retrigger。<\/td><\/tr><tr><td class=\"n\">7<\/td><td><code class=\"nl nr\">§7. 核心遊戲流程（Base Game）<\/code><\/td><td>依實際執行順序編號描述 Spin、判獎、消除／補牌、結算與 Feature Trigger。<\/td><\/tr><tr><td class=\"n\">8<\/td><td><code class=\"nl nr\">§8. 押注模式<\/code><\/td><td>依遊戲實際支援內容分別說明 Extra Bet 與 Buy Feature。<\/td><\/tr><tr><td class=\"n\">9<\/td><td><code class=\"nl nr\">§9. 邊界 / 例外情境（Edge Cases）<\/code><\/td><td>依機制分類列出可直接驗證的邊界條件及例外處理。<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code class=\"nl\">§1. 遊戲基本資訊<\/code> 必須包含下列欄位：<\/p>\n<ul><li><code class=\"nl nr\">Game ID<\/code><\/li><li><code class=\"nl nr\">PARsheet ID<\/code><\/li><li><code class=\"nl nr\">遊戲中文名稱<\/code><\/li><li><code class=\"nl nr\">遊戲英文名<\/code><\/li><li><code class=\"nl nr\">遊戲類型<\/code>：依實際遊戲機制列出完整類型，例如 <code class=\"nr\">2,025–32,400 Ways / Megaways / Cascade<\/code>。<\/li><li><code class=\"nl nr\">盤面規格<\/code><\/li><li><code class=\"nl nr\">中獎方式<\/code>：使用 <code class=\"nr\">Line Game<\/code>、<code class=\"nl nr\">Way Game<\/code>、<code class=\"nl\">Pay Anywhere<\/code> 或 <code class=\"nr\">Cluster Pay<\/code>；只能選擇符合實際判獎邏輯的類型。<\/li><li><code class=\"nl nr\">押注模式<\/code><\/li><\/ul>\n<p><code class=\"nl\">§8. 押注模式<\/code> 依遊戲實際支援內容包含：<\/p>\n<ul><li><code class=\"nl nr\">Extra Bet<\/code>：遊戲有 Extra Bet 時，說明價格、流程與 Normal Bet 的差異；沒有時可省略此子章節。<\/li><li><code class=\"nl nr\">Buy Feature（購買特色）<\/code>：遊戲有 Buy Feature 時，說明購買價格、入口 Spin、FG 觸發方式與得分計算；沒有時可省略此子章節。<\/li><\/ul>\n<ul><li>§1～§9 的章節名稱與順序不得任意更動；遊戲沒有 FG 時，仍須保留 §6 並明確寫「不適用」或「不提供」。<\/li><li>可依各遊戲機制在固定章節下新增子章節，但不得改變核心章節順序。<\/li><li>規則必須以開發與測試可直接實作、驗證的方式描述，不得只使用宣傳文案或未定義的概念性敘述。<\/li><\/ul>\n<p>遊戲類型的統一命名規則見<a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範.md<\/a>第 1.1 節；Game Rule、Demogame 與 Help 必須使用相同術語。摘要如下（兩處不一致時以 Demogame規範 第 1.1 節為準）：<\/p>\n<ul><li>格式：<code class=\"nl nr\">Video Slot - &lt;主要派彩類型&gt; / &lt;附加機制&gt; / …<\/code>，例：<code class=\"nl nr\">Video Slot - 1,024 Ways / Cascade / Cascade Multiplier<\/code>。<\/li><li>主要派彩類型只能選一種，且必須與 §1 的 <code>中獎方式<\/code> 對應：<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>§1 <code class=\"nr\">中獎方式<\/code><\/th><th>遊戲類型的主要派彩類型<\/th><th>判定規則<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">Line Game<\/code><\/td><td><code class=\"nl nr\">N Lines<\/code>（<code class=\"nl\">N<\/code> 換成實際線數，例 <code class=\"nr\">20 Lines<\/code>）<\/td><td>依固定 Payline 判獎。<\/td><\/tr><tr><td><code class=\"nl nr\">Way Game<\/code><\/td><td><code class=\"nl nr\">N Ways<\/code>（<code class=\"nl\">N<\/code> 換成固定 Ways 或「最小–最大 Ways」，例 <code class=\"nr\">1,024 Ways<\/code>、<code class=\"nl nr\">2,025–32,400 Ways<\/code>）<\/td><td>相同符號由最左輪起，在連續相鄰輪出現即得獎。<\/td><\/tr><tr><td><code class=\"nl nr\">Pay Anywhere<\/code><\/td><td><code class=\"nl nr\">Pay Anywhere<\/code><\/td><td>相同符號在整個盤面的總數達門檻即得獎，不要求相鄰、連線或由最左輪開始。<\/td><\/tr><tr><td><code class=\"nl nr\">Cluster Pay<\/code><\/td><td><code class=\"nl nr\">Cluster Pay<\/code><\/td><td>相同符號依規定方向相鄰連接，且連接數量達門檻才得獎。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code class=\"nl nr\">Cascade<\/code>、<code class=\"nl nr\">Megaways<\/code>、<code class=\"nl nr\">Cascade Multiplier<\/code>、Multiplier 類與 Feature 類（例 <code class=\"nr\">Multiplier Wild<\/code>、<code class=\"nl nr\">OP Jackpot<\/code>）屬附加機制，接在主要派彩類型之後，不得代替主要派彩類型。<\/li><li>連消流程使用的得分倍數統一稱為 <code class=\"nr\">Cascade Multiplier<\/code>。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-文件格式與各章內容\">3. 文件格式與各章內容<\/h2>\n<p>本章把 §1～§9 每一章「要寫什麼、用什麼格式」寫成可直接照做的規格；不需參考任何既有遊戲的 <code>game_rule.md<\/code> 即可產出。<\/p>\n<h3 id=\"31-文件標頭與通用寫法\">3.1 文件標頭與通用寫法<\/h3>\n<ul><li>檔名固定為 <code class=\"nr\">game_rule.md<\/code>（UTF-8、繁體中文），放在遊戲專案根目錄：<code class=\"nl nr\">Slots/H0xx_&lt;遊戲中文名&gt;/game_rule.md<\/code>。<\/li><li>第一行標題固定為：<code class=\"nl nr\"># &lt;遊戲中文名稱&gt; (&lt;遊戲英文名&gt;) 遊戲規則說明<\/code>。<\/li><li>標題下可放 <code class=\"nr\">## 目錄<\/code>，以連結列出 §1～§9 與各附錄。<\/li><li>固定章節使用二級標題，保留 <code>§<\/code> 與編號，文字與第 2 節表格完全相同，例：<code class=\"nl nr\">## §6. 免費遊戲（Free Spins / Free Game, FG）<\/code>。<\/li><li>子章節使用三級標題、不帶 <code class=\"nr\">§<\/code>，例：<code class=\"nl nr\">### 6.1 觸發<\/code>、<code class=\"nl nr\">### 5.3 帶倍數 WILD<\/code>。<\/li><li>固定章節之間以 <code>---<\/code> 分隔。<\/li><li>符號一律以代號加反引號書寫（例 <code class=\"nr\">M1<\/code>、<code class=\"nl nr\">C1<\/code>、<code class=\"nl nr\">WW<\/code>），首次出現可附中文名（例 <code>WW<\/code> / 小鬼）；代號規則見第 3.2 節。<\/li><li>章節互相引用寫成 <code class=\"nl nr\">（§5.3）<\/code>、<code class=\"nl nr\">（§9.10）<\/code>。<\/li><li>規則用到的數學參數（權重表、輪帶表、工作表名）以反引號寫出，名稱必須與 Source XLSX 的工作表／參數名及 Config 鍵名一致（例 <code class=\"nr\">Table Selection Weight<\/code>、<code class=\"nl nr\">Multiplier_Wild_Weight_WW<\/code>），讓實作端能直接對到資料。<\/li><li>規則經使用者定案或改版時，在該條句尾註明日期與前值，例：<code class=\"nl nr\">（2026-10-13 使用者定案）<\/code>、<code class=\"nl nr\">（2026-11-12 起，原為 1X）<\/code>。<\/li><li>尚未確定的值標 <code class=\"nr\">⏳<\/code>，並列入文末「待確認事項」（第 3.12 節）。<\/li><li><strong class=\"nl nr\">不寫模擬實測數據<\/strong>：正文與附錄都不放模擬／實測結果（RTP、Hit Rate、FG 週期、出現率、平均倍數等）；Game Rule 只寫規則與設計參數，實測數據放數值報告或修改紀錄（2026-11-20 使用者）。<\/li><\/ul>\n<h3 id=\"32-符號代號\">3.2 符號代號<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>代號<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">M1<\/code>、<code class=\"nl nr\">M2<\/code>、<code class=\"nl nr\">M3<\/code>、<code class=\"nl nr\">M4<\/code>（更多時依序 <code class=\"nr\">M5<\/code>…）<\/td><td>高分符號；依同連線數的賠率由高到低編號。<\/td><\/tr><tr><td><code class=\"nl nr\">A<\/code>、<code class=\"nl nr\">K<\/code>、<code class=\"nl nr\">Q<\/code>、<code class=\"nl nr\">J<\/code>（更多時依序 <code class=\"nr\">TE<\/code>、<code class=\"nl nr\">NI<\/code>）<\/td><td>低分符號；依賠率由高到低排列。<\/td><\/tr><tr><td><code class=\"nl nr\">WW<\/code><\/td><td>一般 Wild。<\/td><\/tr><tr><td><code class=\"nl nr\">W2<\/code>、<code class=\"nl nr\">W3<\/code><\/td><td>第二、第三種 Wild（例：分裂 Wild、黏著 Wild、帶倍數的特殊 Wild）。<\/td><\/tr><tr><td><code class=\"nl nr\">C1<\/code><\/td><td>Scatter（觸發 FG、彩金等）。Game Rule 一律寫 <code class=\"nr\">C1<\/code>，<strong class=\"nl nr\">不用 <code>SC<\/code><\/strong>（程式統計欄位如 <code>special_symbol_cnt<\/code> 說的 <code>SC<\/code> 即指 <code class=\"nr\">C1<\/code>）（2026-11-20 使用者）。<\/td><\/tr><tr><td><code class=\"nl nr\">C2<\/code>、<code class=\"nl nr\">C3<\/code>…<\/td><td>Wild 與 Scatter 以外的特殊符號（例：倍數符號、收集符號）。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>同賠率的符號依畫面順序排列。<\/li><li>符號的「附加狀態」（金框、黏著、倍數標記等）不是獨立符號時，必須明寫「不是符號，是套在一般符號上的旗標」，並說明它是否出現在物理輪帶、是否影響判獎與賠率。<\/li><li>每個代號都要在附錄 A 對到 Config <code>symbol_names<\/code> 的 Symbol ID（數字）。<\/li><\/ul>\n<h3 id=\"33-1-遊戲基本資訊\">3.3 §1. 遊戲基本資訊<\/h3>\n<p>使用兩欄表格 <code class=\"nr\">| 項目 | 說明 |<\/code>，列順序如下：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>必要<\/th><th>填寫方式<\/th><th>範例<\/th><\/tr><\/thead><tbody><tr><td>遊戲名稱（內部代號）<\/td><td>建議<\/td><td><code class=\"nl nr\">&lt;中文名&gt;（H0xx）<\/code><\/td><td><code class=\"nl nr\">範例遊戲（H0xx）<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">Game ID<\/code><\/td><td>必要<\/td><td>上線用 Game ID，依公司遊戲代號清單填，不得自編；查不到時留空並列入待確認事項<\/td><td><code class=\"nl nr\">10xxxx<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">PARsheet ID<\/code><\/td><td>必要<\/td><td>基礎數學模型代號 <code class=\"nr\">H0xx1<\/code>（A／B 兩套基礎數學時 <code class=\"nr\">H0xx1A<\/code>、<code class=\"nl nr\">H0xx1B<\/code>）；可附 Source 檔與已建立的 RTP／Variant<\/td><td><code class=\"nl nr\">H0xx1（Source/H0xx1.xlsx）<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">遊戲中文名稱<\/code><\/td><td>必要<\/td><td>內部中文名<\/td><td><code class=\"nl nr\">範例遊戲<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">遊戲英文名<\/code><\/td><td>必要<\/td><td>正式英文名<\/td><td><code class=\"nl nr\">Sample Game<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">遊戲類型<\/code><\/td><td>必要<\/td><td>第 2 節格式<\/td><td><code class=\"nl nr\">Video Slot - 1,024 Ways / Cascade / Cascade Multiplier<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">盤面規格<\/code><\/td><td>必要<\/td><td>輪數 × 列數；各輪列數不同時逐輪寫出<\/td><td><code class=\"nl nr\">5 輪 × 4 列固定盤面<\/code>、<code class=\"nl nr\">6 輪 × 3-4-5-5-4-3 列<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">中獎方式<\/code><\/td><td>必要<\/td><td>只能填 <code class=\"nr\">Line Game<\/code>／<code class=\"nl nr\">Way Game<\/code>／<code class=\"nl nr\">Pay Anywhere<\/code>／<code class=\"nl\">Cluster Pay<\/code> 其一<\/td><td><code class=\"nl nr\">Way Game<\/code><\/td><\/tr><tr><td>最小 / 最大 Ways<\/td><td>Way Game 必要<\/td><td>Ways 數與計算式；Line Game 改寫線數或「不適用」<\/td><td><code class=\"nl nr\">最大 1,024 Ways（4 × 4 × 4 × 4 × 4）<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">押注模式<\/code><\/td><td>必要<\/td><td>列出全部模式與價格，沒有的模式寫「無」<\/td><td><code class=\"nl nr\">Normal Bet；Extra Bet 2 × Bet；Buy Feature N × Bet<\/code><\/td><\/tr><tr><td>Max Win<\/td><td>建議<\/td><td>固定倍數，或「由卡片系統倍率上限決定（見 §9.x）」<\/td><td><code class=\"nl nr\">由卡片系統的倍率上限決定，見 §9.10<\/code><\/td><\/tr><tr><td>彩金<\/td><td>有彩金時必要<\/td><td>彩金種類與章節位置；沒有寫「無」<\/td><td><code class=\"nl nr\">OP Jackpot 四階，見 §5.x<\/code><\/td><\/tr><tr><td>致敬遊戲／對標競品<\/td><td>有時填<\/td><td>廠商 - 遊戲名<\/td><td><code class=\"nl nr\">&lt;廠商&gt; - &lt;遊戲名&gt;<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>表格下方加 <code class=\"nr\">補充說明：<\/code> 條列：衍生自哪款前作及沿用／新增的項目、數學模型來源（<code class=\"nl nr\">Source/H0xx1*.xlsx<\/code>）、Coin／Credit 基準（例：<code class=\"nl nr\">Coin / Credit 基準為 100；Help 顯示賠率以 100 Credit Bet 為基準<\/code>）。<\/p>\n<h3 id=\"34-2-盤面結構\">3.4 §2. 盤面結構<\/h3>\n<ol><li>盤面示意圖：以 <code>text<\/code> 程式碼區塊畫 ASCII 格狀圖，輪數與各輪列數照實際；各輪不等高時要畫出形狀。範本（5 輪 × 4 列）：<\/li><\/ol>\n<pre><code>   R1   R2   R3   R4   R5\n   ↓    ↓    ↓    ↓    ↓\n┌────┬────┬────┬────┬────┐\n│    │    │    │    │    │\n├────┼────┼────┼────┼────┤\n│    │    │    │    │    │\n├────┼────┼────┼────┼────┤\n│    │    │    │    │    │\n├────┼────┼────┼────┼────┤\n│    │    │    │    │    │\n└────┴────┴────┴────┴────┘<\/code><\/pre>\n<ol><li>示意圖下方條列，必須逐項交代：<ul><li>輪數、每輪可見列數、總格數；有無 Extra Reel（有則寫位置、格數與作用）。<\/li><li>得分方向與最少成立條件（例：由 R1 起向右連續至少 3 輪）。<\/li><li>Ways／線數的計算方式（例：同輪多顆相同符號相乘；固定線則附線型或寫明線數）。<\/li><li>同一符號同時成立不同長度時只付最長（或依本作實際規則）。<\/li><li>補牌方式，只能擇一並寫清楚：<strong class=\"nl nr\">原地補牌<\/strong>（被消除的格子原位補新符號，其餘不動）或<strong class=\"nr\">重力掉落<\/strong>（剩餘符號往下掉，空位由上方補入）；補牌依哪一張權重表抽取；補牌是否限制某些符號（例：該輪已有 <code>C1<\/code> 不再補 <code class=\"nr\">C1<\/code>）。<\/li><\/ul><\/li><\/ol>\n<h3 id=\"35-3-符號類別\">3.5 §3. 符號類別<\/h3>\n<ul><li><code class=\"nl nr\">### 3.1 一般符號<\/code>：表格 <code class=\"nr\">| 類別 | 符號 |<\/code>，至少兩列「高分符號」「低分符號」；表下條列寫符號尺寸（全部 1×1 或有大符號）、附加狀態（第 3.2 節）。<\/li><li><code class=\"nl nr\">### 3.2 特殊符號<\/code>：表格 <code class=\"nr\">| 符號 | 出現位置 | 行為 |<\/code>，每個特殊符號一列：<ul><li>出現位置：哪些輪可出現、是否自然出現在輪帶、同輪可否多顆、或只由其他機制產生。<\/li><li>行為：替代範圍（替代哪些、不替代哪些）、有無自身賠率、是否參與連線、是否會被消除、觸發什麼（引用章節）。<\/li><\/ul><\/li><li>表下條列補充跨符號限制（例：<code class=\"nl nr\">R1 永不出現 Wild<\/code>、<code class=\"nl nr\">C1 不被 Wild 替代<\/code>）。<\/li><\/ul>\n<h3 id=\"36-4-賠率表pay-table\">3.6 §4. 賠率表（Pay Table）<\/h3>\n<ul><li>表上方標明單位，例：<code class=\"nl nr\"><strong>單位：Credit；以 100 Credit Bet 顯示。<\/strong><\/code>。Config 的 <code>pays<\/code> 以「× 總押注」記錄，等於表值 ÷ 100（例：表值 <code>25<\/code> → <code class=\"nr\">0.25<\/code>）。<\/li><li>Line／Way Game 表格欄位：<code class=\"nl nr\">| 符號 | 3 連 | 4 連 | 5 連 |<\/code>（連線數依本作，<strong class=\"nl nr\">短在左、最長在右<\/strong>，與 Config <code>pays<\/code> 由短到長一致；2026-11-20 使用者）；Pay Anywhere／Cluster Pay 以得分數量分欄（例 <code class=\"nr\">8–9 顆<\/code>、<code class=\"nl nr\">10–11 顆<\/code>、<code class=\"nl nr\">12+ 顆<\/code>）。<\/li><li>只列會派彩的符號；Wild、Scatter 等沒有賠率的符號不進表，在表下寫明「無派彩」或其派彩方式（Scatter Pay）。<\/li><li>表下加 <code class=\"nr\">計算規則：<\/code> 條列，必須包含：<ul><li>單一得分的完整公式，列出所有乘數與相乘順序，例：<code class=\"nl nr\">賠率 × 該符號 Ways 數量 × Bet 基準 × Cascade Multiplier × &lt;其他倍數&gt;<\/code>。<\/li><li>每個倍數的定義與無倍數時的值（例：總和為 0 時視為 <code class=\"nr\">×1<\/code>）。<\/li><li>多個符號同時中獎時各自計算後相加。<\/li><li>是否提供 Scatter Pay。<\/li><\/ul><\/li><\/ul>\n<h3 id=\"37-5-核心特色\">3.7 §5. 核心特色<\/h3>\n<ul><li>每個機制一個子章節（<code class=\"nl nr\">### 5.1<\/code>、<code class=\"nl nr\">### 5.2<\/code>…），每個子章節必須寫出：產生或觸發條件、出現範圍（哪些輪、哪些格、BG／FG 是否不同）、抽取使用的權重表名稱、效果、數值範圍、與其他機制的先後，以及至少一個帶數字的算例（例：<code class=\"nl nr\">Cascade Multiplier ×3、用到 ×2 與 ×5 兩顆 WILD → 該波 ×21（3 × (2 + 5)）<\/code>）。<\/li><li>有 Cascade 的遊戲必須有「Cascade 消除與補位」子章節（消除範圍、同格多線只消一次、哪些符號不消除、何時結束）。<\/li><li>有倍數階梯時用表格列出各模式的每一階：<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th class=\"n\">第 1 次中獎<\/th><th class=\"n\">第 2 次中獎<\/th><th class=\"n\">第 3 次中獎<\/th><th class=\"n\">第 4 次中獎<\/th><th class=\"n\">第 5 次起<\/th><\/tr><\/thead><tbody><tr><td>Base Game<\/td><td class=\"n\">×a<\/td><td class=\"n\">×b<\/td><td class=\"n\">×c<\/td><td class=\"n\">×d<\/td><td class=\"n\">×e<\/td><\/tr><tr><td>Free Game<\/td><td class=\"n\">×f<\/td><td class=\"n\">×g<\/td><td class=\"n\">×h<\/td><td class=\"n\">×i<\/td><td class=\"n\">×j<\/td><\/tr><\/tbody><\/table><\/div>\n<p>並寫明：何時推進、到頂是否停留、何時重置（每 Spin／每場 FG）、無中獎是否推進。<\/p>\n<ul><li>一次 Cascade 內有兩個以上步驟時（結算、消除、轉換、補牌、分裂…），必須有「處理順序」子章節，以編號列出固定執行順序。<\/li><li>有彩金（如 OP Jackpot）時另開子章節（或獨立章節），寫明：彩金階級、觸發符號與判定時機（每一轉或只看最終盤面）、與 FG 同時成立時的先後、解鎖押注門檻、小遊戲流程、是否計入一般 win 與 Max Win、參數來源。<\/li><\/ul>\n<h3 id=\"38-6-免費遊戲free-spins-free-game-fg\">3.8 §6. 免費遊戲（Free Spins / Free Game, FG）<\/h3>\n<p>固定三個子章節；遊戲沒有 FG 時保留 §6 並只寫「本作不提供 Free Game（不適用）」。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>子章節<\/th><th>必須寫明<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">### 6.1 觸發<\/code><\/td><td>觸發符號與數量門檻、判定時機（例：所有 Cascade 結束後的最終盤面）、給幾場（是否依數量不同）、位置限制。<\/td><\/tr><tr><td><code class=\"nl nr\">### 6.2 FG 玩法<\/code><\/td><td>與 BG 相同／不同的規則、選表方式、進場盤面（沿用 BG 最後盤面或重新產生）、倍數起始值、Bet 固定為觸發時 Bet、結束後回到 BG 的狀態。<\/td><\/tr><tr><td><code class=\"nl nr\">### 6.3 Retrigger（加局）<\/code><\/td><td>條件、加幾場、最後一場可否 Retrigger、單次 FG 總場數上限、加場超過上限時的處理（例：只加到上限、多的切掉）。<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"39-7-核心遊戲流程base-game\">3.9 §7. 核心遊戲流程（Base Game）<\/h3>\n<p>以編號清單依實際執行順序寫出一局 BG，至少涵蓋：開始 Spin（扣款）→ 選表（依 <code class=\"nr\">Table Selection Weight<\/code>）→ 產生初始盤面 → 倍數初始化 → 特殊符號統計／彩金判定 → 判獎 → 無中獎則結束 Cascade → 有中獎則計分 → 消除／轉換／補牌（引用處理順序章節）→ 倍數推進 → 回到判獎 → 最終盤面判定 FG 觸發 → Max Win 截斷。每一步寫「做什麼」與「依哪一節規則」，例：<code class=\"nl nr\">8. 若有中獎，依 §4 計算並累加本次 Cascade 得分。<\/code><\/p>\n<h3 id=\"310-8-押注模式\">3.10 §8. 押注模式<\/h3>\n<ul><li>可先放總表 <code class=\"nr\">| 模式 | 價格 | 內容 |<\/code>，再依模式分子章節：<code class=\"nl nr\">### 8.1 Extra Bet（額外投注）<\/code>、<code class=\"nl nr\">### 8.2 Buy Feature（購買特色）<\/code>，有時再加 <code class=\"nr\">### 8.3 Super Feature<\/code>、<code class=\"nl nr\">### 8.x 批次購買操作<\/code>；遊戲沒有的模式寫「不提供」或省略該子章節（依第 2 節規定）。<\/li><li>每個模式必須寫明：<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>價格／扣款<\/td><td><code class=\"nl nr\">N × Bet<\/code>。<\/td><\/tr><tr><td>模式代號<\/td><td>程式與 Config 使用的 <code>bet_mode<\/code> 整數：新遊戲固定 <code>0<\/code>＝NB、<code class=\"nl\">1<\/code>＝EB、<code class=\"nl\">2<\/code>＝EB2、<code class=\"nl\">3<\/code>＝BF、<code class=\"nl\">4<\/code>＝SF（沒有的模式跳過不補位）；既有遊戲維持原代號（2026-11-20 使用者）。另有平台端代號時一併寫出。<\/td><\/tr><tr><td>與 Normal Bet 的差異<\/td><td>盤面、選表、判獎、FG 規則哪些相同、哪些不同（例：FG 出現率為 Normal Bet 的 N 倍，由卡片系統控制）。<\/td><\/tr><tr><td>RTP 與倍率分母<\/td><td>RTP 以該模式實際押注為分母；卡片倍率判定以 Normal Bet 底注為分母。<\/td><\/tr><tr><td>進場方式（BF／SF）<\/td><td>進場盤面如何產生（專用輪帶表名稱）、保證條件（例：保證 <code class=\"nr\">C1 &gt;= 3<\/code>、保證進場盤不得分）、進場後給幾場 FG、FG 使用哪組參數。<\/td><\/tr><tr><td>可購買條件（BF／SF）<\/td><td>例：<code class=\"nl\">N × Bet &lt;= 餘額<\/code> 才可點擊，否則按鈕壓灰。<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"311-9-邊界-例外情境edge-cases\">3.11 §9. 邊界 / 例外情境（Edge Cases）<\/h3>\n<ul><li>依本作機制分類為 <code class=\"nr\">### 9.1<\/code>、<code class=\"nl nr\">### 9.2<\/code>…，常用分類：特色符號／Wild、倍數、Scatter、Free Game、Buy Feature、判獎計算（Ways／Line）、Cascade、彩金、Max Win、輪帶配置限制（數學前置條件）。<\/li><li>每條格式：<code class=\"nl nr\">* <strong>9.k.n 標題<\/strong>：可直接寫成測試案例的敘述。<\/code>，例：<code class=\"nl nr\">* <strong>9.5.3 上限 50 場<\/strong>：Retrigger 加場後超過 50 場時只加到 50 場，多出的場次切掉。<\/code><\/li><li>Max Win 分類必須寫明：上限來源（固定倍數或卡片系統倍率上限）、統計範圍（單一 Spin 含其觸發的全部 FG 場次）、達上限的處理（立即結束並以上限派彩）、Card System Off 是否套用、彩金是否納入。<\/li><li>輪帶配置限制必須寫明哪些符號不得出現在物理輪帶、專用輪帶（如 BF 進場表）必須保證的條件。<\/li><\/ul>\n<h3 id=\"312-附錄與待確認事項\">3.12 附錄與待確認事項<\/h3>\n<p>§9 之後依需要加入下列附錄，標題固定：<\/p>\n<ul><li><code class=\"nl nr\">## 附錄 A. 詞彙對照<\/code>：表格欄位為「本文用語／程式 / 數學模型代號／英文／前端 / 規格書用語」；符號列的代號欄寫 <code class=\"nr\">代號（ID n）<\/code>，例 <code class=\"nr\">WW（ID 0）<\/code>，ID 與 Config <code>symbol_names<\/code> 一致。<\/li><li><code class=\"nl nr\">## 附錄 B. 文件來源 / 參考<\/code>：表格欄位為「來源／內容」，列出前端規格書、前作 game_rule、數學模型等來源；下接 <code class=\"nr\">### 來源優先級<\/code>，以編號清單寫：1. 本 <code class=\"nr\">game_rule.md<\/code>（玩法正式來源）；2. <code class=\"nr\">Source/H0xx1*.xlsx<\/code>（數值正式來源）；3. 前端遊戲規格書（演出與 UI）。<\/li><li>決策紀錄（放在附錄 B 內）：每次決策一節 <code class=\"nr\">### YYYY-MM-DD &lt;主題&gt;<\/code>，表格欄位為「#／爭點／決策／影響章節」或「項目／調整前／調整後」，最後寫影響章節與需要同步的檔案。<\/li><li>與前端規格書的差異紀錄（放在附錄 B 內）：表格欄位為「項目／規格書／本文件／原因」。<\/li><li><code class=\"nl nr\">## 待確認事項<\/code>：表格欄位為「#／問題／決議」；未決的寫 <code class=\"nr\">⏳<\/code>，決議後填結論與日期。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-最小範本\">4. 最小範本<\/h2>\n<p>新遊戲可由下列骨架開始（<code class=\"nl\">&lt;…&gt;<\/code> 依本作替換，不適用的子章節依第 2、3 章規定處理）：<\/p>\n<pre><code># &lt;遊戲中文名稱&gt; (&lt;遊戲英文名&gt;) 遊戲規則說明\n\n## §1. 遊戲基本資訊\n\n| 項目 | 說明 |\n| --- | --- |\n| 遊戲名稱（內部代號） | &lt;中文名&gt;（H0xx） |\n| Game ID | &lt;10xxxx&gt; |\n| PARsheet ID | H0xx1 |\n| 遊戲中文名稱 | &lt;中文名&gt; |\n| 遊戲英文名 | &lt;英文名&gt; |\n| 遊戲類型 | Video Slot - &lt;N Ways&gt; / &lt;附加機制&gt; |\n| 盤面規格 | &lt;5&gt; 輪 × &lt;4&gt; 列固定盤面 |\n| 中獎方式 | Way Game |\n| 最小 / 最大 Ways | 最大 &lt;1,024&gt; Ways |\n| 押注模式 | Normal Bet；Extra Bet &lt;2&gt; × Bet；Buy Feature &lt;N&gt; × Bet |\n| Max Win | 由卡片系統的倍率上限決定，見 §9.x |\n| 彩金 | &lt;無／OP Jackpot，見 §5.x&gt; |\n\n---\n\n## §2. 盤面結構\n（ASCII 示意圖＋第 3.4 節條列）\n\n---\n\n## §3. 符號類別\n### 3.1 一般符號\n### 3.2 特殊符號\n\n---\n\n## §4. 賠率表（Pay Table）\n**單位：Credit；以 100 Credit Bet 顯示。**\n| 符號 | 3 連 | 4 連 | 5 連 |\n| --- | ---: | ---: | ---: |\n| `M1` | &lt;c&gt; | &lt;b&gt; | &lt;a&gt; |\n\n計算規則：\n* 單一得分 = &lt;公式&gt;\n\n---\n\n## §5. 核心特色\n### 5.1 &lt;機制名&gt;\n### 5.x 處理順序\n\n---\n\n## §6. 免費遊戲（Free Spins / Free Game, FG）\n### 6.1 觸發\n### 6.2 FG 玩法\n### 6.3 Retrigger（加局）\n\n---\n\n## §7. 核心遊戲流程（Base Game）\n1. &lt;步驟&gt;\n\n---\n\n## §8. 押注模式\n### 8.1 Extra Bet（額外投注）\n### 8.2 Buy Feature（購買特色）\n\n---\n\n## §9. 邊界 / 例外情境（Edge Cases）\n### 9.1 &lt;分類&gt;\n* **9.1.1 &lt;標題&gt;**：&lt;可驗證敘述&gt;\n\n---\n\n## 附錄 A. 詞彙對照\n## 附錄 B. 文件來源 / 參考\n## 待確認事項<\/code><\/pre>\n<\/div><div class=\"sec-card\"><h2 id=\"5-交付檢查\">5. 交付檢查<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">game_rule.md<\/code> 已涵蓋所有實際支援的玩法、模式與 Feature。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 已依本節規定的 §1～§9 基本格式建立，固定章節、順序與表格形式完整。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §1 已包含 Game ID、PARsheet ID、中英文名稱、遊戲類型、盤面規格、中獎方式與押注模式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §8 已依實際支援內容完整說明 Extra Bet 與 Buy Feature。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 判獎順序、倍率分母、觸發條件、結束條件與上限均可直接實作及測試。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Rule 與數學模型、Config、Simulator、Demogame 及 Help 的規則一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 標題、章節標題、子章節編號與分隔線符合第 3.1 節。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">遊戲類型<\/code> 符合 <code class=\"nr\">Video Slot - &lt;主要派彩類型&gt; / &lt;附加機制&gt;<\/code>，且主要派彩類型與 <code>中獎方式<\/code> 對應（第 2 節）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 符號代號符合第 3.2 節，附錄 A 每個代號都有 Config <code>symbol_names<\/code> 的 Symbol ID。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §2 含 ASCII 示意圖，並寫明得分方向、Ways／線數計算與補牌方式（原地補牌或重力掉落）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §4 標明單位，計算規則列出完整公式、乘數順序與無倍數時的值。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §5 每個機制都寫明觸發條件、範圍、權重表名稱、效果與至少一個數字算例；有 Cascade 時有「處理順序」。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §6 的觸發、FG 玩法、Retrigger（含場數上限與超過上限處理）齊全，或明寫不適用。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §8 每個模式都寫明價格、<code class=\"nl\">bet_mode<\/code> 代號、與 Normal Bet 的差異、RTP 與倍率分母；BF／SF 寫明進場方式與保證條件。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> §9 每條都以 <code>9.k.n<\/code> 編號且可直接寫成測試案例；Max Win 五項（來源、範圍、處理、Card Off、彩金）齊全。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 未確定的值標 <code>⏳<\/code> 並列入「待確認事項」。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 正文與附錄沒有模擬實測數據；Scatter 寫 <code class=\"nr\">C1<\/code>（不用 <code class=\"nr\">SC<\/code>）；§4 賠率表短在左、最長在右。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-report\" hidden><div class=\"sec-head\"><h1 id=\"數值報告規範\">數值報告規範<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>卡片權重完成後（開發流程步驟 2.4 遊戲調性調整），產出數值報告（即本作與競品、前作的差異分析），比較本作與競品（及使用者指定的前作）的玩法指標，作為調性是否到位的依據。<\/p>\n<p>本規範自足：照本文的名詞、指標定義、md 骨架、圖表資料格式與附錄 A 的 HTML 外殼，不需參考任何過去報告即可產出。文中遊戲名（Super Ace、Lucky Diamond 等）只是「例」，規則以文字為準。<\/p>\n<p><strong class=\"nl nr\">名詞<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>意思<\/th><\/tr><\/thead><tbody><tr><td>本作／競品／前作／同系列<\/td><td>本作＝這次要出報告的遊戲；競品＝對標的他廠遊戲（預設為規則基底遊戲）；前作＝使用者指定的自家舊作；同系列＝同 IP／同玩法的自家作品<\/td><\/tr><tr><td>NB／EB／BF／SF<\/td><td>押注模式：Normal Bet（一般）、Extra Bet（加注）、Buy Feature（購買免費遊戲）、Super Feature（較貴的購買）<\/td><\/tr><tr><td>BG／FG<\/td><td>Base Game（一般遊戲，付費的那一轉含其所有連消）／Free Game（免費遊戲）<\/td><\/tr><tr><td>局／轉／場<\/td><td>局＝一次付費下注（含連消，不含觸發後的 FG）；轉＝一次免費轉；場＝一次 FG 從觸發到結束（含加局）<\/td><\/tr><tr><td>底注<\/td><td>一次 NB 下注金額；所有「x 倍」都以底注為分母（BF／SF／EB 也一樣），只有 RTP 與標準差用各模式的實際押注或購買價<\/td><\/tr><tr><td>Card-On／Card-Off（自然）<\/td><td>Card-On＝套用卡片權重（正式 RTP／Variant 的 config）後的模擬；Card-Off＝不套卡片、只有輪帶與規則的「自然機率」<\/td><\/tr><tr><td>Oldhand／Newbie<\/td><td>卡片 Profile：老手／新手；數值報告一律用 Oldhand<\/td><\/tr><tr><td>92A、94B…<\/td><td>RTP 檔位＋版本（92% A 版），對應 <code>config_01A.js<\/code> 的 <code>92A<\/code> 層級<\/td><\/tr><tr><td>Record 報表<\/td><td>Simulator 輸出的 xlsx（放 <code class=\"nr\">Record/<\/code>），檔名格式 <code class=\"nr\">&lt;MathID&gt;_&lt;版本8碼&gt;_&lt;時間&gt;_betmode&lt;N&gt;_&lt;log10局數&gt;&lt;…&gt;_&lt;RTP萬分位&gt;_&lt;profile&gt;_&lt;bet 層級&gt;_card.xlsx<\/code>；<code class=\"nl\">betmode0<\/code>＝NB、<code class=\"nl\">1<\/code>＝EB、<code class=\"nl\">2<\/code>＝BF、<code class=\"nl\">3<\/code>＝SF；Card-Off 報表無 <code class=\"nr\">_card<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">檔案與格式<\/strong><\/p>\n<ul><li>檔名：md 為 <code class=\"nr\">個人筆記/數值報告.md<\/code>，HTML 為專案根目錄 <code class=\"nr\">report.html<\/code>（與 <code>index.html<\/code> 同層），兩份內容一致；不另取其他檔名（2026-11-03 起；舊名 <code class=\"nr\">其他/數值報告_&lt;遊戲中文名&gt;.md／.html<\/code>）。舊名 <code>差異分析_&lt;遊戲中文名&gt;<\/code> 一律改為此名。<\/li><li>遊戲名稱一律用英文名（例：Super Diamond、Super Ace、Lucky Ace），不用 H0xx 代號。<\/li><li><strong class=\"nl nr\">頁首照競品分析報告<\/strong>（2026-11-09 起）：上方小字 <code class=\"nr\">Omniplay · 數值報告<\/code>（遊戲商一律 Omniplay），大標題＝<code class=\"nr\">&lt;遊戲中文名&gt; &lt;遊戲英文名&gt;<\/code>（例：<code class=\"nl nr\">超級鑽石 Lucky Diamond<\/code>；英文名取 <code>game_rule.md<\/code> 的「遊戲英文名」，缺的不顯示），由 <code>_report_card_style.py<\/code> 自動寫入；KPI 列用競品報告的細框格子。<code class=\"nl\">&lt;title&gt;<\/code> 與 md 的 <code>#<\/code> 標題維持 <code class=\"nr\">數值報告_&lt;遊戲中文名&gt;<\/code>。不寫「A vs B vs C」；比較對象改在「基本資訊」章交代。<\/li><li>章節（頁簽）名稱照下表「必要章節」的中文名，不加英文括號（例：寫「連消分布」，不寫「連消分布（Combo）」）。<\/li><li>HTML 最上方放「← 返回 Demo」，連回 <code class=\"nr\">./index.html<\/code>；從 Demo 點進來時改為回上一頁。Demo 的數值報告按鈕在同一分頁開啟，推上網頁後也能用瀏覽器上一頁返回。<\/li><li><strong class=\"nl nr\">新報告要收錄到 Omniplay 首頁<\/strong>：數值報告區不會自動掃描，第一次產出並推上 GitHub 後，在 <code>AI 工作區/Jumbo_Output/catalog.js<\/code> 的「數值報告」區加一筆（title 遊戲中文名、kind \"數值報告\"、url 用 rhino-boss.github.io 完整網址、game 代號、desc 一行「本作 vs 競品：主要章節」、date 產出日期），同時把 index.html／all.html 的 <code>?v=<\/code> 快取版號加一碼，再推上 Jumbo_Release。<\/li><li>HTML 版式同 <code>市場資訊/H5/遊戲資訊/<\/code> 的競品分析報告：每章一個頁簽、頁簽只排一列可橫拉但不顯示拉條；表格儲存格不換行，表格放不下時左右拖曳捲動（不顯示拉條，2026-11-20 使用者）。版式已完整寫在附錄 A（外殼）與 <code class=\"nr\">_report_card_style.py<\/code>（卡片版型），不需開競品報告參考。<\/li><li><strong class=\"nl nr\">重產網頁<\/strong>：<code class=\"nl\">py -X utf8 專案需知/其他/_report_build.py &lt;專案&gt;/report.html [曲線.json]<\/code> 由 <code>個人筆記/數值報告.md<\/code> 重畫報告頁簽、倍率線型（md 的 <code class=\"nr\">&lt;!--CHART:key--&gt;<\/code>，資料 json 格式見腳本說明）與頁首 KPI，並自動套卡片版型。<\/li><li><strong class=\"nl nr\">手機版字級<\/strong>（2026-11-20）：<code class=\"nl\">html<\/code> 設 <code class=\"nr\">text-size-adjust:100%<\/code>，表格內的字不讓 iOS 自動放大，跟內文同字級；由 <code>_report_card_style.py<\/code> 寫入。<\/li><li><strong class=\"nl nr\">卡片版型<\/strong>：HTML 產出後一律跑 <code class=\"nr\">py -X utf8 專案需知/其他/_report_card_style.py &lt;專案&gt;/report.html<\/code>：淺灰底＋圓角卡片（深色模式為深灰卡片）、膠囊頁簽、競品報告式頁首與 KPI 格，每節（<code class=\"nl nr\">###<\/code>）一張卡片；倍率線型的圖例每一條線都可點選開關。可重複執行，重產 HTML 後再跑一次即可。<\/li><li><strong class=\"nl nr\">自動頁簽<\/strong>：<code class=\"nl\">_report_card_style.py<\/code> 同時產生三個頁簽（單跑：<code class=\"nl nr\">_report_notes.py &lt;專案&gt;/report.html<\/code>），md 不重複內容：<strong class=\"nl nr\">玩法說明<\/strong>（第 2 頁，取 <code>game_help.md<\/code> 繁中規則說明與中文賠率表，不放 Game Meta、GAME RULE）、<strong class=\"nl nr\">修改紀錄<\/strong>（<code class=\"nl nr\">個人筆記/修改紀錄.md<\/code>）、<strong class=\"nl nr\">其他<\/strong>（<code class=\"nl\">個人筆記/上線觀察.md<\/code>＋<code class=\"nr\">注意事項.md<\/code>：上線觀察、開發注意事項、歷史錯誤紀錄）；頁簽號自動重編。改了這些 md 要重跑。<\/li><li>百分比表格套條件式橫條（同競品報告：同表共用刻度、最大值以強調色、合計列不畫）；表格內只放百分比，不附括號內的分子／分母。<\/li><\/ul>\n<p><strong class=\"nl nr\">比較口徑<\/strong><\/p>\n<ul><li>本作與前作一律用 <strong class=\"nr\">Card-On<\/strong>（正式 RTP／Variant、Oldhand）報表；競品用實機側錄資料。自然機率（Card-Off）只可作附加欄，不得當主比較欄。<\/li><li>模擬在模擬機執行（NB ≥ 10⁶ 局、BF ≥ 10⁵ 次），報表存 <code>Record/<\/code> 並在報告來源表列出檔名。<\/li><li>指標口徑與競品報告一致；口徑不同時（例：分母只算初始盤面）以競品口徑為準並在該節說明。<\/li><\/ul>\n<p><strong class=\"nl nr\">必要章節<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>章節<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1. 基本資訊<\/td><td>頁簽之外只留頁首。節的順序：<strong class=\"nl nr\">遊戲簡介<\/strong>（200 字內：盤面、怎麼贏、特色機制、FG 怎麼觸發、BF 價格，寫到玩家看完就懂規則）→ <strong>比較對象<\/strong> → <strong class=\"nr\">報告資訊<\/strong>。<strong class=\"nl\">比較對象<\/strong>表：固定三欄「類別｜遊戲｜為什麼比」、固定三列「競品／前作／同系列」；遊戲寫英文名＋廠商或版本（例：Money Coming（JILI）、Money Boost 1.0.0.2（原始版））；為什麼比用一句話說明比較目的；沒有的列遊戲欄填「—」並註明（例：目前沒有同系列作品。）。<strong class=\"nl nr\">報告抬頭資訊一律放在本章<\/strong>：產出日期、比較口徑（本作／前作／競品各用哪種資料、Profile）、本作版本與主要設定摘要（盤面表與選表比例、補牌與倍數規則、賠率、FG 階梯、BF 價格、EB、自然率門檻、Max Win 等）、<strong class=\"nl nr\">資料來源表<\/strong>（來源｜樣本數｜報表檔名）。<\/td><\/tr><tr><td>2. 玩法說明<\/td><td>自動頁簽：<code class=\"nl\">game_help.md<\/code> 的規則介紹（含賠率表），見上方「自動頁簽」。<\/td><\/tr><tr><td>3. 共同指標<\/td><td><strong class=\"nl nr\">基本指標<\/strong>（第一節，一張表）：<strong class=\"nl nr\">有「押注模式」表的遊戲，基本指標只列 NB<\/strong>，BF／SF 的價格、RTP、贏錢率、平均倍數、標準差、門檻週期、自然允許最大區間都只放押注模式表，不在基本指標重複（2026-11-20 使用者，H032）；Total RTP、BG／FG RTP、BG Hit Rate、FG Hit Rate（每轉）、FG 週期、FG 平均倍數，併入原「玩法深淺」的 NB 標準差、FG 標準差（每場，以押注計；2026-11-11 起）、≥1000x／≥5000x／≥10000x 週期，有 Buy Feature 再列 BF 價格、BF RTP、BF 贏錢率（贏分 &gt; 購買價）、BF 平均倍數、BF 標準差與高倍週期；競品／前作／同系列並列，沒有的填「—」；表後一句「平／深」結論（看標準差與存活中位數，平均把數由 RTP 決定不具鑑別度）。<strong class=\"nl nr\">第二節為存活模擬<\/strong>：1000 人各帶 1000 元、每把押 1 元玩 NB 至不夠下注，<strong class=\"nl nr\">以比例顯示<\/strong>：列＝第 1,000／5,000／10,000／20,000 把仍存活的玩家比例（2026-11-09 起）；以 Card-On 報表每局總得分分布（BG 非觸發局＋觸發局含觸發把）抽樣，註明抽樣方式。<\/td><\/tr><tr><td>4. 特殊指標<\/td><td>依遊戲機制挑選，每個指標一節（<code class=\"nl nr\">###<\/code>），BG／FG 用 <code class=\"nr\">####<\/code>。例：<strong class=\"nl nr\">金框比例<\/strong>：平均每盤金框數、每格金框率、有金框盤面占比、各輪金框率（BG／FG 分開）；<strong class=\"nl nr\">金框使用率<\/strong>：被消到而翻牌的金框數 ÷ 初始盤面金框數（BG／FG 分開）；<strong class=\"nl nr\">連消分布<\/strong>：BG 每局、FG 每轉的 0／1／2／3／4／5+ 次（不加 3+ 合計列）；<strong class=\"nl nr\">大鬼出現率<\/strong>：BG 每局、FG 每轉；並註明本作 BG 幾局一次、FG 每場幾次；<strong class=\"nl nr\">符號消除分布<\/strong>：各符號 3／4／5 連的 Hit Rate 與 RTP（BG／FG 分開）；<strong class=\"nl nr\">WILD 倍數分布<\/strong>：有帶倍數 Wild 的遊戲才需要：各種 Wild（如小鬼、大鬼本體、分裂）分開列各倍數占比。<\/td><\/tr><tr><td>5. 倍率線型<\/td><td>NB-BG、NB-FG、BF <strong>各一張<\/strong>折線圖（預設縱軸 BG 0–1%、FG／BF 0–16%；<strong class=\"nl nr\">滑鼠滾輪縮放縱軸、雙擊還原<\/strong>（手機等觸控裝置：兩指捏合縮放、點兩下還原，不放按鈕，2026-11-20），由 <code>_report_card_style.py<\/code> 內嵌 <code class=\"nr\">_chart_yzoom.js<\/code>，2026-11-09 起不再另畫放大圖），每張都含競品、前作、本作（卡片後，實線）與<strong class=\"nr\">本作自然機率（Card-Off，卡片前，同色虛線，預設隱藏、點圖例才顯示）<\/strong>；64 區間全標；縱軸固定（BG 0–1%、FG／BF 0–16%），<strong class=\"nl nr\">圖例可點選切換各線顯示／隱藏<\/strong>（關閉的圖例淡化加刪除線）；附 FG／BF 門檻機率表（含本作自然欄）；<strong class=\"nl nr\">滑鼠游標移到圖上鎖定該區間<\/strong>，畫垂直線並列出各線數值（隱藏的線不列）；<strong class=\"nl nr\">圖例只寫名稱＋版本<\/strong>（例：Super Ace、Super Diamond v5.0.0.0、Super Diamond v5.0.0.0 自然），不加括號說明；<strong class=\"nl nr\">圖下不加說明<\/strong>；<strong class=\"nl nr\">每個區間都畫點<\/strong>，機率 0 的點在 0 的位置，整條線全部連起來（不斷開）且<strong class=\"nr\">線半透明<\/strong>，超過縱軸上限的部分被圖框裁掉；<strong class=\"nl\">x 軸寫法<\/strong> <code class=\"nr\">0<\/code>、<code class=\"nl nr\">0 &lt; x &lt;= 1<\/code>、<code class=\"nl nr\">1 &lt; x &lt;= 2<\/code>…（整數不加小數點，有小數才寫）；<strong class=\"nl nr\">競品一律灰色<\/strong>，本作用彩色<\/td><\/tr><tr><td>6. 修改紀錄<\/td><td>自動頁簽（<code class=\"nl nr\">個人筆記/修改紀錄.md<\/code>），每個版本一節。<\/td><\/tr><tr><td>7. 其他<\/td><td>自動頁簽：上線觀察、開發注意事項、歷史錯誤紀錄（取自 <code class=\"nr\">個人筆記/上線觀察.md<\/code>、<code class=\"nl nr\">注意事項.md<\/code>）。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>特殊指標的版面（2026-11-11 起）：第一節「重點一覽」把單一數值的指標（平均、比例、使用率、Max／中位數／平均等）收成一張表；其餘每個分布一節、一張表，列＝分段，欄＝<code class=\"nr\">BG · 競品<\/code>、<code class=\"nl nr\">BG · 本作<\/code>、<code class=\"nl nr\">FG · 競品<\/code>、<code class=\"nl\">FG · 本作<\/code> 並排（只有 FG 的指標就兩欄），不再 BG／FG 各拆一張上下疊；表頭照「BG · 名稱」寫，<code class=\"nl\">_report_card_style.py<\/code> 會在 BG 與 FG 欄組之間自動留空。和競品比較的單一數值（重點一覽等），本作比競品好的用綠字、差的用紅字、相同不上色：md 儲存格結尾寫 <code class=\"nr\"> {+}<\/code>（好）或 <code class=\"nr\"> {-}<\/code>（差），<code class=\"nl\">_report_build.py<\/code> 會轉成顏色並去掉標記；好壞以玩家感受判斷，判斷方向寫在表下說明。<strong class=\"nl nr\">不加與競品的差（pp）欄、不加 3+ 等合計列<\/strong>；口徑說明寫在表前一句或重點一覽下方的條列。<\/p>\n<p>沒有對應機制的章節（例如無金框、無大鬼）可省略，但要在報告開頭註明；頁簽編號一律從 1 依序連號，省略章節後也重新連號（不沿用本表編號）。指標未達使用者設定的對標目標時，於回報中列出差距與可調的槓桿，由使用者決定是否調整；調整後重跑 Card-On 並重出數值報告。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"產生流程從零開始\">產生流程（從零開始）<\/h2>\n<ol><li><strong class=\"nl nr\">備資料<\/strong>：<ul><li>本作 Card-On 報表：NB（betmode0）必備；有 EB／BF／SF 各跑一份（betmode1／2／3）；Oldhand、中 Bet（<code class=\"nl nr\">medium_bet<\/code>）、主版本 92A（有 B 版另跑 92B）。<\/li><li>本作 Card-Off 自然報表：NB、BF（有 EB／SF 也跑），只用於倍率線型虛線與「自然允許最大區間」。<\/li><li>前作：同口徑 Card-On 報表（<code class=\"nl\">Record/<\/code> 內現成的即可，檔名寫進來源表）。<\/li><li>競品：實機側錄整理出的數據報告（<code class=\"nl nr\">遊戲數據_&lt;英文名&gt;.md<\/code>，由 game-data-report 產出；指標口徑同下方「指標定義」）。沒有的指標填「—」，不要自己估。<\/li><\/ul><\/li><li><strong class=\"nl nr\">寫 md<\/strong>：照下方「md 骨架」寫 <code class=\"nr\">個人筆記/數值報告.md<\/code>，數值照「指標定義」計算。<\/li><li><strong class=\"nl nr\">備圖表資料<\/strong>：照「倍率線型資料」產生 <code class=\"nr\">curves.json<\/code>（可放暫存區，不留在專案）。<\/li><li><strong class=\"nl nr\">建外殼（工具自動）<\/strong>：專案還沒有 <code>report.html<\/code> 時，第 5 步的 <code>_report_build.py<\/code> 會用附錄 A 的外殼（模板檔 <code class=\"nr\">專案需知/其他/_report_shell.html<\/code>）自動建立，不要手動貼：MathID 與中文名取自專案資料夾名 <code class=\"nr\">H0xx_中文名<\/code>，英文名取自 <code>game_rule.md<\/code> 的「遊戲英文名」；取不到時加 <code class=\"nr\">--id H045 --name 超級鑽石 --en \"Lucky Diamond\"<\/code>。已有 <code>report.html<\/code> 就沿用，不會重建。<\/li><li><strong class=\"nl nr\">重產網頁<\/strong>：<code class=\"nl nr\">py -X utf8 -B 專案需知/其他/_report_build.py &lt;專案&gt;/report.html curves.json<\/code>（會自動跑 <code class=\"nr\">_report_card_style.py<\/code>，產生玩法說明／修改紀錄／其他頁簽與卡片版型）。<\/li><li><strong class=\"nl nr\">檢查<\/strong>：瀏覽器開啟逐頁簽看（含手機寬度與深色模式），對照文末「交付檢查」。<\/li><li><strong class=\"nl nr\">收錄首頁<\/strong>：第一次產出時依「檔案與格式」把報告加進 Omniplay 首頁 catalog。<\/li><\/ol>\n<\/div><div class=\"sec-card\"><h2 id=\"md-骨架_report_buildpy-的讀取規則\">md 骨架（<code class=\"nl\">_report_build.py<\/code> 的讀取規則）<\/h2>\n<ul><li>第一行 <code class=\"nr\"># 數值報告_&lt;遊戲中文名&gt;<\/code>。<\/li><li>每章 <code class=\"nr\">## N. 章名<\/code>（N 從 1 連號）；<strong class=\"nl nr\">一章＝一個頁簽<\/strong>，頁簽名稱照章名。章名為「玩法說明」「修改紀錄」「其他」的章是自動頁簽，md 只留一行說明，內容不會被讀。<\/li><li>每節 <code>### 節名<\/code>＝一張卡片；節內再分 BG／FG 用 <code class=\"nr\">####<\/code>。章開頭、第一個 <code>###<\/code> 之前的文字是說明列（不成卡片，含表格或圖時才成卡片）。<\/li><li>表格用 GitHub 表格語法，數值欄對齊寫 <code class=\"nr\">---:<\/code>。一格只放一個值。<\/li><li>圖表位置寫 <code class=\"nr\">&lt;!--CHART:bg--&gt;<\/code>、<code class=\"nl nr\">&lt;!--CHART:fg--&gt;<\/code>、<code class=\"nl nr\">&lt;!--CHART:bf--&gt;<\/code>（key 對應 <code class=\"nr\">curves.json<\/code>），建議每張圖自己一個 <code>###<\/code> 節（卡片標題取代圖內標題）。<\/li><li>本作比競品好／差：儲存格結尾寫 <code class=\"nr\"> {+}<\/code>／<code class=\"nl nr\"> {-}<\/code>（只用於和競品比較的單一數值）。<\/li><li>頁首 KPI 自動取「基本指標」表<strong class=\"nr\">本作欄<\/strong>（表頭＝<code>game_rule.md<\/code> 的「遊戲英文名」，找不到用開頭相同的欄，再不行用第 2 欄）的這 8 列，列名必須<strong class=\"nr\">一字不差<\/strong>：<code class=\"nl nr\">Total RTP<\/code>、<code class=\"nl nr\">BG RTP<\/code>、<code class=\"nl nr\">FG RTP<\/code>、<code class=\"nl nr\">BG Hit Rate<\/code>、<code class=\"nl nr\">FG Hit Rate（每轉）<\/code>、<code class=\"nl nr\">FG 週期<\/code>、<code class=\"nl nr\">FG 平均倍數（每場）<\/code>、<code class=\"nl nr\">BF RTP<\/code>；值為空或「—」不顯示。<\/li><li>百分比橫條自動判斷：一欄中 ≥ 60% 的格子是「數字%」才畫；第一欄含「合計／總計／小計／Total」的列不畫；「基本指標」表不畫。<\/li><li>表格內數字格式：百分比 2 位小數（<code class=\"nl nr\">23.54%<\/code>，存活比例 1 位）；週期 <code class=\"nr\">1/150.0<\/code>（FG 週期 1 位小數；高倍週期取整數、千分位 <code class=\"nr\">1/341,661<\/code>）；倍數 <code class=\"nr\">37.71x<\/code>；標準差 2 位；局數、次數千分位。<\/li><\/ul>\n<p>最小範例（佔位符 <code>&lt;…&gt;<\/code> 換成實際內容；沒有的機制整節刪掉並在基本資訊註明）：<\/p>\n<pre><code># 數值報告_&lt;遊戲中文名&gt;\n\n## 1. 基本資訊\n\n### 遊戲簡介\n\n&lt;200 字內：盤面、怎麼贏、特色機制、FG 怎麼觸發、BF 價格&gt;\n\n### 比較對象\n\n| 類別 | 遊戲 | 為什麼比 |\n|---|---|---|\n| 競品 | &lt;英文名&gt;（&lt;廠商&gt;） | &lt;一句話比較目的&gt; |\n| 前作 | &lt;英文名&gt;（&lt;版本或代號&gt;） | &lt;一句話&gt; |\n| 同系列 | — | 目前沒有同系列作品。 |\n\n### 報告資訊\n\n產出日期：&lt;YYYY-MM-DD&gt;。比較口徑：**&lt;本作英文名&gt; 92A Card-On（Oldhand、中 Bet）** 對 &lt;競品&gt; 實機側錄；自然機率（Card-Off）只作附加欄與倍率線型虛線。\n\n&lt;本作英文名&gt; 設定（&lt;四碼版本&gt;）：&lt;盤面與選表比例、補牌與倍數規則、賠率、FG 階梯、BF 價格、EB、自然率門檻、Max Win…&gt;\n\n| 來源 | 樣本 | 檔案 |\n|---|---|---|\n| &lt;競品&gt;（&lt;廠商&gt; 實機側錄） | BG &lt;n&gt; 局、FG &lt;n&gt; 轉 | `&lt;側錄檔或數據報告&gt;` |\n| &lt;本作&gt; 92A Card-On | NB &lt;n&gt; 局、FG &lt;n&gt; 轉；BF &lt;n&gt; 次 | `&lt;Record 報表檔名&gt;` |\n| &lt;本作&gt; Card-Off 自然 | NB &lt;n&gt; 局 | `&lt;Record 報表檔名&gt;` |\n\n## 2. 玩法說明\n\n（HTML 頁簽自動取自 `game_help.md` 的繁中規則與賠率表，此處不重複。）\n\n## 3. 共同指標\n\n### 基本指標\n\n| 指標 | &lt;競品&gt; | &lt;本作&gt; | &lt;前作&gt; |\n|---|---:|---:|---:|\n| Total RTP | | | |\n| BG RTP | | | |\n| FG RTP | | | |\n| BG Hit Rate | | | |\n| FG Hit Rate（每轉） | | | |\n| FG 週期 | | | |\n| FG 平均倍數（每場） | | | |\n| NB 標準差（以押注計） | | | |\n| FG 標準差（每場，以押注計） | | | |\n| NB ≥1,000x 週期（底注，每局） | | | |\n| NB ≥5,000x 週期（底注，每局） | | | |\n| NB ≥10,000x 週期（底注，每局） | | | |\n\n&lt;一句「平／深」結論&gt;\n\n### 押注模式\n\n| 指標 | Normal Bet | Extra Bet | Buy Feature |\n|---|---:|---:|---:|\n| 價格（倍 Bet） | 1x | | |\n| Total RTP | | | |\n| …（列見「指標定義」押注模式表） | | | |\n\n### 存活模擬\n\n| 仍存活比例 | &lt;本作&gt; | &lt;前作&gt; |\n|---|---:|---:|\n| 第 1,000 把 | | |\n| 第 5,000 把 | | |\n| 第 10,000 把 | | |\n| 第 20,000 把 | | |\n\n&lt;抽樣方式一句＋平均把數、中位數&gt;\n\n## 4. 特殊指標\n\n口徑：&lt;資料來源與單位&gt;。\n\n### 重點一覽\n\n| 指標 | BG · &lt;競品&gt; | BG · &lt;本作&gt; | FG · &lt;競品&gt; | FG · &lt;本作&gt; |\n|---|---:|---:|---:|---:|\n| &lt;單一數值指標&gt; | | &lt;值&gt; {+} | | &lt;值&gt; {-} |\n\n- 顏色判斷方向：&lt;例：金框越多、使用率越高越好&gt;。\n- &lt;每個指標的口徑一句&gt;。\n\n### &lt;分布指標名&gt;\n\n&lt;口徑一句&gt;\n\n| &lt;分段&gt; | BG · &lt;競品&gt; | BG · &lt;本作&gt; | FG · &lt;競品&gt; | FG · &lt;本作&gt; |\n|---|---:|---:|---:|---:|\n\n## 5. 倍率線型\n\n&lt;顏色與線的說明一段：灰線競品、藍線本作、虛線自然預設隱藏&gt;\n\n### NB-BG 倍率線型\n\n每局（不含觸發 FG 的局）得分 ÷ 底注。\n\n&lt;!--CHART:bg--&gt;\n\n### NB-FG 倍率線型\n\n每場免費遊戲全程得分 ÷ 底注。\n\n&lt;!--CHART:fg--&gt;\n\n### BF 倍率線型\n\n每次購買全程得分 ÷ 底注。\n\n&lt;!--CHART:bf--&gt;\n\n### 門檻機率\n\n| 門檻 | FG · &lt;競品&gt; | FG · &lt;本作&gt; | FG · &lt;本作&gt; 自然 | BF · &lt;本作&gt; |\n|---|---:|---:|---:|---:|\n| &gt; 10x | | | | |\n| &gt; 20x | | | | |\n| &gt; 50x | | | | |\n| &gt; 100x | | | | |\n| &gt; 1,000x | | | | |\n\n## 6. 修改紀錄\n\n（HTML 頁簽自動取自 `個人筆記/修改紀錄.md`。）\n\n## 7. 其他\n\n（HTML 頁簽自動取自 `個人筆記/上線觀察.md`、`個人筆記/注意事項.md`：上線觀察、開發注意事項、歷史錯誤紀錄。）<\/code><\/pre>\n<\/div><div class=\"sec-card\"><h2 id=\"指標定義\">指標定義<\/h2>\n<p>所有指標（含高倍週期與標準差）一律以套卡片的模擬報表（Card-On Record）計算，不用卡片理論分布估算（2026-11-20 使用者）；欄位名指報表工作表 <code class=\"nr\">Overview<\/code>（Index／Value 兩欄）與 <code class=\"nr\">Multiplier Line<\/code>（每列一個倍率區間）。競品用側錄資料照同一定義計算。<\/p>\n<p><strong class=\"nl nr\">基本指標（NB 報表）<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>列名（照寫）<\/th><th>定義<\/th><th>報表來源<\/th><\/tr><\/thead><tbody><tr><td>Total RTP<\/td><td>總派彩 ÷ 總押注。有 OP Jackpot 時 Total 含彩金（Link＋Bonus），另加 <code class=\"nr\">Game RTP<\/code>（不含彩金）與 <code class=\"nr\">OP Jackpot RTP（Link＋Bonus）<\/code> 兩列<\/td><td><code class=\"nl nr\">rtp_total<\/code>、<code class=\"nl nr\">rtp_game<\/code>、<code class=\"nl nr\">rtp_link<\/code>、<code class=\"nl nr\">rtp_bonus<\/code><\/td><\/tr><tr><td>BG RTP<\/td><td>BG 派彩 ÷ 總押注<\/td><td><code class=\"nl nr\">rtp_bg<\/code><\/td><\/tr><tr><td>FG RTP<\/td><td>FG 全部派彩 ÷ <strong class=\"nr\">總押注<\/strong>（對 Total 的貢獻，不是 FG 內部回報率）<\/td><td><code class=\"nl nr\">rtp_fg<\/code><\/td><\/tr><tr><td>BG Hit Rate<\/td><td>BG 有得分（&gt; 0）的局數 ÷ 付費局數<\/td><td><code class=\"nl nr\">hit_rate_bg<\/code><\/td><\/tr><tr><td>FG Hit Rate（每轉）<\/td><td>有得分的免費轉 ÷ 免費轉總數<\/td><td><code class=\"nl nr\">hit_rate_fg<\/code><\/td><\/tr><tr><td>FG 週期<\/td><td>付費局數 ÷ FG 觸發次數（FG 內加局不算觸發），寫 <code class=\"nr\">1/N<\/code><\/td><td><code class=\"nl\">fg_trigger_rate<\/code> 括號內的 cycle<\/td><\/tr><tr><td>FG 平均倍數（每場）<\/td><td>每場 FG 全程得分 ÷ 底注 的平均（＝ FG RTP × FG 週期，可互相驗算）<\/td><td>同左計算<\/td><\/tr><tr><td>NB 標準差（以押注計）<\/td><td>每局總得分（含該局觸發的整場 FG）÷ 押注 的標準差<\/td><td><code class=\"nl nr\">volatility_std<\/code><\/td><\/tr><tr><td>FG 標準差（每場，以押注計）<\/td><td>每場 FG 全程得分 ÷ 押注 的標準差<\/td><td>Simulator 直接輸出逐場標準差（<code class=\"nl\">Overview<\/code> 的 <code class=\"nr\">volatility_std_fg<\/code>，2026-11-20 使用者；不用區間平均估算）<\/td><\/tr><tr><td>NB ≥1,000x／≥5,000x／≥10,000x 週期（底注，每局）<\/td><td>付費局數 ÷「每局總得分 &gt; 門檻 × 底注」的局數，寫 <code class=\"nr\">1/N<\/code>；樣本內沒出現寫「—」或「未觀測（樣本數）」<\/td><td><code class=\"nl nr\">Multiplier Line<\/code>：下界 ≥ 門檻的區間，<code class=\"nl nr\">base_game_cnt<\/code>（非觸發局）＋<code class=\"nr\">free_game_cnt<\/code>（觸發局，以整場 FG 得分計）合計<\/td><\/tr><tr><td>BG／FG 自然允許最大區間（選用）<\/td><td>Card-Off 自然機率中發生率 ≥ 0.05% 的最高倍率區間，寫 <code class=\"nr\">350 ~ 400x<\/code>；再往上的區間不能配卡片權重<\/td><td>Card-Off 報表 <code class=\"nr\">Multiplier Line<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">Buy Feature 類（BF／SF 報表；遊戲有「押注模式」表時只放押注模式表，見必要章節）<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>列名（照寫）<\/th><th>定義<\/th><th>報表來源<\/th><\/tr><\/thead><tbody><tr><td>BF 價格<\/td><td>購買價 ÷ 底注，寫 <code class=\"nr\">50x<\/code><\/td><td><code class=\"nl nr\">feature_price_multiplier<\/code><\/td><\/tr><tr><td>BF RTP<\/td><td>購買全程派彩 ÷ 購買價合計<\/td><td><code class=\"nl nr\">rtp_total<\/code>（有彩金時另列 Game）<\/td><\/tr><tr><td>BF 贏錢率（贏分 &gt; 購買價）<\/td><td>全程得分 <strong>嚴格大於<\/strong> 購買價的次數 ÷ 購買次數<\/td><td><code class=\"nl\">Multiplier Line<\/code> <code class=\"nr\">free_game_cnt<\/code>：下界 ≥ 價格的區間合計（價格不在區間邊界時，例 40.5x，改用逐筆購買資料計算）<\/td><\/tr><tr><td>BF 平均倍數（每次購買）<\/td><td>每次購買全程得分 ÷ 底注 的平均（＝ BF RTP × 價格）<\/td><td>同左計算<\/td><\/tr><tr><td>BF 標準差（以購買價計）<\/td><td>每次購買全程得分 ÷ 購買價 的標準差<\/td><td><code class=\"nl nr\">volatility_std<\/code><\/td><\/tr><tr><td>BF ≥1,000x／≥5,000x／≥10,000x 週期（底注，每次購買）<\/td><td>購買次數 ÷ 全程得分 &gt; 門檻 × 底注 的次數<\/td><td><code class=\"nl\">Multiplier Line<\/code> <code class=\"nr\">free_game_cnt<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">押注模式表<\/strong>（有 EB／BF／SF 時，欄＝Normal Bet、Extra Bet、Buy Feature、Super Feature，有幾種放幾欄）列固定為：價格（倍 Bet）、Total RTP、（有彩金時）Game RTP／Link RTP／Bonus RTP、BG RTP、FG RTP、BG Hit Rate、FG Hit Rate（每轉）、FG 週期、FG 平均倍數（每場，底注）、贏錢率（贏分 &gt; 購買價）、標準差（以押注／購買價計）、≥1,000x／≥5,000x／≥10,000x 週期（底注）、BG／FG 自然允許最大區間。不適用填「—」（例：BF 沒有 BG RTP、FG 週期）。RTP 分母為各模式實際押注（EB 2 倍、BF 價格倍）；倍數與門檻週期一律以底注計；表後寫一段分母說明。<\/p>\n<p><strong class=\"nl nr\">平／深結論<\/strong>：看 NB 標準差與存活模擬（10,000 把仍存活比例、存活中位數）和比較對象相比；標準差較高且存活比例較低為「深」，反之為「平」；不訂數字門檻（2026-11-20 使用者）。平均把數由 RTP 決定，不具鑑別度，不作判斷依據。<\/p>\n<p><strong class=\"nl nr\">存活模擬<\/strong>（<code class=\"nl nr\">專案需知/其他/_survival.py<\/code>，輸入 NB Card-On 報表，所有遊戲同一套算法）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>玩家<\/td><td>1000 人，各帶 1000 元，每把押 1 元，玩到餘額 &lt; 1 為止<\/td><\/tr><tr><td>每把得分<\/td><td>從報表「每局總得分 ÷ 底注」分布抽樣：BG 非觸發局用 <code class=\"nr\">base_game_cnt<\/code>／<code class=\"nl nr\">base_game_pay<\/code>；觸發局用 <code class=\"nr\">free_game_cnt<\/code>／<code class=\"nl nr\">free_game_pay<\/code>（整場 FG），再加觸發把的平均 BG 得分（<code class=\"nl nr\">bg_trigger_fg_pay ÷ bg_trigger_fg_cnt<\/code>）；抽中區間後取該區間平均得分<\/td><\/tr><tr><td>驗算<\/td><td>抽樣分布平均＝報表 NB RTP（Game RTP，不含彩金）<\/td><\/tr><tr><td>亂數<\/td><td>種子 1～6 各跑一次（每份報表各自 <code class=\"nr\">numpy.random.default_rng(seed)<\/code>），比例取 6 次平均<\/td><\/tr><tr><td>輸出<\/td><td>第 1,000／5,000／10,000／20,000 把仍存活比例（＝還能下第 N 把的人數比例）；另附平均把數與中位數（6000 人合併）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">特殊指標<\/strong>：依遊戲機制自訂，每個指標在表前用一句寫清楚「分子 ÷ 分母、統計單位（每局／每轉／每場）、資料來源」。常見定義：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>指標<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>平均每盤金框數<\/td><td>初始盤面（停輪，不含補牌）金框總數 ÷ 盤面數<\/td><\/tr><tr><td>每格金框率<\/td><td>初始盤面金框總數 ÷（盤面數 × 盤面格數）；分輪時分母用該輪格數<\/td><\/tr><tr><td>有金框的盤面<\/td><td>初始盤面至少 1 個金框的盤面 ÷ 盤面數<\/td><\/tr><tr><td>金框使用率<\/td><td>被消到而翻牌的金框數（含補牌補上的）÷ 初始盤面金框數<\/td><\/tr><tr><td>連消分布<\/td><td>每局（BG）／每轉（FG）的得分次數 0／1／2／3／4／5+ 占比；0 次比例 ＋ Hit Rate ＝ 100%<\/td><\/tr><tr><td>符號消除分布<\/td><td>Hit Rate＝該符號該連線數的中獎次數 ÷ 該 Scene 轉數；RTP＝該符號該連線數派彩（已乘連消倍數）÷ 總押注；來源 <code>Symbol Length<\/code> 工作表<\/td><\/tr><tr><td>WILD 倍數分布<\/td><td>各種帶倍數 Wild 分開，各倍數顆數 ÷ 該種 Wild 總顆數，表末列「顆數」<\/td><\/tr><tr><td>出現率類（大鬼等）<\/td><td>事件數 ÷ 該 Scene 轉數，並換算「BG 幾局一次」「FG 每場幾次」<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"倍率線型資料\">倍率線型資料<\/h2>\n<p><strong class=\"nl nr\">64 區間<\/strong>（倍率＝得分 ÷ 底注，區間為左開右閉 <code class=\"nr\">(下界, 上界]<\/code>，不可增減）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>範圍<\/th><th>間距<\/th><th>區間數<\/th><\/tr><\/thead><tbody><tr><td>0（得分為 0）<\/td><td>—<\/td><td>1<\/td><\/tr><tr><td>0～10<\/td><td>1<\/td><td>10<\/td><\/tr><tr><td>10～50<\/td><td>5<\/td><td>8<\/td><\/tr><tr><td>50～100<\/td><td>10<\/td><td>5<\/td><\/tr><tr><td>100～200<\/td><td>20<\/td><td>5<\/td><\/tr><tr><td>200～1,000<\/td><td>50<\/td><td>16<\/td><\/tr><tr><td>1,000～10,000<\/td><td>1,000<\/td><td>9<\/td><\/tr><tr><td>10,000～100,000<\/td><td>10,000<\/td><td>9<\/td><\/tr><tr><td>100,000 以上<\/td><td>上界寫 9999999<\/td><td>1<\/td><\/tr><\/tbody><\/table><\/div>\n<p>標籤寫法：<code class=\"nl nr\">0<\/code>、<code class=\"nl nr\">0 &lt; x &lt;= 1<\/code>、<code class=\"nl nr\">1 &lt; x &lt;= 2<\/code>…<code class=\"nl nr\">100000 &lt; x &lt;= 9999999<\/code>（整數不加小數點、不加千分位）。Record 報表 <code>Multiplier Line<\/code> 的 <code>Interval<\/code> 欄寫成 <code class=\"nr\">0.0 &lt; X &lt;= 1.0<\/code>，轉成上面的寫法。<\/p>\n<p><strong class=\"nl\">每條線的數值<\/strong>＝該區間占比（%，數字 0.5 代表 0.5%），同一條線 64 格合計 100：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>圖<\/th><th>key<\/th><th>統計單位<\/th><th>報表欄位<\/th><th>縱軸 ymax<\/th><\/tr><\/thead><tbody><tr><td>NB-BG<\/td><td><code class=\"nl nr\">bg<\/code><\/td><td>每個<strong>未觸發 FG<\/strong> 的局（觸發局不計入，剩下的重新正規化為 100%）<\/td><td><code class=\"nl\">base_game_cnt<\/code> ÷ 其合計<\/td><td>1<\/td><\/tr><tr><td>NB-FG<\/td><td><code class=\"nl nr\">fg<\/code><\/td><td>每場 FG 全程得分<\/td><td><code class=\"nl\">free_game_cnt<\/code> ÷ 其合計<\/td><td>16<\/td><\/tr><tr><td>BF<\/td><td><code class=\"nl nr\">bf<\/code><\/td><td>每次購買全程得分<\/td><td>BF 報表 <code>free_game_cnt<\/code> ÷ 其合計<\/td><td>16<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EB、SF 併入同一張圖（例：NB-FG 圖加一條 EB-FG 線、BF 圖加一條 SF 線），不另開圖。<\/p>\n<p><strong class=\"nl nr\"><code>curves.json<\/code> 格式<\/strong>：<\/p>\n<pre><code>{\n  \"bg\": {\n    \"title\": \"NB-BG 倍率線型\",\n    \"ymax\": 1,\n    \"labels\": [\"0\", \"0 &lt; x &lt;= 1\", \"…共 64 個…\", \"100000 &lt; x &lt;= 9999999\"],\n    \"series\": [\n      {\"name\": \"&lt;競品英文名&gt;\", \"color\": \"#888780\", \"v\": [64 個數字]},\n      {\"name\": \"&lt;本作英文名&gt; v&lt;四碼版本&gt;\", \"color\": \"#2a78d6\", \"v\": [64 個數字]},\n      {\"name\": \"&lt;本作英文名&gt; v&lt;四碼版本&gt; 自然\", \"color\": \"#2a78d6\", \"v\": [64 個數字]}\n    ]\n  },\n  \"fg\": {\"title\": \"NB-FG 倍率線型\", \"ymax\": 16, \"labels\": [...], \"series\": [...]},\n  \"bf\": {\"title\": \"BF 倍率線型\", \"ymax\": 16, \"labels\": [...], \"series\": [...]}\n}<\/code><\/pre>\n<ul><li>線的順序：競品 → 前作 → 本作（Card-On）→ 本作其他版本／模式 → 本作自然。<\/li><li>顏色：競品一律灰 <code class=\"nr\">#888780<\/code>；本作第一條藍 <code class=\"nr\">#2a78d6<\/code>、第二條（B 版、EB、SF 等）橘 <code class=\"nr\">#eb6834<\/code>；前作／其他自家作品綠 <code class=\"nr\">#1baf7a<\/code>；自然線與對應的本作線<strong class=\"nr\">同色<\/strong>。<\/li><li>名稱含「自然」的線自動畫成虛線、預設隱藏；名稱只寫名稱＋版本（版本取報表 <code>Overview<\/code> 的 <code class=\"nr\">math_version<\/code>）。<\/li><li>沒給 json 時，<code class=\"nl\">_report_build.py<\/code> 沿用現有 <code>report.html<\/code> 內同 key 的圖資料（只改文字時可省略 json）。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"交付檢查\">交付檢查<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> md 與 HTML 內容一致；<code class=\"nl\">&lt;title&gt;<\/code> 與 md 標題為 <code class=\"nr\">數值報告_&lt;遊戲中文名&gt;<\/code>，頁首為 <code class=\"nr\">&lt;中文名&gt; &lt;英文名&gt;<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 頁簽依序連號、名稱不加英文括號；省略的章節已在基本資訊註明。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 本作／前作為 Card-On、Oldhand；來源表列出每份報表檔名與樣本數；樣本數符合比較口徑（NB ≥ 10⁶、BF ≥ 10⁵）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 驗算：FG 平均倍數 ≈ FG RTP × FG 週期；BF 平均倍數 ≈ BF RTP × 價格；連消 0 次 ＋ BG Hit Rate ≈ 100%；每條倍率線合計 100%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 頁首 KPI 有出現（基本指標列名一字不差、本作欄表頭＝遊戲英文名）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 倍率線型三張圖都在，圖例可開關、自然線預設隱藏、競品灰色；滑鼠提示與滾輪縮放正常。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 手機寬度、深色模式下沒有破版；表格可左右拖曳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 「← 返回 Demo」連到 <code class=\"nr\">./index.html<\/code>。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"附錄-areporthtml-外殼\">附錄 A：report.html 外殼<\/h2>\n<p>外殼由 <code>_report_build.py<\/code> 自動建立（專案沒有 <code>report.html<\/code> 時，用模板檔 <code>專案需知/其他/_report_shell.html<\/code> 替換 <code class=\"nr\">&lt;遊戲中文名&gt;<\/code>、<code class=\"nl nr\">&lt;遊戲英文名&gt;<\/code>、<code class=\"nl nr\">&lt;MathID&gt;<\/code>），不需手動貼；本附錄保留作參考。模板檔須與下面整段逐字相同，改外殼時兩邊一起改（不一致時工具會警告）。外殼提供：頁簽切換（點選、方向鍵、網址 <code>#N<\/code> 記住頁簽、滑鼠拖曳橫拉）、倍率線型滑鼠提示與圖例開關、百分比表格橫條、返回 Demo 連結；卡片版型、頁首、KPI、自動頁簽、縱軸縮放由 <code>_report_card_style.py<\/code> 每次重套，不要手改。<\/p>\n<pre><code>&lt;!DOCTYPE html&gt;\n&lt;html lang=\"zh-TW\"&gt;\n&lt;head&gt;\n&lt;meta charset=\"utf-8\"&gt;\n&lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"&gt;\n&lt;title&gt;數值報告_&lt;遊戲中文名&gt;&lt;/title&gt;\n&lt;link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"&gt;\n&lt;link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin&gt;\n&lt;link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap\"&gt;\n&lt;style&gt;\n:root{--surface:#fcfcfb;--panel:#ffffff;--panel-2:#f6f7f8;--ink:#101418;--ink-2:#4a5462;--ink-3:#7d8794;--rule:#e3e6ea;--grid:#edf0f3;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;\n--font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;--font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--surface:#1a1a19;--panel:#212223;--panel-2:#1e1f20;--ink:#f3f3f1;--ink-2:#b4b8be;--ink-3:#868c95;--rule:#33353a;--grid:#2a2c30;--s1:#3987e5;--s2:#d95926;--s3:#199e70}}\n:root[data-theme=\"dark\"]{--surface:#1a1a19;--panel:#212223;--panel-2:#1e1f20;--ink:#f3f3f1;--ink-2:#b4b8be;--ink-3:#868c95;--rule:#33353a;--grid:#2a2c30;--s1:#3987e5;--s2:#d95926;--s3:#199e70}\n*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}\n.wrap{max-width:1120px;margin:0 auto;padding:38px 22px 80px}header{display:flex;flex-direction:column;gap:9px;padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}\nh1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}\n.tabs{display:flex;flex-wrap:nowrap;gap:3px;border-bottom:1px solid var(--rule);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;position:sticky;top:0;background:var(--surface);z-index:20;padding-top:6px}\n.tab{appearance:none;font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer;background:transparent;border:1px solid transparent;border-bottom:none;margin-bottom:-1px;padding:9px 17px;border-radius:3px 3px 0 0;white-space:nowrap}\n.tab:hover{color:var(--ink);background:var(--panel-2)}.tab[aria-selected=\"true\"]{color:var(--s1);font-weight:600;background:var(--panel);border-color:var(--rule);border-bottom-color:var(--panel)}\n.panel{padding-top:26px}.panel[hidden]{display:none}\nh3{margin:32px 0 10px;font-size:17.5px;font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--rule)}.panel&gt;h3:first-child{margin-top:0}\np{margin:0 0 11px;max-width:96ch}code{word-break:break-all;font-family:var(--font-mono);font-size:.88em;background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;padding:1px 4px}\nblockquote{margin:12px 0 16px;padding:10px 14px;background:var(--panel-2);border-left:2px solid var(--s1);border-radius:0 3px 3px 0;color:var(--ink-2);font-size:13.5px}\n.tbl-wrap{overflow:visible;border:1px solid var(--rule);border-radius:3px;background:var(--panel);margin:0 0 18px}\ntable{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--grid);vertical-align:top;white-space:normal;overflow-wrap:anywhere}\nth{background:var(--panel-2);color:var(--ink-2);font-weight:500;font-size:11.5px;letter-spacing:.03em}td.num{white-space:nowrap;text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}\n.tabs::-webkit-scrollbar{display:none}\n/*tabs-drag*/.tabs{scrollbar-width:none;-ms-overflow-style:none;cursor:grab;user-select:none}.tabs::-webkit-scrollbar{display:none}.tabs.dragging{cursor:grabbing}.tabs.dragging .tab{pointer-events:none}\ntbody tr:hover{background:var(--panel-2)}\n:root{--bar:rgba(42,120,214,.16);--bar-hi:rgba(235,104,52,.20)}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--bar:rgba(57,135,229,.30);--bar-hi:rgba(217,89,38,.34)}}\ntd.bar{background-repeat:no-repeat;background-position:left center;background-size:var(--w,0) 72%;background-image:linear-gradient(var(--bc,var(--bar)),var(--bc,var(--bar)));background-origin:content-box;background-clip:content-box}\n.chart{border:1px solid var(--rule);border-radius:3px;background:var(--panel);padding:10px 12px 4px;margin:0 0 18px}\n.chart h4{margin:0 0 4px;font-size:14px;font-weight:600}\n.chart svg{display:block;width:100%;height:auto}\n.chart .plot{position:relative}\n.chart .tip{position:absolute;pointer-events:none;z-index:5;background:rgba(10,12,16,.92);color:#f0efec;border:1px solid var(--rule);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.5;white-space:nowrap}\n.chart .tip b{display:block;font-family:var(--font-mono);margin-bottom:2px}\n.chart .tip .r{display:flex;justify-content:space-between;gap:18px}\n.chart .tip .v{font-family:var(--font-mono);text-align:right}\n.chart .tip i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}\n.chart .cap{font-size:12.5px;color:var(--ink-2);margin:6px 0 4px}\n.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:0 0 4px}\n.legend i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}\n.legend .lg{appearance:none;font:inherit;color:inherit;background:transparent;border:1px solid var(--rule);border-radius:3px;padding:3px 8px;cursor:pointer}\n.legend .lg:hover{background:var(--panel-2)}.legend .lg[aria-pressed=\"false\"]{opacity:.4;text-decoration:line-through}\n.chart g.ser.off{display:none}\n.back{display:inline-block;margin:0 0 10px;font-size:13px;color:var(--ink-2);text-decoration:none}\n&lt;/style&gt;\n&lt;/head&gt;\n&lt;body&gt;&lt;div class=\"wrap\"&gt;\n&lt;a class=\"back\" href=\"./index.html\" id=\"backLink\"&gt;← 返回 Demo&lt;/a&gt;&lt;script&gt;(function(){var a=document.getElementById(\"backLink\");if(document.referrer&amp;&amp;/index\\.html|\\/&lt;MathID&gt;_/.test(document.referrer)){a.addEventListener(\"click\",function(e){e.preventDefault();history.back()})}})();&lt;/script&gt;\n&lt;header&gt;&lt;div class=\"eyebrow\"&gt;Omniplay · 數值報告&lt;/div&gt;&lt;h1&gt;&lt;遊戲中文名&gt; &lt;遊戲英文名&gt;&lt;/h1&gt;&lt;/header&gt rySelectorAll('table').forEach(function(tb){if(tb.hasAttribute('data-nobar'))return;var rows=[].slice.call(tb.querySelectorAll('tbody tr'));if(rows.length&lt;2)return;var ncol=rows[0].children.length,cells=[],max=0;\nfor(var c=1;c&lt;ncol;c++){var col=[],nPct=0,nOther=0;rows.forEach(function(tr){var td=tr.children[c];if(!td)return;var txt=td.textContent.trim();if(txt===''||txt==='—')return;var v=pct(td);if(v===null){nOther++;return}nPct++;if(!isTotal(tr))col.push([td,v])});\nif(nPct&lt;2||nPct&lt;(nPct+nOther)*0.6)continue;col.forEach(function(p){if(p[1]&gt;max)max=p[1]});cells=cells.concat(col)}\nif(cells.length&lt;3||max&lt;=0)return;cells.forEach(function(p){var w=Math.max(0,Math.min(100,p[1]/max*100));if(w&lt;0.4)return;p[0].classList.add('bar');p[0].style.setProperty('--w',w.toFixed(2)+'%');if(p[1]&gt;=max*0.999)p[0].style.setProperty('--bc','var(--bar-hi)')})})})();\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-demoreport\" hidden><div class=\"sec-head\"><h1 id=\"demo報告規範\">Demo報告規範<\/h1><p class=\"updated\">最後更新：2026-11-25<\/p>\n<p>遊戲上線後製作（開發流程步驟 3.2），給內部與客戶說明「這款為什麼這樣設計」。<\/p>\n<p><strong class=\"nl nr\">檔案<\/strong>（做法同 Help：先 md 確認稿，再轉正式檔）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>位置<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">demo_report_draft.md<\/code><\/td><td>遊戲資料夾根目錄（與 <code>game_help.md<\/code> 同層）<\/td><td>內容的前置確認稿，<strong class=\"nl nr\">以 md 為主<\/strong>；格式參考 <code class=\"nr\">game_help.md<\/code>：開頭說明＋Meta 表，每頁一個 <code>## <\/code> 小節、內容用表格或條列<\/td><\/tr><tr><td><code class=\"nl nr\">{英文遊戲名大寫，空格改底線}_Demo報告_v{兩位數版本}.pptx<\/code><\/td><td><code class=\"nl nr\">對外文件/Demo報告/<\/code><\/td><td>由 md 轉出；版式照下方「pptx 版式」（範例：<code class=\"nl nr\">Slots/H027_宙斯 2500/對外文件/Demo報告/ZEUS_2500_Demo報告_v04.pptx<\/code>，產生器 <code class=\"nr\">專案需知/其他/_demo_report_pptx_H027範例.js<\/code>，複製後換內容即可；2026-11-25 使用者定案）；內容每次修改版本 +1，舊版保留<\/td><\/tr><\/tbody><\/table><\/div>\n<p>本規範自足：照本文的 md 骨架、頁面對應與數據換算，加上提案報告規範第 6 節的版面規格，不需參考過去的 Demo 報告即可產出。文中遊戲與數字只是「例」。<\/p>\n<p><strong class=\"nl nr\">輸入資料<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>資料<\/th><th>位置<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>規則<\/td><td><code class=\"nl nr\">game_rule.md<\/code>、<code class=\"nl nr\">game_help.md<\/code><\/td><td>設計重點、玩法描述<\/td><\/tr><tr><td>數值報告<\/td><td><code class=\"nl nr\">個人筆記/數值報告.md<\/code>（指標定義見<a href=\"#\" class=\"nr tab-link\" data-tab=\"report\">數值報告規範.md<\/a>「指標定義」）<\/td><td>標準差、大獎週期、存活、FG／BF 指標、競品對照<\/td><\/tr><tr><td>修改紀錄<\/td><td><code class=\"nl nr\">個人筆記/修改紀錄.md<\/code><\/td><td>調性調整的時間與原因<\/td><\/tr><tr><td>反饋<\/td><td><code class=\"nl nr\">Slots/其他/一些記錄/反饋紀錄.md<\/code><\/td><td>困難與反饋的來源、日期<\/td><\/tr><tr><td>線上數據<\/td><td><code class=\"nl nr\">Slots/其他/一些記錄/基本資訊.md<\/code><\/td><td>每日轉數等，換算每天預期次數<\/td><\/tr><tr><td>AB Test（有才放）<\/td><td><code class=\"nl nr\">個人筆記/上線觀察.md<\/code><\/td><td>各組差異與主推版本<\/td><\/tr><tr><td>截圖<\/td><td>該遊戲 Demogame<\/td><td>設計重點頁畫面（擷取規則同提案報告規範第 4 節）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">內容<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>章節<\/th><th>寫什麼<\/th><\/tr><\/thead><tbody><tr><td>1. 遊戲設計重點<\/td><td>這款的核心玩法與賣點，一段話講清楚<\/td><\/tr><tr><td>2. 跟競品不同的地方<\/td><td>對標競品後刻意做的差異、獨有巧思（機制、表現、數值調性），每點寫「做了什麼、為什麼」<\/td><\/tr><tr><td>3. 製作過程的困難與反饋<\/td><td>製作中遇到的問題、收到的反饋（客戶、主管、數學、測試…）與對應的調整；反饋來源見 <code class=\"nr\">Slots/其他/一些記錄/反饋紀錄.md<\/code><\/td><\/tr><tr><td>4. 數據佐證<\/td><td>用數值報告與線上數據說明調整的效果；線上數據見 <code class=\"nr\">Slots/其他/一些記錄/基本資訊.md<\/code>，註明數據日期<\/td><\/tr><tr><td>5. AI 的使用（有才放）<\/td><td>收集資料、AI 分析／破解輪帶、AI 還原調性、AI 玩法優化，每步一句<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>文字要<strong class=\"nr\">簡明扼要<\/strong>：每點一行標題＋一行說明，數字放卡片或表格，不寫長句（2026-11-25 使用者）。<\/li><li>「3. 製作過程的困難與反饋」使用者可指定拿掉（H027 v02 起拿掉）。<\/li><\/ul>\n<p><strong class=\"nl nr\">寫法<\/strong><\/p>\n<ul><li>每個設計點都要有「原因 → 做法 → 數據」。數據取自數值報告（大獎週期、倍率線型、玩法深淺）與線上數據換算。<\/li><li>例：製作中被反應「我們的遊戲太平，玩起來沒有變化，排行榜很難出現 5000x 以上的推播」→ 這款特別調整了 5000x 以上的出現率 → 搭配線上數據（皮娜塔在前 6 名平台一天約 200 萬～3,000 萬轉，2026-10-22），以「每日轉數 × 5000x 以上機率」換算每天預期出現幾次，說明每天都看得到千倍以上的獎項推播。<\/li><li>只寫已定案、已驗證的內容；試驗中或被否決的方案不寫（可在「困難與反饋」交代為什麼沒採用）。<\/li><li>數據一律註明口徑與來源：本作取 Card-On 正式報表（寫數學四碼版本）；競品為側錄樣本時寫樣本數，樣本不足（例：尾端大獎未出現）要註明「樣本未出現」「會被低估」，不要硬比。<\/li><li>用玩家聽得懂的說法：週期寫「每 26,364 局一次」、贏錢率寫「約 3 次有 1 次回本」，數字照數值報告不另四捨五入成別的值。<\/li><\/ul>\n<p><strong class=\"nl nr\">數據換算<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>指標<\/th><th>算法<\/th><th>寫法<\/th><\/tr><\/thead><tbody><tr><td>每天預期出現次數<\/td><td>每日轉數 ÷ 週期 N（＝每日轉數 × 1/N）；每日轉數用線上數據的下限～上限，算出區間<\/td><td><code class=\"nl nr\">76～1,138 次<\/code>；≥ 1 次取整數，&lt; 1 次留 1 位小數（例：<code class=\"nl nr\">0.5～7 次<\/code>）<\/td><\/tr><tr><td>大獎週期<\/td><td>數值報告「NB ≥1,000x／≥5,000x／≥10,000x 週期（底注，每局）」<\/td><td><code class=\"nl nr\">每 26,364 局一次<\/code>、表格內寫 <code class=\"nr\">26,364 局<\/code><\/td><\/tr><tr><td>玩法深淺<\/td><td>NB 標準差（以押注計）＋存活中位數（1000 元、每把 1 元）；與競品比倍數<\/td><td><code class=\"nl nr\">約為競品的 2 倍，屬「深」<\/code><\/td><\/tr><tr><td>BF 回收<\/td><td>BF RTP、BF 贏錢率（贏分 &gt; 購買價）、BF ≥1,000x 週期（每次購買）<\/td><td><code class=\"nl nr\">約 3 次有 1 次回本<\/code><\/td><\/tr><tr><td>FG 保底<\/td><td>每場 FG 全程得分 ≥ 門檻 × 底注 的比例（數值報告「門檻機率」）<\/td><td><code class=\"nl nr\">NB-FG ≥20x 100%（競品 74%）<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\"><code>demo_report_draft.md<\/code> 骨架<\/strong>（<code class=\"nl\">&lt;…&gt;<\/code> 為佔位；沒有的節整節刪掉）：<\/p>\n<pre><code># &lt;Game ID&gt; Demo Report Draft\n\n這份 md 是 `對外文件/Demo報告/&lt;英文名大寫&gt;_Demo報告_v01.pptx` 的前置確認稿。Demo 報告一律放該遊戲專案的 `對外文件/Demo報告/`（各版都放這裡，2026-11-25 使用者）；`專案開發/對外文件/&lt;YYMMDD_主題&gt;/` 是跨專案的其他對外文件，不放 Demo 報告（2026-11-20 使用者）。\n之後若要改簡報，應先確認並修改這份 md，再轉成 pptx。\n\n## Game Meta\n\n| Field | Value |\n| --- | --- |\n| game_id | &lt;6 碼 Game ID&gt; |\n| parsheet_id | &lt;ParSheet ID&gt; |\n| name_zh | &lt;中文名&gt; |\n| name_en | &lt;英文名&gt; |\n| game_type | &lt;例：Video Slot - Ways / Cascade&gt; |\n| 對標競品 | &lt;競品英文名&gt;（&lt;廠商&gt;） |\n| 主推版本 | &lt;例：A 版；有 AB Test 時寫主推組&gt; |\n| 數據來源 | `個人筆記/數值報告.md`（Card-On 正式報表 &lt;四碼版本&gt;）；線上數據 `Slots/其他/一些記錄/基本資訊.md` |\n| 草稿日期 | &lt;YYYY-MM-DD&gt; |\n\n---\n\n## 1. 遊戲設計重點\n\n**一句話**：&lt;核心玩法與賣點&gt;\n\n| 重點 | 說明 |\n| --- | --- |\n| &lt;玩法要素&gt; | &lt;一行說明&gt; |\n\n### 跟競品的差異與對應的數值調整\n\n| 差異 | &lt;競品&gt; | &lt;本作&gt; | 對應的數值調整 |\n| --- | --- | --- | --- |\n\n---\n\n## 2. 跟競品不同的地方\n\n| 項目 | 做了什麼 | 為什麼 | 數據 |\n| --- | --- | --- | --- |\n\n### AB Test\n\n| 組別 | 做了什麼 | 數據 |\n| --- | --- | --- |\n\n---\n\n## 3. 製作過程的困難與反饋\n\n| 問題／反饋 | 來源 | 調整 |\n| --- | --- | --- |\n| &lt;問題原文或摘要&gt; | &lt;客戶／主管／數學／後端壓測…（日期）&gt; | &lt;對應的調整與結果&gt; |\n\n---\n\n## 4. 數據佐證\n\n### 玩法深淺（NB，以押注計）\n\n| 指標 | &lt;競品&gt; | &lt;本作&gt; |\n| --- | ---: | ---: |\n| 標準差 | | |\n| ≥1000x 週期 | | |\n| ≥5000x 週期 | | |\n| ≥10000x 週期 | | |\n| 存活中位數（1000 元、每把 1 元） | | |\n\n### 每天看得到幾次大獎推播\n\n&lt;換算方式一句＋線上數據來源與日期&gt;\n\n| 每天預期出現次數 | &lt;本作&gt; |\n| --- | ---: |\n| ≥1000x | |\n| ≥5000x | |\n| ≥10000x | |\n\n### BF 回收\n\n| 指標 | &lt;競品&gt; | &lt;本作&gt; |\n| --- | ---: | ---: |\n| BF RTP | | |\n| BF 贏錢率 | | |\n| BF ≥1000x 週期 | | |<\/code><\/pre>\n<p><strong class=\"nl nr\">pptx 版式<\/strong>（2026-11-25 定案，H027 v04；16:9 <code>LAYOUT_WIDE<\/code> 13.33\" × 7.5\"）<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>規格<\/th><\/tr><\/thead><tbody><tr><td>配色<\/td><td>深藍 <code class=\"nr\">101B3D<\/code>（封面、章節頁、Q&amp;A 底色與強調卡）、金 <code class=\"nr\">E8B53A<\/code>（數字、小標、圖示圓）、淡金 <code class=\"nr\">FBF1D6<\/code>（圖示圓底、重點條）、內容頁白底、卡片淺灰藍 <code class=\"nr\">F3F6FB<\/code>、內文 <code class=\"nr\">1A2238<\/code>、次要字 <code class=\"nr\">6B7790<\/code><\/td><\/tr><tr><td>字型<\/td><td>微軟正黑體；標題 34pt 粗、英文小標 12pt 金色加字距、內文 15～16pt、註腳 10～11pt<\/td><\/tr><tr><td>主視覺<\/td><td>金色／淡金圓圈內放圖示（react-icons FontAwesome 6），每頁重複；<strong class=\"nl nr\">不用上下色條、不用標題底線<\/strong><\/td><\/tr><tr><td>頁尾<\/td><td>左下 <code class=\"nr\">&lt;英文名&gt; · Demo 報告<\/code>、右下頁碼，10pt 次要字色<\/td><\/tr><tr><td>元件<\/td><td>圓角卡片（淡陰影）、大數字卡（40pt 數字＋粗體標籤＋說明）、圖示列（圓圈＋粗體標題＋一行說明）、深藍膠囊條（公式／結論）、表格（深藍表頭、本作欄淡金底粗體、斑馬紋）<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">pptx 頁面<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁<\/th><th>版面<\/th><\/tr><\/thead><tbody><tr><td>封面<\/td><td>深藍底：金色小標 <code class=\"nr\">DEMO 報告<\/code>、英文名（60pt 白）、中文名（金）、一句核心；右側 demo 截圖金框；底部 <code class=\"nr\">&lt;Game ID&gt; · 數學 &lt;四碼版本&gt; · JumboRD<\/code><\/td><\/tr><tr><td>目錄<\/td><td>2×2 卡片：金色大編號＋章名＋一行說明<\/td><\/tr><tr><td>章節頁<\/td><td>深藍底：金圓閃電圖示＋金色大編號＋白色章名＋一行副標<\/td><\/tr><tr><td>核心玩法<\/td><td>左：圖示列逐項亮起（每頁加一項，前面的轉灰），最後一頁全亮＋深藍膠囊條寫核心公式；右：demo 截圖金框<\/td><\/tr><tr><td>設計重點<\/td><td>三欄卡片：圖示圓＋金色編號＋粗體標題＋一行說明<\/td><\/tr><tr><td>跟競品差異<\/td><td>左：4 條圖示列；右：對照表（本作欄淡金）；下方註腳寫口徑<\/td><\/tr><tr><td>對照型（例：輪帶設計）<\/td><td>左右兩張大數字卡（本作採用的那張深藍）＋下方淡金重點條<\/td><\/tr><tr><td>數據型（其他調整、玩法深淺、推播）<\/td><td>2～3 張大數字卡，必要時右側表格；換算方式放下方白卡<\/td><\/tr><tr><td>AB Test<\/td><td>左右兩張卡，主推組深藍底；組名＋標籤＋4 列指標（左標籤右數字）<\/td><\/tr><tr><td>AI<\/td><td>4 步驟卡片橫排，卡片間金色箭頭<\/td><\/tr><tr><td>Q &amp; A<\/td><td>深藍底：金圓閃電＋<code>Q &amp; A<\/code>＋英文名 · 中文名<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>檢查：用 PowerPoint 匯出每頁 PNG 逐頁看，不可有爆字、斷字（數字與單位分行）、卡片過空。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-outputs\" hidden><div class=\"sec-head\"><h1 id=\"產出與紀錄規範\">產出與紀錄規範<\/h1><p class=\"updated\">最後更新：2026-11-25<\/p>\n<p>本文件定義每個 Slot 專案<strong>必須產出的文件<\/strong>與 <code>修改紀錄.md<\/code> 的格式。製作順序與各階段操作見開發流程.md。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-必要產出文件\">1. 必要產出文件<\/h2>\n<p>每個專案必須產出下列文件；任一項缺漏，專案不得視為完成交付：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>產出<\/th><th>說明<\/th><th>依據規範<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">game_rule.md<\/code><\/td><td>遊戲規則正式來源<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code class=\"nl\">game_help.md<\/code> → <code class=\"nr\">{GameID}_Help.xlsx<\/code><\/td><td>Help 先寫 Markdown 草稿再轉 xlsx，兩者內容一致<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">game_description.md<\/code><\/td><td>模型參數使用方式說明<\/td><td>數學文件規範.md<\/td><\/tr><tr><td><code class=\"nl\">H0xx1*.xlsx<\/code> → PARsheet<\/td><td>數學模型為正式參數來源，另轉出對外提供的 PARsheet<\/td><td>數學模型規範.md、數學文件規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code><\/td><td>Simulator 與 Demogame 共用的執行參數，由數學模型轉出；一個產線的一個系列一份（例 <code class=\"nr\">config_01A.js<\/code>）<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">Simulator.py<\/code><\/td><td>模擬程式<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">index.html<\/code><\/td><td>Demogame<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"demo\">Demogame規範.md<\/a><\/td><\/tr><tr><td><code class=\"nl\">個人筆記/數值報告.md<\/code>＋<code class=\"nr\">report.html<\/code><\/td><td>本作與對標競品、前作的差異分析；<code class=\"nl\">report.html<\/code> 另含修改紀錄、注意事項、上線觀察頁簽（自動併入）<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">修改紀錄.md<\/code><\/td><td><code class=\"nl nr\">個人筆記/<\/code>，依版本記錄數學調性的修改，格式見第 2 節<\/td><td>本文件<\/td><\/tr><tr><td><code class=\"nl nr\">注意事項.md<\/code><\/td><td><code class=\"nl nr\">個人筆記/<\/code>，改模型、改權重或交接前必讀，分兩部分：<strong class=\"nl\">一、開發注意事項<\/strong>＝提醒之後看文件的人要注意的事（偏離規範或預設的設定、經使用者同意暫不處理的檢查項、與其他遊戲不同的做法），開發中想到就加，AI 認為需要記錄的須先經使用者確認才加入，每項註明日期、版本與原因；<strong class=\"nl\">二、錯誤清單提醒<\/strong>＝開案時讀 錯誤清單，挑出本作可能再犯的列入<\/td><td>本文件<\/td><\/tr><tr><td><code class=\"nl nr\">上線觀察.md<\/code><\/td><td><code class=\"nl nr\">個人筆記/<\/code>，上線後要觀察的項目（如 AB Test 效果、押注分層、新手體驗）：目的、觀察指標、比較基準、開始日期、結果／決議；開發完成前建立，有結果後回填<\/td><td>本文件<\/td><\/tr><tr><td><code class=\"nl nr\">{GameID}_Game Description.docx<\/code><\/td><td>依 Help 填寫，分完整版與送驗版<\/td><td>送驗文件規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">{GameID}_Math Document Description.md<\/code><\/td><td>數學模型的工作表、參數、遊戲邏輯與卡片系統說明<\/td><td>送驗文件規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">對外文件/{GameID}_腳本規格.xlsx<\/code><\/td><td>挑腳本用的腳本表（2026-10-28 起統一此檔名）<\/td><td>腳本規範.md<\/td><\/tr><\/tbody><\/table><\/div>\n<p>各檔案的存放位置見第 3 節。<\/p>\n<ul><li>上表「→」的轉換與 Config 一律由 AI 轉出，專案內不建立、不維護任何轉檔工具。<\/li><li>轉換結果必須可由來源重建；轉換錯誤時修正來源後重新轉出，不直接修補轉出結果。<\/li><li><strong class=\"nl nr\">一律繁體中文<\/strong>：所有產出（Demogame 畫面、Help（<code class=\"nl nr\">game_help.md<\/code>／內嵌 Help）、<code class=\"nl nr\">game_rule.md<\/code>、報告、簡報）不得有簡體字；從前作沿用的內容（例如 Help 的「簡中」欄）也要轉繁體，欄名「簡中」改為「繁中」。轉換時用 OpenCC <code>s2t<\/code> 逐字元掃出候選字，再依語境人工判斷，<strong class=\"nl nr\">不自動套用<\/strong>（<code class=\"nl nr\">s2t<\/code>／<code class=\"nl\">s2tw<\/code> 都會把正確的繁體字換掉）；已知誤判：占、台、群、吃、峰、丑（「小丑牌」會變「小醜牌」）、分布、只、注。交付前再掃一次有無殘留。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-修改紀錄格式\">2. 修改紀錄格式<\/h2>\n<p><code class=\"nl\">修改紀錄.md<\/code> 放在專案 <code class=\"nr\">個人筆記/<\/code>，<strong class=\"nl nr\">依版本分節、不以日期分節<\/strong>：<\/p>\n<ul><li>每個四碼版本一節，標題寫 <code class=\"nr\">## v&lt;第 1 碼&gt;（&lt;四碼版本&gt;）<\/code>，例如 <code class=\"nr\">## v5（5.1.0.0）<\/code>、<code class=\"nl nr\">## v5（5.0.0.0）<\/code>；由新到舊排列。<\/li><li>只改倍率權重（卡片權重，數學模型規範 1.3 第 2 碼）時升成 <code>5.1.0.0<\/code> 這類版本，同樣<strong class=\"nr\">獨立成一節<\/strong>，只列該版本內的修改；SCR（第 3 碼）、其他文件（第 4 碼）同理。<\/li><li>每節用編號清單，一項一件事，句尾以全形括號附日期 <code class=\"nl nr\">（MM/DD）<\/code>。<\/li><li><strong class=\"nl nr\">只記錄跟數學調性有關的內容<\/strong>：規則、賠率、輪帶、金框與倍數權重、卡片權重、RTP 拆分與週期、模擬驗證結果等。Demogame 介面、演出、文件、工具的修改不記在這裡（以 git commit 為準）。Demogame 的「版本紀錄」（<code class=\"nl\">index.html<\/code> 的 <code class=\"nr\">#change-log-wrap<\/code>）是本檔的複本，本檔更新時同步更新。<\/li><li>項目歸到<strong class=\"nr\">修改當時的目前版本<\/strong>；<strong class=\"nl nr\">只記已完成的修改<\/strong>，不寫進行中、待辦或「待重算」之類的狀態。<\/li><li>數學版本細節另見 <code class=\"nr\">Versions/version_manifest.json<\/code>。<\/li><li>每次新增調性項目（數學模型或倍率權重調整）時，同步把 Demogame <code>index.html<\/code> 的 <code>window.DEMOGAME_LAST_TUNING<\/code> 改成當下的日期與時間 <code class=\"nr\">YYYY-MM-DD HH:MM<\/code>，並把 <code>window.DEMOGAME_TUNING_CODE<\/code> 換成新的 6 碼隨機碼（頁尾「最後調性更新」與「唯一碼」；回報時告訴使用者新的唯一碼，見 <a href=\"#\" class=\"tab-link\" data-tab=\"demo\">Demogame規範<\/a> 第 5 節）。<\/li><\/ul>\n<p>範例：<\/p>\n<pre><code>## v5（5.1.0.0）\n\n1. 92A 卡片權重重解：BG Trigger Cap 350x → 300x。（10/20）\n2. Card-On 驗證 Oldhand 92.03%、Newbie 92.98%、BF 92.51%。（10/20）\n\n## v5（5.0.0.0）\n\n1. 升 v5：啟用盤面表 2（高連消表），BG 選表 9 : 1、FG 2 : 8。（10/12）\n2. 表 2 補牌權重集中、輪帶 M1～M4 約一半換成低倍符號。（10/12）<\/code><\/pre>\n<\/div><div class=\"sec-card\"><h2 id=\"3-專案目錄與存放位置\">3. 專案目錄與存放位置<\/h2>\n<pre><code>Slots/H0xx_遊戲名稱/\n├─ game_rule.md\n├─ game_help.md\n├─ game_description.md\n├─ Simulator.py\n├─ index.html\n├─ report.html                 ← 數值報告網頁（標題 數值報告_&lt;遊戲中文名&gt;）\n├─ config_01A.js             ← 一個產線的一個系列一份（產線編號＋系列；有 B 版另有 config_01B.js）\n├─ Source/                   ← 模擬程式、Demogame 使用到的資源（數學模型）\n│  ├─ version.txt\n│  ├─ H0xx1.xlsx\n│  ├─ H0xx192A.xlsx\n│  ├─ H0xx194A.xlsx\n│  ├─ Image/                  ← Demo 用符號圖\n│  └─ 02/                     ← 只有新增其他產線時才開（同 SVN），內含該產線的模型與 version.txt\n├─ 對外文件/                   ← 要釋出給其他職能的文件\n│  ├─ &lt;GameID&gt;_Help.xlsx\n│  ├─ &lt;GameID&gt;_Game Description.docx           ← 完整版（內容同 Help，不刪減）\n│  ├─ &lt;GameID&gt;_Math Document Description_EN.docx   ← 英文版（送驗用，複製時去掉 _EN）\n│  ├─ &lt;GameID&gt;_Math Document Description_ZH.docx   ← 中文版\n│  ├─ &lt;GameID&gt;_腳本規格.xlsx\n│  ├─ Demo報告/                ← Demo 報告 pptx（&lt;英文名&gt;_Demo報告_v01.pptx、v02…，舊版保留）\n│  ├─ To SPS/                  ← 交 SPS 的 zip（&lt;GameID&gt;_&lt;版本&gt;.zip，只含 config_&lt;產線編號&gt;&lt;系列&gt;.js 與 Simulator.py）\n│  ├─ PARsheet/                 ← 專案的正式 PARsheet（主檔名加 R，底線後綴在 R 之後）\n│  │  ├─ H0xx1R.xlsx\n│  │  └─ H0xx19xR.xlsx\n│  └─ 數值文件/                 ← 送驗文件包（資料夾固定叫 數值文件，內含 &lt;GameID&gt;.zip）\n│     ├─ &lt;GameID&gt;.zip           ← 送驗壓縮檔（頂層 &lt;GameID&gt;/，內容即本資料夾，SHA1 清單打包前重產）\n│     ├─ &lt;GameID&gt;_Game Description.docx        ← 送驗版（移除送驗禁止項目）\n│     ├─ PARsheet/             ← 數學模型送驗版（移除送驗禁止項目）\n│     │  └─ H0xx19x.xlsx\n│     └─ Simulator/\n│        ├─ Simulator.py\n│        └─ config_01A.js\n├─ 個人筆記/                    ← 個人筆記\n│  ├─ 修改紀錄.md               ← 依版本記錄數學調性的修改\n│  ├─ 注意事項.md               ← 本遊戲的特別操作與已知例外\n│  ├─ 上線觀察.md               ← 上線後要觀察的項目與結果\n│  └─ 數值報告.md               ← 數值報告：與對標競品、前作的差異分析（見數值報告規範）\n├─ 其他/                     ← 其他有用到但沒有整理的資料\n│  └─ 提案/                  ← 提案簡報（見提案報告規範）\n├─ Record/                   ← 模擬報表\n└─ Versions/                 ← 不同版本的數學存放位置\n   ├─ version_manifest.js\n   └─ version_manifest.json<\/code><\/pre>\n<ul><li>A／B、92／94、Buy／Super Feature 只依產品實際需求增減。<\/li><li>目錄中的檔名、版本及報表命名必須符合現行規格，不以舊遊戲的歷史命名為準。<\/li><li><code class=\"nl\">Source/<\/code> 內不放任何轉檔腳本；Excel↔Config 轉換由 AI 執行。<\/li><li><strong class=\"nl nr\">數學模型依產線存放<\/strong>（同 SVN <code class=\"nr\">D:\\SVN\\Slot\\IGaming\\&lt;MathID&gt;\\<\/code>）：遊戲原本產線的模型（含 <code class=\"nr\">version.txt<\/code>）直接放 <code class=\"nr\">Source/<\/code>，不另開資料夾；之後新增其他產線（例 Reskin 的 <code class=\"nr\">02<\/code>）時，新產線的模型與它自己的 <code>version.txt<\/code> 放 <code class=\"nr\">Source/&lt;產線編號&gt;/<\/code>。產線編號依 <code class=\"nr\">D:\\SVN\\Math_Release\\IGaming\\說明書\\ID對照表.txt<\/code>（<code class=\"nl\">01<\/code> 菲律賓主流遊戲、<code class=\"nl\">01_2<\/code> 菲律賓 landbase 轉製遊戲、<code class=\"nl\">02<\/code> 美國、<code class=\"nl\">03<\/code> 墨西哥）。<\/li><li><strong class=\"nl nr\">Config 一個產線的一個系列一份<\/strong>：<code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>（例 <code class=\"nr\">config_01A.js<\/code>、<code class=\"nl nr\">config_01B.js<\/code>、<code class=\"nl nr\">config_02A.js<\/code>），與 Demogame Config 選單的 <code class=\"nr\">A-01<\/code>、<code class=\"nl nr\">B-01<\/code>、<code class=\"nl\">A-02<\/code> 同一套編號；結構見<a href=\"#\" class=\"tab-link\" data-tab=\"sim\">模擬程式規範<\/a>第 2.1 節。<\/li><li>數值報告（與競品、前作的數學差異分析）md 一律為 <code class=\"nr\">個人筆記/數值報告.md<\/code>、HTML 為專案根目錄 <code class=\"nr\">report.html<\/code>，標題寫 <code class=\"nr\">數值報告_&lt;遊戲中文名&gt;<\/code>；不再使用 <code class=\"nr\">數值報告_&lt;遊戲中文名&gt;.md／.html<\/code>、 <code class=\"nl nr\">差異分析_&lt;遊戲名稱&gt;<\/code>、<code class=\"nl nr\">競品比較_H0xx.md<\/code>、<code class=\"nl\">競品差異分析_&lt;競品名&gt;.md<\/code> 等舊檔名。<\/li><li>Help 原文一律為專案根目錄 <code class=\"nr\">game_help.md<\/code>（Demogame 讀取、轉 <code class=\"nr\">{GameID}_Help.xlsx<\/code>／Game Description 的來源）；不再使用舊檔名 <code class=\"nr\">game_help_draft.md<\/code>。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>存放位置<\/th><th>放什麼<\/th><th>製作方式見<\/th><\/tr><\/thead><tbody><tr><td>專案根目錄<\/td><td><code class=\"nl nr\">game_rule.md<\/code>、<code class=\"nl nr\">game_help.md<\/code>、<code class=\"nl nr\">game_description.md<\/code>、<code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>、<code class=\"nl nr\">Simulator.py<\/code>、<code class=\"nl nr\">index.html<\/code>、<code class=\"nl nr\">report.html<\/code>（數值報告）<\/td><td>各檔對應規範（見第 1 節）<\/td><\/tr><tr><td><code class=\"nl nr\">Source/<\/code><\/td><td>數學模型 <code class=\"nr\">H0xx1*.xlsx<\/code>、<code class=\"nl nr\">version.txt<\/code>；其他產線放 <code class=\"nr\">Source/&lt;產線編號&gt;/<\/code><\/td><td>數學模型規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">對外文件/<\/code><\/td><td><code class=\"nl nr\">{GameID}_Help.xlsx<\/code>、<code class=\"nl nr\">{GameID}_Game Description.docx<\/code>（完整版）、<code class=\"nl nr\">{GameID}_Math Document Description.md<\/code>、<code class=\"nl nr\">{GameID}_腳本規格.xlsx<\/code>、<code class=\"nl nr\">To SPS/<\/code>（交 SPS 的 zip）<\/td><td>數學文件規範.md、送驗文件規範.md<\/td><\/tr><tr><td><code class=\"nl nr\">對外文件/Demo報告/<\/code><\/td><td>Demo 報告 <code class=\"nr\">{英文名}_Demo報告_v{兩位數}.pptx<\/code>，各版都放這裡<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"demoreport\">Demo報告規範<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">對外文件/PARsheet/<\/code><\/td><td>PARsheet（主檔名加 <code class=\"nr\">R<\/code>，底線後綴在 <code>R<\/code> 之後）<\/td><td>數學文件規範.md PARsheet 節<\/td><\/tr><tr><td><code class=\"nl nr\">對外文件/數值文件/<\/code><\/td><td>送驗資料夾；一定要有 <code class=\"nr\">{GameID}.zip<\/code>（頂層 <code class=\"nr\">{GameID}/<\/code>）<\/td><td>送驗文件規範.md 1.1<\/td><\/tr><tr><td><code class=\"nl nr\">個人筆記/<\/code><\/td><td>個人筆記：<code class=\"nl nr\">修改紀錄.md<\/code>、<code class=\"nl nr\">注意事項.md<\/code>、<code class=\"nl nr\">上線觀察.md<\/code>、<code class=\"nl nr\">數值報告.md<\/code><\/td><td>本文件、<a href=\"#\" class=\"nl nr tab-link\" data-tab=\"report\">數值報告規範<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">其他/<\/code><\/td><td>其他有用到但沒有整理的資料（企劃書、競品參考、美術參考等）；提案簡報放 <code class=\"nr\">其他/提案/<\/code><\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"proposal\">提案報告規範<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">Record/<\/code><\/td><td>模擬報表 <code class=\"nr\">.xlsx<\/code><\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><tr><td><code class=\"nl nr\">Versions/<\/code><\/td><td>各版本的 Source、Config、Simulator 備份與 <code class=\"nr\">version_manifest<\/code><\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"sim\">模擬程式規範.md<\/a><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code class=\"nl\">對外文件/數值文件/<\/code> 只放送驗標的與 <code class=\"nr\">{GameID}.zip<\/code>，外層文件不得複製進去；資料夾不用 Game ID 命名，Game ID 寫在 zip 檔名（2026-11-25 使用者）。<\/li><li><strong class=\"nl nr\">會有多個版本的對外文件各開一個資料夾<\/strong>，該類的所有版本都放進去（例：<code class=\"nl\">對外文件/數值文件/<\/code> 送驗包、<code class=\"nl nr\">PARsheet/<\/code>、<code class=\"nl nr\">Demo報告/<\/code>、<code class=\"nl nr\">To SPS/<\/code>）；只會有一份、改了直接覆蓋的文件（Help、Game Description、Math Document Description、腳本規格）放 <code>對外文件/<\/code> 外層。新增會出多版的對外文件時照此開資料夾。（2026-11-25 使用者）<\/li><li>範例：<code class=\"nl nr\">H026_彩罐熱舞 1000/<\/code>。<\/li><li><strong class=\"nl nr\">上線後整理<\/strong>：遊戲確認上線後（與整理 <code>Record/<\/code> 同一時間點），<code class=\"nl\">Versions/<\/code> 每個第一碼只留最新的版本，其餘版本資料夾刪除（例：H027 的 <code class=\"nr\">5.0.0.0<\/code>、<code class=\"nl\">5.1.1.2<\/code> 只留 <code class=\"nr\">5.1.1.2<\/code>）。上線前不清。（2026-11-03）<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-sim\" hidden><div class=\"sec-head\"><h1 id=\"模擬程式規範\">模擬程式規範<\/h1><p class=\"updated\">最後更新：2026-11-
