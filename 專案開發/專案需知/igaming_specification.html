x; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n/* 嵌入入口時：頁首、頁籤、左側目錄由入口負責，這裡只留內文；藏拉條、仍可上下捲動 */\nhtml.embedded{scrollbar-width:none; -ms-overflow-style:none}\nhtml.embedded::-webkit-scrollbar{display:none}\nhtml.embedded body{background:transparent}\nhtml.embedded .wrap{max-width:none; padding:0}\nhtml.embedded header.page, html.embedded .tabs, html.embedded .toc,\nhtml.embedded .toc:not([hidden]):has(.toc-doc){display:none!important}\nhtml.embedded .body-row{display:block; padding:0}\nhtml.embedded main{background:transparent; border:0; padding:6px 0 60px}\n.sec-head{padding:0 2px 4px}\n.sec-head > *:last-child{margin-bottom:8px}\n.sec-card{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:4px 32px 22px; margin:0 0 18px}\n.sec-card > h2:first-child{margin-top:20px}\nhtml.embedded .panel h1{color:var(--ink); font-weight:600; font-size:30px}\nhtml.embedded h2{color:var(--ink); border-bottom-color:var(--grid)}\nhtml.embedded main{max-width:1080px}\n.updated{margin:-6px 0 18px; font-size:12.5px; color:var(--ink-3)}\nhtml.embedded a{color:var(--accent); text-decoration:none}\nhtml.embedded a:hover{text-decoration:underline}\nhtml.embedded td code, html.embedded li code{background:transparent; border:0; padding:0; color:var(--ink)}\n:root{--accent:#1b3a6b}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--accent:#6f97d8}}\n:root[data-theme=\"dark\"]{--accent:#6f97d8}\n@media (max-width:700px){html.embedded main{padding:6px 0 40px} .sec-card{padding:4px 16px 16px}}\n<\/style>\n<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');<\/script>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"page\">\n  <div class=\"eyebrow\">iGaming · 老手救援 C-2版<\/div>\n  <h1 class=\"site\">老手救援 C-2版<\/h1>\n  <p class=\"meta\">由 <code>專案需知/開發規範/Omniplay/*.md<\/code> 產生（<code>_build_html.py<\/code>）　|　2026-11-25<\/p>\n<\/header>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"規範文件\"><button class=\"tab\" role=\"tab\" id=\"tab-g0\" data-tab=\"sps_oldhand\" data-tabs=\"sps_oldhand\" aria-selected=\"true\" tabindex=\"0\"><svg class=\"tab-ico\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"/><\/svg>系統相關<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-sps_oldhand\"><a class=\"toc-2\" href=\"#1-機制摘要\" data-tab=\"sps_oldhand\">1. 機制摘要<\/a><a class=\"toc-2\" href=\"#2-名詞與計算定義\" data-tab=\"sps_oldhand\">2. 名詞與計算定義<\/a><a class=\"toc-2\" href=\"#3-判定時程\" data-tab=\"sps_oldhand\">3. 判定時程<\/a><a class=\"toc-2\" href=\"#4-判定條件與救援倍數\" data-tab=\"sps_oldhand\">4. 判定條件與救援倍數<\/a><a class=\"toc-3\" href=\"#41-主救援\" data-tab=\"sps_oldhand\">4.1 主救援<\/a><a class=\"toc-3\" href=\"#42-延伸救援\" data-tab=\"sps_oldhand\">4.2 延伸救援<\/a><a class=\"toc-2\" href=\"#5-救援執行\" data-tab=\"sps_oldhand\">5. 救援執行<\/a><a class=\"toc-2\" href=\"#6-救援池\" data-tab=\"sps_oldhand\">6. 救援池<\/a><a class=\"toc-2\" href=\"#7-參數分開設定\" data-tab=\"sps_oldhand\">7. 參數分開設定<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-sps_oldhand\"><div class=\"sec-head\"><h1 id=\"老手救援-c-2版\">老手救援 C-2版<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>給 SPS 實作<strong class=\"nr\">中辦老手救援（C-2）<\/strong>用。機制設計與模擬結果見 Omniplay 開發規範〈系統機制〉第 3 節；本文件只寫實作需要的規則、參數與紀錄。<strong class=\"nl nr\">數值皆為暫定<\/strong>，上線值以 Config 為準，程式不得寫死。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>機制版本<\/td><td>C-2<\/td><\/tr><tr><td>適用範圍<\/td><td>中辦；Oldhand 的 NB／EB<\/td><\/tr><tr><td>不適用<\/td><td>Newbie（新手期）、Buy Feature／Super Feature<\/td><\/tr><tr><td>北辦<\/td><td>另有一套，救援池、累積數值與統計<strong class=\"nr\">全部分開<\/strong>，不在本文件範圍<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"1-機制摘要\">1. 機制摘要<\/h2>\n<ul><li><strong class=\"nl nr\">以天為循環<\/strong>：每天<strong>台灣時間 04:00<\/strong> 刷新，當日轉數、當日統計與救援池餘額全部歸零。<\/li><li><strong class=\"nl nr\">40 轉一桶<\/strong>：得分與押注每 40 轉累積成一桶，保留最近 10 桶；判定只看已經滿的桶。<\/li><li><strong class=\"nl nr\">主救援<\/strong>（當日第 41～405 轉）：每 40 轉一個觸發點，在觸發點後第 1～5 轉隨機挑一轉判定；兩個條件都成立就用 Card System 在指定卡片倍率區間重骰。<\/li><li><strong class=\"nl nr\">延伸救援<\/strong>（當日第 441 轉起，<strong class=\"nl nr\">超過第 1,000 轉也照常判定<\/strong>）：同樣每 40 轉一個觸發點，條件 2 改看最近 10 桶（往前 400 轉）。<\/li><li><strong class=\"nl nr\">命中就強制換成救援結果<\/strong>：判定成立、通過押注與救援池檢查，該轉直接用救援結果，不跟自然結果比較高低；救援得分整筆從救援池扣。<\/li><li><strong class=\"nl nr\">押注檢查<\/strong>：判定轉押注超過判定用桶的平均押注，就取消該次救援（防加注套利）。<\/li><li><strong class=\"nl nr\">救援池<\/strong>：每轉提撥押注的一定比例；發放前檢查餘額，不夠就不救。<\/li><li><strong class=\"nl nr\">救援參數分開設定<\/strong>：老手期的 NB／EB × 小／中／大 Bet 共 6 組各自設定，才能精準控制每個模式的 RTP（第 7 節）。<\/li><li>救援結果由 Card System 產生，演出與自然得分無法區分；玩家無法預測判定轉。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-名詞與計算定義\">2. 名詞與計算定義<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>當日<\/td><td>台灣時間 04:00 起至隔日 04:00 前（UTC+8）。<\/td><\/tr><tr><td>當日轉數<\/td><td>玩家在該款遊戲當日的第幾轉，從 1 起算；04:00 歸零。<\/td><\/tr><tr><td>觸發點 <code class=\"nr\">t<\/code><\/td><td>40、80、120…，即每一桶滿的那一轉。<\/td><\/tr><tr><td>判定轉 <code class=\"nr\">k<\/code><\/td><td>觸發點後第 1～5 轉（<code class=\"nl nr\">t+1<\/code>～<code class=\"nl nr\">t+5<\/code>）中抽中的那一轉。<\/td><\/tr><tr><td>得分<\/td><td>每轉最終得分，<strong class=\"nl nr\">含先前救援後的結果<\/strong>（救援得分會計入後續統計）。<\/td><\/tr><tr><td>押注<\/td><td>每轉 Total Bet（實際押注）。<\/td><\/tr><tr><td>桶<\/td><td>當日第 1～40 轉為第 1 桶、第 41～80 轉為第 2 桶…；每桶記 Σ 得分、Σ 押注，滿 40 轉才算完成。<\/td><\/tr><tr><td>前 40 轉 RTP<\/td><td><strong class=\"nl nr\">最近 1 個完成的桶<\/strong>，即第 <code class=\"nr\">t−39<\/code>～<code class=\"nl\">t<\/code> 轉。<\/td><\/tr><tr><td>當日累積 RTP<\/td><td><strong class=\"nl nr\">所有完成的桶<\/strong>，即第 1～<code class=\"nl\">t<\/code> 轉（主救援 <code class=\"nr\">t ≤ 400<\/code>，最多 10 桶）。<\/td><\/tr><tr><td>往前 400 轉 RTP<\/td><td><strong class=\"nl nr\">最近 10 個完成的桶<\/strong>，即第 <code class=\"nr\">t−399<\/code>～<code class=\"nl\">t<\/code> 轉。<\/td><\/tr><tr><td>平均押注<\/td><td>條件 2 用的那些桶（最近 10 桶）的 Σ 押注 ÷ 轉數。<\/td><\/tr><tr><td>救援成本<\/td><td>救援得分，即重骰出來的該轉最終得分（整筆從救援池扣，不扣掉自然得分）。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">10 桶滾動<\/strong>：累積滿 10 桶後開始累積第 11 桶；第 11 桶滿時丟掉第 1 桶，之後每滿一桶就丟掉最舊的一桶，永遠保留最近 10 桶。<\/li><li>條件 2 一律取<strong class=\"nr\">最近 10 桶<\/strong>（不足 10 桶就全拿）：第 400 轉以前就是當日累積，第 400 轉以後就是往前 400 轉。<\/li><li><strong class=\"nl nr\">只看完成的桶<\/strong>：判定轉 <code>k<\/code> 與 <code class=\"nr\">t+1<\/code>～<code class=\"nl\">k−1<\/code> 都在還沒滿的桶內，不納入本次判定；這些轉數（含救援後得分）照常累積進該桶，下次判定才算進去。<\/li><li>例：判定轉為第 202 轉（觸發點 200）→ 條件 1 取第 5 桶（第 161～200 轉）；條件 2 取第 1～5 桶（第 1～200 轉）。<\/li><li>例：判定轉為第 443 轉（觸發點 440）→ 條件 1 取第 11 桶（第 401～440 轉）；條件 2 取第 2～11 桶（第 41～440 轉）。<\/li><li>門檻比較一律為<strong class=\"nr\">嚴格小於<\/strong>（<code class=\"nl nr\">&lt;<\/code>）。<\/li><li>所有 RTP 都以「得分 ÷ 押注」計算，跨不同押注金額的轉數直接加總。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-判定時程\">3. 判定時程<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>階段<\/th><th>觸發點 <code class=\"nr\">t<\/code><\/th><th>判定區間<\/th><th class=\"n\">區間數<\/th><\/tr><\/thead><tbody><tr><td>主救援<\/td><td>40、80、…、400<\/td><td><code class=\"nl nr\">[t+1, t+5]<\/code>（41～45、81～85…401～405）<\/td><td class=\"n\">10<\/td><\/tr><tr><td>延伸救援<\/td><td>440、480、520、…（不設上限）<\/td><td><code class=\"nl nr\">[t+1, t+5]<\/code>（441～445、481～485…）<\/td><td class=\"n\">到當日結束<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>每個區間在 <code>[t+1, t+5]<\/code> 內<strong>均勻隨機<\/strong>抽一個整數作為判定轉；每人每天每區間只判定一次。<\/li><li>抽選在當日開始（或進入該區間前）完成，玩家無法得知。<\/li><li>玩家當日沒玩到抽中的那一轉 → 該區間不判定，不補判。<\/li><li><strong class=\"nl nr\">延伸救援沒有停判轉<\/strong>，超過當日第 1,000 轉仍每 40 轉判定一次，直到 04:00 刷新；當日第 1～40 轉、第 406～440 轉不判定。<\/li><\/ul>\n<p><strong class=\"nl nr\">第一個判定區間<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>玩家<\/th><th>第一個判定區間<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新玩家第一天<\/td><td><strong class=\"nl nr\">第 241～245 轉<\/strong><\/td><td>前 200 轉是新手期，不做老手救援<\/td><\/tr><tr><td>第二天起（已是老手）<\/td><td><strong class=\"nl nr\">第 41～45 轉<\/strong><\/td><td>照第 4 節從頭判定<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新玩家第一天跳過第 201～205 轉：這次判定看的桶是第 161～200 轉，還在新手期。<\/li><li>第 241～245 轉看的桶是第 201～240 轉，是第一個整桶都在老手期的桶。<\/li><li>當日轉數與桶都照常從第 1 轉起算，新手期的轉數也算進當日累積 RTP。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-判定條件與救援倍數\">4. 判定條件與救援倍數<\/h2>\n<h3 id=\"41-主救援\">4.1 主救援<\/h3>\n<p><strong class=\"nl nr\">目標：不同階段給不同倍數。<\/strong>數據顯示，玩家在一天中不同階段需要的救援倍數不同，所以每個觸發點各自設定門檻與救援倍數：<\/p>\n<ul><li><strong class=\"nl nr\">前段轉數少<\/strong>：小倍數就能把當日 RTP 拉回來（例：第 41 轉給 25×，當日 RTP 約 +61%），給太大會讓救援後 RTP 超過 100%。<\/li><li><strong class=\"nl nr\">後段轉數多<\/strong>：同樣倍數對當日 RTP 的影響被攤薄（第 401 轉給 100× 只 +25%）；當日沒開出 50× 以上大獎的老手隔日流失率明顯上升，所以後段要給到約 100× 才補得上一次夠大的體驗。<\/li><\/ul>\n<p>兩個條件都成立才命中：<\/p>\n<ul><li>條件 1：前 40 轉 RTP（最近 1 桶）<code class=\"nl nr\">&lt;50%<\/code><\/li><li>條件 2：當日累積 RTP（最近 10 桶）<code class=\"nl\">&lt;<\/code> 該區間門檻<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">觸發點<\/th><th>判定區間<\/th><th class=\"n\">條件 2 門檻<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">40<\/td><td>第 41～45 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;25%<\/code><\/td><td class=\"n\">(20, 25]<\/td><\/tr><tr><td class=\"n\">80<\/td><td>第 81～85 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;30%<\/code><\/td><td class=\"n\">(45, 50]<\/td><\/tr><tr><td class=\"n\">120<\/td><td>第 121～125 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;35%<\/code><\/td><td class=\"n\">(60, 70]<\/td><\/tr><tr><td class=\"n\">160<\/td><td>第 161～165 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;40%<\/code><\/td><td class=\"n\">(70, 80]<\/td><\/tr><tr><td class=\"n\">200<\/td><td>第 201～205 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;45%<\/code><\/td><td class=\"n\">(80, 90]<\/td><\/tr><tr><td class=\"n\">240<\/td><td>第 241～245 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;50%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">280<\/td><td>第 281～285 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;55%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">320<\/td><td>第 321～325 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;55%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">360<\/td><td>第 361～365 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;60%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><tr><td class=\"n\">400<\/td><td>第 401～405 轉<\/td><td class=\"n\"><code class=\"nl nr\">&lt;65%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"42-延伸救援\">4.2 延伸救援<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發點<\/th><th>條件 1<\/th><th>條件 2<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>440 起每 40 轉（超過 1,000 轉照常）<\/td><td>前 40 轉 RTP（最近 1 桶）<code class=\"nl nr\">&lt;50%<\/code><\/td><td>往前 400 轉 RTP（最近 10 桶）<code class=\"nl nr\">&lt;65%<\/code><\/td><td class=\"n\">(90, 100]<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">EB 的救援倍數放大<\/strong>：救援得分一律以判定轉的<strong>實際押注<\/strong>計算（救援得分 = 救援倍數 × 實際押注），NB、EB 救同樣倍數，拿到的都是押注的同樣倍數。Card System 以 NB 基準成本為倍率分母，所以 EB 的救援倍數區間要乘上 EB 押注倍數。例：NB 押 $1、EB 押 $2（NB 的 2 倍），救 30× 時 NB 拿 $30、EB 拿 $60（卡片上是 60×）。<\/li><li>卡片倍率區間的定義與倍率分母見 Omniplay 開發規範〈數學模型規範〉第 1.8 節、第 2.5 節。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"5-救援執行\">5. 救援執行<\/h2>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">取該區間的門檻與救援倍數（依判定轉的押注層級）<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">條件 1 最近 1 桶 RTP；條件 2 最近 10 桶 RTP（只看完成的桶）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>命中，進入押注檢查<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本區間結束，該轉照自然結果<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">押注檢查<\/div><div class=\"step-desc\">判定轉押注與判定用桶（最近 10 桶）的平均押注比較<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">判定轉押注 ≤ 平均押注<\/span><span>進入重骰<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">判定轉押注 &gt; 平均押注<\/span><span>取消本次救援，該轉照自然結果<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">重骰<\/div><div class=\"step-desc\">Card System 在救援倍數的卡片區間內產生救援結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與救援成本<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放：該轉強制換成救援結果，救援池扣除救援成本<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援，該轉照自然結果<\/span><\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong class=\"nl nr\">強制換成救援結果<\/strong>：發放時該轉直接用救援結果，不跟自然結果比較高低；自然結果作廢、不發給玩家。<\/li><li><strong class=\"nl nr\">押注檢查<\/strong>：判定轉押注 &gt; 判定用桶的平均押注（Σ 押注 ÷ 轉數，與條件 2 同一批桶）就取消，不重骰、不扣池、不補判。例：第 202 轉判定 → 跟第 1～200 轉的平均押注比。<\/li><li>救援後的最終得分計入所在的桶，影響後續判定（第 2 節）。<\/li><li>不救援時不補發、不累積、不延到下一個區間。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"6-救援池\">6. 救援池<\/h2>\n<p><strong class=\"nl nr\">目標：控制風險（RTP）。<\/strong>救援機制決定誰該救、救多少；救援池決定這一筆付不付得起。每轉只提撥押注的固定比例，救援發出的總額不會超過提撥總額，救援對 RTP 的貢獻因此被鎖在提撥比例（暫定 1%）以內，不會因為某天觸發特別多而失控。<\/p>\n<pre><code>提撥額     = 該轉 Total Bet × pool_rate（依該轉的押注層級）\n救援池餘額 = 當日起始餘額 + Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>規則<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>範圍<\/td><td>中辦<strong class=\"nr\">單一救援池<\/strong>（不分遊戲、不設個人池）；北辦的池分開，不流用。<\/td><\/tr><tr><td>提撥<\/td><td>每一轉 Oldhand NB／EB 押注依 <code>pool_rate<\/code> 提撥；暫定 <strong class=\"nr\">1%<\/strong>。<\/td><\/tr><tr><td>刷新<\/td><td>每天台灣時間 04:00 餘額歸零；當日起始餘額暫定 0。<\/td><\/tr><tr><td>發放前檢查<\/td><td>每筆救援都要先檢查，餘額 &lt; 救援成本就不救（硬性上限，當日發出總額不超過當日可用總額）。<\/td><\/tr><tr><td>併發<\/td><td>8 台機器各自判定；同時觸發時前一筆還沒扣款，最多 8 名玩家會看到同一個餘額而全部發放，池子可能變負。超發量小，且 04:00 歸零時負數不帶到隔天，<strong class=\"nl nr\">接受、不另處理<\/strong>。<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"7-參數分開設定\">7. 參數分開設定<\/h2>\n<p><strong class=\"nl nr\">目標：精準控制每個模式的 RTP。<\/strong><\/p>\n<p><strong class=\"nl nr\">問題<\/strong>：原本救援參數只有一套，NB／EB、小／中／大 Bet 全部共用。但各模式的自然 RTP 起伏不同，同一套參數放進去，救援給出去的 RTP 也不同，沒辦法每個模式都精準控制。<\/p>\n<ul><li>例：宙斯 2500 用現行參數，NB 的救援 RTP 約 7.0%、EB 約 8.9%。只有一套參數時，調到 NB 剛好，EB 就會超；調到 EB 剛好，NB 又不夠。<\/li><\/ul>\n<p><strong class=\"nl nr\">做法<\/strong>：拆成 6 組，每組參數各自設定，才能各自調到目標救援 RTP。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><\/th><th>小 Bet（<code class=\"nl nr\">&lt; $2<\/code>）<\/th><th>中 Bet（<code class=\"nl nr\">$2～$100<\/code>）<\/th><th>大 Bet（<code class=\"nl nr\">&gt; $100<\/code>）<\/th><\/tr><\/thead><tbody><tr><td><strong class=\"nl nr\">NB<\/strong><\/td><td>第 1 組<\/td><td>第 2 組<\/td><td>第 3 組<\/td><\/tr><tr><td><strong class=\"nl nr\">EB<\/strong><\/td><td>第 4 組<\/td><td>第 5 組<\/td><td>第 6 組<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>是否分組<\/th><\/tr><\/thead><tbody><tr><td>條件 1 門檻（前 40 轉 RTP）<\/td><td>6 組各自設定<\/td><\/tr><tr><td>條件 2 的 10 段門檻<\/td><td>6 組各自設定<\/td><\/tr><tr><td>救援倍數（10 段卡片區間）<\/td><td>6 組各自設定<\/td><\/tr><tr><td>延伸救援的條件與倍數<\/td><td>6 組各自設定<\/td><\/tr><tr><td>提撥比例<\/td><td>6 組各自設定（都提撥進同一個救援池）<\/td><\/tr><tr><td>觸發節奏（40 轉一桶、保留 10 桶、觸發點後第 1～5 轉判定）<\/td><td>6 組共用<\/td><\/tr><tr><td>起判轉（41）、每日刷新時間（04:00）<\/td><td>6 組共用<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">適用範圍<\/strong>：只有老手期（Oldhand）的 NB／EB。新手期（Newbie）不做老手救援，BF／SF 沒有救援，都不用設定。<\/li><li><strong class=\"nl nr\">A／B 版<\/strong>：已經靠不同 Config 檔分開（<code class=\"nl nr\">config_01A.js<\/code>／<code class=\"nl nr\">config_01B.js<\/code>），A、B 各有自己的 6 組，不用另外處理。<\/li><li><strong class=\"nl nr\">押注層級<\/strong>：依 Omniplay 開發規範〈數學模型規範〉第 1.7.1 節判定。<\/li><li><strong class=\"nl nr\">實作要求<\/strong>：6 組都要能設定，不得缺少或互相 fallback；目前 6 組先填相同數值（第 4 節），之後再分開調整。<\/li><\/ul><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['sps_oldhand'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 表格：最小寬＝不換行寬（上限 1000px）；第一欄一行放得下（≤ 表格 1/4 寬）就不換行，否則固定 1/4 寬並換行\n(function() {\n  function cap() {\n    document.querySelectorAll('table').forEach(function(t) {\n      var r = t.rows[0];\n      if (!r || !t.offsetWidth) return;\n      // 表格寬度不隨框變窄：最小寬＝整列不換行的寬（上限 TABLE_MAX），框放不下就左右拖曳\n      t.classList.remove('fc-cap'); t.style.minWidth = ''; t.classList.add('nw-measure');\n      var nw = Math.ceil(t.getBoundingClientRect().width) + 2, colMax = 0;\n      for (var c = 0; c < r.cells.length; c++) colMax = Math.max(colMax, r.cells[c].offsetWidth);\n      t.classList.remove('nw-measure');\n      // 全是短欄（每欄 ≤ 400px）→ 一律不換行、整張左右拖曳；有長文字欄 → 最小寬上限 1000px，長文字才換行\n      t.style.minWidth = (colMax <= 400 ? nw : Math.min(nw, 1000)) + 'px';\n      if (r.cells.length < 2) return;\n      var w = 0;\n      for (var i = 0; i < t.rows.length; i++) w = Math.max(w, t.rows[i].cells[0] ? t.rows[i].cells[0].offsetWidth : 0);\n      if (w > t.offsetWidth * 0.25) t.classList.add('fc-cap');\n    });\n  }\n  cap();\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(cap);\n  window.addEventListener('load', cap);\n  window.addEventListener('resize', cap);\n  document.addEventListener('click', function() { setTimeout(cap, 0); });\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

function setHash() {

// 目錄最多兩層：大類下只有一份文件時列章節；多份文件時只列文件名（章節看內文）

function secName(t) { return t.replace(/^\d+(\.\d+)*\.?\s*/, ''); }
function secLink(t, s, on) {
  return '<a href="#" data-tab="' + t + '" data-anchor="' + s[1] + '"' + (on ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a>';
}
// 整站只有一份文件（開發流程）：每章當一個大類、小節列在下面，與其他站同一種結構
function renderFlat(m, t) {

  // 目前讀到的小節所屬的章（第 2 層）

  list.forEach(function (s) {
    if (s[0] === 2) {
      if (open) out += '</ul></li>';
      out += '<li>' + secLink(t, s, s[1] === curChap) + '<ul>';
      open = true;
    } else if (open) {
      out += '<li>' + secLink(t, s, s[1] === cur.anchor) + '</li>';
    }

  if (open) out += '</ul></li>';
  return out.replace(/<ul><\/ul>/g, '');
}
function renderToc() {

  gs.forEach(function (g) {

    {   // 全部展開，不折疊

        ids.forEach(function (t) {

  });
});
document.addEventListener('click', function (e) { if (!e.target.closest('.tn')) document.querySelectorAll('.tn').forEach(function (x) { x.classList.remove('open'); }); });
// 同一時間只開一個選單：滑鼠移到別的頁簽時，關掉點開的那個；離開頁簽列也全部關閉
document.querySelectorAll('.tn').forEach(function (t) {
  t.addEventListener('mouseenter', function () { document.querySelectorAll('.tn').forEach(function (x) { if (x !== t) x.classList.remove('open'); }); });
});
document.querySelector('.topnav') && document.querySelector('.topnav').addEventListener('mouseleave', function () {
  document.querySelectorAll('.tn').forEach(function (x) { x.classList.remove('open'); });
});
document.querySelector('.nav') && document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  // ===== 全站搜尋：標題＋內文，Ctrl+K 聚焦，結果直接跳到該節 =====
  var idx = [];
  KEYS.forEach(function (key) {
    var el = document.getElementById('doc-' + key);
    if (!el) return;
    var dom = new DOMParser().parseFromString(JSON.parse(el.textContent), 'text/html');
    var site = SITES[key].name, titles = SITES[key].meta.titles || {};
    dom.querySelectorAll('section.panel').forEach(function (sec) {
      var tab = sec.id.replace(/^panel-/, ''), doc = titles[tab] || '';
      var cur = { key: key, tab: tab, anchor: '', title: doc, path: site + ' › ' + doc, text: '' };
      idx.push(cur);
      var walker = dom.createTreeWalker(sec, NodeFilter.SHOW_ELEMENT);
      for (var n = walker.nextNode(); n; n = walker.nextNode()) {
        if (/^H[1-4]$/.test(n.tagName) && n.id) {
          cur = { key: key, tab: tab, anchor: n.id, title: n.textContent.trim(), path: site + ' › ' + doc, text: '' };
          idx.push(cur);
        } else if (/^(P|LI|TD|TH|PRE|BLOCKQUOTE)$/.test(n.tagName)) {
          cur.text += ' ' + n.textContent.replace(/\s+/g, ' ');
        }
      }
    });
  });

  var hdr = document.querySelector('.topnav') || document.querySelector('header');
  var box = document.createElement('div');
  box.className = 'pv-search';
  box.innerHTML = '<span class="ico">⌕</span><input type="search" placeholder="搜尋所有規範…" aria-label="搜尋所有規範"><div class="pv-res"></div>';
  hdr.appendChild(box);
  var input = box.querySelector('input'), res = box.querySelector('.pv-res'), hits = [], sel = 0;
  function e(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hl(s, q) { var i = s.toLowerCase().indexOf(q); return i < 0 ? e(s) : e(s.slice(0, i)) + '<mark>' + e(s.slice(i, i + q.length)) + '</mark>' + e(s.slice(i + q.length)); }
  function snip(t, q) { var i = t.toLowerCase().indexOf(q); if (i < 0) return ''; var a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + q.length + 60); }
  function search() {
    var q = input.value.trim().toLowerCase();
    if (!q) { res.classList.remove('on'); return; }
    hits = idx.map(function (r) {
      var t = r.title.toLowerCase().indexOf(q) >= 0, b = r.text.toLowerCase().indexOf(q) >= 0;
      return { r: r, s: t ? 2 : b ? 1 : 0 };
    }).filter(function (h) { return h.s; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 30);
    sel = 0;
    res.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a class="pv-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><div class="pv-path">' + e(h.r.path) + '</div><div class="pv-title">' + hl(h.r.title, q) + '</div>' +
        (h.s === 1 || snip(h.r.text, q) ? '<div class="pv-snip">' + hl(snip(h.r.text, q), q) + '</div>' : '') + '</a>';
    }).join('') : '<div class="pv-empty">找不到「' + e(input.value) + '」</div>';
    res.classList.add('on');
  }
  function pick(i) {
    var r = hits[i] && hits[i].r; if (!r) return;
    res.classList.remove('on'); input.blur();
    if (cur.key === r.key) go(r.tab, r.anchor); else openSite(r.key, r.tab, r.anchor);
  }
  input.addEventListener('input', search);
  input.addEventListener('focus', search);
  input.addEventListener('keydown', function (ev) {
    var items = res.querySelectorAll('.pv-item');
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!items.length) return;
      items[sel].classList.remove('sel'); sel = (sel + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter') { ev.preventDefault(); pick(sel); }
    else if (ev.key === 'Escape') { res.classList.remove('on'); input.blur(); }
  });
  res.addEventListener('mousedown', function (ev) { var a = ev.target.closest('.pv-item'); if (a) { ev.preventDefault(); pick(+a.dataset.i); } });
  document.addEventListener('click', function (ev) { if (!box.contains(ev.target)) res.classList.remove('on'); });
  document.addEventListener('keydown', function (ev) { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); input.focus(); input.select(); } });
})();
// 手機版：內文框高度跟著內容，整頁一起捲動；標題列高度給頁簽列的固定位置用
(function () {
  var mq = window.matchMedia('(max-width:760px)'), ro = null;
  function hh() { var h = document.querySelector('header'); document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
  function fit() {
    if (!mq.matches) { frame.style.height = ''; return; }
    try { var d = frame.contentDocument; frame.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px'; } catch (e) {}
  }
  frame.addEventListener('load', function () {
    fit();
    try { if (ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(frame.contentDocument.body); } catch (e) {}
  });
  window.addEventListener('message', function () { setTimeout(fit, 50); });
  window.addEventListener('resize', function () { hh(); fit(); });
  hh();
})();
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
</body>
