>本規範適用於 <strong class=\"nr\">Landbase 轉製遊戲<\/strong>：實體機台數學轉製為線上版，Game List 備註「線上-Landbase轉製遊戲」者，例如 102xxx／105xxx。<\/p>\n<p>RTP 配置與系統機制的正式來源為 Google 試算表 <a href=\"https://docs.google.com/spreadsheets/d/1Qk66cM8iZqyEhr23nsnxiDXOHj8CGNji--sedOHF0F8/edit?gid=386193409\" class=\"nr\">RTP 設定<\/a>（<code class=\"nl nr\">數值設定<\/code>、<code class=\"nl\">彩金參數<\/code> 兩頁）。目前引用 <strong class=\"nr\">2026/05/14「全平台」版的「轉製遊戲」欄<\/strong>；試算表更新時必須同步修訂並記錄日期。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-頁籤\">1. 頁籤<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁籤<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"knowhow\">Knowhow<\/a><\/td><td>市場、平台 RTP 要求<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"系統機制\">系統相關<\/a><\/td><td>新手體驗、系統限制（新手／低注不拉 Link、最大賠付）<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"math\">數學設計<\/a><\/td><td>數學模型（必要內容／數學調性、模型命名、押注選項、RTP 配置、彩金配置、Bet Mode）、Card System 設定結構<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"送驗規範\">送驗相關<\/a><\/td><td>通用原則（送驗產出、必要檔案與命名、禁止內容、SHA1）、送驗文件（PARsheet、模擬程式、數學說明文件、Game Description）、檢查清單<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-knowhow\" hidden><div class=\"sec-head\"><h1 id=\"landbase-knowhow\">Landbase Knowhow<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁記錄 Landbase 轉製產線的市場與平台背景，作為數學設計的前提。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-市場與平台要求\">1. 市場與平台要求<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>市場<\/td><td>菲律賓<\/td><\/tr><tr><td>平台 RTP 要求<\/td><td>Total RTP 須介於 <code class=\"nr\">96.5%<\/code>～<code class=\"nl nr\">97%<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Landbase 的 RTP 拆分見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.4 節。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-系統機制\" hidden><div class=\"sec-head\"><h1 id=\"landbase-轉製-系統機制\">Landbase 轉製 系統機制<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁說明 Landbase 轉製遊戲的新手體驗與系統限制。RTP 配置與 Link 彩金見<a href=\"#\" class=\"nr tab-link\" data-tab=\"math\">數學模型規範<\/a>。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-新手體驗\">1. 新手體驗<\/h2>\n<p>轉製遊戲使用新手體驗 D 版，轉製時要用到的規則如下。<\/p>\n<h3 id=\"11-救援倍數\">1.1 救援倍數<\/h3>\n<p>新手體驗預設給出下列倍數（可依遊戲調整），轉製遊戲必須能產生這些結果：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>判定<\/th><th>救援倍數<\/th><\/tr><\/thead><tbody><tr><td>第一次<\/td><td>15×<\/td><\/tr><tr><td>第二次<\/td><td>強 30×／弱 15×<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-轉製遊戲要注意的地方\">1.2 轉製遊戲要注意的地方<\/h3>\n<ul><li>只給新手 Profile，RTP 預算 2.00%。<\/li><li>新手 Total RTP 97.00% ＝ Game 95.00% ＋ 新手體驗 2.00%；數學模型只負責 Game RTP，新手體驗的派彩計算與驗證時必須和 Game RTP 分開統計。<\/li><li>遊戲必須能在判定回合產生上表倍數（預設 15× 與 30×）的結果，且演出與自然得分無法區分；做法依腳本規範的新手體驗腳本，或由 Card System 重骰產生。<\/li><li>新手期不得拉 Link 彩金（第 2 節），新手體驗給出的得分也不得觸發 Link 事件。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-系統限制\">2. 系統限制<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>限制<\/th><th>規則<\/th><\/tr><\/thead><tbody><tr><td>新手標籤<\/td><td>玩家仍帶有新手標籤時，<strong class=\"nl nr\">任何 Bet Mode（含 BF／SF）都不得拉 Link 彩金<\/strong>；不得因為購買 Feature 而繞過新手限制。<\/td><\/tr><tr><td>新手期<\/td><td>新手期不得拉彩金，Link RTP 必為 0%；<code class=\"nl\">&gt;= $2<\/code> 時只滾 Inrc、不中彩。<\/td><\/tr><tr><td>低注<\/td><td><code class=\"nl\">bet_tier_amount &lt; $2<\/code> 不得拉 Link 彩金，新手、老手皆同；NB／EB 以實際押注、BF／SF 以反推基礎押注判定。<\/td><\/tr><tr><td>系統最大賠付<\/td><td><strong class=\"nl nr\">單把派彩上限 <code>$10,000,000<\/code>，超過整把重骰<\/strong>。BG／FG 另有單把上限，規則見天花板說明；數學模型必須依該文件驗算倍率上限，並在數學文件明記。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Link 資格一律由系統依 Profile 與 <code>bet_tier_amount<\/code> 判定；<code class=\"nl\">link_enabled = false<\/code> 時不得只把派彩改成 0，結果中不得出現已觸發但不派彩的 Link 事件或演出。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-檢查清單\">3. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 新手（含 BF／SF）與低注的 Link RTP 為 0%，且結果中無已觸發但不派彩的 Link 事件。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 倍率上限已依天花板說明驗算（BG、FG、系統賠付上限）並記錄。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-math\" hidden><div class=\"sec-head\"><h1 id=\"landbase-轉製-數學模型規範\">Landbase 轉製 數學模型規範<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁說明 Landbase 轉製遊戲的數學模型與 Card System。新手體驗與系統限制見<a href=\"#\" class=\"nr tab-link\" data-tab=\"系統機制\">系統機制<\/a>。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-數學模型\">1. 數學模型<\/h2>\n<h3 id=\"11-必要內容\">1.1 必要內容<\/h3>\n<ul><li>數學調性目前<strong class=\"nr\">沒有明確方向，由負責人自由發揮<\/strong>（待討論）。<\/li><li>自由發揮不代表免記錄。負責人決定調性後，必須在數學模型的 <code>Game Description<\/code> 工作表與 <code>game_rule.md<\/code> 寫明：<ul><li>以原機數學為底還是重新設計；若以原機為底，記錄原機 RTP（Game List 的「RTP 版本」欄，例：84%）與調整到線上目標 RTP 的方式（改輪帶、改 Paytable、Card System 或其他）。<\/li><li>波動度／最大倍數目標與 Hit Rate 目標。<\/li><li>是否啟用 Card System；啟用時依第 2 章。<\/li><\/ul><\/li><li>原機既有的 Bonus／Feature 玩法屬於 Game RTP 的一部分，不另拆 Bonus Game RTP（見第 1.4 節）。<\/li><\/ul>\n<h3 id=\"12-模型命名\">1.2 模型命名<\/h3>\n<ul><li>Landbase 轉製遊戲的 ParSheet ID 仍為 <code class=\"nr\">H&lt;三位數字&gt;1<\/code>；同一數學供多個 Game ID 使用時（如 <code>H0111<\/code> → 102001／102002），數學模型只建一份，Game ID 對應記錄於 <code>Game Description<\/code> 工作表與 Game List。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<p>押注金額由三個參數相乘（來源：H5 企劃書 <code>6.BetCurreny<\/code> 工作表）：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits；Denom = 0.002 → 1 倍押注 = 0.2<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3<\/th><th class=\"n\">4<\/th><th class=\"n\">5<\/th><th class=\"n\">6<\/th><th class=\"n\">7<\/th><th class=\"n\">8<\/th><th class=\"n\">9<\/th><th class=\"n\">10<\/th><th class=\"n\">11<\/th><th class=\"n\">12<\/th><th class=\"n\">13<\/th><th class=\"n\">14<\/th><th class=\"n\">15<\/th><th class=\"n\">16<\/th><th class=\"n\">17<\/th><th class=\"n\">18<\/th><th class=\"n\">19<\/th><th class=\"n\">20<\/th><th class=\"n\">21<\/th><th class=\"n\">22<\/th><th class=\"n\">23<\/th><th class=\"n\">24<\/th><th class=\"n\">25<\/th><th class=\"n\">26<\/th><th class=\"n\">27<\/th><th class=\"n\">28<\/th><th class=\"n\">29<\/th><th class=\"n\">30<\/th><\/tr><\/thead><tbody><tr><td>倍數<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">5<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">15<\/td><td class=\"n\">20<\/td><td class=\"n\">25<\/td><td class=\"n\">30<\/td><td class=\"n\">35<\/td><td class=\"n\">40<\/td><td class=\"n\">45<\/td><td class=\"n\">50<\/td><td class=\"n\">60<\/td><td class=\"n\">70<\/td><td class=\"n\">80<\/td><td class=\"n\">90<\/td><td class=\"n\">100<\/td><td class=\"n\">150<\/td><td class=\"n\">200<\/td><td class=\"n\">300<\/td><td class=\"n\">500<\/td><td class=\"n\">1000<\/td><td class=\"n\">1500<\/td><td class=\"n\">3000<\/td><td class=\"n\">5000<\/td><td class=\"n\">7500<\/td><td class=\"n\">10000<\/td><td class=\"n\">15000<\/td><td class=\"n\">25000<\/td><\/tr><tr><td>金額<\/td><td class=\"n\">0.2<\/td><td class=\"n\">0.4<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">2.4<\/td><td class=\"n\">3<\/td><td class=\"n\">4<\/td><td class=\"n\">5<\/td><td class=\"n\">6<\/td><td class=\"n\">7<\/td><td class=\"n\">8<\/td><td class=\"n\">9<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">14<\/td><td class=\"n\">16<\/td><td class=\"n\">18<\/td><td class=\"n\">20<\/td><td class=\"n\">30<\/td><td class=\"n\">40<\/td><td class=\"n\">60<\/td><td class=\"n\">100<\/td><td class=\"n\">200<\/td><td class=\"n\">300<\/td><td class=\"n\">600<\/td><td class=\"n\">1,000<\/td><td class=\"n\">1,500<\/td><td class=\"n\">2,000<\/td><td class=\"n\">3,000<\/td><td class=\"n\">5,000<\/td><\/tr><tr><td>開啟<\/td><td class=\"n\"><\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>倍數表共 30 組；<strong class=\"nl nr\">「開啟」列打勾的 23 檔才上線<\/strong>（<code class=\"nl nr\">1<\/code>～<code class=\"nl nr\">5,000<\/code>），其餘不開。<\/li><\/ul>\n<h3 id=\"14-rtp-配置\">1.4 RTP 配置<\/h3>\n<pre><code>Total RTP = Link RTP + Game RTP + 新手體驗 RTP<\/code><\/pre>\n<ul><li>轉製遊戲<strong class=\"nr\">不拆 Bonus Game RTP<\/strong>；試算表「轉製遊戲」欄的 Bonus／Game 為同一合併欄位，原機的 Bonus／Feature 派彩全部歸入 Game RTP。<\/li><li>新手滾入彩池的 Increment 不計入新手 Total RTP；定義見第 1.5 節。<\/li><li>RTP ＝ Total Win ÷ 實際 Total Bet；產品顯示可四捨五入，但計算用完整精度；各 Bet Mode 分母用該模式實際成本。<\/li><\/ul>\n<h4 id=\"141-nbeb-rtp-配置\">1.4.1 NB／EB RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Player Profile<\/th><th>押注層級<\/th><th class=\"n\">判定金額<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Game RTP<\/th><th class=\"n\">新手體驗 RTP<\/th><th class=\"n\">Total (+機制)<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>不分層級<\/td><td class=\"n\">全部<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">95.00%<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><tr><td>老手<\/td><td>高注<\/td><td class=\"n\"><code class=\"nl nr\">&gt;= $2<\/code><\/td><td class=\"n\">2.00%<\/td><td class=\"n\">95.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><tr><td>老手<\/td><td>低注<\/td><td class=\"n\"><code class=\"nl nr\">&lt; $2<\/code><\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">97.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手<strong class=\"nr\">不分大小 Bet<\/strong>，只有一套 RTP：Link 0% ＋ Game 95% ＋ 新手體驗 2% ＝ 97%。<\/li><li>老手 <code>&gt;= $2<\/code> 的 Game RTP 比 <code>&lt; $2<\/code> 低 2 個百分點，差額即 Link RTP，兩級 Total 相同。<\/li><li>新手 Link RTP 皆為 0%；新手 <code>&gt;= $2<\/code> 的 Increment 只滾入彩池、不可中彩（見<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>的系統限制）。<\/li><li>本表於 2026-10-05 調整，與試算表 2026/05/14 版不同；試算表更新後兩者須一致。<\/li><\/ul>\n<h4 id=\"142-bfsf-rtp-配置\">1.4.2 BF／SF RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Player Profile<\/th><th>押注層級<\/th><th class=\"n\">判定金額<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Game RTP<\/th><th class=\"n\">新手體驗 RTP<\/th><th class=\"n\">Total (+機制)<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td>不分層級<\/td><td class=\"n\">全部<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><tr><td>老手<\/td><td>高注<\/td><td class=\"n\"><code class=\"nl nr\">&gt;= $2<\/code><\/td><td class=\"n\">2.00%<\/td><td class=\"n\">94.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><tr><td>老手<\/td><td>低注<\/td><td class=\"n\"><code class=\"nl nr\">&lt; $2<\/code><\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>BF／SF 的 Total RTP 為 <strong class=\"nr\">96.50%<\/strong>（比 NB／EB 的 97% 低 0.5 個百分點），不含新手體驗。<\/li><li>新手 BF／SF 與老手 <code>&lt; $2<\/code> 相同：Link 0% ＋ Game 96.5% ＝ 96.5%；<strong class=\"nl nr\">新手 BF 的 Link RTP 必為 0%<\/strong>。<\/li><li>老手 <code>&gt;= $2<\/code> 為 Link 2% ＋ Game 94.5% ＝ 96.5%。<\/li><\/ul>\n<h3 id=\"15-彩金配置\">1.5 彩金配置<\/h3>\n<p>Link 彩金為 Grand、Major 兩層累積彩池。<strong class=\"nl nr\">配置跟該遊戲所在的賭場一致<\/strong>，不另訂（試算表 <code>彩金參數<\/code> 頁，2026/05/14）。<\/p>\n<h4 id=\"151-link-資格\">1.5.1 Link 資格<\/h4>\n<p>「可滾 Inrc」表示該局押注會依 Increment 比例滾入彩池；「可拉 Link」表示該局有資格中 Grand／Major。兩者是不同的資格：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>押注<\/th><th>可拉 Link<\/th><th>可滾 Inrc<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td><code class=\"nl nr\">&lt; $2<\/code><\/td><td>否<\/td><td>否<\/td><\/tr><tr><td>新手<\/td><td><code class=\"nl nr\">&gt;= $2<\/code><\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">&lt; $2<\/code><\/td><td>否<\/td><td>否<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">&gt;= $2<\/code><\/td><td>是<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>NB／EB 與 BF／SF 都適用上表；押注金額依第 1.6 節判定。系統限制另見<a href=\"#\" class=\"nr tab-link\" data-tab=\"系統機制\">系統機制<\/a>。<\/li><li>Link RTP 與 Increment 由系統層依賭場設定，數學模型不得把彩金參數寫死在輪帶或 Paytable；模型只負責 Game RTP 與新手體驗，並在 <code>Game Description<\/code> 記錄採用的賭場與參數版本。<\/li><li>數學模型必須定義哪些派彩歸入 Link、哪些歸入 Game，不得重複計算。<\/li><\/ul>\n<h4 id=\"152-link-彩金配置\">1.5.2 Link 彩金配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>賭場<\/th><th>級距<\/th><th class=\"n\">初始金額<\/th><th class=\"n\">Startup%<\/th><th class=\"n\">Increment<\/th><th class=\"n\">RTP<\/th><\/tr><\/thead><tbody><tr><td>Online（小平台）<\/td><td>Grand<\/td><td class=\"n\">$100,000<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online（小平台）<\/td><td>Major<\/td><td class=\"n\">$20,000<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online<\/td><td>Grand<\/td><td class=\"n\">$500,000<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><\/tr><tr><td>Online<\/td><td>Major<\/td><td class=\"n\">$100,000<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">有 Link 的遊戲才依本表配置<\/strong>，沒有 Link 的遊戲不用此配置。<\/li><li><strong class=\"nl nr\">賭場線上線下串連的配置不列入本表<\/strong>：若要讓某賭場的線上與線下（實體機台）彩金串在一起，線上的配置必須與該賭場線下<strong class=\"nr\">一模一樣<\/strong>；而每款 Landbase 轉製遊戲在賭場的配置都不同，無法訂一套共用值。目前只有 MFB（Okada）一家賭場，所以真要串時先以 MFB 的配置為準（例：Grand <code class=\"nr\">$1,000,000<\/code>／Startup 1.10%／Increment 0.20%／RTP 1.30%；Major <code class=\"nr\">$100,000<\/code>／0.50%／0.20%／0.70%）；之後若不再有這需求就用不到，因此<strong class=\"nr\">有要串時才依該遊戲、該賭場的配置另做<\/strong>。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>初始金額<\/td><td>彩池開出後重置的起始金額（Start Up Pool）<\/td><\/tr><tr><td>Startup%<\/td><td>押注中用來補足初始金額的比例；<code class=\"nl nr\">Startup% = RTP − Increment<\/code><\/td><\/tr><tr><td>Increment<\/td><td>押注中滾入彩池、讓彩池累積上漲的比例（試算表的 Inrc）<\/td><\/tr><tr><td>RTP<\/td><td>該級距的彩金 RTP；<code class=\"nl nr\">RTP = Startup% + Increment<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Grand ＋ Major RTP ＝ Link RTP 2.00%；表中兩種配置的 Increment 合計皆為 0.85%。<\/li><li>平均開出金額：<code class=\"nl nr\">Average Jackpot Hit Value = 初始金額 ÷ Startup% × RTP<\/code>。例：Online Grand ＝ $500,000 ÷ 0.65% × 1.00% ≈ $769,231。<\/li><li>試算表只給初始金額、RTP 與 Increment，Startup% 依上式推得；試算表改版時三欄一起更新。<\/li><li>新手 <code>&gt;= $2<\/code> 的押注也會滾入 Increment，但新手不能中彩，所以新手的 Link RTP 為 0%。<\/li><\/ul>\n<h3 id=\"16-bet-mode\">1.6 Bet Mode<\/h3>\n<ul><li>老手的押注層級只分 <strong class=\"nr\"><code>&lt; $2<\/code>／<code>&gt;= $2<\/code> 兩級<\/strong>（低注／高注）；新手不分層級。<\/li><li>NB／EB 以該模式的實際押注金額判定；BF／SF 以 <strong>Feature 購買價格 ÷ Feature Price 倍數反推的基礎押注<\/strong>判定，不用購買總價。<\/li><li>倍率上限依<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>的系統最大賠付反推；Newbie 上限 BG <code class=\"nr\">30x<\/code>／FG <code class=\"nr\">120x<\/code>。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-card-system\">2. Card System<\/h2>\n<h3 id=\"21-設定結構\">2.1 設定結構<\/h3>\n<p>啟用 Card System 時，Oldhand 的押注層級只有兩套：<\/p>\n<pre><code>oldhand\n├─ normal_bet    → low_bet／high_bet → weight_bg／weight_fg\n├─ extra_bet     → low_bet／high_bet → weight_bg／weight_fg\n├─ buy_feature   → low_bet／high_bet → weight_fg\n└─ super_feature → low_bet／high_bet → weight_fg<\/code><\/pre>\n<ul><li><code class=\"nl\">low_bet<\/code> 對應 <code class=\"nr\">&lt; $2<\/code>，<code class=\"nl\">high_bet<\/code> 對應 <code class=\"nr\">&gt;= $2<\/code>；不得保留 <code class=\"nr\">medium_bet<\/code>／<code class=\"nl\">big_bet<\/code> 的空殼設定。<\/li><li>區間工作表（<code class=\"nl nr\">Multiplier_Weight<\/code>、<code class=\"nl nr\">Avg_Multi<\/code>、<code class=\"nl nr\">Nature_Prob<\/code>）的 Oldhand 欄位依低／高注命名，例如 <code class=\"nr\">NB_BG_Low<\/code>／<code class=\"nl nr\">NB_BG_High<\/code>；Newbie 欄位不變。<\/li><li>是否啟用 Card System 隨第 1.1 節數學調性決定；未啟用時不得建立空白權重欄或 Card System 設定。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-送驗規範\" hidden><div class=\"sec-head\"><h1 id=\"landbase-轉製-送驗規範\">Landbase 轉製 送驗規範<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本頁說明 <strong class=\"nr\">Landbase 轉製遊戲<\/strong>（Game ID <code class=\"nr\">102xxx<\/code>／<code class=\"nl nr\">105xxx<\/code>）的送驗包內容與各文件要注意的地方。轉製遊戲的數學與文件來自 Landbase 原機團隊。<\/p>\n<p>本頁內容與送驗根目錄 <code>送驗規範.md<\/code> 的「Landbase 轉製遊戲」章相同，修改時兩邊同步。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-通用原則\">1. 通用原則<\/h2>\n<h3 id=\"11-一款遊戲的送驗產出\">1.1 一款遊戲的送驗產出<\/h3>\n<p>送驗包只有<strong class=\"nr\">一個 zip<\/strong>，不再另建 <code class=\"nr\">{GameID}_note/<\/code>：送驗文件與 Landbase 轉來的模擬資產全部放進 <code class=\"nr\">{GameID}/<\/code>，打包成 <code class=\"nr\">{GameID}.zip<\/code>（另存 <code class=\"nr\">備份/{GameID}_YYMMDD.zip<\/code>）。<\/p>\n<pre><code>{GameID}/\n├─ {GameID}_Game Description.docx\n├─ {GameID}_Game Description_No Progressive.docx\n├─ {GameID}_Game Document Description.docx\n├─ {GameID}_SHA1.txt\n├─ PARsheet/\n├─ flowcharts/\n└─ simulation/\n   ├─ A0xx-Way Game.ipynb\n   ├─ BallTable.xlsx / StripTable.xlsx / GameFeature.xlsx / Pays.xlsx\n   ├─ DefineSymbols.py\n   └─ common/<\/code><\/pre>\n<ul><li>RTP 版本數通常 4～6 個（RTP 選項 × 有無彩金），每個版本都要有對應的 PARsheet。<\/li><li>歷史例外：102002（260427 批次）的檔名為 <code class=\"nr\">102002 Game Description.docx<\/code>（空格）且無數學說明文件，屬早期交付，不作為新案依據。<\/li><\/ul>\n<h3 id=\"12-必要檔案與命名\">1.2 必要檔案與命名<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>檔名<\/th><\/tr><\/thead><tbody><tr><td>Game Description<\/td><td><code class=\"nl nr\">{GameID}_Game Description.docx<\/code>、<code class=\"nl nr\">{GameID}_Game Description_No Progressive.docx<\/code><\/td><\/tr><tr><td>數學說明文件<\/td><td><code class=\"nl nr\">{GameID}_Game Document Description.docx<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">PARsheet/<\/code><\/td><td><code class=\"nl nr\">H0xxR_Opt01.xlsx<\/code>～<code class=\"nl nr\">_Opt06.xlsx<\/code>（RTP 選項 × 有無彩金），或 <code class=\"nr\">H011194<\/code>／<code class=\"nl nr\">H011196<\/code>／<code class=\"nl nr\">H011294<\/code>… 的「變體＋RTP」命名<\/td><\/tr><tr><td>SHA1 清單<\/td><td><code class=\"nl nr\">{GameID}_SHA1.txt<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>Landbase 遊戲用 <code class=\"nr\">A0xx<\/code>／<code class=\"nl nr\">S0xx<\/code>／<code class=\"nl\">AS0xx<\/code> 代號，轉線上後改用 <code>H0xx<\/code> ParSheet ID 與 6 碼 Game ID：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Landbase<\/th><th>ParSheet ID<\/th><th>Game ID<\/th><th>遊戲<\/th><\/tr><\/thead><tbody><tr><td>A030<\/td><td>H009R<\/td><td>105005<\/td><td>Jin Feng Fei Wu 金鳳飛舞<\/td><\/tr><tr><td>A031<\/td><td>H010R<\/td><td>105006<\/td><td>Hua Hao Yue Yuan 花好月圓<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>同一套數學可對應多個 Game ID（<code class=\"nl\">H0071<\/code> → 105001／105003）。<\/li><li>對應關係以 <code>iGaming 遊戲代號一覽.xlsx<\/code> 為準；查不到不得逕行送驗。<\/li><li>Landbase 本身若另出菲律賓版，會再立新代號（A009 → A028、A010 → A029），<strong class=\"nl nr\">不要與線上版混用<\/strong>。<\/li><li>檔名一律 <code>{GameID}_<\/code> 底線前綴，不用 Landbase 的連字號、全大寫。<\/li><\/ul>\n<h3 id=\"13-禁止出現的內容\">1.3 禁止出現的內容<\/h3>\n<p>Landbase 文件可能含下列內容，送驗包所有文件（Game Description、Game Document Description、PARsheet）一律不得出現；以不分大小寫搜尋，含表格儲存格，找到即為錯誤，必須移除後才可送驗。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檢查項目<\/th><th>關鍵字<\/th><\/tr><\/thead><tbody><tr><td>Extra Bet 敘述<\/td><td><code class=\"nl nr\">extra bet<\/code><\/td><\/tr><tr><td>Buy Feature 敘述<\/td><td><code class=\"nl nr\">buy feature<\/code><\/td><\/tr><tr><td>Super Feature 敘述<\/td><td><code class=\"nl nr\">super feature<\/code><\/td><\/tr><tr><td>&gt;$2 拉彩金門檻<\/td><td><code class=\"nl nr\">&gt;$2<\/code>、<code class=\"nl nr\">&gt; $2<\/code>、<code class=\"nl nr\">bet $2<\/code>、<code class=\"nl nr\">$2 or more<\/code>、<code class=\"nl nr\">more than $2<\/code><\/td><\/tr><tr><td>新手卡組內容<\/td><td><code class=\"nl nr\">newbie<\/code>、<code class=\"nl nr\">新手<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手卡組屬內部營運機制，不隨遊戲送驗：PARsheet 的新手工作表／欄位、文件內的新手敘述一律移除。<\/li><\/ul>\n<h3 id=\"14-sha1-清單\">1.4 SHA1 清單<\/h3>\n<ul><li><code class=\"nl\">{GameID}_SHA1.txt<\/code> 必要，涵蓋 zip 內所有檔案（清單本身除外），每次打包前重產，且一起打包進 zip。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-送驗文件\">2. 送驗文件<\/h2>\n<h3 id=\"21-數學模型parsheet\">2.1 數學模型／PARsheet<\/h3>\n<ul><li>須有 Overview 六項必要資訊（BG／FG／Bonus／Link RTP、免費遊戲週期、JP 符號出現率）；Landbase 簡易 PARsheet（只分「單機遊戲」／「彩金遊戲」）不足時要補齊。<\/li><li><strong class=\"nl nr\">RTP 口徑<\/strong>：Landbase 的 RTP 可能不含彩金；轉線上後重新拆成 <strong>Game／Link<\/strong> 兩項（不拆 Bonus），Game List 的 <code>BASE GAME RTP%<\/code> 與報告的客戶計算 RTP 一致（排除 Link）。<\/li><li><code class=\"nl\">LLF_Calculator (H5).xlsx<\/code> 這類帶 <code>(H5)<\/code> 的計算器屬線上版專用，放 <code class=\"nr\">PARsheet/<\/code>。<\/li><\/ul>\n<h3 id=\"22-模擬程式\">2.2 模擬程式<\/h3>\n<ul><li>不放 <code class=\"nr\">Simulator/<\/code>，沒有不算缺漏；Landbase 轉來的模擬資產放 <code class=\"nr\">simulation/<\/code>、流程圖放 <code class=\"nr\">flowcharts/<\/code>（第 1.1 節）。<\/li><li><code class=\"nl\">flowcharts/<\/code> 放流程圖（<code class=\"nl nr\">01_base_game.png<\/code>、<code class=\"nl nr\">02_hs_phase1.png<\/code>…）；<code class=\"nl\">A0xx-Way Game.ipynb<\/code> 是 Landbase 原始模擬 notebook；<code class=\"nl\">common/<\/code> 放 <code class=\"nr\">DataExport.py<\/code>、<code class=\"nl nr\">InputSettings.py<\/code>。<\/li><li><strong class=\"nl nr\"><code>__pycache__/<\/code> 一律清掉<\/strong>：105005、105006、106004 的送驗包都曾夾帶編譯中間檔，那是機器與 Python 版本相依的產物，不該進認證範圍。<\/li><li><code class=\"nl\">.ipynb<\/code> 若與交付的 <code>.py<\/code> 內容不同步，兩者都不可交付；先確認哪一份是正式版。<\/li><\/ul>\n<h3 id=\"23-數學說明文件game-document-description\">2.3 數學說明文件（Game Document Description）<\/h3>\n<ul><li>Landbase 團隊交付的 DOCX，說明 PARsheet 各選項；內容須與 <code>PARsheet/<\/code> 的選項逐一對應。<\/li><\/ul>\n<h3 id=\"24-game-description\">2.4 Game Description<\/h3>\n<ul><li>基本上都要兩份：含彩金版與 <code>_No Progressive<\/code> 版，兩份除彩金章節外須逐字相同。<\/li><li>自既有核准模板重做為<strong class=\"nr\">單一英文版<\/strong>，不得沿用 Landbase 的雙語檔（<code class=\"nl nr\">{ID}-GAME DESCRIPTION - CH.docx<\/code>／<code class=\"nl nr\">- ENG.docx<\/code>）。<\/li><li><strong class=\"nl nr\">彩金敘述<\/strong>：Landbase 原機的彩金機制與線上彩金不同，彩金章節須改寫為線上彩金版本，不可沿用。<\/li><li><strong class=\"nl nr\">盤面與得分方式<\/strong>：<code class=\"nl nr\">Way Game<\/code>／<code class=\"nl\">Line Game<\/code> 的描述要與線上 Game Rule 一致。<\/li><li><strong class=\"nl nr\">不放圖片<\/strong>：Game Description 內一律不放任何圖片（符號圖、盤面圖、走線圖、示意圖）；需要舉例時，符號一律用代號文字表示（<code class=\"nl nr\">M1<\/code>、<code class=\"nl nr\">M2<\/code>…），不用圖片。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-檢查清單送驗前\">3. 檢查清單（送驗前）<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> Landbase 代號 → ParSheet ID → Game ID 的對應已自代號一覽確認。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Description 已重做為單一英文版，非沿用 Landbase 雙語檔。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> PARsheet 為完整版，Overview 必要欄位齊全，非簡易 PARsheet。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 送驗文件與模擬資產已放進同一個 <code class=\"nr\">{GameID}.zip<\/code>，SHA1 清單已重產並一起打包，<code class=\"nl\">__pycache__/<\/code> 已清除。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> RTP 已重新拆成 Game／Link；彩金敘述已改為線上彩金版本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 第 1.3 節的禁止內容已全部移除。<\/li><\/ul><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', '系統機制', 'math', '送驗規範'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 表格：最小寬＝不換行寬（上限 1000px）；第一欄一行放得下（≤ 表格 1/4 寬）就不換行，否則固定 1/4 寬並換行\n(function() {\n  function cap() {\n    document.querySelectorAll('table').forEach(function(t) {\n      var r = t.rows[0];\n      if (!r || !t.offsetWidth) return;\n      // 表格寬度不隨框變窄：最小寬＝整列不換行的寬（上限 TABLE_MAX），框放不下就左右拖曳\n      t.classList.remove('fc-cap'); t.style.minWidth = ''; t.classList.add('nw-measure');\n      var nw = Math.ceil(t.getBoundingClientRect().width) + 2, colMax = 0;\n      for (var c = 0; c < r.cells.length; c++) colMax = Math.max(colMax, r.cells[c].offsetWidth);\n      t.classList.remove('nw-measure');\n      // 全是短欄（每欄 ≤ 400px）→ 一律不換行、整張左右拖曳；有長文字欄 → 最小寬上限 1000px，長文字才換行\n      t.style.minWidth = (colMax <= 400 ? nw : Math.min(nw, 1000)) + 'px';\n      if (r.cells.length < 2) return;\n      var w = 0;\n      for (var i = 0; i < t.rows.length; i++) w = Math.max(w, t.rows[i].cells[0] ? t.rows[i].cells[0].offsetWidth : 0);\n      if (w > t.offsetWidth * 0.25) t.classList.add('fc-cap');\n    });\n  }\n  cap();\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(cap);\n  window.addEventListener('load', cap);\n  window.addEventListener('resize', cap);\n  document.addEventListener('click', function() { setTimeout(cap, 0); });\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-reskin">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Reskin 開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap\">\n<style>\n:root{\n  --surface:#fcfcfb; --panel:#ffffff; --panel-2:#f6f7f8;\n  --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794;\n  --rule:#e3e6ea; --grid:#edf0f3;\n  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#d23b3b; --warn:#a87400;\n  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){\n  :root:where(:not([data-theme=\"light\"])){\n    --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n    --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n    --rule:#33353a; --grid:#2a2c30;\n    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --surface:#1a1a19; --panel:#212223; --panel-2:#1e1f20;\n  --ink:#f3f3f1; --ink-2:#b4b8be; --ink-3:#868c95;\n  --rule:#33353a; --grid:#2a2c30;\n  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#ef6060; --warn:#e3b341;\n}\n*{box-sizing:border-box}\nbody{margin:0; background:var(--surface); color:var(--ink);\n  font-family:var(--font-sans); font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}\n.wrap{max-width:1200px; margin:0 auto; padding:38px 22px 80px}\nheader.page{display:flex; flex-direction:column; gap:9px; padding-bottom:20px}\n.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}\nh1.site{margin:0; font-size:32px; font-weight:600; letter-spacing:-.02em}\n.meta{margin:0; color:var(--ink-2); font-size:13.5px}\n.lines{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0}\n.lines a{font-size:13px; text-decoration:none; color:var(--ink-2); border:1px solid var(--rule); border-radius:4px; padding:3px 13px; margin:0}\n.lines a:hover{color:var(--s1); border-color:var(--s1)}\n.lines a.on{color:var(--panel); background:var(--s1); border-color:var(--s1); font-weight:600}\n.meta code{font-family:var(--font-mono); font-size:12.5px}\n/* overflow-y 必須釘死：只設 overflow-x:auto 時 overflow-y 會算成 auto，\n   頁簽的 -1px margin 會製造 1px 垂直溢出 -> 冒出多餘滾動條 */\n.tabs{display:flex; gap:3px; border-bottom:1px solid var(--rule);\n  overflow-x:auto; overflow-y:hidden;\n  scrollbar-width:none; -ms-overflow-style:none;   /* 藏拉條，仍可橫向捲動（滾輪／觸控板／拖曳） */\n  position:sticky; top:0; background:var(--surface); z-index:20; padding-top:6px}\n.tabs::-webkit-scrollbar{display:none}\n.tab{appearance:none; font:inherit; font-size:13.5px; color:var(--ink-2); cursor:pointer;\n  background:transparent; border:1px solid transparent; border-bottom:none; margin-bottom:-1px;\n  padding:9px 17px; border-radius:3px 3px 0 0; white-space:nowrap; transition:color .12s,background .12s}\n.tab:hover{color:var(--ink); background:var(--panel-2)}\n.tab-ico{width:14px; height:14px; vertical-align:-2px; margin-right:6px}\n.tab.tab-hi, .tab.tab-hi:hover, .tab.tab-hi[aria-selected=\"true\"]{color:var(--warn)}\n.tab[aria-selected=\"true\"]{color:var(--s1); font-weight:600; background:var(--panel);\n  border-color:var(--rule); border-bottom-color:var(--panel)}\n.tab:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}\n.body-row{display:flex; gap:30px; align-items:flex-start; padding-top:26px}\n.toc{position:sticky; top:52px; width:236px; flex:none;\n  max-height:calc(100vh - 76px); overflow-y:auto;\n  font-size:12.5px; line-height:1.5; padding:6px 8px 6px 0}\n.toc[hidden]{display:none}\n/* 目錄過長時仍可滾動，但不顯示拉條 */\n.toc{scrollbar-width:none; -ms-overflow-style:none}\n.toc::-webkit-scrollbar{display:none}\n.toc a{display:block; color:var(--ink-3); text-decoration:none;\n  padding:3px 11px; border-left:2px solid var(--rule)}\n.toc a:hover{color:var(--s1); border-left-color:var(--s1)}\n.toc a.toc-3{padding-left:25px}\n.toc a.toc-doc{color:var(--ink); font-weight:600; border-left-color:transparent; padding:7px 11px 3px}\n.toc a.toc-doc:not(:first-child){margin-top:8px}\n.toc a.toc-doc.on{color:var(--s1)}\nmain{flex:1; min-width:0}\n.panel[hidden]{display:none}\n.panel h1{margin:0 0 14px; font-size:24px; font-weight:600; letter-spacing:-.015em}\nh2{margin:34px 0 12px; font-size:19px; font-weight:600; letter-spacing:-.01em;\n  padding-bottom:7px; border-bottom:1px solid var(--rule)}\nh3{margin:28px 0 10px; font-size:16.5px; font-weight:600; letter-spacing:-.008em}\nh4{margin:24px 0 8px; font-size:14.5px; font-weight:600; color:var(--ink-2)}\np{margin:0 0 11px; max-width:86ch}\nul,ol{margin:0 0 13px; padding-left:22px; max-width:86ch}\nli{margin:3px 0}\nli.check{list-style:none; margin-left:-20px}\n.cb{color:var(--s1); margin-right:4px}\ncode{font-family:var(--font-mono); font-size:.88em; background:var(--panel-2);\n  border:1px solid var(--rule); border-radius:3px; padding:1px 4px}\npre{background:var(--panel-2); border:1px solid var(--rule); border-radius:3px;\n  padding:13px 16px; overflow-x:auto; margin:0 0 16px;\n  font-family:var(--font-mono); font-size:12.5px; line-height:1.6}\npre code{background:none; border:none; padding:0; font-size:inherit}\nstrong{font-weight:600; color:var(--ink)}\na{color:var(--s1)}\n.tbl-wrap{overflow-x:auto; overflow-y:hidden; border:1px solid var(--rule); border-radius:3px;\n  background:var(--panel); margin:0 0 18px}\ntable{border-collapse:collapse; width:100%; font-size:1em}\n/* 第一欄（標題欄）一行顯示；超過表格 1/4 寬才換行（由 JS 加 fc-cap） */\nth:first-child,td:first-child{white-space:nowrap}\ntable.fc-cap th:first-child,table.fc-cap td:first-child{white-space:normal; width:25%}\ntable.nw-measure{width:max-content !important}\ntable.nw-measure th,table.nw-measure td{white-space:nowrap !important}\nth,td{padding:7px 12px; text-align:left; border-bottom:1px solid var(--grid); vertical-align:top}\nth{background:var(--panel-2); color:var(--ink-2); font-weight:500; font-size:1em;\n  letter-spacing:.03em; white-space:nowrap}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n:is(strong,.tune,code,a,mark).nl{margin-left:0}\n:is(strong,.tune,code,a,mark).nr{margin-right:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:760px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:78px; border-bottom:1px dashed var(--grid)}\n.tl-track.short{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-lane{padding-top:44px}\n.tl-row:has(.tl-track.short) .tl-lane{padding-top:5px}\n.tl-lane.tl-axis-name{padding-top:2px}\n.tl-band{position:absolute; top:46px; height:18px; border-radius:3px; background:color-mix(in srgb,var(--c) 16%,transparent)}\n.tl-bar.event{background:var(--c); height:14px; top:48px; border-radius:2px}\n.tl-label{position:absolute; top:2px; font-size:.95em; font-weight:600; line-height:1.25; color:var(--c); white-space:nowrap}\n.tl-range{display:block; font-family:var(--font-mono); font-size:.85em; font-weight:500; color:var(--ink-2)}\n.tl-guide{position:absolute; top:64px; border-left:1px dashed var(--c); opacity:.7; pointer-events:none}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0 \"#2-新手體驗\" data-tab=\"系統機制\">2. 新手體驗<\/a><a class=\"toc-3\" href=\"#21-機制目標\" data-tab=\"系統機制\">2.1 機制目標<\/a><a class=\"toc-3\" href=\"#22-機制介紹數值設定\" data-tab=\"系統機制\">2.2 機制介紹／數值設定<\/a><a class=\"toc-2\" href=\"#3-老手救援\" data-tab=\"系統機制\">3. 老手救援<\/a><a class=\"toc-3\" href=\"#31-機制目標\" data-tab=\"系統機制\">3.1 機制目標<\/a><a class=\"toc-3\" href=\"#32-機制介紹數值設定\" data-tab=\"系統機制\">3.2 機制介紹／數值設定<\/a><a class=\"toc-2\" href=\"#4-待確認事項\" data-tab=\"系統機制\">4. 待確認事項<\/a><\/nav><nav class=\"toc\" id=\"toc-math\" hidden><a class=\"toc-2\" href=\"#1-數學模型\" data-tab=\"math\">1. 數學模型<\/a><a class=\"toc-3\" href=\"#11-必要內容\" data-tab=\"math\">1.1 必要內容<\/a><a class=\"toc-3\" href=\"#12-模型命名\" data-tab=\"math\">1.2 模型命名<\/a><a class=\"toc-3\" href=\"#13-押注選項\" data-tab=\"math\">1.3 押注選項<\/a><a class=\"toc-3\" href=\"#14-rtp-配置\" data-tab=\"math\">1.4 RTP 配置<\/a><a class=\"toc-3\" href=\"#15-彩金配置\" data-tab=\"math\">1.5 彩金配置<\/a><a class=\"toc-3\" href=\"#16-bet-mode\" data-tab=\"math\">1.6 Bet Mode<\/a><a class=\"toc-2\" href=\"#2-待確認事項\" data-tab=\"math\">2. 待確認事項<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-guide\"><div class=\"sec-head\"><h1 id=\"reskin-導覽\">Reskin 導覽<\/h1><p class=\"updated\">最後更新：2026-11-11<\/p>\n<p>本規範適用於 <strong class=\"nr\">Reskin 遊戲<\/strong>：以既有遊戲（iGaming 遊戲或 Landbase 轉製遊戲）換皮，輸出到 GC／SC 雙幣市場。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>頁籤<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"knowhow\">Knowhow<\/a><\/td><td>市場、平台 RTP 要求、幣別<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"系統機制\">系統相關<\/a><\/td><td>系統機制（新手體驗、老手救援）；天花板說明、腳本規範、壓測說明書、後端報表待定<\/td><\/tr><tr><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"math\">數學設計<\/a><\/td><td>押注結構、GC／SC 押注選項、RTP 配置（92／94／96）、Link 彩金<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-knowhow\" hidden><div class=\"sec-head\"><h1 id=\"reskin-knowhow\">Reskin Knowhow<\/h1><p class=\"updated\">最後更新：2026-11-12<\/p>\n<p>本頁記錄 Reskin 產線的市場與平台背景，作為數學設計的前提。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-市場與平台要求\">1. 市場與平台要求<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>市場<\/td><td>歐美<\/td><\/tr><tr><td>平台 RTP 要求<\/td><td>須提供總 RTP（Total (+機制)）<code class=\"nl nr\">92%<\/code>、<code class=\"nl nr\">94%<\/code>、<code class=\"nl\">96%<\/code> 三個版本；彩金都一樣插在遊戲裡，只差 Game RTP<\/td><\/tr><tr><td>幣別<\/td><td>GC、SC 兩種<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>據了解（未經平台正式確認），平台會在玩家<strong class=\"nr\">第一次玩該遊戲時<\/strong>，依玩家過去的遊玩習慣指定 92／94／96 其中一個版本給該玩家。<\/li><li>因此三個版本都會在線上實際被玩到，皆須完整製作、模擬驗證與送驗，不能只做主版本。<\/li><li>各版本的 RTP 拆分見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.4 節。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-幣別\">2. 幣別<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>幣別<\/th><th>性質<\/th><th class=\"n\">Denom<\/th><th class=\"n\">1 倍押注<\/th><th>押注範圍<\/th><\/tr><\/thead><tbody><tr><td>GC<\/td><td>遊戲幣（無現金價值，不可兌換）<\/td><td class=\"n\"><code class=\"nl nr\">20<\/code><\/td><td class=\"n\"><code class=\"nl nr\">2,000 GC<\/code><\/td><td><code class=\"nl nr\">2,000<\/code>～<code class=\"nl nr\">100,000 GC<\/code>（上線 18 檔）<\/td><\/tr><tr><td>SC<\/td><td>錢（可兌換現金）<\/td><td class=\"n\"><code class=\"nl nr\">0.002<\/code><\/td><td class=\"n\"><code class=\"nl nr\">0.2 SC<\/code><\/td><td><code class=\"nl nr\">0.2<\/code>～<code class=\"nl nr\">200 SC<\/code>（上線 40 檔）<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>兩幣別共用同一張 44 組 Bet Multiplier，只有 Denom 不同；押注清單見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範<\/a>第 1.3 節。<\/li><li>兩幣別是否共用同一套 RTP、Card System 與彩金資格尚待確認，確認前使用相同數學。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-系統機制\" hidden><div class=\"sec-head\"><h1 id=\"reskin-系統機制\">Reskin 系統機制<\/h1><p class=\"updated\">最後更新：2026-11-11<\/p>\n<p>本頁說明 <strong>Reskin 遊戲<\/strong>的系統機制：新手體驗與老手救援。各機制的 RTP 預算見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.4 節。<\/p>\n<p>標示方式：<strong class=\"nl\">粗體<\/strong>為重要數值；<span class=\"nl tune\">紅色虛線<\/span>為後端要做成可調整的參數。兩個機制都由 Card System 在指定的卡片區間重骰產生結果，演出與自然得分無法區分。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-總覽\">1. 總覽<\/h2>\n<h3 id=\"11-機制說明\">1.1 機制說明<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>現行版本<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td><strong class=\"nl nr\">D 版<\/strong><\/td><td>新手期分兩階段：新手體驗（第 41～60 轉）、新手救援（第 141～160 轉）各隨機判定一次，RTP 偏低就把該轉改成設定倍數。<\/td><\/tr><tr><td>老手救援<\/td><td><strong class=\"nl nr\">C-2<\/strong><\/td><td>以天為單位刷新的保底救援：主救援 41～405 轉、延伸救援 441 轉起，觸發點後第 1～5 轉隨機判定、RTP 以 40 轉一桶統計；救援成本由每日刷新的救援池支付（每轉提撥玩家押注的 <strong class=\"nr\"><span class=\"tune\">1%<\/span><\/strong>）；參數依 NB／EB 分開設定。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>各來源遊戲的機制預算（同數學模型規範第 1.4 節）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>來源遊戲<\/th><th class=\"n\">新手 NB／EB<\/th><th class=\"n\">老手 NB／EB<\/th><th class=\"n\">BF／SF<\/th><\/tr><\/thead><tbody><tr><td>iGaming 遊戲<\/td><td class=\"n\">新手體驗 2%<\/td><td class=\"n\">老手救援 1%<\/td><td class=\"n\">0%（無機制）<\/td><\/tr><tr><td>Landbase 轉製遊戲<\/td><td class=\"n\">新手體驗 2%<\/td><td class=\"n\">0%（無老手救援）<\/td><td class=\"n\">0%（無機制）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-流程圖\">1.2 流程圖<\/h3>\n<p>新玩家第一天第 1～1,000 轉會遇到的事件（重複事件只畫一次）：<\/p>\n<div class=\"tl-wrap\"><div class=\"tl\"><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:5.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:8.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:5.60%\">新手體驗<span class=\"tl-range\">41～60 轉<\/span><\/div><\/div><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:19.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:22.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:19.60%\">新手救援<span class=\"tl-range\">141～160 轉<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s2)\"><div class=\"tl-guide\" style=\"left:32.80%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:36.70%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:40.30%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:43.90%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:47.50%;height:15px\"><\/div><div class=\"tl-band\" style=\"left:32.80%;width:15.15%\"><\/div><div class=\"tl-bar event\" style=\"left:32.80%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:36.70%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:40.30%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:43.90%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:47.50%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:32.80%\">主救援<span class=\"tl-range\">241～405 轉<\/span><\/div><\/div><div class=\"tl-group\" style=\"--c:var(--s3)\"><div class=\"tl-guide\" style=\"left:51.10%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:54.18%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:57.09%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:60.00%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:62.91%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:65.82%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:68.73%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:71.64%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:74.55%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:77.45%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:80.36%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:83.27%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:86.18%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:89.09%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:92.00%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:95.20%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:98.40%;height:15px\"><\/div><div class=\"tl-band\" style=\"left:51.10%;width:47.70%\"><\/div><div class=\"tl-bar event\" style=\"left:51.10%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:54.18%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:57.09%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:60.00%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:62.91%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:65.82%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:68.73%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:71.64%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:74.55%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:77.45%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:80.36%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:83.27%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:86.18%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:89.09%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:92.00%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:95.20%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:98.40%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:51.10%\">延伸救援<span class=\"tl-range\">441 轉起<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">轉數<\/div><div class=\"tl-track tl-axis dense\"><div class=\"tl-tick\" style=\"left:0.14%\">1<\/div><div class=\"tl-tick\" style=\"left:5.74%\">41<\/div><div class=\"tl-tick\" style=\"left:8.40%\">60<\/div><div class=\"tl-tick\" style=\"left:19.74%\">141<\/div><div class=\"tl-tick\" style=\"left:22.40%\">160<\/div><div class=\"tl-tick\" style=\"left:28.00%\">200<\/div><div class=\"tl-tick\" style=\"left:32.92%\">241<\/div><div class=\"tl-tick\" style=\"left:36.79%\">281<\/div><div class=\"tl-tick\" style=\"left:40.39%\">321<\/div><div class=\"tl-tick\" style=\"left:43.99%\">361<\/div><div class=\"tl-tick\" style=\"left:47.59%\">401<\/div><div class=\"tl-tick\" style=\"left:51.19%\">441<\/div><div class=\"tl-tick\" style=\"left:54.25%\">481<\/div><div class=\"tl-tick\" style=\"left:57.16%\">521<\/div><div class=\"tl-tick\" style=\"left:60.07%\">561<\/div><div class=\"tl-tick\" style=\"left:62.98%\">601<\/div><div class=\"tl-tick\" style=\"left:65.89%\">641<\/div><div class=\"tl-tick\" style=\"left:68.80%\">681<\/div><div class=\"tl-tick\" style=\"left:71.71%\">721<\/div><div class=\"tl-tick\" style=\"left:74.62%\">761<\/div><div class=\"tl-tick\" style=\"left:77.53%\">801<\/div><div class=\"tl-tick\" style=\"left:80.44%\">841<\/div><div class=\"tl-tick\" style=\"left:83.35%\">881<\/div><div class=\"tl-tick\" style=\"left:86.25%\">921<\/div><div class=\"tl-tick\" style=\"left:89.16%\">961<\/div><div class=\"tl-tick\" style=\"left:92.08%\">1,001<\/div><div class=\"tl-tick\" style=\"left:95.28%\">1,041<\/div><div class=\"tl-tick\" style=\"left:98.48%\">1,081<\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane tl-axis-name\">時期<\/div><div class=\"tl-track tl-periods\"><div class=\"tl-period\" style=\"--c:var(--s4);left:0.00%;width:28.00%\">新手期<\/div><div class=\"tl-period\" style=\"--c:var(--s1);left:28.00%;width:72.00%\">老手期<\/div><\/div><\/div><\/div><\/div>\n<ul><li><strong class=\"nl nr\">新手期<\/strong>（暫定前 <span class=\"tune\">200<\/span> 轉）：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各隨機判定一次。<\/li><li><strong class=\"nl nr\">新手期結束後才開始老手救援<\/strong>：<ul><li>新玩家第一天：第一個判定區間是<strong class=\"nr\">第 241～245 轉<\/strong>。<\/li><li>第二天起（已是老手）：從當日<strong>第 41～45 轉<\/strong>開始。<\/li><li>第一天跳過第 201～205 轉，因為那次看的桶是第 161～200 轉，還在新手期；第 201～240 轉才是第一個整桶都在老手期的桶。<\/li><\/ul><\/li><li><strong class=\"nl nr\">主救援<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機判定，到第 401～405 轉為止。<\/li><li><strong class=\"nl nr\">延伸救援<\/strong>：第 <span class=\"tune\">440<\/span> 轉起，同樣每 40 轉一個區間；<strong class=\"nl nr\">超過 1,000 轉也照常判定<\/strong>，直到當日刷新。<\/li><li>每天在<span class=\"tune\">固定刷新時間<\/span>刷新：當日轉數、當日 RTP 與救援池餘額歸零（時區與時間見第 4 節待確認）。<\/li><li>Landbase 轉製遊戲沒有老手救援，只有新手期的兩次判定。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-新手體驗\">2. 新手體驗<\/h2>\n<h3 id=\"21-機制目標\">2.1 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">新手早期就有一次像樣的體驗<\/strong>：區間內隨機挑一轉，檢查第 1 轉到判定回合前的 RTP；偏低就把判定回合得分改成指定體驗分數。<\/li><li><strong class=\"nl nr\">新手體驗是推廣期<\/strong>：送出的 RTP 是額外多給的，不是每位玩家在每款遊戲都拿得到；原則上一位玩家<strong class=\"nr\">同一時期在平台上只體驗一次<\/strong>（同時避免套利），但新遊戲上線時仍要有新手體驗（資格見第 2.2.4 節）。<\/li><\/ul>\n<h3 id=\"22-機制介紹數值設定\">2.2 機制介紹／數值設定<\/h3>\n<h4 id=\"221-運作方式\">2.2.1 運作方式<\/h4>\n<ul><li>新手期只做新手體驗，不做老手救援；新手體驗 RTP 預算為 <strong class=\"nr\">2%<\/strong>（只有 NB／EB，BF／SF 沒有）。<\/li><li>兩階段：<strong class=\"nl\">新手體驗<\/strong>第 <span class=\"tune\">41～60<\/span> 轉、<strong class=\"nl\">新手救援<\/strong>第 <span class=\"tune\">141～160<\/span> 轉，各在區間內隨機挑一轉判定。<\/li><li><code class=\"nl nr\">RTP = 判定回合前累計得分 ÷ 判定回合前累計押注<\/code>（第 1 轉～判定回合前一轉）。<\/li><li>設定得分 ＝ 設定倍數 × 判定回合的 Total Bet，<strong class=\"nl\">取代<\/strong>原始得分（不是額外加上）；原始得分較高時總得分可能反而降低。<\/li><li>新手救援的 RTP 含新手體驗改寫後的結果。<\/li><\/ul>\n<h4 id=\"222-判定回合門檻倍數\">2.2.2 判定回合／門檻／倍數<\/h4>\n<p><strong class=\"nl nr\">門檻與設定倍數依遊戲調整，下表數值為範例<\/strong>；正式上線前要依該遊戲重新調整，使新手體驗增量符合 2% 預算。<\/p>\n<p><strong class=\"nl nr\">新手體驗<\/strong>：第 <span class=\"tune\">41～60<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">25%～37%<\/td><td class=\"n\">87%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>50%～&lt;70%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">10×<\/span><\/td><td class=\"n\">17%～24%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥70%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">新手救援<\/strong>：第 <span class=\"tune\">141～160<\/span> 轉隨機一轉判定<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">RTP 區間<\/th><th class=\"n\">設定倍數<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">30×<\/span><\/td><td class=\"n\">19%～21%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>65%～&lt;85%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">15×<\/span><\/td><td class=\"n\">9%～11%<\/td><td class=\"n\">96%<\/td><\/tr><tr><td class=\"n\"><span class=\"nl nr tune\"><code>≥85%<\/code><\/span><\/td><td class=\"n\">不處理<\/td><td class=\"n\">—<\/td><td class=\"n\">—<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>RTP 增量 ＝ 設定倍數 ÷ 判定轉數（判定轉隨機，所以是範圍）。<\/li><li>極限 RTP ＝ 該 RTP 區間上限 ＋ 最大 RTP 增量，即設定後 RTP 的最高可能值。<\/li><\/ul>\n<h4 id=\"223-流程圖\">2.2.3 流程圖<\/h4>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手體驗：到達判定轉<\/div><div class=\"step-desc\">第 41～60 轉內隨機一轉<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;50%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 50%～&lt;70%<\/span><span>判定回合得分改為 10×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥70%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手救援：到達判定轉<\/div><div class=\"step-desc\">第 141～160 轉內隨機一轉；RTP 已含新手體驗的結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">計算 RTP<\/div><div class=\"step-desc\">第 1 轉～判定回合前一轉的累計得分 ÷ 累計押注<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">RTP &lt;65%<\/span><span>判定回合得分改為 30×<\/span><\/div><div class=\"branch\"><span class=\"pill ok\">RTP 65%～&lt;85%<\/span><span>判定回合得分改為 15×<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">RTP ≥85%<\/span><span>不處理<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">新手期結束<\/div><div class=\"step-desc\">進入老手期，改由老手救援判定（Landbase 轉製遊戲沒有老手救援）<\/div><\/div><\/div><\/div>\n<h4 id=\"224-其他設定新手體驗資格\">2.2.4 其他設定：新手體驗資格<\/h4>\n<p>新手體驗以「<strong class=\"nl nr\">資格<\/strong>」控制，每位玩家同一時期最多用一次；只看<strong class=\"nr\">有沒有用過新手體驗<\/strong>，與該遊戲是新手期或老手期無關。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>標籤<\/th><th>定義<\/th><th>資格<\/th><\/tr><\/thead><tbody><tr><td><strong class=\"nl nr\">全新玩家<\/strong><\/td><td>還沒用過新手體驗（第一次接觸平台遊戲）<\/td><td>有資格，任何一款遊戲都可以觸發<\/td><\/tr><tr><td><strong class=\"nl nr\">舊玩家<\/strong><\/td><td>已經用過新手體驗<\/td><td>沒有資格，直到下一款新遊戲上線<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">什麼叫用過<\/strong>：任一款遊戲的<strong>新手體驗或新手救援<\/strong>判定成功、實際改成設定倍數；兩次都「不處理」不算。用掉資格後，同一款遊戲接下來的新手救援照常進行。<\/li><li><strong class=\"nl nr\">用過即變舊玩家<\/strong>：從那一轉起所有遊戲都沒有新手體驗。<\/li><li><strong class=\"nl nr\">新遊戲上線<\/strong>：上線當下已是舊玩家者重新拿到一次資格，<strong class=\"nl nr\">只能在這款新遊戲使用<\/strong>；推廣期間才變舊玩家者，這款不給。<\/li><li><strong class=\"nl nr\">資格未用又有新遊戲上線<\/strong>：只能到最新的遊戲用；用掉後等下一款新遊戲。<\/li><li>同一時間只有最新上線的一款是推廣遊戲。<\/li><\/ul>\n<p>範例（平台現有 A～E 共 5 款遊戲）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>時間點<\/th><th>事件<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>全新玩家小明玩遊戲 B，兩次判定都因 RTP 偏高、不處理<\/td><td>沒用掉資格，仍是全新玩家。<\/td><\/tr><tr><td>2<\/td><td>小明改玩遊戲 C，新手救援判定成功<\/td><td>用掉資格、變舊玩家，A～E 都沒有新手體驗。<\/td><\/tr><tr><td>3<\/td><td>新遊戲 F 上線<\/td><td>小明（上線當下已是舊玩家）在 F 重新有資格；A～E 沒有。<\/td><\/tr><tr><td>4<\/td><td>全新玩家小華在 F 推廣期間，於遊戲 A 用掉資格<\/td><td>小華推廣期間才變舊玩家，F 不給。<\/td><\/tr><tr><td>5<\/td><td>小明還沒在 F 用掉資格，新遊戲 G 就上線<\/td><td>小明的資格移到 G；F 恢復一般遊戲。小華（G 上線當下已是舊玩家）在 G 也有資格。<\/td><\/tr><tr><td>6<\/td><td>小明在 G 新手體驗判定成功<\/td><td>用掉資格，直到下一款新遊戲上線。<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"3-老手救援\">3. 老手救援<\/h2>\n<p>只適用 <strong>iGaming 來源遊戲<\/strong>的老手 NB／EB；Landbase 轉製遊戲、新手、BF／SF 都沒有老手救援。<\/p>\n<pre><code>目標：老手救援 1%（自 Game RTP 移出，Total (+機制) 不變）<\/code><\/pre>\n<ul><li>上式是<strong class=\"nr\">目標值<\/strong>；實際貢獻由門檻與救援倍數決定，要依遊戲調到約 1%。<\/li><\/ul>\n<h3 id=\"31-機制目標\">3.1 機制目標<\/h3>\n<ul><li><strong class=\"nl nr\">短期體驗不好就救<\/strong>：以當日短期體驗為基準，當天就出手，不等長期統計。<\/li><li><strong class=\"nl nr\">補上缺席的大倍數體驗<\/strong>：好體驗＝當日最大單局倍數。玩得夠久卻沒碰到大倍數的玩家，在流失前當天由系統給出，演出與自然大獎無法區分。<\/li><li><strong class=\"nl nr\">400 轉後延續同一套標準<\/strong>（延伸救援）：沿用主救援最後一段的門檻與倍數，改看往前 400 轉 RTP。<\/li><\/ul>\n<h3 id=\"32-機制介紹數值設定\">3.2 機制介紹／數值設定<\/h3>\n<h4 id=\"321-運作方式\">3.2.1 運作方式<\/h4>\n<ul><li><strong class=\"nl nr\">以天為循環<\/strong>：每天在<span class=\"tune\">固定刷新時間<\/span>刷新，當日轉數、當日 RTP 與救援池餘額全部歸零。<\/li><li><strong class=\"nl nr\">40 轉一桶<\/strong>：當日第 1～40 轉為第 1 桶、第 41～80 轉為第 2 桶…；每桶記 Σ 得分、Σ 押注，保留最近 <span class=\"tune\">10<\/span> 桶滾動（第 11 桶滿時丟掉第 1 桶）。<\/li><li><strong class=\"nl nr\">主救援（當日 <span class=\"tune\">41～405<\/span> 轉）<\/strong>：每 <span class=\"tune\">40<\/span> 轉一個觸發點 <code class=\"nr\">t<\/code>，在觸發點後第 <span class=\"tune\">1～5<\/span> 轉（例如 41～45、81～85 轉）每人每天隨機挑一轉判定，須同時符合：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶，第 <code class=\"nr\">t−39<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><li>條件 2：當日累積 RTP 低於該觸發點門檻（第 3.2.2 節；所有完成的桶，第 1～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li><strong class=\"nl nr\">延伸救援（當日 <span class=\"tune\">441<\/span> 轉起，超過 1,000 轉照常）<\/strong>：沿用主救援第 401～405 轉那一段的設定，條件 2 改看往前 400 轉：<ul><li>條件 1：前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）<\/li><li>條件 2：往前抓 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶，第 <code class=\"nr\">t−399<\/code>～<code class=\"nl\">t<\/code> 轉）<\/li><\/ul><\/li><li>條件 2 在實作上都是「最近 10 桶」：第 400 轉以前不滿 10 桶，就是當日累積。例：第 202 轉判定 → 條件 1 取第 161～200 轉、條件 2 取第 1～200 轉。<\/li><li>判定只看完成的桶：判定轉與觸發點後到判定轉前的轉數（<code class=\"nl nr\">t+1<\/code>～<code class=\"nl nr\">k−1<\/code>）都在還沒滿的桶內，不納入本次判定，下次判定才算；當日不到 41 轉不判定；延伸救援沒有停判轉。<\/li><li>命中時由 Card System 在<strong>救援倍數對應的卡片區間<\/strong>重骰（例：100× 對應 (90, 100]）；該轉<strong>強制換成<\/strong>重骰結果，不跟自然得分比較高低（自然結果作廢）；<code class=\"nl nr\">救援成本 = 救援得分<\/code>，整筆從救援池扣。<\/li><li><strong class=\"nl nr\">押注檢查（防加注套利）<\/strong>：判定轉的押注超過判定用桶（最近 10 桶，不足 10 桶全拿）的平均押注，就取消該次救援，防止玩家在判定前改押大注拿大注的救援。<\/li><li>每筆救援發放前都要通過救援池檢查（第 3.2.3 節）。<\/li><li>救援得分計入當日累積 RTP，被救過的玩家通常自然脫離觸發區；判定轉隨機，玩家無法預測、也無法從畫面判斷是否為救援。<\/li><\/ul>\n<h4 id=\"322-觸發點門檻倍數\">3.2.2 觸發點／門檻／倍數<\/h4>\n<p><strong class=\"nl nr\">門檻與救援倍數依遊戲調整，下表數值為範例<\/strong>；正式上線前要依該遊戲調到救援 RTP 約 1%（實務上以「救援倍數不變、只壓門檻」為主）。<\/p>\n<p>主救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th class=\"n\">門檻（當日累積 RTP）<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><th class=\"n\">RTP 增量<\/th><th class=\"n\">極限 RTP<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">41～45<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;25%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(20, 25]<\/span><\/td><td class=\"n\">44%～61%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">81～85<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;30%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(45, 50]<\/span><\/td><td class=\"n\">53%～62%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>第 <span class=\"tune\">121～125<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;35%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(60, 70]<\/span><\/td><td class=\"n\">48%～58%<\/td><td class=\"n\">93%<\/td><\/tr><tr><td>第 <span class=\"tune\">161～165<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;40%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(70, 80]<\/span><\/td><td class=\"n\">42%～50%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">201～205<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;45%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(80, 90]<\/span><\/td><td class=\"n\">39%～45%<\/td><td class=\"n\">90%<\/td><\/tr><tr><td>第 <span class=\"tune\">241～245<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;50%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">37%～41%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">281～285<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">32%～36%<\/td><td class=\"n\">91%<\/td><\/tr><tr><td>第 <span class=\"tune\">321～325<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;55%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">28%～31%<\/td><td class=\"n\">86%<\/td><\/tr><tr><td>第 <span class=\"tune\">361～365<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;60%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">25%～28%<\/td><td class=\"n\">88%<\/td><\/tr><tr><td>第 <span class=\"tune\">401～405<\/span> 轉<\/td><td class=\"n\"><span class=\"nl nr tune\"><code>&lt;65%<\/code><\/span><\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><td class=\"n\">22%～25%<\/td><td class=\"n\">90%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>救援倍數以 Card System 卡片倍率區間表示，實際得分落在區間內。<\/li><li><strong class=\"nl nr\">EB 的救援倍數放大<\/strong>：救援得分一律以判定轉的<strong>實際押注<\/strong>計算（救援得分 = 救援倍數 × 實際押注），NB、EB 救同樣倍數，拿到的都是押注的同樣倍數。Card System 以 NB 基準成本為倍率分母，所以 EB 的救援倍數區間要乘上 EB 押注倍數。<\/li><li>RTP 增量 ＝ 救援倍數 ÷ 判定轉數，取區間下限配最晚一轉、上限配最早一轉，所以是範圍。<\/li><li>極限 RTP ＝ 門檻 ＋ 最大 RTP 增量，即救援後當日 RTP 最高可能值，全表低於 <strong class=\"nr\">100%<\/strong>。<\/li><\/ul>\n<p>延伸救援：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>觸發區間<\/th><th>條件<\/th><th class=\"n\">救援倍數（卡片區間）<\/th><\/tr><\/thead><tbody><tr><td>第 <span class=\"tune\">441<\/span> 轉起（超過 1,000 轉照常），每 40 轉一個觸發點（觸發點後第 <span class=\"tune\">1～5<\/span> 轉隨機，即 441～445、481～485…）<\/td><td>前 <span class=\"tune\">40<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;50%<\/code><\/span>（最近 1 桶）且往前 <span class=\"tune\">400<\/span> 轉 RTP <span class=\"nr tune\"><code>&lt;65%<\/code><\/span>（最近 10 桶）<\/td><td class=\"n\"><span class=\"nl nr tune\">(90, 100]<\/span><\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"323-救援池\">3.2.3 救援池<\/h4>\n<p>救援的唯一資金來源：救援機制決定誰該救、救多少；救援池決定這一筆付不付得起。<\/p>\n<pre><code>提撥額     = 該轉 Total Bet × 1%\n救援池餘額 = 當日起始餘額（暫定 0）＋ Σ 當日提撥 − Σ 當日已發救援成本<\/code><\/pre>\n<ul><li><strong class=\"nl nr\">單一救援池<\/strong>：不設個人池；GC、SC 是否分池見第 4 節待確認。<\/li><li><strong class=\"nl nr\">提撥比例<\/strong>：每 spin 把該把 Total Bet 的 <span class=\"tune\">1%<\/span> 放進救援池（比例可調）。<\/li><li><strong class=\"nl nr\">每日刷新<\/strong>：每天在<span class=\"tune\">固定刷新時間<\/span>餘額歸零（與當日轉數、RTP 同時）。<\/li><li><strong class=\"nl nr\">發放前檢查<\/strong>：<strong class=\"nl nr\">每次判定成立都要先看救援池有沒有錢<\/strong>；不夠付這一筆就不救援（硬性上限，發出總額不會超過提撥總額）。多台機器同時觸發時，扣款要做成原子操作，避免超發。<\/li><li><strong class=\"nl nr\">監控指標<\/strong>：救援池餘額、每日提撥與發放、不救率、各區間觸發率與使用量、用到救援的玩家比例。<\/li><li>參數若沒先調到救援 RTP 約 1%，救援池會每天大量拒發，誰拿得到變成看誰先觸發；救援池是偶爾擋超發，不是主要的控制手段。<\/li><\/ul>\n<h4 id=\"324-流程圖\">3.2.4 流程圖<\/h4>\n<p>當日流程：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>轉數<\/th><th>階段<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>1～40<\/td><td>累積期<\/td><td>不判定，只累積第 1 桶。<\/td><\/tr><tr><td>41～405<\/td><td>主救援<\/td><td>10 個區間（41～45、81～85…401～405），各區間隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且所有完成的桶（當日累積）RTP 低於該區間門檻，命中救對應卡片區間。<\/td><\/tr><tr><td>406～440<\/td><td>間隔<\/td><td>不判定。<\/td><\/tr><tr><td>441 起<\/td><td>延伸救援 · (90, 100]<\/td><td>每 40 轉一個區間（超過 1,000 轉照常，直到當日刷新），區間內隨機一轉判定：最近 1 桶 RTP <code>&lt;50%<\/code> 且最近 10 桶（往前 400 轉）RTP <code class=\"nr\">&lt;65%<\/code>，命中救 (90, 100]。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>單次判定的流程：<\/p>\n<div class=\"flow\"><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">1<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">到達判定轉<\/div><div class=\"step-desc\">主救援、延伸救援都是每 40 轉一個觸發點，在觸發點後第 1～5 轉隨機挑一轉；取出該轉的門檻與救援倍數<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">2<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">檢查條件<\/div><div class=\"step-desc\">只看完成的桶：條件 1 最近 1 桶 RTP &lt;50%；條件 2 最近 10 桶 RTP（主救援＝當日累積、延伸救援＝往前 400 轉）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">兩個條件都成立<\/span><span>具備救援資格，進入押注檢查<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">任一不成立<\/span><span>本次結束，等下一個區間<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">3<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">押注檢查<\/div><div class=\"step-desc\">判定轉押注與判定用桶（最近 10 桶）的平均押注比較<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">判定轉押注 ≤ 平均押注<\/span><span>進入重骰<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">判定轉押注 &gt; 平均押注<\/span><span>取消本次救援（防加注套利）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">4<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">重骰<\/div><div class=\"step-desc\">Card System 在救援倍數的卡片區間內產生救援結果<\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">5<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">救援池檢查<\/div><div class=\"step-desc\">比較救援池餘額與這一筆的救援成本（＝救援得分）<\/div><div class=\"branches\"><div class=\"branch\"><span class=\"pill ok\">餘額 ≥ 救援成本<\/span><span>發放：該轉強制換成救援結果，救援池扣除救援成本<\/span><\/div><div class=\"branch\"><span class=\"pill stop\">餘額不足<\/span><span>不救援，該轉照自然結果（硬性上限）<\/span><\/div><\/div><\/div><\/div><div class=\"step\"><div class=\"step-rail\"><div class=\"step-dot\">6<\/div><div class=\"step-line\"><\/div><\/div><div class=\"step-body\"><div class=\"step-title\">記帳<\/div><div class=\"step-desc\">救援得分計入所在的桶，影響後續判定<\/div><\/div><\/div><\/div>\n<h4 id=\"325-參數分版\">3.2.5 參數分版<\/h4>\n<p>Reskin <strong class=\"nr\">不分押注層級<\/strong>（見數學模型規範第 1.4 節），老手救援的參數只依 <strong>NB／EB<\/strong> 分開設定，每個 Config 檔 2 套。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>分層<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>條件 1 門檻（前 40 轉 RTP）<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>條件 2 的 10 段門檻<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>救援倍數（10 段卡片區間）<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>延伸救援的條件與倍數<\/td><td>NB／EB 各自設定<\/td><td><\/td><\/tr><tr><td>提撥比例<\/td><td>NB／EB 各自設定<\/td><td>提撥進同一個救援池<\/td><\/tr><tr><td>觸發節奏（40 轉一桶、保留 10 桶、觸發點後第 1～5 轉判定）<\/td><td>共用<\/td><td>不可覆寫（統計桶跨 NB／EB 共用）<\/td><\/tr><tr><td>起判轉（41）<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><tr><td>每日刷新時間<\/td><td>共用<\/td><td>不可覆寫<\/td><\/tr><\/tbody><\/table><\/div>\n<pre><code>oldhand_rescue\n├─ daily_reset_at        共用\n├─ cadence               共用\n└─ oldhand\n   ├─ nb\n   │  ├─ pool_rate\n   │  ├─ main → tiers[10]\n   │  └─ extended\n   └─ eb              同 nb 結構<\/code><\/pre>\n<ul><li>NB、EB 兩組都必須提供，不得缺少或互相 fallback。<\/li><li>報表要加 <code class=\"nr\">mode<\/code>（NB／EB）欄位，不可合併統計。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-待確認事項\">4. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>每日刷新時間<\/td><td>Reskin 市場的刷新時區與時間待定。<\/td><\/tr><tr><td>GC／SC 救援池<\/td><td>GC、SC 兩種幣別的救援池與統計是否分開計算；建議分開，兩幣不流用。<\/td><\/tr><tr><td>新手體驗資格<\/td><td>GC、SC 是否各自一次資格。<\/td><\/tr><tr><td>門檻與倍數<\/td><td>本頁數值為範例，每款 Reskin 遊戲都要依其自然 RTP 分布重新調整，新手體驗符合 2%、老手救援約 1%。<\/td><\/tr><tr><td>押注、EB、異常加押與演出<\/td><td>新手體驗在這些情境的做法待確認。<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-math\" hidden><div class=\"sec-head\"><h1 id=\"reskin-數學模型規範\">Reskin 數學模型規範<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>本頁說明 <strong>Reskin 遊戲<\/strong>的數學模型：以既有遊戲數學為底，換皮輸出到 GC／SC 雙幣市場的版本。<\/p>\n<p>目前的需求來源文件（<code class=\"nl\">個人工作區/專案紀錄/<\/code> 下的 Reskin 需求資料夾）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>文件<\/th><th>日期<\/th><th>內容<\/th><th>狀態<\/th><\/tr><\/thead><tbody><tr><td>押注幣別工作簿（<code class=\"nl nr\">bet_currency_*.xlsx<\/code>）<\/td><td>2026-08-13<\/td><td>工作表 <code class=\"nr\">v2<\/code>（唯一未隱藏）：44 組 Bet Multiplier、SC／GC 的 Denom 與押注金額；<code class=\"nl nr\">Sheet1<\/code>、<code class=\"nl\">v1<\/code> 為隱藏的舊草稿<\/td><td><strong class=\"nl nr\">現行版<\/strong><\/td><\/tr><tr><td><code class=\"nl nr\">Bet Option規劃.pdf<\/code><\/td><td>2026-07-30<\/td><td>Bet Multiplier 44 組、Reskin SC／GC 押注金額<\/td><td>較舊；GC 只列 16 檔<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"1-數學模型\">1. 數學模型<\/h2>\n<h3 id=\"11-必要內容\">1.1 必要內容<\/h3>\n<ul><li>數學調性：待定。<\/li><\/ul>\n<h3 id=\"12-模型命名\">1.2 模型命名<\/h3>\n<p>命名為 <code class=\"nr\">H&lt;遊戲編號&gt;1&lt;RTP&gt;&lt;Variant&gt;.xlsx<\/code>，<code class=\"nl\">&lt;RTP&gt;<\/code> 填 Reskin 版本（Total (+機制)），<strong class=\"nl nr\">不是 Game RTP<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>版本<\/th><th>RTP 模型<\/th><th>Overview 模型名稱<\/th><th>Config 層級<\/th><\/tr><\/thead><tbody><tr><td>92 版<\/td><td><code class=\"nl nr\">H0xx192A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx192-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">92A<\/code><\/td><\/tr><tr><td>94 版<\/td><td><code class=\"nl nr\">H0xx194A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx194-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">94A<\/code><\/td><\/tr><tr><td>96 版<\/td><td><code class=\"nl nr\">H0xx196A.xlsx<\/code><\/td><td><code class=\"nl nr\">H0xx196-&lt;版本&gt;<\/code><\/td><td><code class=\"nl nr\">96A<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Reskin 的產線編號為 <code class=\"nr\">02<\/code>：模型與 <code>version.txt<\/code> 放專案的 <code class=\"nr\">Source/02/<\/code>，Config 為一份 <code class=\"nr\">config_02A.js<\/code>（有 B 版另一份 <code class=\"nr\">config_02B.js<\/code>），內含 <code class=\"nr\">base<\/code>（基礎數學）與 <code class=\"nr\">tiers<\/code>（<code class=\"nl nr\">92A<\/code>、<code class=\"nl nr\">94A<\/code>、<code class=\"nl\">96A<\/code> 三個版本的卡片權重）；使用時 <code>base<\/code> 疊上平台指定版本那一層。<\/li><\/ul>\n<p>每個版本的模型檔都包含第 1.4 節的四組卡片，<strong class=\"nl nr\">同一檔內分頁存放，不拆成多個檔<\/strong>：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>卡片<\/th><th>工作表<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>NB／EB 老手<\/td><td><code class=\"nl nr\">Multiplier Weight<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 老手<\/td><td><code class=\"nl nr\">Multiplier Weight<\/code><\/td><td>BF／SF 區塊<\/td><\/tr><tr><td>NB／EB 新手<\/td><td><code class=\"nl nr\">Multiplier Weight (new_player)<\/code><\/td><td>每個 NB／EB 模式一個區塊<\/td><\/tr><tr><td>BF／SF 新手<\/td><td><code class=\"nl nr\">Multiplier Weight (new_player)<\/code><\/td><td>BF／SF 區塊；原作若沒有（BF／SF 不分新手），轉 Reskin 時要補<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>卡片目標只看第 1.4 節表中的 Game（Landbase 轉製為 Game+Bonus）欄，依來源遊戲類型取用：<ul><li>iGaming（第 1.4.1 節），例 96 版：NB／EB 老手 Game 91%，其餘三組 Game 92%；Bonus 與 Progressive 不由卡片負責。<\/li><li>Landbase 轉製（第 1.4.2 節），例 96 版：NB／EB 新手與老手 94%、BF／SF 老手 94%、BF／SF 新手 96%。<\/li><\/ul><\/li><li>只有一套數學時只建 A，不建空白 B。<\/li><li>模型放 <code class=\"nr\">Source/02/<\/code>，與原作的模型分開存放，不覆蓋原作。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<h4 id=\"131-押注結構\">1.3.1 押注結構<\/h4>\n<p>押注金額由三個參數相乘，不直接列舉金額：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits（所有市場固定）<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>參數<\/th><th>定義<\/th><th>由誰決定<\/th><\/tr><\/thead><tbody><tr><td>最小押分<\/td><td>1 倍押注的 credit 數，固定 <code class=\"nr\">100<\/code><\/td><td>產線共用<\/td><\/tr><tr><td>Denom<\/td><td>每 credit 的幣值，依市場／幣別不同<\/td><td>市場設定（第 1.3 節）<\/td><\/tr><tr><td>Bet Multiplier<\/td><td>押注倍數選項，<code class=\"nl nr\">1<\/code>～<code class=\"nl\">1000<\/code> 共 44 組<\/td><td>產線共用（第 1.3.1 節）<\/td><\/tr><\/tbody><\/table><\/div>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3<\/th><th class=\"n\">4<\/th><th class=\"n\">5<\/th><th class=\"n\">6<\/th><th class=\"n\">7<\/th><th class=\"n\">8<\/th><th class=\"n\">9<\/th><th class=\"n\">10<\/th><th class=\"n\">11<\/th><th class=\"n\">12<\/th><th class=\"n\">13<\/th><th class=\"n\">14<\/th><th class=\"n\">15<\/th><th class=\"n\">16<\/th><th class=\"n\">17<\/th><th class=\"n\">18<\/th><th class=\"n\">19<\/th><th class=\"n\">20<\/th><th class=\"n\
