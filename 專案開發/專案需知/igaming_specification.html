 <code class=\"nr\">0<\/code>。<\/li><li><code class=\"nl nr\">base_game<\/code>、<code class=\"nl\">eb_base_game<\/code> 在 64 張 <code>range<\/code> 卡之後再加一張 FG 觸發卡：<code class=\"nl nr\">{\"type\":\"free_game\",\"min\":-1,\"max\":&lt;BG Trigger Cap&gt;,\"weight\":&lt;FG 觸發卡權重&gt;}<\/code>，<code class=\"nl\">max<\/code> 等於同卡組正權重 <code>range<\/code> 卡的最大 <code class=\"nr\">max<\/code>。<\/li><li>卡組權重總和與《數學模型規範》§1.8.1 <code>Multiplier_Weight<\/code> 相同：<strong class=\"nl nr\">每欄（每個卡組）總和 <code>1,000,000,000<\/code>（含 Free Game 列，即 BG 卡組的 <code>free_game<\/code> 卡）<\/strong>＝<code class=\"nr\">weight_threshold<\/code>；抽卡機率 ＝ 單卡權重 ÷ 該卡組全部正權重合計（2026-11-20 使用者）。<strong class=\"nl nr\">之後的新遊戲照此規則<\/strong>；既有遊戲（H032、H045 等 64 張區間卡合計 1e9、<code class=\"nl\">free_game<\/code> 卡另計）維持現況不改。<\/li><li>權重值與 RTP／Variant XLSX 的 <code>Multiplier_Weight<\/code> 工作表逐格相同（由 AI 轉出，不得手改）。<\/li><\/ul>\n<h4 id=\"225-彩金jackpot\">2.2.5 彩金（<code class=\"nl nr\">jackpot<\/code>）<\/h4>\n<p>有彩金的遊戲才有此區塊；數值來源與規則見第 1.2.4 節。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>說明<\/th><th>範例<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">enabled<\/code><\/td><td>是否啟用。<\/td><td><code class=\"nl nr\">true<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">source<\/code><\/td><td>來源工作簿與組別。<\/td><td><code class=\"nl nr\">\"OP Jackpot/JP0100A／B／C.xlsm 第 n 組＋Jackpot Game Script.xlsx\"<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">names<\/code><\/td><td>彩金階級，順序固定。<\/td><td><code class=\"nl nr\">[\"GRAND\",\"MAJOR\",\"MINOR\",\"MINI\"]<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">unlock_bet<\/code><\/td><td>GRAND／MAJOR 解鎖的 <code>bet_tier_amount<\/code> 門檻。<\/td><td><code class=\"nl nr\">2<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">bet_key<\/code><\/td><td>依 <code>bet_mode<\/code> 索引取用的 Bet 欄鍵（各模式的押注倍數）。<\/td><td><code class=\"nl nr\">[1,2,75,300]<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">seed<\/code><\/td><td>GRAND、MAJOR 起始彩池金額。<\/td><td><code class=\"nl nr\">[1000,200]<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">fixed_x<\/code><\/td><td>Bet 欄鍵 → <code>[MINOR, MINI]<\/code> 固定倍數（× 底注）。<\/td><td><code class=\"nl nr\">{\"1\":[50,10],\"75\":[75,15]}<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">series<\/code><\/td><td>JP 檔 <code class=\"nr\">A<\/code>／<code class=\"nl nr\">B<\/code>／<code class=\"nl\">C<\/code> → <code class=\"nr\">{\"inc\":[GRAND, MAJOR Increment], \"rtp\":{Bet 欄鍵: [GRAND, MAJOR, MINOR, MINI RTP]}}<\/code>。<\/td><td>—<\/td><\/tr><tr><td><code class=\"nl nr\">threshold<\/code><\/td><td>SCR 的 Threshold。<\/td><td><code class=\"nl nr\">10000000000<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">scr<\/code><\/td><td>各 Bet Type 的 SCR：<code class=\"nl nr\">NB_Newbie<\/code>、<code class=\"nl nr\">NB<\/code>、<code class=\"nl nr\">EB<\/code>、<code class=\"nl nr\">BF<\/code>、<code class=\"nl nr\">SF<\/code>（只列支援的）。<\/td><td>—<\/td><\/tr><tr><td><code class=\"nl nr\">pick_lots<\/code><\/td><td>選彩金小遊戲的籤箱組合（來自 <code class=\"nr\">Jackpot Game Script.xlsx<\/code>）。<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"23-資料驗證\">2.3 資料驗證<\/h3>\n<ul><li><code class=\"nl\">game_id<\/code> 與所在遊戲資料夾一致。<\/li><li><code class=\"nl\">base<\/code> 的 <code>excel_version<\/code> 與基礎 XLSX 完全一致，且只能是 1 碼。<\/li><li>初次建立時，競品模型的基礎 XLSX／Config 版本為 <code class=\"nr\">0<\/code>，非競品模型為 <code class=\"nr\">1<\/code>；來源分類必須可追溯。<\/li><li>每個層級的 <code>excel_version<\/code> 與該層級來源 RTP／Variant XLSX（<code class=\"nl nr\">source<\/code>）完全一致，且必須是 4 碼。<\/li><li>各層級版本第 1 碼，必須與 <code>base<\/code> 及基礎 XLSX 的版本相同。<\/li><li>Config 檔名、類型、內部 RTP／Variant 與來源 XLSX 相符。<\/li><li>所有 Weight 非負，啟用選項的總權重大於 0。<\/li><li>Newbie 與 Oldhand 小／中／大 Bet 的權重、Link 資格、RTP 拆分及倍率上限齊全且互相一致。<\/li><li>押注層級邊界必須精確符合 <code class=\"nr\">&lt; $2<\/code>、<code class=\"nl nr\">&gt;= $2 且 &lt;= $100<\/code>、<code class=\"nl nr\">&gt; $100<\/code>，不得因浮點誤差選錯層級。<\/li><li>NB／EB 必須以實際模式押注判斷；BF／SF 必須以購買價格除以 Feature Price 倍數後的基礎押注判斷。<\/li><li>Reel、Weight、Paytable、Symbol 與 Mode 陣列長度相容。<\/li><li>所有 ID／索引在有效範圍，無重複或遺漏。<\/li><li>Min／Max、倍率、局數與 Max Win 限制合法。<\/li><li>未支援的 Mode／Profile／Feature 不存在或明確停用。<\/li><li>浮點精度足以還原來源數值，不因格式化造成 RTP 偏差。<\/li><\/ul>\n<h3 id=\"24-版本與歷史檔\">2.4 版本與歷史檔<\/h3>\n<ul><li>正式 Config 放在遊戲資料夾根層：每個產線、每個系列一份 <code class=\"nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>（第 2.1 節）。<\/li><li>歷史 Config 放在對應的 <code>Versions/<\/code> 版本目錄，並保留各層級的來源（<code class=\"nl nr\">source<\/code>）及版本關係。<\/li><li><code class=\"nl\">Versions/version_manifest.js<\/code> 記錄完整版本、可用 Config、路徑與變更說明。<\/li><li>Runtime、Simulator 與 Demogame 不得自行覆寫 Config 版本。<\/li><li>Index 選自然機率（<code class=\"nl nr\">…-Base<\/code>）時顯示 <code>base<\/code> 的 1 碼版本；選卡片開（系列）時顯示層級的完整 4 碼版本。<\/li><li>RTP／Variant 版本若第 1、2 碼相同，Index 只顯示第 3、4 碼最新的版本。<\/li><li>Version 與 Config 選單只列出 manifest 中實際存在且相容的組合。<\/li><\/ul>\n<h3 id=\"25-最終交付檢查\">2.5 最終交付檢查<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">base<\/code> 對應基礎 XLSX；每個層級展開後與其 <code>source<\/code> 的 RTP／Variant XLSX 逐欄相符。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 基礎 XLSX／Config 使用 1 碼版本，RTP／Variant XLSX／Config 使用 4 碼版本，且第 1 碼一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> XLSX、Config、Simulator、Demogame 與文件版本一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 可由 Source 重新轉出，且不會產生非預期差異。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個 Config 都有來源 XLSX 與 mapping 說明。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Simulator 與 Demogame 沒有重複或覆寫 Config 參數。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有可選 Config／Version／Profile／Mode 均真實存在且已驗證。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 最新模擬報表已保存於 <code class=\"nr\">Record/<\/code>，結果符合目標與限制。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 代表性單局已完成 Config、Simulator、Demogame 三方對帳。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl nr\">~$*.xlsx<\/code>、<code class=\"nl nr\">__pycache__/<\/code>、臨時檔與測試輸出未列入正式交付。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Config 檔案格式符合第 2.2.1 節（<code class=\"nl nr\">window.H0xx_CONFIG_&lt;產線編號&gt;&lt;系列&gt;<\/code>、嚴格 JSON、註解不含大括號），可用 <code>json.loads<\/code> 解析。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">base<\/code> 與各層級的必要欄位齊全（第 2.2.2、2.2.3 節）；<code class=\"nl\">pays<\/code> 由短到長、單位為 × 總押注。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個卡組 64 張 <code>range<\/code> 卡依序齊全、權重合計（含 BG 卡組的 <code>free_game<\/code> 卡）<code class=\"nl nr\">1,000,000,000<\/code>；BG 卡組的 <code>free_game<\/code> 卡 <code>max<\/code> 等於正權重 <code>range<\/code> 卡最大上限（第 2.2.4 節）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 有彩金時 <code>jackpot<\/code> 區塊欄位齊全且來源與組別正確（第 2.2.5 節）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 給 SPS 的檔案已依《開發流程》§4.8「交付 SPS 打包」打成 <code class=\"nr\">對外文件/To SPS/&lt;GameID&gt;_&lt;四碼版本&gt;.zip<\/code>（<code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>、<code class=\"nl nr\">Simulator.py<\/code>、<code class=\"nl nr\">給SPS說明_&lt;版本&gt;.txt<\/code>）。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-demo\" hidden><div class=\"sec-head\"><h1 id=\"demogame規範\">Demogame規範<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 <a href=\"#\" class=\"nr tab-link\" data-tab=\"overview\">_README.md<\/a>。<\/p>\n<p><strong class=\"nl nr\">存放位置<\/strong>（路徑以遊戲專案資料夾 <code>Slots/H0xx_遊戲名稱/<\/code> 為準，總表見<a href=\"#\" class=\"nr tab-link\" data-tab=\"outputs\" data-anchor=\"3-專案目錄與存放位置\">產出與紀錄規範<\/a>）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">index.html<\/code><\/td><td>專案根目錄<\/td><\/tr><tr><td>Demo 用符號圖（WebP）<\/td><td><code class=\"nl nr\">Source/Image/<\/code><\/td><\/tr><tr><td>共用樣式與程式 <code class=\"nr\">demogame_common.css<\/code>／<code class=\"nl nr\">.js<\/code><\/td><td><code class=\"nl nr\">Slots/<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"1-用途與載入\">1. 用途與載入<\/h2>\n<p>Demogame 是模型邏輯、流程與 Debug 資訊的可操作驗證介面，不只是視覺展示。它必須能用單局結果證明 Config、Simulator 與遊戲規則一致。<\/p>\n<ul><li>主入口固定為 <code class=\"nr\">index.html<\/code>，使用相對路徑，雙擊即可離線執行。<\/li><li>Config 選單不列 Profile，Demogame 不提供 Newbie。<\/li><li>卡片系統沒有獨立的開關，由 Config 選單決定：選 <code class=\"nl\">…-Base<\/code> 為自然機率（卡片系統關），選 <code>01-A<\/code> 這類系列代號為卡片系統開（Oldhand）。<\/li><li>Config 選單只讓操作者選系列（2026-11-20）：<code class=\"nl nr\">Base<\/code>（卡片關）、<code class=\"nl nr\">A<\/code>、<code class=\"nl nr\">B<\/code>（沒有 B 版就只有 A）；小／中／大 Bet 是同一份 Config（<code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>）裡的層級（<code class=\"nl nr\">94x<\/code>／<code class=\"nl nr\">92x<\/code>／<code class=\"nl nr\">92x_Bet100<\/code>），不放進選單，依玩家押注自動切換，規則同 Simulator 選層級：NB／EB 看實際押注、BF／SF 看底注，未滿 $2 用小 Bet、底注超過 $100 用大 Bet、其餘中 Bet。遊戲載入所選系列的 Config 後，把 <code>base<\/code> 疊上各 <code>tiers[層級]<\/code> 展開成一組（例 <code class=\"nr\">window.H0xx_BOX_SET = { small, mid, big }<\/code>），換押注或換押注模式時立即換成對應層級（H026 為參考實作：<code class=\"nl nr\">H026_BOX_SET<\/code>、<code class=\"nl nr\">applyBoxTier()<\/code>）。<\/li><li>Config 選單名稱帶產線編號（2026-11-20，所有遊戲適用）：產線編號依 <code class=\"nr\">D:\\SVN\\Math_Release\\IGaming\\說明書\\ID對照表.txt<\/code>（<code class=\"nl\">01<\/code> 菲律賓主流遊戲、<code class=\"nl\">01_2<\/code> 菲律賓 landbase 轉製遊戲、<code class=\"nl\">02<\/code> 美國、<code class=\"nl\">03<\/code> 墨西哥）；<strong class=\"nl nr\">發想中的遊戲（還沒有市場）一律用 <code>99<\/code><\/strong>（例：<code class=\"nl nr\">99-A-Base<\/code>、<code class=\"nl nr\">99-A<\/code>，2026-11-20 使用者）。自然機率寫 <code class=\"nr\">{產線編號}-{A/B}-Base<\/code>，卡片開寫 <code class=\"nr\">{產線編號}-{A/B}<\/code>；產線編號放前面（2026-11-20 使用者改為 <code>01-A<\/code> 格式）；依產線編號排序，同一產線內 Base 在前，例：<code class=\"nl nr\">01-A-Base<\/code>、<code class=\"nl nr\">01-B-Base<\/code>、<code class=\"nl nr\">01-A<\/code>、<code class=\"nl nr\">01-B<\/code>、<code class=\"nl nr\">02-A-Base<\/code>、<code class=\"nl nr\">02-A<\/code>…。Demo 用的 config（例 <code class=\"nr\">120A_Demo<\/code>）寫 <code class=\"nr\">{產線編號}-{A/B}-Demo<\/code>（例 <code class=\"nr\">01-A-Demo<\/code>），排在最後（2026-11-20 使用者）。<strong class=\"nl nr\">A、B 共用同一份自然機率（只差卡片）時，B 的 Base 不列<\/strong>，只留 <code class=\"nr\">xx-A-Base<\/code>（遊戲宣告 <code class=\"nr\">window.DEMOGAME_SHARED_BASE = true<\/code>）。遊戲宣告 <code>window.DEMOGAME_PRODUCT_LINE = \"01\"<\/code> 後共用 <code>demogame_common.js<\/code> 就照這個格式顯示；同一款有多條產線時，在原生 <code>#configSelect<\/code> 的 <code>&lt;option&gt;<\/code> 加 <code class=\"nr\">data-line<\/code>。遊戲程式不可依選項文字判斷要載入哪份 config（用選項的 value）。<\/li><li>自然機率只依基礎數學 Variant 區分，與 RTP 家族無關（顯示名稱照上一條產線編號格式）。<\/li><li>標題列右側固定放「數值報告」（有報告時）、「說明」、「重置」三個文字按鈕（無底色、無外框，滑過才顯示底色），字型與標題相同，標題列高 44px；數值報告在同一分頁開啟。<\/li><li>標題列樣式各遊戲一致：代號＋名稱 15px 粗體、上下置中（由共用 CSS 統一），不得另寫遊戲專屬的標題樣式。<\/li><li>盤面不得裁掉格子的特效：中獎放大、百搭彈出與外發光在最外側一欄／一列也要完整顯示（共用 CSS 對 <code>#board.board-grid<\/code> 保留 14px 外圍可見範圍）。<\/li><li>遊戲名稱、盤面、輪帶、權重、Paytable、Bet Mode 與 Feature 參數從 Config 取得。<\/li><li>不得為演出方便另寫一套簡化數學邏輯。<\/li><li>Config 無法載入或欄位不完整時要顯示明確錯誤，不得靜默使用舊值。<\/li><\/ul>\n<h3 id=\"11-遊戲類型命名規則\">1.1 遊戲類型命名規則<\/h3>\n<p>Game Rule、Demogame 與 Help 的遊戲類型統一使用以下格式：<\/p>\n<p><code class=\"nl nr\">Video Slot - &lt;主要派彩類型&gt; / &lt;附加機制&gt;<\/code><\/p>\n<p>主要派彩類型只能依實際判獎邏輯選擇一種：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類型<\/th><th>統一英文<\/th><th>判定規則<\/th><\/tr><\/thead><tbody><tr><td>群集派彩<\/td><td><code class=\"nl nr\">Cluster Pay<\/code><\/td><td>相同符號必須在盤面上依規定方向相鄰連接，且連接數量達門檻才得獎。<\/td><\/tr><tr><td>全盤計數<\/td><td><code class=\"nl nr\">Pay Anywhere<\/code><\/td><td>相同符號在整個盤面的總數達門檻即得獎，不要求相鄰、連線或由最左輪開始。<\/td><\/tr><tr><td>路數派彩<\/td><td><code class=\"nl nr\">N Ways<\/code><\/td><td>相同符號由最左輪起，在連續相鄰輪出現即得獎；文件中的 <code>N<\/code> 必須換成實際固定 Ways 或最小～最大 Ways。<\/td><\/tr><tr><td>線數派彩<\/td><td><code class=\"nl nr\">N Lines<\/code><\/td><td>依固定 Payline 判獎；文件中的 <code>N<\/code> 必須換成實際線數。<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><code class=\"nl nr\">Cascade<\/code>、<code class=\"nl nr\">Megaways<\/code>、Multiplier 與 Feature 屬附加機制，不得代替主要派彩類型。<\/li><li>不要求相鄰的全盤計數玩法不得標示為 <code>Cluster Pay<\/code> 或 <code class=\"nr\">Cluster Pays<\/code>。<\/li><li>連消流程使用的得分倍數統一稱為 <code class=\"nr\">Cascade Multiplier<\/code>，不得再使用 <code class=\"nr\">Progressive Multiplier<\/code>、<code class=\"nl\">Progressive Cascade Multiplier<\/code> 或 <code class=\"nr\">Progressive Win Multiplier<\/code>。<\/li><li>相同術語必須同步出現在 Game Rule、Index Help 與遊戲清單，不得各自使用不同名稱。<\/li><\/ul>\n<p>目前正式遊戲類型如下：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>遊戲<\/th><th>統一遊戲類型<\/th><\/tr><\/thead><tbody><tr><td>H013 糖果狂歡 1000<\/td><td><code class=\"nl nr\">Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H015 賞金列車<\/td><td><code class=\"nl nr\">Video Slot - 3,600 Ways / Cascade / Cascade Multiplier<\/code><\/td><\/tr><tr><td>H016 幸運王牌<\/td><td><code class=\"nl nr\">Video Slot - 1,024 Ways / Cascade / Cascade Multiplier<\/code><\/td><\/tr><tr><td>H019 埃及秘寶<\/td><td><code class=\"nl nr\">Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H026 彩罐熱舞 1000<\/td><td><code class=\"nl nr\">Video Slot - 20 Lines / Cascade<\/code><\/td><\/tr><tr><td>H027 宙斯 2500<\/td><td><code class=\"nl nr\">Video Slot - Pay Anywhere / Cascade<\/code><\/td><\/tr><tr><td>H028 雷神爆金<\/td><td><code class=\"nl nr\">Video Slot - 2,025–32,400 Ways / Megaways / Cascade<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p>目前正式遊戲沒有使用 <code class=\"nr\">Cluster Pay<\/code>；日後只有實際採相鄰群集判獎的遊戲才能列入此類。<\/p>\n<h3 id=\"12-名詞定義\">1.2 名詞定義<\/h3>\n<p>本規範提到某款遊戲（例：「參考實作 H032」）時只是範例，規則本身以本文件文字為準；沒有其他遊戲可參考時，照本文件的定義與第 2.4～2.8 節的介面即可做出 Demogame。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名詞<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>BG／FG<\/td><td>Base Game（主遊戲）／Free Game（免費遊戲）。<\/td><\/tr><tr><td>NB／EB／BF／SF<\/td><td>押注模式代號：Normal Bet（一般押注）、Extra Bet（額外押注，成本為底注 × <code class=\"nr\">cost_multiplier<\/code>，例 2x）、Buy Feature（購買特色，直接進 FG，價格為底注 × 購買倍數）、Super Feature（超級特色，較高價的購買）。Log、RNG 碼、倍率線型都用這四個代號。有第二種額外押注時代號為 EB2。模式值固定 <code>0<\/code>＝NB、<code class=\"nl\">1<\/code>＝EB、<code class=\"nl\">2<\/code>＝EB2、<code class=\"nl\">3<\/code>＝BF、<code class=\"nl\">4<\/code>＝SF（2026-11-20 使用者；沒有的模式跳過不補位）；此代號僅新遊戲適用，既有遊戲維持原代號（例 H032、H045：<code class=\"nl\">2<\/code>＝BF、<code class=\"nl\">3<\/code>＝SF）（2026-11-20 使用者）。<\/td><\/tr><tr><td>底注／實際押注<\/td><td>底注＝押注選單（Bet Stepper）上的金額；實際押注＝底注 × 該模式成本倍數。倍數一律＝得分 ÷ 實際押注，但 BF／SF 的倍率線型與 FG 看板用得分 ÷ 底注。<\/td><\/tr><tr><td>自然機率<\/td><td>不經卡片系統、直接依 Config 的輪帶／權重抽出的結果（Config 選單的 <code class=\"nr\">Base<\/code>）。<\/td><\/tr><tr><td>卡片系統（Card System）<\/td><td>先依目前層級 <code>card_system<\/code> 的卡片權重抽一張卡（一個倍率區間 <code class=\"nr\">(min, max]<\/code>，或特殊類型），再以自然機率重抽整局直到倍數落在該區間；重抽上限為 <code class=\"nr\">retry_limit<\/code>，超過記一次 Retry Limit Exceeded。細節以《模擬程式規範》為準，Demo 必須與 Simulator 同邏輯。<\/td><\/tr><tr><td>Profile（Oldhand／Newbie）<\/td><td>卡片組：老手／新手。Demogame 只用 Oldhand，不提供 Newbie。<\/td><\/tr><tr><td>Config<\/td><td><code class=\"nl nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>（例 <code class=\"nr\">config_01A.js<\/code>）＝該產線該系列的全部數學：<code class=\"nl nr\">base<\/code>（輪帶、賠率、自然機率）＋<code class=\"nr\">tiers<\/code>（各 RTP／押注層級的卡片權重），全域變數 <code class=\"nr\">window.H0xx_CONFIG_&lt;產線編號&gt;&lt;系列&gt;<\/code>；以 <code>&lt;script&gt;<\/code> 載入（<code class=\"nl\">file://<\/code> 開網頁不能讀 <code class=\"nr\">.json<\/code>，所以不用 JSON 檔）。結構見《模擬程式規範》第 2.1 節。<\/td><\/tr><tr><td>系列（Variant）A／B<\/td><td>同一款遊戲的兩組卡片權重版本；Config 選單只讓操作者選系列。<\/td><\/tr><tr><td>小／中／大 Bet<\/td><td>依押注自動選的 Config 層級：小 Bet＝<code class=\"nr\">94x<\/code>、中 Bet＝<code class=\"nr\">92x<\/code>、大 Bet＝<code class=\"nr\">92x_Bet100<\/code>（判定規則見第 1 節）。<\/td><\/tr><tr><td>版本（四碼）<\/td><td><code class=\"nl nr\">遊戲參數.卡片權重.SCR.其他文件<\/code>，例 <code class=\"nr\">7.0.1.0<\/code>；版本清單在 <code class=\"nr\">Versions/version_manifest.js<\/code>（<code class=\"nl nr\">current<\/code>、<code class=\"nl nr\">versions[].version<\/code>、<code class=\"nl nr\">versions[].configs<\/code>）。<\/td><\/tr><tr><td>Cascade（連消）<\/td><td>中獎符號消除、補牌後再判獎的流程；一局內的消除次數稱 Cascade 次數。<\/td><\/tr><tr><td>輪帶類／掉落類遊戲<\/td><td>輪帶類＝Spin 時每輪是一條輪帶捲動停輪；掉落類＝Spin 時舊盤整欄掉出、新盤整欄掉入（通常是 Pay Anywhere 或消除掉落的遊戲）。新遊戲屬哪一類依 <code>game_rule.md<\/code> 的盤面表現決定，不確定時問使用者。<\/td><\/tr><tr><td>RNG 碼<\/td><td>可重現一局的字串 `&lt;Config-Profile&gt;/&lt;NB<\/td><td>EB<\/td><td>BF<\/td><td>SF&gt;/&lt;on<\/td><td>off&gt;/&lt;選項<\/td><td>-&gt;/&lt;8 碼十六進位種子&gt;`，見第 5 節。<\/td><\/tr><tr><td>腳本<\/td><td>Set RNG 區的情境下拉（例：連消 5 次以上、有觸發 FG）；選了之後每局用自然機率重抽到符合條件。<\/td><\/tr><tr><td>標準 64 區間<\/td><td>倍率分布用的 64 個 <code>(下限, 上限]<\/code> 區間；邊界定義在 <code class=\"nr\">demogame_common.js<\/code>，遊戲只要傳倍數。<\/td><\/tr><tr><td>產線編號<\/td><td><code class=\"nl\">01<\/code> 菲律賓主流、<code class=\"nl\">01_2<\/code> 菲律賓 landbase 轉製、<code class=\"nl\">02<\/code> 美國、<code class=\"nl\">03<\/code> 墨西哥、<code class=\"nl\">99<\/code> 發想中（第 1 節）。<\/td><\/tr><tr><td>peek 列／Jumbo／Extra Reel<\/td><td>遊戲專屬盤面元素：只露出一部分的格子列、占多格的大符號、主盤面外的額外輪；有才需要處理。<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"2-共用區域與-by-game-區域\">2. 共用區域與 By Game 區域<\/h2>\n<p>圖示中的遊戲顯示區域屬於 By Game 設計；除此之外的 Demogame 區域均為所有遊戲共用。<\/p>\n<h3 id=\"21-by-game-區域\">2.1 By Game 區域<\/h3>\n<p>下列區域依各遊戲盤面、Feature 與美術需求自行設計：<\/p>\n<ul><li>Game Title：遊戲 ID、遊戲名稱及遊戲專屬標題樣式。<\/li><li>Feature Status：Cascade／Combo、FG Left、Multiplier 與其他遊戲狀態（不顯示 Base Game／Free Game 模式標題；沒有要顯示的特色時整列隱藏，由共用模組處理）。<\/li><li>Reel／Board：盤面尺寸、Reel、Symbol、框體、特殊符號及遊戲專屬資訊。<\/li><li>Board Animation：Spin、中獎、消除、補牌、掉落、轉換、Multiplier 與 Feature 動畫。<\/li><li>Board Message：盤面下方的局數、FG 進度、得分、No Win 與遊戲流程訊息。<\/li><\/ul>\n<p>對應元素通常為 <code class=\"nr\">#feature-bar<\/code>、<code class=\"nl nr\">#strip-bar<\/code>、<code class=\"nl nr\">#grid-panel<\/code>／<code class=\"nl\">#board<\/code> 及盤面 Message Bar。實際 ID 可以依遊戲調整，但範圍與責任不得擴張到共用區域。<\/p>\n<p>By Game 區域必須：<\/p>\n<ul><li>從 Config 取得名稱、盤面、Symbol、倍率與 Feature 資料，不得寫死其他遊戲的內容。<\/li><li>只維護遊戲專屬 HTML、CSS、Render、動畫與狀態轉換。<\/li><li>將共用操作需要的狀態與結果透過固定介面交給共用模組，不得複製整套共用控制邏輯。<\/li><\/ul>\n<h3 id=\"22-共用區域\">2.2 共用區域<\/h3>\n<p>除第 2.1 節外，其餘區域與行為均由所有遊戲共用，包括：<\/p>\n<ul><li>Player：Credit、Bet、Win。Player／Play／Bet Mode 三區一律放在盤面下方（左欄），右欄只留統計；手機版（單欄）依序為盤面、這三區、統計（共用模組處理）。<\/li><li>Stats／Simulation。Stats（標題「基本指標」）放共用項目（總局數、RTP、中獎率、FG 觸發、BG／FG 最大倍數；原「最高倍數」與其重複，不再顯示）；遊戲自訂的特殊指標（只放觀察玩法機制用的即時統計，例如金框使用率；FG 週期等遊戲數據已在報告中，不放這裡）放在下方獨立的「特殊指標」區（共用模組自動把非共用列移入，也可在列上標 <code class=\"nr\">data-by-game<\/code>），沒有特殊指標就不顯示這區。<\/li><li>Play：Spin、Auto、Bet Stepper、Speed。<\/li><li>Bet Mode 的容器、共用互動與狀態樣式；實際支援模式及倍率由 Config 決定。按鈕字體、大小一致、字一律白色：NB／EB 為切換鈕（選取中用「自動」鈕的深綠底白字），BF／SF 為購買鈕，用 SPIN 的藍底白字（共用模組依按鈕文字判斷）。<\/li><li>Debug Mode、Set RNG、Log 與歷史紀錄（Spin Result 面板與 Force FG 已停用，由共用模組隱藏；Reel RNG 停輪面板已拿掉，改用統計區的 BG／FG 最大倍數）。<\/li><li>遊戲發想的 Demo 必須在 Set RNG 區最左邊加「腳本」下拉（<code class=\"nl nr\">#scriptSelect<\/code>，第一個選項 value 為空字串；參考實作 H032／H045）：選項為「無」＋觸發本作特色的情境（例：連消 5 次以上、各新特色發生、有觸發 FG、FG 100x 以上），選了之後每次 Normal／Extra Spin 用自然機率重抽到符合條件（不改權重；BG 情境要求不觸發 FG；抽不到用最後一把並在 Log 註記），按 Reset 才清；腳本局不計入倍率線型；RNG 選項欄記腳本 key，照碼可重現。<\/li><li>Setting：Version、Config／Profile、Language、Help、Reset。<\/li><li>Language：共用區的固定英文標籤由 <code>demogame_common.js<\/code> 依 <code>#languageSelect<\/code> 統一切換中英（整段完全相同才替換）；By Game 區域與遊戲專屬文字仍由各遊戲自行翻譯，切回 English 必須還原。<\/li><li>共用彈窗、按鈕狀態、欄位樣式、響應式版面、無障礙與錯誤顯示。各區塊上下、左右間距一律 10px（含盤面與右欄、頁尾與設定區），頁尾文字置中、用區域標題的說明色。字體統一：所有按鈕 12px 粗體；Debug 的 Previous／Next 兩顆同款（深藍底、細框、淺色字，共用 <code>demogame_common.js<\/code> 套用）；設定區文字標籤 12px 一般字重、下拉選項同按鈕；有名稱的區域標題 12px 粗體、說明色、不轉大寫，標題列滿版、下方加一條分隔線（同紀錄區）；遊戲區不顯示標題。倍率線型、紀錄、版本紀錄的標題後有「+」，點下去用彈窗顯示完整內容（倍率線型為大圖），彈窗高度貼齊內容（最高 92vh，超過在框內捲動），不留大片空白，可按 ⟳ 旋轉 90°（寬高對調後滿版）；直式手機放大倍率線型時一開就是橫的，紀錄與版本紀錄維持直式，關閉後放回原位；所有捲軸隱藏但保留上下捲動。<\/li><\/ul>\n<p>共用資源固定放在 <code class=\"nr\">Slots/<\/code>：<\/p>\n<pre><code>Slots/\n├─ demogame_common.css\n├─ demogame_common.js\n└─ H0xx_遊戲名稱/\n   └─ index.html<\/code><\/pre>\n<p>每款遊戲的 <code>index.html<\/code> 必須使用相對路徑載入：<\/p>\n<pre><code>&lt;link rel=\"stylesheet\" href=\"../demogame_common.css?v=1\"&gt;\n&lt;script src=\"../demogame_common.js?v=1\"&gt;&lt;/script&gt;<\/code><\/pre>\n<ul><li><code class=\"nl\">demogame_common.css<\/code> 維護所有共用區域的版面、色彩、間距、元件狀態與響應式規則。<\/li><li><code class=\"nl\">demogame_common.js<\/code> 維護共用初始化、操作控制、Setting、Config／Profile、Version、Language、Help、Debug 與共用狀態同步。<\/li><li>共用功能或樣式有異動時，修改 <code class=\"nr\">demogame_common.css<\/code>／<code class=\"nl nr\">demogame_common.js<\/code>，不得在每款遊戲的 <code>index.html<\/code> 複製一份再各自修改。<\/li><li>By Game 樣式與程式保留在該遊戲的 <code>index.html<\/code> 或遊戲專屬資源，不得放入共用檔案影響其他遊戲。<\/li><li>遊戲專屬 CSS 不得覆寫共用區域，除非本規範明確提供可覆寫的 CSS Variable 或 Hook。<\/li><\/ul>\n<h3 id=\"23-符號顯示規則所有遊戲\">2.3 符號顯示規則（所有遊戲）<\/h3>\n<p>盤面符號一律依下列規則顯示，樣式由 <code>demogame_common.css<\/code> 的 Symbol display standard 統一套用：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>顯示<\/th><\/tr><\/thead><tbody><tr><td>該符號有美術（或 icon）<\/td><td>只顯示符號圖；<strong class=\"nl nr\">不顯示符號代號、不畫符號框<\/strong>（無框線、無底色）<\/td><\/tr><tr><td>該符號無美術，或圖片載入失敗<\/td><td>顯示<strong class=\"nr\">符號框＋符號代號<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>符號代號（<code class=\"nl nr\">M1<\/code>、<code class=\"nl nr\">M2<\/code>、<code class=\"nl nr\">A<\/code>、<code class=\"nl nr\">C1<\/code>…）一律使用一般字重，<strong class=\"nl nr\">不得使用粗體<\/strong>。<\/li><li>符號框＋代號的樣式所有遊戲統一（共用 <code>demogame_common.js<\/code> 依格子代號自動套用，各遊戲不另設；沒有特別要求就照這套）：沒圖時一定顯示符號代號（Scatter 一律顯示 C1、Wild 一律顯示 WW），只露出一部分的格子（例如頂端 peek 列）畫成整顆符號被盤面上緣截斷（頂端不畫框線），文字上下左右置中、Consolas 19px 一般字重、文字本身不加底色；M 獎與字獎（A／K／Q／J／10）都有底版，字獎深藍底，M1～M8 用同亮度、不同色相的低彩度漸層（M1 酒紅、M2 靛紫、M3 墨綠、M4 寶藍、M5 青、M6 梅紫、M7 棕、M8 橄欖）；C1／C2／SC 橘色亮漸層；Wild 青綠漸層；金框符號保留原底色、外框一律金色，且跟著符號一直顯示（得分時也保留）。Help 賠率表的代號方格用同一套配色。H014 數字格不套用。<\/li><li>有符號美術的遊戲必須接入共用圖片介面：頁面在載入 <code>demogame_common.js<\/code> 前定義 <code class=\"nr\">window.DEMOGAME_IMAGE_TOGGLE = { supported: true, defaultEnabled: true, setEnabled(enabled) { … } }<\/code>，<code class=\"nl\">setEnabled<\/code> 內切換是否輸出符號圖並重繪目前盤面。符號圖一律開啟，Setting <strong class=\"nr\">不再有 Image 開關<\/strong>（2026-11-20 起改為「顯示符號 ID」）；只有圖片載入失敗時共用模組才呼叫 <code>setEnabled(false)<\/code> 改用文字。<\/li><li><strong class=\"nl nr\">「顯示符號 ID」開關<\/strong>（共用，Setting，2026-11-20；英文 Show Symbol ID）：勾選後在盤面每個符號的正中間疊上符號代號（M1、M2、A、WW、C1…），方便對照 Log／輪帶；狀態存 <code class=\"nr\">localStorage<\/code>（<code class=\"nl nr\">slotDemoSymbolId<\/code>），預設關閉。代號依序取 <code>window.DEMOGAME_SYMBOL_ID(cell)<\/code> → 格子內 <code>data-symbol-id<\/code> → <code>.symbol-code<\/code> 文字 → 符號圖 <code>alt<\/code> → <code class=\"nr\">.slot-symbol-label<\/code>／<code class=\"nl\">.code<\/code> 文字；顯示名稱跟代號不同的遊戲（例如 code 顯示 Wild）要在格子內補 <code class=\"nr\">data-symbol-id<\/code>。<\/li><li>有輸出符號圖的格子必須加上 <code class=\"nr\">has-symbol-art<\/code>；圖片載入失敗時移除此 class 並改顯示代號。<\/li><li><strong class=\"nl nr\">圖片預載（必做）<\/strong>：放到網頁上時，圖片若等第一次用到才下載，盤面會先出現空白格。有符號美術的遊戲必須在 <code>DEMOGAME_IMAGE_TOGGLE<\/code> 加上 <code class=\"nr\">images<\/code>：本遊戲會用到的<strong>所有<\/strong>圖片網址（陣列，或回傳陣列的函式），包含大符號長圖、金框等所有變體。共用模組會在開局前預載並解碼完成：<ul><li>預載期間擋住點擊與鍵盤；超過 120 ms 才顯示「載入圖片 n / N」遮罩，避免已有快取時畫面閃一下。<\/li><li>解碼最多等 1.5 秒；分頁在背景時略過解碼（瀏覽器在背景分頁不會完成 <code class=\"nr\">decode()<\/code>），不得因此卡住遮罩。<\/li><li>任一張載入失敗：改用文字顯示，並提示失敗張數；不得停在載入畫面。<\/li><li>預載邏輯只寫在 <code class=\"nr\">demogame_common.js<\/code>，遊戲專屬程式只提供 <code>images<\/code> 清單，不得自行另寫預載。<\/li><\/ul><\/li><li><strong class=\"nl nr\">圖片格式<\/strong>：Demo 使用的符號圖一律用 WebP（<code class=\"nl nr\">quality 90<\/code>、保留透明），檔名與原 PNG 相同、副檔名改 <code class=\"nr\">.webp<\/code>，放在 <code class=\"nr\">Source/Image/<\/code>；原始 PNG 保留作為美術原檔，Demo 不引用。<\/li><li>無美術時的代號可使用共用標籤 <code class=\"nr\">&lt;span class=\"slot-symbol-label\"&gt;代號&lt;/span&gt;<\/code>（置中、一般字重）。<\/li><li>沒有任何符號美術的遊戲，<strong class=\"nl nr\">預設用 icon（emoji）當符號圖<\/strong>，同樣接共用圖片介面（<code class=\"nl nr\">defaultEnabled: true<\/code>、<code class=\"nl nr\">images: []<\/code>）；icon 依符號主題挑（例：H027 皇冠 👑、H032 糖骷髏 💀），用 <code>.sym-icon<\/code> 疊在格子上並加 <code class=\"nr\">has-symbol-art<\/code>（2026-11-03 起）。<\/li><li>中獎、轉換等<strong>狀態<\/strong>框線（<code class=\"nl nr\">.hit<\/code>、<code class=\"nl nr\">.convert<\/code>、<code class=\"nl nr\">.wild-mark<\/code>、<code class=\"nl nr\">.fx-win<\/code>）不受此規則影響。<\/li><li>符號一體：符號的字、框、底板是一體，所有動畫（長出來、消除、補牌、掉落）都整格一起動，不能只有部分變化（例如框先出現、字才長出來）。顯示得分框時，沒得分的符號完全不變（不變暗、不換框）。<\/li><li>得分符號只把外框換成藍色框起來（金框符號得分時保留金框、外圈加藍框）（共用 <code>demogame_common.js<\/code> 套用），不放大、不閃、不跳；各遊戲不得另做中獎動畫。消除與掉落動畫不受影響。<\/li><li>Hook：框線本身屬規則狀態、且沒有對應美術時（例如純 CSS 的金框），在該格加 <code>keep-symbol-frame<\/code> 保留框線。金框若已有美術（例如 Frame 圖或金框版符號圖），不得再疊加 CSS 框。<\/li><\/ul>\n<h3 id=\"24-最小-indexhtml-骨架\">2.4 最小 index.html 骨架<\/h3>\n<p>共用模組靠固定 id 找元素，<strong class=\"nl nr\">下列 id 不可改名<\/strong>；其餘區塊可依遊戲增加。共用區的固定標籤一律寫英文（Credit、Spin、Bet Mode…），中文由共用模組依語言翻譯；By Game 文字由遊戲自己翻。範例中的 <code class=\"nr\">H0xx<\/code>、文字與數值都是佔位。<\/p>\n<pre><code>&lt;!doctype html&gt;\n&lt;html lang=\"zh-Hant\"&gt;\n&lt;head&gt;\n  &lt;meta charset=\"utf-8\"&gt;\n  &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;\n  &lt;title&gt;H0xx 遊戲名稱 Demo&lt;/title&gt;\n  &lt;style&gt;/* By Game 樣式：只寫盤面、符號、狀態膠囊等第 2.1 節範圍（FG 看板樣式由共用 CSS 提供） */&lt;/style&gt;\n  &lt;link rel=\"stylesheet\" href=\"../demogame_common.css?v=YYYYMMDDa\"&gt;\n&lt;/head&gt;\n&lt;body class=\"slot-simulator\"&gt;\n  &lt;main class=\"phone\"&gt;\n    &lt;div id=\"feature-bar\"&gt;                                   &lt;!-- 標題列；共用模組把報告／說明／重置搬到右側 --&gt;\n      &lt;span id=\"game-title\"&gt;&lt;span id=\"gameId\"&gt;線上 Game ID&lt;/span&gt; &lt;span id=\"gameName\"&gt;英文名稱&lt;/span&gt;&lt;/span&gt;\n    &lt;/div&gt;\n    &lt;div id=\"strip-bar\"&gt;                                     &lt;!-- 狀態列（共用模組隱藏，只把 #multPill／#sumPill 鏡射到盤面上方資訊條） --&gt;\n      &lt;div class=\"feature-strip\" id=\"featureDisplay\"&gt;\n        &lt;span id=\"modeText\"&gt;Base Game&lt;/span&gt;\n        &lt;span id=\"featureStatus\"&gt;&lt;/span&gt;\n        &lt;span class=\"feature-pill hidden\" id=\"multPill\"&gt;&lt;span class=\"k\"&gt;Multiplier&lt;/span&gt;&lt;span class=\"v\" id=\"multValue\"&gt;x1&lt;/span&gt;&lt;/span&gt;\n        &lt;span class=\"feature-pill hidden\" id=\"fgLeftPill\"&gt;&lt;span class=\"k\"&gt;FG Left&lt;/span&gt;&lt;span class=\"v\" id=\"fgLeftValue\"&gt;0/0&lt;/span&gt;&lt;/span&gt;\n      &lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div id=\"app-shell\"&gt;\n      &lt;section id=\"grid-panel\"&gt;\n        &lt;div class=\"board-shell\"&gt;&lt;div class=\"board-grid\" id=\"board\"&gt;&lt;!-- 每格 &lt;div class=\"cell\"&gt;…&lt;/div&gt; --&gt;&lt;/div&gt;&lt;/div&gt;\n        &lt;div class=\"message-bar\" id=\"messageBar\"&gt;Ready — press Spin&lt;/div&gt;\n      &lt;/section&gt;\n      &lt;aside id=\"right-panel\"&gt;                               &lt;!-- 共用模組把下面三區搬到盤面下方 --&gt;\n        &lt;section id=\"credit-bar\"&gt;\n          &lt;div class=\"credit-cell\"&gt;&lt;span class=\"i-label\"&gt;Credit&lt;/span&gt;&lt;span class=\"i-value hi\" id=\"balanceValue\"&gt;10,000&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"credit-cell\"&gt;&lt;span class=\"i-label\"&gt;Bet&lt;/span&gt;&lt;span class=\"i-value\" id=\"betValue\"&gt;1.00&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"credit-cell\"&gt;&lt;span class=\"i-label\"&gt;Win&lt;/span&gt;&lt;span class=\"i-value hi\" id=\"winValue\"&gt;0&lt;/span&gt;&lt;/div&gt;\n        &lt;/section&gt;\n        &lt;section id=\"play-panel\" class=\"control-zone action-zone\"&gt;\n          &lt;span class=\"zone-label\"&gt;Play&lt;/span&gt;\n          &lt;div class=\"zone-body play-main-controls\"&gt;\n            &lt;button id=\"spinBtn\" type=\"button\"&gt;Spin&lt;/button&gt;\n            &lt;button id=\"autoBtn\" type=\"button\"&gt;Auto&lt;/button&gt;\n            &lt;div class=\"bet-stepper\"&gt;\n              &lt;button id=\"betMinusBtn\" type=\"button\"&gt;&amp;minus;&lt;/button&gt;\n              &lt;button id=\"betBtn\" type=\"button\"&gt;Bet 1.00&lt;/button&gt;\n              &lt;button id=\"betPlusBtn\" type=\"button\"&gt;+&lt;/button&gt;\n              &lt;div class=\"bet-menu hidden\" id=\"betMenu\" role=\"listbox\"&gt;&lt;/div&gt;\n            &lt;/div&gt;\n            &lt;label class=\"speed-control\" for=\"speedRange\"&gt;Speed\n              &lt;input id=\"speedRange\" type=\"range\" min=\"1\" max=\"5\" step=\"1\" value=\"1\"&gt;&lt;span id=\"speedValue\"&gt;x1&lt;/span&gt;&lt;/label&gt;\n          &lt;/div&gt;\n          &lt;div id=\"play-debug-controls\" class=\"zone-body play-debug-controls debug-hidden\"&gt;\n            &lt;button id=\"previousStepBtn\" type=\"button\" disabled&gt;&amp;#9664;&amp;#9664; Previous&lt;/button&gt;\n            &lt;button id=\"nextStepBtn\" type=\"button\" disabled&gt;Next &amp;#9654;&amp;#9654;&lt;/button&gt;\n          &lt;/div&gt;\n        &lt;/section&gt;\n        &lt;section id=\"bet-mode-panel\" class=\"control-zone mode-zone\"&gt;\n          &lt;span class=\"zone-label\"&gt;Bet Mode&lt;/span&gt;\n          &lt;div class=\"zone-body\"&gt;                            &lt;!-- 只放遊戲實際有的模式 --&gt;\n            &lt;button class=\"mode-btn is-active\" id=\"normalBetBtn\" type=\"button\"&gt;Normal Bet&lt;/button&gt;\n            &lt;button class=\"mode-btn\" id=\"extraBetBtn\" type=\"button\"&gt;Extra Bet (2x)&lt;/button&gt;\n            &lt;button id=\"buyFeatureBtn\" type=\"button\"&gt;Buy Feature (50x)&lt;/button&gt;\n            &lt;button id=\"superFeatureBtn\" type=\"button\"&gt;Super Feature (200x)&lt;/button&gt;\n          &lt;/div&gt;\n        &lt;/section&gt;\n        &lt;section id=\"simulation-stats\"&gt;\n          &lt;h3&gt;Simulation Stats&lt;/h3&gt;                          &lt;!-- 共用模組改名「基本指標」 --&gt;\n          &lt;div class=\"simulation-row\"&gt;&lt;span class=\"s-label\"&gt;Total Rounds&lt;/span&gt;&lt;span class=\"s-value\" id=\"roundCountValue\"&gt;0&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"simulation-row\"&gt;&lt;span class=\"s-label\"&gt;RTP&lt;/span&gt;&lt;span class=\"s-value\" id=\"rtpValue\"&gt;0.00%&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"simulation-row\"&gt;&lt;span class=\"s-label\"&gt;Hit Rate&lt;/span&gt;&lt;span class=\"s-value\" id=\"hitRateValue\"&gt;0.00%&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"simulation-row\"&gt;&lt;span class=\"s-label\"&gt;FG Trigger&lt;/span&gt;&lt;span class=\"s-value hi\" id=\"fgTriggerValue\"&gt;0&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"simulation-row\"&gt;&lt;span class=\"s-label\"&gt;Max Multiplier&lt;/span&gt;&lt;span class=\"s-value hi\" id=\"maxMultiplierValue\"&gt;x0&lt;/span&gt;&lt;/div&gt;\n          &lt;div class=\"simulation-row\" data-by-game&gt;&lt;span class=\"s-label\"&gt;特殊指標名稱&lt;/span&gt;&lt;span class=\"s-value\" id=\"xxxValue\"&gt;0.00%&lt;/span&gt;&lt;/div&gt;\n        &lt;/section&gt;\n      &lt;/aside&gt;\n    &lt;/div&gt;\n    &lt;section id=\"controls\" class=\"debug-off\"&gt;\n      &lt;div id=\"set-rng-panel\" class=\"control-zone set-rng-zone debug-hidden\"&gt;\n        &lt;span class=\"zone-label\"&gt;Set RNG&lt;/span&gt;\n        &lt;div class=\"zone-body set-rng-controls\"&gt;\n          &lt;label class=\"debug-rng-field\" for=\"cardRangeSelect\"&gt;Card BG Range\n            &lt;select id=\"cardRangeSelect\"&gt;&lt;option value=\"\"&gt;Auto&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;   &lt;!-- 有卡片系統才放 --&gt;\n          &lt;label class=\"debug-rng-field\" for=\"scriptSelect\"&gt;腳本\n            &lt;select id=\"scriptSelect\"&gt;&lt;option value=\"\"&gt;無&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;       &lt;!-- 遊戲發想必放 --&gt;\n          &lt;label class=\"debug-rng-field\" for=\"rngInput\"&gt;RNG\n            &lt;input id=\"rngInput\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\"&gt;&lt;/label&gt;\n          &lt;button id=\"setRngResetBtn\" type=\"button\"&gt;Reset&lt;/button&gt;\n        &lt;/div&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n    &lt;section id=\"live-log-wrap\" class=\"diagnostic-region debug-only debug-hidden\"&gt;\n      &lt;div class=\"live-log-header diagnostic-header\"&gt;&lt;span&gt;Log&lt;/span&gt;&lt;button id=\"clearLogBtn\" type=\"button\"&gt;Clear&lt;/button&gt;&lt;/div&gt;\n      &lt;div id=\"liveLogBody\" role=\"log\" aria-live=\"polite\"&gt;&lt;/div&gt;\n    &lt;/section&gt;\n    &lt;section id=\"change-log-wrap\" class=\"diagnostic-region debug-only debug-hidden\"&gt;\n      &lt;div class=\"diagnostic-header\"&gt;版本紀錄&lt;/div&gt;\n      &lt;div id=\"changeLogBody\"&gt;&lt;!-- 第 7 節：&lt;article class=\"change-log-entry\"&gt;&lt;h4&gt;v1（1.0.0.0）&lt;/h4&gt;&lt;ol&gt;&lt;li&gt;…（MM/DD）&lt;/li&gt;&lt;/ol&gt;&lt;/article&gt; --&gt;&lt;/div&gt;\n    &lt;/section&gt;\n    &lt;section id=\"settings-wrap\" class=\"diagnostic-region\"&gt;\n      &lt;div class=\"setting-header diagnostic-header\"&gt;Setting&lt;/div&gt;\n      &lt;div class=\"setting-body\"&gt;\n        &lt;label class=\"setting-toggle\" for=\"debugModeInput\"&gt;&lt;input id=\"debugModeInput\" type=\"checkbox\"&gt; Debug Mode&lt;/label&gt;\n        &lt;label class=\"config-control\" for=\"versionSelect\"&gt;Version &lt;select id=\"versionSelect\"&gt;&lt;/select&gt;&lt;/label&gt;\n        &lt;label class=\"config-control\" for=\"configSelect\"&gt;Config &lt;select id=\"configSelect\"&gt;&lt;/select&gt;&lt;/label&gt;\n        &lt;label class=\"config-control\" for=\"languageSelect\"&gt;Language\n          &lt;select id=\"languageSelect\"&gt;&lt;option value=\"zh\"&gt;繁中&lt;/option&gt;&lt;option value=\"en\"&gt;English&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;\n        &lt;button id=\"helpBtn\" type=\"button\"&gt;Help&lt;/button&gt;\n        &lt;button id=\"resetBtn\" type=\"button\"&gt;Reset&lt;/button&gt;\n      &lt;/div&gt;\n    &lt;/section&gt;\n    &lt;div class=\"footer-note\"&gt;&lt;/div&gt;                          &lt;!-- 共用模組寫入最後調性更新／唯一碼 --&gt;\n  &lt;/main&gt;\n  &lt;dialog id=\"helpDialog\"&gt;\n    &lt;div class=\"help-dialog-shell\"&gt;\n      &lt;div class=\"help-dialog-header\"&gt;&lt;h2 id=\"helpDialogTitle\"&gt;Game Help&lt;/h2&gt;&lt;button id=\"closeHelpBtn\" type=\"button\"&gt;Close&lt;/button&gt;&lt;/div&gt;\n      &lt;div id=\"helpContent\" class=\"help-content\"&gt;&lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/dialog&gt;\n  &lt;script id=\"embeddedGameHelpMarkdown\" type=\"text/plain\"&gt;（game_help.md 全文，格式見 2.8）&lt;/script&gt;\n  &lt;script src=\"./Versions/version_manifest.js?v=YYYYMMDDa\"&gt;&lt;/script&gt;\n  &lt;script&gt;/* ① 選版本與系列、依序載入 config（見 2.5），同步填 #versionSelect／#configSelect */&lt;/script&gt;\n  &lt;script&gt;/* ② 遊戲主程式：Render、動畫、狀態、共用介面（見 2.6） */&lt;/script&gt;\n  &lt;script&gt;/* ③ window.DEMOGAME_* 宣告（見 2.6） */&lt;/script&gt;\n  &lt;script src=\"../demogame_common.js?v=YYYYMMDDa\"&gt;&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;<\/code><\/pre>\n<ul><li>共用模組會自行建立：Config 合併選單 <code class=\"nr\">#demogameConfigSelect<\/code>、隱藏的卡片開關 <code class=\"nr\">#cardSystemInput<\/code>、「顯示符號 ID」<code class=\"nl nr\">#symbolIdInput<\/code>、特殊指標區 <code class=\"nr\">#by-game-stats<\/code>、玩法簡介 <code class=\"nr\">#demogame-overview<\/code>、累積倍率線型 <code class=\"nr\">#demogame-cumulative-chart<\/code>、Simulation 面板 <code class=\"nr\">#batch-simulation<\/code>、盤面上方資訊條 <code class=\"nr\">#demogame-info-bar<\/code>、標題列按鈕 <code class=\"nr\">#demogameTitleActions<\/code>、導覽、圖片預載遮罩。遊戲<strong>不要<\/strong>自己做這些元素。<\/li><li>已停用、不必放的舊元素：Spin Result 面板 <code class=\"nr\">#log-wrap<\/code>、Force FG <code class=\"nr\">#forceFgInput<\/code>、Profile 選單 <code class=\"nr\">#cardProfileSelect<\/code>（放了也會被共用模組隱藏）。<\/li><li><code class=\"nl\">#messageBar<\/code> 是 By Game 區域，但樣式由共用模組統一；<code class=\"nl nr\">.debug-hidden<\/code>、<code class=\"nl\">.hidden<\/code> 由共用 CSS 定義為隱藏。<\/li><\/ul>\n<h3 id=\"25-載入順序與生命週期\">2.5 載入順序與生命週期<\/h3>\n<ol><li><code class=\"nl\">&lt;head&gt;<\/code> 先放 By Game <code class=\"nr\">&lt;style&gt;<\/code>，再載入 <code class=\"nr\">../demogame_common.css<\/code>。<\/li><li><code class=\"nl\">&lt;body&gt;<\/code> 依序：骨架 HTML → Help 原文 → 版本清單 → config 載入 → 遊戲主程式 → <code>DEMOGAME_*<\/code> 宣告 → <strong>最後一行<\/strong>才載入 <code class=\"nr\">../demogame_common.js<\/code>。共用模組載入當下就讀 DOM 與 <code class=\"nr\">window.DEMOGAME_*<\/code>、<code class=\"nl\">window.demogameSimulationModes<\/code> 等，所以這些都必須在它之前定義；<code class=\"nl nr\">demogameSimulateRound<\/code>、<code class=\"nl\">demogameAddCredit<\/code> 也要在它之前或同一個同步流程內定義。<\/li><li>config 載入（同步，用 <code>document.write('&lt;script src=…&gt;')<\/code> 或直接 <code class=\"nr\">&lt;script src&gt;<\/code>）：<ul><li>讀 <code class=\"nr\">Versions/version_manifest.js<\/code>，依網址 <code>?version=<\/code> 選版本（預設 <code class=\"nr\">current<\/code>）；目前版本讀根目錄 config，舊版本讀 <code>Versions/&lt;版本&gt;/<\/code> 的封存 config。<\/li><li>依 <code class=\"nr\">?config=<\/code>（或 localStorage 記憶）選系列 A／B；以 <code>&lt;script&gt;<\/code> 載入該系列的 <code class=\"nr\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code>，把 <code>base<\/code> 疊上各 <code>tiers[層級]<\/code> 展開成一組（例 <code class=\"nr\">window.H0xx_BOX_SET = { small, mid, big }<\/code>），先用中 Bet 那層。<code class=\"nl\">Base<\/code> 只用 <code class=\"nr\">base<\/code>（卡片關）。<\/li><li>檢查：<code class=\"nl\">base<\/code> 的 <code>excel_version<\/code> 必須等於版本第 1 碼、各層級版本第 1 碼與 <code>base<\/code> 相同、各層級有 <code class=\"nr\">card_system<\/code>，缺層級或不符就 <code class=\"nr\">throw new Error(…)<\/code>（第 1 節：不得靜默使用舊值）。<\/li><li>同一段同步填 <code class=\"nr\">#versionSelect<\/code>（每個版本一個 <code class=\"nr\">&lt;option value=\"四碼版本\"&gt;<\/code>）與 <code class=\"nr\">#configSelect<\/code>（每個系列一個 <code class=\"nr\">&lt;option value=\"A\"&gt;A&lt;/option&gt;<\/code>；有 Demo config 再加一個，value 含 <code class=\"nr\">Demo<\/code>；多產線時加 <code class=\"nr\">data-line<\/code>）；兩者的 <code>change<\/code> 都改網址參數後重新載入頁面。<\/li><\/ul><\/li><li>遊戲主程式啟動時：檢查必要 config 欄位（缺就 <code class=\"nr\">throw<\/code>）、畫初始盤面、寫第一行 Log <code class=\"nr\">Config &lt;名稱&gt; loaded | Version &lt;版本&gt; | Card System On|Off<\/code>（重置時共用模組會只保留這一行）。<\/li><li>每一局（含 FG）流程：鎖住 <code class=\"nr\">#spinBtn<\/code>（<code class=\"nl nr\">disabled = true<\/code>）→ 取 RNG 碼 → 在 <code>demogameRng.run()<\/code> 內一次算完整局結果 → 播動畫（時間全部取 <code class=\"nr\">demogameMotion<\/code>）→ 更新 Credit／Win／統計 → 呼叫 <code class=\"nr\">demogameLineChart.record()<\/code>、<code class=\"nl\">demogameHistory.record()<\/code> → <code>await demogameRoundPause()<\/code> → 解鎖 <code class=\"nr\">#spinBtn<\/code>。長按 Spin、Auto 都靠 <code>#spinBtn.disabled<\/code> 判斷「這局結束了沒」，所以忙碌期間一定要 disabled。<\/li><\/ol>\n<h3 id=\"26-遊戲端必須提供的介面\">2.6 遊戲端必須提供的介面<\/h3>\n<p><strong class=\"nl nr\">全域宣告（在載入 <code>demogame_common.js<\/code> 前設定）<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>名稱<\/th><th>型別<\/th><th>必要性<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">window.&lt;ID&gt;_CONFIG<\/code><\/td><td>object<\/td><td>必要<\/td><td>目前使用中的 config：<code class=\"nl\">config_&lt;產線編號&gt;&lt;系列&gt;.js<\/code> 的 <code>base<\/code> 疊上目前層級展開後的物件（檔案本身的變數 <code>window.&lt;ID&gt;_CONFIG_&lt;產線編號&gt;&lt;系列&gt;<\/code> 不給共用模組用）；名稱以 <code class=\"nr\">_CONFIG<\/code>（或 <code class=\"nr\">_BOX_DATA<\/code>）結尾，共用模組從這裡找 <code class=\"nr\">card_system<\/code>、<code class=\"nl nr\">excel_version<\/code>、<code class=\"nl nr\">rtp_label<\/code>、<code class=\"nl nr\">reel_num<\/code>、<code class=\"nl nr\">window_size<\/code>、<code class=\"nl nr\">paylines<\/code>。換層級或選卡片開／關時要同步換掉這個物件。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_PRODUCT_LINE<\/code><\/td><td>string<\/td><td>必要<\/td><td>產線編號，例 <code class=\"nr\">\"01\"<\/code>；發想中 <code class=\"nr\">\"99\"<\/code>。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_SHARED_BASE<\/code><\/td><td>boolean<\/td><td>A／B 共用自然機率時<\/td><td><code class=\"nl\">true<\/code> 時 Config 選單只列 A 的 Base。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_CARD_SYSTEM_SUPPORTED<\/code><\/td><td>boolean<\/td><td>選用<\/td><td><code class=\"nl\">false<\/code> 時強制沒有卡片系統（只列 Base）。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_VERSION_OVERRIDE<\/code><\/td><td>string<\/td><td>沒有 <code>#versionSelect<\/code> 選項時<\/td><td>版本選單顯示值；否則依序取 config 的 <code class=\"nr\">excel_version<\/code>／<code class=\"nl nr\">game_version<\/code>／<code class=\"nl nr\">version<\/code>。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_IMAGE_TOGGLE<\/code><\/td><td>object<\/td><td>有符號圖（含 emoji）時必要<\/td><td><code class=\"nl nr\">{ supported: true, defaultEnabled: true, images: [網址…] 或 () =&gt; [網址…], setEnabled(enabled, { initial }) }<\/code>；<code class=\"nl\">setEnabled<\/code> 切換是否輸出符號圖並重繪目前盤面（第 2.3 節）。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_SYMBOL_ART<\/code><\/td><td><code class=\"nl nr\">{ 代號: 網址 }<\/code><\/td><td>有符號美術時<\/td><td>Help 賠率表、特殊符號卡片、內文 <code>[代號]<\/code> 小圖用。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_SYMBOL_ID<\/code><\/td><td>`(cell) =&gt; string \\<\/td><td>null`<\/td><td>選用<\/td><td>「顯示符號 ID」取代號的自訂函式；不設就依第 2.3 節的順序找。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_HISTORY<\/code><\/td><td>boolean<\/td><td>必要<\/td><td><code class=\"nl\">true<\/code> 時統計區出現 BG／FG 最大倍數。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_REPORT_URL<\/code><\/td><td>string<\/td><td>有 <code>report.html<\/code> 時<\/td><td>例 <code class=\"nr\">\"./report.html\"<\/code>。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_LAST_TUNING<\/code>、<code class=\"nl nr\">DEMOGAME_TUNING_CODE<\/code><\/td><td>string<\/td><td>必要<\/td><td>第 5 節。另可設 <code class=\"nr\">DEMOGAME_LAST_CODE<\/code>（程式最後調整）、<code class=\"nl nr\">DEMOGAME_LAST_UPDATE<\/code>（任何東西最後調整），有設才多顯示一行。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_OVERVIEW<\/code><\/td><td>object<\/td><td>必要<\/td><td><code class=\"nl nr\">{ competitor, expect, changes: [...], label?: \"base\", en?: { expect, changes } }<\/code>（第 5 節玩法簡介）。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_INFO_BAR<\/code><\/td><td>boolean<\/td><td>選用<\/td><td>設 <code>false<\/code> 不用共用的盤面上方資訊條（遊戲自己有倍數條時）。<\/td><\/tr><tr><td><code class=\"nl nr\">DEMOGAME_WAY_BOARD<\/code>、<code class=\"nl nr\">DEMOGAME_WAY_SHAPE<\/code>、<code class=\"nl nr\">DEMOGAME_PAYLINES<\/code><\/td><td>見第 4 節<\/td><td>config 讀不到盤面／賠付線時<\/td><td>Help 走線圖用。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameSimulationModes<\/code><\/td><td><code class=\"nl nr\">[{ value, label }]<\/code><\/td><td>必要<\/td><td>Simulation 面板的押注模式選單，只列實際支援的模式。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameSimulationBets<\/code>、<code class=\"nl nr\">demogameSimulationBetDefault<\/code><\/td><td><code class=\"nl nr\">[{ value, label }]<\/code>、<code class=\"nl nr\">() =&gt; value<\/code><\/td><td>有小中大 Bet 時<\/td><td>Simulation 面板的押注大小選單與預設值。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameSimulateRound<\/code><\/td><td>`({ mode, bet }) =&gt; result \\<\/td><td>Promise&lt;result&gt;`<\/td><td>必要<\/td><td>第 5 節；<code class=\"nl\">result<\/code> 欄位：<code class=\"nl nr\">multiplier<\/code>、<code class=\"nl nr\">lineMultiplier<\/code>、<code class=\"nl nr\">fgTriggered<\/code>、<code class=\"nl nr\">maxMultiplier<\/code>、<code class=\"nl nr\">retryLimitExceeded<\/code>、<code class=\"nl nr\">retryCount<\/code>、<code class=\"nl nr\">bgCascade<\/code>、<code class=\"nl nr\">fgCascades<\/code>（陣列）。沒有消除的遊戲不回 <code class=\"nr\">bgCascade<\/code>／<code class=\"nl nr\">fgCascades<\/code>，面板就隱藏消除分布。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameAddCredit<\/code><\/td><td><code class=\"nl nr\">(n) =&gt; void<\/code><\/td><td>必要<\/td><td>餘額加 n（顯示金額，依內部單位換算）並重畫。<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">DOM 狀態約定（遊戲要維持，共用模組靠這些判斷）<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>遊戲要做的事<\/th><\/tr><\/thead><tbody><tr><td>盤面格子<\/td><td><code class=\"nl\">#board<\/code> 底下每格一個 <code class=\"nr\">.cell<\/code>；有符號圖的格子加 <code class=\"nr\">has-symbol-art<\/code>；得分格加 <code class=\"nr\">hit<\/code>（共用模組畫藍框）；純 CSS 金框加 <code class=\"nr\">gold<\/code>（或 <code class=\"nr\">special-gold<\/code>）與 <code class=\"nr\">keep-symbol-frame<\/code>；無圖時代號放在 <code class=\"nr\">.slot-symbol-label<\/code>（或 <code class=\"nr\">.symbol-code<\/code>）裡。<\/td><\/tr><tr><td>FG 中<\/td><td>進 FG 時 <code class=\"nr\">document.body.classList.add(\"fg-mode\")<\/code>，回 BG 時移除。<\/td><\/tr><tr><td>忙碌中<\/td><td>一局進行中 <code class=\"nr\">#spinBtn.disabled = true<\/code>，結束才解除。<\/td><\/tr><tr><td>押注模式<\/td><td>目前模式的按鈕加 <code class=\"nr\">is-active<\/code>；不支援的模式按鈕 <code>disabled<\/code> 並加 <code class=\"nr\">is-locked<\/code>。按鈕 id 固定：<code class=\"nl nr\">normalBetBtn<\/code>、<code class=\"nl nr\">extraBetBtn<\/code>（第二種 EB 用 <code class=\"nr\">extraBet2Btn<\/code>）、<code class=\"nl nr\">buyFeatureBtn<\/code>、<code class=\"nl nr\">superFeatureBtn<\/code>（或 <code class=\"nr\">buySuperFeatureBtn<\/code>）。<\/td><\/tr><tr><td>特色結束<\/td><td>FG 結算看板關閉、回到 BG 後 <code class=\"nr\">document.dispatchEvent(new Event(\"dg-feature-end\"))<\/code>。<\/td><\/tr><tr><td>結算看板<\/td><td>看板元素加 <code>data-hold-stop<\/code> 屬性（第 5 節）。<\/td><\/tr><tr><td>Debug Mode<\/td><td><code class=\"nl\">#debugModeInput<\/code> 勾選時，移除 <code class=\"nr\">.debug-only<\/code>、<code class=\"nl nr\">#set-rng-panel<\/code>、<code class=\"nl\">#play-debug-controls<\/code> 的 <code class=\"nr\">debug-hidden<\/code>，並把 <code>#controls<\/code> 的 <code>debug-off<\/code> 拿掉；取消勾選時加回。<\/td><\/tr><tr><td>倍數膠囊<\/td><td>有需要顯示在盤面上方的倍數時，放在 <code>#strip-bar<\/code> 裡的 <code class=\"nr\">#multPill<\/code>（或 <code class=\"nr\">#sumPill<\/code>）：<code class=\"nl nr\">&lt;span class=\"k\"&gt;名稱&lt;/span&gt;&lt;span class=\"v\"&gt;值&lt;/span&gt;<\/code>，不顯示時加 <code class=\"nr\">hidden<\/code>。<\/td><\/tr><tr><td>特殊指標<\/td><td>統計區的非共用列加 <code class=\"nr\">data-by-game<\/code>（共用列只有 <code class=\"nr\">roundCountValue<\/code>、<code class=\"nl nr\">rtpValue<\/code>、<code class=\"nl nr\">hitRateValue<\/code>、<code class=\"nl nr\">fgTriggerValue<\/code>、<code class=\"nl\">maxMultiplierValue<\/code> 五個）。<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">遊戲要監聽的事件<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>來源<\/th><th>遊戲要做的事<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl\">#configSelect<\/code> 的 <code class=\"nr\">change<\/code><\/td><td>共用合併選單選了系列後，會把值寫回 <code>#configSelect<\/code> 並發出 <code class=\"nr\">change<\/code>：遊戲改網址 <code>?config=<\/code> 重新載入，或直接換 config。不可依選項文字判斷。<\/td><\/tr><tr><td><code class=\"nl\">#cardSystemInput<\/code> 的 <code class=\"nr\">change<\/code>／<code class=\"nl\">document<\/code> 的 <code class=\"nr\">demogame:card-system-change<\/code>（<code class=\"nl nr\">detail.enabled<\/code>）<\/td><td>卡片系統開關改變；也可在每局開頭讀 <code class=\"nr\">window.DEMOGAME_CARD_SYSTEM_ENABLED<\/code>。<\/td><\/tr><tr><td><code class=\"nl\">#resetBtn<\/code> 的 <code class=\"nr\">click<\/code><\/td><td>遊戲清自己的統計、餘額、盤面與 FG 狀態。共用模組同時會清倍率線型、BG／FG 最大倍數、腳本、RNG 欄、Simulation 累積，並連按 <code>#betMinusBtn<\/code> 把押注退回第一檔。<\/td><\/tr><tr><td><code class=\"nl\">#languageSelect<\/code> 的 <code class=\"nr\">change<\/code>（值 <code class=\"nr\">zh<\/code>／<code class=\"nl nr\">en<\/code>）<\/td><td>重寫 By Game 文字；共用區文字由共用模組處理。<\/td><\/tr><tr><td><code class=\"nl\">#rngInput<\/code> 的 <code class=\"nr\">input<\/code>、<code class=\"nl nr\">#cardRangeSelect<\/code>／<code class=\"nl\">#scriptSelect<\/code> 的 <code class=\"nr\">change<\/code><\/td><td>同步遊戲內的指定狀態（互斥清除由共用模組處理，被清的欄位也會發事件）。<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"27-共用模組-api-一覽\">2.7 共用模組 API 一覽<\/h3>\n<p><code class=\"nl\">demogame_common.js<\/code> 載入後提供下列 API（遊戲在執行期呼叫，建議寫成 <code>window.xxx?.()<\/code> 以免單獨開檔時出錯）：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>API<\/th><th>參數／回傳<\/th><th>用途與呼叫時機<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">demogameMotion.level()<\/code><\/td><td>→ 1～5<\/td><td>目前 Speed（讀 <code class=\"nr\">#speedRange<\/code>）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameMotion.reelSpinMs()<\/code>、<code class=\"nl nr\">stopStaggerMs()<\/code>、<code class=\"nl nr\">dropMs()<\/code>、<code class=\"nl nr\">growMs()<\/code><\/td><td>→ 毫秒<\/td><td>動畫時間（第 4 節數值）；所有轉輪、掉落、長出來的時間都從這裡取。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameMotion.grow(cells)<\/code><\/td><td>格子陣列 → 毫秒<\/td><td>原地補牌的新符號套「長出來」動畫。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameMotion.dropSpin(board, columnsOf, render)<\/code><\/td><td>→ Promise<\/td><td>掉落類遊戲的 Spin 動畫：<code class=\"nl\">columnsOf()<\/code> 回傳每欄由上到下的 <code>.cell<\/code> 陣列，<code class=\"nl\">render()<\/code> 同步畫出結果盤面；函式先複製舊盤、呼叫 <code class=\"nr\">render()<\/code>，再播舊盤掉出、新盤掉入。<\/td><\/tr><tr><td><code class=\"nl nr\">slotBuildDropMotion(rows, cols, cleared)<\/code><\/td><td><code class=\"nl\">rows<\/code>＝列數或每欄列數陣列，<code class=\"nl\">cleared<\/code>＝<code>[[row, col], …]<\/code> → `{ \"row-col\": { type: \"new\", rows, groupSize } \\<\/td><td>{ type: \"settle\", rows } }`<\/td><td>掉落補牌時算出每格是新符號（從上方掉入）還是既有符號下移幾格。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameRoundPause()<\/code><\/td><td>→ Promise<\/td><td>每一轉算完分後呼叫（500 ms；長按連續 Spin 時 250 ms）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameRng.takeInput()<\/code><\/td><td>→ <code>null<\/code> 或 <code class=\"nr\">{ config, mode, card, opts, seed }<\/code>；格式錯誤會 <code class=\"nr\">throw<\/code><\/td><td>每局開頭呼叫：有填 RNG 碼就用它的 <code>seed<\/code> 與 <code class=\"nr\">opts<\/code>，沒有就 <code class=\"nr\">demogameRng.newSeed()<\/code>。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameRng.run(seed, fn)<\/code><\/td><td>→ <code>fn()<\/code> 的回傳<\/td><td>執行期間 <code>Math.random<\/code> 換成種子序列；整局結果（BG＋全部 FG）必須在 <code>fn<\/code> 內同步算完，表演用亂數放在外面。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameRng.format({ config, mode, card, opts, seed })<\/code>、<code class=\"nl nr\">parse(text)<\/code>、<code class=\"nl nr\">seeded(seed)<\/code><\/td><td>字串／物件／亂數函式<\/td><td>產生 Log 的 <code class=\"nr\">RNG &lt;碼&gt;<\/code>、解析碼、取得獨立的種子亂數。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameLog(text, type)<\/code><\/td><td><code class=\"nl\">type<\/code>＝<code class=\"nr\">info<\/code>／<code class=\"nl nr\">mode<\/code>／<code class=\"nl nr\">rng<\/code>／<code class=\"nl nr\">result<\/code>／<code class=\"nl nr\">cascade<\/code>／<code class=\"nl nr\">error<\/code><\/td><td>寫一行 Log（新的在上、最多 500 行）；行格式見第 5 節。<code class=\"nl\">RNG &lt;碼&gt;<\/code> 行會自動變成可點。<\/td><\/tr><tr><td>`demogameLineChart.record(multiplier, \"NB\" \\<\/td><td>\"EB\")<code class=\"nl nr\">、<\/code>setMode(mode \\<\/td><td>null)<code class=\"nl nr\">、<\/code>reset()`<\/td><td>—<\/td><td>每局（含 FG）結束記一次累積倍率線型；BF／SF 不記。押注模式按鈕沒有 <code>is-active<\/code> 時用 <code>setMode()<\/code> 告知目前模式。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameHistory.record({ bg, fg })<\/code>、<code class=\"nl nr\">reset()<\/code><\/td><td>倍數（÷ 底注）<\/td><td>BG 局結束記 <code class=\"nr\">bg<\/code>、FG 結束記 <code class=\"nr\">fg<\/code>。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameWinLines.draw(container, lines)<\/code>、<code class=\"nl nr\">clear(container)<\/code><\/td><td><code class=\"nl\">lines<\/code>＝<code class=\"nr\">[[cell, cell, …], …]<\/code><\/td><td>連線遊戲畫得分線（第 4 節）；盤面重畫後要重畫。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameFxTarget(id)<\/code><\/td><td>→ 元素<\/td><td>飛行動畫的目標（第 5 節）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameSharedText(english)<\/code><\/td><td>→ 依語言的字串<\/td><td>取共用字典的翻譯（遊戲要顯示共用術語時用）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameTagSymbols()<\/code><\/td><td>—<\/td><td>遊戲自己的動畫重畫盤面後立即套用無圖符號配色。<\/td><\/tr><tr><td><code class=\"nl nr\">DemogameImagePreload.preload(urls)<\/code><\/td><td>→ <code class=\"nr\">Promise&lt;{ failed }&gt;<\/code><\/td><td>額外圖片要預載時用（一般只要填 <code class=\"nr\">DEMOGAME_IMAGE_TOGGLE.images<\/code>）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameGuide()<\/code><\/td><td>—<\/td><td>手動開始新手導覽。<\/td><\/tr><tr><td><code class=\"nl nr\">slotBindCommonControls(actions)<\/code><\/td><td><code class=\"nl nr\">{ spin, toggleAuto, normalMode, extraMode, buyFeatureMode, betMinus, betPlus, toggleBetMenu, speedChange, previousStep, nextStep, debugChange, resetRng, clearLog, reset, configChange, languageChange, openHelp, closeHelp, rngChanged, documentClick }<\/code><\/td><td>選用：一次把骨架上的固定按鈕綁到遊戲函式。<\/td><\/tr><tr><td><code class=\"nl nr\">slotFx<\/code><\/td><td><code class=\"nl nr\">ensureLayer<\/code>、<code class=\"nl nr\">popCells<\/code>、<code class=\"nl nr\">spawnCoins<\/code>、<code class=\"nl nr\">multiPop<\/code>、<code class=\"nl nr\">winFloat<\/code>、<code class=\"nl nr\">totalWin<\/code>…<\/td><td>選用特效圖層；不得用來做中獎強調（第 2.3 節）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameFgBanner.trigger({ spins, icon, auto })<\/code>、<code class=\"nl nr\">end({ win, bet, format, auto })<\/code><\/td><td>→ Promise（看板關閉時 resolve）<\/td><td>FG 觸發／結算看板（第 5 節 FG 看板）。<code class=\"nl\">trigger<\/code> 顯示「免費遊戲／N 場」（<code class=\"nl\">icon<\/code> 預設 <code class=\"nr\">C1<\/code>，取 <code class=\"nr\">DEMOGAME_SYMBOL_ART<\/code>）；<code class=\"nl\">end<\/code> 顯示「免費遊戲結束／總贏分／金額／倍數（<code class=\"nl nr\">win ÷ bet<\/code>，2 位小數）」並自帶 <code class=\"nr\">data-hold-stop<\/code>。<code class=\"nl\">auto<\/code> 傳目前是否 Auto（布林或函式）。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameFgBanner.show({ icon, title, sub, count, note, html, holdStop, auto, autoMs })<\/code>、<code class=\"nl nr\">close()<\/code>、<code class=\"nl nr\">isOpen()<\/code><\/td><td>→ Promise<\/td><td>自訂內容的看板（卡片依序 icon／title／sub／count／note；<code class=\"nl\">html<\/code> 整段取代）；<code class=\"nl\">icon<\/code> 可給代號、圖片網址或 HTML。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameHelp.render(md, { lang, bet, baseBet, format, config, configOptions })<\/code><\/td><td>→ <code class=\"nr\">#helpContent<\/code><\/td><td>解析第 2.8 節格式的 md 輸出到 <code class=\"nr\">#helpContent<\/code>：<code class=\"nl\">lang<\/code>＝<code class=\"nr\">zh<\/code>／<code class=\"nl nr\">en<\/code>（預設讀 <code class=\"nr\">#languageSelect<\/code>）、<code class=\"nl\">bet<\/code>＝目前底注（數字或函式，預設讀 <code class=\"nr\">#betValue<\/code>）、<code class=\"nl\">baseBet<\/code>＝md 賠率數字的基準（預設 <code class=\"nr\">config.base_bet<\/code>，再無則 100）、<code class=\"nl\">format<\/code>＝金額格式函式。md 沒有賠率表且有給 <code>config<\/code> 時，自動用 <code>configPaytable<\/code> 補上；完全沒內容時輸出 <code class=\"nr\">.help-load-error<\/code>。Help 開著時押注或語言改變會自動重畫。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameHelp.load({ url, embeddedId })<\/code>、<code class=\"nl nr\">open(opts)<\/code>、<code class=\"nl nr\">parse(md)<\/code><\/td><td><code class=\"nl\">load<\/code> → <code class=\"nr\">Promise&lt;md&gt;<\/code>；<code class=\"nl\">open<\/code> → 載入＋<code>render<\/code>＋開 <code class=\"nr\">#helpDialog<\/code><\/td><td><code class=\"nl\">load<\/code> 先 fetch <code class=\"nr\">./game_help.md<\/code>（<code class=\"nl\">file://<\/code> 略過），讀不到用內嵌 <code class=\"nr\">#embeddedGameHelpMarkdown<\/code>；<code class=\"nl\">open(opts)<\/code> 一次做完，<code class=\"nl\">#helpBtn<\/code> 直接綁它即可。<\/td><\/tr><tr><td><code class=\"nl nr\">demogameHelp.configPaytable(cfg, { type, bet, baseBet, format, counts, reels, skip })<\/code><\/td><td>→ <code>.help-payout-table<\/code> 元素或 <code class=\"nr\">null<\/code><\/td><td>由 config 產生賠率表（之後共用版式排成每個符號一張「N - 派彩」卡片）。<code class=\"nl\">type<\/code> 不給時自動判斷：有 <code class=\"nr\">paylines<\/code>／<code class=\"nl nr\">line_num<\/code>／<code class=\"nl\">lines<\/code> → Lines；<code class=\"nl\">pays<\/code> 是物件或有 <code class=\"nr\">max_ways<\/code>／<code class=\"nl\">ways<\/code> → Ways；其餘 → 全盤計數。派彩讀 <code>pay_table<\/code> → <code>pays<\/code> → <code class=\"nr\">paytable<\/code>（陣列依符號 index，或物件 key＝index／代號）；符號名讀 <code>symbol_str<\/code> → <code>symbol_names<\/code> → <code class=\"nr\">symbol_codes<\/code>。Ways／Lines 欄位＝(<code>reel_num<\/code> − 欄數 + 1)～<code class=\"nl\">reel_num<\/code> 連；計數型依 <code>counts<\/code> → <code>count_labels<\/code> → <code>min_cluster<\/code> 起算（最後一欄加「+」）。派彩 ÷ <code class=\"nr\">baseBet<\/code>（預設 <code>base_bet<\/code> → <code>default_coin_in<\/code> → 1）× 目前押注；全 0 的符號與欄略過。遊戲也可設 <code class=\"nr\">window.DEMOGAME_HELP_CONFIG<\/code>（＋選用 <code class=\"nr\">DEMOGAME_HELP_CONFIG_OPTIONS<\/code>），<code class=\"nl\">#helpContent<\/code> 出現 <code>.help-load-error<\/code> 時共用模組自動補上。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>共用模組設定的唯讀狀態：<code class=\"nl nr\">window.DEMOGAME_CARD_SYSTEM_ENABLED<\/code>（卡片系統是否開）、<code class=\"nl nr\">window.DEMOGAME_SYMBOL_IMAGES_ENABLED<\/code>（符號圖是否在用）、<code class=\"nl nr\">window.demogameSpaceHolding<\/code>（是否正在長按連續 Spin）、<code class=\"nl nr\">window.__demogameImageCache<\/code>（已預載的 Image 物件）。<\/p>\n<h3 id=\"28-help-資料格式\">2.8 Help 資料格式<\/h3>\n<p>Help 原文＝專案根目錄的 <code class=\"nr\">game_help.md<\/code>（固定檔名，舊名 <code>game_help_draft.md<\/code> 不再使用），整份貼進 <code class=\"nr\">&lt;script id=\"embeddedGameHelpMarkdown\" type=\"text/plain\"&gt;<\/code>（雙擊離線開啟時讀不到外部 .md）。格式：<\/p>\n<pre><code>## PAYTABLE                      ← 區塊（## 開頭；名稱含 Meta 的區塊不顯示）\n\n| Item | 繁中 | 英文 |\n| --- | --- | --- |\n| 主要標題 | 符號賠付值 | SYMBOL PAYOUT VALUES |\n| 規則說明 | ▪ 所有符號必須由最左至右連續出現，方可獲獎。 | ▪ ALL WINS MUST BE ON CONSECUTIVE REELS FROM LEFTMOST TO RIGHT. |\n\n### WILD SYMBOL                  ← 小節（### 開頭）\n\n| Item | 繁中 | 英文 |\n| --- | --- | --- |\n| 副標題 | 百搭符號 | WILD SYMBOL |\n| 規則說明 | ▪ [WW] 可替代除 [C1] 以外的所有符號。 | ▪ [WW] SUBSTITUTES FOR ALL SYMBOLS EXCEPT [C1]. |\n\n### 賠率表                        ← 小節名稱固定「賠率表」；副標題表之後先「繁中：」再「英文：」各一張賠率表\n\n| Item | 繁中 | 英文 |\n| --- | --- | --- |\n| 副標題 | 賠率表 | PAYTABLE |\n\n繁中：\n\n| 符號 | {5} 連 | {4} 連 | {3} 連 |\n| --- | ---: | ---: | ---: |\n| [M1] | {250} | {150} | {50} |\n\n英文：\n\n| SYMBOL | {5} OF A KIND | {4} OF A KIND | {3} OF A KIND |\n| --- | ---: | ---: | ---: |\n| [M1] | {250} | {150} | {50} |<\/code><\/pre>\n<ul><li>每列第一欄 <code>Item<\/code> 只有三種：<code class=\"nl nr\">主要標題<\/code>（區塊標題）、<code class=\"nl nr\">副標題<\/code>（小節標題）、<code class=\"nl nr\">規則說明<\/code>（一條規則，前面的 <code>▪<\/code> 會被去掉改成共用圓點）。<\/li><\/ul>\n<ul><li><code class=\"nl\">[代號]<\/code> 會換成符號小圖、<code class=\"nl\">{數字}<\/code> 只是強調標記（顯示時去掉大括號）、<code class=\"nl\">[走線圖-…]<\/code> 佔位列見第 4 節。賠率表數字是以 <code>base_bet<\/code> 為底的派彩，顯示時換算成目前押注（數字 ÷ <code>base_bet<\/code> × 目前底注），押注改變時重算。<\/li><li>遊戲用共用 API 輸出 Help（第 2.7 節）：<code class=\"nl\">#helpBtn<\/code> 綁 <code class=\"nr\">demogameHelp.open({ baseBet, bet, format, config })<\/code>，或自己載入 md 後呼叫 <code class=\"nr\">demogameHelp.render(md, opts)<\/code>；不要再自寫 md 解析。API 依目前語言輸出到 <code>#helpContent<\/code> 的 DOM 結構固定如下（舊遊戲自寫 renderer 也必須輸出同一結構），之後的版式（置中、特殊符號卡片、兩欄符號卡片、內嵌小圖、走線圖）都由共用模組自動套用：<\/li><\/ul>\n<pre><code>&lt;section class=\"help-section\"&gt;\n  &lt;h3 class=\"help-section-title\"&gt;區塊標題&lt;/h3&gt;\n  &lt;div class=\"help-rule\"&gt;&lt;div class=\"help-rule-zh\"&gt;規則一條&lt;/div&gt;&lt;/div&gt;   &lt;!-- 英文用 help-rule-en --&gt;\n  &lt;h4 class=\"help-group-title\"&gt;小節標題&lt;/h4&gt;\n  &lt;div class=\"help-rule\"&gt;&lt;div class=\"help-rule-zh\"&gt;…&lt;/div&gt;&lt;/div&gt;\n  &lt;div class=\"help-payout-table\"&gt;                                         &lt;!-- 賠率表：第一列表頭，第一欄符號代號 --&gt;\n    &lt;div class=\"help-payout-row\"&gt;&lt;div class=\"help-payout-cell\"&gt;Symbol&lt;/div&gt;&lt;div class=\"help-payout-cell\"&gt;5&lt;/div&gt;…&lt;/div&gt;\n    &lt;div class=\"help-payout-row\"&gt;&lt;div class=\"help-payout-cell\"&gt;M1&lt;/div&gt;&lt;div class=\"help-payout-cell\"&gt;5.00&lt;/div&gt;…&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/section&gt;<\/code><\/pre>\n<ul><li>讀不到 md 或 md 沒有賠率表時（第 4 節「Help 至少要有賠率表」），呼叫 <code class=\"nr\">render<\/code>／<code class=\"nl\">open<\/code> 時傳 <code class=\"nr\">config<\/code>，由 <code>demogameHelp.configPaytable<\/code> 依目前押注產生賠率表（支援全盤計數型、Ways、Lines，依 config 的派彩結構自動判斷，必要時用 <code class=\"nr\">configOptions.type<\/code>／<code class=\"nl\">counts<\/code> 指定）；不用 API 的遊戲可設 <code class=\"nr\">window.DEMOGAME_HELP_CONFIG<\/code>，<code class=\"nl\">#helpContent<\/code> 出現 <code>.help-load-error<\/code> 時共用模組自動補上。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-補牌方式\">3. 補牌方式<\/h2>\n<p>每款有消除機制的遊戲，必須在 Game Rule、Config 對應說明與 Demogame 中指定唯一補牌方式。Simulator 與 Demogame 必須使用相同邏輯。<\/p>\n<ol><li><strong class=\"nl nr\">消除後原地補牌<\/strong><ul><li>中獎符號消除後，只在原本的空格位置抽取並顯示新符號。<\/li><li>盤面上未消除的符號維持原座標，不播放向下移動動畫。<\/li><li>新符號在空格原位「長出來」（縮放 0→1，共用 <code class=\"nr\">demogameMotion.grow()<\/code>），<strong class=\"nl nr\">不得播放掉落動畫<\/strong>。<\/li><\/ul><\/li><li><strong class=\"nl nr\">消除後掉落補牌<\/strong><ul><li>中獎符號消除後，同一 Reel／Column 上方未消除的符號依重力向下補位。<\/li><li>剩餘空格由新符號從盤面上方掉入。<\/li><li>動畫必須區分既有符號的 Settle 與新符號的 Drop／Refill。<\/li><li>掉落整段時間＝一輪從滾動到滾停的時間（共用 <code class=\"nr\">demogameMotion.dropMs()<\/code>）。<\/li><\/ul><\/li><li><strong class=\"nl nr\">特殊補牌（By Game）<\/strong><ul><li>不符合前兩類的 Random、Parallel、跨欄移動、整盤替換或其他特殊補牌皆歸此類。<\/li><li>必須在該遊戲的 <code>game_rule.md<\/code> 與數學模型的 <code>Game Description<\/code> 工作表中明確定義抽取來源、移動方向、補牌順序、保留位置及動畫。<\/li><li>不得把單一遊戲的特殊補牌邏輯寫成所有遊戲共用的預設行為。<\/li><\/ul><\/li><\/ol>\n<ul><li>補牌資料必須來自 Config 定義的 Reel／Drop Table／Weight，不得只為動畫另外抽一組結果。<\/li><li>補牌後重新判獎的次數、盤面與得分必須可由 Debug 結果重現，並與 Simulator 對帳。<\/li><li>Symbol 轉 Wild、鎖定位置或不補牌的位置，必須先依遊戲規則處理，再執行選定的補牌方式。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-必要行為\">4. 必要行為<\/h2>\n<ul><li>支援 Normal Spin，以及遊戲實際存在的 Extra Bet、Buy Feature、Super Feature。<\/li><li>押注選項依 Bet Currency：1～1500 加上最大押注 2000／3000／5000；押注層級由數學定義的遊戲（例如 H014 依押注各有自然表）以 Config 為準。<\/li><li>Bet 顯示與 Credit 扣款使用實際模式成本；Win 依流程即時更新：每次消除得分就加上去（BG 局與每轉 FG），局末數值與結算相同；觸發 FG 那局（含 BF 入場盤）的 BG 得分要累積進 FG，FG 期間 Win＝觸發局 BG 得分＋FG 累計，FG 結束時等於整局總得分；Debug 的 Previous／Next 逐步檢視時，Win 同步顯示該步的累計得分。<\/li><li>Auto、Speed、Reset 不得改變 RNG、得分或統計結果。<\/li><li>Speed 為 1～5 五階：1～4 階轉輪由左到右逐輪停；第 5 階不逐輪停，Spin 後所有轉輪同時到位（BG、FG、Respin 皆同）。<\/li><li>轉輪滾動一律照 H020 超級寶石的滾法（做法見下一條「輪帶滾動做法」，不需參考 H020）：每輪是一條連續往下捲動的輪帶，由左到右依序停在結果上；不得用每一幀換一次符號的方式表現滾動。轉輪類遊戲停輪前要多往下滾約 18% 格高再回彈到正確位置（總時間不變，輪帶上方墊一格避免露出空白）；Speed 1～4 每輪至少滾 10 個符號，Speed 5 維持。掉落類遊戲（H013、H019、H027、H045、急速糖果 2、糖果狂歡 2500）Spin 不播輪帶滾動：舊盤面整欄往下掉出、新符號整欄從上方掉入並輕微回彈，由左到右逐欄錯開（Speed 5 同時），每欄時間＝<code class=\"nr\">reelSpinMs()<\/code>，用共用 <code class=\"nr\">demogameMotion.dropSpin()<\/code>；連消後的補牌方式維持各遊戲原本規則。<\/li><li>輪帶滾動做法（輪帶類遊戲，參考實作 H032 <code class=\"nr\">reelStripSpin<\/code>）：結果在動畫前已算好並畫進 <code class=\"nr\">#board<\/code>，動畫只是蓋在上面的表演，不得改結果。<ol><li>每一輪在該輪格子上方蓋一個 <code>overflow:hidden<\/code> 的視窗（<code class=\"nl nr\">position:absolute<\/code>，左右各多留 3px，避免外框光暈被切），動畫期間該輪真格 <code class=\"nr\">visibility:hidden<\/code>。<\/li><li>視窗內放一條直的輪帶，由上到下：墊 1 格隨機符號（回彈時不露出空白）→ 結果盤面該輪各格的複本 → <code>extra<\/code> 格。<code class=\"nl\">extra<\/code>＝max(列數＋3, round(該輪時間 ÷ 60), Speed 1～4 時 10)；<code class=\"nl\">extra<\/code> 中最下面「列數」格放前一盤該輪各格的複本（下一條規則），其餘放從目前盤面隨機挑的符號複本。複本要清掉 <code class=\"nr\">hit<\/code>、<code class=\"nl\">fx-*<\/code> 等狀態 class。<\/li><li>輪帶起點 <code class=\"nr\">translateY(-extra × 格距)<\/code>（此時視窗顯示的正是前一盤），用 Web Animations 往下捲：前 82% 時間捲到「超過終點」（超捲量見上一條），再回彈到 <code class=\"nr\">translateY(0)<\/code>；先把起點寫進 <code class=\"nr\">style.transform<\/code>，避免第一格閃出結果盤面。<\/li><li>第 n 輪（0 起算）時間＝<code class=\"nr\">reelSpinMs() + stopStaggerMs() × n<\/code>，所以由左到右依序停；全部結束後移除視窗、恢復真格顯示。<\/li><\/ol><\/li><li>前一個盤面要被捲走（2026-11-18 使用者）：下一次 Spin（含 FG 每轉、Respin）動畫的第一格必須仍是前一個盤面，由舊盤面往下捲走（輪帶類）或整欄掉出（掉落類）後，新盤面才從上方進來；<strong class=\"nl nr\">不得先把盤面換成新符號再開始滾<\/strong>，也不得逐格換符號假裝滾動。輪帶類做法：滾動輪帶在動畫起點對到視窗的那幾格放前一盤每格的複本（Jumbo 大符號、Extra Reel 照實際位置與大小，清掉得分框等狀態），其餘才放隨機輪帶符號；共用 <code>demogameMotion.dropSpin()<\/code> 與掉落類遊戲本來就符合。新遊戲交付前以凍結動畫第一格截圖比對前一盤確認。<\/li><li>動畫時間統一由共用 <code>window.demogameMotion<\/code> 提供，各遊戲不得自訂：一輪滾動到滾停 <code>reelSpinMs()<\/code>＝700／520／380／260／180 ms（Speed 1～5），逐輪停錯開 <code>stopStaggerMs()<\/code>＝120／100／80／60／0 ms；掉落補牌 <code class=\"nr\">dropMs()<\/code>、原地補牌長出來 <code>growMs()<\/code> 都等於 <code class=\"nr\">reelSpinMs()<\/code>。<\/li><li>每一轉（BG 局與每一轉 FG）算完分後的停頓（不受 Speed 影響，Simulation 不停頓）：手動 Spin 固定停 0.5 秒（共用 <code class=\"nr\">window.demogameRoundPause()<\/code>，長按連續 Spin 時減半）；<strong class=\"nl nr\">Auto 停 250ms，之後再 90ms 開始下一轉<\/strong>（同 H032，2026-11-20 使用者），不得用更長的 Auto 間隔。<\/li><li>BG、Cascade、FG、Retrigger 與 Feature 狀態按真實流程播放。<\/li><li>FG 結束回到 BG 時，盤面還原成觸發 FG 那局的 BG 最終盤面（BF 為入場盤），Feature Status 回到基礎遊戲。<\/li><li>Config、Version、Profile、押注層級、Card System 與 Language 只顯示實際支援的內容。<\/li><li>Help 與 <code>game_help.md<\/code> 一致，不在 HTML 另維護一份規則。<\/li><li>Help 至少要有賠率表：<code class=\"nl\">game_help.md<\/code> 沒有賠率（或讀不到、只剩離線副本）時，由 Config 的 Paytable 依目前押注產生。<\/li><li>Help 版式（共用 <code class=\"nr\">demogame_common.js<\/code>，2026-11-18 照參考排版）：內容窄欄（最寬 600px）置中；區塊標題白色 20px 置中、副標題白色 16px 置中、區塊之間用分隔線；規則 14px 淺灰、前面圓點「•」、條與條之間留空；全大寫的英文規則自動轉成句首大寫（[代號]、{數字}、FG／RTP／C1 等縮寫與 Free Game、Wild 等功能名稱維持大寫）。賠率表顯示成兩欄符號卡片，每張是「符號＋由大到小兩欄（張數白、派彩金色）」，每張卡片都框起來（淡底色＋細框、圓角 10px、卡片間距 10px，樣式同特殊符號卡片；2026-11-20）；特殊符號（WW／W2／C1／C2…）放在賠率表這一區、一般符號格前面，跟一般符號之間不畫分隔線（分隔線只用在區和區之間），不可排進一般符號的兩欄格裡（2026-11-20 照參考排版）：每個特殊符號一張滿欄寬、有淡底色與細框的卡片，「左圖右文」，由上到下排（先 Wild 後 Scatter）：左邊符號圖（有美術 76px），右邊先是金色名稱（正式 Help 的副標題，例：百搭符號）再是該符號的說明條列；說明跟其他區完全同一種排法（靠左、圓點、同字級行高），不可置中或拿掉圓點。Help 所有內文的字級、行高、條距一律相同（14px／1.55，特殊符號說明也一樣）。內文裡的 [代號]（[WW]、[C1]、[M1]…）一律換成內嵌符號小圖，小圖不可撐高行高；彩金名稱 [GRAND]／[MAJOR]／[MINOR]／[MINI] 換成彩金列同色的粗體字（紅／紫／藍／綠），不留中括號；其餘遊戲沒有那個代號的圖就維持 [代號] 文字，不硬換；沒美術時特殊符號的圖改用代號方格。有符號美術的遊戲要定義 <code class=\"nr\">window.DEMOGAME_SYMBOL_ART = { 代號: 圖片網址 }<\/code>，卡片用該圖；沒美術時，顯示與盤面同款的深色代號方格（C1／SC 金色、WW 綠色）。<\/li><li>Help 走線圖（共用，2026-11-20）：正式 Help 的 <code class=\"nr\">[走線圖-1,024 MAX WAYS]<\/code>、<code class=\"nl nr\">[走線圖-3 OF A KIND PAYS 2 WAYS]<\/code>、<code class=\"nl\">[走線圖-NO WIN]<\/code> 佔位列要原樣放進 Demo 的 Help 文字，共用程式會畫成盤面小圖（一格一格的盤面、金色圓點代表符號位置；NO WIN 把中斷的那一軸整軸標紅），三張排成一橫排、各自一張卡片、圖下寫說明。盤面大小讀 config 的 <code class=\"nr\">reel_num<\/code>／<code class=\"nl nr\">window_size<\/code>，讀不到的遊戲宣告 <code class=\"nr\">window.DEMOGAME_WAY_BOARD = [軸數, 列數]<\/code>。<ul><li>三種遊戲類型的走線圖長相不同（2026-11-20 使用者提供正式 Help 的樣子），Demo 要照該類型畫，配色用 Demo 的深色樣式（淡底色卡片、金色標示、紅色標中斷軸），不照搬正式 Help 的底色：<ul><li><strong class=\"nl nr\">Way Game（固定路數，例 1,024 Ways）<\/strong>：三張盤面圖排一橫排——<code class=\"nr\">N MAX WAYS<\/code>（每格都有圓點）、<code class=\"nl nr\">3 OF A KIND PAYS 2 WAYS<\/code>（第 1 軸 1 顆、第 2 軸 2 顆、第 3 軸 1 顆）、<code class=\"nl nr\">NO WIN<\/code>（第 2 軸整軸標紅，其餘軸有圓點但連不起來）；圖下寫說明。共用程式已支援。<\/li><li><strong class=\"nl nr\">Megaways（各軸高度可變）<\/strong>：一樣是三張圖（<code class=\"nl nr\">N MAX WAY<\/code>、<code class=\"nl nr\">3 OF A KIND PAYS 2 WAYS<\/code>、<code class=\"nl nr\">NO WIN<\/code>），但盤面要畫出實際形狀——各軸格數不同、有上方額外橫軸時（例：第 2～5 軸上方多一列）畫在盤面上方；<code class=\"nl\">MAX WAY<\/code> 那張畫每軸最多格數且全部有圓點，另外兩張用高度不一的格子示範（大符號占多格仍算 1 顆）；<code class=\"nl\">NO WIN<\/code> 同樣把中斷的那一軸整軸標紅。<\/li><li><strong class=\"nl nr\">Line Game（固定賠付線）<\/strong>：每條賠付線一張小盤面圖，該線經過的格子標亮（金色）、其餘格子暗色；圖下寫兩位數線號（<code class=\"nl nr\">01<\/code>、<code class=\"nl nr\">02<\/code>…），依線號由小到大排，一橫排 4 張；線的走法取自 config 的賠付線定義，不可手寫。<\/li><li>三種畫法都在共用 <code class=\"nr\">demogame_common.js<\/code>（2026-11-20），各遊戲不要自己畫，只要把正式 Help 的佔位列原樣放進 Help 文字並宣告必要設定：Megaways 宣告 <code class=\"nr\">window.DEMOGAME_WAY_SHAPE = { reels: 6, rows: 5, top: [2, 5] }<\/code>（<code class=\"nl\">rows<\/code>＝主盤面每軸最多格數；<code class=\"nl\">top<\/code>＝上方額外橫軸涵蓋的軸，1 起算，沒有就省略），佔位列同 Way Game（例 <code class=\"nr\">[走線圖- 32,400 MAX WAY]<\/code>）；Line Game 的佔位列是 <code class=\"nr\">[走線圖 20 LINE]<\/code>／<code class=\"nl nr\">[PAYLINE DIAGRAM 20 LINE]<\/code>，賠付線讀 config／Box 資料的 <code class=\"nr\">paylines<\/code>（每條線是各軸在第幾列、0＝最上列），讀不到的遊戲宣告 <code class=\"nr\">window.DEMOGAME_PAYLINES<\/code>；讀不到賠付線時維持原文字、不畫。<\/li><\/ul><\/li><\/ul><\/li><li>連線（Line）遊戲有得分時要在盤面畫出得分線：呼叫共用 <code class=\"nr\">window.demogameWinLines.draw(盤面容器, [[格子元素…], …])<\/code>，每條得分線要依線圖（paylines）整條畫出、連過每一輪的格子中心，不能只畫中獎的那幾連，顏色依序輪替；每次重畫盤面後要重新呼叫。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"5-debug-與重現\">5. Debug 與重現<\/h2>\n<p>Debug Mode 至少可查看：<\/p>\n<ul><li>Config、Version、Profile、Bet Mode、Mode／Feature Price 倍數、base bet、實際模式押注、<code class=\"nl nr\">bet_tier_amount<\/code>、押注層級、Link 資格、BG／FG Max Multiplier 與 Card System 狀態。<\/li><li>Card 抽獎值、卡片區間與 Retry 次數。<\/li><li>Table、Drop Mode 與盤面表（記在 Log）；停輪與整局抽樣以 RNG 碼重現（見下方「可重現 RNG」）。<\/li><li>初始盤面、每段 Cascade、Line／Ways Win、Multiplier 與最終結果。<\/li><li>FG 觸發、局數、Retrigger、整包 Win 及即時 Log。<\/li><li>最後調性更新（共用，頁尾 <code class=\"nr\">.footer-note<\/code>）：頁面在載入 <code>demogame_common.js<\/code> 前設 <code class=\"nr\">window.DEMOGAME_LAST_TUNING = \"YYYY-MM-DD HH:MM\"<\/code>，頁尾顯示「最後調性更新：日期 時間」（24 小時制，到分鐘）。<strong class=\"nl nr\">只有數學模型或倍率（卡片）權重調整才更新<\/strong>（與 <code>修改紀錄.md<\/code> 最新一項同日）；介面、演出、文件修改不更新。<\/li><li>唯一碼（共用，最後調性更新的下一行）：同一個 <code>&lt;script&gt;<\/code> 再設 <code class=\"nr\">window.DEMOGAME_TUNING_CODE = \"XXXXXX\"<\/code>（6 碼隨機碼，大寫英文＋數字，不用 0／O／1／I），頁尾在「最後調性更新」下一行顯示「唯一碼：XXXXXX」。<strong class=\"nl nr\">每次調性更新（換 <code>DEMOGAME_LAST_TUNING<\/code> 時）一定要產生新的唯一碼<\/strong>；所有遊戲（正式專案、發想、克隆、其他）都要有。<strong class=\"nl nr\">每次 Demo 更新完，回報給使用者時都要寫出目前的唯一碼<\/strong>，讓使用者對照線上頁尾判斷是不是最新調性。<\/li><li>數值報告按鈕（共用）：有數值報告 <code>report.html<\/code> 的遊戲，在載入 <code>demogame_common.js<\/code> 前設 <code class=\"nr\">window.DEMOGAME_REPORT_URL = \"./report.html\"<\/code>，標題列右側出現「報告」按鈕（英文 Report），與說明、重置排在一起。<\/li><li>BG／FG 最大倍數（共用，併在「統計」區，取代原「最高倍數」列）：頁面在載入 <code>demogame_common.js<\/code> 前設 <code class=\"nr\">window.DEMOGAME_HISTORY = true<\/code>，每局呼叫 <code class=\"nr\">window.demogameHistory.record({ bg, fg })<\/code>（BG 得分、該局 FG 總得分，皆 ÷ 底注）；沒有 FG 的遊戲只顯示 BG 列，重置清空。<\/li><li>Log（共用 <code class=\"nr\">window.demogameLog(text, type)<\/code>）：帶時間的即時紀錄，新的一行在最上面、舊的往下擠，Clear 清空，最多保留 500 行；所有遊戲行格式一致（照下列格式，參考實作 H045；<code class=\"nl\">&lt;盤面表&gt;<\/code> 為該轉使用的 Table 名稱，沒有多張表的遊戲省略該欄），不記演出過程：<ul><li><code class=\"nl nr\">Config &lt;名稱&gt; loaded | Version &lt;版本&gt; | Card System On|Off<\/code><\/li><li><code class=\"nl nr\">#&lt;局號&gt; Normal Bet|Extra Bet|Buy Feature|Super Feature | Bet &lt;押注&gt;[ | Card Range set][ | Replay]<\/code><\/li><li><code class=\"nl nr\">RNG &lt;碼&gt;<\/code>（可點，複製並填入 RNG 欄）<\/li><li><code class=\"nl nr\">BG|BF Entry | &lt;盤面表&gt; | Cascade &lt;n&gt; | C1 &lt;n&gt; | Win &lt;得分&gt; (&lt;倍數&gt;x)<\/code><\/li><li><code class=\"nl nr\">Free Game triggered | &lt;n&gt; spins[ (Retrigger ×k)]<\/code>、<code class=\"nl nr\">FG &lt;i&gt;/&lt;n&gt; | … | Win &lt;得分&gt;<\/code>、<code class=\"nl nr\">FG complete | Total &lt;得分&gt; (&lt;倍數&gt;x)<\/code><\/li><li><code class=\"nl nr\">Error | &lt;訊息&gt;<\/code><\/li><\/ul><\/li><li>Simulation（共用，<code class=\"nl nr\">#batch-simulation<\/code>）：N 局獨立數學模擬，Start 執行中只顯示「進行中」（English：Running），不跳局數。FG 觸發顯示「比例 (N 場)」；最高倍數為單局總得分倍數（BF ÷ 底注）；消除分布轉置為「消除次數 × BG／FG」，與倍率線型一樣各自框成一區並有標題。各遊戲提供：<ul><li><code class=\"nl nr\">window.demogameSimulateRound({ mode })<\/code>：用與畫面相同的遊戲邏輯產生一局（不得另寫簡化數學），回傳 <code class=\"nr\">multiplier<\/code>（總得分含 FG ÷ 實際押注）、<code class=\"nl nr\">lineMultiplier<\/code>（BF ÷ 底注，其餘同 <code class=\"nr\">multiplier<\/code>）、<code class=\"nl nr\">fgTriggered<\/code>、<code class=\"nl nr\">maxMultiplier<\/code>、<code class=\"nl nr\">retryLimitExceeded<\/code>、<code class=\"nl nr\">retryCount<\/code>、<code class=\"nl nr\">bgCascade<\/code>、<code class=\"nl nr\">fgCascades<\/code>；<code class=\"nl\">mode<\/code> 只在該局暫時套用，不得改動畫面押注模式與統計。<\/li><li><code class=\"nl nr\">window.demogameSimulationModes = [{ value, label }]<\/code>：只列實際支援的押注模式，面板據此顯示押注模式選單。<\/li><li><code class=\"nl nr\">window.demogameSimulationBets = [{ value, label }]<\/code>（2026-11-20）：押注大小選單，放在押注模式選單右邊、樣式相同；選定值以 <code>demogameSimulateRound({ mode, bet })<\/code> 傳給遊戲，只用在模擬、不改玩家目前押注，並依該押注套用對應的小／中／大 Bet config；<code class=\"nl\">window.demogameSimulationBetDefault()<\/code> 回傳預設值（目前押注）。<\/li><li>模擬的累積結果依「押注模式＋押注大小」各自保存（2026-11-20）：換設定是切換到那組的累積（沒跑過就顯示空的），再按開始是接著那組繼續跑；只有按重置才把所有組合全部清空。<\/li><\/ul><\/li><li>右欄區域可摺疊（共用）：右欄有標題的區域（基本指標、特殊指標、玩法簡介、倍率線型等）點標題即可收起／展開，標題左側有箭頭，收起時標題列上下置中；標題內的按鈕（放大「+」）不觸發摺疊。倍率線型預設收起，玩法簡介預設打開。玩法簡介的競品／期待／玩法各列之間用分隔線隔開（同特殊指標）。<\/li><li>下方除錯區可摺疊（共用）：版本紀錄／模擬／紀錄點標題列收起／展開；版本紀錄預設折疊，模擬、紀錄預設展開。<\/li><li>空白鍵＝Spin（共用，鎖住預設）：空白鍵只觸發 Spin（按 <code class=\"nr\">#spinBtn<\/code>），擋掉瀏覽器預設的整頁往下捲與按到焦點所在的按鈕／勾選框；按住不連發。焦點在文字輸入欄、下拉選單時照常打字；說明視窗開著不 Spin；導覽開著時空白鍵關閉導覽。由共用模組在 window 捕獲階段處理，各遊戲自己的空白鍵監聽不會再收到（不會重複 Spin），新遊戲不用另外寫。<\/li><li>餘額加錢（共用）：「餘額」標籤右邊有純文字「+」（無外框），按一下餘額 +1000（顯示金額）。各遊戲在自己的作用域設 <code class=\"nr\">window.demogameAddCredit = (n) =&gt; { 依內部單位換算後加進 state 餘額; 重畫; }<\/code>，沒設就不顯示「+」。<\/li><li>訊息列（盤面下方，贏分區，<code class=\"nl nr\">#messageBar<\/code>）一律用下列文字（參考實作 H032；「」內為中文顯示，English 依序為 <code class=\"nr\">Ready — press Spin<\/code>、<code class=\"nl nr\">Spin<\/code>、<code class=\"nl nr\">Free Spin<\/code>、<code class=\"nl nr\">WIN<\/code>、<code class=\"nl nr\">No Win<\/code>）：待命「準備完成 — 請按 Spin」；轉動「Spin」／「Free Spin」；每段得分「WIN x」，有倍數「WIN 原始 × 倍數 = 得分」（轉末才乘的遊戲在轉末顯示），每次閃一下（<code class=\"nl nr\">#messageBar.fx-bar-hit<\/code>）；一轉結束「WIN 總分」或「未中獎」；FG 每轉「FG i/n · WIN x」或「FG i/n · 未中獎」，加局再接「 · +k FG」。除錯文字（Cascade／Pay／Drop／停輪等）只寫 Log，不上訊息列。<\/li><li>押注模式按鈕（共用）：一排排開，每顆 88px（放不下才縮）、高 34px、間距 6px；名稱 11px＋倍數另起一行 9px；未開放的模式 disabled＋<code class=\"nr\">.is-locked<\/code>，壓黑（底 #0b111a、字 #4a5563），不寫「製作中」。<\/li><li>購買類按鈕（購買特色／超級特色等，共用）：一律藍色（底 #0077cc、白字、無外框），不可用綠色或其他顏色區分；按下去買進後壓暗（class <code class=\"nr\">dg-buy-active<\/code>），到這場 FG 結束才恢復；壓暗的樣子跟買進期間另一顆被停用的購買按鈕完全相同（同藍底 #0077cc、白字、opacity .45），兩顆看起來一樣，不另用深色或綠色。樣式由 <code>demogame_common.js<\/code> 提供，各遊戲 index.html 不另寫顏色覆寫。特色結束時遊戲要發 <code class=\"nr\">document.dispatchEvent(new Event(\"dg-feature-end\"))<\/code>（放在 FG 結算看板關閉、回到主遊戲之後），共用程式收到就立刻恢復購買鈕；沒發的話只靠輪詢，連續 Spin 時會一直壓暗（2026-11-20）。<\/li><li>FG 看板（蓋在盤面上，<code class=\"nl nr\">#board .fg-banner<\/code>）：<ul><li>觸發看板：觸發 FG（含購買進場）後、第一場 FG 開始前顯示「免費遊戲／N 場」；有符號圖時帶觸發符號小圖（固定 72px，不得撐滿盤面蓋住文字）。<\/li><li>結算看板：最後一場 FG 轉完（含加局全部轉完）後顯示「免費遊戲結束／總贏分／金額／倍數（總贏分 ÷ 底注，2 位小數）」，金額為整場 FG 的總贏分，不含觸發那一把的 BG 得分。<\/li><li>關閉方式兩者相同：Auto 模式 1 秒後自動消失；非 Auto 要點盤面／看板或按 Spin 關閉。看板顯示期間背景不可捲動，看板消失後才進下一步（開始 FG／回到 BG）。<\/li><li>長按 SPIN／空白鍵連續 Spin 時：結算看板不可被長按關掉，連續 Spin 到結算看板就終止，操作者要放開後重新按才繼續（看板元素加 <code class=\"nr\">data-hold-stop<\/code>，共用 <code>demogame_common.js<\/code> 看到就停止連續 Spin）；觸發看板不受此限，連續 Spin 會照常關掉並開始 FG。<\/li><li>用共用 API（第 2.7 節）：觸發看板 <code class=\"nr\">await demogameFgBanner.trigger({ spins, icon: \"C1\", auto: state.auto })<\/code>，結算看板 <code class=\"nr\">await demogameFgBanner.end({ win, bet: 底注, format: 金額格式, auto: state.auto })<\/code>（自帶 <code class=\"nr\">data-hold-stop<\/code>）；遊戲 <code>await<\/code> 之後才開始 FG／回到 BG。樣式由 <code>demogame_common.css<\/code> 提供（外觀同 H032），遊戲不另寫看板樣式。<\/li><li>API 產生的結構：在 <code>#board<\/code> 內 append <code class=\"nr\">&lt;div class=\"fg-banner dg-fg-banner\" [data-hold-stop]&gt;&lt;div class=\"fg-banner-card\"&gt;…&lt;/div&gt;&lt;/div&gt;<\/code>，卡片內依序 <code class=\"nr\">.fg-banner-icon<\/code>（觸發符號圖，可省略）、<code class=\"nl nr\">.fg-banner-title<\/code>、<code class=\"nl nr\">.fg-banner-sub<\/code>、<code class=\"nl nr\">.fg-banner-count<\/code>；點盤面、按 <code class=\"nr\">#spinBtn<\/code>（顯示期間暫時解除 disabled，關閉後還原）或 Auto 1 秒後 resolve 並移除看板；期間 <code>&lt;html&gt;<\/code> 加 <code>dg-modal-open<\/code> 鎖背景捲動。舊遊戲（H026、H032、H039 等）自寫的 <code>.fg-banner<\/code> 不受共用樣式影響，可繼續使用。<\/li><\/ul><\/li><li>重置（RNG 區 <code class=\"nr\">#setRngResetBtn<\/code>）與模擬區開始／重置（<code class=\"nl nr\">#batchSimulationStartBtn<\/code>／<code class=\"nl nr\">#batchSimulationResetBtn<\/code>）（共用）：跟 SPIN 同款藍色主按鈕（底 #0077cc、白字、高 34px、無外框光暈），disabled 壓暗（底 #102a49、字 #87a7c1）；各遊戲 index.html 不另寫顏色覆寫。<\/li><li>模擬（共用）：第一次按「開始」，之後按鈕變「繼續」，每次再跑輸入的局數並接在前面累積（統計與倍率線型都累加）；按「重置」清空回到「開始」；累積依「押注模式＋押注大小」各自保存（見上方模擬條）。<\/li><li>飛行動畫目標（共用）：狀態列 <code>#strip-bar<\/code> 已隱藏、改由盤面上方資訊條鏡射倍數膠囊，倍數飛到 Mult／Sum 等動畫一律用 <code>window.demogameFxTarget(\"multPill\")<\/code> 取得畫面上看得到的目標，不要直接量 <code>#multPill<\/code> 的位置（會飛到左上角）。<\/li><li>新手導覽（共用）：每台裝置<strong>第一次進遊戲<\/strong>自動播（localStorage 記看過、所有遊戲共用，2026-11-12），標題列「導覽」可再看；導覽內容有改時把 <code>GUIDE_REV<\/code> 加 1，看過舊版的裝置會再自動播一次。<strong class=\"nl nr\">逐步導覽<\/strong>（2026-11-12）：一次框一個區域，依序為盤面、SPIN／控制、餘額／押注／得分、押注模式、指標、玩法簡介、倍率線型、除錯模式、<strong class=\"nl nr\">設定（顯示符號 ID、版本、Config、語言，2026-11-20）<\/strong>；說明框下方有「上一步／n/N／下一步」，最後一步「完成」，Esc 關閉、← → 切換。框線緊貼目標外緣、粗細一致，說明框不壓到目標。手機版（寬度 ≤760px 或觸控裝置）不顯示導覽，也不放「導覽」鈕（2026-11-11）。找不到的區域自動略過，各遊戲不用另外寫；共用 Setting 新增功能時要同步補進導覽步驟。<\/li><li>玩法簡介（共用，累積倍率線型上方，標題「玩法簡介」／Game Overview）：寫<strong class=\"nr\">競品<\/strong>（廠商＋遊戲名）、<strong class=\"nl nr\">期待<\/strong>（一句話說明這款遊戲玩家期待的過程）與<strong class=\"nr\">玩法<\/strong>（本作相對競品的規格變化，沒有競品就寫主要玩法，3～6 點、每點一句；只寫規格上的變化，不寫權重、機率、調性等隱性設計）；詳細規則放標題列「說明」，不寫在這裡。頁面在載入 <code>demogame_common.js<\/code> 前設 <code class=\"nr\">window.DEMOGAME_OVERVIEW = { competitor: \"廠商 遊戲名\", expect: \"…\", changes: [\"…\"] }<\/code>，沒設就不顯示。遊戲發想以自家前作為基底時加 <code class=\"nr\">label: \"base\"<\/code>，標籤改顯示「前作」（competitor 填前作名稱與編號）。<\/li><li>累積倍率線型（共用，統計區下方，標題「倍率線型 (押注模式)」）：畫面實際遊玩的局，NB 記在 NB、EB 記在 EB，BF／SF 不記錄；依目前押注模式顯示對應的累積圖（標準 64 區間、Y 軸上限 1%），重置清空。右欄小圖：X 軸每 8 個區間標一次、字維持可讀大小，縱軸依 1x 以上區間的最大占比自動縮放（還沒有 1x 以上的局就依全部區間；0x、(0, 1] 超出就裁掉），從第一局就看得到點；按「+」放大才顯示完整 64 區間標籤。遊戲每局（含 FG）結束時呼叫 <code class=\"nr\">window.demogameLineChart.record(總得分 ÷ 押注, \"NB\"|\"EB\")<\/code>；押注模式按鈕沒有 is-active 樣式時另呼叫 <code class=\"nr\">setMode()<\/code>。<\/li><li>倍率線型（共用，併入 Simulation 面板）：該次模擬每局 <code>lineMultiplier<\/code> 的標準 64 區間分布，X 軸逐一標出 (下限, 上限]，Y 軸 NB／EB 1%、BF 20%，超過上限或為 0 的區間不畫點、線在該處斷開。沒有 Simulation 面板的頁面才在 Set RNG 上方顯示即時線型（NB 一局含 FG 結束時呼叫 <code class=\"nr\">window.demogameLineChart?.record(該局總得分 ÷ 底注)<\/code>；批次模擬不得呼叫）。<\/li><\/ul>\n<p>Set RNG 的各欄位（卡片區間、遊戲專屬選單、RNG）互斥：設定其中一個時其他回到預設（共用模組處理）。所有設定都每局沿用，按重置才清空，遊戲不得在 Spin、FG、切換模式後自行清掉。指定值要檢查格式；不得因指定 RNG 進入無限重跑。<\/p>\n<p><strong class=\"nl nr\">Set RNG（共用，<code>#set-rng-panel<\/code>）<\/strong>：欄位排成一列等寬（卡片 BG 區間、遊戲專屬選單、RNG <code class=\"nr\">#rngInput<\/code>、重置 <code class=\"nr\">#setRngResetBtn<\/code>）。<\/p>\n<p><strong class=\"nl nr\">可重現 RNG（共用 <code>window.demogameRng<\/code>）<\/strong>：每局（BG＋整場 FG）以一組 32-bit 種子算出；Log 印一行 <code class=\"nr\">RNG &lt;Config-Profile&gt;/&lt;NB|EB|BF|SF&gt;/&lt;on|off&gt;/&lt;選項|-&gt;/&lt;種子 8 碼&gt;<\/code>，點一下複製並填入 RNG 欄，按 Spin 整局重跑出相同結果。遊戲在每局開始呼叫 <code>demogameRng.takeInput()<\/code> 取碼、用 <code>demogameRng.run(seed, fn)<\/code> 一次算完整局結果（表演用亂數放在外面），選項欄放重現所需的遊戲專屬設定（例：腳本名稱、<code class=\"nl nr\">r&lt;卡片區間&gt;<\/code>）。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"6-與-simulator-對帳\">6. 與 Simulator 對帳<\/h2>\n<p>至少準備下列可重現案例：無獎 BG、一般得分、Wild／Scatter、Cascade／Multiplier、FG Trigger／Retrigger、各 Bet Mode、Newbie、Oldhand 小／中／大 Bet、Link 可用／不可用、Card System range／free_game／Retry、Max Win 截斷及遊戲專屬 Feature。<\/p>\n<p>逐項確認盤面、RNG、各段得分、Total Win、Coin In、倍率、Feature 狀態與 Retry 計數一致。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"7-交付檢查\">7. 交付檢查<\/h2>\n<p>Demogame 的「版本紀錄」（<code class=\"nl nr\">#change-log-wrap<\/code>，Debug Mode 開啟時顯示）是專案 <code>個人筆記/修改紀錄.md<\/code> 的複本，只說明各版本的<strong class=\"nr\">調性差異<\/strong>：<\/p>\n<ul><li>格式同 <a href=\"#\" class=\"nr tab-link\" data-tab=\"outputs\" data-anchor=\"2-修改紀錄格式\">產出與紀錄規範 第 2 節<\/a>：依四碼版本分節、新到舊，列出全部版本；每個版本一個 <code class=\"nr\">&lt;article class=\"change-log-entry\"&gt;<\/code>，標題 <code class=\"nr\">&lt;h4&gt;v&lt;第 1 碼&gt;（&lt;四碼版本&gt;）&lt;/h4&gt;<\/code>，內文 <code>&lt;ol&gt;<\/code> 編號清單，項目與 <code>修改紀錄.md<\/code> 相同（同一版本內由舊到新、句尾附 <code class=\"nl nr\">（MM/DD）<\/code>）。設定區目前選的版本那一節由共用模組標示。<\/li><li>每次 <code>修改紀錄.md<\/code> 新增或修改項目，同一次修改中同步更新 <code class=\"nr\">#changeLogBody<\/code>。<\/li><li>沒有任何調性紀錄時（<code class=\"nl\">修改紀錄.md<\/code> 只有標題），<code class=\"nl\">#changeLogBody<\/code> 留空，共用模組會把整個版本紀錄區隱藏；不得用「現行版本」「細節無紀錄」之類的佔位項目充數。<\/li><li>通則：沒有內容的區域一律不顯示（特殊指標、版本紀錄、空的 Set RNG 容器等由共用模組自動隱藏）。<\/li><li>狀態列以共用模組現況為準（2026-11-20 使用者）：<code class=\"nl\">#strip-bar<\/code> 由共用模組隱藏，倍數膠囊（<code class=\"nl nr\">#multPill<\/code>／<code class=\"nl nr\">#sumPill<\/code>）鏡射到盤面上方資訊條；遊戲進入 FG 時仍必須在 <code>body<\/code> 加上 <code class=\"nr\">fg-mode<\/code>。膠囊由共用模組統一配色，各遊戲不另設：場景標籤（Base Game、Free Game、Buy Feature、Super Feature 等，含特色狀態顯示的場景名稱）用深藍底、淺藍字膠囊；其他資訊（連消、倍數、FG 剩餘、Table 等）一律用黃色膠囊（淡黃底、黃字 12px）；膠囊都不加外框。<\/li><li>Demogame 介面、演出、Debug、共用模組與文件的修改<strong class=\"nr\">不記在頁面上<\/strong>（以 git commit 訊息為準），也不寫進 <code class=\"nr\">修改紀錄.md<\/code>。<\/li><\/ul>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 離線開啟無錯誤，Console 無未處理例外。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 第 2.4 節骨架的固定 id 都在（沒有的模式按鈕除外）、<code class=\"nl\">demogame_common.js<\/code> 在 <code>&lt;/body&gt;<\/code> 前最後載入，第 2.6 節標「必要」的全域宣告與 DOM 狀態都已提供。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 「版本紀錄」（<code class=\"nl nr\">#changeLogBody<\/code>）與 <code>修改紀錄.md<\/code> 內容一致（依版本分節、新到舊、只記調性）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">demogame_common.css<\/code> 與 <code>demogame_common.js<\/code> 由 <code>../<\/code> 相對路徑載入，且共用功能未複製進遊戲專屬程式。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 圖示範圍內的標題、Feature Status、盤面、動畫與 Message 屬 By Game；其餘 UI 使用共用資源。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> By Game CSS／JavaScript 未覆寫或複製共用區域的版面與控制邏輯。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 符號顯示符合 2.3：有圖＝只顯示圖（無代號、無符號框），無圖＝符號框＋代號；代號不粗體；有美術的遊戲已接共用圖片介面，沒美術的遊戲預設用 ico
