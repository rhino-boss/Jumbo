e class=\"nr\">H&lt;三位數字&gt;1<\/code>；同一數學供多個 Game ID 使用時（如 <code>H0111<\/code> → 102001／102002），數學模型只建一份，Game ID 對應記錄於 Game List。<\/li><\/ul>\n<h3 id=\"13-押注選項\">1.3 押注選項<\/h3>\n<p>押注金額由三個參數相乘：<\/p>\n<pre><code>押注金額 = 最小押分（credits）× Denom × Bet Multiplier\n最小押分 = 100 credits；Denom = 0.002 → 1 倍押注 = 0.2<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>編號<\/th><th class=\"n\">1<\/th><th class=\"n\">2<\/th><th class=\"n\">3<\/th><th class=\"n\">4<\/th><th class=\"n\">5<\/th><th class=\"n\">6<\/th><th class=\"n\">7<\/th><th class=\"n\">8<\/th><th class=\"n\">9<\/th><th class=\"n\">10<\/th><th class=\"n\">11<\/th><th class=\"n\">12<\/th><th class=\"n\">13<\/th><th class=\"n\">14<\/th><th class=\"n\">15<\/th><th class=\"n\">16<\/th><th class=\"n\">17<\/th><th class=\"n\">18<\/th><th class=\"n\">19<\/th><th class=\"n\">20<\/th><th class=\"n\">21<\/th><th class=\"n\">22<\/th><th class=\"n\">23<\/th><th class=\"n\">24<\/th><th class=\"n\">25<\/th><th class=\"n\">26<\/th><th class=\"n\">27<\/th><th class=\"n\">28<\/th><th class=\"n\">29<\/th><th class=\"n\">30<\/th><\/tr><\/thead><tbody><tr><td>倍數<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">3<\/td><td class=\"n\">5<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">15<\/td><td class=\"n\">20<\/td><td class=\"n\">25<\/td><td class=\"n\">30<\/td><td class=\"n\">40<\/td><td class=\"n\">50<\/td><td class=\"n\">60<\/td><td class=\"n\">70<\/td><td class=\"n\">80<\/td><td class=\"n\">90<\/td><td class=\"n\">100<\/td><td class=\"n\">150<\/td><td class=\"n\">200<\/td><td class=\"n\">250<\/td><td class=\"n\">300<\/td><td class=\"n\">400<\/td><td class=\"n\">500<\/td><td class=\"n\">750<\/td><td class=\"n\">1000<\/td><td class=\"n\">1500<\/td><td class=\"n\">2000<\/td><td class=\"n\">2500<\/td><td class=\"n\">3000<\/td><td class=\"n\">5000<\/td><\/tr><tr><td>金額<\/td><td class=\"n\">0.2<\/td><td class=\"n\">0.4<\/td><td class=\"n\">0.6<\/td><td class=\"n\">1<\/td><td class=\"n\">2<\/td><td class=\"n\">2.4<\/td><td class=\"n\">3<\/td><td class=\"n\">4<\/td><td class=\"n\">5<\/td><td class=\"n\">6<\/td><td class=\"n\">8<\/td><td class=\"n\">10<\/td><td class=\"n\">12<\/td><td class=\"n\">14<\/td><td class=\"n\">16<\/td><td class=\"n\">18<\/td><td class=\"n\">20<\/td><td class=\"n\">30<\/td><td class=\"n\">40<\/td><td class=\"n\">50<\/td><td class=\"n\">60<\/td><td class=\"n\">80<\/td><td class=\"n\">100<\/td><td class=\"n\">150<\/td><td class=\"n\">200<\/td><td class=\"n\">300<\/td><td class=\"n\">400<\/td><td class=\"n\">500<\/td><td class=\"n\">600<\/td><td class=\"n\">1,000<\/td><\/tr><tr><td>開啟<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><td class=\"n\"><\/td><td class=\"n\">✓<\/td><td class=\"n\">✓<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>倍數表共 30 組，範圍 <code class=\"nr\">0.2<\/code>～<code class=\"nl nr\">1,000<\/code>；<strong class=\"nl nr\">「開啟」列打勾的 25 檔才上線<\/strong>，未開的 5 檔是 <code class=\"nr\">2.4<\/code>、<code class=\"nl nr\">14<\/code>、<code class=\"nl nr\">18<\/code>、<code class=\"nl nr\">50<\/code>、<code class=\"nl nr\">500<\/code>。<\/li><li>押注表的實際位置：<code class=\"nl nr\">H0071_Bet_Currency.xlsx › 工作表1<\/code>、<code class=\"nl nr\">H0081_Bet_Currency.xlsx › 工作表1<\/code>、<code class=\"nl nr\">H0091+H0101.xlsx › Bet_Currency<\/code>。<\/li><\/ul>\n<h3 id=\"14-rtp-配置\">1.4 RTP 配置<\/h3>\n<pre><code>Total RTP = 新手體驗或老手救援 RTP + Link RTP + （Bonus + Game）RTP<\/code><\/pre>\n<ul><li>轉製遊戲<strong class=\"nr\">不拆 Bonus Game RTP<\/strong>：原機的 Bonus／Feature 派彩與固定倍數獎（Mini／Minor 等）全部歸入「Bonus＋Game」。<\/li><li>RTP ＝ Total Win ÷ 實際 Total Bet；產品顯示可四捨五入，但計算用完整精度；各 Bet Mode 分母用該模式實際成本。<\/li><li>新手體驗與老手救援由系統層給出，數學模型只負責 Bonus＋Game RTP。<\/li><\/ul>\n<h4 id=\"141-nbeb-rtp-配置\">1.4.1 NB／EB RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Player Profile<\/th><th class=\"n\">系統機制 RTP<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Bonus＋Game RTP<\/th><th class=\"n\">合計<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td class=\"n\">新手體驗 2.00%<\/td><td class=\"n\">該彩金配置的 Increment 合計<\/td><td class=\"n\">95.15%<\/td><td class=\"n\">97.15%＋Increment<\/td><\/tr><tr><td>老手無彩金<\/td><td class=\"n\">老手救援 1.00%<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">97.50%<\/td><\/tr><tr><td>老手有彩金<\/td><td class=\"n\">老手救援 1.00%<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">94.50%<\/td><td class=\"n\">97.50%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手拉不到 Grand／Major，但押注會滾入 Increment，所以新手的 Link RTP <strong class=\"nr\">隨彩金配置變動<\/strong>，等於該配置 Grand 與 Major 的 Increment 合計（第 1.5.2 節）：Grand 10 萬組與 Grand 50 萬組都是 0.85%。Bonus＋Game RTP 不隨彩金配置調整。表中新手的合計以新手體驗 2% 計；H0071／H0081 沒有新手體驗，少 2 個百分點；H0091／H0101 沿用菲律賓版新手體驗，驗收值約 2.9%。<\/li><li>老手有彩金＝押注 <code>&gt;= 0.4<\/code> 且該遊戲開啟 Link；老手無彩金＝押注 <code class=\"nr\">&lt; 0.4<\/code>，或該遊戲／賭場未開 Link。<\/li><li>上表的 Bonus＋Game 是轉製遊戲的指定值，合計比主流規範高（同一彩金配置下新手高 0.15 個百分點、老手高 0.50 個百分點），這是刻意的設定，不套用主流規範「Bonus 併入 Game」的 95%／96%／94%。<\/li><li>新手體驗 2% 只適用有新手體驗的遊戲（系統機制第 2 節）：H0091／H0101 沿用菲律賓版新手體驗設定；H0071／H0081 的舊機制已移除，沒有這 2%。<\/li><\/ul>\n<h4 id=\"142-buy-feature-rtp-配置\">1.4.2 Buy Feature RTP 配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類別<\/th><th class=\"n\">Link RTP<\/th><th class=\"n\">Bonus＋Game RTP<\/th><th class=\"n\">合計<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td class=\"n\">該彩金配置的 Increment 合計<\/td><td class=\"n\">95.65%<\/td><td class=\"n\">95.65%＋Increment<\/td><\/tr><tr><td>老手無彩金<\/td><td class=\"n\">0.00%<\/td><td class=\"n\">96.50%<\/td><td class=\"n\">96.50%<\/td><\/tr><tr><td>老手有彩金<\/td><td class=\"n\">2.00%<\/td><td class=\"n\">94.50%<\/td><td class=\"n\">96.50%<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>Buy Feature 沒有新手體驗與老手救援。<\/li><li>新手購買 Feature 不得拉 Link（系統機制第 4 節），但押注不分高低都會滾入 Increment。新手版的 Bonus＋Game 維持 95.65%（比老手無彩金低 0.85 個百分點），兩組彩金配置的 Increment 合計都是 0.85%，所以合計都是 96.50%。<\/li><\/ul>\n<h3 id=\"15-彩金配置\">1.5 彩金配置<\/h3>\n<p>Link 彩金為 Grand、Major 兩層累積彩池。<\/p>\n<h4 id=\"151-link-資格\">1.5.1 Link 資格<\/h4>\n<p>「可滾 Inrc」表示該局押注會依 Increment 比例滾入彩池；「可拉 Link」表示該局有資格中 Grand／Major。兩者是不同的資格：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>狀態<\/th><th>押注<\/th><th>可拉 Link<\/th><th>可滾 Inrc<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td><code class=\"nl nr\">&lt; 0.4<\/code><\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>新手<\/td><td><code class=\"nl nr\">&gt;= 0.4<\/code><\/td><td>否<\/td><td>是<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">&lt; 0.4<\/code><\/td><td>否<\/td><td>否<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">&gt;= 0.4<\/code><\/td><td>是<\/td><td>是<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>新手押注不分高低都滾 Increment（使用者 2026-11-19 確認；本專案自訂，菲律賓版轉製規範第 1.5.1 節的表寫的是新手 <code>&gt;= $2<\/code> 才滾）。<\/li><li>NB／EB 與 Buy Feature 都適用上表；押注金額依第 1.6 節判定。系統限制另見<a href=\"#\" class=\"nr tab-link\" data-tab=\"系統機制\">系統機制<\/a>。<\/li><li>數學模型必須定義哪些派彩歸入 Link、哪些歸入 Bonus＋Game，不得重複計算。<\/li><li>彩金參數的位置：H0071／H0081 在各數學檔的 <code>Jackpot Setting<\/code> 與 <code class=\"nr\">05_MYF\\MYF 彩金參數簡表 (H5).xlsx<\/code>；H0091／H0101 在 <code>04_LLF\\LLF_Calculator (H5).xlsx<\/code> 與 <code class=\"nr\">LLF_Calculator (H5_BF).xlsx<\/code>。LLF 檔內的池名是 Fortune／Grand，分別對應本規範的 Grand／Major。<\/li><\/ul>\n<h4 id=\"152-link-彩金配置\">1.5.2 Link 彩金配置<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>組別<\/th><th>級距<\/th><th class=\"n\">初始金額<\/th><th class=\"n\">Startup%<\/th><th class=\"n\">Increment<\/th><th class=\"n\">RTP<\/th><th class=\"n\">平均開出金額<\/th><\/tr><\/thead><tbody><tr><td>Grand 10 萬<\/td><td>Grand<\/td><td class=\"n\">$100,000<\/td><td class=\"n\">0.65%<\/td><td class=\"n\">0.35%<\/td><td class=\"n\">1.00%<\/td><td class=\"n\">$153,846<\/td><\/tr><tr><td>Grand 10 萬<\/td><td>Major<\/td><td class=\"n\">$20,000<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">0.50%<\/td><td class=\"n\">1.00%<\/td><td class=\"n\">$40,000<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li><strong class=\"nl nr\">2026-11-25 使用者：墨西哥彩金一律用 Grand 10 萬組（Grand $100,000／Major $20,000）<\/strong>；Grand 50 萬組不用。<\/li><li><strong class=\"nl nr\">有 Link 的遊戲才依本表配置<\/strong>。兩組在檔內的編號：H0071／H0081 為 Opt04～06（10 萬）、Opt01～03（50 萬）；LLF 為 ID02（10 萬）、ID01（50 萬）。原本的 100 萬組（H0071／H0081 的 Opt07～09、LLF 的 ID03）不用於墨西哥。<\/li><li>2026-11-16 使用者指示：Grand 100 萬組移除；Grand 10 萬組改回菲律賓版的設定（Major 初始金額 $20,000、Startup 0.50%／Increment 0.50%）。本節是目標規格；各遊戲檔案的修改狀態見第 2 節與轉換紀錄。<\/li><\/ul>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>定義<\/th><\/tr><\/thead><tbody><tr><td>初始金額<\/td><td>彩池開出後重置的起始金額（Start Up Pool）<\/td><\/tr><tr><td>Startup%<\/td><td>押注中用來補足初始金額的比例；<code class=\"nl nr\">Startup% = RTP − Increment<\/code><\/td><\/tr><tr><td>Increment<\/td><td>押注中滾入彩池、讓彩池累積上漲的比例（試算表的 Inrc）<\/td><\/tr><tr><td>RTP<\/td><td>該級距的彩金 RTP；<code class=\"nl nr\">RTP = Startup% + Increment<\/code><\/td><\/tr><tr><td>平均開出金額<\/td><td><code class=\"nl nr\">初始金額 ÷ Startup% × RTP<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>彩金配置共兩組。Grand 的 Startup%／Increment 兩組都是 0.65%／0.35%；Major 兩組都是 0.50%／0.50%。<\/li><li>Grand ＋ Major RTP ＝ Link RTP 2.00%。Increment 合計兩組都是 0.85%。<\/li><li>Major 的初始金額兩組都是 Grand 的五分之一。<\/li><li>新手的押注不分高低都會滾入 Increment，但新手不能中彩。<\/li><\/ul>\n<h3 id=\"16-bet-mode\">1.6 Bet Mode<\/h3>\n<ul><li>Bet Mode 分一般押注（NB）、Extra Bet（EB）、Buy Feature（BF）。<\/li><li>老手的押注層級只分 <strong class=\"nr\"><code>&lt; 0.4<\/code>／<code>&gt;= 0.4<\/code> 兩級<\/strong>（低注／高注）；新手不分層級。<\/li><li>NB／EB 以該模式的實際押注金額判定；Buy Feature 以 <strong>Feature 購買價格 ÷ Feature Price 倍數反推的基礎押注<\/strong>判定，不用購買總價。<\/li><li>Buy Feature 單次購買的實付金額上限 <code class=\"nr\">$30,000<\/code>；超過的押注不開放、玩家端不顯示（<a href=\"#\" class=\"nl tab-link\" data-tab=\"系統機制\">系統機制<\/a>第 4 節）。超過上限的押注在數學文件裡已有的參數保留，沒有的不必補做。<\/li><li>新手單把上限 100×，只適用 NB 與 EB；其他倍率上限依<a href=\"#\" class=\"tab-link\" data-tab=\"系統機制\">系統機制<\/a>的系統最大賠付（<code class=\"nl nr\">$3,000,000<\/code>）反推。<\/li><\/ul>\n<h3 id=\"17-後端權重表的數值格式\">1.7 後端權重表的數值格式<\/h3>\n<ul><li>本節只管<strong class=\"nr\">後端會使用的權重表<\/strong>：後端或遊戲程式抽獎時讀進去的權重，例如輪帶或圖標的權重、彩金權重、輪盤權重（使用者 2026-11-16 指示）。<\/li><li>權重表內<strong class=\"nr\">不得出現負數或小數<\/strong>，每一個權重都必須是<strong class=\"nr\">精確的整數<\/strong>。由公式算出的值要在公式內用 <code>ROUND(…, 0)<\/code> 取整，不得留下浮點誤差（例如 <code class=\"nr\">7499999.999999998<\/code>）。判定方式是儲存格實際存的值與它四捨五入後的值完全相等，不是畫面上看起來是整數。<\/li><li>權重不得用機率（0～1 的小數）的形式填寫，要寫成整數權重。<\/li><li>下列不是後端權重，不適用本節：押注與 Denom、以百分比表示的 RTP 與彩金參數、賠率與倍數、輪帶上的圖標編號與標記、用來推算權重的設計輸入（目標機率、放大倍率）、統計與驗算用的輸出格。設計輸入可以是小數，但由它算出來給後端讀的權重仍須在公式內取整。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-現有數學文件與本規範的差距-2\">2. 現有數學文件與本規範的差距<\/h2>\n<p>2026-11-11 已把滿意發與龍來發一般押注的 Bonus＋Game 由菲律賓版的 94.65%／95.5%／93.5% 調到本規範的目標值；金來發於 2026-11-17 轉換，它的菲律賓值是 50 萬組 93.65%／94.5%／92.5%、10 萬組 95.15%／96.0%／94.0%。下表是調整後檔內的值（Excel 重算結果，未重新模擬）。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>遊戲<\/th><th>現值<\/th><th>與第 1.4 節的差距<\/th><th>調整方式<\/th><\/tr><\/thead><tbody><tr><td>H0071／H0081 一般押注<\/td><td>Bonus＋Game：新手 95.15%、老手無彩金 96.5%、老手有彩金 94.5%<\/td><td>相符<\/td><td>改目標值後重解 Hold &amp; Spin 的 Minor 權重；Grand、Major 的命中率不變。Mini 權重是 Minor 的 6 倍（H0081 為 8 倍）公式，跟著同幅度增加<\/td><\/tr><tr><td>H0071／H0081 Buy Feature<\/td><td>新手 95.65%、老手無彩金 96.5%、老手有彩金 94.5%<\/td><td>相符<\/td><td>未調整<\/td><\/tr><tr><td>H0091／H0101 一般押注<\/td><td>Game 83%（主遊戲＋Hold &amp; Spin）＋彩金檔的固定倍數獎：新手 12.15%、老手無彩金 13.5%、老手有彩金 11.5%，合計 95.15%／96.5%／94.5%<\/td><td>相符<\/td><td>差額加在彩金檔固定獎的 Minor RTP（新手 +0.5、老手 +1.0 個百分點）；數學檔不變<\/td><\/tr><tr><td>H0091／H0101 Buy Feature<\/td><td>87.5% ＋彩金檔固定獎，老手合計 96.5%／94.5%，新手 95.65%<\/td><td>相符<\/td><td>未調整<\/td><\/tr><tr><td>H5011／H5021（金來發）一般押注<\/td>< d › AL4:AL5<\/code> 兩格要改，數值不變。<\/li><li>H5021 的 10 萬組老手有彩金 Buy Feature 的 Mini 權重：菲律賓 10 萬組在倍數 1500、3000、5000 有逐級調低，第十二輪換用 50 萬組的檔後變成固定值，已改回「共同倍數沿用菲律賓同倍數的值、新倍數 2000／2500 內插」，Minor 重算，Bonus＋Game 仍是 94.5%。<\/li><li>交付表的編排恢復：H5021 的 <code>JP_parsheet_WTI02／04／06_BF › Parameter - Hit rate<\/code> 恢復成菲律賓版的 33 列（前 6 個倍數之後，從第 4 個倍數起再列一次）；<code class=\"nl\">H5021 金來發設定.xlsx › 彩金相關設定<\/code> 的表格版面恢復成菲律賓原樣，只保留 <code>A1<\/code> 的墨西哥版說明。<\/li><\/ul><\/li><\/ul><\/li><li>後端權重表數值格式（第 1.7 節）的現況（2026-11-16 盤點並修正）：<ul><li>H0071／H0081：36 個檔 <code>Variable Weight<\/code> 工作表的 <code>JP Opt<\/code> 右側那一欄（H0071 是 CE 欄、H0081 是 DJ 欄）曾在公式加上取整（後來已還原，見本點最後），每檔 30 格，其中 12 格的值由小數變成整數（例如 <code>833333.33<\/code> 變 <code class=\"nr\">833333<\/code>）。這一欄是「Grand 起始獎額相當於幾倍總押注」（<code class=\"nl\">Jackpot Setting<\/code> 的 Start Up 金額 ÷ Denom ÷ 押注 ÷ 倍數），不是權重。部分檔用它與門檻比較來選輪帶或權重（H0071 與 1,000 比；H0081 與 66、150 比）；被改的格離門檻最近的是 166.67 變 167（門檻 150），所有引用格的結果在取整前後逐格相同，權重、機率與 RTP 都沒有變。這一欄不是後端權重，依第 1.7 節的適用範圍不必改，<strong class=\"nl nr\">已於 2026-11-16 依使用者指示從 <code>_墨西哥第八輪備份_20261116\\<\/code> 還原<\/strong>：36 個檔現在與改前版本逐檔相同，這一欄維持原本的小數；加了取整的版本另存在 <code class=\"nr\">_墨西哥第九輪備份_20261116\\<\/code>。<\/li><li>H0091／H0101：沒有改動。<code class=\"nl nr\">HS2_Reel_Weight<\/code>、<code class=\"nl\">HS2_UpReel_Weight<\/code> 的 <code class=\"nr\">True Prob.<\/code>（0.01～0.95）是設計時填的目標機率，不是後端權重；同一張表的 <code>Pay_Combo_1～4<\/code> 四欄才是權重，公式是 <code class=\"nr\">ROUND(圖標權重 × True Prob. ÷ Count, 0)<\/code>，值都是整數。<\/li><li>其餘含小數或負數的欄位都不是後端權重（使用者 2026-11-16 確認適用範圍），沒有改動；逐項是什麼列在轉換紀錄第 6 節第 10a 項。「後端實際讀哪一欄」是依工作表的公式結構判斷，沒有後端文件可以對照。<\/li><\/ul><\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"變更紀錄-4\">變更紀錄<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>日期<\/th><th>變更<\/th><th>依據<\/th><\/tr><\/thead><tbody><tr><td>2026-11-11<\/td><td>由 <code class=\"nr\">數學模型規範轉製.md<\/code>（菲律賓版）建立墨西哥轉製版<\/td><td>使用者指示<\/td><\/tr><tr><td>2026-11-11<\/td><td>押注表改為墨西哥 30 組倍數（0.2～1,000）、開啟 25 檔；移除不存在的來源 <code class=\"nr\">6.BetCurreny<\/code><\/td><td>使用者指示；四個 參數表不得有負數或小數，權重類須為精確的整數、不得有浮點誤差；第 2 節補上 H0071／H0081 的修正現況<\/td><td>使用者指示；例外清單是盤點時的認定，未經使用者逐條確認<\/td><\/tr><tr><td>2026-11-16<\/td><td>第 1.7 節的例外清單分成兩段：本規範自己規定為小數的值（押注、Denom、百分比參數）；本規範沒有規定、只是現有檔案寫法的三項（機率形式的權重、倍數區間、<code class=\"nl nr\">-1<\/code>／<code class=\"nl\">-2<\/code> 標記）改標為待裁決<\/td><td>使用者詢問例外清單是否根據規格；原始規範沒有數值格式的規定，後三項沒有規格依據<\/td><\/tr><tr><td>2026-11-16<\/td><td>第 1.7 節改名為「後端權重表的數值格式」，適用範圍由「參數表」縮為「後端會使用的權重表」；取消例外清單與待裁決項，改列「不是後端權重、不適用」的欄位；新增「權重不得用機率形式填寫」；第 2 節補上 <code>True Prob.<\/code> 的說明<\/td><td>使用者指示：押注、Denom、百分比參數、輪帶與標記都不是後端使用的權重表參數；理論上不應該有機率形式的權重<\/td><\/tr><tr><td>2026-11-16<\/td><td>第 2 節：H0071／H0081 輔助欄的取整已還原，36 個檔回到改前版本<\/td><td>使用者指示「從備份還原」；該欄不是後端權重<\/td><\/tr><tr><td>2026-11-16<\/td><td>彩金配置由三組改為兩組：Grand 100 萬組移除；Grand 10 萬組的 Major 改回 $20,000、Startup 0.50%／Increment 0.50%（平均開出金額 $40,000），該組 Increment 合計由 0.70% 回到 0.85%，新手 Link RTP 與新手 Buy Feature 合計不再隨組別不同<\/td><td>使用者指示（套用到全部墨西哥遊戲）：100 萬那組移除；10 萬那組改回 10 萬／2 萬，Startup、Increment 改回菲律賓 10 萬／2 萬那組的設定<\/td><\/tr><tr><td>2026-11-17<\/td><td>適用範圍加入 H5011、H5021（金來發）；第 2 節新增金來發的現值、調整方式與現況<\/td><td>使用者指示：H501、H502 轉成墨西哥規格；ID01 一般押注改用 ID02 的數學；改檔結果、獨立驗收與模擬驗證<\/td><\/tr><tr><td>2026-11-17<\/td><td>第 2 節金來發：補 0.5 個百分點的做法（Mini 略降、Minor 調高）由待確認改為已確認<\/td><td>使用者指示「保留」<\/td><\/tr><tr><td>2026-11-17<\/td><td>第 2 節金來發：補上 Mini 權重隨押注調低的原因；倍數 400 維持不調整<\/td><td>使用者說明與指示「400 維持不調整」<\/td><\/tr><tr><td>2026-11-17<\/td><td>第 1.6 節加入 Buy Feature 購買上限 <code>$30,000<\/code> 的引用<\/td><td>使用者指示（Buy Feature 購買上限 3 萬）<\/td><\/tr><tr><td>2026-11-18<\/td><td>第 2 節：金來發補上使用者確認的項目與當日修正（低注列邏輯、10 萬組購買 Mini 權重、33 列交付表、設定檔版面）；兩個既有模擬差異的原因；加上轉版指引的連結<\/td><td>使用者 2026-11-18 逐項確認與指示；兩個追查的 <code class=\"nr\">RESULT.md<\/code><\/td><\/tr><tr><td>2026-11-18<\/td><td>第 2 節開頭補上金來發的菲律賓 RTP（原句只適用滿意發與龍來發）<\/td><td>整理交付資料時的查核<\/td><\/tr><tr><td>2026-11-19<\/td><td>第 1.5.1 節：新手押注改為不分高低都滾 Increment（表中新手 <code>&lt; 0.4<\/code> 的「可滾 Inrc」由否改為是），第 1.4、1.5.2 節的相關句子同步改寫；第 2 節兩個模擬差異的前提改為已確認（龍來發實機救濟只給一次、滿意發實機用文件輪帶）<\/td><td>使用者 2026-11-19 確認：「新手押注都會累積獎池」「龍來發只給一次」「滿意發用文件輪帶」。新手滾 Increment 這一點是本專案自訂，與菲律賓版轉製規範第 1.5.1 節的表不同<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['guide', 'knowhow', '轉換紀錄', '轉版指引', '系統機制', '數學模型規範-主流-', '數學模型規範-轉製-'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 表格：最小寬＝不換行寬（上限 1000px）；第一欄一行放得下（≤ 表格 1/4 寬）就不換行，否則固定 1/4 寬並換行\n(function() {\n  function cap() {\n    document.querySelectorAll('table').forEach(function(t) {\n      var r = t.rows[0];\n      if (!r || !t.offsetWidth) return;\n      // 表格寬度不隨框變窄：最小寬＝整列不換行的寬（上限 TABLE_MAX），框放不下就左右拖曳\n      t.classList.remove('fc-cap'); t.style.minWidth = ''; t.classList.add('nw-measure');\n      var nw = Math.ceil(t.getBoundingClientRect().width) + 2, colMax = 0;\n      for (var c = 0; c < r.cells.length; c++) colMax = Math.max(colMax, r.cells[c].offsetWidth);\n      t.classList.remove('nw-measure');\n      // 全是短欄（每欄 ≤ 400px）→ 一律不換行、整張左右拖曳；有長文字欄 → 最小寬上限 1000px，長文字才換行\n      t.style.minWidth = (colMax <= 400 ? nw : Math.min(nw, 1000)) + 'px';\n      if (r.cells.length < 2) return;\n      var w = 0;\n      for (var i = 0; i < t.rows.length; i++) w = Math.max(w, t.rows[i].cells[0] ? t.rows[i].cells[0].offsetWidth : 0);\n      if (w > t.offsetWidth * 0.25) t.classList.add('fc-cap');\n    });\n  }\n  cap();\n  if (document.fonts && document.fonts.ready) document.fonts.ready.then(cap);\n  window.addEventListener('load', cap);\n  window.addEventListener('resize', cap);\n  document.addEventListener('click', function() { setTimeout(cap, 0); });\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script><script type="application/json" id="doc-mine">"<!DOCTYPE html>\n<html lang=\"zh-Hant\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>開發規範<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin p}\ntd.n,th.n{text-align:right; white-space:nowrap; font-family:var(--font-mono);\n  font-variant-numeric:tabular-nums; font-size:1em}\ntbody tr:last-child td{border-bottom:none}\ntbody tr:hover{background:var(--panel-2)}\nhr{border:none; border-top:1px solid var(--rule); margin:34px 0}\n.tune{color:var(--s4); font-weight:600; border-bottom:1.5px dashed var(--s4); padding:0 1px; white-space:nowrap}\n.tune code{color:inherit; background:none; border:none; padding:0; font-size:inherit}\n/* 特殊標記（粗體、可調參數、行內程式碼、連結）前後各留約一格，與中文字拉開 */\n:is(p,li,td,th,.step-desc,.step-title,.branch) :is(strong,.tune,code,a,mark){margin:0 .3em}\n:is(strong,.tune,a) :is(strong,.tune,code){margin:0}\n:is(strong,.tune,code,a,mark).nl{margin-left:0}\n:is(strong,.tune,code,a,mark).nr{margin-right:0}\n.tl-wrap{overflow-x:auto; margin:6px 0 18px; border:1px solid var(--rule); border-radius:3px; background:var(--panel); padding:14px 22px 8px 14px}\n.tl{min-width:760px; display:flex; flex-direction:column; gap:4px}\n.tl-row{display:grid; grid-template-columns:6em 1fr; align-items:start}\n.tl-lane{font-size:1em; font-weight:600; color:var(--ink-2); padding-top:5px}\n.tl-axis-name{color:var(--ink-3); font-weight:500; padding-top:2px}\n.tl-track{position:relative; height:78px; border-bottom:1px dashed var(--grid)}\n.tl-track.short{height:36px}\n.tl-bar{position:absolute; top:4px; height:26px; border-radius:3px; font-size:1em; line-height:26px;\n  text-align:center; white-space:nowrap; overflow:hidden}\n.tl-bar.phase{background:color-mix(in srgb,var(--s1) 18%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.phase2{background:color-mix(in srgb,var(--s3) 20%,transparent); color:var(--ink); font-weight:600}\n.tl-bar.stop{background:var(--panel-2); color:var(--ink-3); border:1px dashed var(--rule); line-height:22px}\n.tl-lane{padding-top:44px}\n.tl-row:has(.tl-track.short) .tl-lane{padding-top:5px}\n.tl-lane.tl-axis-name{padding-top:2px}\n.tl-band{position:absolute; top:46px; height:18px; border-radius:3px; background:color-mix(in srgb,var(--c) 16%,transparent)}\n.tl-bar.event{background:var(--c); height:14px; top:48px; border-radius:2px}\n.tl-label{position:absolute; top:2px; font-size:.95em; font-weight:600; line-height:1.25; color:var(--c); white-space:nowrap}\n.tl-range{display:block; font-family:var(--font-mono); font-size:.85em; font-weight:500; color:var(--ink-2)}\n.tl-guide{position:absolute; top:64px; border-left:1px dashed var(--c); opacity:.7; pointer-events:none}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-axis.dense{height:40px}\n.tl-axis.dense .tl-tick{font-size:.78em}\n.tl-axis.dense .tl-tick:nth-child(even){top:15px}\n.tl-axis.dense .tl-tick:nth-child(even)::before{height:20px; top:-16px}\n.tl-periods{height:30px; border-bottom:none}\n.tl-period{position:absolute; top:2px; height:24px; line-height:24px; text-align:center; font-weight:600; font-size:.95em; color:var(--c);\n  background:color-mix(in srgb,var(--c) 16%,transparent); border:1.5px solid var(--c); border-radius:3px; box-sizing:border-box}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:va
