\">{GameID}_Math Document Description_ZH.docx<\/code>，兩版內容須同步。<\/li><li>送驗一律用英文版：複製進 <code>{GameID}/<\/code> 送驗資料夾時改名為 <code class=\"nr\">{GameID}_Math Document Description.docx<\/code>（去掉 <code class=\"nr\">_EN<\/code>），並列入 SHA1 清單；中文版不送驗。<\/li><li>2026-11-04 起適用。既有遊戲的 md 版（H026、H027、H028）維持不動，下次送驗時再轉成 DOCX 兩版。<\/li><\/ul>\n<h4 id=\"232-內容要求\">2.3.2 內容要求<\/h4>\n<ul><li>開頭為基本資訊表：Game ID、Math files、Version、對應程式（Simulator／Config）、盤面、線數／得分方式、Coin In、押注模式。<\/li><li>四大章：①工作表說明（每張工作表標明程式是否讀取）②Parameter 工作表的遊戲參數說明 ③遊戲邏輯（spin 流程、判獎、Cascade、FG）④卡片系統說明。<\/li><li>公式／變數名稱：必須定義 <code class=\"nr\">Ptheory<\/code>、<code class=\"nl nr\">Pscatter<\/code>、<code class=\"nl nr\">Phit<\/code>；<code class=\"nl\">Phit<\/code> 公式必須使用 <code class=\"nr\">Pscatter<\/code>（不得寫成 <code class=\"nr\">Prespin<\/code>、<code class=\"nl\">Presipn<\/code> 或其他變體）。<\/li><li>建議附上 Total RTP、Window Size、Denom 等欄位的實際數值。<\/li><li>禁止內容同 1.3。<\/li><\/ul>\n<h3 id=\"24-game-description\">2.4 Game Description<\/h3>\n<p>送驗用的 Game Description 以<a href=\"#\" class=\"tab-link\" data-tab=\"docs\" data-anchor=\"22-docx-完整版\">數學文件規範.md<\/a>的完整版為基礎，移除 1.3 禁止項目（Extra Bet／Buy Feature／Super Feature 與 &gt;$2 門檻相關章節與敘述）後產出；除刪減處外必須與完整版完全一致。<\/p>\n<h4 id=\"241-格式來源複製已核准模板\">2.4.1 格式來源：複製已核准模板<\/h4>\n<p>格式（字型、字級、邊界、標題與表格樣式）一律<strong class=\"nr\">複製既有已核准的 Game Description 文件<\/strong>，不重新自建格式——公司對格式的核准是一次性的，自行重建有偏離已核准樣式的風險。<\/p>\n<p>已知兩種版型，依模板實際版面選擇：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>版型<\/th><th>特徵<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td>A：純段落<\/td><td>每行規則為一般未條列段落<\/td><td>一般範例（<code class=\"nl nr\">H000_範例<\/code>）<\/td><\/tr><tr><td>B：■ 條列＋框線賠率表<\/td><td>每行規則前有 ■（Word 編號清單），賠率表在框線表格內<\/td><td>BMM 送驗版常用<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>選模板時避免內嵌整頁背景圖或遊戲 Logo 的文件，否則舊遊戲的美術會帶進新文件。<\/li><li>版型判斷以模板實際內容為準，不假設所有模板結構相同。<\/li><\/ul>\n<h4 id=\"242-內容來源help-英文欄逐字填寫\">2.4.2 內容來源：Help 英文欄逐字填寫<\/h4>\n<ul><li>內容以該遊戲的 <code>{GameID}_Help.xlsx<\/code> 或 <code>game_help.md<\/code> 的<strong class=\"nr\">英文欄逐字填寫<\/strong>，不得改寫、摘要或自創文字——Help 是已核准的規則措辭唯一來源，改寫會製造兩份互相矛盾的文件。<\/li><li><strong class=\"nl nr\">一律使用英文欄<\/strong>：簡中欄曾出現英文欄沒有的錯字（例如符號誤標 <code class=\"nr\">[M4]<\/code>，英文欄正確為 <code class=\"nr\">[M5]<\/code>）。<\/li><li>去除行首手動 bullet 字元（<code class=\"nl nr\">▪<\/code>／<code class=\"nl nr\">•<\/code>）；版型 B 的 ■ 來自模板的清單樣式，不是文字本身。<\/li><li>佔位符（<code class=\"nl nr\">[WW]<\/code>、<code class=\"nl nr\">[C1]<\/code>、<code class=\"nl nr\">{12}<\/code>、<code class=\"nl\">X2<\/code> 等）原樣保留；<code class=\"nl\">{n}<\/code> 花括號要嘛全篇保留、要嘛全篇展開為實際數字，不得混用。<\/li><li>保持 Help 的章節順序，不重排、不遺漏；純圖片佔位列（<code class=\"nl nr\">[走線圖 ...]<\/code>、<code class=\"nl nr\">[跳階示意圖]<\/code>）跳過。<\/li><li>Help 的章節外層標籤對應輸出的 Heading 2；注意慣例差異（Help 寫 <code class=\"nr\">GAME RULE<\/code>，文件慣例為 <code class=\"nr\">GAME RULES<\/code>），依既有文件慣例為準，不盲抄。<\/li><\/ul>\n<h4 id=\"243-結構\">2.4.3 結構<\/h4>\n<ul><li><strong class=\"nl nr\">不放圖片<\/strong>：Game Description 內一律不放任何圖片（符號圖、盤面圖、走線圖、示意圖）；需要舉例時，符號一律用代號文字表示（<code class=\"nl nr\">M1<\/code>、<code class=\"nl nr\">M2<\/code>…），不用圖片。<\/li><li>Title 樣式段落「GAME DESCRIPTION」＋置中一般樣式段落放遊戲英文名。<\/li><li>每個 feature／規則章節一個 Heading 2（PAYTABLE、CASCADING FEATURE、MULTIPLIER FEATURE、FREE GAME FEATURE、OP JACKPOT、GAME RULES 等，依遊戲實際內容）。<\/li><li>副標籤（<code class=\"nl nr\">WILD SYMBOL<\/code>、<code class=\"nl\">SCATTER SYMBOL<\/code> 等）使用一般段落樣式，不自創粗體或 Heading 3 樣式。<\/li><li>賠率表為 3 欄表格，每個 payout tier 一列。<\/li><\/ul>\n<h4 id=\"244-交付前驗證\">2.4.4 交付前驗證<\/h4>\n<ul><li>重新解析輸出文件（逐段樣式＋文字、逐表格列），確認：Help 的每個章節都已進入文件、賠率表列數與 Help 的 payout tier 數一致、無殘留 placeholder（<code class=\"nl nr\">__TABLE__<\/code>、<code class=\"nl nr\">None<\/code>、空 run）。<\/li><li>執行 1.3 禁止內容檢查與 1.4 用詞一致性檢查，並確認除刪減處外與完整版完全一致。<\/li><\/ul>\n<h4 id=\"245-有彩金遊戲的-no-progressive-版\">2.4.5 有彩金遊戲的 No Progressive 版<\/h4>\n<ul><li><strong class=\"nl nr\">適用<\/strong>：使用非 OP Jackpot 彩金的遊戲，都要出兩份 Game Description。使用 OP Jackpot 的遊戲只出一份。<\/li><li><strong class=\"nl nr\">檔名<\/strong>：含彩金版為 <code class=\"nr\">{GameID}_Game Description.docx<\/code>，無彩金版為 <code class=\"nr\">{GameID}_Game Description_No Progressive.docx<\/code>。一律使用 <code class=\"nr\">No Progressive<\/code>，不得使用 <code>No Link<\/code> 或其他寫法。<\/li><li><strong class=\"nl nr\">No Progressive 版的內容<\/strong>：移除彩金相關的章節與敘述（Progressive／Jackpot／Link 的規則、觸發條件、獎項與 RTP），其餘內容與含彩金版逐字相同。<\/li><li>兩份都依 2.4.1～2.4.4 製作與驗證，並都列入 SHA1 清單。<\/li><\/ul>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"3-檢查清單送驗前\">3. 檢查清單（送驗前）<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">對外文件/數值文件/<\/code> 送驗包已依 1.1 的格式建立（內含 <code class=\"nr\">{GameID}.zip<\/code>，zip 頂層為 <code class=\"nr\">{GameID}/<\/code>）：Game Description（送驗版）、<code class=\"nl nr\">{GameID}_Math Document Description.docx<\/code>、<code class=\"nl nr\">{GameID}_SHA1.txt<\/code>、<code class=\"nl nr\">PARsheet/*.xlsx<\/code>（數學模型送驗版）、<code class=\"nl\">Simulator/<\/code> 均存在，檔名前綴與 Game ID 一致；所有檔案都在同一個 zip 內。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Description 除 1.3 刪減處外與完整版完全一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 使用非 OP 彩金的遊戲已附 <code>_No Progressive<\/code> 版，且除彩金章節外與含彩金版逐字相同。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 數學模型送驗版已自 <code>Source/*.xlsx<\/code> 移除 1.3 禁止項目，其餘數學內容與正式數學模型一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game ID、中英文名稱與 <code>iGaming 遊戲代號一覽<\/code> 一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 三份文件皆無 1.3 的禁止內容。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 送驗包 <code class=\"nr\">Simulator.py<\/code>／<code class=\"nl\">config*.js<\/code> 無 1.3 禁止內容，且與完整版 Simulator 同 seed 的 Normal Bet 輸出逐項相同。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Description 的格式來自已核准模板，內容與 Help 英文欄逐字一致、章節順序一致、無殘留 placeholder。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Math Document Description 已含四大章與基本資訊表；<code class=\"nl\">Phit<\/code> 公式使用 <code class=\"nr\">Pscatter<\/code>，無變數錯字。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 數學模型送驗版的 Overview 必要欄位齊全；檔名含 ParSheet ID。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 數學模型送驗版的 RTP 版本檔保留 <code class=\"nr\">Avg_Multi<\/code>、<code class=\"nl\">Nature_Prob<\/code> 工作表（只含送驗欄位），且 <code>Σ 權重 × 平均倍率<\/code> 與 Overview 的 BG／FG 一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game Description ↔ 數學模型送驗版賠率逐符號一致；多份 RTP 版本間一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 文件內部、跨文件、中英對照的用詞一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 送驗文件版本與數學模型、Config、Simulator 的正式版本相同。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">{GameID}_SHA1.txt<\/code> 已於打包前重產、無重複雜湊，且已打包進 zip；檔案為二進位複製、未重存。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-script\" hidden><div class=\"sec-head\"><h1 id=\"腳本規範\">腳本規範<\/h1><p class=\"updated\">最後更新：2026-11-09<\/p>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 _README.md。<\/p>\n<p>內容涵蓋：表演腳本（預錄結果腳本）的用途、清單結構、格式欄位、挑選規則、權重整合與交付檢查。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-用途與定位\">1. 用途與定位<\/h2>\n<p>表演腳本是<strong class=\"nr\">預先錄製的 RNG 序列與固定結果<\/strong>，供前端在特定情境直接重放，用於新手體驗、Buy Feature 展示與 Free Spin 系統等。<\/p>\n<ul><li>腳本只影響「被挑中的那幾局」的表演結果，<strong class=\"nl nr\">不改變真實遊戲的數學模型、Config 與派彩公式<\/strong>。<\/li><li>每支腳本的 RNG 序列必須能在該遊戲的正式輪帶／掉落設定下重放出相同結果；輪帶或掉落權重改版時，必須驗證既有腳本仍可重放，否則重錄。<\/li><li>腳本表以遊戲為單位維護（每款一張，依 RTP 版型分組），欄位格式見第 3 節。<\/li><li>腳本表檔名一律 <code class=\"nr\">&lt;GameID&gt;_腳本規格.xlsx<\/code>，放在遊戲專案的 <code class=\"nr\">對外文件/<\/code>（例：<code class=\"nl nr\">Slots/H045_超級鑽石/對外文件/101015_腳本規格.xlsx<\/code>；2026-10-28）。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-腳本清單結構\">2. 腳本清單結構<\/h2>\n<p>依遊戲實際支援的押注模式建立；遊戲不支援的模式不得出現對應腳本。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類別<\/th><th>腳本<\/th><th>支數<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td><code class=\"nl nr\">NB Free Game A／B<\/code><\/td><td>2<\/td><td>觸發 FG 的完整表演，固定總倍率<\/td><\/tr><tr><td>新手體驗<\/td><td><code class=\"nl nr\">NB Jackpot Game A／B<\/code><\/td><td>2<\/td><td>OP Jackpot 小遊戲體驗，固定總倍率<\/td><\/tr><tr><td>新手體驗<\/td><td>其他押注模式（EB 等）之 Free Game／Jackpot Game A／B<\/td><td>依支援<\/td><td>遊戲支援該模式才建立<\/td><\/tr><tr><td>Buy Feature<\/td><td><code class=\"nl nr\">BF A1～A3<\/code>、<code class=\"nl nr\">BF B1～B3<\/code><\/td><td>每版型 3<\/td><td>高／中／低 RTP 三檔＋抽選權重（見 4.2）<\/td><\/tr><tr><td>Free Spin 系統<\/td><td><code class=\"nl\">0-1x 腳本<\/code>＋<code class=\"nr\">9x 腳本 ×10<\/code><\/td><td>11<\/td><td>新手 NB 免費遊戲系統（見 4.3）<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"3-格式欄位\">3. 格式欄位<\/h2>\n<p>每支腳本一列，欄位固定：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>內容<\/th><\/tr><\/thead><tbody><tr><td>腳本名稱<\/td><td>類別＋模式＋編號（例：<code class=\"nl nr\">Buy Feature A2<\/code>）<\/td><\/tr><tr><td>RNG<\/td><td>預錄的 RNG 序列（逗號分隔）<\/td><\/tr><tr><td>Multi<\/td><td>該腳本的總得分倍率（以該模式單注為底）<\/td><\/tr><tr><td>RTP<\/td><td><code class=\"nl nr\">Multi ÷ 押注 × 100%<\/code><\/td><\/tr><tr><td>抽選權重<\/td><td>同組腳本間的抽選權重<\/td><\/tr><tr><td>押注<\/td><td>該模式的成本倍數（NB＝1、BF＝購買價倍數）<\/td><\/tr><\/tbody><\/table><\/div>\n<\/div><div class=\"sec-card\"><h2 id=\"4-挑選規則\">4. 挑選規則<\/h2>\n<h3 id=\"41-新手體驗\">4.1 新手體驗<\/h3>\n<ul><li>每支權重＝1、押注＝1；同名 A／B 兩支等權重擇一。<\/li><li>總倍率為體驗設計值，製作前與使用者確認（參考值：Free Game 12x、Jackpot Game 10x）。<\/li><\/ul>\n<h3 id=\"42-buy-feature\">4.2 Buy Feature<\/h3>\n<ul><li>每個版型三支：高／中／低 RTP 各一，另配抽選權重；押注＝Buy Feature 價格倍數。<\/li><li><strong class=\"nl nr\">加權整合必須等於該遊戲 BF 的 RTP<\/strong>：<code class=\"nl nr\">Σ(RTP × 權重) ÷ Σ(權重) = BF RTP<\/code>。BF RTP 取該遊戲數學模型規範的 BF／SF RTP 配置（有多個 RTP 版本時依版本）。<\/li><li>三檔 RTP 先定，權重由上式解出並整數化；解出後驗算到小數 2 位精確。<\/li><li>參考例（前作 92 版，當時 BF RTP 目標 96.00%）：105.67%×800＋88.80%×200＋81.53%×435 → 加權 96.00%。<\/li><\/ul>\n<h3 id=\"43-free-spin-系統\">4.3 Free Spin 系統<\/h3>\n<ul><li>適用新手 NB 的免費遊戲段（一段 10 把）。<\/li><li>挑法：10 把中<strong class=\"nr\">挑一把跑 <code>0-1x<\/code> 腳本、挑一把跑 <code>9x<\/code> 腳本<\/strong>，其餘各把不中獎。<\/li><li><code class=\"nl\">9x<\/code> 腳本固定 <strong class=\"nr\">10 支<\/strong>，<strong class=\"nl nr\">抽選權重鎖死全部＝1<\/strong>（等權重擇一），不得調整。<\/li><li>整段合計約 10x（參考值：0-1x＝44%＋9x＝955.56% → 999.56%）。<\/li><\/ul>\n<h3 id=\"44-版型與共用\">4.4 版型與共用<\/h3>\n<ul><li>腳本表依 RTP 版型分組（例：92 版一張）；同一支 RNG 序列若在多個 RTP 版可重放出相同結果，可跨版共用並註記。<\/li><li>大額投注使用獨立模型（<code class=\"nl nr\">_Bet100<\/code>）的遊戲：腳本倍率不得超過該模型的倍率上限（例：大 Bet BG／FG 上限 1,000x）。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"5-製作前確認\">5. 製作前確認<\/h2>\n<ol><li>新手體驗涵蓋哪些押注模式（NB 以外是否含 EB／BF 體驗）。<\/li><li>各體驗腳本的目標倍率（Free Game／Jackpot Game）。<\/li><li>腳本表做哪些 RTP 版型、是否跨版共用。<\/li><li>Buy Feature 三檔 RTP 的目標值（權重由「加權＝BF RTP」約束解出）。<\/li><\/ol>\n<\/div><div class=\"sec-card\"><h2 id=\"6-交付檢查\">6. 交付檢查<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本表檔名為 <code class=\"nr\">&lt;GameID&gt;_腳本規格.xlsx<\/code>，放在 <code class=\"nr\">對外文件/<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本清單依第 2 節結構建立，未支援的模式沒有腳本。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每支 RNG 序列已在正式 Config 下重放驗證，結果與表列 Multi 一致。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Buy Feature 各版型加權整合＝該遊戲 BF RTP（小數 2 位精確）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Free Spin 系統：<code class=\"nl\">9x<\/code> 腳本 10 支、權重全部＝1；0-1x 與 9x 各佔一把、其餘不中獎。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 腳本倍率未超出該模式（含 <code>_Bet100<\/code> 模型）的倍率上限。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 輪帶／掉落改版後已重新驗證重放（或重錄）。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"7-範例h028-雷神爆金1000101016\">7. 範例：H028 雷神爆金1000（101016）<\/h2>\n<p>支援 NB＋BF（無 Extra Bet），FG 觸發＝4 SC＝10 把：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>類別<\/th><th>腳本<\/th><th>支數<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>NB Free Game A／B、NB Jackpot Game A／B<\/td><td>4<\/td><\/tr><tr><td>Buy Feature<\/td><td>BF A1～A3＋權重、BF B1～B3＋權重（押注 75；加權＝當時 BF RTP 96.00%）<\/td><td>6<\/td><\/tr><tr><td>Free Spin 系統<\/td><td>0-1x ×1＋9x ×10（權重全鎖 1）<\/td><td>11<\/td><\/tr><tr><td>合計<\/td><td><\/td><td><strong class=\"nl nr\">21<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>無 Extra Bet，故不建立 EB 系列腳本；FG 觸發 10 把與 Free Spin 系統的「10 把挑法」一致。<\/p><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-stress\" hidden><div class=\"sec-head\"><h1 id=\"壓測說明書\">壓測說明書<\/h1><p class=\"updated\">最後更新：2026-11-17<\/p>\n<p>這份文件回答兩個問題：<strong class=\"nl nr\">要壓什麼<\/strong>，以及<strong class=\"nr\">壓出來的數字怎麼判<\/strong>。<\/p>\n<p>設定來源為 <a href=\"#\" class=\"tab-link\" data-tab=\"math\" data-anchor=\"15-rtp-配置\">數學模型規範<\/a> 第 1.5 節與 <a href=\"#\" class=\"nr tab-link\" data-tab=\"mechanism\">機制說明.md<\/a>；本文件不重複定義設定本身。<\/p>\n<p>目前採用的機制版本：<strong class=\"nl nr\">新手體驗 D 版<\/strong>、<strong class=\"nl nr\">老手救援 B 版<\/strong>。<\/p>\n<p>壓測與其他驗證工具的分工：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>工具<\/th><th>產出<\/th><th>驗證對象<\/th><\/tr><\/thead><tbody><tr><td>數學模型 XLSX<\/td><td>理論 RTP、倍率權重<\/td><td>模型本身的理論值<\/td><\/tr><tr><td>Simulator<\/td><td>單一 Config／Bet Mode／Profile 的大場次報表<\/td><td>單一組合的 Game RTP、Feature 觸發率、Card System<\/td><\/tr><tr><td><strong class=\"nl nr\">壓測<\/strong><\/td><td>固定玩家數 × 固定把數的後端報表<\/td><td><strong class=\"nl nr\">玩家實際歷程下的 RTP<\/strong>，含新老手切換與機制介入<\/td><\/tr><tr><td><code class=\"nl nr\">System/整體/simulator/simulator_system.py<\/code><\/td><td>多分頁玩家模擬報表<\/td><td>機制本身的觸發率、Pool 上限、RTP 增量<\/td><\/tr><\/tbody><\/table><\/div>\n<p>關鍵差異：Simulator 每批固定一個 Profile，壓測則是<strong class=\"nr\">同一位玩家從第 1 轉跑到第 N 轉<\/strong>，中途由新手期切到老手期，並且會被新手體驗與老手救援介入。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"1-要壓什麼必跑組合\">1. 要壓什麼？（必跑組合）<\/h2>\n<h3 id=\"11-壓測把數影響\">1.1 壓測把數影響<\/h3>\n<p>壓測以「玩家數 × 每位玩家把數」定義。範例：20,000 位玩家 × 每人 500 把 = 10,000,000 spins。<\/p>\n<p>每人把數決定機制能不能驗到：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>生效轉數<\/th><th class=\"n\">需要的最少把數<\/th><\/tr><\/thead><tbody><tr><td>新手體驗 D 第一次判定<\/td><td>第 50 轉<\/td><td class=\"n\">50<\/td><\/tr><tr><td>新手體驗 D 第二次判定<\/td><td>第 150 轉<\/td><td class=\"n\">150<\/td><\/tr><tr><td>老手救援 B 起始<\/td><td>第 301 轉（新手期 200 ＋ 計算基底 100）<\/td><td class=\"n\">301<\/td><\/tr><tr><td>老手救援 B 第 1 個完整返還區間<\/td><td>301～450<\/td><td class=\"n\"><strong class=\"nl nr\">450<\/strong><\/td><\/tr><tr><td>老手救援 B 第 2 個完整返還區間<\/td><td>451～600<\/td><td class=\"n\"><strong class=\"nl nr\">600<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-押注分級與換算\">1.2 押注分級與換算<\/h3>\n<pre><code>實際押注 = Coin in × currency denom<\/code><\/pre>\n<p><code class=\"nl\">currency denom<\/code> 直接寫在報表檔頭，不必另外查。目前平台值為 <code class=\"nr\">0.002000<\/code>，即 <code class=\"nr\">實際押注 = Coin in ÷ 500<\/code>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>分級<\/th><th>判定依據<\/th><th>Game RTP 版本<\/th><th class=\"n\">可拉 Link<\/th><th>上限倍數<\/th><\/tr><\/thead><tbody><tr><td>小 Bet<\/td><td><code class=\"nl nr\">&lt; $2<\/code><\/td><td>94 版<\/td><td class=\"n\">✗<\/td><td>依數學文件「倍率線型」<\/td><\/tr><tr><td>中 Bet<\/td><td><code class=\"nl nr\">$2 ~ $100<\/code><\/td><td>92 版<\/td><td class=\"n\">✓<\/td><td>依數學文件「倍率線型」<\/td><\/tr><tr><td>大 Bet<\/td><td><code class=\"nl nr\">&gt; $100<\/code>（預設，各遊戲可不同）<\/td><td>92 版<\/td><td class=\"n\">✓<\/td><td>依數學文件「倍率線型」<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>一般模式（NB／EX1／EX2）：<code class=\"nl\">$2<\/code> 界線用<strong class=\"nr\">實際押注<\/strong>、<code class=\"nl\">$100<\/code> 界線用<strong class=\"nr\">基礎面額<\/strong>（實際押注 ÷ 模式倍率；對齊 SPS <code class=\"nr\">isHighBet()<\/code>，2026-10-27）。<\/li><li>BF／SF 用<strong>基礎面額<\/strong>分級，界線放大為 <code>倍率 × $2<\/code> 與 <code class=\"nr\">倍率 × $100<\/code>（等價於用面額判 <code class=\"nr\">$2<\/code>／<code class=\"nl nr\">$100<\/code>）。<ul><\/ul><\/li><\/ul>\n<h3 id=\"13-測項產生規則\">1.3 測項產生規則<\/h3>\n<p>先取得該遊戲支援的押注模式（<code class=\"nl nr\">NB<\/code>／<code class=\"nl nr\">EX1<\/code>／<code class=\"nl nr\">EX2<\/code>／<code class=\"nl nr\">BF<\/code>／<code class=\"nl nr\">SF<\/code>）與各模式的押注倍率。不支援的模式整組跳過。<\/p>\n<p>每個支援的模式產生「小／中／大押注 × 新手／老手」共六格測項，再套一條排除規則：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>排除規則<\/th><th>適用<\/th><th>原因<\/th><\/tr><\/thead><tbody><tr><td>倍率 <code>≥ 2<\/code> 時不產生<strong class=\"nr\">小押注<\/strong><\/td><td>NB／EX1／EX2<\/td><td>Extra Bet 最低成本已是 $2，不可能落在小 Bet<\/td><\/tr><\/tbody><\/table><\/div>\n<p>BF／SF 不套用上述排除，六格全跑。<\/p>\n<h3 id=\"14-實例h026\">1.4 實例：H026<\/h3>\n<p>H026 支援的模式與倍率：<code class=\"nl nr\">NB = 1<\/code>、<code class=\"nl nr\">EX1 = 2<\/code>、<code class=\"nl nr\">BF = 75<\/code>；<code class=\"nl nr\">EX2<\/code>、<code class=\"nl\">SF<\/code> 不支援。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">#<\/th><th>模式<\/th><th>級距<\/th><th>新老手<\/th><th>押注範圍<\/th><th class=\"n\">目標 Game RTP<\/th><\/tr><\/thead><tbody><tr><td class=\"n\">1<\/td><td>NB<\/td><td>小押注<\/td><td>新手<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">2<\/td><td>NB<\/td><td>小押注<\/td><td>老手<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">94%<\/td><\/tr><tr><td class=\"n\">3<\/td><td>NB<\/td><td>中押注<\/td><td>新手<\/td><td><code class=\"nl nr\">2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">4<\/td><td>NB<\/td><td>中押注<\/td><td>老手<\/td><td><code class=\"nl nr\">2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">5<\/td><td>NB<\/td><td>大押注<\/td><td>新手<\/td><td><code class=\"nl nr\">100 &lt; x<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">6<\/td><td>NB<\/td><td>大押注<\/td><td>老手<\/td><td><code class=\"nl nr\">100 &lt; x<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">7<\/td><td>EX1<\/td><td>中押注<\/td><td>新手<\/td><td><code class=\"nl nr\">2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">8<\/td><td>EX1<\/td><td>中押注<\/td><td>老手<\/td><td><code class=\"nl nr\">2 ≤ x ≤ 100<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">9<\/td><td>EX1<\/td><td>大押注<\/td><td>新手<\/td><td><code class=\"nl nr\">100 &lt; x<\/code><\/td><td class=\"n\">93%<\/td><\/tr><tr><td class=\"n\">10<\/td><td>EX1<\/td><td>大押注<\/td><td>老手<\/td><td><code class=\"nl nr\">100 &lt; x<\/code><\/td><td class=\"n\">92%<\/td><\/tr><tr><td class=\"n\">11<\/td><td>BF<\/td><td>小押注<\/td><td>新手<\/td><td><code class=\"nl nr\">x &lt; 150<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">12<\/td><td>BF<\/td><td>小押注<\/td><td>老手<\/td><td><code class=\"nl nr\">x &lt; 150<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">13<\/td><td>BF<\/td><td>中押注<\/td><td>新手<\/td><td><code class=\"nl nr\">150 ≤ x ≤ 7500<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">14<\/td><td>BF<\/td><td>中押注<\/td><td>老手<\/td><td><code class=\"nl nr\">150 ≤ x ≤ 7500<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">15<\/td><td>BF<\/td><td>大押注<\/td><td>新手<\/td><td><code class=\"nl nr\">7500 &lt; x<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><tr><td class=\"n\">16<\/td><td>BF<\/td><td>大押注<\/td><td>老手<\/td><td><code class=\"nl nr\">7500 &lt; x<\/code><\/td><td class=\"n\">92.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EX1 小押注被排除（倍率 2 ≥ 2）；其餘支援的級距皆同時產生新手與老手測項。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"2-壓測報表\">2. 壓測報表<\/h2>\n<h3 id=\"21-tg-訊息\">2.1 TG 訊息<\/h3>\n<p><strong class=\"nl nr\">Formal RTP Report<\/strong><\/p>\n<p>壓測的主要判定對象是 TG 訊息中的 <code class=\"nr\">Formal RTP Report<\/code>。訊息結構如下：<\/p>\n<pre><code>Formal RTP Report\nReport ID: &lt;報表編號&gt;\nGenerated At: &lt;產生時間&gt;\n- machineType = &lt;Game ID&gt;\n- extraBet = &lt;BetType&gt;\n- Bet = &lt;實際押注&gt;\n- OldHand Init = &lt;enabled | disabled&gt;\n\nScenario RTP\n整體 RTP\n- Game RTP = xx.xx%\n- Jackpot RTP = xx.xx%\n- Bonus Game RTP = xx.xx%\n前 50 次 Spin ...\n前 200 次 Spin ...\nRTP &lt;=200 ...\nRTP &gt;200 以後 ...\n\nSettingID RTP\nSettingID 1 xxx（一般）\n- Game RTP = xx.xx%\n- Jackpot RTP = xx.xx%\n- Bonus Game RTP = xx.xx%\nSettingID 2 xxx（新手體驗 D）\n...\n\nSettingID Trigger Count\n...<\/code><\/pre>\n<p><strong class=\"nl nr\">Scenario RTP：五個時間切片<\/strong><\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>顯示欄<\/th><th>來源標籤<\/th><th>涵蓋範圍<\/th><th>是否判定<\/th><\/tr><\/thead><tbody><tr><td>整體<\/td><td><code class=\"nl nr\">整體 RTP<\/code><\/td><td>全部 spin<\/td><td>只判 <code class=\"nr\">0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>~50<\/td><td><code class=\"nl nr\">前 50 次 Spin<\/code><\/td><td>每位玩家第 1～50 轉<\/td><td>只判 <code class=\"nr\">0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>~200<\/td><td><code class=\"nl nr\">前 200 次 Spin<\/code>（或 <code class=\"nr\">前 100 次 Spin<\/code>）<\/td><td>每位玩家第 1～200 轉<\/td><td>只判 <code class=\"nr\">0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td><strong class=\"nl nr\">OG ~200<\/strong><\/td><td><code class=\"nl nr\">RTP &lt;=200<\/code>（或 <code class=\"nr\">&lt;=100<\/code>）<\/td><td><strong class=\"nl nr\">新手期<\/strong>（≤200 轉）<\/td><td><strong class=\"nl nr\">依目標值判定<\/strong><\/td><\/tr><tr><td><strong class=\"nl nr\">OG 200~<\/strong><\/td><td><code class=\"nl nr\">RTP &gt;200 以後<\/code><\/td><td><strong class=\"nl nr\">老手期<\/strong>（&gt;200 轉）<\/td><td><strong class=\"nl nr\">依目標值判定<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>前三欄是觀察用，只確認沒有爆掉。真正的目標值判定只做後兩欄。<\/p>\n<p>因為報表本身已經把新手期與老手期分開，<strong class=\"nl nr\">逐欄各判自己的目標值，不需要做加權平均<\/strong>。<\/p>\n<p>每一欄都有三個 RTP：<code class=\"nl nr\">Game RTP<\/code>、<code class=\"nl nr\">Jackpot RTP<\/code>（＝Link）、<code class=\"nl nr\">Bonus Game RTP<\/code>（＝Bonus）。<\/p>\n<p><strong class=\"nl nr\">SettingID RTP：機制拆分<\/strong><\/p>\n<p>各機制的 RTP 貢獻由 SettingID 分開列出：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>SettingID<\/th><th>名稱<\/th><th>歸屬<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>一般（沒有機制）<\/td><td>自然結果基準<\/td><\/tr><tr><td>2, 4, 5, 6, 7, 8<\/td><td>新手救援、新手體驗 D（新手體驗 FG）、新手 mini game 體驗 D（新手體驗 JP）等<\/td><td><strong class=\"nl nr\">新手體驗<\/strong>，取 Game RTP <strong class=\"nr\">加總<\/strong><\/td><\/tr><tr><td>3<\/td><td>老手救援<\/td><td><strong class=\"nl nr\">老手救援<\/strong>，取 Game RTP<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">新老手模式的區分<\/strong><\/p>\n<p><code class=\"nl\">OldHand Init<\/code> 決定這次壓測玩家的起始身分：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th><code class=\"nl nr\">OldHand Init<\/code><\/th><th>模式<\/th><th>玩家歷程<\/th><th>OG ~200 欄的目標<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">disabled<\/code><\/td><td><strong class=\"nl nr\">新手<\/strong><\/td><td>從第 1 轉開始，≤200 轉是新手期<\/td><td>新手目標（93%）<\/td><\/tr><tr><td><code class=\"nl nr\">enabled<\/code><\/td><td><strong class=\"nl nr\">老手<\/strong><\/td><td>玩家一開始就是老手<\/td><td>老手目標（92% 或 94%）<\/td><\/tr><\/tbody><\/table><\/div>\n<p>若 <code>OldHand Init<\/code> 欄位缺漏，退而用「Jackpot RTP 是否 &gt; 0」推斷（老手才會有 Link 收入）。這是備援，不是正規判斷依據。<\/p>\n<h3 id=\"22-壓縮檔rtp-validator-txt\">2.2 壓縮檔：RTP Validator TXT<\/h3>\n<p>ZIP／RAR 壓縮檔內是 <strong>RTP Validator<\/strong> 的逐分支 TXT（每個 <code>Coin in<\/code> × <code>WTIdx<\/code> 一個資料夾）。它不是判定的主報表，但提供了統計判定需要的關鍵資料：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">pool[n] hit = N, ttlWin = X, avg = Y, rtp = Z<\/code><\/td><td>各彩金獎級的命中次數與 RTP，用於硬檢查及異常追查<\/td><\/tr><tr><td><code class=\"nl nr\">TotalSpin<\/code>、<code class=\"nl nr\">TotalBet<\/code>、<code class=\"nl nr\">currency denom<\/code><\/td><td>樣本量與押注換算<\/td><\/tr><\/tbody><\/table><\/div>\n<p>逐分支 TXT 的完整讀法（命名、Coin in／WTIdx 對應、各區段、倍率權重核對）見 <a href=\"#\" class=\"nr tab-link\" data-tab=\"backend\">後端報表<\/a>。<\/p>\n<p><code class=\"nl\">pool[n] rtp<\/code> 的分母是<strong class=\"nr\">基準押注<\/strong>（<code class=\"nl nr\">default_coin_in<\/code>，H026 為 100），不是該次的實際 <code class=\"nr\">Coin in<\/code>。所以同一個 pool 的 rtp 在不同押注下應該一致，這本身就是一項檢查。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"3-壓測標準\">3. 壓測標準<\/h2>\n<h3 id=\"31-目標值\">3.1 目標值<\/h3>\n<h4 id=\"311-game-rtp\">3.1.1 Game RTP<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th>押注範圍<\/th><th class=\"n\">OG ~200（新手期）<\/th><th class=\"n\">OG 200~（老手期）<\/th><\/tr><\/thead><tbody><tr><td>新手（<code class=\"nl nr\">OldHand Init = disabled<\/code>）<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">93%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td>新手<\/td><td><code class=\"nl nr\">2 ≤ x<\/code><\/td><td class=\"n\">93%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>老手（<code class=\"nl nr\">OldHand Init = enabled<\/code>）<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">94%<\/td><td class=\"n\">94%<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">2 ≤ x<\/code><\/td><td class=\"n\">92%<\/td><td class=\"n\">92%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td>全部<\/td><td class=\"n\">92.5%<\/td><td class=\"n\">92.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code class=\"nl\">x<\/code> 為報表中的實際押注 <code class=\"nr\">Bet<\/code>。一般模式的 <code>$2<\/code> 界線直接判斷 <code class=\"nr\">x<\/code>，<code class=\"nl nr\">$100<\/code>（大 Bet）界線以 <code class=\"nr\">x ÷ 模式倍率<\/code>（基礎面額）判斷；BF／SF 一律以 <code>x ÷ 模式倍率<\/code> 判斷基礎面額。<\/p>\n<h4 id=\"312-link-與-bonus\">3.1.2 Link 與 Bonus<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>模式<\/th><th>押注範圍<\/th><th class=\"n\">Link OG ~200<\/th><th class=\"n\">Link OG 200~<\/th><th class=\"n\">Bonus 兩欄<\/th><\/tr><\/thead><tbody><tr><td>新手<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>新手<\/td><td><code class=\"nl nr\">2 ≤ x<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">x &lt; 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>老手<\/td><td><code class=\"nl nr\">2 ≤ x<\/code><\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><td class=\"n\">2%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td><code class=\"nl nr\">x &lt; 模式倍率 × 2<\/code><\/td><td class=\"n\">0%<\/td><td class=\"n\">0%<\/td><td class=\"n\">4%<\/td><\/tr><tr><td>Buy／Super Feature<\/td><td><code class=\"nl nr\">模式倍率 × 2 ≤ x<\/code><\/td><td class=\"n\">老手 2%／新手 0%<\/td><td class=\"n\">2%<\/td><td class=\"n\">老手 2%／新手 4%<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">Link 目標為 0% 時必須精確等於 0%<\/strong>，不套用任何容許範圍 — 這是規則問題不是精度問題（小 Bet 不能拉 Link、新手期不能拉 Link）。<\/p>\n<h4 id=\"313-機制目標\">3.1.3 機制目標<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>來源<\/th><th class=\"n\">目標<\/th><th>判定欄<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td>SettingID 2, 4, 5, 6, 7, 8 的 Game RTP 加總<\/td><td class=\"n\">1%<\/td><td>OG ~200<\/td><\/tr><tr><td>老手救援<\/td><td>SettingID 3 的 Game RTP<\/td><td class=\"n\">1%<\/td><td>OG 200~<\/td><\/tr><\/tbody><\/table><\/div>\n<p>機制依〈3.2 判定方式〉判定；目標為 0% 時必須精確等於 0%。<\/p>\n<p>&gt; 注意：老手救援 B 版的返還公式為 <code>(0.95 − Total Win / Total Bet) × Total Bet<\/code> &gt; （機制說明附錄 B.2.4），是補到 RTP 95%，而觸發門檻只要 <code class=\"nr\">RTP &lt; 50%<\/code>。 &gt; 機制說明附錄 B.2.9 已標註「返還目標寫 55% 但公式是 95%，兩者不一致」。 &gt; 因此 1% 這個目標在 B 版下是否成立需要實測確認，見〈待確認事項〉。<\/p>\n<h3 id=\"32-判定方式\">3.2 判定方式<\/h3>\n<p>各項目以〈3.1 目標值〉中的目標為基準，容許範圍如下：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">容許範圍<\/th><\/tr><\/thead><tbody><tr><td>Game RTP<\/td><td class=\"n\">目標值 ±0.5 個百分點<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">目標值 ±0.5 個百分點<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">目標值 ±1.5 個百分點<\/td><\/tr><tr><td>新手體驗／老手救援機制<\/td><td class=\"n\">目標值 ±1.5 個百分點<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">目標值為 0% 時不套用容許範圍，實測值必須精確等於 0%；只要出現任何數值就判定失敗。<\/strong><\/p>\n<h3 id=\"33-硬檢查\">3.3 硬檢查<\/h3>\n<p>不涉及統計容差，不符合就是錯：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檢查項<\/th><th>條件<\/th><\/tr><\/thead><tbody><tr><td>小 Bet 不可拉 Link<\/td><td>小 Bet 所有欄的 <code>Jackpot RTP<\/code> 必須為 0，且 <code class=\"nr\">pool[1]<\/code>、<code class=\"nl\">pool[2]<\/code> 的 hit 必須為 0<\/td><\/tr><tr><td>新手期不可拉 Link<\/td><td>新手模式的 <code>OG ~200<\/code> 欄 <code>Jackpot RTP<\/code> 必須為 0<\/td><\/tr><tr><td>前三欄範圍<\/td><td><code class=\"nl nr\">整體<\/code>／<code class=\"nl nr\">~50<\/code>／<code class=\"nl\">~200<\/code> 的 Game RTP 必須 <code class=\"nr\">0 ≤ x &lt; 100%<\/code><\/td><\/tr><tr><td>RTP 拆解<\/td><td><code class=\"nl\">Game RTP + Jackpot RTP + Bonus Game RTP<\/code> 須等於總 RTP（浮點誤差內）<\/td><\/tr><tr><td>上限倍數<\/td><td>各分級的實際開出最大倍數不得超過數學文件「倍率線型」所定義的上限<\/td><\/tr><tr><td>BG Trigger Cap<\/td><td>BG 進 FG 的最大倍數不得超過同 Profile 的 BG Trigger Cap<\/td><\/tr><tr><td>Scatter Pay<\/td><td>遊戲無 Scatter Pay 時對應欄位必須為 0<\/td><\/tr><tr><td><code class=\"nl\">pool[n] rtp<\/code> 一致性<\/td><td>同一個 pool 的 rtp 在不同 <code>Coin in<\/code> 下應一致（分母是基準押注，與實際押注無關）<\/td><\/tr><tr><td>Bet Mode 對應<\/td><td>判定用的目標必須依 <code>extraBet<\/code> 決定，不可只看 <code class=\"nr\">Coin in<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"34-實測參考值h026\">3.4 實測參考值（H026）<\/h3>\n<p>以下依目前〈3.2 判定方式〉整理 H026 的判定範圍。其他遊戲若目標值相同，可使用相同容許範圍；押注分級與上限倍數仍須依各遊戲文件判定。<\/p>\n<h4 id=\"341-各項目通過範圍\">3.4.1 各項目通過範圍<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">目標值<\/th><th class=\"n\">通過範圍<\/th><\/tr><\/thead><tbody><tr><td>Game RTP（一般模式新手期）<\/td><td class=\"n\">93%<\/td><td class=\"n\">92.5%～93.5%<\/td><\/tr><tr><td>Game RTP（老手低押注）<\/td><td class=\"n\">94%<\/td><td class=\"n\">93.5%～94.5%<\/td><\/tr><tr><td>Game RTP（老手中／大押注）<\/td><td class=\"n\">92%<\/td><td class=\"n\">91.5%～92.5%<\/td><\/tr><tr><td>Game RTP（Buy／Super Feature）<\/td><td class=\"n\">92.5%<\/td><td class=\"n\">92.0%～93.0%<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">2%<\/td><td class=\"n\">1.5%～2.5%<\/td><\/tr><tr><td>Bonus Game RTP<\/td><td class=\"n\">4%<\/td><td class=\"n\">3.5%～4.5%<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">2%<\/td><td class=\"n\">0.5%～3.5%<\/td><\/tr><tr><td>Link（Jackpot RTP）<\/td><td class=\"n\">0%<\/td><td class=\"n\"><strong class=\"nl nr\">必須精確等於 0%<\/strong><\/td><\/tr><tr><td>新手體驗／老手救援機制<\/td><td class=\"n\">1%<\/td><td class=\"n\">0%～2.5%<\/td><\/tr><tr><td>未配置的機制<\/td><td class=\"n\">0%<\/td><td class=\"n\"><strong class=\"nl nr\">必須精確等於 0%<\/strong><\/td><\/tr><\/tbody><\/table><\/div>\n<p>機制目標 1% 套用 ±1.5pp 後，數學下限為 −0.5%；RTP 不會小於 0%，因此實際通過範圍寫為 0%～2.5%。<\/p>\n<h4 id=\"342-已知實測案例\">3.4.2 已知實測案例<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th class=\"n\">實測值<\/th><th class=\"n\">目標值<\/th><th class=\"n\">差異<\/th><th>判定<\/th><\/tr><\/thead><tbody><tr><td>H026 <code class=\"nr\">NoExtraBet<\/code>、<code class=\"nl nr\">Coin in = 500<\/code>、老手 Game RTP<\/td><td class=\"n\">93.4111%<\/td><td class=\"n\">94%<\/td><td class=\"n\">−0.5889pp<\/td><td>❌ 超出 ±0.5pp<\/td><\/tr><tr><td>H026 Bonus Game RTP（已知 12 次實測範圍）<\/td><td class=\"n\">1.970%～2.033%<\/td><td class=\"n\">2%<\/td><td class=\"n\">−0.030pp～+0.033pp<\/td><td>✅ 落在 1.5%～2.5%<\/td><\/tr><\/tbody><\/table><\/div>\n<h4 id=\"343-pool-獎級對照\">3.4.3 Pool 獎級對照<\/h4>\n<div class=\"tbl-wrap\"><table><thead><tr><th>pool<\/th><th>獎級<\/th><th class=\"n\">倍率（相對基準押注 100）<\/th><th class=\"n\">理論 RTP<\/th><th>歸屬<\/th><\/tr><\/thead><tbody><tr><td>pool[1]<\/td><td>Grand<\/td><td class=\"n\">約 18,000x ～ 20,000x（累進，會變動）<\/td><td class=\"n\">1%<\/td><td>Link<\/td><\/tr><tr><td>pool[2]<\/td><td>Major<\/td><td class=\"n\">約 9,500x ～ 10,200x（累進，會變動）<\/td><td class=\"n\">1%<\/td><td>Link<\/td><\/tr><tr><td>pool[3]<\/td><td>Minor<\/td><td class=\"n\">50x（固定）<\/td><td class=\"n\">0.8%<\/td><td>Bonus<\/td><\/tr><tr><td>pool[4]<\/td><td>Mini<\/td><td class=\"n\">10x（固定）<\/td><td class=\"n\">1.2%<\/td><td>Bonus<\/td><\/tr><\/tbody><\/table><\/div>\n<p><code class=\"nl\">pool[1]<\/code> 最大、<code class=\"nl\">pool[4]<\/code> 最小。<code class=\"nl\">Jackpot RTP<\/code> = pool[1] + pool[2]；<code class=\"nl\">Bonus Game RTP<\/code> = pool[3] + pool[4]。<\/p>\n<h3 id=\"35-檢查清單\">3.5 檢查清單<\/h3>\n<h4 id=\"351-前置\">3.5.1 前置<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 已記錄玩家數、每人把數、<code class=\"nl nr\">N<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每人把數 ≥ 600（老手救援 B 至少 2 個完整返還區間）。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 已取得 <code>currency denom<\/code> 與該遊戲的大 Bet 門檻、上限倍數。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 已取得該遊戲各模式的押注倍率，並產生完整測項清單。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個測項都有對應的 <code class=\"nr\">Formal RTP Report<\/code>。<\/li><\/ul>\n<h4 id=\"352-判定資料\">3.5.2 判定資料<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 每格的 Game／Link／Bonus 目標值與實測值都已取得。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 新手體驗與老手救援機制的目標值與實測值都已取得。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有差異都以百分點（pp）記錄。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 各 pool 的 <code>hit<\/code> 已取得，供硬檢查與異常追查。<\/li><\/ul>\n<h4 id=\"353-判定\">3.5.3 判定<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 前三欄 Game RTP 都在 <code class=\"nr\">0 ≤ x &lt; 100%<\/code>。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">OG ~200<\/code> 與 <code>OG 200~<\/code> 的 Game／Link／Bonus 都已逐項判定。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Game／Bonus 都在目標值 ±0.5pp 內。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Link／機制都在目標值 ±1.5pp 內。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 所有目標為 0% 的項目都確認精確為 0%。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 硬檢查全部通過。<\/li><\/ul>\n<h4 id=\"354-紀錄\">3.5.4 紀錄<\/h4>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 通過的測項已記錄 <code class=\"nr\">Report ID<\/code>、時間、目標值、實測值與差異。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 未跑的測項已列出並註明原因。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 警示與異常都有結論或追查方向。<\/li><\/ul>\n<h3 id=\"36-常見異常與處置\">3.6 常見異常與處置<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>現象<\/th><th>可能原因<\/th><th>處置<\/th><\/tr><\/thead><tbody><tr><td>Game 超出目標 ±0.5pp，且各押注同方向<\/td><td>設定或口徑錯誤<\/td><td>追查 Config 家族、Profile、押注分級是否套錯<\/td><\/tr><tr><td>Game 超出目標 ±0.5pp，但只有一格<\/td><td>該格設定單獨出錯<\/td><td>檢查該 <code>Coin in<\/code> 的 WTIdx／Config 對應<\/td><\/tr><tr><td>Link 超出目標 ±1.5pp<\/td><td>彩金設定、獎額或權重異常<\/td><td>追查 <code class=\"nr\">pool[1]<\/code>／<code class=\"nl\">pool[2]<\/code> 設定<\/td><\/tr><tr><td>Link &gt; 0% 但目標 0%<\/td><td>Bet 分級或 Link 資格設定錯<\/td><td><strong class=\"nl nr\">硬性錯誤<\/strong>，直接退回<\/td><\/tr><tr><td>Bonus 超出目標 ±0.5pp<\/td><td>Bonus 權重或獎額異常<\/td><td>追查 <code class=\"nr\">pool[3]<\/code>／<code class=\"nl\">pool[4]<\/code> 權重與獎額<\/td><\/tr><tr><td>機制超出目標 ±1.5pp<\/td><td>新手體驗或老手救援設定異常<\/td><td>追查對應 SettingID 的設定與觸發狀況<\/td><\/tr><tr><td><code class=\"nl\">pool[n] rtp<\/code> 隨 <code>Coin in<\/code> 變動<\/td><td>彩金分母口徑錯<\/td><td>追查後端 rtp 計算<\/td><\/tr><tr><td>缺某個測項<\/td><td>該組合未納入本批壓測<\/td><td>列入待跑，不得視為通過<\/td><\/tr><tr><td><code class=\"nl\">OldHand Init<\/code> 缺漏<\/td><td>報表欄位不全<\/td><td>用 Link &gt; 0 推斷並在報告註明，或要求重出報表<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"4-建議作法\">4. 建議作法<\/h2>\n<p><strong class=\"nl nr\">建議每人 600 把以上<\/strong>，讓老手救援 B 至少有 2 個完整返還區間。500 把只有 1 個完整區間，救援樣本偏少。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"5-待確認事項\">5. 待確認事項<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>現況<\/th><th>影響<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl\">SettingID Trigger Count<\/code> 區段內容<\/td><td>尚未取得樣本。若含各機制的觸發次數，可用於機制異常追查<\/td><td>影響機制異常的追查資訊是否完整<\/td><\/tr><tr><td>老手救援 B 的 1% 目標是否成立<\/td><td>B 版補到 RTP 95%、門檻 <code class=\"nr\">RTP &lt; 50%<\/code>，遠寬於 C 版；機制說明附錄 B.2.9 已標註公式與目標不一致<\/td><td>若實際增量不是 1%，〈機制目標〉要改<\/td><\/tr><tr><td>老手救援 B 的判定頻率<\/td><td>機制說明附錄 B.2 寫每 150 把一次，但範例是每 50 把一次（B.2.9 已標註）<\/td><td>影響「每人幾把才夠」的建議值<\/td><\/tr><tr><td>各遊戲的大 Bet 門檻<\/td><td>預設 <code class=\"nr\">&gt; $100<\/code>，未逐款確認<\/td><td>影響分級判定<\/td><\/tr><tr><td>各分級 Bet 上限倍數<\/td><td>依各遊戲數學文件「倍率線型」，未集中列表<\/td><td>硬檢查需逐款查數學文件<\/td><\/tr><tr><td>A／B 變體平均分散下的上限驗證<\/td><td>A／B 在同一設定下平均分散，混合後最大倍數由上限較高的變體決定<\/td><td>若大 Bet 也混入高上限變體，數學文件定義的上限可能驗不出來<\/td><\/tr><tr><td><code class=\"nl\">Game RTP<\/code> 的口徑<\/td><td>報表的 <code>TotalRtp (excluding JP/bonus)<\/code> 含 Scatter；判定程式的 Game RTP 只加 BG + FG，不含 Scatter<\/td><td>無 Scatter Pay 的遊戲兩者一致，有 Scatter Pay 的遊戲會不一致<\/td><\/tr><tr><td>Buy／Super Feature 缺 newbie profile<\/td><td>部分遊戲的 <code>card_system<\/code> 只在 <code>oldhand<\/code> 下定義 <code class=\"nr\">buy_feature<\/code>，<code class=\"nl\">newbie<\/code> 沒有對應設定<\/td><td>BF／SF 的「新手」測項是否成立、以及套用哪一組卡片，需逐款確認<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-backend\" hidden><div class=\"sec-head\"><h1 id=\"後端報表\">後端報表<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>這份筆記說明<strong>後端 SPS（RTP Validator）逐分支 TXT 報表<\/strong>怎麼讀、怎麼換算成 Simulator 的指標、怎麼拿來核對倍率權重。<\/p>\n<p>它與 <a href=\"#\" class=\"tab-link\" data-tab=\"stress\">壓測說明書<\/a> 的分工：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>報表<\/th><th>內容<\/th><th>用途<\/th><th>說明文件<\/th><\/tr><\/thead><tbody><tr><td>TG <code class=\"nr\">Formal RTP Report<\/code><\/td><td>固定玩家數 × 把數的玩家歷程 RTP<\/td><td>新老手切換與機制介入後的 RTP 判定<\/td><td><a href=\"#\" class=\"nl nr tab-link\" data-tab=\"stress\" data-anchor=\"2-壓測報表\">壓測說明書<\/a><\/td><\/tr><tr><td><strong class=\"nl nr\">SPS 逐分支 TXT<\/strong>（ZIP／RAR）<\/td><td>每個 <code>BetType<\/code> × <code>Coin in<\/code> × <code>WTIdx<\/code> 一份統計<\/td><td><strong class=\"nl nr\">核對後端是否套對權重表、Card System 是否與 Simulator 一致<\/strong><\/td><td>本文件<\/td><\/tr><\/tbody><\/table><\/div>\n<p>SPS 報表固定一張權重表跑到底，不經過新老手切換與機制介入，所以可以直接和 Simulator 的 Card-On 報表、倍率權重工作簿逐格比對。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"1-檔案結構與命名\">1. 檔案結構與命名<\/h2>\n<p>壓縮檔內每個分支一個資料夾，資料夾內一份 TXT（檔名為時間戳記，無意義）：<\/p>\n<pre><code>JHS&lt;GameID&gt;_&lt;BetType&gt;_Null_&lt;Coin in&gt;_WTIdx_&lt;n&gt;/&lt;時間戳記&gt;.txt<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>片段<\/th><th>意義<\/th><th>範例<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">&lt;GameID&gt;<\/code><\/td><td>遊戲編號<\/td><td><code class=\"nl nr\">101027<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">&lt;BetType&gt;<\/code><\/td><td>押注模式（見下表）<\/td><td><code class=\"nl nr\">NoExtraBet<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">&lt;Coin in&gt;<\/code><\/td><td>該分支每轉實際押注（coin 單位）<\/td><td><code class=\"nl nr\">5000<\/code><\/td><\/tr><tr><td><code class=\"nl nr\">WTIdx_&lt;n&gt;<\/code><\/td><td>權重表索引（WeightTableIdx），對應哪一組 Profile／版本由後端設定，<strong class=\"nl nr\">每款遊戲要先確認<\/strong><\/td><td><code class=\"nl nr\">WTIdx_2<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"11-bettype-對應\">1.1 BetType 對應<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>BetType<\/th><th>押注模式<\/th><th class=\"n\">模式倍數<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">NoExtraBet<\/code><\/td><td>Normal Bet（NB）<\/td><td class=\"n\">1<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_PowerUp<\/code><\/td><td>Extra Bet（EB）<\/td><td class=\"n\">依遊戲（H027 為 2）<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_BuyFreeGame<\/code><\/td><td>Buy Feature（BF）<\/td><td class=\"n\">依遊戲（H027 為 100）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-coin-in-config\">1.2 Coin in → Config<\/h3>\n<pre><code>實際押注（$）＝ Coin in × currency denom\n基礎押注（$）＝ 實際押注 ÷ 模式倍數<\/code><\/pre>\n<p>再依 <a href=\"#\" class=\"tab-link\" data-tab=\"math\" data-anchor=\"171-押注模式分類與層級判定\">數學模型規範 §1.7.1<\/a> 決定押注層級：<\/p>\n<ul><li>NB／EB：小 Bet（<code class=\"nl nr\">&lt; $2<\/code>）用<strong>實際押注<\/strong>判，大 Bet（<code class=\"nl nr\">&gt; $100<\/code>）用<strong>基礎押注<\/strong>判（對齊 SPS <code class=\"nr\">isHighBet()<\/code>，2026-10-27）。例：EB 基礎 <code class=\"nr\">$60<\/code>（實際 <code class=\"nr\">$120<\/code>）是中 Bet。<\/li><li>BF／SF 用<strong>基礎押注<\/strong>判同一組邊界。<\/li><li>小 Bet → 94 版；中 Bet → 92 版；大 Bet → 92_Bet100 版。<\/li><\/ul>\n<p>檔頭的 <code>betMultiplier<\/code> 是基礎押注對 <code>default_coin_in<\/code> 的倍數，可用來交叉核對：<code class=\"nl nr\">基礎押注 = betMultiplier × default_coin_in × currency denom<\/code>。<\/p>\n<h3 id=\"13-wtidx-對應\">1.3 WTIdx 對應<\/h3>\n<p>WTIdx 的順序由後端決定，沒有固定規則。拿到報表後先用數據反推並向後端確認：<\/p>\n<ul><li><strong class=\"nl nr\">Newbie 與 Oldhand<\/strong>：看 BG 有次數的最高區間（Newbie 受 BG 倍率上限限制，如 30x）。<\/li><li><strong class=\"nl nr\">A 版與 B 版<\/strong>：看 BG 最高區間、<code class=\"nl\">BG WheelTable<\/code> 的選表比例（應接近該版 Parameter 的選表權重）。<\/li><li>推得的對應要與後端設定表一致，不一致時以後端設定為準並回報差異。<\/li><\/ul>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"2-檔頭欄位\">2. 檔頭欄位<\/h2>\n<pre><code>BetType = NoExtraBet\nWeightTableIdx = 0\nversion = H027192:A-7.0.0.0 B-7.0.0.0/H027194:A-7.0.0.0 B-7.0.0.0 GameID = 101027, JP optionID = 28, Coin in = 5000, currency denom = 0.002000, betMultiplier = 50, ...\nTotalSpin = 10000000, TotalBet = 50000000000<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th>欄位<\/th><th>意義<\/th><th>檢查<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">BetType<\/code>、<code class=\"nl nr\">WeightTableIdx<\/code><\/td><td>同資料夾名稱<\/td><td>與資料夾名稱一致<\/td><\/tr><tr><td><code class=\"nl nr\">version<\/code><\/td><td>後端載入的各 RTP／Variant 模型版本<\/td><td><strong class=\"nl nr\">必須等於 <code>Source/version.txt<\/code> 中各倍率權重工作簿的版本<\/strong><\/td><\/tr><tr><td><code class=\"nl nr\">JP optionID<\/code><\/td><td>OP Jackpot 設定編號<\/td><td>與上線設定一致<\/td><\/tr><tr><td><code class=\"nl nr\">Coin in<\/code>、<code class=\"nl nr\">currency denom<\/code><\/td><td>見 §1.2<\/td><td>—<\/td><\/tr><tr><td><code class=\"nl nr\">TotalSpin<\/code><\/td><td>付費轉數（樣本量）<\/td><td>—<\/td><\/tr><tr><td><code class=\"nl nr\">TotalBet<\/code><\/td><td>總押注（coin），＝ <code class=\"nr\">TotalSpin × Coin in<\/code><\/td><td>不等時代表有中途改押<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"3-報表區段\">3. 報表區段<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>區段<\/th><th>內容<\/th><th>用途<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">Total RTP<\/code><\/td><td><code class=\"nl nr\">BaseGameRtp<\/code>、<code class=\"nl nr\">ScatterRtp<\/code>、<code class=\"nl nr\">FreeGameRtp<\/code>、<code class=\"nl nr\">TotalRtp (excluding JP/bonus)<\/code>、<code class=\"nl nr\">BonusJP Rtp<\/code>、<code class=\"nl nr\">LinkJP Rtp<\/code><\/td><td>RTP 對帳<\/td><\/tr><tr><td><code class=\"nl nr\">BaseGame info<\/code><\/td><td><code class=\"nl nr\">BaseGameTTLWin<\/code>、<code class=\"nl nr\">BG SymbolHit[符號][連線長度]<\/code>、<code class=\"nl nr\">BG WheelTable[n] Count<\/code>（BG 選表次數）、<code class=\"nl nr\">BG FeatureHit[n]<\/code><\/td><td>選表比例、符號命中<\/td><\/tr><tr><td><code class=\"nl nr\">FreeGame info<\/code><\/td><td><code class=\"nl nr\">FreeGameTTLRound<\/code>（免費轉總數）、<code class=\"nl nr\">FreeGameTTLWin<\/code>、<code class=\"nl nr\">FG SymbolHit<\/code>、<code class=\"nl nr\">FG Wheel Table<\/code><\/td><td>FG 場次與得分<\/td><\/tr><tr><td><code class=\"nl nr\">JP info<\/code><\/td><td><code class=\"nl nr\">pool[n] hit / ttlWin / avg / rtp<\/code>、<code class=\"nl nr\">JPTotalRound<\/code>、<code class=\"nl nr\">avgPeriod<\/code><\/td><td>JP 硬檢查（見 <a href=\"#\" class=\"nr tab-link\" data-tab=\"stress\" data-anchor=\"22-壓縮檔rtp-validator-txt\">壓測說明書 §2.2<\/a>）<\/td><\/tr><tr><td><code class=\"nl nr\">BaseGame 倍數<\/code><\/td><td>每轉 BG 得分的分桶次數與 Pay；<strong class=\"nl nr\">不含觸發 FG 的那一轉<\/strong><\/td><td>BG 線型核對<\/td><\/tr><tr><td><code class=\"nl nr\">BaseGame 進 FreeGame 倍數<\/code><\/td><td>只統計觸發 FG 那一轉的 BG 得分<\/td><td>觸發轉天花板、扣除觸發轉<\/td><\/tr><tr><td><code class=\"nl nr\">整場FreeGame 倍數<\/code><\/td><td>每一場 FG（整場總分）的分桶次數與 Pay<\/td><td>FG 線型核對<\/td><\/tr><tr><td><code class=\"nl nr\">FreeGame 單round 倍數<\/code><\/td><td>每一個免費轉的得分分桶<\/td><td>參考<\/td><\/tr><tr><td><code class=\"nl nr\">by Game Data<\/code><\/td><td>消除次數、<code class=\"nl nr\">BGtableWin[n]<\/code>（各選表總得分）、<code class=\"nl nr\">Freegame Count<\/code>（FG 場數）、<code class=\"nl nr\">bgC1Count<\/code>／<code class=\"nl nr\">fgC1Count<\/code>（每轉特殊符號數量分布）<\/td><td>觸發率、SCR 參考<\/td><\/tr><tr><td><code class=\"nl nr\">Base Game RNG INFO<\/code>、<code class=\"nl\">FreeGame RNG INFO<\/code> 等<\/td><td>後端 RNG 除錯資料<\/td><td>不用於判定<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">分桶標籤<\/strong>：<code class=\"nl\">Nx<\/code> 代表區間 <code class=\"nr\">(N, 下一個標籤]<\/code>，<code class=\"nl\">00<\/code> 代表 0 分。例如 <code>BaseGame 10x<\/code> 是 <code class=\"nr\">(10, 15]<\/code>，<code class=\"nl\">BaseGame 0x<\/code> 是 <code class=\"nr\">(0, 1]<\/code>。標籤與 <a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範 §1.8<\/a> 的 64 格線一一對應。<\/p>\n<p>各分桶列後面的 <code class=\"nr\">1C1<\/code>～<code class=\"nl\">5C1<\/code> 欄依特殊符號數量拆分次數，目前未用於判定。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"4-指標換算\">4. 指標換算<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>Simulator 指標<\/th><th>SPS 換算<\/th><\/tr><\/thead><tbody><tr><td>總 RTP（不含 JP）<\/td><td><code class=\"nl\">TotalRtp (excluding JP/bonus)<\/code> ＝ <code class=\"nr\">BaseGameRtp + ScatterRtp + FreeGameRtp<\/code><\/td><\/tr><tr><td>BG RTP<\/td><td><code class=\"nl nr\">BaseGameRtp + ScatterRtp<\/code>（Scatter 賠付屬 BG；BF 的入場轉也記在 <code class=\"nr\">ScatterRtp<\/code>）<\/td><\/tr><tr><td>FG RTP<\/td><td><code class=\"nl nr\">FreeGameRtp<\/code><\/td><\/tr><tr><td>BG Hit Rate<\/td><td><code class=\"nl nr\">1 − BaseGame 00 ÷ TotalSpin<\/code><\/td><\/tr><tr><td>FG 觸發率<\/td><td><code class=\"nl nr\">Freegame Count ÷ TotalSpin<\/code><\/td><\/tr><tr><td>平均 FG 轉數<\/td><td><code class=\"nl nr\">FreeGameTTLRound ÷ Freegame Count<\/code><\/td><\/tr><tr><td>FG 平均倍數（基礎投注口徑）<\/td><td><code class=\"nl nr\">FreeGameTTLWin ÷ Freegame Count ÷ Coin in × 模式倍數<\/code><\/td><\/tr><tr><td>區間平均倍數（基礎投注口徑）<\/td><td><code class=\"nl nr\">Pay ÷ 次數 ÷ Coin in × 模式倍數<\/code><\/td><\/tr><tr><td>JP RTP<\/td><td><code class=\"nl nr\">BonusJP Rtp<\/code>、<code class=\"nl nr\">LinkJP Rtp<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong class=\"nl nr\">SCR<\/strong>：SPS 沒有直接輸出 SCR。可用 <code>(bgC1Count ≥1 的次數 ＋ fgC1Count ≥1 的次數) ÷ TotalSpin × 10¹⁰<\/code> 近似，但<strong class=\"nr\">計數定義尚未與 Simulator 對齊<\/strong>（H027 實測 NB／EB 低約 1%，BF 高約 13%），所以 OP Jackpot 的 SCR 一律用 Simulator Card-On 報表的值，不用 SPS 推算值。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"5-倍率權重核對方法\">5. 倍率權重核對方法<\/h2>\n<h3 id=\"51-bg\">5.1 BG<\/h3>\n<p><code class=\"nl\">BaseGame 倍數<\/code> 區段<strong class=\"nr\">已排除觸發 FG 的那一轉<\/strong>，與 模擬程式規範 §1.1.4 的 BG 統計口徑相同，直接比對即可，不要再扣一次：<\/p>\n<pre><code>BaseGame 00 次數 ＋ 各桶次數 ＋ Freegame Count ＝ TotalSpin\nBaseGame 倍數 Pay 合計 ＋ BaseGame 進 FreeGame 倍數 Pay 合計 ＝ BaseGameTTLWin<\/code><\/pre>\n<ol><li>每桶占比 ＝ 次數 ÷ <code class=\"nr\">TotalSpin<\/code>，對應倍率權重工作簿 <code>Multiplier_Weight<\/code> 的 BG 欄（權重 ÷ 10⁹）。<\/li><li><code class=\"nl\">BaseGame 00<\/code> 占比對應 <code class=\"nr\">(-1, 0]<\/code>；Free Game 列對應 <code class=\"nr\">Freegame Count ÷ TotalSpin<\/code>。<\/li><li><code class=\"nl\">BaseGame 進 FreeGame 倍數<\/code> 只用來檢查觸發轉的 BG 得分有沒有超過 BG Trigger Cap。<\/li><\/ol>\n<h3 id=\"52-fgbf\">5.2 FG／BF<\/h3>\n<p><code class=\"nl\">整場FreeGame 倍數<\/code> 各桶次數 ÷ 總場數，對應 FG 欄（BF 對應 BF 欄）。<\/p>\n<h3 id=\"53-判定\">5.3 判定<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>標準<\/th><\/tr><\/thead><tbody><tr><td>總 RTP（不含 JP）<\/td><td><code class=\"nl nr\">σ = volatility_std ÷ 模式倍數 ÷ √TotalSpin<\/code>，**\\<\/td><td>實測 − 目標\\<\/td><td>≤ 2σ**；<code class=\"nl\">volatility_std<\/code> 取同 Config／Profile／模式的 Simulator Card-On 報表<\/td><\/tr><tr><td>有權重的區間<\/td><td><code class=\"nl nr\">z = (實測占比 − 權重) ÷ √(權重 × (1 − 權重) ÷ N)<\/code>，**\\<\/td><td>z\\<\/td><td>≤ 3**<\/td><\/tr><tr><td>權重為 0 的區間<\/td><td>次數必須為 0（超限保留最後結果的情況除外，數量須 ≤ Retry 超限次數）<\/td><\/tr><tr><td>最高／最低有次數的區間<\/td><td>與權重表的最高／最低有權重區間相同（樣本太少時最高區間可能沒抽到）<\/td><\/tr><tr><td>觸發轉 BG 得分<\/td><td>不得超過 Config <code>free_game<\/code> 卡的 <code class=\"nr\">max<\/code>（BG Trigger Cap）<\/td><\/tr><tr><td>區間平均倍數<\/td><td>與 <code>Avg_Multi<\/code> 工作表相近；差異大時代表區間內條件分布不同<\/td><\/tr><\/tbody><\/table><\/div>\n<p>N 為該欄的總樣本數（BG 用 <code class=\"nr\">TotalSpin<\/code>，FG 用總場數）。Simulator 的 <code>volatility_std<\/code> 以 Normal Bet 基準成本計，換成 RTP 的 σ 時必須除以模式倍數（EB ÷2、BF ÷100），漏除會讓 EB／BF 的 σ 被高估、偏差看起來比實際小。單一報表 64 格同時檢定，偶有一兩格 |z| 落在 3 附近屬正常；多格同向偏離才是問題。<\/p>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"6-檢查清單\">6. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 資料夾數量 ＝ BetType × Coin in × WTIdx 的必跑組合，沒有缺漏<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> <code class=\"nl\">version<\/code> 等於 <code>Source/version.txt<\/code> 中所有倍率權重工作簿的版本<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> WTIdx 對應的 Profile／版本已和後端確認<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 每個 Coin in 落在預期的押注層級，套用預期的 config（92／94／Bet100）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 各區間占比、上下限、權重 0 區間依 §5.3 通過<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Newbie 觸發轉的 BG 得分沒有超過 BG 上限<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 總 RTP、BG／FG RTP、BG Hit Rate、FG 觸發率與 Simulator Card-On 報表在抽樣誤差內一致<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 若 RTP 系統性偏低，先對照 Simulator 的 Retry 超限次數，再查後端重抽上限是否與 Config <code>retry_limit<\/code> 相同<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> JP 依 <a href=\"#\" class=\"tab-link\" data-tab=\"stress\" data-anchor=\"33-硬檢查\">壓測說明書 §3.3<\/a> 硬檢查<\/li><\/ul>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"7-實例h027-v7\">7. 實例：H027 v7<\/h2>\n<p>壓縮檔 <code class=\"nr\">101027_AB版.rar<\/code>，32 份報表，每份 NB／EB 10⁷ 轉、BF 10⁶ 次。<\/p>\n<h3 id=\"71-coin-in-對應\">7.1 Coin in 對應<\/h3>\n<p><code class=\"nl nr\">currency denom = 0.002<\/code>，<code class=\"nl nr\">default_coin_in = 100<\/code>。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>BetType<\/th><th class=\"n\">Coin in<\/th><th class=\"n\">實際押注<\/th><th class=\"n\">基礎押注<\/th><th>押注層級<\/th><th>Config<\/th><\/tr><\/thead><tbody><tr><td><code class=\"nl nr\">NoExtraBet<\/code><\/td><td class=\"n\">500<\/td><td class=\"n\">$1<\/td><td class=\"n\">$1<\/td><td>小 Bet<\/td><td>94<\/td><\/tr><tr><td><code class=\"nl nr\">NoExtraBet<\/code><\/td><td class=\"n\">5,000<\/td><td class=\"n\">$10<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><tr><td><code class=\"nl nr\">NoExtraBet<\/code><\/td><td class=\"n\">750,000<\/td><td class=\"n\">$1,500<\/td><td class=\"n\">$1,500<\/td><td>大 Bet<\/td><td>92_Bet100<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_PowerUp<\/code><\/td><td class=\"n\">1,000<\/td><td class=\"n\">$2<\/td><td class=\"n\">$1<\/td><td>中 Bet（依實際押注）<\/td><td>92<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_PowerUp<\/code><\/td><td class=\"n\">10,000<\/td><td class=\"n\">$20<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_PowerUp<\/code><\/td><td class=\"n\">1,500,000<\/td><td class=\"n\">$3,000<\/td><td class=\"n\">$1,500<\/td><td>大 Bet<\/td><td>92_Bet100<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_BuyFreeGame<\/code><\/td><td class=\"n\">50,000<\/td><td class=\"n\">$100<\/td><td class=\"n\">$1<\/td><td>小 Bet（依基礎押注）<\/td><td>94（BF 權重 92＝94 共用）<\/td><\/tr><tr><td><code class=\"nl nr\">ExtraBet_BuyFreeGame<\/code><\/td><td class=\"n\">500,000<\/td><td class=\"n\">$1,000<\/td><td class=\"n\">$10<\/td><td>中 Bet<\/td><td>92<\/td><\/tr><\/tbody><\/table><\/div>\n<p>EB $2 那組實測 FG RTP 約 49.8%，是 92 家族水準，確認後端用實際押注分層。此批沒有 BF 大 Bet（基礎押注需 &gt; $100，即 Coin in &gt; 5,000,000）。<\/p>\n<h3 id=\"72-wtidx-對應\">7.2 WTIdx 對應<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>WTIdx<\/th><th>對應<\/th><th>反推依據<\/th><\/tr><\/thead><tbody><tr><td>0<\/td><td>A 版 Newbie<\/td><td>BG 最高 30x、選表 (3) 約 17%<\/td><\/tr><tr><td>1<\/td><td>B 版 Newbie<\/td><td>BG 最高 30x、選表比例同 B<\/td><\/tr><tr><td>2<\/td><td>A 版 Oldhand<\/td><td>BG 最高 (200, 250]<\/td><\/tr><tr><td>3<\/td><td>B 版 Oldhand<\/td><td>BG 最高 (1000, 2000]<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"73-核對結果\">7.3 核對結果<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>項目<\/th><th>結果<\/th><\/tr><\/thead><tbody><tr><td>版本字串<\/td><td><code class=\"nl nr\">H027192:A-3.1.0.0<\/code>，其餘 7.0.0.0；數據內容是 v7，屬版號未更新<\/td><\/tr><tr><td>區間分布<\/td><td>64 區間與 v7 權重一致；BG 各桶差 ≤ 0.015 pp，FG 最大 \\<\/td><td>z\\<\/td><td>≤ 3.0，上下限全對<\/td><\/tr><tr><td>BG Hit Rate、FG 週期、FG 均倍<\/td><td>全部在抽樣誤差內（28.17～28.23%、NB 1/444～456、EB 1/90）<\/td><\/tr><tr><td>Newbie、BF RTP<\/td><td>16 組只有 A Newbie NB $10 偏 +2.1σ，其餘 ≤ 1.9σ<\/td><\/tr><tr><td>Oldhand NB RTP<\/td><td>6 組都在 2σ 內，但 5 組偏低，與 Simulator 的 Retry 超限方向一致<\/td><\/tr><tr><td>Oldhand EB RTP<\/td><td>A 三組 −2.2～−2.6σ、B $20 −3.6σ；BG 高倍桶 \\<\/td><td>z\\<\/td><td>到 4.3，屬 Retry 超限造成的高倍桶不足<\/td><\/tr><tr><td>Newbie 觸發轉<\/td><td>12 組全部有觸發轉 BG 得分超過 30x（每組 13～125 次，約 0.06～0.11% 的觸發），違反 <code>free_game<\/code> 卡 <code class=\"nr\">max = 30<\/code><\/td><\/tr><tr><td>SCR<\/td><td>SPS 推算值與 Simulator 不一致（見 §4），OP Jackpot 仍用 Simulator 值<\/td><\/tr><tr><td>JP<\/td><td>EB 的 <code>BonusJP Rtp<\/code> 約 0.1%，NB 約 2%，待後端確認 JP 設定是否刻意<\/td><\/tr><\/tbody><\/table><\/div><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-ceiling\" hidden><div class=\"sec-head\"><h1 id=\"天花板說明\">天花板說明<\/h1><p class=\"updated\">最後更新：2026-11-06<\/p>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 _README.md。<\/p>\n<p>天花板是系統對派彩金額設的上限。<strong class=\"nl nr\">超過上限的結果整把重骰<\/strong>：重骰後該結果不會出現，不是把派彩截到上限。數學模型、Config、Simulator 與 Demogame 必須實作同一套天花板。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-金額上限\">1. 金額上限<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th>範圍<\/th><th class=\"n\">押注 <code class=\"nr\">&lt;= $1,500<\/code><\/th><th class=\"n\">押注 <code class=\"nr\">&gt; $1,500<\/code><\/th><th>超過時<\/th><\/tr><\/thead><tbody><tr><td>單把 BG 派彩<\/td><td class=\"n\"><code class=\"nl nr\">$500,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$1,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><tr><td>單場 FG 派彩<\/td><td class=\"n\"><code class=\"nl nr\">$2,000,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$5,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><tr><td>系統賠付上限（單把總派彩）<\/td><td class=\"n\"><code class=\"nl nr\">$10,000,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$10,000,000<\/code><\/td><td>整把重骰<\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>押注 <code>$1,500<\/code> 屬於低的那一級；只有大於 <code>$1,500<\/code> 才適用 <code class=\"nr\">$1,000,000<\/code>／<code class=\"nl nr\">$5,000,000<\/code>。<\/li><\/ul>\n<p>各押注層級使用的模型與天花板：<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>押注層級<\/th><th>押注金額 <code class=\"nr\">x<\/code><\/th><th>使用模型<\/th><th class=\"n\">BG 天花板<\/th><th class=\"n\">FG 天花板<\/th><\/tr><\/thead><tbody><tr><td>小 Bet<\/td><td><code class=\"nl nr\">x &lt; $2<\/code><\/td><td>94 版<\/td><td class=\"n\"><code class=\"nl nr\">$500,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$2,000,000<\/code><\/td><\/tr><tr><td>中 Bet<\/td><td><code class=\"nl nr\">$2 &lt;= x &lt;= $100<\/code><\/td><td>92 版<\/td><td class=\"n\"><code class=\"nl nr\">$500,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$2,000,000<\/code><\/td><\/tr><tr><td>大 Bet<\/td><td><code class=\"nl nr\">$100 &lt; x &lt;= $1,500<\/code><\/td><td>92_Bet100 版<\/td><td class=\"n\"><code class=\"nl nr\">$500,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$2,000,000<\/code><\/td><\/tr><tr><td>超大 Bet<\/td><td><code class=\"nl nr\">x &gt; $1,500<\/code><\/td><td>92_Bet100 版（與大 Bet 共用）<\/td><td class=\"n\"><code class=\"nl nr\">$1,000,000<\/code><\/td><td class=\"n\"><code class=\"nl nr\">$5,000,000<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>超大 Bet 不另做模型，與大 Bet 共用 <code>_Bet100<\/code> 權重，只有天花板較寬；所以 <code>_Bet100<\/code> 權重必須同時通過大 Bet（以 <code>$1,500<\/code> 驗算）與超大 Bet（以遊戲最大押注驗算）兩組天花板，取較嚴者（見第 2 節）。<\/li><li>押注金額的判定方式與<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.7.1 節相同：NB／EB 的小 Bet 用實際押注、大 Bet 用基礎押注，BF／SF 用購買價格反推的基礎押注。<\/li><li>系統賠付上限對所有押注一律 <code class=\"nr\">$10,000,000<\/code>，是 BG、FG 上限之外的最後一道保護。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"2-對倍率上限的影響\">2. 對倍率上限的影響<\/h2>\n<p>每個押注層級的倍率上限必須讓該層最大押注踩不到天花板，否則高注玩家會實際觸發重骰、RTP 系統性偏低：<\/p>\n<pre><code>BG 倍率上限 × 該層最大押注 ≤ BG 上限\nFG 倍率上限 × 該層最大押注 ≤ FG 上限<\/code><\/pre>\n<div class=\"tbl-wrap\"><table><thead><tr><th class=\"n\">遊戲最大押注<\/th><th>BG 上限<\/th><th>BG 最高可填區間<\/th><th>FG 上限<\/th><th>FG 最高可填區間<\/th><th>系統上限（單把總派彩）<\/th><\/tr><\/thead><tbody><tr><td class=\"n\"><code class=\"nl nr\">$1,000<\/code><\/td><td><code class=\"nl nr\">$500,000 ÷ 1000 = 500x<\/code><\/td><td><code class=\"nl nr\">(450, 500]<\/code><\/td><td><code class=\"nl nr\">$2,000,000 ÷ 1000 = 2000x<\/code>，但大 Bet 上限 <code class=\"nr\">1000x<\/code><\/td><td><code class=\"nl nr\">(950, 1000]<\/code><\/td><td><code class=\"nl nr\">$10,000,000 ÷ 1000 = 10000x<\/code><\/td><\/tr><tr><td class=\"n\"><code class=\"nl nr\">$1,500<\/code><\/td><td><code class=\"nl nr\">$500,000 ÷ 1500 = 333x<\/code><\/td><td><code class=\"nl nr\">(250, 300]<\/code><\/td><td><code class=\"nl nr\">$2,000,000 ÷ 1500 = 1333x<\/code>，但大 Bet 上限 <code class=\"nr\">1000x<\/code><\/td><td><code class=\"nl nr\">(950, 1000]<\/code><\/td><td><code class=\"nl nr\">$10,000,000 ÷ 1500 = 6667x<\/code><\/td><\/tr><tr><td class=\"n\"><code class=\"nl nr\">$5,000<\/code>（例：H026、H027、H028）<\/td><td><code class=\"nl nr\">$1,000,000 ÷ 5000 = 200x<\/code><\/td><td><code class=\"nl nr\">(180, 200]<\/code><\/td><td><code class=\"nl nr\">$5,000,000 ÷ 5000 = 1000x<\/code><\/td><td><code class=\"nl nr\">(950, 1000]<\/code><\/td><td><code class=\"nl nr\">$10,000,000 ÷ 5000 = 2000x<\/code><\/td><\/tr><\/tbody><\/table><\/div>\n<ul><li>配權重時以各卡片區間的上限驗算：區間上限 × 該層最大押注超過天花板的區間，不得配權重。例：<code class=\"nl\">$1,500<\/code> 的 BG 上限是 333x，<code class=\"nl\">(300, 350]<\/code> 的上限 350 已超過，所以 BG 只能填到 <code class=\"nr\">(250, 300]<\/code>；押注開到 <code>$5,000<\/code> 時再取超大 Bet 的 200x，只能填到 <code class=\"nr\">(180, 200]<\/code>。<\/li><li>系統上限管的是 BG＋FG 加總：<code class=\"nl\">$5,000<\/code> 時 <code class=\"nr\">200 + 1000 = 1200x<\/code>，在 2000x 內不會擋到。<\/li><li>大 Bet 共用同一套權重時，取該層所有押注中最嚴的一個；押注開到 <code>$5,000<\/code> 的遊戲，大 Bet 只能填到 BG <code class=\"nr\">(180, 200]<\/code>、FG <code class=\"nr\">(950, 1000]<\/code>。<\/li><li>以 NB 驗算即可：大 Bet 一律用基礎押注分級，EB 與 NB 同一基礎押注落在同一級；卡片倍率以 NB 基準成本為分母，派彩金額相同。<\/li><li>計算結果比<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.7.2 節的預設上限低時，以天花板推得的值為準，並記錄於數學文件；比預設高時（例：上表 <code>$1,000<\/code> 的 FG <code class=\"nr\">2000x<\/code>）仍以預設為準，大 Bet 一律不超過 <code class=\"nr\">1000x<\/code>。<\/li><li>押注跨越 <code>$1,500<\/code> 的遊戲，<code class=\"nl\">&lt;= $1,500<\/code> 與 <code>&gt; $1,500<\/code> 要分開驗算。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"3-實作與驗證\">3. 實作與驗證<\/h2>\n<ul><li>Simulator 與 Demogame 必須實作相同的重骰，否則模擬結果與實際遊戲不一致。<\/li><li>卡片系統的觸發局 BG 上限（<a href=\"#\" class=\"nl tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 2.3 節的天花板機制）是另一道限制，兩者同時成立。<\/li><li>模擬報表要能看出重骰次數；重骰比例明顯不為 0 時，先檢查倍率上限與區間權重是否違反第 2 節。<\/li><\/ul>\n<\/div><div class=\"sec-card\"><h2 id=\"4-檢查清單\">4. 檢查清單<\/h2>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 各押注層級的 BG／FG 倍率上限已依第 2 節驗算並記錄於數學文件。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 超過天花板的卡片區間權重為 0。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> Simulator 與 Demogame 已實作 BG、FG 與系統賠付上限的重骰。<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 正式模擬的重骰次數為 0 或已說明原因。<\/li><\/ul><\/div><\/section><section class=\"panel\" role=\"tabpanel\" id=\"panel-mechanism\" hidden><div class=\"sec-head\"><h1 id=\"系統機制\">系統機制<\/h1><p class=\"updated\">最後更新：2026-11-20<\/p>\n<p>本文件屬於 <code>專案需知/<\/code> 專案需知文件集，總覽、共通原則與完成條件見 _README.md。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"1-總覽\">1. 總覽<\/h2>\n<h3 id=\"11-機制說明\">1.1 機制說明<\/h3>\n<div class=\"tbl-wrap\"><table><thead><tr><th>機制<\/th><th>現行版本<\/th><th>說明<\/th><\/tr><\/thead><tbody><tr><td>新手體驗<\/td><td><strong class=\"nl nr\">D 版<\/strong><\/td><td>新手期分兩階段：新手體驗（第 41～60 轉）、新手救援（第 141～160 轉）各隨機判定一次，RTP 偏低就把該轉改成設定倍數。<\/td><\/tr><tr><td>老手救援<\/td><td><strong class=\"nl nr\">C-2<\/strong><\/td><td>以天為單位（<strong class=\"nl\">台灣時間 04:00<\/strong> 刷新）的保底救援：主救援 41～405 轉、延伸救援 441 轉起（超過 1,000 轉照常），觸發點後第 1～5 轉隨機判定、RTP 以 40 轉一桶統計；救援成本由每日刷新的救援池支付（每轉提撥玩家押注的 <strong class=\"nr\"><span class=\"tune\">1%<\/span><\/strong>）；參數依 NB／EB × 小／中／大 Bet 分開設定。<\/td><\/tr><tr><td>動態調性<\/td><td><strong class=\"nl nr\">規劃中<\/strong><\/td><td>依玩家當下的遊戲狀態，換一張 RTP 相同、只差調性的數學（倍率權重）給玩家，不增加 RTP。詳見第 4 節。<\/td><\/tr><\/tbody><\/table><\/div>\n<p>標示方式：<strong class=\"nl\">粗體<\/strong>為重要數值；<span class=\"nl tune\">紅色虛線<\/span>為後端要做成可調整的參數。兩個機制都由 Card System 重骰產生結果，演出與自然得分無法區分。各機制的 RTP 預算見<a href=\"#\" class=\"tab-link\" data-tab=\"math\">數學模型規範.md<\/a>第 1.5 節；壓測驗證見<a href=\"#\" class=\"nr tab-link\" data-tab=\"stress\">壓測說明書.md<\/a>。模擬程式一律到模擬機執行（<code class=\"nl nr\">ssh sim<\/code>，<code class=\"nl nr\">/root/Simulator/System_老手救援/<\/code>）。<\/p>\n<div class=\"tbl-wrap\"><table><thead><tr><th>檔案<\/th><th>存放位置<\/th><\/tr><\/thead><tbody><tr><td>新手體驗模擬程式與結果<\/td><td>工作區 <code class=\"nr\">System/機制_新手體驗/新手體驗 &lt;版本&gt;/simulator/<\/code>（結果在 <code class=\"nr\">record/<\/code>）<\/td><\/tr><tr><td>老手救援模擬程式（救援池、套利）與結果<\/td><td><code class=\"nl nr\">System/機制_老手救援/老手救援 C-2/simulator/<\/code>（結果在 <code class=\"nr\">record/<\/code>）<\/td><\/tr><tr><td>機制總覽 HTML（跨版本）<\/td><td>機制資料夾（例：<code class=\"nl nr\">System/機制_老手救援/機制說明_老手救援.html<\/code>）<\/td><\/tr><tr><td>給主管的機制報告<\/td><td>各版本資料夾（例：<code class=\"nl nr\">System/機制_老手救援/老手救援 C-2/<\/code>）<\/td><\/tr><tr><td>全部機制合在一起的模擬、參考資料<\/td><td><code class=\"nl nr\">System/整體/<\/code>（<code class=\"nl nr\">simulator/<\/code>、<code class=\"nl nr\">參考/<\/code>）<\/td><\/tr><tr><td>共用 rowdata 與產生程式<\/td><td><code class=\"nl nr\">System/Else/<\/code>（<code class=\"nl nr\">rowdata/<\/code>）<\/td><\/tr><\/tbody><\/table><\/div>\n<h3 id=\"12-流程圖\">1.2 流程圖<\/h3>\n<p>新玩家第一天第 1～1,000 轉會遇到的事件（重複事件只畫一次）：<\/p>\n<div class=\"tl-wrap\"><div class=\"tl\"><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:5.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:8.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:5.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:5.60%\">新手體驗<span class=\"tl-range\">41～60 轉<\/span><\/div><\/div><div class=\"tl-group\" style=\"--c:var(--s1)\"><div class=\"tl-guide\" style=\"left:19.60%;height:94px\"><\/div><div class=\"tl-guide\" style=\"left:22.40%;height:94px\"><\/div><div class=\"tl-band\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-bar event\" style=\"left:19.60%;width:2.80%\"><\/div><div class=\"tl-label\" style=\"left:19.60%\">新手救援<span class=\"tl-range\">141～160 轉<\/span><\/div><\/div><\/div><\/div><div class=\"tl-row\"><div class=\"tl-lane\"><\/div><div class=\"tl-track\"><div class=\"tl-group\" style=\"--c:var(--s2)\"><div class=\"tl-guide\" style=\"left:32.80%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:36.70%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:40.30%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:43.90%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:47.50%;height:15px\"><\/div><div class=\"tl-band\" style=\"left:32.80%;width:15.15%\"><\/div><div class=\"tl-bar event\" style=\"left:32.80%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:36.70%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:40.30%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:43.90%;width:0.60%\"><\/div><div class=\"tl-bar event\" style=\"left:47.50%;width:0.60%\"><\/div><div class=\"tl-label\" style=\"left:32.80%\">主救援<span class=\"tl-range\">241～405 轉<\/span><\/div><\/div><div class=\"tl-group\" style=\"--c:var(--s3)\"><div class=\"tl-guide\" style=\"left:51.10%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:54.18%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:57.09%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:60.00%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:62.91%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:65.82%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:68.73%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:71.64%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:74.55%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:77.45%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:80.36%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:83.27%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:86.18%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:89.09%;height:15px\"><\/div><div class=\"tl-guide\" style=\"left:92.00%;height:15px\"><\/div><div class=\"tl-guide\
