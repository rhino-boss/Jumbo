ass=\"toc-3\" href=\"#遊戲基本玩法\" data-tab=\"doc\">遊戲基本玩法<\/a><a class=\"toc-3\" href=\"#參考連結-2\" data-tab=\"doc\">參考連結<\/a><a class=\"toc-3\" href=\"#待處理-2\" data-tab=\"doc\">待處理<\/a><a class=\"toc-2\" href=\"#3-le-fishman\" data-tab=\"doc\">3. (Le Fishman)<\/a><a class=\"toc-3\" href=\"#現況-3\" data-tab=\"doc\">現況<\/a><a class=\"toc-3\" href=\"#設計方向-3\" data-tab=\"doc\">設計方向<\/a><a class=\"toc-3\" href=\"#遊戲基本玩法依-demo-規則-v41\" data-tab=\"doc\">遊戲基本玩法（依 Demo 規則 v4.1）<\/a><a class=\"toc-3\" href=\"#參考連結-3\" data-tab=\"doc\">參考連結<\/a><a class=\"toc-3\" href=\"#待處理-3\" data-tab=\"doc\">待處理<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-doc\"><h1 id=\"交接bp-英雄客製化遊戲goldengearsle-fishman-現況\">交接：(BP 英雄客製化遊戲)／(GoldenGears)／(Le Fishman) 現況<\/h1>\n<p>&gt; 整理日期：2026-11-10 &gt; 資料來源：<a href=\"https://roadmap-7q6.pages.dev/\" class=\"nl nr\">Roadmap<\/a>、<a href=\"https://app.notion.com/p/285a24db19f180eab346f2a3f3dee4e7\" class=\"nl nr\">Notion 遊戲管理<\/a>，以及各遊戲的 Demo &gt; 三款都<strong class=\"nr\">還沒有規格書、開案會議記錄、game_rule<\/strong>，Notion 上執行者（數學／美術／SPS／前端／音樂音效）也都還沒指派。<\/p>\n<h2 id=\"總覽\">總覽<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th><\/th><th>(BP 英雄客製化遊戲)<\/th><th>(GoldenGears)<\/th><th>(Le Fishman)<\/th><\/tr><\/thead><tbody><tr><td>Game ID<\/td><td>101030<\/td><td>101031（另有 101018，見下方）<\/td><td>未給號<\/td><\/tr><tr><td>Roadmap 狀態<\/td><td>💭 發想中<\/td><td>💭 發想中<\/td><td>📦 暫存區（未定案）<\/td><\/tr><tr><td>預計 Demo<\/td><td>2026-09-08（已過）<\/td><td>2026-09-30（已過）<\/td><td>2026-10-20（已過）<\/td><\/tr><tr><td>預計上線（Notion）<\/td><td>2027-04-15<\/td><td>2027-05-27<\/td><td>未排<\/td><\/tr><tr><td>盤面<\/td><td>3×3 + 第 4 輪倍數輪<\/td><td>4×5<\/td><td>6×5<\/td><\/tr><tr><td>致敬<\/td><td>無<\/td><td>Relax Gaming-Money Train<\/td><td>無<\/td><\/tr><tr><td>Demo<\/td><td>✅ 有<\/td><td>❌ 無<\/td><td>✅ 有（外部網站）<\/td><\/tr><tr><td>提案簡報<\/td><td>❌ 無<\/td><td>❌ 無<\/td><td>❌ 無<\/td><\/tr><tr><td>送驗狀態<\/td><td>未開始<\/td><td>未開始<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<h2 id=\"1-bp-英雄客製化遊戲\">1. (BP 英雄客製化遊戲)<\/h2>\n<h3 id=\"現況\">現況<\/h3>\n<ul><li>Notion：101030，中辦、主流、OP Jackpot，2027-Q2，預計上線 <strong class=\"nr\">2027-04-15<\/strong><\/li><li>Roadmap：發想中，有 Demo v01，<strong class=\"nl nr\">沒有簡報<\/strong><\/li><li>名稱中的「BP」應是客戶客製（Bingo Plus？），<strong class=\"nl nr\">主題「英雄」在 Demo 裡還沒有出現<\/strong>，Demo 目前是寶石遺跡的佔位美術<\/li><\/ul>\n<h3 id=\"設計方向\">設計方向<\/h3>\n<ul><li>客戶客製遊戲，以「3×3 連線 + 第 4 輪倍數」為核心（類似 Line Game 乘倍數的結構）<\/li><li>用三色「超級寶石」做出三種不同的特色，再疊加 4 級 Jackpot<\/li><\/ul>\n<h3 id=\"遊戲基本玩法依-demo-v01\">遊戲基本玩法（依 Demo v01）<\/h3>\n<ul><li><strong class=\"nl nr\">主盤面<\/strong>：前 3 輪是 3×3，共 9 條線（3 橫線＋2 斜線＋V／倒 V＋上凸／下凹）<\/li><li><strong class=\"nl nr\">第 4 輪（倍數輪）<\/strong>：中線停到的倍數乘上連線分；倍數 1x～1000x，另有 <strong>RESPIN<\/strong> 符號<\/li><li><strong class=\"nl nr\">RESPIN 流程<\/strong>：第 4 輪停到 RESPIN 時，第 4 輪重轉 2～8 次並累積倍數，最後一次結算「連線分 × 累積倍數」<\/li><li><strong class=\"nl nr\">三色超級寶石<\/strong>（出現在前 3 輪，必須在連線上才會發動）：<ul><li>🔴 <strong class=\"nr\">紅寶石<\/strong>：RESPIN 中第 4 輪會出現 JP 寶石格，可收集 Jackpot（GRAND／MAJOR／MINOR／MINI，同一級收滿 3 顆即得獎）<\/li><li>🔵 <strong class=\"nr\">藍寶石<\/strong>：第 4 輪的指定框往上或往下放大，框內的倍數由下而上收集；框到 RESPIN 就進入重轉<\/li><li>🟢 <strong class=\"nr\">綠寶石<\/strong>：RESPIN 中停在非特色格時可以「救援」續命，每顆可救一次<\/li><\/ul><\/li><li>盤面上每種顏色的寶石最多 1 顆，三色可同時出現<\/li><\/ul>\n<h3 id=\"參考連結\">參考連結<\/h3>\n<ul><li>Demo：https://roadmap-7q6.pages.dev/demo.html?f=https%3A%2F%2Fvlpxryikzjiakzpnmwef.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Fdemos%2Fjiahao-slot-v01.html<\/li><li>Notion 頁面：https://app.notion.com/p/409a24db19f1802a804ed094b9326194<\/li><\/ul>\n<h3 id=\"待處理\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 確認客戶需求與「英雄」主題（目前 Demo 沒有主題美術）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 寫 game_rule／規格書，指派執行者<\/li><\/ul>\n<hr>\n<h2 id=\"2-goldengears\">2. (GoldenGears)<\/h2>\n<h3 id=\"現況-2\">現況<\/h3>\n<ul><li>Notion：<strong class=\"nl nr\">101031 (GoldenGears)<\/strong>，中辦、主流、OP Jackpot，2027-Q2，預計上線 <strong class=\"nr\">2027-05-27<\/strong><\/li><li>Notion 上另有 <strong class=\"nr\">101018 Golden Gears-金齒乾坤<\/strong>（外包、沒有上線日；商標檢索 2026-06-18，結果「菲律賓、全球皆無相同名稱」）<\/li><li>Roadmap：發想中，標註「外包遊戲」，<strong class=\"nl nr\">沒有 Demo、沒有簡報<\/strong><\/li><\/ul>\n<h3 id=\"設計方向-2\">設計方向<\/h3>\n<ul><li>外包製作，<strong class=\"nl nr\">致敬 Relax Gaming-Money Train<\/strong>（Roadmap 註記為「歐洲第一名遊戲」）<\/li><li>中文名「金齒乾坤」，主題是齒輪／機械黃金<\/li><\/ul>\n<h3 id=\"遊戲基本玩法\">遊戲基本玩法<\/h3>\n<ul><li>目前只有盤面 <strong class=\"nr\">4×5<\/strong>，其他規則都還沒有文件<\/li><li>一般來說 Money Train 系列的核心是「Bonus 收集型 Respin」（盤面停金錢符號＋特殊角色符號，重轉時鎖定並累積），<strong class=\"nl nr\">是否沿用要跟外包方確認<\/strong><\/li><\/ul>\n<h3 id=\"參考連結-2\">參考連結<\/h3>\n<ul><li>Notion 頁面（101031）：https://app.notion.com/p/409a24db19f18012a694ed46e435159f<\/li><li>Notion 頁面（101018）：https://app.notion.com/p/2aea24db19f180878a51f2c3afe4c70b<\/li><\/ul>\n<h3 id=\"待處理-2\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <strong class=\"nl nr\">確認 Game ID<\/strong>：101018 和 101031 是不是同一款，要留哪一個（<code class=\"nl\">game_list.md<\/code> 目前只有 101018）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 跟外包方要 Demo、規格書、時程<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><\/ul>\n<hr>\n<h2 id=\"3-le-fishman\">3. (Le Fishman)<\/h2>\n<h3 id=\"現況-3\">現況<\/h3>\n<ul><li>Roadmap：📦 暫存區（未定案），沒有上線日，<strong class=\"nl nr\">沒有簡報<\/strong><\/li><li>Notion：<strong class=\"nl nr\">沒有這款<\/strong>，也還沒給 Game ID<\/li><li>Demo 放在外部網站（chatgpt.site），<strong class=\"nl nr\">網址可能隨時失效<\/strong>，建議備份<\/li><li>⚠ Demo 標題是「<strong class=\"nl nr\">藏寶收藏家<\/strong>」（浣熊尋寶主題），跟 Roadmap 的名稱 Le Fishman、網址 tidal-catch 都對不上，要確認是不是同一款<\/li><\/ul>\n<h3 id=\"設計方向-3\">設計方向<\/h3>\n<ul><li>6×5 群組消除（Cluster）＋「底板／鑰匙開寶」的收集玩法<\/li><li>Demo 已附 PAR 表與權重（規則 v4.1、GDD v4.1），數值設計進度比其他兩款前面<\/li><\/ul>\n<h3 id=\"遊戲基本玩法依-demo-規則-v41\">遊戲基本玩法（依 Demo 規則 v4.1）<\/h3>\n<ul><li><strong class=\"nl nr\">得分<\/strong>：相鄰 5 個以上同符號形成得分組合，得分格會留下「底板」；得分符號消去後往下補位，繼續連消<\/li><li><strong class=\"nl nr\">鑰匙<\/strong>：連消結束後，鑰匙開啟底板；<strong class=\"nl\">全盤鑰匙<\/strong>開啟整個盤面。每場開始前決定鑰匙類型，一般鑰匙和全盤鑰匙不會同場出現（全盤機率 BG 1/21、FG 1/41）<\/li><li><strong class=\"nl nr\">底板開出的財寶<\/strong>：<ul><li>金幣：直接給分<\/li><li>錢袋：讓範圍內的財寶倍率增加（可疊加、沒有上限）<\/li><li>寶箱：收集周圍的金幣與普通寶箱；<strong class=\"nl\">金飾寶箱<\/strong>收集全盤<\/li><\/ul><\/li><li>沒被開啟的底板保留到下一場<\/li><li><strong class=\"nl nr\">免費遊戲<\/strong>：同盤 3／4／5 個以上 FS 給 10／15／20 場；FG 中同盤 2 個以上 FS 加 5 場<\/li><li><strong class=\"nl nr\">最大贏分<\/strong>：觸發局加整段 FG 合計最高為押注的 <strong class=\"nr\">15,000 倍<\/strong><\/li><\/ul>\n<h3 id=\"參考連結-3\">參考連結<\/h3>\n<ul><li>Demo：https://tidal-catch-demo.aaronbara.chatgpt.site<\/li><\/ul>\n<h3 id=\"待處理-3\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 確認遊戲名稱（Le Fishman／藏寶收藏家）與主題<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 決定是否定案；定案後到 Notion 建立項目並給 Game ID<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 把 Demo、PAR 表（par_sheet_v41.xlsx、treasure_config_v41.xlsx）備份到內部<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><\/ul><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['doc'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach(function(b) {\n    var on = b.dataset.tabs.split(',').indexOf(tabId) >= 0;\n    if (on) LAST[b.id] = tabId;\n    b.setAttribute('aria-selected', on ? 'true' : 'false');\n    b.tabIndex = on ? 0 : -1;\n    if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });\n  });\n  document.querySelectorAll('.panel').forEach(function(p) {\n    p.hidden = (p.id !== 'panel-' + tabId);\n  });\n  document.querySelectorAll('.toc').forEach(function(t) {\n    t.hidden = (t.id !== 'toc-' + tabId);\n  });\n  if (anchor) {\n    var el = document.getElementById(anchor);\n    if (el) el.scrollIntoView();\n  } else {\n    window.scrollTo(0, 0);\n  }\n  // 嵌入入口時通知入口：左側目錄跟著亮起\n  if (window.self !== window.top) window.parent.postMessage({specTab: tabId, specAnchor: anchor || ''}, '*');\n}\n// 入口左側目錄點選 → 切到對應頁籤／章節\nwindow.addEventListener('message', function(e) {\n  var d = e.data || {};\n  if (d.goTab && TAB_IDS.indexOf(d.goTab) >= 0) activate(d.goTab, d.goAnchor || null);\n});\n// 嵌入時捲動內文，回報目前讀到的章節\nwindow.addEventListener('scroll', function() {\n  if (window.self === window.top) return;\n  clearTimeout(window._spy);\n  window._spy = setTimeout(function() {\n    var p = document.querySelector('.panel:not([hidden])');\n    if (!p) return;\n    var cur = '';\n    p.querySelectorAll('h2[id], h3[id]').forEach(function(h) { if (h.getBoundingClientRect().top < 90) cur = h.id; });\n    window.parent.postMessage({specTab: p.id.slice(6), specAnchor: cur, spy: true}, '*');\n  }, 80);\n});\ndocument.querySelectorAll('.tab').forEach(function(b) {\n  b.addEventListener('click', function() { activate(LAST[b.id] || b.dataset.tab); });\n});\n(function() {\n  var bar = document.querySelector('.tabs');\n  bar.addEventListener('wheel', function(e) {\n    if (Math.abs(e.deltaY) > Math.abs(e.deltaX) && bar.scrollWidth > bar.clientWidth) {\n      bar.scrollLeft += e.deltaY;\n      e.preventDefault();\n    }\n  }, { passive: false });\n})();\n(function() {\n  var h = decodeURIComponent(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>
<script>
var SITES = {"ext": {"name": "交接：(BP 英雄客製化遊戲)／(GoldenGears)／(Le Fishman) 現況", "src": "", "meta": {"groups": [["交接：(BP 英雄客製化遊戲)／(GoldenGears)／(Le Fishman) 現況", ["doc"]]], "titles": {"doc": "交接：(BP 英雄客製化遊戲)／(GoldenGears)／(Le Fishman) 現況"}, "toc": {"doc": [[2, "總覽", "總覽"], [2, "1-bp-英雄客製化遊戲", "1. (BP 英雄客製化遊戲)"], [3, "現況", "現況"], [3, "設計方向", "設計方向"], [3, "遊戲基本玩法依-demo-v01", "遊戲基本玩法（依 Demo v01）"], [3, "參考連結", "參考連結"], [3, "待處理", "待處理"], [2, "2-goldengears", "2. (GoldenGears)"], [3, "現況-2", "現況"], [3, "設計方向-2", "設計方向"], [3, "遊戲基本玩法", "遊戲基本玩法"], [3, "參考連結-2", "參考連結"], [3, "待處理-2", "待處理"], [2, "3-le-fishman", "3. (Le Fishman)"], [3, "現況-3", "現況"], [3, "設計方向-3", "設計方向"], [3, "遊戲基本玩法依-demo-規則-v41", "遊戲基本玩法（依 Demo 規則 v4.1）"], [3, "參考連結-3", "參考連結"], [3, "待處理-3", "待處理"]]}}}};
var KEYS = ["ext"];
var SINGLE = true;
var frame = document.getElementById('site');
var cur = { key: null, tab: null, anchor: '' };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function setHash() {
  var h = '#' + (SINGLE ? '' : cur.key + (cur.tab ? '/' : '')) + (cur.tab || '') + (cur.anchor ? '/' + cur.anchor : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}
// 目錄最多兩層：大類下只有一份文件時列章節；多份文件時只列文件名（章節看內文）
// 文件名去掉「規範」、章節去掉編號，各站寫法一致
var DOC_NAME = { 'GameRule規範': 'Game Rule', 'Demo報告規範': 'Demo 報告' };
function docName(t) { return DOC_NAME[t] || t.replace(/規範$/, ''); }
function secName(t) { return t.replace(/^\d+(\.\d+)*\.?\s*/, ''); }
function secLink(t, s, on) {
  return '<a href="#" data-tab="' + t + '" data-anchor="' + s[1] + '"' + (on ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a>';
}
// 整站只有一份文件（開發流程）：每章當一個大類、小節列在下面，與其他站同一種結構
function renderFlat(m, t) {
  var out = '', list = (m.toc || {})[t] || [], open = false;
  // 目前讀到的小節所屬的章（第 2 層）
  var curChap = '', last2 = '';
  list.forEach(function (s) { if (s[0] === 2) last2 = s[1]; if (s[1] === cur.anchor) curChap = last2; });
  list.forEach(function (s) {
    if (s[0] === 2) {
      if (open) out += '</ul></li>';
      out += '<li>' + secLink(t, s, s[1] === curChap) + '<ul>';
      open = true;
    } else if (open) {
      out += '<li>' + secLink(t, s, s[1] === cur.anchor) + '</li>';
    }
  });
  if (open) out += '</ul></li>';
  return out.replace(/<ul><\/ul>/g, '');
}
function renderToc() {
  var m = SITES[cur.key].meta, out = '';
  var gs = m.groups || [];
  if (gs.length === 1 && gs[0][1].length === 1) {
    setToc(renderFlat(m, gs[0][1][0]));
    return;
  }
  gs.forEach(function (g) {
    var ids = g[1], active = ids.indexOf(cur.tab) >= 0;
    out += '<li><a href="#" data-tab="' + ids[0] + '"' + (active ? ' class="on"' : '') + '>' + esc(g[0]) + '</a>';
    {   // 全部展開，不折疊
      out += '<ul>';
      if (ids.length > 1) {
        ids.forEach(function (t) {
          out += '<li><a href="#" data-tab="' + t + '"' + (t === cur.tab ? ' class="on"' : '') + '>' + esc(docName(m.titles[t])) + '</a></li>';
        });
      } else {
        var lst = (m.toc || {})[ids[0]] || [], ch = '', l2 = '';
        lst.forEach(function (s) { if (s[0] === 2) l2 = s[1]; if (s[1] === cur.anchor) ch = l2; });
        lst.filter(function (s) { return s[0] === 2; }).forEach(function (s) {
          out += '<li><a href="#" data-tab="' + ids[0] + '" data-anchor="' + s[1] + '"' + (active && s[1] === ch ? ' class="on"' : '') + '>' + esc(secName(s[2])) + '</a></li>';
        });
      }
      out += '</ul>';
    }
    out += '</li>';
  });
  setToc(out);
}
// 沒有任何目錄項目時整個 Table of Contents 框拿掉
function setToc(h) {
  var u = document.getElementById('toc');
  u.innerHTML = h;
  u.closest('.toc').hidden = !u.querySelector('a');
}
function markNav() {
  document.querySelectorAll('.nav a').forEach(function (a) { a.classList.toggle('on', a.dataset.key === cur.key); });
}
function go(tab, anchor) {
  cur.tab = tab; cur.anchor = anchor || '';
  frame.contentWindow && frame.contentWindow.postMessage({ goTab: tab, goAnchor: anchor || '' }, '*');
  renderToc(); setHash();
}
function openSite(key, tab, anchor) {
  if (!SITES[key]) key = KEYS[0];
  var groups = SITES[key].meta.groups || [];
  cur = { key: key, tab: tab || (groups[0] ? groups[0][1][0] : null), anchor: anchor || '' };
  frame.onload = function () { if (cur.tab) frame.contentWindow.postMessage({ goTab: cur.tab, goAnchor: cur.anchor }, '*'); };
  var doc = document.getElementById('doc-' + key);
  if (doc) { frame.removeAttribute('src'); frame.srcdoc = JSON.parse(doc.textContent); }
  else { frame.removeAttribute('srcdoc'); frame.src = SITES[key].src; }
  markNav(); renderToc(); setHash();
}
document.querySelector('.nav') && document.querySelector('.nav').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-key]');
  if (!a) return;
  e.preventDefault();
  openSite(a.dataset.key);
});
document.getElementById('toc').addEventListener('click', function (e) {
  var a = e.target.closest('a[data-tab]');
  if (!a) return;
  e.preventDefault();
  go(a.dataset.tab, a.dataset.anchor || '');
});
// 內文切頁籤或捲動時，左側目錄跟著亮起
window.addEventListener('message', function (e) {
  var d = e.data || {};
  if (!d.specTab || e.source !== frame.contentWindow) return;
  if (d.spy && d.specTab !== cur.tab) return;
  cur.tab = d.specTab; cur.anchor = d.specAnchor || '';
  renderToc(); setHash();
});
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
