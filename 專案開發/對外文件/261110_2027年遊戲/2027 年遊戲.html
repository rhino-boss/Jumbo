<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 年遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--surface:#f6f5f1; --panel:#ffffff; --ink:#101418; --ink-2:#4a5462; --ink-3:#7d8794; --rule:#dcdad3;
  --accent:#1b3a6b; --brand:#1b3a6b;
  --font-sans:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --accent:#6f97d8}}
:root[data-theme="dark"]{--surface:#1b1b1a; --panel:#232322; --ink:#e9e8e4; --ink-2:#b9b7b0; --ink-3:#8d8b85; --rule:#3a3936; --accent:#6f97d8}
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{display:flex; flex-direction:column; background:var(--surface); color:var(--ink); font-family:var(--font-sans)}
/* 不顯示拉條，仍可上下捲動 */
aside, iframe{scrollbar-width:none; -ms-overflow-style:none}
aside::-webkit-scrollbar{display:none}
header{display:flex; align-items:center; gap:12px; padding:18px 28px 14px}
.logo{width:34px; height:34px; border-radius:8px; background:var(--brand); flex:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
  display:grid; place-items:center}
.logo span{color:#fff; font-weight:700; font-size:17px; font-family:var(--font-sans)}
h1{margin:0 0 0 6px; font-size:22px; font-weight:500; color:var(--ink-2); letter-spacing:-.01em}
h1 b{color:var(--ink); font-weight:600}
.layout{flex:1; min-height:0; display:flex; gap:26px; padding:0 28px 22px}
aside{width:236px; flex:none; overflow-y:auto; padding:6px 2px 20px 0}
.nav{list-style:none; margin:0 0 22px; padding:0}
.nav > li{margin:0 0 6px}
.nav .top{display:block; font-size:17px; font-weight:500; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav a.top:hover{color:var(--accent)}
.nav .sub{list-style:none; margin:4px 0 0; padding:0 0 0 18px}
.nav .sub a{display:block; font-size:14px; color:var(--ink-2); text-decoration:none; padding:3px 0}
.nav .sub a:hover{color:var(--accent)}
.nav a.on, .nav span.top.on{color:var(--accent); font-weight:600}
.nav a:focus, .toc a:focus{outline:none}
.nav a:focus-visible, .toc a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.toc{border:1px solid var(--rule); border-radius:4px; padding:12px 12px 14px; background:var(--panel)}
.toc[hidden]{display:none}
.toc-title{font-size:16px; font-weight:600; margin:0 0 8px}
.toc ul{margin:0; padding-left:18px; list-style:square; color:var(--ink-3)}
.toc li{margin:3px 0; font-size:13.5px; line-height:1.4}
.toc ul ul{padding-left:14px; margin:3px 0 6px; list-style:none}
.toc ul ul li{font-size:12.5px}
.toc a{color:var(--ink-3); text-decoration:none}
.toc a:hover{color:var(--accent)}
.toc a.on{color:var(--accent); font-weight:600}
.toc .doc{color:var(--ink-2)}
main{flex:1; min-width:0; display:flex}
iframe{flex:1; width:100%; height:100%; border:0; display:block; background:transparent}
@media (max-width:760px){
  header{padding:14px 16px 10px}
  .layout{flex-direction:column; padding:0 16px 16px; gap:14px}
  aside{width:auto; overflow:visible; padding:0}
  /* 手機：整頁一起捲動（內文框高度跟著內容），只有標題列＋頁簽列固定在上方 */
  html, body{height:auto}
  body{display:block}
  header{position:sticky; top:0; z-index:80; background:var(--surface)}
  body .topnav{position:sticky; top:var(--hh, 56px); z-index:79; background:var(--surface); margin:0; padding:0 16px; border-bottom:1px solid var(--rule)}
  .layout{display:flex; padding-top:12px}
  main{height:auto; flex:none}
  iframe{height:600px}
}
/* 頂部搜尋框 */
.pv-search{position:relative; margin-left:auto; align-self:center; flex:0 1 340px; min-width:160px; padding-bottom:2px}
.pv-search input{width:100%; box-sizing:border-box; padding:6px 12px 6px 32px; border-radius:4px; border:1px solid var(--rule);
  background:var(--panel); color:var(--ink); font:inherit; font-size:14px; outline:none}
.pv-search input:focus{border-color:var(--accent); box-shadow:none}
.pv-search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); pointer-events:none; font-size:14px}
.pv-search kbd{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink-3);
  border:1px solid var(--rule); border-radius:4px; padding:0 5px; background:var(--surface)}
.pv-res{position:absolute; top:calc(100% + 4px); right:0; width:min(560px,calc(100vw - 32px)); max-height:70vh; overflow:auto; z-index:70; display:none;
  background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3); padding:4px 0}
.pv-res.on{display:block}
.pv-item{display:block; padding:8px 14px; border-radius:0; cursor:pointer; color:var(--ink); text-decoration:none}
.pv-item:hover,.pv-item.sel{background:rgba(255,255,255,.05)}
.pv-path{font-size:11.5px; color:var(--ink-3)}
.pv-title{font-weight:600; font-size:14px; margin:1px 0}
.pv-snip{font-size:12.5px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pv-snip mark,.pv-title mark{background:color-mix(in srgb,var(--accent) 45%,transparent); color:inherit; border-radius:2px}
.pv-empty{padding:10px; color:var(--ink-3); font-size:13px}
header{display:flex; align-items:center; flex-wrap:wrap; gap:12px}
.topnav{display:flex; gap:2px; margin:0 28px 14px; border-bottom:1px solid var(--rule)}
.tn{position:relative}
.toc-secs{margin:2px 0 4px; padding-left:14px; list-style:none; border-left:1px solid var(--rule)}
.toc-secs a{font-size:12.5px}
.tn-btn{display:flex; align-items:center; gap:6px; font:inherit; font-size:14.5px; color:var(--ink-2); background:transparent;
  border:0; border-bottom:2px solid transparent; border-radius:0; padding:8px 14px 9px; margin-bottom:-1px; cursor:pointer}
.tn-btn:hover, .tn.open .tn-btn, .tn:hover .tn-btn{color:var(--ink)}
.tn.on .tn-btn{color:var(--ink); border-bottom-color:var(--accent); font-weight:600}
.tn-cur{display:none}
.tn-btn{white-space:nowrap; flex:none}
@media (max-width:700px){.tn-btn{padding:8px 10px 9px} .pv-search{display:none}}
.tn-arrow{font-size:10px; color:var(--ink-3)}
.tn-menu{position:absolute; top:calc(100% + 1px); left:0; min-width:180px; z-index:60; display:none; flex-direction:column;
  padding:4px 0; background:var(--panel); border:1px solid var(--rule); border-radius:4px; box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tn-menu::before{content:""; position:absolute; left:0; right:0; top:-6px; height:6px}
.tn:hover .tn-menu, .tn.open .tn-menu{display:flex}
.tn-menu a{display:block; padding:7px 16px; color:var(--ink-2); text-decoration:none; font-size:14px; white-space:nowrap}
.tn-menu a:hover{background:var(--panel-2, rgba(255,255,255,.04)); color:var(--ink)}
.tn-menu a.on{color:var(--accent); font-weight:600}
@media (min-width:900px){aside{position:sticky; top:12px; align-self:flex-start; max-height:calc(100vh - 24px)}}
</style>
</head>

ition:absolute; top:46px; height:18px; border-radius:3px; background:color-mix(in srgb,var(--c) 16%,transparent)}\n.tl-bar.event{background:var(--c); height:14px; top:48px; border-radius:2px}\n.tl-label{position:absolute; top:2px; font-size:.95em; font-weight:600; line-height:1.25; color:var(--c); white-space:nowrap}\n.tl-range{display:block; font-family:var(--font-mono); font-size:.85em; font-weight:500; color:var(--ink-2)}\n.tl-guide{position:absolute; top:64px; border-left:1px dashed var(--c); opacity:.7; pointer-events:none}\n.tl-axis{height:30px; border-bottom:none; border-top:1.5px solid var(--ink-3)}\n.tl-tick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--font-mono); font-size:1em;\n  color:var(--ink-3); padding-top:5px; white-space:nowrap}\n.tl-axis.dense{height:40px}\n.tl-axis.dense .tl-tick{font-size:.78em}\n.tl-axis.dense .tl-tick:nth-child(even){top:15px}\n.tl-axis.dense .tl-tick:nth-child(even)::before{height:20px; top:-16px}\n.tl-periods{height:30px; border-bottom:none}\n.tl-period{position:absolute; top:2px; height:24px; line-height:24px; text-align:center; font-weight:600; font-size:.95em; color:var(--c);\n  background:color-mix(in srgb,var(--c) 16%,transparent); border:1.5px solid var(--c); border-radius:3px; box-sizing:border-box}\n.tl-tick::before{content:\"\"; position:absolute; top:-1px; left:50%; height:5px; border-left:1.5px solid var(--ink-3)}\nmark{font-weight:600; padding:1px 6px; border-radius:3px}\nmark.hl-warn{color:var(--warn); background:color-mix(in srgb,var(--warn) 18%,transparent)}\nmark.hl-danger{color:var(--s4); background:color-mix(in srgb,var(--s4) 16%,transparent)}\n.flow{margin:6px 0 20px; max-width:86ch}\n.step{display:grid; grid-template-columns:30px 1fr; gap:0 14px}\n.step-rail{display:flex; flex-direction:column; align-items:center}\n.step-dot{width:28px; height:28px; border-radius:50%; border:1.5px solid var(--s1); color:var(--s1);\n  display:grid; place-items:center; font-family:var(--font-mono); font-size:12.5px; font-weight:600; background:var(--panel)}\n.step-line{flex:1; width:1.5px; background:var(--rule); min-height:12px}\n.step:last-child .step-line{background:transparent}\n.step-body{padding:3px 0 18px; min-width:0}\n.step-title{font-weight:600}\n.step-desc{color:var(--ink-2); font-size:1em; margin-top:2px}\n.subs{display:flex; flex-direction:column; align-items:flex-start; gap:2px; margin-top:8px}\n.sub-arrow{color:var(--ink-3); padding-left:14px; line-height:1.2}\n.sub-row.par{border:1px dashed var(--rule); border-radius:4px; padding:6px 8px 8px}\n.par-tag{font-size:.85em; color:var(--ink-3); margin-bottom:4px}\n.par-boxes{display:flex; gap:8px; flex-wrap:wrap}\n.sub{border:1px solid var(--rule); border-radius:4px; padding:4px 10px; background:var(--panel)}\n.sub-title{font-weight:600; font-size:.95em}\n.sub-desc{color:var(--ink-2); font-size:.88em}\n.branches{display:flex; flex-direction:column; gap:6px; margin-top:8px; padding-left:11px; border-left:2px solid var(--rule)}\n.branch{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:1em}\n.pill{font-size:1em; font-weight:600; padding:1px 8px; border-radius:3px; white-space:nowrap}\n.pill.ok{color:var(--s3); background:color-mix(in srgb,var(--s3) 15%,transparent)}\n.pill.stop{color:var(--s2); background:color-mix(in srgb,var(--s2) 15%,transparent)}\n@media (max-width:900px){\n  .body-row{flex-direction:column; gap:14px}\n  .toc{display:none!important}\n  .toc:not([hidden]):has(.toc-doc){display:flex!important; position:static; width:auto; max-height:none;\n    flex-wrap:wrap; gap:4px 16px; padding:0}\n  .toc a:not(.toc-doc){display:none}\n  .toc a.toc-doc{padding:0; margin:0!important}\n}\n/* 表格、程式碼、時間軸：藏拉條，仍可橫向捲動（觸控板／觸控／滑鼠拖曳） */\n.tbl-wrap, pre, .tl-wrap{scrollbar-width:none; -ms-overflow-style:none}\n.tbl-wrap::-webkit-scrollbar, pre::-webkit-scrollbar, .tl-wrap::-webkit-scrollbar{display:none}\n.drag-x{cursor:grab}\n.drag-x.dragging{cursor:grabbing; user-select:none}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n/* 嵌入入口時：頁首、頁籤、左側目錄由入口負責，這裡只留內文；藏拉條、仍可上下捲動 */\nhtml.embedded{scrollbar-width:none; -ms-overflow-style:none}\nhtml.embedded::-webkit-scrollbar{display:none}\nhtml.embedded body{background:transparent}\nhtml.embedded .wrap{max-width:none; padding:0}\nhtml.embedded header.page, html.embedded .tabs, html.embedded .toc,\nhtml.embedded .toc:not([hidden]):has(.toc-doc){display:none!important}\nhtml.embedded .body-row{display:block; padding:0}\nhtml.embedded main{background:transparent; border:0; padding:6px 0 60px}\n.sec-head{padding:0 2px 4px}\n.sec-head > *:last-child{margin-bottom:8px}\n.sec-card{background:var(--panel); border:1px solid var(--rule); border-radius:4px; padding:4px 32px 22px; margin:0 0 18px}\n.sec-card > h2:first-child{margin-top:20px}\nhtml.embedded .panel h1{color:var(--ink); font-weight:600; font-size:30px}\nhtml.embedded h2{color:var(--ink); border-bottom-color:var(--grid)}\nhtml.embedded main{max-width:1080px}\n.updated{margin:-6px 0 18px; font-size:12.5px; color:var(--ink-3)}\nhtml.embedded a{color:var(--accent); text-decoration:none}\nhtml.embedded a:hover{text-decoration:underline}\nhtml.embedded td code, html.embedded li code{background:transparent; border:0; padding:0; color:var(--ink)}\n:root{--accent:#1b3a6b}\n@media (prefers-color-scheme:dark){:root:where(:not([data-theme=\"light\"])){--accent:#6f97d8}}\n:root[data-theme=\"dark\"]{--accent:#6f97d8}\n@media (max-width:700px){html.embedded main{padding:6px 0 40px} .sec-card{padding:4px 16px 16px}}\n<\/style>\n<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');<\/script>\n<\/head>\n<body>\n<div class=\"wrap\">\n<header class=\"page\">\n  <div class=\"eyebrow\">iGaming · 對外文件<\/div>\n  <h1 class=\"site\">2027 年遊戲<\/h1>\n  <p class=\"meta\">由 <code>專案需知/C:/Users/rhinshen/Mine/個人工作區/工作區/專案開發/對外文件/261110_2027年遊戲/*.md<\/code> 產生（<code>_build_html.py<\/code>）　|　2026-11-11<\/p>\n<\/header>\n<div class=\"tabs\" role=\"tablist\" aria-label=\"規範文件\"><button class=\"tab\" role=\"tab\" id=\"tab-g0\" data-tab=\"doc\" data-tabs=\"doc\" aria-selected=\"true\" tabindex=\"0\">2027 年遊戲<\/button><\/div>\n<div class=\"body-row\">\n  <nav class=\"toc\" id=\"toc-doc\"><a class=\"toc-2\" href=\"#總覽\" data-tab=\"doc\">總覽<\/a><a class=\"toc-2\" href=\"#1-bp-英雄客製化遊戲\" data-tab=\"doc\">1. (BP 英雄客製化遊戲)<\/a><a class=\"toc-3\" href=\"#現況\" data-tab=\"doc\">現況<\/a><a class=\"toc-3\" href=\"#設計方向\" data-tab=\"doc\">設計方向<\/a><a class=\"toc-3\" href=\"#遊戲基本玩法依-demo-v01\" data-tab=\"doc\">遊戲基本玩法（依 Demo v01）<\/a><a class=\"toc-3\" href=\"#參考連結\" data-tab=\"doc\">參考連結<\/a><a class=\"toc-3\" href=\"#待處理\" data-tab=\"doc\">待處理<\/a><a class=\"toc-2\" href=\"#2-goldengears\" data-tab=\"doc\">2. (GoldenGears)<\/a><a class=\"toc-3\" href=\"#現況-2\" data-tab=\"doc\">現況<\/a><a class=\"toc-3\" href=\"#設計方向-2\" data-tab=\"doc\">設計方向<\/a><a class=\"toc-3\" href=\"#遊戲基本玩法\" data-tab=\"doc\">遊戲基本玩法<\/a><a class=\"toc-3\" href=\"#參考連結-2\" data-tab=\"doc\">參考連結<\/a><a class=\"toc-3\" href=\"#待處理-2\" data-tab=\"doc\">待處理<\/a><a class=\"toc-2\" href=\"#3-le-fishman\" data-tab=\"doc\">3. (Le Fishman)<\/a><a class=\"toc-3\" href=\"#現況-3\" data-tab=\"doc\">現況<\/a><a class=\"toc-3\" href=\"#設計方向-3\" data-tab=\"doc\">設計方向<\/a><a class=\"toc-3\" href=\"#遊戲基本玩法依-demo-規則-v41\" data-tab=\"doc\">遊戲基本玩法（依 Demo 規則 v4.1）<\/a><a class=\"toc-3\" href=\"#參考連結-3\" data-tab=\"doc\">參考連結<\/a><a class=\"toc-3\" href=\"#待處理-3\" data-tab=\"doc\">待處理<\/a><\/nav>\n  <main><section class=\"panel\" role=\"tabpanel\" id=\"panel-doc\"><div class=\"sec-head\"><h1 id=\"2027-年遊戲\">2027 年遊戲<\/h1><p class=\"updated\">最後更新：2026-11-10<\/p>\n<p>&gt; 整理日期：2026-11-10 &gt; 資料來源：<a href=\"https://roadmap-7q6.pages.dev/\" class=\"nl nr\">Roadmap<\/a>、Notion 遊戲管理，以及各遊戲的 Demo &gt; 三款都<strong class=\"nr\">還沒有規格書、開案會議記錄、game_rule<\/strong>，Notion 上執行者（數學／美術／SPS／前端／音樂音效）也都還沒指派。<\/p>\n<\/div><div class=\"sec-card\"><h2 id=\"總覽\">總覽<\/h2>\n<div class=\"tbl-wrap\"><table><thead><tr><th><\/th><th>(BP 英雄客製化遊戲)<\/th><th>(GoldenGears)<\/th><th>(Le Fishman)<\/th><\/tr><\/thead><tbody><tr><td>Game ID<\/td><td>101030<\/td><td>101031（另有 101018，見下方）<\/td><td>未給號<\/td><\/tr><tr><td>Roadmap 狀態<\/td><td>💭 發想中<\/td><td>💭 發想中<\/td><td>📦 暫存區（未定案）<\/td><\/tr><tr><td>預計 Demo<\/td><td>2026-09-08（已過）<\/td><td>2026-09-30（已過）<\/td><td>2026-10-20（已過）<\/td><\/tr><tr><td>預計上線（Notion）<\/td><td>2027-04-15<\/td><td>2027-05-27<\/td><td>未排<\/td><\/tr><tr><td>盤面<\/td><td>3×3 + 第 4 輪倍數輪<\/td><td>4×5<\/td><td>6×5<\/td><\/tr><tr><td>致敬<\/td><td>無<\/td><td>Relax Gaming-Money Train<\/td><td>無<\/td><\/tr><tr><td>Demo<\/td><td>✅ 有<\/td><td>❌ 無<\/td><td>✅ 有（外部網站）<\/td><\/tr><tr><td>提案簡報<\/td><td>❌ 無<\/td><td>❌ 無<\/td><td>❌ 無<\/td><\/tr><tr><td>送驗狀態<\/td><td>未開始<\/td><td>未開始<\/td><td>—<\/td><\/tr><\/tbody><\/table><\/div>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"1-bp-英雄客製化遊戲\">1. (BP 英雄客製化遊戲)<\/h2>\n<h3 id=\"現況\">現況<\/h3>\n<ul><li>Notion：101030，中辦、主流、OP Jackpot，2027-Q2，預計上線 <strong class=\"nr\">2027-04-15<\/strong><\/li><li>Roadmap：發想中，有 Demo v01，<strong class=\"nl nr\">沒有簡報<\/strong><\/li><li>名稱中的「BP」應是客戶客製（Bingo Plus？），<strong class=\"nl nr\">主題「英雄」在 Demo 裡還沒有出現<\/strong>，Demo 目前是寶石遺跡的佔位美術<\/li><\/ul>\n<h3 id=\"設計方向\">設計方向<\/h3>\n<ul><li>客戶客製遊戲，以「3×3 連線 + 第 4 輪倍數」為核心（類似 Line Game 乘倍數的結構）<\/li><li>用三色「超級寶石」做出三種不同的特色，再疊加 4 級 Jackpot<\/li><\/ul>\n<h3 id=\"遊戲基本玩法依-demo-v01\">遊戲基本玩法（依 Demo v01）<\/h3>\n<ul><li><strong class=\"nl nr\">主盤面<\/strong>：前 3 輪是 3×3，共 9 條線（3 橫線＋2 斜線＋V／倒 V＋上凸／下凹）<\/li><li><strong class=\"nl nr\">第 4 輪（倍數輪）<\/strong>：中線停到的倍數乘上連線分；倍數 1x～1000x，另有 <strong>RESPIN<\/strong> 符號<\/li><li><strong class=\"nl nr\">RESPIN 流程<\/strong>：第 4 輪停到 RESPIN 時，第 4 輪重轉 2～8 次並累積倍數，最後一次結算「連線分 × 累積倍數」<\/li><li><strong class=\"nl nr\">三色超級寶石<\/strong>（出現在前 3 輪，必須在連線上才會發動）：<ul><li>🔴 <strong class=\"nr\">紅寶石<\/strong>：RESPIN 中第 4 輪會出現 JP 寶石格，可收集 Jackpot（GRAND／MAJOR／MINOR／MINI，同一級收滿 3 顆即得獎）<\/li><li>🔵 <strong class=\"nr\">藍寶石<\/strong>：第 4 輪的指定框往上或往下放大，框內的倍數由下而上收集；框到 RESPIN 就進入重轉<\/li><li>🟢 <strong class=\"nr\">綠寶石<\/strong>：RESPIN 中停在非特色格時可以「救援」續命，每顆可救一次<\/li><\/ul><\/li><li>盤面上每種顏色的寶石最多 1 顆，三色可同時出現<\/li><\/ul>\n<h3 id=\"參考連結\">參考連結<\/h3>\n<ul><li><a href=\"https://roadmap-7q6.pages.dev/demo.html?f=https%3A%2F%2Fvlpxryikzjiakzpnmwef.supabase.co%2Fstorage%2Fv1%2Fobject%2Fpublic%2Fdemos%2Fjiahao-slot-v01.html\" class=\"nl nr\">Demo<\/a><\/li><\/ul>\n<h3 id=\"待處理\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 確認客戶需求與「英雄」主題（目前 Demo 沒有主題美術）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 寫 game_rule／規格書，指派執行者<\/li><\/ul>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"2-goldengears\">2. (GoldenGears)<\/h2>\n<h3 id=\"現況-2\">現況<\/h3>\n<ul><li>Notion：<strong class=\"nl nr\">101031 (GoldenGears)<\/strong>，中辦、主流、OP Jackpot，2027-Q2，預計上線 <strong class=\"nr\">2027-05-27<\/strong><\/li><li>Notion 上另有 <strong class=\"nr\">101018 Golden Gears-金齒乾坤<\/strong>（外包、沒有上線日；商標檢索 2026-06-18，結果「菲律賓、全球皆無相同名稱」）<\/li><li>Roadmap：發想中，標註「外包遊戲」，<strong class=\"nl nr\">沒有 Demo、沒有簡報<\/strong><\/li><\/ul>\n<h3 id=\"設計方向-2\">設計方向<\/h3>\n<ul><li>外包製作，<strong class=\"nl nr\">致敬 Relax Gaming-Money Train<\/strong>（Roadmap 註記為「歐洲第一名遊戲」）<\/li><li>中文名「金齒乾坤」，主題是齒輪／機械黃金<\/li><\/ul>\n<h3 id=\"遊戲基本玩法\">遊戲基本玩法<\/h3>\n<ul><li>目前只有盤面 <strong class=\"nr\">4×5<\/strong>，其他規則都還沒有文件<\/li><li>一般來說 Money Train 系列的核心是「Bonus 收集型 Respin」（盤面停金錢符號＋特殊角色符號，重轉時鎖定並累積），<strong class=\"nl nr\">是否沿用要跟外包方確認<\/strong><\/li><\/ul>\n<h3 id=\"參考連結-2\">參考連結<\/h3>\n<ul><li>尚無 Demo／簡報（致敬原作：Relax Gaming-Money Train）<\/li><\/ul>\n<h3 id=\"待處理-2\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> <strong class=\"nl nr\">確認 Game ID<\/strong>：101018 和 101031 是不是同一款，要留哪一個（<code class=\"nl\">game_list.md<\/code> 目前只有 101018）<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 跟外包方要 Demo、規格書、時程<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><\/ul>\n<hr>\n<\/div><div class=\"sec-card\"><h2 id=\"3-le-fishman\">3. (Le Fishman)<\/h2>\n<h3 id=\"現況-3\">現況<\/h3>\n<ul><li>Roadmap：📦 暫存區（未定案），沒有上線日，<strong class=\"nl nr\">沒有簡報<\/strong><\/li><li>Notion：<strong class=\"nl nr\">沒有這款<\/strong>，也還沒給 Game ID<\/li><li>Demo 放在外部網站（chatgpt.site），<strong class=\"nl nr\">網址可能隨時失效<\/strong>，建議備份<\/li><li>⚠ Demo 標題是「<strong class=\"nl nr\">藏寶收藏家<\/strong>」（浣熊尋寶主題），跟 Roadmap 的名稱 Le Fishman、網址 tidal-catch 都對不上，要確認是不是同一款<\/li><\/ul>\n<h3 id=\"設計方向-3\">設計方向<\/h3>\n<ul><li>6×5 群組消除（Cluster）＋「底板／鑰匙開寶」的收集玩法<\/li><li>Demo 已附 PAR 表與權重（規則 v4.1、GDD v4.1），數值設計進度比其他兩款前面<\/li><\/ul>\n<h3 id=\"遊戲基本玩法依-demo-規則-v41\">遊戲基本玩法（依 Demo 規則 v4.1）<\/h3>\n<ul><li><strong class=\"nl nr\">得分<\/strong>：相鄰 5 個以上同符號形成得分組合，得分格會留下「底板」；得分符號消去後往下補位，繼續連消<\/li><li><strong class=\"nl nr\">鑰匙<\/strong>：連消結束後，鑰匙開啟底板；<strong class=\"nl\">全盤鑰匙<\/strong>開啟整個盤面。每場開始前決定鑰匙類型，一般鑰匙和全盤鑰匙不會同場出現（全盤機率 BG 1/21、FG 1/41）<\/li><li><strong class=\"nl nr\">底板開出的財寶<\/strong>：<ul><li>金幣：直接給分<\/li><li>錢袋：讓範圍內的財寶倍率增加（可疊加、沒有上限）<\/li><li>寶箱：收集周圍的金幣與普通寶箱；<strong class=\"nl\">金飾寶箱<\/strong>收集全盤<\/li><\/ul><\/li><li>沒被開啟的底板保留到下一場<\/li><li><strong class=\"nl nr\">免費遊戲<\/strong>：同盤 3／4／5 個以上 FS 給 10／15／20 場；FG 中同盤 2 個以上 FS 加 5 場<\/li><li><strong class=\"nl nr\">最大贏分<\/strong>：觸發局加整段 FG 合計最高為押注的 <strong class=\"nr\">15,000 倍<\/strong><\/li><\/ul>\n<h3 id=\"參考連結-3\">參考連結<\/h3>\n<ul><li><a href=\"https://tidal-catch-demo.aaronbara.chatgpt.site\" class=\"nl nr\">Demo<\/a><\/li><\/ul>\n<h3 id=\"待處理-3\">待處理<\/h3>\n<ul><li class=\"check\"><span class=\"cb\">☐<\/span> 確認遊戲名稱（Le Fishman／藏寶收藏家）與主題<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 決定是否定案；定案後到 Notion 建立項目並給 Game ID<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 把 Demo、PAR 表（par_sheet_v41.xlsx、treasure_config_v41.xlsx）備份到內部<\/li><li class=\"check\"><span class=\"cb\">☐<\/span> 補提案簡報<\/li><\/ul><\/div><\/section><\/main>\n<\/div>\n<\/div>\n<script>\nvar TAB_IDS = ['doc'];\nvar LAST = {};\nfunction activate(tabId, anchor) {\n  document.querySelectorAll('.tab').forEach nt(location.hash.slice(1));\n  if (!h) return;\n  var tab = h.split('/')[0], anchor = h.split('/').slice(1).join('/');\n  if (TAB_IDS.indexOf(tab) >= 0) activate(tab, anchor || null);\n})();\n// 寬表格／程式碼／時間軸：滑鼠按住左右拖曳捲動（拉條已隱藏）\n(function() {\n  var drag = null, moved = false;\n  function mark() {\n    document.querySelectorAll('.tbl-wrap, pre, .tl-wrap').forEach(function(el) {\n      el.classList.toggle('drag-x', el.scrollWidth > el.clientWidth + 1);\n    });\n  }\n  document.addEventListener('mousedown', function(e) {\n    var el = e.button === 0 && e.target.closest('.drag-x');\n    if (!el || e.target.closest('a')) return;\n    drag = { el: el, x: e.clientX, left: el.scrollLeft };\n    moved = false;\n  });\n  document.addEventListener('mousemove', function(e) {\n    if (!drag) return;\n    var dx = e.clientX - drag.x;\n    if (!moved && Math.abs(dx) < 4) return;\n    moved = true;\n    drag.el.classList.add('dragging');\n    drag.el.scrollLeft = drag.left - dx;\n    e.preventDefault();\n  });\n  document.addEventListener('mouseup', function() {\n    if (drag) drag.el.classList.remove('dragging');\n    drag = null;\n  });\n  // 拖曳結束時不要觸發點擊\n  document.addEventListener('click', function(e) {\n    if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; }\n  }, true);\n  window.addEventListener('resize', mark);\n  document.addEventListener('click', function() { setTimeout(mark, 0); });\n  mark();\n})();\ndocument.addEventListener('click', function(e) {\n  var a = e.target.closest('a');\n  if (!a) return;\n  if (a.classList.contains('tab-link')) {\n    e.preventDefault();\n    activate(a.dataset.tab, a.dataset.anchor || null);\n  } else if (a.getAttribute('href') && a.getAttribute('href')[0] === '#') {\n    var id = a.getAttribute('href').slice(1);\n    var el = document.getElementById(id);\n    if (!el) return;\n    e.preventDefault();\n    var panel = el.closest('.panel');\n    activate(a.dataset.tab || (panel ? panel.id.slice(6) : null) || 'overview', id);\n  }\n});\n<\/script>\n<\/body>\n<\/html>\n"</script>

  hdr.appendChild(box);
  var input = box.querySelector('input'), res = box.querySelector('.pv-res'), hits = [], sel = 0;
  function e(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hl(s, q) { var i = s.toLowerCase().indexOf(q); return i < 0 ? e(s) : e(s.slice(0, i)) + '<mark>' + e(s.slice(i, i + q.length)) + '</mark>' + e(s.slice(i + q.length)); }
  function snip(t, q) { var i = t.toLowerCase().indexOf(q); if (i < 0) return ''; var a = Math.max(0, i - 30); return (a ? '…' : '') + t.slice(a, i + q.length + 60); }
  function search() {
    var q = input.value.trim().toLowerCase();
    if (!q) { res.classList.remove('on'); return; }
    hits = idx.map(function (r) {
      var t = r.title.toLowerCase().indexOf(q) >= 0, b = r.text.toLowerCase().indexOf(q) >= 0;
      return { r: r, s: t ? 2 : b ? 1 : 0 };
    }).filter(function (h) { return h.s; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 30);
    sel = 0;
    res.innerHTML = hits.length ? hits.map(function (h, i) {
      return '<a class="pv-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '"><div class="pv-path">' + e(h.r.path) + '</div><div class="pv-title">' + hl(h.r.title, q) + '</div>' +
        (h.s === 1 || snip(h.r.text, q) ? '<div class="pv-snip">' + hl(snip(h.r.text, q), q) + '</div>' : '') + '</a>';
    }).join('') : '<div class="pv-empty">找不到「' + e(input.value) + '」</div>';
    res.classList.add('on');
  }
  function pick(i) {
    var r = hits[i] && hits[i].r; if (!r) return;
    res.classList.remove('on'); input.blur();
    if (cur.key === r.key) go(r.tab, r.anchor); else openSite(r.key, r.tab, r.anchor);
  }
  input.addEventListener('input', search);
  input.addEventListener('focus', search);
  input.addEventListener('keydown', function (ev) {
    var items = res.querySelectorAll('.pv-item');
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      ev.preventDefault(); if (!items.length) return;
      items[sel].classList.remove('sel'); sel = (sel + (ev.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (ev.key === 'Enter') { ev.preventDefault(); pick(sel); }
    else if (ev.key === 'Escape') { res.classList.remove('on'); input.blur(); }
  });
  res.addEventListener('mousedown', function (ev) { var a = ev.target.closest('.pv-item'); if (a) { ev.preventDefault(); pick(+a.dataset.i); } });
  document.addEventListener('click', function (ev) { if (!box.contains(ev.target)) res.classList.remove('on'); });
  document.addEventListener('keydown', function (ev) { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); input.focus(); input.select(); } });
})();
// 手機版：內文框高度跟著內容，整頁一起捲動；標題列高度給頁簽列的固定位置用
(function () {
  var mq = window.matchMedia('(max-width:760px)'), ro = null;
  function hh() { var h = document.querySelector('header'); document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
  function fit() {
    if (!mq.matches) { frame.style.height = ''; return; }
    try { var d = frame.contentDocument; frame.style.height = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight) + 'px'; } catch (e) {}
  }
  frame.addEventListener('load', function () {
    fit();
    try { if (ro) ro.disconnect(); ro = new ResizeObserver(fit); ro.observe(frame.contentDocument.body); } catch (e) {}
  });
  window.addEventListener('message', function () { setTimeout(fit, 50); });
  window.addEventListener('resize', function () { hh(); fit(); });
  hh();
})();
(function () {
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  if (SINGLE) openSite(KEYS[0], p[0], p.slice(1).join('/'));
  else openSite(p[0], p[1], p.slice(2).join('/'));
})();
</script>
